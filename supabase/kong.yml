_format_version: "2.1"

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-routes
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-routes
        strip_path: true
        paths:
          - /rest/v1/

  - name: functions-v1
    url: http://supabase-functions:9000/
    routes:
      - name: functions-v1-routes
        strip_path: true
        paths:
          - /functions/v1/

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        # Swagger UI ("Try it out" issues browser requests from its own origin).
        - "http://localhost:8088"
        - "http://127.0.0.1:8088"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true
