_format_version: "2.1"

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-routes
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-routes
        strip_path: true
        paths:
          - /rest/v1/

  # WebSocket change feed. Two details that are easy to get wrong:
  #   * The upstream path is /socket/ (not /), so a subscriber connecting to
  #     /realtime/v1/websocket reaches /socket/websocket on Realtime.
  #   * The host is `realtime-dev.supabase-realtime`, not `supabase-realtime`.
  #     Realtime reads the tenant id from the leading hostname label, so addressing
  #     it by the plain service name makes every handshake fail with a bare 403.
  #     The alias is declared on the supabase-realtime service in docker-compose.yml.
  - name: realtime-v1
    url: http://realtime-dev.supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
        protocols:
          - http
          - https

  - name: functions-v1
    url: http://supabase-functions:9000/
    routes:
      - name: functions-v1-routes
        strip_path: true
        paths:
          - /functions/v1/

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        # Swagger UI ("Try it out" issues browser requests from its own origin).
        - "http://localhost:8088"
        - "http://127.0.0.1:8088"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true
