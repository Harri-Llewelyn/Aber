# =================================================================================================
# Prometheus scrape configuration -- the Compose target only.
#
# Not mirrored into the Helm chart: on Kubernetes the chart renders ServiceMonitors and defers to
# the cluster's Operator-managed Prometheus (deploy/k8s/README.md, divergence table).
#
#   ingestion       the only target on the critical data path; `acs_ingestion_messages_dropped_total`
#                   is telemetry that was not written.
#   node            host metrics; disk is the one that matters, since two Postgres data directories
#                   and a TSDB share it.
#   envoy           every REST, Auth, Storage, Realtime and edge-function request passes through the
#                   gateway, so one target covers the HTTP tier.
#   supabase-rest   PostgREST's own process metrics (schema cache, pool, JWT cache).
#   grafana         serves metrics natively on its normal port.
#   prometheus      itself.
#   loki, alloy     the log store and its collector, whose failure destroys the evidence for every
#                   other fault.
#
# Not scraped: mosquitto, which publishes to `$SYS` topics instead. No alerting block: Prometheus
# here is a store, and the rules live in grafana/provisioning/alerting/alert-rules.yaml.
# =================================================================================================

global:
  # 15s, matching the interval every dashboard and rule here assumes. `rate()` over a 5m window
  # needs several samples inside it to be meaningful, and a longer scrape interval quietly makes
  # short-window rates noisy rather than wrong -- which is harder to notice.
  scrape_interval: 15s
  scrape_timeout: 10s
  # Only relevant for recording rules, of which there are none; set so it is not left to a default
  # that differs between versions.
  evaluation_interval: 15s
  external_labels:
    stack: acs-cymru

scrape_configs:
  # -----------------------------------------------------------------------------------------------
  # The ingestion daemon. Static: there is exactly one, pinned to one replica, and Compose DNS
  # resolves it.
  # -----------------------------------------------------------------------------------------------
  - job_name: ingestion
    static_configs:
      - targets: ['ingestion:9108']
        labels:
          component: ingestion

  # -----------------------------------------------------------------------------------------------
  # Host metrics. On Docker Desktop this reports the Linux VM the engine runs inside, not the
  # developer's laptop.
  # -----------------------------------------------------------------------------------------------
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: host

  # -----------------------------------------------------------------------------------------------
  # The API gateway's admin listener. Envoy serves the scrape at `/stats/prometheus` on :9901,
  # which also answers the container's healthcheck. The series are `envoy_http_downstream_rq_xx`
  # and `envoy_http_downstream_rq_time_bucket`; verify against a live scrape before building a
  # panel on any of them.
  # -----------------------------------------------------------------------------------------------
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['supabase-envoy:9901']
        labels:
          component: supabase-envoy

  # -----------------------------------------------------------------------------------------------
  # PostgREST's admin server (v14.12; earlier versions served only /ready and /live). What it adds
  # over the gateway job is the process behind the HTTP tier: `pgrst_schema_cache_loads_total`,
  # `pgrst_db_pool_waiting`, `pgrst_db_pool_max` and the `pgrst_jwt_cache_*` counters. Names read
  # off a running v14.12.
  # -----------------------------------------------------------------------------------------------
  - job_name: supabase-rest
    static_configs:
      - targets: ['supabase-rest:3001']
        labels:
          component: supabase-rest

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels:
          component: grafana

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: prometheus

  # -----------------------------------------------------------------------------------------------
  # The log store and its collector. Unscraped, they are the one pair that can fail while producing
  # no evidence about themselves. `loki_write_dropped_entries_total` carries a `reason` label whose
  # values are the ceilings loki.yaml sets by name (`rate_limited`, `stream_limited`), so the alert
  # on those is a direct alert on a configured bound biting; `ingester_error` is the benign backfill
  # case. Neither exists on Kubernetes (divergence table), and the rules report OK on an absent
  # series.
  # -----------------------------------------------------------------------------------------------
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels:
          component: loki

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels:
          component: alloy
