<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- favicon.svg with a red dot, the tab's icon while an alert is firing (hooks/useAlertFavicon.js).
       The dot is the light theme's danger red (App.css) in a white ring, so it reads on a light or a
       dark tab strip. An XML comment may not contain two hyphens in a row. -->
  <style>.mark { fill: #0369a1; } @media (prefers-color-scheme: dark) { .mark { fill: #00d4ff; } }</style>
  <mask id="cut">
