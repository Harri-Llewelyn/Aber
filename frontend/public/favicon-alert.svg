      <path d="M37 33H62"/>
      <path d="M2 37.2C22 37.2 26 33 37 33"/>
      <path d="M3 42.6C23 42.6 26 33 37 33"/>
      <path d="M6 48C26 48 26 33 37 33"/>
    </g>
  </mask>
  <g class="mark" mask="url(#cut)">
    <path d="M4 32A28 28 0 0 1 60 32H55A23 23 0 0 0 9 32Z"/>
    <path d="M4 32A28 28 0 0 0 60 32Z"/>
  </g>
  <circle cx="48" cy="16" r="16" fill="#fff"/>
  <circle cx="48" cy="16" r="12" fill="#e11d48"/>
</svg>
