server {
    listen 3000;
    server_name localhost;

    # Deployment-supplied runtime configuration (see src/config.js).
    #
    # NEVER CACHED. The bundle around it is content-hashed and cached normally, but this file has a
    # fixed name and its whole purpose is to differ between deployments -- a cached copy would point
    # a redeployed dashboard at the previous environment's Supabase URL, which surfaces as an auth
    # failure rather than as a stale asset. `no-store` rather than `no-cache` so an intermediate
    # proxy does not keep a copy to revalidate either.
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # The platform's root certificate, for the one-liner's stage 0: a fresh appliance fetches it
    # over plain HTTP, checks it against the pin the dashboard minted, and installs it. The chart
    # mounts the ingress TLS Secret's ca.crt here (and nothing else from that Secret); without the
    # mount this is a 404, which is the right answer on a deployment with no TLS to pin.
    location = /.well-known/acs-cymru/ca.pem {
        root /usr/share/nginx/html;
        default_type application/x-pem-file;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
