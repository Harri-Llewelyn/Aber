server {
    listen 3000;
    server_name localhost;
    server_tokens off;

    # Every response carries these; `merge` keeps them on the locations that add their own headers
    # (nginx otherwise replaces the inherited set). Nothing embeds the dashboard, every window.open
    # is noopener, and it uses no camera, microphone or location.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Deployment-supplied runtime configuration (see src/config.js).
    #
    # NEVER CACHED. The bundle around it is content-hashed and cached normally, but this file has a
    # fixed name and its whole purpose is to differ between deployments -- a cached copy would point
    # a redeployed dashboard at the previous environment's Supabase URL, which surfaces as an auth
    # failure rather than as a stale asset. `no-store` rather than `no-cache` so an intermediate
    # proxy does not keep a copy to revalidate either.
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # The platform's root certificate, for the one-liner's stage 0: a fresh appliance fetches it
    # over plain HTTP, checks it against the pin the dashboard minted, and installs it. The chart
    # mounts the ingress TLS Secret's ca.crt here (and nothing else from that Secret); without the
    # mount this is a 404, which is the right answer on a deployment with no TLS to pin.
    location = /.well-known/aber/ca.pem {
        root /usr/share/nginx/html;
        default_type application/x-pem-file;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
