# Broker policy. Repository-managed and IDENTICAL ON BOTH TARGETS -- scripts/sync-helm-chart-files.mjs
# mirrors this file into the chart's files/ so the Kubernetes ConfigMap carries the same bytes.
#
# ASSEMBLED, NOT BIND-MOUNTED, ON EITHER TARGET. Both mount this file read-only into a /policy
# directory and COPY it to /mosquitto/config/mosquitto.conf, appending mosquitto-tls.conf when
# certificates exist -- the chart in an initContainer, Compose in the mosquitto-init service. It was
# a direct read-only bind mount on Compose until the MQTTS listener became a first-class part of that
# target: a read-only mount cannot be appended to, and the TLS stanza MUST be conditional (see the
# note at the foot of this file). mosquitto.acl is still bind-mounted directly on Compose, because
# nothing appends to it and it is the file that confines every principal.
#
# ---------------------------------------------------------------------------------------------------
# SECURITY OPTIONS ARE DECLARED ONCE, IN THE GLOBAL SECTION, AND MUST STAY THERE.
#
# Two reasons, and the first is a hard failure:
#
#  1. `password_file` DECLARED TWICE IS A FATAL CONFIG ERROR on mosquitto 2.0.x --
#     "Error: Duplicate password_file value in configuration", exit 3, before the broker opens a
#     single socket. It is NOT rejected by 2.1.x, which is what makes this so easy to reintroduce:
#     a per-listener copy looks tidy, works on whatever `:latest` happens to be, and takes the whole
#     stack down the moment the image is pinned back to the version both targets actually run.
#
#  2. Declaring them once is what GUARANTEES the TCP (1883), WebSocket (9001) and TLS (8883)
#     listeners are authorised identically. `per_listener_settings` is not enabled, so anything
#     above the first `listener` line is global by definition -- there is no ambiguity to resolve
#     and no listener that can quietly come up anonymous.
#
# Verified against eclipse-mosquitto 2.0.20: a client with no credentials is refused on 1883
# (CONNACK 5, "not authorised") AND on 9001 (ws, code 5) from this single declaration.
# ---------------------------------------------------------------------------------------------------

# Topic authorisation. Without this, every authenticated client could publish to every topic,
# which let any gateway forge another gateway's Sparkplug messages -- see mosquitto.acl for the
# full reasoning and for why the application tier enforces the same rule independently.
acl_file /mosquitto/config/mosquitto.acl

allow_anonymous false
password_file /mosquitto/config/password_file

listener 1883 0.0.0.0

listener 9001 0.0.0.0
protocol websockets

# The TLS listener on 8883 is NOT here, deliberately. It is appended from mosquitto-tls.conf when
# certificates are actually present -- see that file's header. Mosquitto exits 1 when `certfile`
# names a file that does not exist, reporting three lines of OpenSSL "system library" errors that
# name neither the file nor the option, so an unconditional TLS listener would crash-loop the broker
# on every stack whose certificates had not been issued yet, with a message pointing nowhere near
# the cause. THE CONDITION IS THE POINT, on both targets -- Compose now issues its own certificates
# (scripts/mosquitto-tls-init.mjs) and Kubernetes takes cert-manager's, but neither may assume they
# arrived.
#
# 1883 REMAINS OPEN ALONGSIDE 8883, and that is a decision rather than an omission. In-network
# clients -- ingestion, the i3X server, the Node-RED simulator and every virtual gateway -- reach the
# broker over the container network, where the credential never crosses a physical link. 8883 exists
# for the clients that are not on it: physical gateways, whose bundle and flow template are
# configured for MQTTS exclusively. Because the security options above are global, both listeners
# authenticate against the same password file and authorise against the same ACL.
