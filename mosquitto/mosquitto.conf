# Broker policy. Repository-managed: scripts/sync-helm-chart-files.mjs mirrors this file into the
# chart's files/ so the Kubernetes ConfigMap carries the same bytes.
#
# ASSEMBLED, NOT BIND-MOUNTED. The chart mounts this file read-only into a /policy directory and its
# initContainer COPIES it to /mosquitto/config/mosquitto.conf, appending mosquitto-tls.conf when
# certificates exist and rebinding 1883 to loopback once nothing outside the pod dials it. A
# read-only mount cannot be edited, and the TLS stanza MUST be conditional (see the note at the
# foot of this file).
#
# ---------------------------------------------------------------------------------------------------
# SECURITY OPTIONS ARE DECLARED ONCE, IN THE GLOBAL SECTION, AND MUST STAY THERE.
#
# `per_listener_settings` is not enabled, so anything above the first `listener` line is global by
# definition: the TCP (1883), WebSocket (9001) and TLS (8883) listeners authenticate and authorise
# identically, and no listener can quietly come up anonymous. A `plugin` line under a listener is a
# per-listener setting and is refused unless per_listener_settings is on.
#
# scripts/check-broker-config.mjs starts this config on the pinned image, connects with no
# credentials and requires a refusal, and asserts the policy below by delivery.
# ---------------------------------------------------------------------------------------------------

allow_anonymous false

# Authentication and authorisation are the Dynamic Security plugin's, managed over
# $CONTROL/dynamic-security/v1 and persisted by the plugin itself in the file below. The roles come
# from mosquitto/dynsec-roles.json at boot; the clients are the platform principals from the
# environment plus every gateway the credential service has issued. mosquitto/README.md is the
# policy; scripts/mosquitto-dynsec-init.mjs is what writes the file before the broker starts.
#
# THE FILE IS MUTABLE STATE and lives on the data volume: the plugin rewrites it on every
# change. It must be owned by the broker's uid at mode 0600; the plugin warns on anything wider.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 1883 0.0.0.0

listener 9001 0.0.0.0
protocol websockets

# The TLS listener on 8883 is NOT here, deliberately. It is appended from mosquitto-tls.conf when
# certificates are actually present -- see that file's header. Mosquitto exits 1 when `certfile`
# names a file that does not exist, reporting three lines of OpenSSL "system library" errors that
# name neither the file nor the option, so an unconditional TLS listener would crash-loop the broker
# on every stack whose certificates had not been issued yet, with a message pointing nowhere near
# the cause. THE CONDITION IS THE POINT: cert-manager issues the certificate, and the initContainer
# may not assume it has arrived.
#
# 1883 STAYS DECLARED ALONGSIDE 8883, and what changes is where it binds. While any client outside
# the broker's pod dials it -- the in-cluster clients until `mosquitto.tls.internalClients`, the
# fleet until `mosquitto.external.plaintext` is withdrawn -- it listens on every interface, and
# because the security options above are global it authenticates and authorises exactly as 8883
# does. Once neither does, the initContainer rewrites this line to `listener 1883 127.0.0.1`: the
# metrics exporter and the credential service share the pod's network namespace and keep using it,
# and nothing else can reach it. Remote gateways use 8883 exclusively throughout.
