_format_version: "2.1"

services:
  - name: auth
    url: http://gotrue:9999
    routes:
      - name: auth-v1
        paths:
          - /auth/v1
        strip_path: false

  - name: rest
    url: http://postgrest:3000
    routes:
      - name: rest-v1
        paths:
          - /rest/v1
        strip_path: true

  - name: pg-meta
    url: http://postgres-meta:8080
    routes:
      - name: pg-meta-v1
        paths:
          - /pg
        strip_path: true
