# Grafana datasources -- a template, rendered before Grafana reads it.
#
# One template serves both targets: on Compose the grafana entrypoint substitutes the
# `__UPPER_SNAKE__` placeholders with `sed`; on Kubernetes Helm renders them into a Secret
# mounted at /etc/grafana/provisioning/datasources/datasources.yml. The password is not
# committed; .env is the single source of truth.
#
# Grafana connects to the historian as `powerbi_reader`, created by timescaledb/roles.sql, which
# may SELECT the three rollup views and nothing else: a panel querying raw `telemetry` fails with
# a permission error. Widen the grant in roles.sql deliberately if a panel needs raw. An empty
# BI_READER_PASSWORD means the role was never created and Grafana fails to connect, which is the
# honest failure.
apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    # In-network service name and the STANDARD port, not the host-published 5433. Identical on
    # both targets -- which is the point of keeping Kubernetes Service names the same as the
    # Compose service names.
    url: timescaledb:5432
    user: grafana_reader
    database: postgres
    isDefault: true
    version: 2
    secureJsonData:
      password: __BI_READER_PASSWORD__
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true

  # ---------------------------------------------------------------------------------------------
  # The Supabase database: one view, `public.storage_footprint`, which can only live on this side
  # because postgres_fdw runs Supabase -> TimescaleDB and nothing runs back. Connects as
  # `grafana_reader`, which may SELECT that view and nothing else, with the grant re-revoked on
  # every boot. Same name and password as the historian's `grafana_reader` on purpose: it is the
  # same tool, and the two roles share nothing but the credential. An empty BI_READER_PASSWORD
  # skips the role and this datasource fails its health check.
  # ---------------------------------------------------------------------------------------------
  - name: Supabase
    uid: supabase
    type: postgres
    access: proxy
    # In-network service name and the STANDARD port, not the host-published 54322. Identical on
    # both targets, which is what lets this file be mirrored into a Helm ConfigMap verbatim -- the
    # renderer substitutes the password and nothing else, so it cannot use a chart helper here.
    url: supabase-db:5432
    user: grafana_reader
    database: postgres
    # NOT default. The historian above stays default so that an existing panel, and any dashboard
    # imported without an explicit datasource, keeps resolving to the telemetry it was written
    # against.
    isDefault: false
    version: 1
    secureJsonData:
      password: __BI_READER_PASSWORD__
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1700
      # Not a TimescaleDB connection, whatever the view reaches over the FDW: true would make the
      # query builder offer `time_bucket()` against a server without the extension.
      timescaledb: false

  # ===============================================================================================
  # Prometheus: no credential, and the URL is a placeholder because the two targets reach it by
  # different routes: Compose substitutes the service name; the chart substitutes its own store
  # or, with observability.enabled=false, `grafana.prometheusUrl`, and refuses to render with
  # neither. A datasource pointed at nothing reports every rule as DatasourceError.
  # ===============================================================================================
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: __PROMETHEUS_URL__
    # NOT default. The historian stays default so an existing panel, and any dashboard imported
    # without an explicit datasource, keeps resolving to the telemetry it was written against.
    isDefault: false
    version: 1
    jsonData:
      # Matches `global.scrape_interval` in prometheus/prometheus.yml. Grafana uses it to choose a
      # sensible minimum step, and a value larger than the real interval silently coarsens every
      # graph drawn against this datasource.
      timeInterval: 15s
      httpMethod: POST

  # ===============================================================================================
  # Loki: no credential (`auth_enabled: false` in loki/loki.yaml is a multi-tenancy switch, not a
  # password, so no `X-Scope-OrgID` header is needed) and a placeholder URL for the reason
  # Prometheus' is: the chart's own store, or `grafana.lokiUrl` when the cluster runs its own.
  #
  # Alloy (alloy/config.alloy on Compose, the chart's alloy DaemonSet on Kubernetes) labels streams
  # by `service` and `container` only; `reason`, `device` and
  # `edge_node` are fields inside the JSON line, so the drill-down from a drop counter is:
  #
  #     {service="ingestion"} | json | reason = "gateway_binding"
  #
  # test_structured_logging.py asserts the Prometheus label and the logged field carry the same
  # string.
  # ===============================================================================================
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: __LOKI_URL__
    # NOT default. The historian stays default so an existing panel, and any dashboard imported
    # without an explicit datasource, keeps resolving to the telemetry it was written against.
    isDefault: false
    version: 1
    jsonData:
      # A cap on returned lines per query, not a retention setting and not a bound on the time range.
      # The window is bounded by `limits_config.retention_period` in loki/loki.yaml.
      maxLines: 5000
