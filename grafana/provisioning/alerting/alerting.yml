apiVersion: 1

groups:
  - orgId: 1
    name: FactoryPlus_Telemetry_Alerts
    folder: FactoryPlus Alerts
    interval: 10s
    rules:
      - uid: temp_threshold_alarm
        title: High Temperature Warning Threshold (> 80°C)
        condition: B
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              rawSql: "SELECT time AS \"time\", val_double AS \"value\" FROM telemetry WHERE metric_name = 'Systems/TEMPERATURE' ORDER BY time DESC LIMIT 1"
              format: time_series
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80.0]

      - uid: safety_interlock_alarm
        title: Safety Interlock Breached Alarm
        condition: B
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange:
              from: 300
              to: 0
            model:
              # MTConnect EMERGENCY_STOP is a two-value string (ARMED / TRIGGERED), not a boolean,
              # so this reads val_string. Leaving the old `val_bool = false` test against the new
              # metric would have compared NULL, yielded 0, and silently never fired.
              rawSql: "SELECT time AS \"time\", CASE WHEN val_string = 'TRIGGERED' THEN 1 ELSE 0 END AS \"value\" FROM telemetry WHERE metric_name = 'Controller/EMERGENCY_STOP' ORDER BY time DESC LIMIT 1"
              format: time_series
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
