# Alert rules, file-provisioned -- THE PLATFORM'S OWN.
#
# The three MACHINE rules that used to open this file (Thermal Excursion, Emergency Stop Engaged,
# Low OEE Availability) were retired with the demonstrator they evaluated -- they compared machine
# telemetry against thresholds on devices no install has any more. What is left here evaluates the
# STACK, which exists whether or not anything is publishing.
#
# A RULE ABOUT YOUR OWN MACHINE goes here, in a group of its own. It needs a metric that exists in
# `metric_catalog`, and check-docs-drift re-arms its catalog agreement the moment one appears.
#
# ONE FOLDER, NOT TWO. These rules used to provision into `ACS-Cymru - Alerts`, and Grafana files
# alert rules in DASHBOARD folders -- so that folder appeared in the dashboard tree holding nine
# rules and zero dashboards, looking to every operator like a folder somebody forgot to fill in. It
# had never held a dashboard and never would. They now share the folder the platform dashboards use,
# which is the whole of the tree.
#
# ON AN EXISTING GRAFANA THE OLD FOLDER LINGERS. Provisioning is additive, as point 2 below says --
# it does not unload what it previously created -- so an existing demo stack keeps all three until they are named
# in a `deleteRules:` block. That is deliberate: silently stopping a working alert rule is worse
# than leaving it.
#
# =============================================================================================
# TWO OPERATIONAL FACTS ABOUT FILE-PROVISIONED RULES, BOTH EASY TO BE SURPRISED BY
#
#   1. THEY ARE READ-ONLY IN THE UI. Grafana shows them with a "Provisioned" badge and refuses
#      edits. That is the point -- the rule lives in the repository, reviewed, on both deployment
#      targets -- but it means "just tweak the threshold in Grafana" is not available. Edit this
#      file and restart.
#   2. DELETING A RULE FROM THIS FILE DOES NOT DELETE IT FROM GRAFANA. Provisioning is additive;
#      removal needs a `deleteRules:` block naming the uid, or the rule survives as an orphan that
#      no longer corresponds to anything in the repository. So the uids below are stable and
#      meaningful, and retiring one means adding it to a delete block rather than quietly dropping
#      the stanza.
#
# EVERY RULE IS MULTI-DIMENSIONAL -- one alert instance per device, from one rule, with the device
# in the labels. The alternative is a rule per device, which is what the withdrawn client-side
# evaluation effectively was: it only ever looked at devices publishing one literal metric name, so
# adding a machine silently added nothing. A rule that groups by asset_id covers whatever is on the
# floor, and `scripts/check-docs-drift.mjs` asserts every metric name named below exists in
# `metric_catalog` -- the check that would have caught `OEE/Availability` (wrong case, and a
# fraction where the metric is a percentage) before it evaluated an empty series forever.
#
# THE DATASOURCE IS `timescaledb`, connected as `grafana_reader`. That role may read the rollups,
# raw `telemetry`, `telemetry_latest` and `assets` -- which is exactly the set these queries touch.
# `asset_config` is NOT among them and could not be: it lives in Supabase, and postgres_fdw runs
# Supabase -> TimescaleDB, not the reverse. That is why the per-device thermal limit travels as a
# published METRIC rather than being joined from the metadata database; see rule 1.
# =============================================================================================
apiVersion: 1

groups:
  # ===============================================================================================
  # PLATFORM CONDITIONS -- the stack's own health, not the machines'.
  #
  # WHY THIS GROUP COULD NOT EXIST UNTIL NOW. Every signal below lives in Supabase, and this file's
  # header states the blocker plainly: postgres_fdw runs Supabase -> TimescaleDB and not the
  # reverse, so Grafana could only ever see the historian. archived migration 0027 gave it a second
  # datasource against the metadata database; these rules are what that was for.
  #
  # THEY READ ONE VIEW, `public.platform_health` (archived migration 0029), and the narrowness is deliberate.
  # `grafana_reader` may SELECT that view and `storage_footprint` and nothing else -- not `devices`,
  # not `gateways`. A rule needs a number and, where the condition is about an asset, that asset's
  # wire id; handing a browser-SSO-fronted service the plant's inventory to compute three counts is
  # the trade the narrow grant exists to refuse.
  #
  # A SEPARATE GROUP, NOT THREE MORE RULES IN "Shopfloor Conditions". The two differ in what a
  # reader should do about them: a thermal excursion is for whoever is on the floor, a stuck
  # enrolment is for whoever runs the stack. They also want different evaluation intervals -- the
  # machine group runs at 10s because someone is standing in front of a fault-injection button,
  # and nothing here changes that fast.
  #
  # `entity_type` IS THE LABEL THAT MAKES THESE LAND CORRECTLY. grafana-alert-webhook defaults it to
  # `device`, which is what keeps the three machine rules above working untouched; these declare
  # `gateway` or `platform` so the dashboard can tell an asset alert from a fleet one -- and so the
  # shopfloor map does not paint a machine red for a gateway fault.
  # ===============================================================================================
  - orgId: 1
    name: Platform Conditions
    folder: ACS-Cymru - Platform Infrastructure
    # ONE MINUTE, NOT TEN SECONDS. None of these conditions moves faster than that: the staleness
    # threshold behind `gateway_stale` is 90 seconds, an enrolment is measured in hours, and a
    # quarantine queue changes when a person approves something. Evaluating at the machine group's
    # 10s would be three more queries every ten seconds against the metadata database to re-read
    # numbers that cannot have changed.
    interval: 1m
    rules:
      # -----------------------------------------------------------------------------------------
      # 1. GATEWAY STALE -- an appliance that has stopped reporting.
      #
      # THE VIEW OWNS THE DEFINITION OF STALE, not this rule. `gateway_status.is_stale` applies the
      # 90-second threshold that check-mirror-drift.mjs holds in step with the frontend; the rule
      # only decides how long to tolerate it before telling anyone. Re-deriving the arithmetic here
      # would put the threshold in a third place.
      #
      # `for: 5m` ON TOP OF THAT 90 SECONDS. A gateway that misses a couple of heartbeats across a
      # broker reconnect is ordinary and self-heals; one that has been quiet for five minutes has
      # not. Automated edge gateway telemetry, which this stack does not collect, would make this sharper by having
      # the appliance report its own health,
      # at which point silence and unhealthy stop being the same signal.
      # -----------------------------------------------------------------------------------------
      - uid: acs-gateway-stale
        title: Gateway Stale
        condition: C
        for: 5m
        # NoData IS OK HERE, and that is a real decision rather than a default. The query returns NO
        # ROWS when every gateway is healthy -- there is nothing to report -- so treating an empty
        # frame as anything but OK would alarm permanently on a well-behaved stack.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has not sent a heartbeat for
            {{ printf "%.0f" $values.B.Value }}s. Check the appliance and its broker credential.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # `collected_at AS "time"` because Grafana's time_series format requires a time
              # column, and this view is a point-in-time answer rather than a series. The reduce
              # below takes the single value regardless.
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS quiet_seconds
                  FROM public.platform_health
                 WHERE condition = 'gateway_stale'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # ANY ROW AT ALL IS THE ALERT. The view only emits a gateway that is already stale, so
              # the threshold is a formality -- `> 0` on a quiet-seconds count that cannot be zero.
              # Expressed rather than omitted because a Grafana rule needs a condition node.
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 2. ENROLMENT STUCK -- a gateway that authenticated and then never published.
      #
      # THE FAILURE THIS EXISTS FOR IS SILENT TODAY. 0025 introduced AWAITING_BIRTH: a physical
      # gateway redeems its enrolment token, lands in that state, and leaves it on its first NBIRTH.
      # One that stays has a working broker credential and a flow that did not deploy -- and nothing
      # has ever alarmed on it, so the symptom is an appliance that quietly never arrives and is
      # noticed when somebody asks where it got to.
      #
      # `for: 0s` BECAUSE THE VIEW ALREADY CARRIES THE DELAY. The threshold below is one hour of
      # `enrolled_at` age, so a debounce on top would only postpone a condition that has already
      # been true for an hour.
      # -----------------------------------------------------------------------------------------
      - uid: acs-enrolment-stuck
        title: Enrolment Stuck
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has been AWAITING_BIRTH for
            {{ printf "%.0f" $values.B.Value }}s without publishing an NBIRTH. Its flow may not have
            deployed.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS stuck_seconds
                  FROM public.platform_health
                 WHERE condition = 'enrolment_stuck'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # One hour. An enrolment that completes normally does so in seconds; an hour is long
              # enough that nobody is still watching the appliance boot.
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 3. QUARANTINE QUEUE DEPTH -- devices waiting on a human decision.
      #
      # THE ONE RULE HERE WITH NO SUBJECT, and `entity_type: platform` is how it says so. A queue
      # depth is a property of the queue; naming one of its members would be arbitrary, and the
      # `platform_alerts` schema was generalised specifically so this could be recorded without
      # inventing an asset for it.
      #
      # THE VIEW EMITS THIS ROW AT ZERO AS WELL, which is why `noDataState` barely matters here --
      # a healthy stack returns a row saying 0 rather than returning nothing. That makes "the queue
      # is empty" and "the datasource is down" distinguishable, which they are not when a rule's
      # healthy state is an empty frame.
      #
      # FIVE IS A DEMONSTRATOR THRESHOLD. On a real floor it depends on how many devices are
      # commissioned at once and who is expected to approve them.
      # -----------------------------------------------------------------------------------------
      - uid: acs-quarantine-depth
        title: Quarantine Queue Depth
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} devices are quarantined and waiting for an approval
            decision on the Devices page.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS quarantined
                  FROM public.platform_health
                 WHERE condition = 'quarantine_depth'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 4. GATEWAY CA EXPIRING -- the failure mode that takes the whole fleet at once.
      #
      # THE ONE THAT JUSTIFIED APPLIANCE HEALTH TELEMETRY ON ITS OWN. The broker's internal CA is
      # copied BY HAND into every appliance's trust store, and re-minting it does not fail loudly:
      # it succeeds, and every gateway drops off together. There is no other signal. It presents as
      # the entire fleet going quiet, which is the same shape as a broker outage and gets diagnosed
      # as one -- see docs/incidents.md, where it already happened once.
      #
      # THE APPLIANCE REPORTS THE DATE IT ACTUALLY HOLDS, which is the only version of this question
      # worth asking. A check against the broker's own certificate would say what the SERVER will
      # present; this says what each CLIENT will accept, and the fleet-wide outage happens when
      # those two stop agreeing. `gateway_health.cert_expires_in_days` derives the day count once
      # (archived migration 0036) so this rule and the dashboard panel cannot disagree about it.
      #
      # `for: 0s`, FOR THE SAME REASON AS THE ENROLMENT RULE ABOVE: the threshold IS the delay.
      # A debounce on a condition that has thirty days left to run postpones nothing that matters.
      #
      # THE THRESHOLD IS IN THE RULE, NOT IN THE QUERY, WHICH IS THE OPPOSITE OF RULE 1. The stale
      # rule reads a view that emits only already-stale gateways, so its `> 0` is a formality. Here
      # the query returns EVERY gateway that has reported a certificate date, and Grafana's
      # threshold picks the ones inside the window -- so "thirty days" is visible in the rule an
      # operator opens rather than buried in SQL. It is also what makes the rule multi-dimensional
      # in the ordinary way: one instance per gateway, each carrying its own remaining days.
      #
      # A NEGATIVE VALUE FIRES THE SAME RULE, and the summary says so rather than reading as a very
      # small positive. An already-expired CA is not a different condition, it is this one found
      # late; splitting it into a second `critical` rule would mean two rules to keep in step for
      # one date.
      #
      # WHY THIS READS THE DATABASE AND NOT PROMETHEUS. The daemon exports appliance load, memory,
      # disk and uptime as gauges, and deliberately NOT the certificate date: that endpoint needs no
      # credential and is published to the host, so the day the fleet's trust anchor dies stays in
      # Supabase. See ingestion/metrics.py's header. The database is also the answer that survives a
      # daemon restart, which matters for a rule whose subject changes once a year.
      # -----------------------------------------------------------------------------------------
      - uid: acs-gateway-ca-expiring
        title: Gateway CA Expiring
        condition: C
        for: 0s
        # NoData IS OK. On a stack with no physical gateways -- the demonstrator, and every CI run --
        # no appliance reports a certificate date and the query returns nothing. That is a fleet
        # with no appliances, not a fleet in trouble.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            The broker CA trusted by {{ $labels.gateway }} expires in
            {{ printf "%.1f" $values.B.Value }} days (negative means it already has). The CA is
            distributed by hand into each appliance's trust store, so re-issuing it is a fleet
            operation -- see docs/incidents.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # `collected_at AS "time"` because Grafana's time_series format requires a time
              # column and this view is a point-in-time answer, exactly as in rule 1.
              #
              # `IS NOT NULL` IS LOAD BEARING. A virtual gateway, and any appliance on a bundle
              # predating archived migration 0035, reports no certificate date at all. Including those rows
              # would hand the reducer a NULL per gateway and turn "has not told us" into an alert
              # instance, which is the noise that teaches an operator to ignore the rule.
              rawSql: |
                SELECT collected_at          AS "time",
                       gateway_name          AS gateway,
                       sparkplug_id          AS sparkplug_id,
                       cert_expires_in_days  AS days_remaining
                  FROM public.gateway_health
                 WHERE cert_expires_in_days IS NOT NULL
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # THIRTY DAYS. Long enough to schedule a fleet-wide trust-store update through
              # whatever change process a plant has, which is the constraint that sets it -- the
              # work is a visit to every appliance, not a command.
              conditions:
                - evaluator:
                    type: lt
                    params: [30]
              datasource:
                type: __expr__
                uid: __expr__

  # ===============================================================================================
  # INGESTION PIPELINE -- whether telemetry is being recorded at all.
  #
  # THE THIRD GROUP, AND THE ONE CLOSEST TO THE DATA. "Shopfloor Conditions" reads the historian and
  # says what the machines are doing; "Platform Conditions" reads Supabase and says what the stack
  # believes about itself. Neither can see the pipe BETWEEN them -- a daemon that has stopped
  # writing looks exactly like a quiet shopfloor, because under report-by-exception absence of data
  # is ambiguous by construction.
  #
  # THESE READ PROMETHEUS, WHICH IS WHY THEY COULD NOT EXIST BEFORE. The daemon's counters have
  # always been there; issues #22 and #24 exposed them at :9108/metrics and a Prometheus was added
  # to the Compose stack to collect them. Until that existed there was nowhere for a Grafana rule to
  # read a COUNTER from -- every rule above reads state out of a database.
  #
  # A NOTE ON THE KUBERNETES TARGET. The chart ships ServiceMonitors and defers to the cluster's own
  # Operator-managed Prometheus, so the datasource these rules name resolves only where a Prometheus
  # datasource with uid `prometheus` exists. On a cluster without one they load and report
  # `DatasourceError`, which the policy tree routes like any other error rather than silently
  # dropping. That is the intended failure: a rule that cannot reach its data should say so.
  # ===============================================================================================
  - orgId: 1
    name: Ingestion Pipeline
    folder: ACS-Cymru - Platform Infrastructure
    # 1m. These are rates over 5-15 minute windows; evaluating faster re-reads a number that cannot
    # have moved, and the machine group's 10s exists only because someone is standing in front of a
    # fault-injection button.
    interval: 1m
    rules:
      # -------------------------------------------------------------------------------------------
      # 1. CONSUMING NOTHING -- a daemon that is running and has stopped recording.
      #
      # THE HIGHEST-VALUE RULE HERE, and the one the liveness heartbeat cannot express: the health
      # file is written while the MQTT connection is up, so a daemon connected to a broker that has
      # stopped delivering is healthy by that measure and silent by this one.
      #
      # `for: 10m` AGAINST A 5m RATE WINDOW. On a plant that is always publishing, ten minutes of
      # nothing is not a quiet period -- it is a fault. Long enough to ride out a broker restart and
      # the daemon's own reconnect, short enough that a shift does not pass unnoticed.
      #
      # -------------------------------------------------------------------------------------------
      # IT IS GATED ON THERE BEING SOMETHING TO CONSUME, WHICH IT WAS NOT.
      #
      # "No traffic" and "no traffic FROM A FLEET THAT SHOULD BE PUBLISHING" are different
      # conditions, and only the second is a fault. This rule tested the first, which was
      # indistinguishable on a stack that had a demonstration floor publishing from the moment it
      # booted. A fresh install has no devices at all now, so the daemon correctly consumes nothing,
      # correctly reports it, and the rule fired on every new stack -- an alert whose first
      # appearance is on an install nobody has configured yet teaches people to close the panel.
      #
      # SO THE SUBJECT IS `expected_publishers`, counted in Postgres: devices that are registered,
      # not archived, not quarantined, and bound to a gateway. Each clause is a reason a device
      # legitimately publishes nothing -- an archived device is retired, a quarantined one is held
      # BY DESIGN with its telemetry dropped, and one bound to no gateway has no edge node to
      # arrive through. Counting rows instead would make approving a quarantine look like a fix.
      #
      # ZERO DEVICES DISABLES THE RULE AND THAT IS THE INTENT, not a gap: with nothing provisioned
      # there is no claim to make about telemetry. The first device someone registers re-arms it.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-silent
        title: Ingestion Consuming Nothing
        condition: F
        for: 10m
        # NoData IS NOT OK HERE, unlike every platform rule above. An empty frame means the SCRAPE
        # failed -- the daemon is gone, or Prometheus cannot reach it -- and that is strictly worse
        # than the condition being alerted on, not better. Treating it as OK would make killing the
        # daemon the way to silence the alarm about the daemon.
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon has recorded no Sparkplug messages for 10 minutes while devices are
            registered and expected to publish. Telemetry is not reaching the historian. Check the
            broker connection and acs_ingestion_messages_dropped_total.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              # sum() ACROSS msg_type, because the series is labelled per message type and a daemon
              # receiving only NDATA is still consuming. instant:true so the reduce below has a
              # single value rather than a range to collapse.
              #
              # `or vector(0)` BECAUSE THE COUNTER DOES NOT EXIST UNTIL THE FIRST MESSAGE. It is
              # labelled per msg_type, so there is no series to pre-initialise at zero -- and until
              # one arrives Prometheus returns an EMPTY result, not a zero. Grafana reads that as
              # NoData and `noDataState: Alerting` below fires the rule, which is how a stack with
              # nothing publishing raised a critical alert about ingestion before it had ingested
              # anything. The gate in F never even ran: NoData short-circuits it.
              #
              # THIS DOES NOT WEAKEN THE DEAD-DAEMON CASE, which is what noDataState is really for.
              # A daemon that has gone away also yields vector(0) here -- and with devices
              # registered, `$E > 0` holds, so the rule still fires. What changes is only the case
              # where there is nothing to ingest and therefore nothing to be silent about.
              expr: sum(rate(acs_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: D
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              editorMode: code
              # THROUGH `platform_health`, NOT `public.devices`. `grafana_reader` holds SELECT on
              # this view and on nothing else -- 0029's self-check asserts it has no privilege on
              # the inventory, and querying devices here fails as `permission denied for table
              # devices` with the rule in `error` health, which reads as a broken datasource rather
              # than as a grant working. 0074 adds the row.
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS expected_publishers
                  FROM public.platform_health
                 WHERE condition = 'expected_publishers'
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              # BOTH HALVES, and the second is what makes the first mean something. `$B < 0.001` is
              # the absence of traffic -- the inversion that makes this rule different in kind from
              # every other one in this file -- and `$E > 0` is the assertion that somebody should
              # have been sending some.
              expression: ($B < 0.001) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 2. TELEMETRY BEING DROPPED.
      #
      # NOT "ABOVE A THRESHOLD" -- the correct number is zero. Every drop is a message the daemon
      # refused, and under report-by-exception nothing ever restates it. `for: 5m` is what absorbs a
      # restart or a momentary directory outage, rather than a threshold pretending some steady loss
      # is acceptable.
      #
      # Multi-dimensional on `reason`, so a quarantine backlog and a database outage are separate
      # instances of one rule with the reason in the labels.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-drops
        title: Telemetry Being Dropped
        condition: C
        for: 5m
        # OK, unlike the rule above. No dropped series exists until something is dropped -- the
        # counter is created on first use -- so an empty frame here genuinely means nothing has been
        # refused. The silent-daemon rule is what covers the scrape being broken.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Ingestion is dropping messages ({{ $labels.reason }}). This is telemetry that was NOT
            recorded and will not be restated. See ingestion/README.md for what each reason means.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (reason) (rate(acs_ingestion_messages_dropped_total[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3. BINDING REJECTIONS RISING -- the fourth platform alert, and NOT a health metric.
      #
      # This is the signal that something published telemetry for a device it does not own. The
      # daemon refuses it -- `verify_gateway_binding()` is the check -- so nothing is corrupted, and
      # that is exactly why it needs its own rule: the platform absorbs it silently and the only
      # trace is a counter.
      #
      # A misconfigured gateway republishing another's devices looks identical to an attempt to
      # forge telemetry, and both are worth a person's attention. Separated from the drop rule above
      # at a higher severity for that reason, even though it is the same counter with one label.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-binding-rejections
        title: Gateway Binding Rejections Rising
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Telemetry is being published for devices the sending gateway does not own, and refused.
            Either a gateway is misconfigured or something is publishing as an asset it is not.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(acs_ingestion_messages_dropped_total{reason="gateway_binding"}[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3b. BIRTH CERTIFICATES BEING DROPPED -- the same counter again, at critical, for the same
      # reason 3 is separated from 2: the drop rule above is true of this and does not say enough.
      #
      # A DROPPED DDATA COSTS ONE SAMPLE. A DROPPED DBIRTH COSTS A DEVICE. The birth certificate
      # carries the alias table, so every later alias-only message from that edge node is
      # undecodable until it births again -- and an NBIRTH resets the alias table for every device
      # behind the node, so losing one has that reach across all of them. Rule 2 fires at warning
      # for any drop reason; an operator triaging it cannot tell those apart, which is exactly the
      # blindness #126 was about one level down.
      #
      # BOTH REASONS, NOT JUST DBIRTH. `node_message_directory_unavailable` is an NBIRTH or NDEATH
      # dropped from an edge node, and the NBIRTH half is the more damaging of the two.
      # `sum by (reason)` so the notification names which, since the remedies differ.
      #
      # `for: 5m` rather than 15: the trigger is a directory that is briefly unreachable -- a
      # PostgREST restart, a Kong reload, a failover -- and those resolve in minutes. Fifteen would
      # miss the event that caused it. The daemon does NOT retry these: the drop is deliberate and
      # fail-closed (see process_dbirth), so recovery waits on the next rebirth timer, and knowing
      # promptly is what lets an operator request one instead.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-birth-drops
        title: Ingestion Dropping Birth Certificates
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Birth certificates are being dropped ({{ $labels.reason }}) because the device
            directory is unreachable. Affected devices cannot be decoded until they birth again --
            check PostgREST and the gateway, then request a rebirth rather than waiting on the
            timer.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (reason) (rate(acs_ingestion_messages_dropped_total{reason=~"dbirth_directory_unavailable|node_message_directory_unavailable"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3c. THE AUDIT TABLE'S PARTITIONS FALLING BEHIND -- a maintenance failure, caught before it
      # becomes a data one.
      #
      # 0079 range-partitions `digital_thread` by month so retention is DETACH rather than DELETE,
      # and a pg_cron job keeps three months of partitions ahead of the writes. A cron job that
      # stops is SILENT -- 0025's own header says so, and there is no log line and nothing in the UI.
      #
      # THE DEFAULT PARTITION IS WHY THIS IS A WARNING AND NOT A CRITICAL. Without one, a month with
      # no partition would refuse every audit INSERT, and because the audit write is a trigger on
      # cells/gateways/devices that refusal FAILS THE ASSET WRITE -- nobody could create a device or
      # approve a quarantine. 0079 keeps a default partition precisely so that outage cannot happen,
      # which turns "the job died" from a stopped line into an untidiness. This rule is what makes
      # the untidiness visible, and it is the only thing that does.
      #
      # `default_rows > 0` IS THE CONDITION, not "is the next partition missing". A missing partition
      # is harmless while the default absorbs it; what is not harmless is a row sitting in the
      # default, because retention works by detaching a month and a row filed outside its month is
      # never detached with it. So this fires on the consequence rather than on the cause, and stays
      # quiet for a stack that is merely close to the edge.
      #
      # `for: 30m` because the repair is automatic and daily: the job runs at 03:20, and a single
      # evaluation catching the minutes between a partition boundary and the next run would be noise.
      # A row still in the default half an hour later is a job that did not run.
      # -------------------------------------------------------------------------------------------
      - uid: acs-digital-thread-partitions
        title: Digital Thread Partitions Falling Behind
        condition: C
        for: 30m
        # OK rather than NoData: the view always returns exactly one row, so an empty frame here
        # means the datasource is broken, which the Grafana datasource health check owns.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} audit row(s) have landed in the digital_thread
            DEFAULT partition, so the monthly partition job has stopped. Nothing is lost and
            nothing is refused, but retention by DETACH will skip these rows. Run
            SELECT public.ensure_digital_thread_partitions(3); and check cron.job_run_details.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT now()        AS "time",
                       default_rows AS default_partition_rows
                  FROM public.digital_thread_partition_health
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 4. HISTORIAN UNREACHABLE, WITH TELEMETRY ARRIVING.
      #
      # BOTH HALVES, AND THE SECOND IS WHAT MAKES THE SUMMARY TRUE. This rule used to read the gauge
      # alone and assert "telemetry is being dropped" from it -- a claim it had never checked. On an
      # idle stack that was simply false: nothing was publishing, so nothing was being dropped, and
      # the alert fired for hours against a historian that was reachable throughout. An alert that
      # is wrong whenever the plant is quiet is one an operator learns to close unread, which costs
      # the times it is right.
      #
      # `$B < 1` is the daemon holding no connection. `$E > 0` is somebody actually publishing --
      # `or vector(0)` for the same reason rule 1 needs it, since the counter does not exist until
      # the first message and Grafana reads an empty frame as NoData rather than as zero.
      #
      # THE IDLE CASE IS NOT DISCARDED, IT IS DEMOTED -- see 4b, which catches a historian this
      # daemon cannot reach on a stack with no traffic. That is worth knowing about and is not data
      # loss, and the two deserve different severities and different words.
      #
      # `for: 2m` stays short because the daemon retries internally -- three attempts inside a
      # second on the message path, and a resident recovery loop besides -- so two minutes of this
      # means the retries are not winning.
      #
      # `db_connected` is psycopg2's own view and cannot see a connection dropped by the SERVER,
      # which still reports open and fails on first use. `acs_ingestion_db_connect_failures_total`
      # rising while this reads 1 is the shape of that; the drop rule above catches the consequence.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-db-down
        title: Historian Unreachable From Ingestion
        condition: F
        for: 2m
        # OK, NOT Alerting. NoData here means the ingestion scrape has gone away, which is the
        # silent-daemon rule's job -- and firing a data-loss alert on a missing scrape is how this
        # rule produced its loudest false positives.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB while telemetry is arriving. Readings are
            being dropped for as long as this lasts and will not be restated.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: acs_ingestion_db_connected
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: D
              datasource:
                type: prometheus
                uid: prometheus
              # sum() ACROSS msg_type, as rule 1 does: a daemon receiving only NDATA is still being
              # published to, and this half of the condition asks only whether anything is.
              expr: sum(rate(acs_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              expression: ($B < 1) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 4b. HISTORIAN UNREACHABLE, AND NOTHING PUBLISHING.
      #
      # THE OTHER HALF OF 4, AND DELIBERATELY NOT CRITICAL. A daemon that cannot reach the historian
      # on a quiet stack is losing nothing -- there is nothing to lose -- but it is not healthy
      # either, and the moment a gateway starts publishing it becomes rule 4. Saying so at warning,
      # in words that do not claim data loss, is the difference between a useful early signal and
      # the false alarm this pair replaced.
      #
      # READ FROM THE RECOVERY LOOP'S OWN COUNTER RATHER THAN FROM THE GAUGE, which is the whole
      # point. `acs_ingestion_db_heal_failures_total` rises ONLY when the daemon tried to reach the
      # historian off the message path and could not. It cannot be produced by a stack that has
      # simply not written anything yet -- the state that made the old rule lie. A gauge at 0 with
      # this counter flat means the daemon has not looked lately; a gauge at 0 with this rising
      # means it looked and the historian was not there.
      #
      # `for: 10m` against a loop that runs every 30s: twenty consecutive failures, not a restart.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-db-unreachable-idle
        title: Historian Unreachable From Ingestion (No Traffic)
        condition: C
        for: 10m
        # OK: the counter does not exist until the recovery loop first fails, so an empty frame
        # means it never has.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB. Nothing is being dropped, because nothing
            is publishing -- but any telemetry arriving while this lasts will be.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(acs_ingestion_db_heal_failures_total[10m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 5. MESSAGE LOSS -- a Sparkplug sequence gap (issue #24).
      #
      # UNDER REPORT-BY-EXCEPTION THIS IS THE ONLY LOSS SIGNAL THERE IS. A metric that stopped
      # arriving is indistinguishable from a metric that stopped changing -- that ambiguity is
      # inherent -- but `seq` skipping is unambiguous evidence that a change was published and never
      # recorded. The historian is then confidently wrong about that device until a rebirth.
      #
      # PER EDGE NODE, which is what makes the alert actionable: one flapping gateway is a different
      # problem from plant-wide loss, and the label says which.
      #
      # A NOTE ON RESTARTS. Messages published while the daemon is down are not replayed, so a
      # deploy produces a real gap at every active node. `for: 15m` rides that out; a sustained rate
      # is live loss and is what this exists to catch.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-sequence-gaps
        title: Sparkplug Message Loss
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            Edge node {{ $labels.edge_node }} is losing messages between the broker and the
            historian. Any metric carried by them is stale here until the node re-births.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(acs_ingestion_sequence_gaps_total[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

