; Grafana configuration for Aber: single sign-on against Supabase Auth, and the outbound
; connections Grafana makes by default, switched off.
;
; Values that differ between deployments are set through GF_* environment variables in the chart.

[server]
root_url = http://localhost:3002/

[auth]
; The local admin login is the break-glass path: if Supabase Auth, the gateway or the edge
; runtime is down, SSO is down with them, and Grafana is where you look at why.
disable_login_form = false

; Signing out of Grafana does not end the Supabase session, so the next sign-in completes
; without a prompt. `signout_redirect_url` cannot fix it (GoTrue's logout is POST-only with a
; bearer token) and `login_prompt` cannot either (GoTrue ignores the OAuth `prompt` parameter).
; To end both sessions, sign out of the Aber dashboard.
; signout_redirect_url =

[auth.generic_oauth]
enabled = true
name = Aber SSO
allow_sign_up = true
client_id = c0ffee00-0000-4000-8000-000000000001
client_secret = $__env{GRAFANA_OAUTH_CLIENT_SECRET}
; No `openid` scope: it makes GoTrue mint an ID token, which it refuses to sign with HS256
; ("HS256 is not supported for ID token signing"). Identity comes from api_url instead, so this
; is a plain OAuth2 authorization-code flow with PKCE rather than OIDC.
scopes = email profile

; auth_url is followed by the BROWSER (host-facing gateway address). token_url and api_url are
; called by the Grafana CONTAINER (the in-cluster address).
auth_url = http://127.0.0.1:54321/auth/v1/oauth/authorize
token_url = http://supabase-envoy:8000/auth/v1/oauth/token
api_url = http://supabase-envoy:8000/functions/v1/grafana-userinfo

; GoTrue's OAuth server requires PKCE; without this every login fails at /oauth/authorize.
use_pkce = true

; The client is registered `client_secret_basic` in auth.oauth_clients and GoTrue enforces
; that exactly; Grafana's default (POST body) fails with "invalid_credentials".
auth_style = InHeader

; Discovery is not used: GoTrue's /.well-known/openid-configuration reports an empty issuer and
; relative endpoint paths.

; `role` is supplied by the grafana-userinfo edge function from public.user_roles
; (Administrator -> Admin, Shopfloor_Manager -> Editor, Operator/Auditor -> Viewer). GoTrue's
; token carries no app_metadata for Grafana to read.
role_attribute_path = role

; Fail closed: a user whose role does not map is refused, not admitted as a Viewer.
role_attribute_strict = true

; Server-wide admin is never granted over SSO. It would allow plugin installation (arbitrary
; code in a container holding BI_READER_PASSWORD, GRAFANA_ALERT_WEBHOOK_SECRET and the OAuth
; secret) and user administration across every org. Declare plugins in GF_INSTALL_PLUGINS.
allow_assign_grafana_admin = false

; Re-sync the org role on every login, so a promotion or demotion in public.user_roles reaches
; Grafana rather than the first-assigned role persisting forever.
skip_org_role_sync = false

; Off: auto-login would bounce every visit into a dead provider when SSO is down, defeating the
; break-glass form above. (`auto_login` under the provider; `oauth_auto_login` is deprecated.)
auto_login = false

[users]
auto_assign_org = true
auto_assign_org_role = Viewer

; Nothing in this stack phones home (deploy/k8s/README.md, "Outbound connections"). Grafana's
; defaults report usage to Grafana Labs and poll grafana.com for Grafana and plugin updates.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

; The news drawer fetches grafana.com's blog feed, and its images, from the browser.
[news]
news_feed_enabled = false

; Avatars are fetched from gravatar.com by the server, keyed by a hash of each user's email.
[security]
disable_gravatar = true

; Preinstalled plugins (Logs Drilldown among them) are installed once when missing and never
; checked for updates. The Prometheus, Loki and PostgreSQL datasources are bundled in the image,
; so a site with no route to grafana.com still has them. Plugin signatures are verified with the
; key embedded in Grafana rather than one fetched from grafana.com.
[plugins]
preinstall_auto_update = false
public_key_retrieval_disabled = true
