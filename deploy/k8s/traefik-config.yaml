# Traefik as k3s installs it, with the one change this stack needs: the Service keeps each
# client's address. With k3s's default, externalTrafficPolicy Cluster, every request reaches Traefik
# from the node's own pod-network address, so X-Forwarded-For names one client for the whole site
# and GoTrue's per-client rate limits become one limit shared by everyone.
#
#   kubectl apply -f deploy/k8s/traefik-config.yaml
#
# once per cluster, before installing the chart; k3s's helm controller redeploys Traefik with it.
# deploy/k8s/README.md, "Install", says what it changes on a cluster with more than one node.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
