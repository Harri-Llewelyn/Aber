{{- if and .Values.supabaseDb.enabled .Values.timescaledb.enabled }}
{{- $component := "test-fdw" -}}
{{/*
=================================================================================================
M6 -- the postgres_fdw cross-database check, and the CHEAP GATE in front of every E2E suite.

WHAT IT PROVES. `public.telemetry` in Supabase is not a table: it is a read-only projection of the
TimescaleDB hypertable reached over postgres_fdw (a foreign server, a user mapping, and a foreign
table, all created by 0001_baseline_schema.sql from the psql variables db-init passes it). Four
separate things have to be right for a single row to come back, and a mistake in any of them --
most likely the port, M2's whole subject -- surfaces as a RELATION-LEVEL ERROR FROM PostgREST.

That reads as a schema fault. So `validate.py` would fail deep in its telemetry checks with an
error pointing at the wrong layer entirely, and the operator would go looking at migrations.
This runs first, takes about a second, and says exactly what is wrong.

WHY `SELECT 1` WOULD PROVE NOTHING. It never crosses the wrapper. The query MUST touch the foreign
table, which is what exercises the server definition, the user mapping and reachability together.
A bounded time window keeps it from materialising the whole range: postgres_fdw pushes WHERE
clauses to the remote but NOT LIMIT.

RUN IT WITH:  helm test factoryplus -n <namespace>
=================================================================================================
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-fdw" (include "factoryplus.fullname" .) }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Weight 0: first of the test hooks, so the connectivity proof precedes anything built on it.
    "helm.sh/hook-weight": "0"
    # Deleted before a re-run, kept afterwards so `kubectl logs` still answers what it said. NOT
    # hook-succeeded: a passing test whose output is gone is not much use when the next one fails.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test-fdw
      image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
      imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
      env:
        {{- include "factoryplus.secretEnv" (dict "name" "PGPASSWORD" "secretName" (include "factoryplus.secretName" .) "key" "POSTGRES_PASSWORD") | nindent 8 }}
        {{- include "factoryplus.secretEnv" (dict "name" "TSPASSWORD" "secretName" (include "factoryplus.secretName" .) "key" "DB_PASSWORD") | nindent 8 }}
      command:
        - /bin/sh
        - -e
        - -c
        - |
          SB="psql -v ON_ERROR_STOP=1 -h {{ include "factoryplus.supabaseDb.host" . }} -p {{ include "factoryplus.supabaseDb.port" . }} -U postgres -d postgres -tAc"

          echo '--- 1. the foreign server exists and points where it should ---'
          # Asserted explicitly rather than inferred from the query below, because "wrong port" and
          # "wrapper broken" produce the same symptom and this separates them in one line.
          SRV=$($SB "SELECT string_agg(o, ',' ORDER BY o) FROM (SELECT unnest(srvoptions) AS o FROM pg_foreign_server WHERE srvname = 'timescaledb_server') s")
          echo "    options: $SRV"
          if [ -z "$SRV" ]; then
            echo 'FAIL: foreign server timescaledb_server does not exist. db-init has not run, or 0001 failed part-way.' >&2
            exit 1
          fi
          # M2. 5433 and 54322 are docker-compose PUBLISHED ports and mean nothing in a cluster;
          # the server listens on 5432. This is the specific mistake M6 exists to catch.
          case "$SRV" in
            *port=5432*) ;;
            *) echo "FAIL: foreign server is not on port 5432 -- got '$SRV'. In-cluster it is always 5432; 5433 is only docker-compose's published port." >&2; exit 1 ;;
          esac
          case "$SRV" in
            *host={{ include "factoryplus.timescale.host" . }}*) ;;
            *) echo "FAIL: foreign server host is not '{{ include "factoryplus.timescale.host" . }}' -- got '$SRV'." >&2; exit 1 ;;
          esac

          echo '--- 2. the historian actually has the hypertable ---'
          # Checked from the far side, so a missing hypertable is not reported as an FDW fault. The
          # bootstrap scripts run ONLY on an empty data directory, so this is a real failure mode.
          TS=$(PGPASSWORD="$TSPASSWORD" psql -v ON_ERROR_STOP=1 -h {{ include "factoryplus.timescale.host" . }} -p {{ include "factoryplus.timescale.port" . }} \
                 -U {{ .Values.timescaledb.username }} -d {{ .Values.timescaledb.database }} -tAc \
                 "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('assets','telemetry')")
          echo "    tables found: $TS/2"
          if [ "$TS" != "2" ]; then
            echo 'FAIL: the telemetry hypertable and/or assets table is missing from TimescaleDB. Its init scripts run only on an EMPTY data directory -- the PVC must be destroyed, not the pod restarted.' >&2
            exit 1
          fi

          echo '--- 3. THE ACTUAL CROSS-DATABASE QUERY ---'
          # This is the assertion. It crosses the wrapper, so it exercises the server definition,
          # the user mapping and reachability at once. A row COUNT of zero is a PASS: a fresh stack
          # has no telemetry yet, and what is being proved is that the query executes at all.
          COUNT=$($SB "SELECT count(*) FROM public.telemetry WHERE time > now() - interval '1 hour'")
          echo "    rows in the last hour: $COUNT"

          echo '--- 4. and it is readable through the app roles, not just as owner ---'
          # PostgREST connects as `authenticator` and switches to `anon`/`authenticated`. A foreign
          # table readable only by the owner would pass check 3 and still 404 every API request.
          $SB "SET ROLE authenticated; SELECT count(*) FROM public.telemetry WHERE time > now() - interval '1 hour'" >/dev/null
          echo '    readable as authenticated'

          echo
          echo 'PASS: postgres_fdw reaches TimescaleDB at {{ include "factoryplus.timescale.host" . }}:{{ include "factoryplus.timescale.port" . }} and public.telemetry is queryable.'
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
{{- end }}
