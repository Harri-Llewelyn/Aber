{{- /*
TimescaleDB bootstrap scripts, mounted at /docker-entrypoint-initdb.d.

SOURCED FROM ./timescaledb/init, the same directory docker-compose.yml bind-mounts, so the two
targets provision the historian from ONE set of files. Helm cannot read outside its own chart, so
the copies under files/ are mirrored by scripts/sync-helm-chart-files.mjs and CI runs that script
with --check to prove they are current.

SAME CAVEAT AS COMPOSE, and it is sharper here: the postgres entrypoint runs these ONLY on an
EMPTY DATA DIRECTORY. Editing them does not reach an existing database, and on Kubernetes "recreate
the volume" means deleting the PVC -- `helm upgrade` will not do it, and neither will deleting the
pod, because the StatefulSet reattaches the same claim. Schema changes to the historian therefore
need a migration, not an edit here.
*/ -}}
{{- if .Values.timescaledb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-timescaledb-init" (include "factoryplus.fullname" .) }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" "timescaledb") | nindent 4 }}
data:
{{- $found := 0 }}
{{- range $path, $bytes := .Files.Glob "files/timescaledb-init/*.sql" }}
{{- $found = add1 $found }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- if eq $found 0 }}
{{- fail "\n\nfactoryplus: no TimescaleDB init scripts found at files/timescaledb-init/*.sql\n\nMirror them from ./timescaledb/init with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render rather than installing without them is deliberate: the postgres entrypoint runs\ninitdb scripts ONLY on an empty data directory, so a database that comes up without the hypertable\ncannot be repaired by re-running anything -- the PVC has to be destroyed. An empty ConfigMap would\nmount cleanly, start cleanly, and fail at the first telemetry write.\n" }}
{{- end }}
{{- end }}
