{{- if .Values.supabaseKong.enabled }}
{{- $component := "supabase-kong" -}}
{{- $fullname := include "factoryplus.fullname" . -}}
{{- $kong := .Files.Get "files/kong/kong.yml" -}}
{{- if not $kong }}
{{- fail "\n\nfactoryplus: files/kong/kong.yml is missing.\n\nMirror it with:  node scripts/sync-helm-chart-files.mjs\n\nAn absent gateway config is not survivable -- Kong refuses to start without KONG_DECLARATIVE_CONFIG,\nand an EMPTY one starts cleanly and 404s every route, which reads as a dozen broken services.\n" }}
{{- end }}
---
{{/*
Kong's declarative config, from the SHARED template.

supabase/kong.yml is one template serving both deployment targets. Keeping one file rather than
forking it is the point: a route added for Compose and forgotten on Kubernetes is a gateway that
behaves differently between environments, which is the class of bug this gateway exists to prevent.

SUBSTITUTION HAPPENS IN AN initContainer, NOT IN HELM, and that is deliberate. Rendering the
secrets in at template time looks simpler and breaks the `secrets.existingSecret` path in the worst
possible way: with the Secret managed outside the chart, `.Values.secrets.anonKey` is empty, and
Helm would happily substitute EMPTY STRINGS -- registering empty API keys, WHICH key-auth ACCEPTS.
The gateway would come up looking healthy with its authentication silently disabled.

Reading them from the Secret at pod start works whoever owns it, keeps key material out of the
rendered manifest entirely, and is the same mechanism `supabase-kong-init` uses on Compose --
including the leftover-placeholder scan, which skips comment lines because kong.yml's header
documents the placeholder convention by name.

Kong 2.8 has no environment interpolation in declarative config (that arrived in 3.x), which is why
substitution happens outside the process on both targets.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-kong-template" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  kong.yml: |
{{ $kong | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "factoryplus.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # PORT 8000, not the 54321 docker-compose publishes. `http://supabase-kong:8000` is what
      # every in-cluster consumer already carries -- Studio, the edge runtime, Grafana's token_url
      # and api_url, Node-RED's token and userinfo URLs.
      port: 8000
      targetPort: http
      protocol: TCP
    {{- if .Values.supabaseKong.metrics.enabled }}
    # NAMED `metrics`, and the ServiceMonitor selects it BY NAME rather than by number. A port
    # number in two places drifts; a name does not, and Prometheus Operator resolves the name
    # against this Service at scrape time.
    - name: metrics
      port: {{ .Values.supabaseKong.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseKong.replicas }}
  selector:
    matchLabels:
      {{- include "factoryplus.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the gateway when the ROUTES change. Kong reads its declarative config once at start,
        # so without this a route change would sit in the ConfigMap unread.
        #
        # It does NOT cover the API keys -- those live in the Secret, which the chart may not even
        # be able to see (existingSecret). Rotating a key therefore needs an explicit
        # `kubectl rollout restart deployment/supabase-kong`; see deploy/k8s/README.md.
        checksum/kong-template: {{ $kong | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: render-config
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          env:
            {{- include "factoryplus.secretEnv" (dict "name" "SUPABASE_ANON_KEY" "secretName" (include "factoryplus.secretName" .) "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            {{- include "factoryplus.secretEnv" (dict "name" "SUPABASE_SERVICE_ROLE_KEY" "secretName" (include "factoryplus.secretName" .) "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            # The one upstream that genuinely differs between targets:
            #   Compose     http://realtime-dev.supabase-realtime:4000/socket/   (a network alias)
            #   Kubernetes  http://realtime-dev:4000/socket/                     (the Service name)
            # Either way the LEADING HOSTNAME LABEL must be `realtime-dev` -- Realtime reads its
            # tenant from it and answers a bare 403 otherwise.
            - name: REALTIME_UPSTREAM_URL
              value: {{ printf "http://%s:%v/socket/" .Values.realtime.serviceName .Values.realtime.port | quote }}
          command:
            - /bin/sh
            - -e
            - -c
            - |
              if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
                echo 'SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY must be set -- Kong would otherwise register empty API keys, which key-auth accepts.' >&2
                exit 1
              fi
              case "$REALTIME_UPSTREAM_URL" in
                http://realtime-dev*|https://realtime-dev*) ;;
                *)
                  echo "REALTIME_UPSTREAM_URL must have 'realtime-dev' as its leading hostname label -- Realtime reads the tenant id from it and answers a bare 403 otherwise. Got: $REALTIME_UPSTREAM_URL" >&2
                  exit 1
                  ;;
              esac
              # sed is safe here: a Supabase JWT is base64url, so it contains no character that
              # could be read as a delimiter or a backreference.
              sed -e "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" \
                  -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$SUPABASE_SERVICE_ROLE_KEY|g" \
                  -e "s|__REALTIME_UPSTREAM_URL__|$REALTIME_UPSTREAM_URL|g" \
                  /template/kong.yml > /config/kong.yml
              # Matches ANY surviving marker, not just the __SUPABASE_ ones. Comment lines are
              # excluded because kong.yml's header documents the convention by name, so a
              # whole-file scan would flag the documentation of the rule as a violation of it.
              LEFTOVER=$(grep -vE '^[[:space:]]*#' /config/kong.yml | grep -noE '__[A-Z0-9_]+__' || true)
              if [ -n "$LEFTOVER" ]; then
                echo 'Kong config still contains unsubstituted placeholders:' >&2
                echo "$LEFTOVER" >&2
                exit 1
              fi
              echo 'Rendered Kong declarative config with API key consumers.'
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: kong
          image: "{{ .Values.supabaseKong.image.repository }}:{{ .Values.supabaseKong.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseKong.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            {{- if .Values.supabaseKong.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.supabaseKong.metrics.port }}
              protocol: TCP
            {{- end }}
              protocol: TCP
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /usr/local/kong/declarative/kong.yml
            - name: KONG_DNS_ORDER
              value: LAST,A,CNAME
            # NAMING ANY PLUGIN HERE REPLACES the default `bundled` set rather than adding to it.
            # key-auth had to be listed explicitly: before it was, the plugin was not merely unused
            # but UNAVAILABLE, and referencing it in kong.yml would have failed Kong's startup.
            - name: KONG_PLUGINS
              value: {{ .Values.supabaseKong.plugins | quote }}
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            # Kong's own admin API, bound to loopback so it is not reachable from the pod network.
            # Nothing drives Kong at runtime here -- the config is declarative and static -- so an
            # exposed admin API would be authority with no use for it.
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            {{- if .Values.supabaseKong.metrics.enabled }}
            # The Prometheus plugin's endpoint. Bound on all interfaces because a ServiceMonitor
            # scrapes it from another pod -- unlike the admin listener above, which is loopback
            # precisely because nothing should reach it.
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:{{ .Values.supabaseKong.metrics.port }}
            {{- end }}
          startupProbe:
            exec:
              command: ["kong", "health"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            # `kong health` rather than an httpGet: Kong answers 404 on an unrouted path once it is
            # serving, and httpGet treats 404 as a failure. Probing a real route instead would make
            # the gateway's readiness depend on an upstream's, which inverts the dependency.
            exec:
              command: ["kong", "health"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["kong", "health"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.supabaseKong.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/local/kong/declarative
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: {{ printf "%s-kong-template" $fullname }}
        # emptyDir, not a Secret: the RENDERED config carries the service-role key and is built at
        # pod start. Nothing persists it, and it never appears in a Helm manifest or in `helm get`.
        - name: config
          emptyDir: {}
{{- end }}
