{{- if and .Values.initJobs.enabled .Values.supabaseDb.enabled }}
{{- $component := "db-init" -}}
{{- $secretName := include "factoryplus.secretName" . -}}
{{- $fullname := include "factoryplus.fullname" . -}}
---
{{/*
The migrations and the seed, as ConfigMaps.

MIRRORED from supabase/migrations/ and supabase/seed.sql by scripts/sync-helm-chart-files.mjs --
Helm cannot read outside its chart. CI runs that script with --check, and it also warns as the
migrations approach the 1 MiB ConfigMap limit (they are ~396 KiB and only grow; 0002 alone is over
200 KiB because it carries three generated reference vocabularies).

supabase/migrations/archive/ is NOT included, and that is load-bearing rather than an oversight:
those are the 38 pre-beta migrations, preserved as reasoning and deliberately never executed. The
sync script does not recurse, which is what keeps them out.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-migrations" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT -5: the ConfigMaps must exist before the Job that mounts them. A hook resource
    # created at the same weight as its consumer is a race that usually wins and occasionally
    # does not.
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- $found := 0 }}
{{- range $path, $bytes := .Files.Glob "files/migrations/*.sql" }}
{{- $found = add1 $found }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- if eq $found 0 }}
{{- fail "\n\nfactoryplus: no migrations found at files/migrations/*.sql\n\nMirror them with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render rather than installing an empty ConfigMap is deliberate: db-init would run,\nfind nothing to apply, exit 0, and every downstream service would then fail against a database\nwith no schema -- which reads as a dozen unrelated faults rather than as one missing step.\n" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-seed" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- range $path, $bytes := .Files.Glob "files/seed/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-db-init" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT 10 -- after db-roles-init (0), before storage-init (20).
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "factoryplus.waitForPostgres" (dict "ctx" . "name" "wait-for-supabase-db" "host" (include "factoryplus.supabaseDb.host" .) "port" (include "factoryplus.supabaseDb.port" .) "user" "postgres" "db" "postgres" "passwordKey" "POSTGRES_PASSWORD") | nindent 8 }}
        {{- if .Values.supabaseAuth.enabled }}
        {{/*
          WAITING FOR GOTRUE IS NOT OPTIONAL, and it is the ordering constraint that is easiest to
          miss: GoTrue creates and owns the `auth` schema, and the migrations build on it --
          auth.users, auth.oauth_clients, the auth.uid()/auth.jwt() helpers every RLS policy calls.
          Run them first and 0001 fails part-way through, leaving a HALF-APPLIED SCHEMA, which is
          the worst outcome available here because the next replay starts from an inconsistent
          state rather than a clean one.

          docker-compose expresses this as `depends_on: supabase-auth: condition: service_healthy`.
        */}}
        {{- include "factoryplus.waitFor" (dict "ctx" . "name" "wait-for-auth" "image" "curlimages/curl:8.10.1" "command" "curl -sf http://supabase-auth:9999/health >/dev/null 2>&1" "describe" "supabase-auth (it owns the auth schema the migrations build on)") | nindent 8 }}
        {{- end }}
      containers:
        - name: db-init
          image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
          env:
            {{- include "factoryplus.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            # TimescaleDB connection, handed to the migrations as psql variables so
            # 0001_baseline_schema.sql can build its postgres_fdw link without hardcoding
            # credentials.
            #
            # M2: HOST timescaledb, PORT 5432 -- the in-cluster address and the port the server
            # listens on. NOT 5433, which is only docker-compose's published port. A foreign server
            # pointed at 5433 fails as a relation-level error from PostgREST, which reads as a
            # schema fault; `helm test` (M6) queries the foreign table to catch exactly that.
            - name: TS_HOST
              value: {{ include "factoryplus.timescale.host" . | quote }}
            - name: TS_PORT
              value: {{ include "factoryplus.timescale.port" . | quote }}
            - name: TS_DBNAME
              value: {{ .Values.timescaledb.database | quote }}
            - name: TS_USER
              value: {{ .Values.timescaledb.username | quote }}
            {{- include "factoryplus.secretEnv" (dict "name" "TS_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            {{- include "factoryplus.secretEnv" (dict "name" "NODERED_ADMIN_TOKEN" "secretName" $secretName "key" "NODERED_ADMIN_TOKEN") | nindent 12 }}
            {{- include "factoryplus.secretEnv" (dict "name" "GRAFANA_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "GRAFANA_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- include "factoryplus.secretEnv" (dict "name" "NODERED_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "NODERED_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- include "factoryplus.secretEnv" (dict "name" "NODERED_WEBHOOK_JWT_SECRET" "secretName" $secretName "key" "NODERED_WEBHOOK_JWT_SECRET") | nindent 12 }}
            # M3. These two are why changing an ingress hostname is safe: both client rows are
            # upserted with DO UPDATE from these values on every replay, so a `helm upgrade` that
            # changes publicBaseDomain re-registers the OAuth clients in the SAME operation. A
            # hardcoded URL in the seed is rewritten back on every boot instead -- which is exactly
            # what Grafana's did until it was parameterised.
            - name: GRAFANA_PUBLIC_URL
              value: {{ include "factoryplus.grafanaUrl" . | quote }}
            - name: NODERED_OAUTH_CALLBACK_URL
              value: {{ printf "%s/auth/strategy/callback" (include "factoryplus.noderedUrl" .) | quote }}
          command:
            - /bin/sh
            - -e
            - -c
            - |
              PSQL="psql -v ON_ERROR_STOP=1 -h {{ include "factoryplus.supabaseDb.host" . }} -p {{ include "factoryplus.supabaseDb.port" . }} -U postgres -d postgres"

              echo 'Configuring PostgreSQL search_path...'
              $PSQL -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;'

              # ORDERING IS LEXICAL, matching docker-compose's `for f in /migrations/*.sql`. The
              # numeric prefixes are what make that correct; a migration added without one would
              # sort unpredictably against the rest.
              echo 'Applying Supabase database migrations...'
              for f in /migrations/*.sql; do
                [ -f "$f" ] || continue
                echo "Executing migration $f..."
                $PSQL \
                  -v ts_host="$TS_HOST" \
                  -v ts_port="$TS_PORT" \
                  -v ts_dbname="$TS_DBNAME" \
                  -v ts_user="$TS_USER" \
                  -v ts_password="$TS_PASSWORD" \
                  -v nodered_admin_token="$NODERED_ADMIN_TOKEN" \
                  -v grafana_oauth_client_secret="$GRAFANA_OAUTH_CLIENT_SECRET" \
                  -v grafana_public_url="$GRAFANA_PUBLIC_URL" \
                  -v nodered_oauth_client_secret="$NODERED_OAUTH_CLIENT_SECRET" \
                  -v nodered_webhook_jwt_secret="$NODERED_WEBHOOK_JWT_SECRET" \
                  -v nodered_redirect_uri="$NODERED_OAUTH_CALLBACK_URL" \
                  -f "$f"
              done

              # Runs AFTER the migrations, not before: it inserts GoTrue users and user_roles rows
              # against tables 0001 creates.
              if [ -f /seed/seed.sql ]; then
                echo 'Executing seed.sql...'
                $PSQL -f /seed/seed.sql
              fi

              echo 'Supabase database initialized successfully.'
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: seed
              mountPath: /seed
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: migrations
          configMap:
            name: {{ printf "%s-migrations" $fullname }}
        - name: seed
          configMap:
            name: {{ printf "%s-seed" $fullname }}
{{- end }}
