{{- /*
Compression and retention reconciliation for the telemetry hypertable.

WHY A HOOK JOB AND NOT AN initdb SCRIPT. The postgres entrypoint runs /docker-entrypoint-initdb.d
ONLY on an empty data directory, and on Kubernetes "recreate the volume" means deleting the PVC --
`helm upgrade` will not do it and neither will deleting the pod, because the StatefulSet reattaches
the same claim. A retention interval that could only be chosen before the first telemetry row was
written was not a setting; it was a constant with a misleading name. This runs on every install and
every upgrade, so `timescaledb.retention.*` is authoritative in both directions.

WHY post-upgrade AND post-install. Changing an interval is an upgrade, and that is the case this
exists to serve. `before-hook-creation` deletes the previous Job so a repeat upgrade is not refused
by the immutability of a completed Job's pod template.
*/ -}}
{{- if and .Values.initJobs.enabled .Values.timescaledb.enabled .Values.timescaledb.retention.enabled }}
{{- $component := "timescaledb-retention" -}}
{{- $fullname := include "factoryplus.fullname" . -}}
{{- $secretName := include "factoryplus.secretName" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-timescaledb-retention" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- $found := 0 }}
{{- range $path, $bytes := .Files.Glob "files/timescaledb-retention/retention.sql" }}
{{- $found = add1 $found }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- if eq $found 0 }}
{{- fail "\n\nfactoryplus: files/timescaledb-retention/retention.sql is missing.\n\nMirror it from ./timescaledb with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render is deliberate. An empty ConfigMap would mount cleanly and the Job would report\nsuccess having applied NO policy at all -- so a stack configured to drop telemetry after 90 days\nwould silently keep it forever, and one configured to keep it forever would be indistinguishable.\n" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-timescaledb-retention" $fullname }}
  labels:
    {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT 25 -- after db-roles-init (0), db-init (10) and storage-init (20). It touches only
    # TimescaleDB and so depends on none of them, but running last keeps the hook sequence a single
    # readable order rather than two interleaved ones.
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "factoryplus.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          Waits for the HYPERTABLE, not for the server. Readiness means the port answers; the
          bootstrap scripts that create `telemetry` run separately, so "server up" and "schema
          present" are genuinely different states here. Without this the Job fails on a first
          install with a relation error that reads as a chart fault.
        */}}
        - name: wait-for-telemetry-table
          image: "{{ .Values.timescaledb.image.repository }}:{{ .Values.timescaledb.image.tag }}"
          imagePullPolicy: {{ .Values.timescaledb.image.pullPolicy }}
          env:
            {{- include "factoryplus.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              deadline=$(( $(date +%s) + {{ .Values.initJobs.waitTimeout }} ))
              until psql -h {{ include "factoryplus.timescale.host" . }} -p {{ include "factoryplus.timescale.port" . }} \
                        -U {{ .Values.timescaledb.username }} -d {{ .Values.timescaledb.database }} -tAc \
                        "SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_name = 'telemetry'" \
                    2>/dev/null | grep -q 1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "timed out waiting for the telemetry hypertable (created by timescaledb/init on an EMPTY data directory)" >&2
                  exit 1
                fi
                echo "waiting for the telemetry hypertable ..."
                sleep 3
              done
              echo "telemetry hypertable exists"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: retention
          image: "{{ .Values.timescaledb.image.repository }}:{{ .Values.timescaledb.image.tag }}"
          imagePullPolicy: {{ .Values.timescaledb.image.pullPolicy }}
          env:
            {{- include "factoryplus.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -h
            - {{ include "factoryplus.timescale.host" . | quote }}
            - -p
            - {{ include "factoryplus.timescale.port" . | quote }}
            - -U
            - {{ .Values.timescaledb.username | quote }}
            - -d
            - {{ .Values.timescaledb.database | quote }}
            {{- /*
              Passed as psql variables rather than substituted into the SQL at render time, so the
              chart's copy of retention.sql stays byte-identical to the repository's -- the same
              file Compose runs, with the same drift check behind it.
            */}}
            - -v
            - {{ printf "compress_after=%s" .Values.timescaledb.retention.compressAfter | quote }}
            - -v
            - {{ printf "retain_after=%s" .Values.timescaledb.retention.retainFor | quote }}
            - -f
            - /sql/retention.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: sql
          configMap:
            name: {{ printf "%s-timescaledb-retention" $fullname }}
{{- end }}
