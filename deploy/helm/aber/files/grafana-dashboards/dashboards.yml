# ONE PROVIDER, ONE FOLDER.
#
# There were two, split by audience: a platform engineer asking "is ingestion keeping up" and a
# production engineer asking "what is cell 1 doing" were sharing one dashboard, which meant neither
# could scan it. The second folder held the demonstrator's `manufacturing-cells.json`, whose panels
# hardcoded `Sim_CNC_Mill_01` -- a machine that exists on no install running real plant. The
# demonstration floor has been retired, so that folder had nothing left to provision and a folder
# Grafana creates empty is a question every operator asks once.
#
# WHAT PROVISIONS A SECOND FOLDER NOW is adding a provider here, siblings and never nested: a
# provider scans its directory recursively, so pointing one at `dashboards/` and another at
# `dashboards/<sub>/` files every dashboard under BOTH folders -- Grafana creates duplicates and
# the second provider's copy wins on a race.
#
# `foldersFromFilesStructure` is deliberately NOT used. It derives folder names from directory
# names, which would give "platform" rather than the name below, and it cannot express two
# differently-named folders from one provider anyway.
#
# THE ALERT RULES ARE NOT PROVISIONED HERE, but they land in the SAME FOLDER. Grafana files alert
# rules in dashboard folders, so grafana/provisioning/alerting/ names this folder by title and the
# tree stays one folder deep. Renaming the folder below means renaming it there too.
apiVersion: 1

providers:
  - name: 'aber-platform'
    orgId: 1
    folder: 'Aber - Platform Infrastructure'
    type: file
    disableDeletion: false
    # 30s. Provisioned dashboards are reconciled from disk, so an edit made in the UI is
    # overwritten on the next sweep -- which is the intended behaviour: the file is the source of
    # truth and the UI is a viewer.
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/platform
