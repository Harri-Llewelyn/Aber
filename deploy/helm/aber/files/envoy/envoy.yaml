# The gateway (docs/gateway.md; supabase/README.md, "API Gateway"). A TEMPLATE, not a config: thirteen
# __UPPER_SNAKE__ placeholders are substituted at boot by the initContainer, and check-gateway-surface.mjs
# asserts that the substituter knows every one and that they are still placeholders. Three listeners:
# the API on 8000, which admits the opaque sb_publishable_* / sb_secret_* keys and hands each upstream
# the JWT it requires; Studio's login on 8001; the forge's login on 8002. Route order is first-match.
# i3X, Node-RED and Grafana have no cluster here; they are published on their own ports.
# Required by SDS (the listeners' client secrets and cookie keys); labels only.
node:
  id: aber-gateway
  cluster: aber

# Internal only: unauthenticated, and it can drain listeners and dump the config, keys included.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                # Realtime is a WebSocket upstream.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: supabase
                  virtual_hosts:
                    - name: supabase
                      domains: ["*"]
                      typed_per_filter_config:
                        # CORS: the only statement of origin policy in the stack; the edge functions declare none. An
                        # origin missing from the list presents as a dashboard that logs in and shows empty tables while
                        # the gateway returns 200.
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match: __CORS_ORIGINS__
                          allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                          allow_headers: "*"
                          allow_credentials: true
                      routes:
                        # Exemption 1 of 4: sign-in must work before a session exists. Not gated, but a bearer that is one
                        # of the two keys is translated to its JWT (Studio presents the secret key as the bearer).
                        - name: auth-v1-routes
                          match: { prefix: "/auth/v1/" }
                          route:
                            cluster: auth-v1
                            prefix_rewrite: "/"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              name: translate_bearer

                        # Exemption 2 of 4: an AAS File URL must resolve with no session. Before /storage/v1/; the
                        # upstream path keeps /object/public/.
                        - name: storage-v1-public-routes
                          match: { prefix: "/storage/v1/object/public/" }
                          route:
                            cluster: storage-v1
                            prefix_rewrite: "/object/public/"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true

                        - name: storage-v1-routes
                          match: { prefix: "/storage/v1/" }
                          route:
                            cluster: storage-v1
                            prefix_rewrite: "/"

                        - name: rest-v1-routes
                          match: { prefix: "/rest/v1/" }
                          route:
                            cluster: rest-v1
                            prefix_rewrite: "/"

                        # Realtime: gated, key preserved, Host rewritten. It reads its tenant from the leading Host label
                        # and parses the apikey, so the key is replaced with its JWT rather than stripped.
                        - name: realtime-v1-ws
                          match: { prefix: "/realtime/v1/" }
                          route:
                            cluster: realtime-v1
                            prefix_rewrite: "/socket/"
                            host_rewrite_literal: __REALTIME_UPSTREAM_HOST__
                            # A WebSocket has no response until it is closed.
                            timeout: 0s
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              name: keyauth_preserve

                        # Exemption 3 of 4: an OAuth client sends client credentials, never a Supabase apikey. Exact
                        # paths, before /functions/v1/, so a function added later is gated by default.
                        - name: functions-v1-grafana-userinfo-route
                          match: { path: "/functions/v1/grafana-userinfo" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/grafana-userinfo"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true

                        - name: functions-v1-nodered-userinfo-route
                          match: { path: "/functions/v1/nodered-userinfo" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/nodered-userinfo"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true

                        # The edge runtime boots with VERIFY_JWT=false (each function checks its own role), so this gate is
                        # what stops an unauthenticated request starting any worker. /aas-api/description is gated too;
                        # exempting it is a decision of its own, with a matching EXPECTED row in check-gateway-surface.mjs.
                        - name: functions-v1-routes
                          match: { prefix: "/functions/v1/" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/"

                        # Exemption 4 of 4: the Factory+ Directory adapter, whose clients hold no apikey. /ping is open by
                        # specification; /v1/ is authenticated by the function, which queries as the caller.
                        - name: fplus-directory-ping
                          match: { prefix: "/ping" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/fplus-directory/ping"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true

                        - name: fplus-directory-v1
                          match: { prefix: "/v1/" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/fplus-directory/v1/"
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true

                http_filters:
                  # CORS first: a preflight carries no apikey, so a key check ahead of it would 401 every OPTIONS.
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # key-auth: an exact string match of the presented key against the registered ones; no signature
                  # is verified. default_source_code gates and strips; keyauth_preserve gates and keeps, for Realtime
                  # alone; exempt routes set disabled: true. A query-string apikey reaching PostgREST is parsed as a
                  # column filter, so both the header and the query are stripped.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          -- The keys callers present. Not JWTs (PostgREST answers PGRST301 to one):
                          -- matched as strings, and each stands for the JWT below.
                          local PUBLISHABLE = "__SUPABASE_PUBLISHABLE_KEY__"
                          local SECRET = "__SUPABASE_SECRET_KEY__"

                          -- The JWTs the upstreams require. Presenting one of these IS refused: they
                          -- are the gateway's to substitute, not a caller's credential.
                          local ANON = "__SUPABASE_ANON_KEY__"
                          local SERVICE = "__SUPABASE_SERVICE_ROLE_KEY__"

                          -- The JWT a registered key stands for, or nil for anything else. The
                          -- initContainer refuses an empty key, so an empty apikey matches nothing.
                          local function translated(key)
                            if key == PUBLISHABLE then return ANON end
                            if key == SECRET then return SERVICE end
                            return nil
                          end

                          -- The key may arrive in the header or the query string.
                          local function presented_key(handle)
                            local from_header = handle:headers():get("apikey")
                            if from_header ~= nil and from_header ~= "" then
                              return from_header
                            end
                            local path = handle:headers():get(":path") or ""
                            local query = string.match(path, "%?(.*)$")
                            if query == nil then return nil end
                            for pair in string.gmatch(query, "[^&]+") do
                              local k, v = string.match(pair, "^([^=]+)=(.*)$")
                              if k == "apikey" then return v end
                            end
                            return nil
                          end

                          local function refuse(handle)
                            -- The body clients and check-gateway-surface.mjs read; do not reword.
                            handle:respond(
                              { [":status"] = "401", ["content-type"] = "application/json" },
                              '{"message":"No API key found in request"}'
                            )
                          end

                          -- Remove `apikey` from the query string by rewriting `:path`.
                          local function strip_query_key(handle)
                            local path = handle:headers():get(":path") or ""
                            local base, query = string.match(path, "^([^?]*)%?(.*)$")
                            if query == nil then return end
                            local kept = {}
                            for pair in string.gmatch(query, "[^&]+") do
                              local k = string.match(pair, "^([^=]+)")
                              if k ~= "apikey" then kept[#kept + 1] = pair end
                            end
                            if #kept == 0 then
                              handle:headers():replace(":path", base)
                            else
                              handle:headers():replace(":path", base .. "?" .. table.concat(kept, "&"))
                            end
                          end

                          -- Synthesise the bearer when Authorization is absent, and translate it when
                          -- it carries either registered key (Studio sends the publishable key as the
                          -- apikey and the secret key as the bearer). A caller's own JWT (i3X and the
                          -- edge functions pass the caller's token as the bearer) is never touched.
                          -- Note `apikey: <secret key>` with no Authorization reaches PostgREST as
                          -- `service_role`; the secret key IS the credential.
                          local function synthesise_bearer(handle, jwt)
                            local auth = handle:headers():get("authorization")
                            if auth == nil or auth == "" then
                              handle:headers():replace("authorization", "Bearer " .. jwt)
                              return
                            end
                            local mapped = translated(string.match(auth, "^[Bb]earer%s+(.+)$") or auth)
                            if mapped ~= nil then
                              handle:headers():replace("authorization", "Bearer " .. mapped)
                            end
                          end

                          function envoy_on_request(handle)
                            local key = presented_key(handle)
                            if key == nil then
                              refuse(handle)
                              return
                            end
                            local jwt = translated(key)
                            if jwt == nil then
                              -- A different message from the missing-key one: two faults, two
                              -- names, and clients log them.
                              handle:respond(
                                { [":status"] = "401", ["content-type"] = "application/json" },
                                '{"message":"Unauthorized"}'
                              )
                              return
                            end
                            synthesise_bearer(handle, jwt)
                            -- Strip the key from BOTH the header and the query: a query-string apikey
                            -- reaching PostgREST is parsed as a column filter (PGRST100).
                            handle:headers():remove("apikey")
                            strip_query_key(handle)
                          end
                      source_codes:
                        # The sign-in route: no gate, but a bearer that is one of the two keys becomes its JWT.
                        translate_bearer:
                          inline_string: |
                            local PUBLISHABLE = "__SUPABASE_PUBLISHABLE_KEY__"
                            local SECRET = "__SUPABASE_SECRET_KEY__"
                            local ANON = "__SUPABASE_ANON_KEY__"
                            local SERVICE = "__SUPABASE_SERVICE_ROLE_KEY__"

                            function envoy_on_request(handle)
                              local auth = handle:headers():get("authorization")
                              if auth == nil then return end
                              local bearer = string.match(auth, "^[Bb]earer%s+(.+)$") or auth
                              local jwt = nil
                              if bearer == PUBLISHABLE then jwt = ANON end
                              if bearer == SECRET then jwt = SERVICE end
                              if jwt ~= nil then
                                handle:headers():replace("authorization", "Bearer " .. jwt)
                              end
                            end
                        # Realtime's copy: the key is replaced, in the header and the query, never removed; stripping it
                        # breaks the handshake.
                        keyauth_preserve:
                          inline_string: |
                            local PUBLISHABLE = "__SUPABASE_PUBLISHABLE_KEY__"
                            local SECRET = "__SUPABASE_SECRET_KEY__"
                            local ANON = "__SUPABASE_ANON_KEY__"
                            local SERVICE = "__SUPABASE_SERVICE_ROLE_KEY__"

                            local function translated(key)
                              if key == PUBLISHABLE then return ANON end
                              if key == SECRET then return SERVICE end
                              return nil
                            end

                            local function presented_key(handle)
                              local from_header = handle:headers():get("apikey")
                              if from_header ~= nil and from_header ~= "" then
                                return from_header
                              end
                              local path = handle:headers():get(":path") or ""
                              local query = string.match(path, "%?(.*)$")
                              if query == nil then return nil end
                              for pair in string.gmatch(query, "[^&]+") do
                                local k, v = string.match(pair, "^([^=]+)=(.*)$")
                                if k == "apikey" then return v end
                              end
                              return nil
                            end

                            -- Replaced rather than stripped: Realtime PARSES the apikey (tenant and RLS
                            -- claims), so a new-format key must be substituted with the JWT it stands
                            -- for. A JWT needs no escaping in a query string.
                            local function replace_key(handle, jwt)
                              if handle:headers():get("apikey") ~= nil then
                                handle:headers():replace("apikey", jwt)
                              end
                              local path = handle:headers():get(":path") or ""
                              local base, query = string.match(path, "^([^?]*)%?(.*)$")
                              if query == nil then return end
                              local kept = {}
                              for pair in string.gmatch(query, "[^&]+") do
                                if string.match(pair, "^([^=]+)") == "apikey" then
                                  kept[#kept + 1] = "apikey=" .. jwt
                                else
                                  kept[#kept + 1] = pair
                                end
                              end
                              handle:headers():replace(":path", base .. "?" .. table.concat(kept, "&"))
                            end

                            -- Nothing is removed here: stripping the key breaks the Realtime handshake.
                            function envoy_on_request(handle)
                              local key = presented_key(handle)
                              if key == nil then
                                handle:respond(
                                  { [":status"] = "401", ["content-type"] = "application/json" },
                                  '{"message":"No API key found in request"}'
                                )
                                return
                              end
                              local jwt = translated(key)
                              if jwt == nil then
                                handle:respond(
                                  { [":status"] = "401", ["content-type"] = "application/json" },
                                  '{"message":"Unauthorized"}'
                                )
                                return
                              end
                              replace_key(handle, jwt)
                              -- Same rule as the default filter: somebody else's token is never overwritten.
                              local auth = handle:headers():get("authorization")
                              if auth == nil or auth == "" then
                                handle:headers():replace("authorization", "Bearer " .. jwt)
                              else
                                local mapped = translated(string.match(auth, "^[Bb]earer%s+(.+)$") or auth)
                                if mapped ~= nil then
                                  handle:headers():replace("authorization", "Bearer " .. mapped)
                                end
                              end
                            end

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # STUDIO'S LOGIN (supabase/README.md, "The second listener"). Studio has no authentication of its
    # own and runs as the database owner, so: an OAuth 2.1 code flow against this stack's GoTrue, a
    # session cookie, and an Administrator check. Its own listener because machine principals on 8000
    # cannot complete a browser login. No userinfo function: the role is in the access token. No openid
    # scope: GoTrue refuses to sign an ID token with HS256. Minimum Envoy 1.34 (PKCE).
    - name: studio
      address:
        socket_address: { address: 0.0.0.0, port_value: 8001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: studio
                # Who opened the console, from the verified token, so a 403 line names the refused identity.
                # %REQ_WITHOUT_QUERY% because the callback carries the authorization code in its query string; it
                # is an extension and must be registered below, or Envoy refuses the whole config.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        formatters:
                          - name: envoy.formatter.req_without_query
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
                        text_format_source:
                          inline_string: "aber-studio method=%REQ(:METHOD)% path=%REQ_WITHOUT_QUERY(:PATH)% status=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% user=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)% role=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:app_metadata:role)% downstream=%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%\n"
                # Nothing upgrades here today (Studio's one websocket goes to the API listener); kept so a future
                # Studio that opens one does not fail with a 426.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: studio
                  virtual_hosts:
                    - name: studio
                      domains: ["*"]
                      routes:
                        # One route, no exemptions: /api/mcp (an unauthenticated MCP server running execute_sql as the
                        # owner) is deliberately behind the door.
                        - match: { prefix: "/" }
                          route:
                            cluster: studio
                            timeout: 0s
                http_filters:
                  # 1. THE DOOR: the authorization-code flow and the session cookies. The browser follows the
                  # authorization endpoint (host-facing); the token exchange is made by Envoy against the container.
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        authorization_endpoint: __SUPABASE_PUBLIC_URL__/auth/v1/oauth/authorize
                        token_endpoint:
                          cluster: auth-v1
                          uri: http://supabase-auth:9999/oauth/token
                          timeout: 10s
                        redirect_uri: __STUDIO_PUBLIC_URL__/oauth2/callback
                        redirect_path_matcher: { path: { exact: /oauth2/callback } }
                        signout_path: { path: { exact: /oauth2/signout } }
                        # The client is registered client_secret_basic (archived migration 0081); GoTrue enforces it.
                        auth_type: BASIC_AUTH
                        auth_scopes: [email, profile]
                        forward_bearer_token: true
                        use_refresh_token: true
                        # The session cap. This cookie is verified locally and outlives a dashboard sign-out; Envoy's
                        # default is seven days. 3600s matches GOTRUE_JWT_EXP, and scoping it to this door rather than
                        # stack-wide keeps the wall-mounted dashboards signed in.
                        default_refresh_token_expires_in: 3600s
                        credentials:
                          client_id: c0ffee00-0000-4000-8000-000000000003
                          # Two files, one secret each: a path config source carrying two resources is accepted at boot and
                          # rejected at runtime.
                          token_secret:
                            name: studio-oauth-client-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/studio-client-secret.yaml }
                          hmac_secret:
                            name: studio-proxy-hmac-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/studio-hmac-secret.yaml }
                  # 2. THE TOKEN: verifies what GoTrue signed; oct is the JWKS key type for HMAC. No issuer check,
                  # because GoTrue's OAuth access token carries no iss.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        gotrue:
                          audiences: [authenticated]
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"__SUPABASE_JWT_SECRET_B64URL__"}]}'
                          payload_in_metadata: jwt_payload
                      rules:
                        # Everything else: the verified claims OVERWRITE whatever arrived (Gitea reads the first of
                        # duplicate headers). The bearer is stripped here, after the placement step has presented it; Gitea
                        # must never see a Supabase JWT. The username is the token's sub (Gitea refuses @).
                        - match: { prefix: "/" }
                          requires: { provider_name: gotrue }
                  # 3. THE PRIVILEGE: every persona can complete the flow above; only Administrator passes.
                  # sourced_metadata, since bare metadata is deprecated.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          administrators:
                            permissions: [{ any: true }]
                            principals:
                              - sourced_metadata:
                                  metadata_source: DYNAMIC
                                  metadata_matcher:
                                    filter: envoy.filters.http.jwt_authn
                                    path:
                                      - { key: jwt_payload }
                                      - { key: app_metadata }
                                      - { key: role }
                                    value: { string_match: { exact: Administrator } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # THE FORGE'S LOGIN (supabase/README.md, "The forge's door"). Gitea cannot be an OIDC client of
    # GoTrue, so Studio's three filters run the code flow, verify the token locally, and hand the
    # identity to Gitea as X-WEBAUTH-* headers through its reverse-proxy authentication; Administrator
    # and Shopfloor_Manager get in, and what a person may do inside is Gitea's team model. The headers
    # are the credential: Gitea signs in whoever X-WEBAUTH-USER names, so the control is that only this
    # listener and the edge runtime can reach Gitea's HTTP port (the NetworkPolicy), the routes overwrite
    # or remove the headers, and the API ignores them. Two paths pass without a session, written in all
    # three filters because they share no matcher: /api/ and /assets/ssh_host_key.pub. Smart-HTTP clone
    # ends at a redirect by design; clones are SSH on 22.
    - name: forge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: forge
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        formatters:
                          - name: envoy.formatter.req_without_query
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
                        text_format_source:
                          inline_string: "aber-forge method=%REQ(:METHOD)% path=%REQ_WITHOUT_QUERY(:PATH)% status=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% user=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)% role=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:app_metadata:role)% downstream=%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%\n"
                route_config:
                  name: forge
                  virtual_hosts:
                    - name: forge
                      domains: ["*"]
                      routes:
                        # The API: no session, identity headers dropped, no placement step.
                        - match: { prefix: "/api/" }
                          route:
                            cluster: gitea
                            timeout: 0s
                          request_headers_to_remove:
                            - x-webauth-user
                            - x-webauth-email
                            - x-webauth-fullname
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # Gitea's own sign-out is a no-op under reverse-proxy authentication, so it routes to
                        # forge-signout, which ends every GoTrue session the caller holds and answers 302 to
                        # /oauth2/signout. The token is kept on this route because the revocation names the person.
                        - match: { path: "/user/logout" }
                          route:
                            cluster: functions-v1
                            prefix_rewrite: "/forge-signout"
                            timeout: 15s
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # Static assets: a session and the identity headers, no placement step. The public host key is
                        # under this prefix and arrives with no token.
                        - match: { prefix: "/assets/" }
                          route:
                            cluster: gitea
                            timeout: 60s
                          request_headers_to_remove:
                            - authorization
                          request_headers_to_add:
                            - header:
                                key: x-webauth-user
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:sub)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-webauth-email
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-webauth-fullname
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/" }
                          route:
                            cluster: gitea
                            # Diffs and archives can take a while to render.
                            timeout: 120s
                          request_headers_to_remove:
                            - authorization
                          request_headers_to_add:
                            - header:
                                key: x-webauth-user
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:sub)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-webauth-email
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-webauth-fullname
                                value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:email)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        authorization_endpoint: __SUPABASE_PUBLIC_URL__/auth/v1/oauth/authorize
                        token_endpoint:
                          cluster: auth-v1
                          uri: http://supabase-auth:9999/oauth/token
                          timeout: 10s
                        redirect_uri: __GITEA_PUBLIC_URL__/oauth2/callback
                        redirect_path_matcher: { path: { exact: /oauth2/callback } }
                        signout_path: { path: { exact: /oauth2/signout } }
                        # The two exemptions, first of three places.
                        pass_through_matcher:
                          - name: ":path"
                            string_match: { prefix: "/api/" }
                          - name: ":path"
                            string_match: { exact: "/assets/ssh_host_key.pub" }
                        # Registered client_secret_basic by archived migration 0094, as Studio's is by 0081.
                        auth_type: BASIC_AUTH
                        auth_scopes: [email, profile]
                        forward_bearer_token: true
                        use_refresh_token: true
                        default_refresh_token_expires_in: 3600s
                        credentials:
                          client_id: c0ffee00-0000-4000-8000-000000000004
                          token_secret:
                            name: forge-oauth-client-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/forge-client-secret.yaml }
                          hmac_secret:
                            name: forge-proxy-hmac-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/forge-hmac-secret.yaml }
                          # Distinct from Studio's: browsers scope cookies by host, not port, so on localhost the two doors
                          # would otherwise sign each other out.
                          cookie_names:
                            bearer_token: ForgeBearerToken
                            oauth_hmac: ForgeOauthHMAC
                            oauth_expires: ForgeOauthExpires
                            id_token: ForgeIdToken
                            refresh_token: ForgeRefreshToken
                            oauth_nonce: ForgeOauthNonce
                            code_verifier: ForgeCodeVerifier
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        gotrue:
                          audiences: [authenticated]
                          # Forwarded after verification, unlike Studio's, for the placement step; the routes strip it
                          # before Gitea except on /api/.
                          forward: true
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"__SUPABASE_JWT_SECRET_B64URL__"}]}'
                          payload_in_metadata: jwt_payload
                      rules:
                        # The two exemptions, second of three places; first, because rules match in order.
                        - match: { prefix: "/api/" }
                        - match: { path: "/assets/ssh_host_key.pub" }
                        - match: { prefix: "/" }
                          requires: { provider_name: gotrue }
                  # 3. THE PRIVILEGE: two roles, and the two exemptions a third time.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          administrators_and_managers:
                            permissions: [{ any: true }]
                            principals:
                              - sourced_metadata:
                                  metadata_source: DYNAMIC
                                  metadata_matcher:
                                    filter: envoy.filters.http.jwt_authn
                                    path:
                                      - { key: jwt_payload }
                                      - { key: app_metadata }
                                      - { key: role }
                                    value: { string_match: { exact: Administrator } }
                              - sourced_metadata:
                                  metadata_source: DYNAMIC
                                  metadata_matcher:
                                    filter: envoy.filters.http.jwt_authn
                                    path:
                                      - { key: jwt_payload }
                                      - { key: app_metadata }
                                      - { key: role }
                                    value: { string_match: { exact: Shopfloor_Manager } }
                          the_api_authenticates_itself:
                            permissions:
                              - url_path: { path: { prefix: "/api/" } }
                            principals: [{ any: true }]
                          the_host_key_is_public:
                            permissions:
                              - url_path: { path: { exact: "/assets/ssh_host_key.pub" } }
                            principals: [{ any: true }]
                  # 4. THE PLACEMENT. Gitea auto-registers a login and stops; forge-membership puts the person in the
                  # team their user_roles row warrants, or takes them out and answers 403 if the role has gone since
                  # the token was signed. After RBAC. failure_mode_allow: a 5xx lets the request through, since the
                  # role in the token was already admitted; 403 and 302 (a dead session, to /oauth2/signout) are
                  # honoured. Only the Authorization header travels, and nothing the function answers reaches Gitea.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      status_on_error: { code: ServiceUnavailable }
                      http_service:
                        server_uri:
                          uri: http://supabase-functions:9000
                          cluster: functions-v1
                          timeout: 8s
                        # The edge runtime routes on the first path segment.
                        path_prefix: /forge-membership
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                        authorization_response:
                          allowed_client_headers:
                            patterns:
                              - exact: content-type
                              # A dead session is a 302 to /oauth2/signout; Location must reach the browser.
                              - exact: location
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # STRICT_DNS re-resolves on its refresh interval; a recreated container changes address.
  clusters:
    - name: auth-v1
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth-v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: supabase-auth, port_value: 9999 }

    - name: rest-v1
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest-v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: supabase-rest, port_value: 3000 }

    - name: realtime-v1
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: realtime-v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    # The chart names the Service realtime-dev. Distinct from __REALTIME_UPSTREAM_HOST__, which is
                    # the Host header and must keep the realtime-dev leading label.
                    socket_address: { address: __REALTIME_UPSTREAM_ADDRESS__, port_value: 4000 }

    - name: storage-v1
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: storage-v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: supabase-storage, port_value: 5000 }

    - name: functions-v1
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: functions-v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: supabase-functions, port_value: 9000 }

    # For the studio listener only. Target-specific address, as realtime-v1's is.
    - name: studio
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: studio
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: __STUDIO_UPSTREAM_ADDRESS__, port_value: 3000 }

    # For the forge listener only; HTTP only (SSH on 22 never passes through this gateway).
    - name: gitea
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: gitea
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: __GITEA_UPSTREAM_ADDRESS__, port_value: 3000 }
