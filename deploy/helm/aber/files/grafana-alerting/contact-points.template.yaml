# Alert delivery: the one contact point. A TEMPLATE, like datasources.template.yml: an initContainer
# substitutes the __PLACEHOLDER__ forms with sed and asserts that none survives, because an
# unsubstituted one reaches the webhook as a literal credential and fails with 401 several steps
# from the cause. Grafana holds a narrow bearer secret that authorises recording an alert and is
# never given service_role; the argument, and the two-credential shape, is in grafana/README.md.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Aber Webhook
    receivers:
      - uid: aber-webhook
        type: webhook
        settings:
          # The gateway's Service name and port. No credential in the URL: both travel as headers.
          url: http://supabase-envoy:8000/functions/v1/grafana-alert-webhook
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: __GRAFANA_ALERT_WEBHOOK_SECRET__
          # apikey gets past the GATEWAY; the Bearer above is what the FUNCTION checks. Two layers, two
          # credentials. `headers` needs Grafana 11.6 or newer; on an older one the gateway refuses with 401
          # and nothing reaches the function, so its log stays empty.
          headers:
            apikey: __SUPABASE_PUBLISHABLE_KEY__
          # No cap: a cap silently truncates the alert array, and one multi-dimensional rule can deliver
          # several instances in one notification.
          maxAlerts: 0
        # Resolved notifications are how the dashboard's toast clears and the pill decrements. Grafana's
        # default, stated because switching it off latches every alert on in the UI forever.
        disableResolveMessage: false
