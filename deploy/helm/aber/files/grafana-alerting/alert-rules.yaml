# The platform's own alert rules, provisioned into the "Aber - Platform Infrastructure" folder.
# Each rule states what it evaluates and nothing else; the reasoning behind every threshold, `for`,
# noDataState and query shape is in grafana/README.md, which is not shipped in the chart.
# Provisioned rules are read-only in the UI, and a retired rule is named in a `deleteRules:` block
# rather than removed, so the uids are stable.
apiVersion: 1

groups:
  # Platform Conditions: rows of public.platform_health and gateway_health, read as grafana_reader
  # through the Supabase datasource. NoData is OK throughout: the views emit a row only for a condition.
  - orgId: 1
    name: Platform Conditions
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:
      # Gateway Stale: a gateway the view already calls stale (90s), tolerated for 5m.
      - uid: aber-gateway-stale
        title: Gateway Stale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has not sent a heartbeat for
            {{ printf "%.0f" $values.B.Value }}s. Check the appliance and its broker credential.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # collected_at AS "time": the time_series format needs a time column; the view is point-in-time.
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS quiet_seconds
                  FROM public.platform_health
                 WHERE condition = 'gateway_stale'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Enrolment Stuck: AWAITING_BIRTH for over an hour. The view carries the delay, so `for: 0s`.
      - uid: aber-enrolment-stuck
        title: Enrolment Stuck
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has been AWAITING_BIRTH for
            {{ printf "%.0f" $values.B.Value }}s without publishing an NBIRTH. Its flow may not have
            deployed.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS stuck_seconds
                  FROM public.platform_health
                 WHERE condition = 'enrolment_stuck'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]
              datasource:
                type: __expr__
                uid: __expr__

      # Quarantine Queue Depth: more than 5 devices awaiting a decision for 5m. Emitted at zero, so an
      # empty frame is the datasource, not an empty queue.
      - uid: aber-quarantine-depth
        title: Quarantine Queue Depth
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} devices are quarantined and waiting for an approval
            decision on the Devices page.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS quarantined
                  FROM public.platform_health
                 WHERE condition = 'quarantine_depth'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              datasource:
                type: __expr__
                uid: __expr__

      # Gateway CA Expiring: the CA each appliance reports holding, under 30 days (negative: expired).
      # The threshold is the delay. NoData is a fleet with no appliances.
      - uid: aber-gateway-ca-expiring
        title: Gateway CA Expiring
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            The broker CA trusted by {{ $labels.gateway }} expires in
            {{ printf "%.1f" $values.B.Value }} days (negative means it already has). The CA is
            distributed by hand into each appliance's trust store, so re-issuing it is a fleet
            operation -- see docs/incidents.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # IS NOT NULL is load-bearing: a gateway that reports no date would otherwise be an instance.
              rawSql: |
                SELECT collected_at          AS "time",
                       gateway_name          AS gateway,
                       sparkplug_id          AS sparkplug_id,
                       cert_expires_in_days  AS days_remaining
                  FROM public.gateway_health
                 WHERE cert_expires_in_days IS NOT NULL
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [30]
              datasource:
                type: __expr__
                uid: __expr__

      # Archive Backlog: days past the tiering threshold with no verified export, over 14 for 1h. The
      # row exists only while archiving is on.
      - uid: aber-archive-backlog
        title: Archive Backlog
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Cold telemetry is {{ printf "%.1f" $values.B.Value }} days past the tiering threshold
            and not yet verified on the remote endpoint. Check the S3 endpoint and the cold-archive
            CronJob's last run; the Cold Storage page names the chunk and any error.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS overdue_days
                  FROM public.platform_health
                 WHERE condition = 'archive_backlog'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [14]
              datasource:
                type: __expr__
                uid: __expr__

  # Ingestion Pipeline: the daemon's Prometheus counters, which see the pipe the views cannot. Resolves
  # only where a datasource with uid `prometheus` exists; elsewhere DatasourceError, routed by the policy.
  - orgId: 1
    name: Ingestion Pipeline
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:
      # Ingestion Consuming Nothing: no messages for 10m while expected_publishers > 0. The one rule
      # where NoData is Alerting: an empty frame is a failed scrape.
      - uid: aber-ingestion-silent
        title: Ingestion Consuming Nothing
        condition: F
        for: 10m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon has recorded no Sparkplug messages for 10 minutes while devices are
            registered and expected to publish. Telemetry is not reaching the historian. Check the
            broker connection and aber_ingestion_messages_dropped_total.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              # sum across msg_type; `or vector(0)` because the counter does not exist before the first message.
              expr: sum(rate(aber_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: D
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              editorMode: code
              # platform_health, not public.devices: grafana_reader holds SELECT on the view only.
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS expected_publishers
                  FROM public.platform_health
                 WHERE condition = 'expected_publishers'
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              expression: ($B < 0.001) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # Telemetry Being Dropped: any refused message, by reason, for 5m. The counter exists only once
      # something is dropped, so NoData is OK.
      - uid: aber-ingestion-drops
        title: Telemetry Being Dropped
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Ingestion is dropping messages ({{ $labels.reason }}). This is telemetry that was NOT
            recorded and will not be restated. See ingestion/README.md for what each reason means.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (reason) (rate(aber_ingestion_messages_dropped_total[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Gateway Binding Rejections Rising: telemetry for devices the sender does not own, for 15m.
      # Critical: a misconfigured gateway and forged telemetry look the same here.
      - uid: aber-ingestion-binding-rejections
        title: Gateway Binding Rejections Rising
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Telemetry is being published for devices the sending gateway does not own, and refused.
            Either a gateway is misconfigured or something is publishing as an asset it is not.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_messages_dropped_total{reason="gateway_binding"}[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Ingestion Dropping Birth Certificates: a DBIRTH or NBIRTH refused because the directory was
      # unreachable, for 5m. A dropped birth costs the alias table, not one sample.
      - uid: aber-ingestion-birth-drops
        title: Ingestion Dropping Birth Certificates
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Birth certificates are being dropped ({{ $labels.reason }}) because the device
            directory is unreachable. Affected devices cannot be decoded until they birth again --
            check PostgREST and the gateway, then request a rebirth rather than waiting on the
            timer.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (reason) (rate(aber_ingestion_messages_dropped_total{reason=~"dbirth_directory_unavailable|node_message_directory_unavailable"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Digital Thread Partitions Falling Behind: rows in the DEFAULT partition, for 30m. The view
      # always returns one row, so an empty frame is the datasource.
      - uid: aber-digital-thread-partitions
        title: Digital Thread Partitions Falling Behind
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} audit row(s) have landed in the digital_thread
            DEFAULT partition, so the monthly partition job has stopped. Nothing is lost and
            nothing is refused, but retention by DETACH will skip these rows. Run
            SELECT public.ensure_digital_thread_partitions(3); and check cron.job_run_details.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT now()        AS "time",
                       default_rows AS default_partition_rows
                  FROM public.digital_thread_partition_health
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Historian Unreachable From Ingestion: no connection while messages arrive, for 2m. NoData is
      # OK: a missing scrape is the silent-daemon rule's job, and alerting on it was this rule's
      # loudest false positive.
      - uid: aber-ingestion-db-down
        title: Historian Unreachable From Ingestion
        condition: F
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB while telemetry is arriving. Readings are
            being dropped for as long as this lasts and will not be restated.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: aber_ingestion_db_connected
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: D
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(aber_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              expression: ($B < 1) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # Historian Unreachable, No Traffic: the recovery loop failing for 10m (twenty 30s attempts) with
      # nothing publishing. Becomes the rule above the moment a gateway publishes.
      - uid: aber-ingestion-db-unreachable-idle
        title: Historian Unreachable From Ingestion (No Traffic)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB. Nothing is being dropped, because nothing
            is publishing -- but any telemetry arriving while this lasts will be.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_db_heal_failures_total[10m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Sparkplug Message Loss: seq gaps per edge node, for 15m, which rides out the gap every deploy
      # produces.
      - uid: aber-ingestion-sequence-gaps
        title: Sparkplug Message Loss
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            Edge node {{ $labels.edge_node }} is losing messages between the broker and the
            historian. Any metric carried by them is stale here until the node re-births.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_sequence_gaps_total[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Gateway Clock Skew: |offset| over 60s for 15m, gated on a measurement under 300s old so a
      # powered-down appliance does not alert on its last value.
      - uid: aber-gateway-clock-skew
        title: Gateway Clock Skew
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            Edge node {{ $labels.edge_node }} has a clock that disagrees with the platform by more
            than a minute, so every reading it sends is being filed at the wrong time. Nothing
            corrects this centrally -- devices are trusted for their own timestamps. Fix time
            synchronisation on the appliance; see docs/remote-gateways.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                abs(aber_ingestion_gateway_clock_offset_seconds)
                and on(edge_node)
                (time() - aber_ingestion_gateway_clock_measured_timestamp_seconds < 300)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              datasource:
                type: __expr__
                uid: __expr__

      # Historian Writer Saturating: writer occupancy over 0.5 for 10m. Queue depth is deliberately not
      # the trigger; it grows only once the writer is already behind.
      - uid: aber-ingestion-writer-saturating
        title: Historian Writer Saturating
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon's historian writer has been busy more than half the time for ten
            minutes. Telemetry is still being written; a burst or a slower historian would start it
            queueing. Read aber_ingestion_write_queue_depth and aber_ingestion_write_seconds beside it.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(aber_ingestion_write_seconds_sum[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              datasource:
                type: __expr__
                uid: __expr__

      # Broker Shedding Messages: any QoS 0 discard in 5m, broker-wide. No series while the exporter
      # (mosquitto.metrics.enabled) is off.
      - uid: aber-broker-shedding
        title: Broker Shedding Messages
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The broker discarded about {{ printf "%.0f" $values.B.Value }} messages in five minutes
            for a subscriber that could not keep up. They were not delivered and will not be restated. If
            aber_ingestion_sequence_gaps_total is rising too, the subscriber is the ingestion
            daemon and this is telemetry missing from the historian.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(increase(broker_publish_messages_dropped[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

  # Log Pipeline: Alloy and Loki, whose own failure destroys the record of itself. NoData is OK: a
  # cluster running its own log stack (observability.enabled=false) has no series here.
  - orgId: 1
    name: Log Pipeline
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # Log Collector Down: up{job="alloy"} == 0 for 5m. Warning: only the record is lost.
      - uid: aber-log-collector-down
        title: Log Collector Down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log collector is not answering its scrape. Container logs are still being written by
            Docker and are still readable with `docker logs`, but nothing is being kept -- so the
            evidence for anything that fails while this is down will not be in the store afterwards.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="alloy"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      # Log Collection Stalled: shipped-entry rate under 0.001/s for 15m. This stack logs about itself
      # every 60s, so a silent quarter-hour is a fault.
      - uid: aber-log-collection-stalled
        title: Log Collection Stalled
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log collector is running and has shipped nothing for fifteen minutes. On a stack with
            any traffic this means collection is broken rather than idle -- check that discovery is
            resolving targets, which is what fails when the socket proxy refuses an API path.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(loki_write_sent_entries_total[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]
              datasource:
                type: __expr__
                uid: __expr__

      # Log Store Refusing Lines: rate_limited or stream_limited drops for 10m. ingester_error is
      # excluded on purpose (loki/loki.yaml).
      - uid: aber-log-store-refusing
        title: Log Store Refusing Lines
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log store is refusing lines ({{ $labels.reason }}) and they are being lost. This is a
            ceiling in loki/loki.yaml doing its job: `rate_limited` is ingestion_rate_mb, and
            `stream_limited` is max_streams_per_user -- which usually means a label was promoted
            that should have stayed a field. Raise the bound or fix the cause; do not ignore it.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (reason) (rate(loki_write_dropped_entries_total{reason=~"rate_limited|stream_limited"}[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

  # Host: the node's root filesystem, from the node_exporter collectors Alloy runs. NoData is OK: no
  # host metrics, no series.
  - orgId: 1
    name: Host
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # Host Disk Filling: root filesystem under 15% free for 15m. Every store here writes to it.
      - uid: aber-host-disk-filling
        title: Host Disk Filling
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The root filesystem on {{ $labels.instance }} has {{ humanizePercentage $values.B.Value }}
            free. Both databases, the metrics store and the log store write to it, and each of
            them stops when it is full. Prune backups, shorten retention, or grow the volume.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (instance) (
                  node_filesystem_avail_bytes{mountpoint="/"}
                  / node_filesystem_size_bytes{mountpoint="/"}
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]
              datasource:
                type: __expr__
                uid: __expr__

  # Cluster: kubelet and cAdvisor, per node, container or claim. NoData is OK throughout: a deployment
  # that scrapes no kubelet has no series here.
  - orgId: 1
    name: Cluster
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # Container Near Memory Limit: working set over 90% of the limit for 10m.
      - uid: aber-cluster-container-memory
        title: Container Near Memory Limit
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is at
            {{ humanizePercentage $values.B.Value }} of its memory limit. Past it the kernel kills the
            process and the kubelet restarts the container. Raise the limit in the chart's
            resources for that workload, or find the growth.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (namespace, pod, container) (
                  container_memory_working_set_bytes{container!=""}
                  / on (namespace, pod, container)
                  (container_spec_memory_limit_bytes{container!=""} > 0)
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              datasource:
                type: __expr__
                uid: __expr__

      # Container Restarting: more than 2 starts in an hour, as changes of container_start_time_seconds.
      - uid: aber-cluster-container-restarting
        title: Container Restarting
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has
            started {{ $values.B }} times in the last hour. The previous instance's last lines:
            kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (namespace, pod, container) (
                  changes(container_start_time_seconds{container!=""}[1h])
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              datasource:
                type: __expr__
                uid: __expr__

      # Volume Filling: a claim over 85% full for 15m, as the kubelet measures the mounted filesystem.
      - uid: aber-cluster-volume-filling
        title: Volume Filling
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
            {{ humanizePercentage $values.B.Value }} full. The store on it stops when it is; grow the
            claim (the storage class must allow expansion), shorten that store's retention, or
            prune what it holds.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (namespace, persistentvolumeclaim) (
                  kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]
              datasource:
                type: __expr__
                uid: __expr__

      # Node Memory Pressure: MemAvailable under 10% of MemTotal for 10m.
      - uid: aber-cluster-node-memory
        title: Node Memory Pressure
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Node {{ $labels.instance }} has {{ humanizePercentage $values.B.Value }} of its memory
            available. The kubelet evicts pods below its threshold and the kernel kills below
            its own. Lower the memory requests and limits of the stores, or give the node memory.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (instance) (
                  node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]
              datasource:
                type: __expr__
                uid: __expr__

      # Node CPU Saturated: non-idle share over 90% for 15m. Nothing fails; the ingestion writer slows first.
      - uid: aber-cluster-node-cpu
        title: Node CPU Saturated
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Node {{ $labels.instance }} has been {{ humanizePercentage $values.B.Value }} busy for
            fifteen minutes. The Cluster dashboard's CPU by Pod panel says which workload;
            the historian's continuous aggregates and Loki's compaction are the usual ones.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              datasource:
                type: __expr__
                uid: __expr__

  # Databases: the postgres_exporter sidecar in each database pod, one instance per `job`. NoData is OK
  # throughout because databaseMetrics.enabled may be off; the README records what that blinds.
  - orgId: 1
    name: Databases
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # Database Connections Near Limit: over 80% of max_connections for 5m. The denominator is
      # aber_postgres_max_connections, a custom query; the exporter's settings collector is off.
      - uid: aber-db-connections
        title: Database Connections Near Limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} is at {{ humanizePercentage $values.B.Value }} of max_connections and has
            been for five minutes. At 100% it refuses every new connection at once -- PostgREST's
            pool, the ingestion writer and the edge functions together. Find what is holding them
            open (the Backends by State panel separates `idle in transaction` from `active`) before
            raising max_connections.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (job) (pg_stat_activity_count)
                / on (job)
                max by (job) (aber_postgres_max_connections)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              datasource:
                type: __expr__
                uid: __expr__

      # Database Deadlocks: any deadlock in 10m. The window is the delay, so `for: 0s`.
      - uid: aber-db-deadlocks
        title: Database Deadlocks
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has recorded {{ $values.B }} deadlock(s) in the last ten minutes.
            PostgreSQL resolved each by killing one transaction, so the database is healthy and an
            application saw an error it may not have logged. Two transactions are taking the same
            locks in different orders.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (job) (increase(pg_stat_database_deadlocks[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Transaction ID Wraparound Approaching: age(datfrozenxid) over 1e9. A TRANSACTION count, whatever
      # the metric's _seconds suffix says; do not turn the threshold into a duration.
      - uid: aber-db-wraparound
        title: Transaction ID Wraparound Approaching
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has a transaction ID age of {{ $values.B }} (TRANSACTIONS, not
            seconds). PostgreSQL refuses all writes at about 2.147e9 and recovers only in
            single-user mode. Autovacuum is being prevented from freezing -- look for a long-lived
            transaction or an inactive replication slot, then let autovacuum catch up.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (job) (pg_database_wraparound_age_datfrozenxid_seconds)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1000000000]
              datasource:
                type: __expr__
                uid: __expr__

      # Historian Policy Job Failing: failures_total rising within 1h. On the failure count, not
      # last_run_succeeded, which is 0 for a job that has never run.
      - uid: aber-db-historian-job-failing
        title: Historian Policy Job Failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            TimescaleDB job {{ $labels.job_id }} ({{ $labels.proc_name }}) has failed
            {{ $values.B }} time(s) in the last hour. Retention, compression and rollup refresh are
            what keep the historian's storage and its aggregates true; a failing policy has no other
            symptom until the volume fills or a dashboard quietly goes stale. Check the job's last
            error: SELECT * FROM timescaledb_information.job_stats WHERE job_id = {{ $labels.job_id }};
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              # `and on (job_id)`: TimescaleDB re-creates policy jobs with new ids at every upgrade; this
              # drops the retired ids, which otherwise alert for an hour under a job_id nobody can find.
              expr: >-
                sum by (job_id, proc_name) (increase(aber_historian_job_failures_total[1h]))
                and on (job_id) aber_historian_job_runs_total
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # Database Not Answering: pg_up == 0 for 5m. A pod that is gone yields NoData and OK; the
      # Cluster group covers that case.
      - uid: aber-db-not-answering
        title: Database Not Answering
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has not answered its own exporter for five minutes. The exporter runs
            beside the server in the same pod and connects over loopback, so this is the database
            itself: down, still recovering, or out of connections. Nothing reaches it either --
            check the pod: kubectl -n aber logs {{ $labels.job }}-0 -c {{ $labels.job }}
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (job) (pg_up)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      # Database Collector Failing: a collector unsuccessful for 10m. The scrape still succeeds, so this
      # gauge is the only signal that the panels and rules on its series are empty.
      - uid: aber-db-collector-failing
        title: Database Collector Failing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The `{{ $labels.collector }}` collector on {{ $labels.job }} has failed for ten minutes.
            The exporter is still serving and the scrape still succeeds, so every panel and rule
            built on that collector's series is now silently empty rather than reporting a problem.
            Usually a missing extension or a privilege the exporter's role does not hold --
            kubectl -n aber logs {{ $labels.job }}-0 -c metrics names the cause.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (job, collector) (pg_scrape_collector_success)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      # Historian Backup Stale: no successful physical backup for 36h, gated on archive_mode. Before
      # the first success the clock starts when backup was switched on.
      - uid: aber-db-historian-backup-stale
        title: Historian Backup Stale
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The historian has had no successful physical backup for
            {{ humanizeDuration $values.B.Value }}. A restore can reach no later than the last one.
            The sidecar's log names the cause: kubectl -n aber logs timescaledb-0 -c pgbackrest
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                (time() - max(aber_historian_backup_clock_since_time))
                and on () (max(aber_historian_wal_archive_enabled) == 1)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [129600]
              datasource:
                type: __expr__
                uid: __expr__

      # Historian WAL Archiving Failing: the last archive attempt failed and nothing has succeeded
      # since, for 10m. Unarchived WAL fills the data volume until archiveQueueMax drops it.
      - uid: aber-db-historian-wal-archiving
        title: Historian WAL Archiving Failing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The historian has not archived WAL for {{ humanizeDuration $values.B.Value }} and its
            last attempt failed. Unarchived WAL accumulates on the data volume until
            archiveQueueMax, after which it is dropped. Usually the repository endpoint or its
            credentials: kubectl -n aber logs timescaledb-0 -c timescaledb | grep archive
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                (time() - max(aber_historian_wal_archive_last_archived_time))
                and on () (max(aber_historian_wal_archive_last_failed_time) > max(aber_historian_wal_archive_last_archived_time))
                and on () (max(aber_historian_wal_archive_enabled) == 1)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__
