# Alert rules, file-provisioned: the platform's own. Every rule here evaluates the stack, which
# exists whether or not anything is publishing. A rule about a machine goes in a group of its own
# and needs a metric that exists in `metric_catalog`, which check-docs-drift asserts.
#
# Rules provision into the same folder as the platform dashboards. Provisioning is additive: an
# existing Grafana keeps a rule until it is named in a `deleteRules:` block.
#
# Two facts about file-provisioned rules:
#   1. They are read-only in the UI ("Provisioned" badge). Edit this file and restart.
#   2. Deleting a rule here does not delete it from Grafana; retiring one means adding its uid to
#      a delete block. The uids below are stable.
#
# Every rule is multi-dimensional: one alert instance per asset, with the asset in the labels.
# The `timescaledb` datasource connects as `grafana_reader`, which may read the rollups, raw
# `telemetry`, `telemetry_latest` and `assets`. `asset_config` lives in Supabase and postgres_fdw
# runs Supabase -> TimescaleDB only, so a per-device limit travels as a published metric.
apiVersion: 1

groups:
  # ===============================================================================================
  # PLATFORM CONDITIONS: the stack's own health, not the machines'.
  #
  # These read one view, `public.platform_health`, through the Supabase datasource. `grafana_reader`
  # may SELECT that view and `storage_footprint` and nothing else, so a browser-SSO-fronted service
  # never holds the plant's inventory. `entity_type` (`gateway` or `platform`; the webhook defaults
  # to `device`) is what lets the dashboard tell an asset alert from a fleet one.
  # ===============================================================================================
  - orgId: 1
    name: Platform Conditions
    folder: Aber - Platform Infrastructure
    # One minute: none of these conditions moves faster (the staleness threshold is 90s, an enrolment
    # is measured in hours, a quarantine queue changes when a person approves something).
    interval: 1m
    rules:
      # -----------------------------------------------------------------------------------------
      # 1. GATEWAY STALE: an appliance that has stopped reporting.
      # The view owns the definition of stale (`gateway_status.is_stale`, the 90s threshold that
      # check-mirror-drift.mjs holds in step with the frontend); the rule only decides how long to
      # tolerate it. `for: 5m` on top, so a couple of missed heartbeats across a broker reconnect do
      # not fire.
      # -----------------------------------------------------------------------------------------
      - uid: acs-gateway-stale
        title: Gateway Stale
        condition: C
        for: 5m
        # NoData IS OK HERE, and that is a real decision rather than a default. The query returns NO
        # ROWS when every gateway is healthy -- there is nothing to report -- so treating an empty
        # frame as anything but OK would alarm permanently on a well-behaved stack.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has not sent a heartbeat for
            {{ printf "%.0f" $values.B.Value }}s. Check the appliance and its broker credential.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # `collected_at AS "time"` because Grafana's time_series format requires a time
              # column, and this view is a point-in-time answer rather than a series. The reduce
              # below takes the single value regardless.
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS quiet_seconds
                  FROM public.platform_health
                 WHERE condition = 'gateway_stale'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # ANY ROW AT ALL IS THE ALERT. The view only emits a gateway that is already stale, so
              # the threshold is a formality -- `> 0` on a quiet-seconds count that cannot be zero.
              # Expressed rather than omitted because a Grafana rule needs a condition node.
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 2. ENROLMENT STUCK: a gateway that redeemed its token, landed in AWAITING_BIRTH, and never
      # published. `for: 0s` because the view already carries the delay (one hour of `enrolled_at`
      # age).
      # -----------------------------------------------------------------------------------------
      - uid: acs-enrolment-stuck
        title: Enrolment Stuck
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            {{ $labels.gateway }} has been AWAITING_BIRTH for
            {{ printf "%.0f" $values.B.Value }}s without publishing an NBIRTH. Its flow may not have
            deployed.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at   AS "time",
                       subject        AS gateway,
                       sparkplug_id   AS sparkplug_id,
                       value          AS stuck_seconds
                  FROM public.platform_health
                 WHERE condition = 'enrolment_stuck'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # One hour. An enrolment that completes normally does so in seconds; an hour is long
              # enough that nobody is still watching the appliance boot.
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 3. QUARANTINE QUEUE DEPTH: devices waiting on a human decision. The one rule with no subject,
      # hence `entity_type: platform`. The view emits this row at zero, so "the queue is empty" and
      # "the datasource is down" are distinguishable. Five is a demonstrator threshold.
      # -----------------------------------------------------------------------------------------
      - uid: acs-quarantine-depth
        title: Quarantine Queue Depth
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} devices are quarantined and waiting for an approval
            decision on the Devices page.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS quarantined
                  FROM public.platform_health
                 WHERE condition = 'quarantine_depth'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 4. GATEWAY CA EXPIRING: the failure that takes the whole fleet at once.
      #
      # The broker's internal CA is copied by hand into every appliance's trust store, and re-minting
      # it succeeds silently and drops every gateway together (docs/incidents.md). The appliance
      # reports the date it actually holds, which is what each client will accept;
      # `gateway_health.cert_expires_in_days` derives the day count once so this rule and the
      # dashboard cannot disagree.
      #
      # `for: 0s`: the threshold is the delay. The threshold is in the rule, not the query, so the
      # thirty days is visible where an operator opens it and the rule is one instance per gateway. A
      # negative value fires the same rule: an already-expired CA is this condition found late.
      #
      # Read from the database, not Prometheus: the metrics endpoint is unauthenticated and
      # deliberately does not export the certificate date (ingestion/metrics.py).
      # -----------------------------------------------------------------------------------------
      - uid: acs-gateway-ca-expiring
        title: Gateway CA Expiring
        condition: C
        for: 0s
        # NoData IS OK. On a stack with no Remote gateways -- the demonstrator, and every CI run --
        # no appliance reports a certificate date and the query returns nothing. That is a fleet
        # with no appliances, not a fleet in trouble.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            The broker CA trusted by {{ $labels.gateway }} expires in
            {{ printf "%.1f" $values.B.Value }} days (negative means it already has). The CA is
            distributed by hand into each appliance's trust store, so re-issuing it is a fleet
            operation -- see docs/incidents.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              # `collected_at AS "time"` because the time_series format requires a time column.
              # `IS NOT NULL` is load-bearing: a host-run gateway, or an appliance on an older bundle, reports
              # no certificate date, and a NULL per gateway would become an alert instance.
              rawSql: |
                SELECT collected_at          AS "time",
                       gateway_name          AS gateway,
                       sparkplug_id          AS sparkplug_id,
                       cert_expires_in_days  AS days_remaining
                  FROM public.gateway_health
                 WHERE cert_expires_in_days IS NOT NULL
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              # THIRTY DAYS. Long enough to schedule a fleet-wide trust-store update through
              # whatever change process a plant has, which is the constraint that sets it -- the
              # work is a visit to every appliance, not a command.
              conditions:
                - evaluator:
                    type: lt
                    params: [30]
              datasource:
                type: __expr__
                uid: __expr__

      # -----------------------------------------------------------------------------------------
      # 5. ARCHIVE BACKLOG: cold telemetry that should be on the remote endpoint and is not.
      #
      # Since 0132 the archive is somewhere else, so exporting is a network operation with an
      # outage window measured in days. What follows an outage is one of two things: a retention
      # policy deleting chunks the archiver never reached, or the historian's volume filling. The
      # chart defaults retention to `never` once a destination is configured, which makes the
      # second the one a site gets -- recoverable, and losing nothing, PROVIDED somebody is told.
      # This is the telling.
      #
      # The value is DAYS PAST THE THRESHOLD, from the newest verified `range_end`. Up to one chunk
      # interval of backlog is normal: chunks are seven days and one is not eligible until its whole
      # span is past the threshold, so a perfectly healthy site sits between zero and seven days
      # overdue. FOURTEEN is two of those -- comfortably beyond normal, and still two weeks before
      # anyone is short of disk. A threshold of "any backlog" would fire on every install, every
      # week, correctly, and be switched off.
      #
      # `for: 1h` because the exporter runs nightly: this number moves once a day, and a shorter
      # window would only re-report the same reading. NoData IS OK -- the view emits this row only
      # while `archive.enabled` is on, so its absence means a stack that does not archive.
      # -----------------------------------------------------------------------------------------
      - uid: acs-archive-backlog
        title: Archive Backlog
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Cold telemetry is {{ printf "%.1f" $values.B.Value }} days past the tiering threshold
            and not yet verified on the remote endpoint. Check the S3 endpoint and the cold-archive
            CronJob's last run; the Cold Storage page names the chunk and any error.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS overdue_days
                  FROM public.platform_health
                 WHERE condition = 'archive_backlog'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [14]
              datasource:
                type: __expr__
                uid: __expr__

  # ===============================================================================================
  # INGESTION PIPELINE: whether telemetry is being recorded at all.
  #
  # Neither group above can see the pipe between the historian and the stack: under
  # report-by-exception a daemon that has stopped writing looks like a quiet shopfloor. These read
  # the daemon's counters from Prometheus.
  #
  # On Kubernetes the chart ships ServiceMonitors and defers to the cluster's Prometheus, so these
  # rules resolve only where a datasource with uid `prometheus` exists; elsewhere they report
  # `DatasourceError`, which the policy tree routes like any other error.
  # ===============================================================================================
  - orgId: 1
    name: Ingestion Pipeline
    folder: Aber - Platform Infrastructure
    # 1m. These are rates over 5-15 minute windows; evaluating faster re-reads a number that cannot
    # have moved, and the machine group's 10s exists only because someone is standing in front of a
    # fault-injection button.
    interval: 1m
    rules:
      # -------------------------------------------------------------------------------------------
      # 1. CONSUMING NOTHING: a daemon that is running and has stopped recording. The liveness
      # heartbeat cannot express this: the health file is written while the MQTT connection is up.
      #
      # `for: 10m` against a 5m rate window: long enough to ride out a broker restart, short enough
      # that a shift does not pass unnoticed.
      #
      # Gated on there being something to consume: the subject is `expected_publishers`, devices that
      # are registered, not archived, not quarantined, and bound to a gateway that has reported. Each
      # clause is a reason a device legitimately publishes nothing. Zero devices disables the rule;
      # the first device someone registers re-arms it.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-silent
        title: Ingestion Consuming Nothing
        condition: F
        for: 10m
        # NoData is not OK here, unlike the platform rules: an empty frame means the scrape failed,
        # which is worse than the condition being alerted on.
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon has recorded no Sparkplug messages for 10 minutes while devices are
            registered and expected to publish. Telemetry is not reaching the historian. Check the
            broker connection and aber_ingestion_messages_dropped_total.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              # sum() across msg_type, because a daemon receiving only NDATA is still consuming. instant:true
              # so the reduce has a single value.
              # `or vector(0)` because the counter does not exist until the first message: Prometheus returns
              # an empty result, Grafana reads NoData, and `noDataState: Alerting` would fire before the gate
              # in F ran. A daemon that has gone away also yields vector(0), and with devices registered the
              # rule still fires.
              expr: sum(rate(aber_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: D
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              editorMode: code
              # Through `platform_health`, not `public.devices`: `grafana_reader` holds SELECT on the view and
              # nothing else, and querying devices fails as `permission denied` with the rule in error health.
              rawSql: |
                SELECT collected_at AS "time",
                       value        AS expected_publishers
                  FROM public.platform_health
                 WHERE condition = 'expected_publishers'
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              # `$B < 0.001` is the absence of traffic; `$E > 0` is the assertion that somebody should have
              # been sending some.
              expression: ($B < 0.001) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 2. TELEMETRY BEING DROPPED. The correct number is zero: every drop is a message the daemon
      # refused, and under report-by-exception nothing restates it. `for: 5m` absorbs a restart or a
      # momentary directory outage. Multi-dimensional on `reason`.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-drops
        title: Telemetry Being Dropped
        condition: C
        for: 5m
        # OK, unlike the rule above. No dropped series exists until something is dropped -- the
        # counter is created on first use -- so an empty frame here genuinely means nothing has been
        # refused. The silent-daemon rule is what covers the scrape being broken.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Ingestion is dropping messages ({{ $labels.reason }}). This is telemetry that was NOT
            recorded and will not be restated. See ingestion/README.md for what each reason means.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (reason) (rate(aber_ingestion_messages_dropped_total[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3. BINDING REJECTIONS RISING: something published telemetry for a device it does not own.
      # `verify_gateway_binding()` refuses it, so nothing is corrupted and the only trace is a counter.
      # A misconfigured gateway republishing another's devices looks identical to forged telemetry, so
      # this is separated from the drop rule at a higher severity.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-binding-rejections
        title: Gateway Binding Rejections Rising
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Telemetry is being published for devices the sending gateway does not own, and refused.
            Either a gateway is misconfigured or something is publishing as an asset it is not.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_messages_dropped_total{reason="gateway_binding"}[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3b. BIRTH CERTIFICATES BEING DROPPED, at critical. A dropped DDATA costs one sample; a
      # dropped DBIRTH costs a device, because the birth carries the alias table, and an NBIRTH
      # resets it for every device behind the node. Both reasons (`sum by (reason)`), since the
      # remedies differ. `for: 5m`: the trigger is a directory that is briefly unreachable, and the
      # daemon does not retry these, so recovery waits on the next rebirth timer or an operator's
      # request.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-birth-drops
        title: Ingestion Dropping Birth Certificates
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Birth certificates are being dropped ({{ $labels.reason }}) because the device
            directory is unreachable. Affected devices cannot be decoded until they birth again --
            check PostgREST and the gateway, then request a rebirth rather than waiting on the
            timer.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (reason) (rate(aber_ingestion_messages_dropped_total{reason=~"dbirth_directory_unavailable|node_message_directory_unavailable"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3c. THE AUDIT TABLE'S PARTITIONS FALLING BEHIND. `digital_thread` is range-partitioned by
      # month and a pg_cron job keeps three months ahead; a cron job that stops is silent. A default
      # partition absorbs the rows so asset writes never fail, which is why this is a warning: the
      # condition is `default_rows > 0`, because a row filed outside its month is never detached with
      # it. `for: 30m`, since the job runs daily at 03:20 and the minutes after a boundary are noise.
      # -------------------------------------------------------------------------------------------
      - uid: acs-digital-thread-partitions
        title: Digital Thread Partitions Falling Behind
        condition: C
        for: 30m
        # OK rather than NoData: the view always returns exactly one row, so an empty frame here
        # means the datasource is broken, which the Grafana datasource health check owns.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ printf "%.0f" $values.B.Value }} audit row(s) have landed in the digital_thread
            DEFAULT partition, so the monthly partition job has stopped. Nothing is lost and
            nothing is refused, but retention by DETACH will skip these rows. Run
            SELECT public.ensure_digital_thread_partitions(3); and check cron.job_run_details.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: supabase
            model:
              refId: A
              datasource:
                type: postgres
                uid: supabase
              format: time_series
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT now()        AS "time",
                       default_rows AS default_partition_rows
                  FROM public.digital_thread_partition_health
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 4. HISTORIAN UNREACHABLE, WITH TELEMETRY ARRIVING. Both halves: `$B < 1` is the daemon holding
      # no connection, `$E > 0` is somebody publishing (`or vector(0)` for the same reason rule 1
      # needs it). On an idle stack the gauge alone is not data loss; that case is 4b. `for: 2m`
      # because the daemon retries internally, so two minutes means the retries are not winning.
      # `db_connected` cannot see a connection dropped by the server; the drop rule catches that
      # consequence.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-db-down
        title: Historian Unreachable From Ingestion
        condition: F
        for: 2m
        # OK, NOT Alerting. NoData here means the ingestion scrape has gone away, which is the
        # silent-daemon rule's job -- and firing a data-loss alert on a missing scrape is how this
        # rule produced its loudest false positives.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB while telemetry is arriving. Readings are
            being dropped for as long as this lasts and will not be restated.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: aber_ingestion_db_connected
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: D
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: D
              datasource:
                type: prometheus
                uid: prometheus
              # sum() ACROSS msg_type, as rule 1 does: a daemon receiving only NDATA is still being
              # published to, and this half of the condition asks only whether anything is.
              expr: sum(rate(aber_ingestion_messages_total[5m])) or vector(0)
              instant: true
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: math
              expression: ($B < 1) && ($E > 0)
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 4b. HISTORIAN UNREACHABLE, AND NOTHING PUBLISHING. Not critical: nothing is being lost, but
      # the moment a gateway publishes it becomes rule 4. Read from the recovery loop's own counter
      # (`aber_ingestion_db_heal_failures_total`), which rises only when the daemon tried to reach the
      # historian off the message path and could not; a stack that has not written yet cannot produce
      # it. `for: 10m` against a 30s loop: twenty consecutive failures.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-db-unreachable-idle
        title: Historian Unreachable From Ingestion (No Traffic)
        condition: C
        for: 10m
        # OK: the counter does not exist until the recovery loop first fails, so an empty frame
        # means it never has.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon cannot reach TimescaleDB. Nothing is being dropped, because nothing
            is publishing -- but any telemetry arriving while this lasts will be.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_db_heal_failures_total[10m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 5. MESSAGE LOSS: a Sparkplug sequence gap. Under report-by-exception this is the only loss
      # signal there is. Per edge node, so one flapping gateway is distinguishable from plant-wide
      # loss. Messages published while the daemon is down are not replayed, so a deploy produces a
      # real gap at every node; `for: 15m` rides that out.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-sequence-gaps
        title: Sparkplug Message Loss
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            Edge node {{ $labels.edge_node }} is losing messages between the broker and the
            historian. Any metric carried by them is stale here until the node re-births.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(aber_ingestion_sequence_gaps_total[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 6. APPLIANCE CLOCK SKEW: the fault that passes every other check. A gateway with a wrong
      # clock is ONLINE, drops nothing, skips no sequence numbers and verifies its certificate, and
      # files every reading at a time that never happened. ingestion.py subtracts the heartbeat's own
      # timestamp from its arrival time; nothing changes on the appliance.
      #
      # The staleness gate is the second half of the expression and is not optional: a gauge holds
      # its last value forever, so a powered-down appliance would alert on its last reading. 300s is
      # past the 90s the dashboard calls STALE, so an OFFLINE gateway is reported by rule 1 instead.
      #
      # 60 seconds matches GATEWAY_CLOCK_OFFSET_WARN_SECONDS in ingestion.py and is well inside the
      # daemon's sanity window (-24h/+5m), so this fires while the data is still being accepted.
      # `for: 15m` because a broker or network stall reads as a negative offset for its duration.
      # -------------------------------------------------------------------------------------------
      - uid: acs-gateway-clock-skew
        title: Gateway Clock Skew
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: gateway
        annotations:
          summary: >-
            Edge node {{ $labels.edge_node }} has a clock that disagrees with the platform by more
            than a minute, so every reading it sends is being filed at the wrong time. Nothing
            corrects this centrally -- devices are trusted for their own timestamps. Fix time
            synchronisation on the appliance; see docs/remote-gateways.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                abs(aber_ingestion_gateway_clock_offset_seconds)
                and on(edge_node)
                (time() - aber_ingestion_gateway_clock_measured_timestamp_seconds < 300)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 7. HISTORIAN WRITER SATURATING. rate(aber_ingestion_write_seconds_sum) is the fraction of the
      # writer thread's time spent inside transactions -- its occupancy. Half is the warning: the
      # daemon keeps up, and a burst (a gateway flushing an outage's backlog) or a slower historian
      # is what takes it the rest of the way. Queue depth is deliberately not the trigger: it grows
      # only once the writer is already behind, and a full queue's drops reach rule 2 anyway.
      # `for: 10m` rides out a backlog flush, which is meant to run hot.
      # -------------------------------------------------------------------------------------------
      - uid: acs-ingestion-writer-saturating
        title: Historian Writer Saturating
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The ingestion daemon's historian writer has been busy more than half the time for ten
            minutes. Telemetry is still being written; a burst or a slower historian would start it
            queueing. Read aber_ingestion_write_queue_depth and aber_ingestion_write_seconds beside it.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(aber_ingestion_write_seconds_sum[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              datasource:
                type: __expr__
                uid: __expr__

  # ===============================================================================================
  # THE LOG PIPELINE. Loki and Alloy hold the evidence for every other fault here, so their own
  # failure destroys the record of itself. Four rules for four distinct failures:
  #
  #   Collector Down      the container is gone.
  #   Collection Stalled  the container is up and shipping nothing; looks like a quiet plant.
  #   Store Refusing      a ceiling in loki/loki.yaml is biting; lines are being lost now.
  #   Cannot Decode       the collector reads a container and fails to parse it; every other
  #                       signal is green because the rest of the pipeline is.
  #
  # The first two are a pair: `up == 0` cannot see a broken collector that still answers its
  # scrape, and a rate on shipped entries cannot tell a dead collector from a cluster that never
  # had one.
  # ===============================================================================================
  - orgId: 1
    name: Log Pipeline
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # -------------------------------------------------------------------------------------------
      # 1. THE COLLECTOR IS GONE. `up`, because Prometheus can state this directly. Warning, not
      # critical: no telemetry is lost, only the record, and only for as long as this lasts.
      # -------------------------------------------------------------------------------------------
      - uid: acs-log-collector-down
        title: Log Collector Down
        condition: C
        for: 5m
        # OK, not Alerting: a cluster running its own log stack (observability.enabled=false) has no
        # series here, and NoData is the correct state.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log collector is not answering its scrape. Container logs are still being written by
            Docker and are still readable with `docker logs`, but nothing is being kept -- so the
            evidence for anything that fails while this is down will not be in the store afterwards.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="alloy"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 2. THE COLLECTOR IS UP AND COLLECTING NOTHING. Fifteen minutes, because this stack logs about
      # itself (the ingestion daemon writes a STATS line every 60s), so a silent quarter-hour is a
      # fault. A rate rather than an absence: `lt 0.001` distinguishes nothing from very little.
      # -------------------------------------------------------------------------------------------
      - uid: acs-log-collection-stalled
        title: Log Collection Stalled
        condition: C
        for: 15m
        # OK, not Alerting: a cluster running its own log stack (observability.enabled=false) has no
        # series here, and NoData is the correct state.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log collector is running and has shipped nothing for fifteen minutes. On a stack with
            any traffic this means collection is broken rather than idle -- check that discovery is
            resolving targets, which is what fails when the socket proxy refuses an API path.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(loki_write_sent_entries_total[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3. A CEILING IS BITING. loki.yaml bounds the store by ingest rate because Loki has no byte
      # ceiling, and log volume scales with fault rate. The `reason` filter excludes `ingester_error`
      # on purpose: that counts the "entry too far behind" refusals a collector produces when it first
      # attaches to long-running containers, which is self-limiting (see loki/loki.yaml).
      # -------------------------------------------------------------------------------------------
      - uid: acs-log-store-refusing
        title: Log Store Refusing Lines
        condition: C
        for: 10m
        # OK, not Alerting: a cluster running its own log stack (observability.enabled=false) has no
        # series here, and NoData is the correct state.
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The log store is refusing lines ({{ $labels.reason }}) and they are being lost. This is a
            ceiling in loki/loki.yaml doing its job: `rate_limited` is ingestion_rate_mb, and
            `stream_limited` is max_streams_per_user -- which usually means a label was promoted
            that should have stayed a field. Raise the bound or fix the cause; do not ignore it.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (reason) (rate(loki_write_dropped_entries_total{reason=~"rate_limited|stream_limited"}[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__


  # ===============================================================================================
  # THE HOST. The databases, the metrics store and the log store share one volume, and a full
  # disk stops all of them at once: Postgres refuses writes, Prometheus refuses samples, Loki
  # refuses lines. `node_filesystem_*` comes from the node_exporter collectors, which Alloy's
  # prometheus.exporter.unix runs.
  # ===============================================================================================
  - orgId: 1
    name: Host
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # -------------------------------------------------------------------------------------------
      # Free space on the root filesystem, as a fraction, per host. 15% for 15 minutes: Postgres
      # checkpoints and Loki compaction need headroom, and a store that has run out reports it as
      # a write error somewhere else. `mountpoint="/"` is where every data directory here lives;
      # a deployment that mounts data elsewhere edits this selector.
      # -------------------------------------------------------------------------------------------
      - uid: acs-host-disk-filling
        title: Host Disk Filling
        condition: C
        for: 15m
        # OK, not Alerting: a deployment without host metrics (observability.alloy.hostMetrics
        # off, or an external Prometheus that does not scrape nodes) has no series here.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            The root filesystem on {{ $labels.instance }} has {{ humanizePercentage $values.B }}
            free. Both databases, the metrics store and the log store write to it, and each of
            them stops when it is full. Prune backups, shorten retention, or grow the volume.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (instance) (
                  node_filesystem_avail_bytes{mountpoint="/"}
                  / node_filesystem_size_bytes{mountpoint="/"}
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]
              datasource:
                type: __expr__
                uid: __expr__


  # ===============================================================================================
  # THE CLUSTER. What the kubelet and cAdvisor report about the node and the pods on it, scraped
  # by Alloy (observability.alloy.kubeletMetrics). Every rule here is per node, per container or
  # per claim, and reads Prometheus. noDataState is OK throughout: a deployment that scrapes no
  # kubelet has no series here and that is not a condition.
  # ===============================================================================================
  - orgId: 1
    name: Cluster
    folder: Aber - Platform Infrastructure
    interval: 1m
    rules:

      # -------------------------------------------------------------------------------------------
      # Working set against the container's memory limit. Past 100% the kernel kills the process
      # and the kubelet restarts the container: an OOMKilled restart, with the daemon's queue and
      # the broker's session gone with it. Ten minutes at 90%: a checkpoint or a compaction peaks
      # and falls back; a leak does not.
      # -------------------------------------------------------------------------------------------
      - uid: acs-cluster-container-memory
        title: Container Near Memory Limit
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is at
            {{ humanizePercentage $values.B }} of its memory limit. Past it the kernel kills the
            process and the kubelet restarts the container. Raise the limit in the chart's
            resources for that workload, or find the growth.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (namespace, pod, container) (
                  container_memory_working_set_bytes{container!=""}
                  / on (namespace, pod, container)
                  (container_spec_memory_limit_bytes{container!=""} > 0)
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # Starts of one container in an hour, counted as changes of its start time (the cgroup and
      # runtime ids are dropped at collection, so a restart is a new value on one series). A
      # rollout is one; a crash loop is many, with the kubelet's back-off spacing them out.
      # -------------------------------------------------------------------------------------------
      - uid: acs-cluster-container-restarting
        title: Container Restarting
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has
            started {{ $values.B }} times in the last hour. The previous instance's last lines:
            kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (namespace, pod, container) (
                  changes(container_start_time_seconds{container!=""}[1h])
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # Used against capacity per PersistentVolumeClaim, as the kubelet measures the mounted
      # filesystem. On local-path every claim reports the node disk as its capacity and this
      # tracks Host Disk Filling; on a provisioner that sizes volumes it is the per-claim figure,
      # and a full claim stops one store while the node still has room.
      # -------------------------------------------------------------------------------------------
      - uid: acs-cluster-volume-filling
        title: Volume Filling
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Claim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
            {{ humanizePercentage $values.B }} full. The store on it stops when it is; grow the
            claim (the storage class must allow expansion), shorten that store's retention, or
            prune what it holds.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (namespace, persistentvolumeclaim) (
                  kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # MemAvailable against MemTotal per node. Below the kubelet's eviction threshold it evicts
      # pods by priority, and everything here has the same priority; below the kernel's it OOM
      # kills. Ten minutes under 10%: page cache is reclaimed first and that alone dips it.
      # -------------------------------------------------------------------------------------------
      - uid: acs-cluster-node-memory
        title: Node Memory Pressure
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            Node {{ $labels.instance }} has {{ humanizePercentage $values.B }} of its memory
            available. The kubelet evicts pods below its threshold and the kernel kills below
            its own. Lower the memory requests and limits of the stores, or give the node memory.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (instance) (
                  node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # Non-idle share of the node's cores, fifteen minutes above 90%. Nothing fails at full
      # CPU; everything slows, and the first thing to slow is the ingestion writer, whose own
      # rule fires next. This one says why.
      # -------------------------------------------------------------------------------------------
      - uid: acs-cluster-node-cpu
        title: Node CPU Saturated
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            Node {{ $labels.instance }} has been {{ humanizePercentage $values.B }} busy for
            fifteen minutes. The Cluster dashboard's CPU by Pod panel says which workload;
            the historian's continuous aggregates and Loki's compaction are the usual ones.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              datasource:
                type: __expr__
                uid: __expr__

  # ===============================================================================================
  # DATABASES: the two PostgreSQL servers, from the postgres_exporter sidecar in each database pod.
  #
  # EVERY RULE HERE IS `noDataState: OK`, AND THAT IS A DELIBERATE CHOICE WITH A KNOWN COST.
  # `databaseMetrics.enabled` can be turned off, and this file is provisioned whatever it is set to
  # -- a static file, not a template. With the exporters gone every series below is absent, and
  # `OK` is what keeps six rules from alerting forever about a measurement the operator declined.
  # The cost is recorded on the "not observed" rule, which is the one it weakens.
  #
  # The `job` label is the pod's component, as the chart's Alloy writes it: `supabase-db` and
  # `timescaledb`. Each rule is multi-dimensional on it, so one alert instance per database.
  # ===============================================================================================
  - orgId: 1
    name: Databases
    folder: Aber - Platform Infrastructure
    # 1m, like the other Prometheus groups. Nothing here moves faster: the slowest is transaction-ID
    # age, which takes days, and the fastest is a connection count already smoothed by `for: 5m`.
    interval: 1m
    rules:

      # -------------------------------------------------------------------------------------------
      # 1. CONNECTIONS NEAR THE LIMIT. Past `max_connections` PostgreSQL refuses new connections
      # outright, and every client sees it at once: PostgREST's pool, the ingestion daemon's writer,
      # the edge functions. There is no degradation before it, which is why the alert is at 80%
      # rather than at the wall.
      #
      # THE DENOMINATOR IS A CUSTOM QUERY, not the exporter's `settings` collector -- that one is
      # off because it emits a series per GUC. `aber_postgres_max_connections` is the single number
      # that collector was wanted for.
      #
      # `for: 5m` because a connection count is spiky by nature: a rollout opens a pool, a backup
      # opens its own. Five minutes at 80% is a pool that is not going to drain on its own.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-connections
        title: Database Connections Near Limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} is at {{ humanizePercentage $values.B }} of max_connections and has
            been for five minutes. At 100% it refuses every new connection at once -- PostgREST's
            pool, the ingestion writer and the edge functions together. Find what is holding them
            open (the Backends by State panel separates `idle in transaction` from `active`) before
            raising max_connections.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (job) (pg_stat_activity_count)
                / on (job)
                max by (job) (aber_postgres_max_connections)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 2. DEADLOCKS. The correct number is zero. A deadlock is two transactions taking the same
      # locks in different orders; PostgreSQL resolves it by killing one, so the DATABASE considers
      # the matter closed and only the application sees an error. Nothing restates it afterwards.
      #
      # `for: 0s` BECAUSE THE WINDOW IS THE DELAY. `increase(...[10m])` already requires the
      # deadlock to have happened within ten minutes; a `for` on top would mean the condition has to
      # persist, and a single deadlock does not persist -- it happens once and the rule would never
      # fire. The same reasoning as the enrolment and CA-expiry rules above.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-deadlocks
        title: Database Deadlocks
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has recorded {{ $values.B }} deadlock(s) in the last ten minutes.
            PostgreSQL resolved each by killing one transaction, so the database is healthy and an
            application saw an error it may not have logged. Two transactions are taking the same
            locks in different orders.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (job) (increase(pg_stat_database_deadlocks[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 3. TRANSACTION ID AGE. At 2^31 (~2.147e9) PostgreSQL stops accepting writes CLUSTER-WIDE and
      # will only come back after a single-user-mode vacuum. It is the one condition here that ends
      # in downtime measured in hours, and it approaches slowly enough to be entirely preventable --
      # which is why an alert exists at all.
      #
      # THE METRIC IS NOT SECONDS. `pg_database_wraparound_age_datfrozenxid_seconds` is
      # `age(datfrozenxid)`, a TRANSACTION COUNT; the suffix is an upstream misnomer. Verified
      # against the server: the metric read 222470 while `age(datfrozenxid)` was 222470 and the
      # postmaster had been up 477 seconds. DO NOT "correct" the threshold below into a duration.
      #
      # 1e9 is half the wall and five times `autovacuum_freeze_max_age` (200M by default), so
      # reaching it means autovacuum has not merely fallen behind but has been prevented -- almost
      # always by a long-lived transaction or an abandoned replication slot.
      #
      # `for: 15m` is a scrape-blip guard and nothing more. This number moves in one direction, over
      # days; waiting longer would only delay a warning that is already deliberately early.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-wraparound
        title: Transaction ID Wraparound Approaching
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has a transaction ID age of {{ $values.B }} (TRANSACTIONS, not
            seconds). PostgreSQL refuses all writes at about 2.147e9 and recovers only in
            single-user mode. Autovacuum is being prevented from freezing -- look for a long-lived
            transaction or an inactive replication slot, then let autovacuum catch up.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                max by (job) (pg_database_wraparound_age_datfrozenxid_seconds)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1000000000]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 4. A HISTORIAN POLICY JOB IS FAILING. This is the "is the telemetry lifecycle keeping up?"
      # question #150 was filed about, and it is the one failure here with NO OTHER SYMPTOM: a
      # retention job that stops running leaves the volume growing, a compression job that stops
      # leaves it growing faster, and a continuous-aggregate refresh that stops leaves the rollups
      # silently behind the raw data while every dashboard built on them keeps drawing.
      #
      # ON THE FAILURE COUNT RISING, not on the last run's status. `last_run_succeeded` is 0 both
      # for a job that failed and for one that has never run -- `policy_telemetry` is in the second
      # state on every fresh stack -- so alerting on it would fire on every install. An increase in
      # `failures_total` cannot be that: it requires a run that happened and went wrong.
      #
      # `for: 0s`, as with deadlocks: the one-hour window is the tolerance. Labelled with the job id
      # AND the procedure, because the id is what `timescaledb_information.jobs` is queried by and
      # the procedure is what tells an operator which policy stopped.
      #
      # `and on (job_id) aber_historian_job_runs_total` RESTRICTS THIS TO JOBS THAT STILL EXIST, and
      # it is not tidiness. TimescaleDB re-creates its policy jobs with NEW IDS every time the
      # maintenance hook runs, which is every helm upgrade -- so the one-hour window accumulates the
      # ids from every upgrade in the last hour. Measured on the dev stack mid-build: 10 jobs
      # actually existed and the rule was evaluating 66 instances. An `and` against an INSTANT
      # selector filters to series with a recent sample, taking it back to 10.
      #
      # The instance count is the lesser half. A job that failed and was then re-created under a new
      # id would go on alerting under the OLD one for an hour, naming a job_id an operator would
      # look up in `timescaledb_information.jobs` and not find -- which reads as the alert being
      # wrong rather than as the job having been replaced.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-historian-job-failing
        title: Historian Policy Job Failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            TimescaleDB job {{ $labels.job_id }} ({{ $labels.proc_name }}) has failed
            {{ $values.B }} time(s) in the last hour. Retention, compression and rollup refresh are
            what keep the historian's storage and its aggregates true; a failing policy has no other
            symptom until the volume fills or a dashboard quietly goes stale. Check the job's last
            error: SELECT * FROM timescaledb_information.job_stats WHERE job_id = {{ $labels.job_id }};
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                sum by (job_id, proc_name) (increase(aber_historian_job_failures_total[1h]))
                and on (job_id) aber_historian_job_runs_total
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 5. A DATABASE IS NOT ANSWERING. `pg_up` is the exporter's own verdict on the connection it
      # opens over loopback, so 0 means the sidecar is running and the server beside it did not
      # answer -- a server that is down, still starting, in recovery, or refusing connections
      # because rule 1 went unheeded.
      #
      # WHAT THIS RULE CANNOT SEE, stated because `noDataState: OK` is what makes it blind: if the
      # POD is gone, Alloy stops discovering it, the series stop existing, and this evaluates NoData
      # and reports OK. That case belongs to the Cluster group -- Container Restarting and the
      # workload rules beside it -- which reads cAdvisor and does not depend on this exporter. The
      # alternative, `noDataState: Alerting`, would make all six rules in this group fire forever on
      # any stack running with `databaseMetrics.enabled: false`, which is a supported configuration.
      #
      # `for: 5m` rides out a rolling restart of the database StatefulSet, which is a normal upgrade
      # and takes well under that.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-not-answering
        title: Database Not Answering
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          entity_type: platform
        annotations:
          summary: >-
            {{ $labels.job }} has not answered its own exporter for five minutes. The exporter runs
            beside the server in the same pod and connects over loopback, so this is the database
            itself: down, still recovering, or out of connections. Nothing reaches it either --
            check the pod: kubectl -n aber logs {{ $labels.job }}-0 -c {{ $labels.job }}
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (job) (pg_up)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__

      # -------------------------------------------------------------------------------------------
      # 6. A COLLECTOR IS FAILING, which is the rule that keeps the other five honest.
      #
      # THE EXPORTER DOES NOT FAIL A SCRAPE WHEN A COLLECTOR FAILS. It logs an error, keeps serving,
      # and `pg_exporter_last_scrape_error` stays 0 -- so that collector's series simply stop
      # existing, every panel drawn on them goes empty, and every rule written against them
      # evaluates NoData and reports OK. A monitoring stack that has quietly stopped monitoring
      # part of its subject, which is the exact failure `templates/obs/servicemonitors.yaml`
      # refuses to create a ServiceMonitor for.
      #
      # BOTH FAILURES THIS CLASS PRODUCES WERE OBSERVED WHILE #150 WAS BUILT: `stat_statements`
      # against a database where the extension was not loaded, and `wal` under a role whose
      # pg_monitor grant was held without INHERIT. In both cases this gauge was the only signal.
      #
      # `for: 10m` because a collector can fail once on a statement timeout during a checkpoint and
      # recover by itself; ten minutes of continuous failure is configuration, not load.
      # -------------------------------------------------------------------------------------------
      - uid: acs-db-collector-failing
        title: Database Collector Failing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          entity_type: platform
        annotations:
          summary: >-
            The `{{ $labels.collector }}` collector on {{ $labels.job }} has failed for ten minutes.
            The exporter is still serving and the scrape still succeeds, so every panel and rule
            built on that collector's series is now silently empty rather than reporting a problem.
            Usually a missing extension or a privilege the exporter's role does not hold --
            kubectl -n aber logs {{ $labels.job }}-0 -c metrics names the cause.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: >-
                min by (job, collector) (pg_scrape_collector_success)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              datasource:
                type: __expr__
                uid: __expr__
