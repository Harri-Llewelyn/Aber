{{- if .Values.autoscaling.enabled }}
{{- $fullname := include "aber.fullname" . -}}
{{/*
=================================================================================================
HorizontalPodAutoscalers -- FOUR COMPONENTS, AND ONLY THESE FOUR.

  supabase-rest       PostgREST: stateless, a connection pool per replica
  supabase-kong       the gateway: declarative config, no state
  supabase-functions  the edge runtime: a request router, workers are per-request isolates
  frontend            NGINX serving static files

EVERYTHING ELSE IS SINGLE-WRITER, and `aber.validateAutoscaling` REFUSES to render an HPA for
one rather than warning. The reasons are per-component and recorded in each manifest, but they
share the shape that makes refusal right: THE DAMAGE IS SILENT -- no error, no crash, no alert,
just wrong data, arrived at under load, and by then the duplicate audit rows are permanent.

  ingestion          a plain paho subscribe with no shared-subscription group, so every replica
                     consumes every message: duplicate telemetry rows (each stamps its own
                     timestamp, so ON CONFLICT DO NOTHING does not dedupe), duplicate quarantine
                     decisions, duplicate rows in an APPEND-ONLY audit table
  node-red           /data holds the live flow, the credentials, editor sessions and the user map
  mosquitto          does not cluster: two brokers behind one Service split the fleet, and
                     Sparkplug birth/death and sequence state is per-connection
  realtime           holds a logical replication slot
  supabase-storage   a single writer on a ReadWriteOnce PVC
  grafana            SQLite on a ReadWriteOnce PVC
  supabase-db        one Postgres instance with no replication
  timescaledb        likewise

REQUIRES metrics-server. Without it the HPA reports `<unknown>` for every metric and never scales,
which looks like the HPA being ignored rather than the metrics source being absent. CI's k3d
cluster disables it deliberately, which is one reason autoscaling is off by default.

TARGET IS THE DEPLOYMENT NAME, which here is the plain component name -- Services and Deployments
are not release-prefixed (_helpers.tpl). An HPA pointed at a prefixed name reports `FailedGetScale`.
=================================================================================================
*/}}
{{/*
THIS TABLE AND THE ALLOW-LIST MUST NAME THE SAME FOUR, and the check below is what makes that true
rather than merely intended. `aber.validateAutoscaling` refuses any component outside
`aber.autoscalableWorkloads` (issue #31): a name there and not here would pass validation and
render no HPA, which is that issue's silent failure one level down. A name here and not there is
unreachable code.

Values lookups cannot be derived from names -- `.Values.supabaseRest.enabled` is not spelled like
its component -- so the mapping is written out and then ASSERTED.

THE ASSERTION COMPARES NAMES AND CANNOT SEE A DEAD VALUES PATH. `supabase-kong` sat here until
b7989a0 deleted Kong and its values block; both sides still agreed, so the check passed and the
render died a line earlier on a nil pointer -- and only under `autoscaling.enabled`, which is
values-prod.yaml.example alone. A name removed from one side belongs removed from the other AND
checked against a production render.
*/}}
{{- $enabledOf := dict
      "supabase-rest" .Values.supabaseRest.enabled
      "supabase-envoy" .Values.supabaseEnvoy.enabled
      "supabase-functions" .Values.supabaseFunctions.enabled
      "frontend" .Values.frontend.enabled
-}}
{{- $allowed := keys (include "aber.autoscalableWorkloads" . | fromYaml) -}}
{{- if ne (join "," (sortAlpha $allowed)) (join "," (sortAlpha (keys $enabledOf))) -}}
{{- fail (printf "\n\naber: the HPA dispatch table and the autoscaling allow-list disagree.\n\n  allow-list (_helpers.tpl): %v\n  dispatch table (hpas.yaml): %v\n\nA name in the allow-list but not the table passes validation and then renders no HPA, silently --\nwhich is the failure issue #31 removed. Add it to both, or to neither.\n" (sortAlpha $allowed) (sortAlpha (keys $enabledOf))) -}}
{{- end -}}
{{- range .Values.autoscaling.components }}
{{/*
  ASKED FOR AND TURNED OFF IS AN ERROR, not a no-op. As a bare `if`, a component in the allow-list
  whose workload was disabled rendered NO HPA AND NO ERROR -- issue #31's symptom through a third
  door: a known name for something not deployed.

  NARROWED TO NAMES THIS TABLE CARRIES. A bare `not (index ...)` is also true for a name the table
  has never heard of, so it fired for every single-writer workload and swallowed
  `aber.validateAutoscaling`'s message, which is the one that says WHY. CI asserts that a
  refused single-writer names "SINGLE-WRITER workload".
*/}}
{{- if and (hasKey $enabledOf .) (not (index $enabledOf .)) }}
{{- fail (printf "\n\naber: autoscaling.components includes %q, but that workload is DISABLED.\n\nAn HPA cannot scale a Deployment the chart does not render, so this would have produced no\nHorizontalPodAutoscaler and no error -- the component would sit at its fixed replica count while\nthe values file said it scaled. Refused rather than ignored, because the symptom only appears\nunder load.\n\nEither enable it, or take it out of autoscaling.components. The gateway's name is supabase-envoy.\n" .) }}
{{- end }}
{{- if index $enabledOf . }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-%s" $fullname . }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" $ "component" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Not release-prefixed -- see the note above.
    name: {{ . }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
    {{/*
      UTILIZATION IS A PERCENTAGE OF THE REQUEST, so a memory target only means anything because
      every one of these components declares `resources.requests.memory`. An HPA with a utilization
      target against a container with no request reports `<unknown>` forever and never scales.

      TWO TEMPLATE-COMMENT TRAPS:
        1. A closing delimiter carrying a leading dash chomps the following newline, joining the
           next YAML list item onto the previous line. It is reported as "mapping values are not
           allowed in this context" at a line number in the RENDERED output. Use the non-chomping
           close, as here.
        2. A comment must not CONTAIN its own closing delimiter: Go templates end at the first
           occurrence, so the remaining prose leaks into the YAML as garbage tokens. Hence this
           paragraph describes the delimiters rather than showing them.
    */}}
    {{- if $.Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      # Five minutes, against Kubernetes' three. These sit behind an ingress serving interactive
      # traffic, and a shopfloor dashboard's load is bursty -- a tighter window trades a little
      # memory for repeated scale-down/scale-up cycles during a shift change.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
{{- end }}
{{- end }}
{{- end }}
