{{- if .Values.frontend.enabled }}
{{- $component := "frontend" -}}
{{- $fullname := include "aber.fullname" . -}}
{{- /*
Built once, used twice: in the ConfigMap below and in the Deployment's checksum annotation.

NOT via `include $.Template.BasePath "/apps/frontend.yaml"` -- the pattern used elsewhere in this
chart to checksum a ConfigMap from the workload that mounts it. That works only when the two live in
DIFFERENT files; here they share one, and a template that includes itself recurses until Helm dies.
*/ -}}
{{- /*
The i3X server for the Issue Token dialog: the helper the i3x Ingress host is built from, blank
where the chart publishes no i3X server, so the dialog never names an address that goes nowhere.
CI's "Verify The Dashboard Names The i3X Server The Ingress Routes" holds it to the Ingress host.
*/ -}}
{{- $i3xUrl := "" -}}
{{- if and .Values.i3xService.enabled (ne (index .Values.ingress.routes "i3x") false) -}}
{{- $i3xUrl = include "aber.i3xUrl" . -}}
{{- end -}}
{{- $config := printf `// Generated by the aber Helm chart. Mounted over the image's placeholder.
window.__ABER_CONFIG__ = window.__ABER_CONFIG__ || {
  // The gateway as the BROWSER reaches it -- never http://supabase-envoy:8000, which resolves
  // inside the cluster and for nothing outside it.
  VITE_SUPABASE_URL: %q,
  // The key the browser presents at the gateway; public by construction.
  VITE_SUPABASE_PUBLISHABLE_KEY: %q,
  VITE_ENABLE_REALTIME: %q,
  VITE_GITHUB_REPO_URL: %q,
  // Grafana as the BROWSER reaches it, for the "View in Grafana" links on active alerts.
  //
  // THE SAME HELPER GRAFANA'S OWN root_url AND ITS OAUTH redirect_uris ARE BUILT FROM, so there is no
  // separate value to set and the link cannot point somewhere the login does not. It resolves empty
  // on a data-tier install with no publicUrls.grafana and no publicBaseDomain -- src/config.js reads
  // blank as "not supplied" and constants.js then falls back to localhost:3002, which is a wrong link
  // on a cluster but is exactly as wrong as the alternative and does not throw.
  VITE_GRAFANA_URL: %q,
  // Studio's door, and the dashboard uses it for ONE thing: ending Studio's own gateway-held
  // session at sign-out. The same helper the studio Ingress host is built from, so the address the
  // beacon uses is the address the session was opened on -- which matters more here than for the
  // link above, because a host mismatch answers 302 and clears nothing.
  //
  // NO BACKTICKS ANYWHERE IN THIS BLOCK. The whole config above is one printf template delimited by
  // backticks, so a quoted identifier in a COMMENT ends the string and Helm fails to parse the file.
  //
  // IT DOES NOT TRACK routes.studio, and deliberately not. The helper answers the address Studio
  // WOULD have, so with publicBaseDomain set this renders studio.<domain> even on the default
  // install where that route is off and nothing answers there. That is harmless and is the honest
  // shape: whether a host resolves is a fact about the cluster at sign-out time, not one the chart
  // can settle at render time, and the beacon already treats unreachable and absent identically.
  // It renders empty only where no browser-facing address exists at all -- a data-tier install with
  // neither publicUrls.studio nor publicBaseDomain -- and src/config.js reads blank as "not
  // supplied", falling back to a localhost address no cluster can reach. Every one of those paths
  // ends the same way: the beacon times out and the local sign-out proceeds.
  VITE_STUDIO_URL: %q,
  // The forge's door: the same helper Gitea's ROOT_URL and the gitea Ingress host are built from,
  // so the repository link in the gateway drawer names the address the login was opened on.
  VITE_GITEA_URL: %q,
  // The i3X server as a client reaches it, without /v1: the Issue Token dialog's setups name it.
  // Blank when i3xService or its route is off, and the dialog then leaves the address out.
  VITE_I3X_URL: %q,
  // Storage buckets, from the same values scripts/storage-init.mjs creates them with -- so a
  // rename moves the dashboard with the bucket instead of leaving it on the old name.
  VITE_MODEL_3D_BUCKET: %q,
  VITE_CAPTURE_BUCKET: %q,
  // What this RELEASE is, against which the bundle states what IT is (src/version.js). The account
  // menu compares them, so a browser on a page cached from before an upgrade -- or an image.tag
  // pinned away from appVersion -- says so instead of looking current.
  VITE_RELEASE_VERSION: %q,
  // The window the backup service prunes by, so the Backups page can say why an older one is kept.
  VITE_BACKUP_RETENTION_DAYS: %q,
  // true while timescaledb.physicalBackup is on: the Backups page shows the historian's own backup.
  VITE_HISTORIAN_PHYSICAL_BACKUP: %q,
  // true while supabaseDb.physicalBackup is on: the Backups page shows the platform database's own backup.
  VITE_PLATFORM_PHYSICAL_BACKUP: %q,
  // playback.enabled. false: the playback worker is not deployed, and the Capture page says so.
  VITE_PLAYBACK_ENABLED: %q,
  // ingestion.primaryHostId, which a Third-party gateway's engineer configures as its primary host.
  // Public by nature: every gateway on the site reads it from a topic. The value, not the helper
  // that fails on a blank one, so a release that runs no ingestion still renders.
  VITE_PRIMARY_HOST_ID: %q,
};
`
  (include "aber.supabaseUrl" .)
  .Values.secrets.publishableKey
  (.Values.frontend.enableRealtime | toString)
  .Values.frontend.githubRepoUrl
  (include "aber.grafanaUrl" .)
  (include "aber.studioUrl" .)
  (include "aber.giteaUrl" .)
  $i3xUrl
  .Values.supabaseStorage.bucket
  .Values.supabaseStorage.captureBucket
  .Chart.AppVersion
  (.Values.backup.retentionDays | toString)
  (include "aber.physicalBackupOn" .)
  (include "aber.platformBackupOn" .)
  (.Values.playback.enabled | toString)
  (.Values.ingestion.primaryHostId | default "" | toString) -}}
{{- /*
The Content-Security-Policy, as one nginx add_header line mounted over the image's empty include.
It names what config.js hands the bundle: the API (Realtime over its WebSocket scheme) and the
Studio and forge doors the sign-out beacons fetch. blob: and data: are the 3D viewer's textures and
buffers. help/site/running-the-server.md, *What a browser may load*, says what each directive is
for.
*/ -}}
{{- $cspMode := dig "contentSecurityPolicy" "mode" "enforce" .Values.frontend -}}
{{- if not (has $cspMode (list "enforce" "report-only")) }}
{{- fail (printf "\n\naber: frontend.contentSecurityPolicy.mode is %q.\n\nGive enforce (the default) or report-only.\n" $cspMode) }}
{{- end }}
{{- $connect := list "'self'" -}}
{{- with include "aber.supabaseUrl" . }}
{{- $u := urlParse . -}}
{{- $connect = append $connect (printf "%s://%s" $u.scheme $u.host) -}}
{{- $connect = append $connect (printf "%s://%s" (ternary "wss" "ws" (eq $u.scheme "https")) $u.host) -}}
{{- end }}
{{- range $door := list (include "aber.studioUrl" .) (include "aber.giteaUrl" .) }}
{{- if $door }}
{{- $u := urlParse $door -}}
{{- $connect = append $connect (printf "%s://%s" $u.scheme $u.host) -}}
{{- end }}
{{- end }}
{{- $connect = concat $connect (list "blob:" "data:") | uniq -}}
{{- /* The one inline stylesheet the dashboard has: the <style> in the 3D viewer's shadow DOM
       (@google/model-viewer's lib/template.js). Check 68 hashes it from the installed package, so
       an upgrade that changes it fails there rather than leaving the viewer unstyled. */ -}}
{{- $modelViewerStyle := "'sha256-F7kvx28zBT3UUQL/hTOYst+55RSmqyCY3muSCYmt6A4='" -}}
{{- $policy := join "; " (list
  "default-src 'self'"
  "script-src 'self' 'wasm-unsafe-eval'"
  "worker-src 'self' blob:"
  (printf "connect-src %s" (join " " $connect))
  "img-src 'self' data: blob:"
  (printf "style-src 'self' %s" $modelViewerStyle)
  "font-src 'self'"
  "frame-ancestors 'none'"
  "base-uri 'self'"
  "form-action 'self'"
  "object-src 'none'") -}}
{{- $csp := printf "# Generated by the aber Helm chart from frontend.contentSecurityPolicy.mode: %s.\nadd_header %s \"%s\" always;\n"
  $cspMode
  (ternary "Content-Security-Policy" "Content-Security-Policy-Report-Only" (eq $cspMode "enforce"))
  $policy -}}
---
{{/*
=================================================================================================
THE RUNTIME CONFIGURATION -- this ConfigMap is the whole point of §2.1.

The frontend image is built with VITE_RUNTIME_CONFIG=true, which bakes NOTHING. Vite inlines
`import.meta.env` at build time, so a baked bundle carries whichever Supabase URL it was built
against wherever it is deployed -- which defeats build-once/promote-the-artefact, the main reason to
be on Kubernetes at all.

This file is mounted OVER the shipped no-op placeholder at /usr/share/nginx/html/config.js.
index.html loads it from <head> as a plain classic script, so it executes before the deferred module
bundle and src/config.js reads it from window.__ABER_CONFIG__.

KEYS ARE THE `VITE_*` NAMES, unchanged from the Dockerfile build args -- there is no second
vocabulary to keep in step. src/config.js's RUNTIME_SETTING_NAMES is the authoritative list and
runtimeConfig.test.js asserts it matches public/config.js.

THE ANON KEY HERE IS NOT A LEAK. It is the `anon` role, public by construction, and already readable
in any built bundle -- which is exactly why it can move from the image to a ConfigMap without
changing what is exposed. Note this is the one place the chart puts it in a ConfigMap rather than a
Secret, and that is deliberate: a Secret would imply a confidentiality this value does not have.
=================================================================================================
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-frontend-config" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  config.js: |
{{ $config | indent 4 }}
  content-security-policy.conf: |
{{ $csp | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # 3000 in the container, matching nginx.conf's `listen 3000`.
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  # THE ONE COMPONENT HERE THAT SCALES FREELY: NGINX serving static files, no state, no upstream
  # connection pool, nothing per-instance. Default 2 for availability during a rollout; the first
  # HPA candidate alongside the gateway and PostgREST.
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # ROLL ON A CONFIG CHANGE. NGINX serves config.js `no-store` so no browser caches it, but
        # the file is mounted with subPath (see below), and a subPath mount NEVER receives ConfigMap
        # updates from the kubelet. Without this annotation, changing the Supabase URL would update
        # the ConfigMap and leave every running pod serving the old one indefinitely.
        checksum/config: {{ $config | sha256sum }}
        # nginx reads the policy once at start, from a subPath mount as well.
        checksum/content-security-policy: {{ $csp | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's nginx user; it listens on 3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # BUILT WITH VITE_RUNTIME_CONFIG=true:
          #   docker build -f frontend/Dockerfile --build-arg VITE_RUNTIME_CONFIG=true \
          #     --build-context help=./help -t <repo>:<tag> frontend
          #
          # A default-built (baked) image also works here -- src/config.js prefers the runtime value
          # and falls through to the baked one -- but it carries whatever URL it was built with as a
          # fallback, which MASKS a missing ConfigMap instead of surfacing it.
          image: {{ include "aber.image" (dict "image" .Values.frontend.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Substituted into nginx.conf at start; empty, and so not sent, unless global.scheme is https.
            - name: ABER_STRICT_TRANSPORT_SECURITY
              value: {{ include "aber.strictTransportSecurity" . | quote }}
          # Static files behind NGINX: readiness and liveness are the same question, and `/` is
          # served from disk with no upstream, so there is nothing cheaper or more meaningful to
          # probe. try_files falls back to index.html, so any path would answer -- `/` is honest.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # What nginx writes: its pid (/tmp), its temp directories (/var/cache/nginx), and the
            # entrypoint's render of nginx.conf (conf.d, which the image leaves empty).
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            # subPath, so this replaces ONE FILE rather than mounting over the whole web root --
            # mounting the directory would hide index.html and every hashed asset beside it. The
            # cost is that subPath mounts do not auto-update, which the checksum annotation covers.
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            # Over the image's empty include, which nginx.conf names.
            - name: config
              mountPath: /etc/nginx/aber/content-security-policy.conf
              subPath: content-security-policy.conf
              readOnly: true
            {{- if .Values.ingress.tls.enabled }}
            {{- /* THE PLATFORM'S ROOT, served over plain HTTP at a static path for the one-liner's
                   stage 0 (help/site/remote-gateways.md): a fresh appliance fetches it as inert bytes,
                   checks it against the pin the dashboard minted, and only then trusts TLS to the
                   API. A directory mount holding ONE projected key -- never the Secret whole, which
                   also holds tls.key. Optional, so the pod starts before cert-manager has issued;
                   the kubelet fills the directory when the Secret appears. */}}
            - name: platform-root
              mountPath: /usr/share/nginx/html/.well-known/aber
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-frontend-config" $fullname }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        {{- if .Values.ingress.tls.enabled }}
        - name: platform-root
          secret:
            secretName: {{ .Values.ingress.tls.secretName }}
            optional: true
            items:
              - key: ca.crt
                path: ca.pem
        {{- end }}
{{- end }}
