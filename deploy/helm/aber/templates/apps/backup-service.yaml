{{- if and .Values.backup.enabled .Values.backupService.enabled }}
{{- $component := "backup-service" -}}
{{- $secretName := include "aber.secretName" . -}}
{{- $fullname := include "aber.fullname" . -}}
{{- $archiveStorage := eq (include "aber.backupStorageArchiveJob" .) "true" -}}
{{- $archiveCronJob := printf "%s-backup-storage-archive" $fullname -}}
{{- $includeForge := and .Values.backup.includeForge .Values.gitea.enabled -}}
{{- $includeBroker := and .Values.backup.includeBroker .Values.mosquitto.enabled -}}
{{- /* The forge's and the broker's volumes hold files other uids own at 0600: root reads them. */ -}}
{{- $asRoot := or $includeForge $includeBroker -}}
{{- $brokerClaim := .Values.mosquitto.persistence.existingClaim | default (printf "%s-mosquitto-data" $fullname) -}}
{{- $ca := .Values.backup.ca -}}
{{- $includeCa := and $ca.secretName $ca.namespace -}}
{{- $useApi := or $includeCa $archiveStorage -}}
{{/*
=================================================================================================
The backup service: a backup_jobs row (0101) becomes a tier 1 backup on the backup PVC.

Replaces the CronJob when enabled (backup-cronjob.yaml renders the PVC alone): the schedule moves
into pg_cron, registered by the service on backup.schedule, and a backup an Administrator asks
for on the Backups page runs the same way. Both dumps as their superusers, the storage objects,
the forge, the broker's data volume (its Dynamic Security document) and the internal CA's key
pair, one directory per backup, manifest included; retention from backup.retentionDays for
scheduled backups, and a requested one is pinned until released.

THE STORAGE OBJECTS ARE A JOB'S, NOT THIS POD'S: one Job per backup, made from the suspended
CronJob in jobs/backup-storage-archive.yaml, mounts the storage volume for one tar. This pod never
mounts it, so the storage pod gets its fsGroup when it starts (deploy/k8s/README.md, Users). The
Role below lets the service read that CronJob by name and create, read and delete Jobs, and list
pods to say why a Job failed. Nothing else in this namespace.

THE CA IS A SECRET IN ANOTHER NAMESPACE (the ClusterIssuer's; deploy/k8s/internal-ca.yaml keeps
it in cert-manager's), so it is read through the API rather than mounted: a ServiceAccount, and a
Role in that namespace granting `get` on that one Secret by name. Nothing wider: not `list`, which
resourceNames cannot restrict.

THE SAME BASE IMAGE AS THE DATABASE, for its pg_dump (the client must be at least the server's
version), plus node, sqlite3, GNU tar, age and the AWS CLI. The service's script is baked into
that image (backup-service/Dockerfile).

NO SERVICE OBJECT. Nothing calls it; the liveness probe reads /healthz on the pod. Nothing leaves
the PVC unencrypted: the off-site copy, when the Backups page sets a destination, is each file
encrypted with age to the operator's public key. Restore is the runbook in supabase/README.md.

CO-LOCATION. The storage PVC and the forge's are ReadWriteOnce, so including either requires this
pod on that pod's node -- the same podAffinity the CronJob carries, and required rather than
preferred for the same reason. For the storage volume it is the archive Job that mounts it beside
the backup volume, on this pod's node. Including both on a cluster where those two pods are on
different nodes leaves this one Pending, which is the honest outcome; the values file says so.
=================================================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-service
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  # One replica, Recreate: two services would each claim jobs. The single-flight index stops
  # them running two backups, but a rolling update would still leave one to fail the other's.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $useApi }}
      serviceAccountName: {{ printf "%s-backup-service" $fullname }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or $archiveStorage $includeForge $includeBroker }}
      {{/*
        The storage, forge and broker volumes are ReadWriteOnce, so this pod has to sit on their
        node; the storage archive Job follows it there, to mount the backup volume beside the
        storage volume. ONE term naming every component it follows: two required terms, one per
        component, leave the pod Pending on k3s v1.35 ("didn't match pod affinity rules") even on a
        single node where both run, measured 2026-09-12. A node-bound volume (local-path) pins the
        pod as well; this is what carries the intent where the storage class does not.
      */}}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "aber.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      {{- if $archiveStorage }}
                      - supabase-storage
                      {{- end }}
                      {{- if $includeForge }}
                      - gitea
                      {{- end }}
                      {{- if $includeBroker }}
                      - mosquitto
                      {{- end }}
      {{- end }}
      {{/*
        The image's postgres user, unless the service archives the forge or the broker: then root,
        with DAC_OVERRIDE below. As 100, fsGroup `Always`, not OnRootMismatch: a backup directory
        written as root (by 1.2.0, or while either volume was included) is pruned as 100 only once
        the kubelet has given group 101 write on everything in it, at every start. As root, group
        101 too: with no CAP_CHOWN, root may still give a backup's directory to a group it is in,
        which is how the storage archive Job, as 100:101, may write into it.
      */}}
      securityContext:
        {{- if $asRoot }}
        runAsUser: 0
        {{- if $archiveStorage }}
        supplementalGroups: [101]
        {{- end }}
        {{- else }}
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: Always
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup-service
          image: {{ include "aber.image" (dict "ctx" . "image" .Values.backupService.image) | quote }}
          imagePullPolicy: {{ .Values.backupService.image.pullPolicy }}
          command: ["node", "/opt/aber/backup-service.mjs"]
          env:
            {{- with include "aber.dbClientTlsEnv" . }}{{ . | nindent 12 }}{{- end }}
            - name: SUPABASE_DB_HOST
              value: {{ include "aber.supabaseDb.host" . | quote }}
            - name: SUPABASE_DB_PORT
              value: {{ include "aber.supabaseDb.port" . | quote }}
            {{- include "aber.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: TIMESCALE_HOST
              value: {{ include "aber.timescale.host" . | quote }}
            - name: TIMESCALE_PORT
              value: {{ include "aber.timescale.port" . | quote }}
            - name: TIMESCALE_USER
              value: {{ .Values.timescaledb.username | quote }}
            - name: TIMESCALE_DB
              value: {{ .Values.timescaledb.database | quote }}
            {{- include "aber.secretEnv" (dict "name" "TIMESCALE_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            # false while pgBackRest backs the historian up (timescaledb.physicalBackup): the manifest
            # records timescaledb=physical instead of a dump.
            - name: DUMP_TIMESCALE
              value: {{ ternary "false" "true" (not (not (include "aber.physicalBackupOn" .))) | quote }}
            - name: BACKUP_DIR
              value: /backups
            - name: BACKUP_RETENTION_DAYS
              value: {{ .Values.backup.retentionDays | quote }}
            - name: BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            - name: BACKUP_FORMAT
              value: {{ .Values.backupService.format | quote }}
            # An empty path disables the component; the manifest records its absence. The storage
            # objects are never mounted here: STORAGE_ARCHIVE_CRONJOB names the archive Job's template.
            - name: STORAGE_PATH
              value: ""
            - name: STORAGE_ARCHIVE_CRONJOB
              value: {{ ternary $archiveCronJob "" $archiveStorage | quote }}
            {{- if $archiveStorage }}
            # The Job's activeDeadlineSeconds too; the service waits a minute longer.
            - name: STORAGE_ARCHIVE_TIMEOUT_SECONDS
              value: {{ int .Values.backupService.storageArchive.timeoutSeconds | quote }}
            # The Job is made in this namespace and pinned to this node, which holds the backup volume.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            - name: FORGE_PATH
              value: {{ ternary "/forge" "" $includeForge | quote }}
            - name: BROKER_PATH
              value: {{ ternary "/broker" "" $includeBroker | quote }}
            # Both empty disables the component; the manifest records its absence.
            - name: CA_SECRET_NAME
              value: {{ ternary $ca.secretName "" (not (not $includeCa)) | quote }}
            - name: CA_SECRET_NAMESPACE
              value: {{ ternary $ca.namespace "" (not (not $includeCa)) | quote }}
          ports:
            - name: healthz
              containerPort: 9020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if $asRoot }}
              # Archives the forge's and the broker's volumes, whose files belong to uids 1000 and
              # 1883, some at 0600.
              add: ["DAC_OVERRIDE"]
              {{- end }}
          resources:
            {{- toYaml .Values.backupService.resources | nindent 12 }}
          volumeMounts:
            {{- with include "aber.dbClientCaMount" . }}{{ . | nindent 12 }}{{- end }}
            - name: backups
              mountPath: /backups
            # The aws CLI's config for an off-site copy; everything else is written to /backups.
            - name: tmp
              mountPath: /tmp
            {{- if $includeForge }}
            - name: forge
              mountPath: /forge
              readOnly: true
            {{- end }}
            {{- if $includeBroker }}
            - name: broker
              mountPath: /broker
              readOnly: true
            {{- end }}
            {{- if $useApi }}
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
      volumes:
        {{- with include "aber.dbClientCaVolume" . }}{{ . | nindent 8 }}{{- end }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ printf "%s-backup" $fullname }}
        # Room for checking an off-site copy by hand: a fetched object and its decryption.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if $includeForge }}
        - name: forge
          persistentVolumeClaim:
            claimName: {{ printf "%s-gitea" $fullname }}
            readOnly: true
        {{- end }}
        {{- if $includeBroker }}
        - name: broker
          persistentVolumeClaim:
            claimName: {{ $brokerClaim }}
            readOnly: true
        {{- end }}
        {{- if $useApi }}
        # Projected, so the token is short-lived and rotated in place; the service reads it on
        # every call rather than caching it (the same arrangement as the credential service's).
        - name: sa-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
{{- if $useApi }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-backup-service" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if $archiveStorage }}
---
# The storage archive Jobs, in the release's namespace. The CronJob by name; Jobs by any name,
# since each carries its backup's stamp; pods listed only to say why a Job failed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-backup-service" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames:
      - {{ $archiveCronJob | quote }}
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-backup-service" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-backup-service" $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-backup-service" $fullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $includeCa }}
---
# In the CA's namespace, not the release's: a Role reaches only the namespace it is in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
  namespace: {{ $ca.namespace }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $ca.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
  namespace: {{ $ca.namespace }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-backup-service" $fullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
