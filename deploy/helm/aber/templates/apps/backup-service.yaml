{{- if and .Values.backup.enabled .Values.backupService.enabled }}
{{- $component := "backup-service" -}}
{{- $secretName := include "aber.secretName" . -}}
{{- $fullname := include "aber.fullname" . -}}
{{- $includeStorage := eq (include "aber.backupMountsStorage" .) "true" -}}
{{- $includeForge := and .Values.backup.includeForge .Values.gitea.enabled -}}
{{- $includeBroker := and .Values.backup.includeBroker .Values.mosquitto.enabled -}}
{{- $includeGrafana := and .Values.backup.includeGrafana .Values.grafana.enabled .Values.grafana.persistence.enabled -}}
{{- /* The forge's, the broker's and Grafana's volumes hold files other uids own, some at 0600:
       root reads them. */ -}}
{{- $asRoot := or $includeForge $includeBroker $includeGrafana -}}
{{- $brokerClaim := .Values.mosquitto.persistence.existingClaim | default (printf "%s-mosquitto-data" $fullname) -}}
{{- $ca := .Values.backup.ca -}}
{{- $includeCa := and $ca.secretName $ca.namespace -}}
{{/*
=================================================================================================
The backup service: a backup_jobs row (0101) becomes a tier 1 backup on the backup PVC.

Replaces the CronJob when enabled (backup-cronjob.yaml renders the PVC alone): the schedule moves
into pg_cron, registered by the service on backup.schedule, and a backup an Administrator asks
for on the Backups page runs the same way. Both dumps as their superusers, the storage objects,
the forge, the broker's data volume (its Dynamic Security document), Grafana's data volume and
the internal CA's key pair, one directory per backup, manifest included; retention from
backup.retentionDays for scheduled backups, and a requested one is pinned until released.

THE CA IS A SECRET IN ANOTHER NAMESPACE (the ClusterIssuer's; deploy/k8s/internal-ca.yaml keeps
it in cert-manager's), so it is read through the API rather than mounted: a ServiceAccount, and a
Role in that namespace granting `get` on that one Secret by name. Nothing wider: not `list`, which
resourceNames cannot restrict, and nothing in this namespace.

THE SAME BASE IMAGE AS THE DATABASE, for its pg_dump (the client must be at least the server's
version), plus node, sqlite3, GNU tar, age and the AWS CLI. The service's script is baked into
that image (backup-service/Dockerfile).

NO SERVICE OBJECT. Nothing calls it; the liveness probe reads /healthz on the pod. Nothing leaves
the PVC unencrypted: the off-site copy, when the Backups page sets a destination, is each file
encrypted with age to the operator's public key. Restore is the runbook in supabase/README.md.

CO-LOCATION. The storage, forge, broker and Grafana PVCs are ReadWriteOnce, so including any
requires this pod on that pod's node -- the same podAffinity the CronJob carries, and required
rather than preferred for the same reason. Including two on a cluster where those pods are on
different nodes leaves this one Pending, which is the honest outcome; the values file says so.
=================================================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-service
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  # One replica, Recreate: two services would each claim jobs. The single-flight index stops
  # them running two backups, but a rolling update would still leave one to fail the other's.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $includeCa }}
      serviceAccountName: {{ printf "%s-backup-service" $fullname }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or $includeStorage $includeForge $includeBroker $includeGrafana }}
      {{/*
        The storage, forge, broker and Grafana volumes are ReadWriteOnce, so this pod has to sit on
        their node. ONE term naming every component it follows: two required terms, one per
        component, leave the pod Pending on k3s v1.35 ("didn't match pod affinity rules") even on a
        single node where both run, measured 2026-09-12. A node-bound volume (local-path) pins the
        pod as well; this is what carries the intent where the storage class does not.
      */}}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "aber.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      {{- if $includeStorage }}
                      - supabase-storage
                      {{- end }}
                      {{- if $includeForge }}
                      - gitea
                      {{- end }}
                      {{- if $includeBroker }}
                      - mosquitto
                      {{- end }}
                      {{- if $includeGrafana }}
                      - grafana
                      {{- end }}
      {{- end }}
      {{/*
        The image's postgres user, unless the service archives the forge, the broker or Grafana:
        then root, with DAC_OVERRIDE below. As 100, fsGroup `Always`, not OnRootMismatch: a backup
        directory written as root (by 1.2.0, or while one of those volumes was included) is pruned
        as 100 only once the kubelet has given group 101 write on everything in it, at every start.
      */}}
      securityContext:
        {{- if $asRoot }}
        runAsUser: 0
        {{- else }}
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: Always
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup-service
          image: {{ include "aber.image" (dict "ctx" . "image" .Values.backupService.image) | quote }}
          imagePullPolicy: {{ .Values.backupService.image.pullPolicy }}
          command: ["node", "/opt/aber/backup-service.mjs"]
          env:
            {{- with include "aber.dbClientTlsEnv" . }}{{ . | nindent 12 }}{{- end }}
            - name: SUPABASE_DB_HOST
              value: {{ include "aber.supabaseDb.host" . | quote }}
            - name: SUPABASE_DB_PORT
              value: {{ include "aber.supabaseDb.port" . | quote }}
            {{- include "aber.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: TIMESCALE_HOST
              value: {{ include "aber.timescale.host" . | quote }}
            - name: TIMESCALE_PORT
              value: {{ include "aber.timescale.port" . | quote }}
            - name: TIMESCALE_USER
              value: {{ .Values.timescaledb.username | quote }}
            - name: TIMESCALE_DB
              value: {{ .Values.timescaledb.database | quote }}
            {{- include "aber.secretEnv" (dict "name" "TIMESCALE_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            # false while pgBackRest backs the historian up (timescaledb.physicalBackup): the manifest
            # records timescaledb=physical instead of a dump.
            - name: DUMP_TIMESCALE
              value: {{ ternary "false" "true" (not (not (include "aber.physicalBackupOn" .))) | quote }}
            - name: BACKUP_DIR
              value: /backups
            - name: BACKUP_RETENTION_DAYS
              value: {{ .Values.backup.retentionDays | quote }}
            - name: BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            - name: BACKUP_FORMAT
              value: {{ .Values.backupService.format | quote }}
            # An empty path disables the component; the manifest records its absence.
            - name: STORAGE_PATH
              value: {{ ternary "/storage" "" $includeStorage | quote }}
            - name: FORGE_PATH
              value: {{ ternary "/forge" "" $includeForge | quote }}
            - name: BROKER_PATH
              value: {{ ternary "/broker" "" $includeBroker | quote }}
            {{- /* Absent while off, as before the component existed: no /grafana is mounted then. */}}
            {{- if $includeGrafana }}
            - name: GRAFANA_PATH
              value: /grafana
            {{- end }}
            # Both empty disables the component; the manifest records its absence.
            - name: CA_SECRET_NAME
              value: {{ ternary $ca.secretName "" (not (not $includeCa)) | quote }}
            - name: CA_SECRET_NAMESPACE
              value: {{ ternary $ca.namespace "" (not (not $includeCa)) | quote }}
          ports:
            - name: healthz
              containerPort: 9020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if $asRoot }}
              {{- if or $includeForge $includeBroker }}
              # Archives the forge's and the broker's volumes, whose files belong to uids 1000 and
              # 1883, some at 0600.
              {{- end }}
              {{- if $includeGrafana }}
              # Archives Grafana's volume, whose files belong to uid 472.
              {{- end }}
              add: ["DAC_OVERRIDE"]
              {{- end }}
          resources:
            {{- toYaml .Values.backupService.resources | nindent 12 }}
          volumeMounts:
            {{- with include "aber.dbClientCaMount" . }}{{ . | nindent 12 }}{{- end }}
            - name: backups
              mountPath: /backups
            # The aws CLI's config for an off-site copy; everything else is written to /backups.
            - name: tmp
              mountPath: /tmp
            {{- if $includeStorage }}
            - name: storage-objects
              mountPath: /storage
              readOnly: true
            {{- end }}
            {{- if $includeForge }}
            - name: forge
              mountPath: /forge
              readOnly: true
            {{- end }}
            {{- if $includeBroker }}
            - name: broker
              mountPath: /broker
              readOnly: true
            {{- end }}
            {{- if $includeGrafana }}
            - name: grafana
              mountPath: /grafana
              readOnly: true
            {{- end }}
            {{- if $includeCa }}
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
      volumes:
        {{- with include "aber.dbClientCaVolume" . }}{{ . | nindent 8 }}{{- end }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ printf "%s-backup" $fullname }}
        # Room for checking an off-site copy by hand: a fetched object and its decryption.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if $includeStorage }}
        - name: storage-objects
          persistentVolumeClaim:
            claimName: {{ printf "%s-storage" $fullname }}
            readOnly: true
        {{- end }}
        {{- if $includeForge }}
        - name: forge
          persistentVolumeClaim:
            claimName: {{ printf "%s-gitea" $fullname }}
            readOnly: true
        {{- end }}
        {{- if $includeBroker }}
        - name: broker
          persistentVolumeClaim:
            claimName: {{ $brokerClaim }}
            readOnly: true
        {{- end }}
        {{- if $includeGrafana }}
        - name: grafana
          persistentVolumeClaim:
            claimName: {{ printf "%s-grafana" $fullname }}
            readOnly: true
        {{- end }}
        {{- if $includeCa }}
        # Projected, so the token is short-lived and rotated in place; the service reads it on
        # every call rather than caching it (the same arrangement as the credential service's).
        - name: sa-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
{{- if $includeCa }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-backup-service" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
automountServiceAccountToken: false
---
# In the CA's namespace, not the release's: a Role reaches only the namespace it is in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
  namespace: {{ $ca.namespace }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $ca.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
  namespace: {{ $ca.namespace }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s-backup-service-ca" .Release.Namespace $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-backup-service" $fullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
