{{- if .Values.nodeRed.enabled }}
{{- $component := "node-red" -}}
{{- $secretName := include "aber.secretName" . -}}
{{- $fullname := include "aber.fullname" . -}}
---
{{- if .Values.nodeRed.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-node-red" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    # Survives `helm uninstall`. /data holds the live flow (which an operator may have edited in the
    # editor), the encrypted credentials, and the persisted editor sessions and user map.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - {{ .Values.nodeRed.persistence.accessMode }}
  {{- include "aber.storageClass" (dict "ctx" . "component" .Values.nodeRed.persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.nodeRed.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  # THE NAME IS `node-red`: webhook_endpoints seeds http://node-red:1880/hooks/quarantine as the
  # pg_net target. (The deploy-nodered function reached the same Service at /flows until it was
  # retired with the demonstrator.)
  name: node-red
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 1880
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.nodeRed.replicas }}
  strategy:
    # Recreate. Node-RED is a single-writer runtime: two instances against one /data race on
    # flows.json, .sessions.json and the editor-user map. It is also a ReadWriteOnce PVC, so a
    # rolling update's second pod could not bind the volume anyway.
    type: Recreate
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/*
        M5. The `node-red` user is uid/gid 1000, and local-path hands over a root-owned directory.

        fsGroup does the `chown -R 1000:1000 /data` natively on volume mount, and OnRootMismatch
        avoids a recursive chgrp on every restart. The initContainer below therefore does NOT chown.
      */}}
      securityContext:
        {{- toYaml .Values.nodeRed.podSecurityContext | nindent 8 }}
      initContainers:
        {{/*
          =========================================================================================
          node-red-init, AS AN initContainer BUILT FROM THE SAME IMAGE AS THE MAIN CONTAINER.

          THE SHARED IMAGE IS LOAD-BEARING. settingsAreCorrect() in node-red-init.mjs EVALUATES the
          settings.js it finds, and that file `require`s passport-oauth2 and jsonwebtoken by
          absolute path into the image's node_modules. An init image without them throws on the
          require, which is already handled as "unloadable, replace it" -- so the script rewrites
          settings.js and CLOBBERS settings.js.bak on every boot, silently. If the log says
          `settings.js written` on more than the first boot, this is why.

          One image value feeds both containers, so they cannot drift apart. The script is in that
          image (node-red/Dockerfile) rather than a mounted ConfigMap, so an edit takes a rebuild;
          the dev loop restarts any workload whose image it rebuilt.

          THREE WRITES WITH THREE LIFETIMES, and collapsing them behind one guard broke the stack
          twice: the FLOW is user content, seeded once and guarded on /data/.factoryplus-seeded,
          while settings.js and the CREDENTIALS are stack configuration reconciled on every boot --
          a volume outlives a fix.
          =========================================================================================
        */}}
        - name: node-red-init
          image: {{ include "aber.image" (dict "image" .Values.nodeRed.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.nodeRed.image.pullPolicy }}
          command: ["node", "/opt/acs-cymru/node-red-init.mjs"]
          env:
            {{/*
              THE SHARED AUTH BLOCK, included here AND in the main container below.

              BOTH MUST RECEIVE IT, IDENTICALLY. settings.js resolves every one of these from
              process.env at load time, and settingsAreCorrect() evaluates that same file from
              here. A value present when the file is written and absent when it is read makes the
              settings look wrong on every boot and get rewritten forever. One definition, included
              twice, for exactly that reason.
            */}}
            {{- include "aber.noderedAuthEnv" . | nindent 12 }}
            {{- /*
              NO FLOW IS SEEDED AND NO BROKER CREDENTIAL IS PASSED. node-red-init writes a blank
              flows.json, so a fresh install publishes nothing, declares no broker nodes and needs
              no credential to exist for a gateway nobody has created.

              A USER BUILDING A FLOW mints its credential from the dashboard and adds the pair to
              the chart Secret under the names their broker node's `acsCredentialsEnv` declares.
              node-red-init reconciles env pairs onto broker nodes at init and FAILS CLOSED when a
              declared pair is absent -- deliberately, because the alternative is seeding an empty
              username, which the broker refuses with CONNACK 5 while Node-RED reports only
              "Connection failed to broker: <clientId>@<url>", naming the client id rather than the
              username and reading identically to a wrong host.
            */}}
            {{/*
              The broker's transport, from the same helper the ingestion daemon uses.

              node-red-init reconciles the mqtt-broker node in flows.json from these -- port,
              usetls, and a tls-config node pointing at the CA. It is the init container and not the
              runtime that does it because the flow has to be correct on disk BEFORE Node-RED reads
              it; Node-RED has no way to take a broker port from the environment.
            */}}
            {{- include "aber.brokerClientEnv" . | nindent 12 }}
            - name: NODE_RED_FORCE_SEED
              value: {{ .Values.nodeRed.forceSeed | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
            {{- /* Mounted here as well as in the runtime so the init container can FAIL on an absent
                   CA. Node-RED itself would report only a generic "Connection failed to broker",
                   identical to a wrong password, with certificates never mentioned. */}}
            {{- include "aber.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: node-red
          image: {{ include "aber.image" (dict "image" .Values.nodeRed.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.nodeRed.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 1880
              protocol: TCP
          env:
            # The same block the initContainer got -- see the note there for why parity matters.
            {{- include "aber.noderedAuthEnv" . | nindent 12 }}
          {{/*
            PROBED ON `/` WITH NO CREDENTIALS, and that needs saying because it looks wrong.

            settings.js declares adminAuth, so the editor at / redirects rather than serving --
            which is still a 2xx/3xx and proves the runtime loaded settings.js and is serving. What
            it deliberately does NOT do is assert authorisation works: BOTH of the editor defects
            this stack has hit answered 200 on the calls a status-only probe makes. One 401'd only
            AFTER login; the other returned a perfectly healthy /settings whose `user` object was
            missing `permissions`.

            So a probe is the wrong instrument for that, and validate.py check 7b is the right one:
            it signs in for real and asserts the permissions VALUE. Keep the probe cheap and keep
            the assertion in the conformance suite.
          */}}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.nodeRed.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
            {{- /* The runtime reads this path when the flow is deployed -- tls-config's certType is
                   `files`, so `ca` is read with fs.readFileSync, not baked into the flow. */}}
            {{- include "aber.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
        {{- include "aber.brokerClientCaVolume" . | nindent 8 }}
        {{- end }}
        - name: data
          {{- if .Values.nodeRed.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-node-red" $fullname }}
          {{- else }}
          {{/*
            An emptyDir loses the encrypted credentials, the persisted editor sessions AND
            /data/.factoryplus-editor-users.json on every restart. That last one is the nasty part:
            without it a live Administrator silently degrades to a read-only editor -- Node-RED
            draws a padlock on Deploy -- while the admin API would still accept the deploy. It is
            not a logout, so nothing tells the user. Only for throwaway testing.
          */}}
          emptyDir: {}
          {{- end }}
{{- end }}
