{{- /*
The chart's Secret, rendered ONLY when secrets.existingSecret is empty: pointing at an
externally-managed Secret is how External Secrets / SOPS plugs in with no template change, so this
file must not be the only thing that can produce these keys.

KEY NAMES ARE THE ENVIRONMENT VARIABLE NAMES the containers expect, not camelCase values-file names,
so a Deployment can use `envFrom.secretRef` and an externally-managed Secret has one obvious
contract to satisfy.

Values are placed in `stringData`, not `data`: otherwise every line needs b64enc, and a mis-encoded
value fails as an authentication error at runtime rather than at render.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "aber.fullname" .) }}
  labels:
    {{- include "aber.labels" . | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # --- Supabase: a matching SET, see values.yaml -------------------------------------------
  SUPABASE_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  # The JWTs the upstreams require; the gateway substitutes them for the two keys below.
  SUPABASE_ANON_KEY: {{ .Values.secrets.anonKey | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.serviceRoleKey | quote }}
  # The keys callers present: opaque strings the gateway matches, not JWTs.
  SUPABASE_PUBLISHABLE_KEY: {{ .Values.secrets.publishableKey | quote }}
  SUPABASE_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  SUPABASE_INGESTION_KEY: {{ .Values.secrets.ingestionKey | quote }}
  # Service_Playback (archived migration 0056). A SECOND machine identity rather than a second use of the
  # one above, because the two hold different broker rights: the daemon may publish only NCMD
  # rebirth requests, the worker publishes asset data as one gateway. Sharing a token would mean a
  # single leaked credential reached both sets of gates.
  SUPABASE_PLAYBACK_KEY: {{ .Values.secrets.playbackKey | quote }}
  # The broker passwords the playback worker holds, as a JSON object keyed by sparkplug_id. These
  # are the SAME credentials the Access Control page issues for a gateway -- playback has no broker
  # account of its own, it borrows the target's, because the only client the broker lets publish
  # under an edge node is the one holding that gateway's own generated role.
  MQTT_PLAYBACK_CREDENTIALS: {{ .Values.secrets.mqttPlaybackCredentials | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # The password-reset relay (supabaseAuth.smtp). Read through an OPTIONAL secretKeyRef, so an
  # externally-managed Secret that predates it still starts GoTrue; empty means no relay.
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | default "" | quote }}
  # The cold archive's S3 credential (coldArchive.s3). Foreign, like the relay password above,
  # and read through an OPTIONAL secretKeyRef for the same reason; empty means no remote
  # destination and nothing is exported.
  ARCHIVE_S3_SECRET_ACCESS_KEY: {{ .Values.secrets.archiveS3SecretAccessKey | default "" | quote }}

  # --- TimescaleDB (separate database, separate credential) --------------------------------
  DB_PASSWORD: {{ .Values.secrets.timescalePassword | default .Values.secrets.postgresPassword | quote }}
  # The read-only role reporting tools connect as. NOT defaulted to DB_PASSWORD: falling back to
  # the superuser credential is precisely what this replaced, and a default that silently restored
  # it would be worse than the empty string, which fails loudly.
  BI_READER_PASSWORD: {{ .Values.secrets.biReaderPassword | quote }}

  # NOT defaulted to DB_PASSWORD, for the same reason as the line above: falling
  # back to the superuser credential is exactly what these replace, and a silent default would
  # restore the problem while looking configured.
  INGEST_WRITER_PASSWORD: {{ .Values.secrets.ingestWriterPassword | quote }}
  FDW_READER_PASSWORD: {{ .Values.secrets.fdwReaderPassword | quote }}

  # --- Realtime: lengths asserted by aber.validateRealtime ---------------------------
  REALTIME_DB_ENC_KEY: {{ .Values.secrets.realtimeDbEncKey | quote }}
  REALTIME_SECRET_KEY_BASE: {{ .Values.secrets.realtimeSecretKeyBase | quote }}
  # Mandatory from realtime v2.102.3 (System.fetch_env!). Signs the bearer token its /metrics
  # endpoint requires; its own secret rather than the API signing key.
  REALTIME_METRICS_JWT_SECRET: {{ .Values.secrets.realtimeMetricsJwtSecret | quote }}

  PG_META_CRYPTO_KEY: {{ .Values.secrets.pgMetaCryptoKey | quote }}

  # --- MQTT: THE PLATFORM PRINCIPALS, NO SHARED ACCOUNT --------------------------------------
  # The broker's roles (mosquitto/dynsec-roles.json) confine each to a different subtree, and none
  # can publish asset data for an edge node other than itself. Each password is separate on purpose:
  # confinement is worth nothing if one leaked credential opens them all.
  #
  # The validator's USERNAME is not a free choice -- it must equal the `sparkplug_id` of the gateway
  # row it publishes under, since its role confines it to that edge-node segment and
  # verify_gateway_binding() re-checks it, which is why that row has a pinned UUID.
  # aber.validateMqttPrincipals fails the render on a bad one.
  MQTT_INGESTION_USER: {{ .Values.secrets.mqttIngestionUser | quote }}
  MQTT_INGESTION_PASSWORD: {{ .Values.secrets.mqttIngestionPassword | quote }}
  MQTT_I3X_USER: {{ .Values.secrets.mqttI3xUser | quote }}
  MQTT_I3X_PASSWORD: {{ .Values.secrets.mqttI3xPassword | quote }}
  MQTT_VALIDATOR_USER: {{ .Values.secrets.mqttValidatorUser | quote }}
  MQTT_VALIDATOR_PASSWORD: {{ .Values.secrets.mqttValidatorPassword | quote }}
  MQTT_MONITOR_USER: {{ .Values.secrets.mqttMonitorUser | quote }}
  MQTT_MONITOR_PASSWORD: {{ .Values.secrets.mqttMonitorPassword | quote }}
  {{- /* The account the credential service administers the Dynamic Security plugin as. Its role
         reaches $CONTROL/dynamic-security/# and nothing else; the broker's initContainer writes it
         on every start and refuses to start without the password. */}}
  MQTT_DYNSEC_ADMIN_USER: {{ .Values.secrets.mqttDynsecAdminUser | quote }}
  MQTT_DYNSEC_ADMIN_PASSWORD: {{ .Values.secrets.mqttDynsecAdminPassword | quote }}
  {{- /* The bearer token supabase-functions presents to the gateway-credential sidecar. ITS OWN
         VALUE, never shared: that service can issue a Mosquitto account for any edge node, and the
         gateway's role turns an account into the ability to publish Sparkplug telemetry AS that
         gateway -- so a token reused elsewhere means one leak grants forgery across the site. The
         service refuses to start below 32 characters. */}}
  MQTT_CREDENTIAL_SERVICE_TOKEN: {{ .Values.secrets.mqttCredentialServiceToken | quote }}

  {{- /* Authorises the `gateways` trigger's revocation call to the revoke-gateway-credential
         function (0038). SEPARATE FROM the credential-service token above, and deliberately: this
         one authorises "rotate the account of a gateway that has been decommissioned", while that
         one authorises minting an account for any edge node. Merging them would give whoever holds
         the revocation secret the issuance authority too. Empty leaves revocation INERT. */}}
  GATEWAY_REVOKE_SECRET: {{ .Values.secrets.gatewayRevokeSecret | default "" | quote }}

  {{- /* Authorises the schedule's call to the forge-sweep function (0099): one reconciliation of
         the forge's teams and repositories, nothing else. Empty leaves the sweep INERT. */}}
  FORGE_SWEEP_SECRET: {{ .Values.secrets.forgeSweepSecret | default "" | quote }}

  # --- Gitea (the forge) -------------------------------------------------------------------
  # The forge administrator, and the only account it is meant to have. Not an identity store:
  # roles stay in Postgres and the forge is reached through one machine account.
  GITEA_ADMIN_PASSWORD: {{ .Values.secrets.giteaAdminPassword | default "" | quote }}
  # The machine account, read by gitea-init (to create it) and by enroll-gateway (to authenticate
  # as it). One value, two consumers, so they cannot disagree about the password of an account one
  # of them creates and the other logs in as.
  GITEA_MACHINE_PASSWORD: {{ .Values.secrets.giteaMachinePassword | default "" | quote }}
  {{/* The forge's door (0094): the OAuth client the gateway's forge listener authenticates as,
       and the key that signs its session cookie. Read through OPTIONAL secretKeyRefs, as Studio's
       are, so an externally-managed Secret that predates them still starts the gateway; empty is
       fail-closed at both ends, and here that means a forge nobody can sign into. */}}
  GITEA_OAUTH_CLIENT_SECRET: {{ .Values.secrets.giteaOAuthClientSecret | default "" | quote }}
  GITEA_PROXY_HMAC_SECRET: {{ .Values.secrets.giteaProxyHmacSecret | default "" | quote }}
  # The push webhook's signing secret (0095): set on each gateway repository's hook by enrolment,
  # verified by forge-events. Empty means enrolment registers no hook.
  GITEA_WEBHOOK_SECRET: {{ .Values.secrets.giteaWebhookSecret | default "" | quote }}

  # --- Grafana -----------------------------------------------------------------------------
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  GRAFANA_OAUTH_CLIENT_SECRET: {{ .Values.secrets.grafanaOAuthClientSecret | quote }}
  # The bearer secret Grafana's alert contact point presents to grafana-alert-webhook. Deliberately
  # NOT the service-role key: it authorises recording an alert and nothing else.
  GRAFANA_ALERT_WEBHOOK_SECRET: {{ .Values.secrets.grafanaAlertWebhookSecret | quote }}

  # --- Supabase Studio's door --------------------------------------------------------------
  {{/* Read through OPTIONAL secretKeyRefs by supabase-envoy, because routes.studio is off by
       default and most installs never publish the listener that uses them. Empty is fail-closed
       at both ends: 0081 skips the client registration, and the gateway substitutes credentials
       that cannot authenticate. */}}
  STUDIO_OAUTH_CLIENT_SECRET: {{ .Values.secrets.studioOAuthClientSecret | default "" | quote }}
  STUDIO_PROXY_HMAC_SECRET: {{ .Values.secrets.studioProxyHmacSecret | default "" | quote }}

  # --- The first administrator ---------------------------------------------------------------
  {{/* Read by db-init through an OPTIONAL secretKeyRef, and only when it creates the account. */}}
  FIRST_ADMINISTRATOR_PASSWORD: {{ .Values.secrets.firstAdministratorPassword | default "" | quote }}

  # --- Node-RED ----------------------------------------------------------------------------
  NODERED_CREDENTIAL_SECRET: {{ .Values.secrets.noderedCredentialSecret | quote }}
  NODERED_OAUTH_CLIENT_SECRET: {{ .Values.secrets.noderedOAuthClientSecret | quote }}
  # A SIGNING key for per-event webhook tokens, which httpNodeAuth verifies, deliberately NOT the
  # admin token: an `http in` node serves the request, so any flow author can read the headers.
  NODERED_WEBHOOK_JWT_SECRET: {{ .Values.secrets.noderedWebhookJwtSecret | quote }}
  # Break-glass only. Empty means the static-token path is shut, which is the default posture.
  NODERED_ADMIN_TOKEN: {{ .Values.secrets.noderedAdminToken | default "" | quote }}
{{- end }}
