{{- if .Values.swaggerUi.enabled }}
{{- $component := "swagger-ui" -}}
{{/*
Swagger UI, serving the two curated API specifications.

THE SPECS ARE IN THE IMAGE, not in a ConfigMap: they are read by this pod and by nothing else, and
at ~270 KB they were the largest single thing in Helm's 1 MiB release Secret, which holds the chart
archive and the rendered manifest both. swagger-ui/Dockerfile copies them from docs/, the way
supabase/db-init/Dockerfile carries the migrations. An edit to docs/*.yaml therefore reaches a
cluster with the next image build rather than the next upgrade.
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.swaggerUi.replicas }}
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's nginx user; it listens on 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The entrypoint rewrites files the image ships: swagger-initializer.js and a .gz beside
        # each page, script and stylesheet in the document root, and the CORS and embedding
        # snippets in templates/. Both directories are emptyDirs, so this copies them in first.
        - name: seed-web-root
          image: {{ include "aber.image" (dict "image" .Values.swaggerUi.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.swaggerUi.image.pullPolicy }}
          command: ["/bin/sh", "-e", "-c", "cp -R /usr/share/nginx/html/. /seed/html/ && cp -R /etc/nginx/templates/. /seed/templates/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.swaggerUi.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /seed/html
            - name: templates
              mountPath: /seed/templates
      containers:
        - name: swagger-ui
          image: {{ include "aber.image" (dict "image" .Values.swaggerUi.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.swaggerUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Two curated specs, both served from this image's document root.
            #
            # There is deliberately no PostgREST live-schema entry: it pointed at /rest/v1/, which
            # the gateway gates, so the browser fetched it without an apikey and the definition
            # failed to load as an authorization error. It duplicated openapi.yaml, which
            # check-docs-drift.mjs holds against every published relation and edge function.
            #
            # The i3X spec loads from this origin like the other file. Its "Try it out" reaches the
            # i3X server cross-origin, which allows this origin: it is in aber.corsOrigins.
            - name: URLS
              value: >-
                [{"url":"/openapi.yaml","name":"Aber Platform API"},
                 {"url":"/i3x-openapi.yaml","name":"i3X 1.0 Server"}]
            - name: URLS_PRIMARY_NAME
              value: Aber Platform API
            - name: DEEP_LINKING
              value: "true"
            - name: DISPLAY_REQUEST_DURATION
              value: "true"
            # Off. The default draws a badge fetched from validator.swagger.io, passing it the
            # spec's URL. `none` is Swagger UI's own spelling for disabled.
            - name: VALIDATOR_URL
              value: none
            # Off: no other origin reads these files. "Try it out" calls the gateway or i3X, whose
            # CORS is their own; this only stops the image adding Access-Control-Allow-Origin: *
            # here. On, the image's nested locations would send it twice
            # (swagger-ui/aber-headers.conf.template).
            - name: CORS
              value: "false"
            # Rendered into nginx's config at start; empty, and so not sent, unless global.scheme is https.
            - name: ABER_STRICT_TRANSPORT_SECURITY
              value: {{ include "aber.strictTransportSecurity" . | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.swaggerUi.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: templates
              mountPath: /etc/nginx/templates
            # The server blocks, rendered here from templates/ at start.
            - name: conf
              mountPath: /etc/nginx/conf.d
            # nginx's temporary files, and its pid file in /run.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
      volumes:
        - name: html
          emptyDir:
            sizeLimit: 64Mi
        - name: templates
          emptyDir:
            sizeLimit: 1Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
{{- end }}
