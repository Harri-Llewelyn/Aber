{{- if .Values.postgresTls.enabled }}
{{- $component := "test-db-tls" -}}
{{/*
The transport gate: both databases refuse plaintext and every backend they hold from beyond
loopback is on TLS.

Three checks per database. A plaintext attempt (`sslmode=disable`) must be rejected by pg_hba,
which proves the server-side rule and not only the clients' good behaviour. A `verify-full`
connection must succeed, which proves the certificate names the Service and the CA the clients
project verifies it. Then `pg_stat_ssl` joined to `pg_stat_activity`: no backend with a client
address beyond loopback may be without TLS, which proves every client that is connected right
now negotiated it, whatever its own stack.

RUN IT WITH:  helm test aber -n <namespace>
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-db-tls" (include "aber.fullname" .) }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test-db-tls
      image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
      imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
      env:
        {{- include "aber.secretEnv" (dict "name" "SBPASSWORD" "secretName" (include "aber.secretName" .) "key" "POSTGRES_PASSWORD") | nindent 8 }}
        {{- include "aber.secretEnv" (dict "name" "TSPASSWORD" "secretName" (include "aber.secretName" .) "key" "DB_PASSWORD") | nindent 8 }}
        - name: PGSSLROOTCERT
          value: {{ include "aber.dbCaPath" . }}
      command:
        - /bin/sh
        - -e
        - -c
        - |
          check() {
            name=$1; host=$2; port=$3; user=$4; db=$5; pw=$6
            echo "--- $name ($host:$port) ---"
            if PGPASSWORD="$pw" PGSSLMODE=disable psql -h "$host" -p "$port" -U "$user" -d "$db" -tAc 'SELECT 1' >/dev/null 2>/tmp/plain.err; then
              echo "FAIL: $name accepted a PLAINTEXT connection. pg_hba should carry hostnossl ... reject; check the hba_file flag and the mounted pg_hba.conf." >&2
              exit 1
            fi
            echo "    plaintext refused: $(tr -d '\n' < /tmp/plain.err | cut -c1-120)"
            SSL=$(PGPASSWORD="$pw" PGSSLMODE=verify-full psql -v ON_ERROR_STOP=1 -h "$host" -p "$port" -U "$user" -d "$db" -tAc \
                    "SELECT ssl || ' ' || version || ' ' || cipher FROM pg_stat_ssl WHERE pid = pg_backend_pid()")
            echo "    verify-full connected: $SSL"
            case "$SSL" in
              true\ *) ;;
              *) echo "FAIL: the verify-full session to $name reports no TLS -- got '$SSL'." >&2; exit 1 ;;
            esac
            PLAIN=$(PGPASSWORD="$pw" PGSSLMODE=verify-full psql -v ON_ERROR_STOP=1 -h "$host" -p "$port" -U "$user" -d "$db" -tAc \
                    "SELECT count(*) FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid)
                      WHERE a.client_addr IS NOT NULL
                        AND host(a.client_addr) NOT IN ('127.0.0.1', '::1')
                        AND NOT s.ssl")
            TOTAL=$(PGPASSWORD="$pw" PGSSLMODE=verify-full psql -v ON_ERROR_STOP=1 -h "$host" -p "$port" -U "$user" -d "$db" -tAc \
                    "SELECT string_agg(who, ', ' ORDER BY who) FROM (
                       SELECT DISTINCT a.usename || CASE WHEN a.application_name <> '' THEN ' (' || a.application_name || ')' ELSE '' END AS who
                         FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid)
                        WHERE a.client_addr IS NOT NULL AND host(a.client_addr) NOT IN ('127.0.0.1', '::1') AND s.ssl) t")
            echo "    backends on TLS: ${TOTAL:-none yet}"
            if [ "$PLAIN" != "0" ]; then
              echo "FAIL: $name holds $PLAIN backend(s) from beyond loopback WITHOUT TLS. pg_hba admits plaintext from somewhere it should not." >&2
              exit 1
            fi
          }
          {{- if .Values.supabaseDb.enabled }}
          check supabase-db {{ include "aber.supabaseDb.host" . }} {{ include "aber.supabaseDb.port" . }} postgres postgres "$SBPASSWORD"
          {{- end }}
          {{- if .Values.timescaledb.enabled }}
          check timescaledb {{ include "aber.timescale.host" . }} {{ include "aber.timescale.port" . }} {{ .Values.timescaledb.username }} {{ .Values.timescaledb.database }} "$TSPASSWORD"
          {{- end }}
          echo
          echo 'PASS: both databases refuse plaintext, verify under the chart CA, and hold no plaintext backend from beyond loopback.'
      volumeMounts:
        {{- include "aber.dbClientCaMount" . | nindent 8 }}
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
  volumes:
    {{- include "aber.dbClientCaVolume" . | nindent 4 }}
{{- end }}
