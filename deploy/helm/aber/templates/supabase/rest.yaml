{{- if .Values.supabaseRest.enabled }}
{{- $component := "supabase-rest" -}}
{{- $secretName := include "aber.secretName" . -}}
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # The gateway routes /rest/v1/ here.
      port: 3000
      targetPort: http
      protocol: TCP
    # Scraped by Prometheus, reachable from nothing else. See the PGRST_ADMIN_SERVER_PORT note on
    # the Deployment for why this is not routed.
    - name: admin
      port: 3001
      targetPort: admin
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseRest.replicas }}
  selector:
    matchLabels:
      {{- include "aber.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # The admin listener (PGRST_ADMIN_SERVER_PORT below) is the only place PostgREST serves /metrics.
        {{- include "aber.scrapeAnnotations" (dict "port" 3001 "path" "/metrics") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{/*
          PostgREST connects as `authenticator`, whose password db-roles-init sets. It also caches
          the schema at startup, so starting before db-init has run leaves it serving an EMPTY
          SCHEMA -- 404 on every table, with a healthy-looking process. Waiting on the role covers
          the credential; the schema-cache reload below covers the rest.
        */}}
        {{- include "aber.waitForPostgres" (dict "ctx" . "name" "wait-for-authenticator" "host" (include "aber.supabaseDb.host" .) "port" (include "aber.supabaseDb.port" .) "user" "authenticator" "db" "postgres" "passwordKey" "POSTGRES_PASSWORD") | nindent 8 }}
      containers:
        - name: postgrest
          image: "{{ .Values.supabaseRest.image.repository }}:{{ .Values.supabaseRest.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseRest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGRES_PASSWORD)@{{ include "aber.supabaseDb.host" . }}:{{ include "aber.supabaseDb.port" . }}/postgres?{{ include "aber.dsnSslParams" . }}"
            # The schemas upstream's compose exposes; the Supabase client expects `graphql_public`
            # to exist.
            - name: PGRST_DB_SCHEMAS
              value: public,storage,graphql_public
            - name: PGRST_DB_ANON_ROLE
              value: anon
            {{- include "aber.secretEnv" (dict "name" "PGRST_JWT_SECRET" "secretName" $secretName "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
            # The revocation choke point (0074). Run in the caller's role
            # before every request; it RAISEs on a revoked `jti` and returns quietly otherwise.
            # A single point of failure by construction -- its fail-open paths are asserted in
            # supabase/migrations/test_service_token_revocation.py, and a misspelling here is a
            # total outage rather than a skipped hook.
            - name: PGRST_DB_PRE_REQUEST
              value: public.auth_pre_request
            # PostgREST caches the schema on connect and reloads on a NOTIFY. The migrations end
            # with `NOTIFY pgrst, 'reload schema'`, which is what makes a `helm upgrade` that adds
            # a table visible without a restart -- but only if PostgREST is listening on the right
            # channel, which is what this declares.
            - name: PGRST_DB_CHANNEL_ENABLED
              value: "true"
            - name: PGRST_DB_CHANNEL
              value: pgrst
            - name: PGRST_SERVER_PORT
              value: "3000"
            # The admin listener: /live and /ready for the probes, /metrics for Prometheus. Nothing
            # is bound unless this is set. It has NO AUTHENTICATION and describes the database
            # connection, so it is a ClusterIP-only port, not in the Ingress or the gateway.
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          # The probes ask the admin listener, which answers from PostgREST's own state. The API
          # root would build the OpenAPI document as `anon` on every probe: three catalog queries,
          # about 12 ms of database time each, every few seconds.
          startupProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: admin
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.supabaseRest.resources | nindent 12 }}
          {{- if .Values.postgresTls.enabled }}
          volumeMounts:
            {{- include "aber.dbClientCaMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.postgresTls.enabled }}
      volumes:
        {{- include "aber.dbClientCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
