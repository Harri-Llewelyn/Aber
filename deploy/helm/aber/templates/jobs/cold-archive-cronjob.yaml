{{- if .Values.coldArchive.enabled }}
{{- $component := "cold-archive" -}}
{{- $secretName := include "aber.secretName" . -}}
{{- $fullname := include "aber.fullname" . -}}
{{/*
=================================================================================================
Cold telemetry archival: export a chunk, verify the object, record it, and only then drop it
(ingestion/cold_archive.py). Turns the historian's retention policy from delete into move.

The ingestion image under a different command, as the playback worker is: `cold_archive` reads
the chunk with the daemon's own historian role, so the two cannot disagree about which rows they
are looking at. The object goes to the S3 destination set on the Cold Storage page, which
`cold_archive` reads from the database on each run (coldArchive.s3 only seeds it, through db-init)
-- somewhere else, and only somewhere else, because `--drop` deletes the only other copy.

`--drop` is on by default because the retention policy is: without it the chunks are exported
and kept, and the historian never shrinks. Every drop is recorded in telemetry_archive_manifest,
which refuses one that was not verified. Off: coldArchive.drop=false, an export-only cadence.
=================================================================================================
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-cold-archive" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  schedule: {{ .Values.coldArchive.schedule | quote }}
  # Never two at once: the claim step is what makes a crashed run resolvable by the next.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cold-archive
              image: {{ include "aber.image" (dict "image" .Values.ingestion.image "ctx" $) | quote }}
              imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
              command:
                - python
                - -m
                - cold_archive
                {{- if .Values.coldArchive.drop }}
                - --drop
                {{- end }}
              env:
                {{- with include "aber.dbClientTlsEnv" . }}{{ . | nindent 16 }}{{- end }}
                - name: LOG_FORMAT
                  value: "json"
                - name: DB_HOST
                  value: {{ include "aber.timescale.host" . | quote }}
                - name: DB_PORT
                  value: {{ include "aber.timescale.port" . | quote }}
                - name: DB_NAME
                  value: {{ .Values.timescaledb.database | quote }}
                # The historian role the daemon writes as; the chunks it exports are its own.
                - name: DB_USER
                  value: "ingest_writer"
                {{- include "aber.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" "INGEST_WRITER_PASSWORD") | nindent 16 }}
                - name: SUPABASE_URL
                  value: {{ include "aber.supabase.internalUrl" . | quote }}
                {{- include "aber.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 16 }}
                {{- include "aber.secretEnv" (dict "name" "SUPABASE_INGESTION_KEY" "secretName" $secretName "key" "SUPABASE_INGESTION_KEY") | nindent 16 }}
                - name: PYTHONUNBUFFERED
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.coldArchive.resources | nindent 16 }}
              {{- if .Values.postgresTls.enabled }}
              volumeMounts:
                {{- include "aber.dbClientCaMount" . | nindent 16 }}
              {{- end }}
          {{- if .Values.postgresTls.enabled }}
          volumes:
            {{- include "aber.dbClientCaVolume" . | nindent 12 }}
          {{- end }}
{{- end }}
