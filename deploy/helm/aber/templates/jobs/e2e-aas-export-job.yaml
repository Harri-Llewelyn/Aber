{{- if .Values.e2e.enabled }}
{{- $component := "e2e-aas-export" -}}
{{- $secretName := include "aber.secretName" . -}}
{{- $fullname := include "aber.fullname" . -}}
{{/*
=================================================================================================
`supabase/functions/aas-export/test_aas_export.py`, run in-cluster.

ITS SUBJECT IS PROVISIONED BY THE SUITE, not seeded and not produced by another Job. It creates a
gateway, a device, a schema, a nameplate and its birth parameters at pinned ids through
test-harness/aas_fixture.py, asserts against the document the exporter composes, and tears them
down -- so the live checks need no broker, no simulator publishing a DBIRTH, no operator approval
and no demo data.

IT USED TO TARGET A DEMONSTRATION DEVICE, which made a CONFORMANCE Job depend on seed data. That
coupling had already bitten once, when a previous subject quietly stopped receiving a DBIRTH while
the suite went on naming it and reporting success. Seeding its own nameplate is what makes this
suite independent of whatever the shipped Node-RED flow publishes.

The initContainer below is kept for the narrower reason it gives itself: do not run a conformance
suite against a stack whose conformance run did not pass. A SUITE THAT SKIPS ITS OWN SUBJECT AND
REPORTS SUCCESS is the failure to avoid, and it is silent -- which is why CI asserts on the absence
of the skip line rather than on this Job's exit status.

WHAT IT COVERS THAT NOTHING ELSE DOES:
  * conformance against the REAL vendored IDTA schema (test-harness/schemas), which caught three
    metamodel violations the hand-written structural tests passed -- all the same shape: the
    metamodel expresses "absent" by OMITTING a field, never by a placeholder;
  * the AASX container's discovery chain, every link of which is load-bearing;
  * that the packaged Environment is byte-identical to the JSON export;
  * the sparkplugToXsd / model3dContentType duplication between the edge worker and the frontend,
    which is why they may be duplicated at all.
=================================================================================================
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-e2e-aas-export" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # No retries -- see the note in e2e-validate-job.yaml.
  backoffLimit: 0
  {{- if .Values.e2e.suspend }}
  # Resumed by whoever set e2e.suspend; see values.yaml.
  suspend: true
  {{- end }}
  ttlSecondsAfterFinished: {{ .Values.e2e.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      # Reading a Job's completion status needs RBAC; the ServiceAccount below grants exactly that
      # and nothing else.
      serviceAccountName: {{ printf "%s-e2e" $fullname }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-validate
          # The suite's own image: its Python reads the Job's status from the API server with this
          # pod's ServiceAccount token, which the Role below confines to reading Jobs.
          image: {{ include "aber.image" (dict "image" .Values.e2e.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.e2e.image.pullPolicy }}
          env:
            - name: JOB
              value: {{ printf "%s-e2e-validate" $fullname | quote }}
            - name: WAIT_TIMEOUT
              value: {{ .Values.e2e.waitTimeout | quote }}
          command:
            - python
            - -c
            - |
              # Failure is checked first: a Job that has already failed never completes, and waiting
              # for it would time out blaming this Job rather than the one that failed.
              import json, os, ssl, sys, time, urllib.request
              SA = "/var/run/secrets/kubernetes.io/serviceaccount"
              job, timeout = os.environ["JOB"], int(os.environ["WAIT_TIMEOUT"])
              with open(f"{SA}/namespace") as f:
                  ns = f.read().strip()
              url = f"https://kubernetes.default.svc/apis/batch/v1/namespaces/{ns}/jobs/{job}"
              tls = ssl.create_default_context(cafile=f"{SA}/ca.crt")
              deadline = time.time() + timeout
              while True:
                  status = {}
                  try:
                      # Re-read each time: the kubelet rotates the projected token.
                      with open(f"{SA}/token") as f:
                          auth = {"Authorization": "Bearer " + f.read().strip()}
                      with urllib.request.urlopen(urllib.request.Request(url, headers=auth), context=tls, timeout=10) as r:
                          status = json.load(r).get("status") or {}
                  except Exception as exc:
                      print(f"reading {job}: {exc}", flush=True)
                  if any(c.get("type") == "Failed" and c.get("status") == "True" for c in status.get("conditions") or []):
                      print(f"{job} FAILED -- not running the AAS suite against a stack whose conformance run did not pass.", file=sys.stderr)
                      print(f"  kubectl logs job/{job}", file=sys.stderr)
                      sys.exit(1)
                  if (status.get("succeeded") or 0) >= 1:
                      print(f"{job} completed; the stack passed its conformance run.")
                      break
                  if time.time() >= deadline:
                      print(f"timed out after {timeout}s waiting for {job}", file=sys.stderr)
                      sys.exit(1)
                  print(f"waiting for {job} (its verdict gates this suite) ...", flush=True)
                  time.sleep(5)
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: aas-export
          image: {{ include "aber.image" (dict "image" .Values.e2e.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.e2e.image.pullPolicy }}
          # The repo-shaped path is required: the suite resolves the IDTA schema and the four
          # mapper files relative to parents[3] of its own location. See test-harness/Dockerfile.
          command: ["python", "supabase/functions/aas-export/test_aas_export.py"]
          env:
            - name: SUPABASE_URL
              value: {{ include "aber.supabase.internalUrl" . | quote }}
            {{- include "aber.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 12 }}
            {{- include "aber.secretEnv" (dict "name" "SUPABASE_SERVICE_ROLE_KEY" "secretName" $secretName "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            # It signs in as a real persona rather than using the service-role key, because the
            # export's authorization ladder is part of what is under test: Administrator and
            # Shopfloor_Manager may export, and so may the read-scoped Operator and Auditor -- unlike
            # approve-quarantine, because an export is a read.
            - name: AAS_TEST_EMAIL
              value: admin@aber.local
            - name: AAS_TEST_PASSWORD
              value: aber123
            - name: STORAGE_MODEL_BUCKET
              value: {{ .Values.supabaseStorage.bucket | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            {{- toYaml .Values.e2e.resources | nindent 12 }}
---
{{/*
RBAC for the wait-for-validate initContainer: read Job status in this namespace, nothing else.

Namespace-scoped Role rather than a ClusterRole, and `get`/`list`/`watch` on `jobs` only -- the
initContainer needs to read one Job's `.status`, so anything more would be authority granted for
convenience.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-e2e" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-e2e" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-e2e" $fullname }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-e2e" $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-e2e" $fullname }}
    namespace: {{ .Release.Namespace }}
{{- end }}
