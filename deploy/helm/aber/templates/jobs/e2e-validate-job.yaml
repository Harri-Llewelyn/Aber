{{- if .Values.e2e.enabled }}
{{- $component := "e2e-validate" -}}
{{- $secretName := include "aber.secretName" . -}}
{{/*
=================================================================================================
`ingestion/validate.py`, run as a Job IN the namespace.

In-cluster the SERVICE NAMES ARE THE CORRECT CONFIGURATION, so the values below are the plain
defaults; from the host (`npm run dev:test`) the same suite needs port-forwards, because those
names do not resolve outside the cluster.

NOT A `helm test` HOOK, unlike test-fdw: this suite seeds and deletes fixtures, drives real MQTT
traffic and takes minutes, so `helm test` stays the cheap gate anyone can run against a live stack.
Gated on `e2e.enabled`. It is the same 20 checks `npm run dev:test` runs from the host.
=================================================================================================
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-e2e-validate" (include "aber.fullname" .) }}
  labels:
    {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    # A plain Job, not a hook: it is triggered on purpose, and `kubectl wait` on it is what CI does.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # NO RETRIES. A failed conformance run is a result to read, not a flake to paper over -- and the
  # suite is not idempotent mid-flight: a retry starting while fixtures from the previous attempt
  # exist reports collisions rather than the original failure.
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.e2e.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "aber.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        CHECK 7b SIGNS IN THROUGH THE REAL OAUTH CHAIN, so it follows BROWSER-FACING URLs:
        /auth/strategy redirects to `api.<publicBaseDomain>`, and GoTrue hands back a callback on
        `nodered.<publicBaseDomain>`. That is what catches a redirect_uri disagreeing with what the
        service advertises, so in-cluster names would be testing something else.

        A pod does not resolve those names the way a browser does: under the dev domain `localhost`
        they are THE POD ITSELF, and as `*.localhost` names they resolve to nothing -- 7b failed as
        `Connection refused`. `e2e.ingressIp` maps them onto the ingress controller instead. Left
        empty the aliases are absent, which is right where the public domain already resolves
        in-cluster.
      */}}
      {{- if .Values.e2e.ingressIp }}
      hostAliases:
        - ip: {{ .Values.e2e.ingressIp | quote }}
          hostnames:
            {{- range $sub := list "api" "nodered" "app" "grafana" }}
            - {{ printf "%s.%s" $sub $.Values.global.publicBaseDomain | quote }}
            {{- end }}
      {{- end }}
      initContainers:
        {{/*
          WAITS FOR THE MIGRATIONS TO FINISH -- not for the gateway, and not for one table.

          This is a plain Job, so Kubernetes creates it at `helm install` time, MINUTES BEFORE the
          post-install hooks that bootstrap the database. Waiting on the gateway let it start while
          PostgREST had no schema behind it (and the probe carried no `-f`, so the gateway's 502
          counted as success). Waiting on `public.devices` was no better: 0001 creates it, so the
          probe passed once one migration of seventy had run, and the suite was green whenever
          db-init happened to win the race and read as flaky quarantine bugs otherwise. 0072 has
          the full account.

          `1/count(*)` IS THE FIX RATHER THAN DECORATION. This helper reads the EXIT CODE, and a
          query matching no rows still exits 0 -- so no table name could express "and the chain has
          finished". The division makes an empty result an ERROR: no sentinel row yet, or
          `completed_at` still NULL mid-chain, and psql exits non-zero so the loop waits.
        */}}
        {{- include "aber.waitForPostgres" (dict
             "ctx" .
             "name" "wait-for-migrations"
             "host" (include "aber.supabaseDb.host" .)
             "port" (include "aber.supabaseDb.port" .)
             "user" "postgres"
             "db" "postgres"
             "passwordKey" "POSTGRES_PASSWORD"
             "query" "SELECT 1/count(*) FROM public.schema_bootstrap WHERE completed_at IS NOT NULL;"
             "describe" "db-init to finish the whole migration chain (public.schema_bootstrap.completed_at) — it is a post-install hook and runs AFTER this Job is created")
           | nindent 8 }}
        {{/*
          The gateway second, and with `-f` this time. validate.py reaches Supabase THROUGH the
          gateway, so a ready database is necessary but not sufficient. Without `-f` any response
          satisfies the probe, including the 502 the gateway returns while its upstream is down.

          The secret key alone: the gateway matches it as an opaque string and hands PostgREST the
          service-role bearer, which holds SELECT on `devices`. Measured -- no key 401, the
          publishable key alone 401, the secret key 200.
        */}}
        {{- include "aber.waitFor" (dict "ctx" . "name" "wait-for-gateway" "image" "curlimages/curl:8.10.1" "command" (printf "curl -sf -o /dev/null -H \"apikey: $SUPABASE_SECRET_KEY\" '%s/rest/v1/devices?limit=1'" (include "aber.supabase.internalUrl" .)) "describe" "the gateway routing to PostgREST with a live schema" "env" (include "aber.secretEnv" (dict "name" "SUPABASE_SECRET_KEY" "secretName" $secretName "key" "SUPABASE_SECRET_KEY"))) | nindent 8 }}
        {{/*
          NODE-RED AND i3X TOO, because validate.py asserts against them directly: checks 7/7b
          drive a real editor sign-in and 12-12f exercise the i3X address space.

          THIS JOB'S START TIME IS NOT ORDERED BY THE CI WORKFLOW. It is a plain Job created at
          install, so its own initContainers are the only thing holding it back and CI's "wait for
          every workload" step runs CONCURRENTLY with it. Without these waits it failed with
          `Connection refused` and `HTTP 0` against pods that were 1/1 Running by the time anyone
          looked.

          `curl -s` WITHOUT `-f` FOR NODE-RED, deliberately, and it is not the mistake corrected
          above: curl still exits non-zero when it cannot connect, so this proves the port is open
          and speaking HTTP, and Node-RED's admin API answers 401 unauthenticated -- which is what
          check 7 asserts, so demanding a 2xx would wait forever. i3X's /info is unauthenticated by
          specification, so `-f` is right there.
        */}}
        {{- if .Values.nodeRed.enabled }}
        {{- include "aber.waitFor" (dict "ctx" . "name" "wait-for-node-red" "image" "curlimages/curl:8.10.1" "command" "curl -s -o /dev/null http://node-red:1880/" "describe" "node-red (checks 7/7b sign in to the editor)") | nindent 8 }}
        {{- end }}
        {{- if .Values.i3xService.enabled }}
        {{- include "aber.waitFor" (dict "ctx" . "name" "wait-for-i3x" "image" "curlimages/curl:8.10.1" "command" "curl -sf -o /dev/null http://i3x-service:8090/v1/info" "describe" "i3x-service (checks 12-12f read its address space)") | nindent 8 }}
        {{- end }}
        {{/*
          AND THE INGESTION DAEMON LAST, ON ITS OWN METRIC RATHER THAN ON ITS POD.

          The daemon is held behind its own wait on the telemetry hypertable, so on a slow node it
          reaches the broker minutes after this Job is created, and nothing orders the two. Without
          this wait every check that needed the daemon to have CONSUMED something failed while every
          check that read the database passed -- Sparkplug fixtures go out at QoS 0, so a scenario
          published before the daemon subscribed is simply gone, not queued. docs/incidents.md
          carries the account.

          CI's own "wait for the ingestion daemon to be consuming" step does not cover this, for the
          reason the block above gives: a workflow step runs concurrently with a plain Job.

          `aber_ingestion_mqtt_connected`, NOT `aber_ingestion_up`. `up` says the process is alive,
          which it is throughout the failure; the subscription is the thing being waited on. Read
          from the headless metrics Service, which sets `publishNotReadyAddresses` precisely so an
          unhealthy daemon can still be scraped.
        */}}
        {{- if .Values.ingestion.enabled }}
        {{- include "aber.waitFor" (dict "ctx" . "name" "wait-for-ingestion" "command" "wget -q -O - http://ingestion-metrics:9108/metrics 2>/dev/null | awk '/^aber_ingestion_mqtt_connected /{found=($2==1)} END{exit found?0:1}'" "describe" "the ingestion daemon to be subscribed to spBv1.0/# (every check that asserts on consumed telemetry)") | nindent 8 }}
        {{- end }}
      containers:
        - name: validate
          # The test-runner image: the ingestion image plus jsonschema and the AAS suite. Built from
          # test-harness/Dockerfile with the REPOSITORY ROOT as context.
          image: {{ include "aber.image" (dict "image" .Values.e2e.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.e2e.image.pullPolicy }}
          command: ["python", "validate.py"]
          env:
            # TimescaleDB. M2: the standard port. validate.py defaults DB_PORT to 5433 only when
            # DB_HOST is UNSET -- naming the host is what selects 5432 -- but both are set here
            # explicitly so the Job's environment reads as a complete statement of its topology.
            {{- with include "aber.dbClientTlsEnv" . }}{{ . | nindent 12 }}{{- end }}
            - name: DB_HOST
              value: {{ include "aber.timescale.host" . | quote }}
            - name: DB_PORT
              value: {{ include "aber.timescale.port" . | quote }}
            - name: DB_NAME
              value: {{ .Values.timescaledb.database | quote }}
            - name: DB_USER
              value: {{ .Values.timescaledb.username | quote }}
            {{- include "aber.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            # Supabase's own database, reached directly for the audit-row cleanup that migration
            # 0003 deliberately put out of reach of service_role. SUPABASE_DB_PORT's conditional
            # default is what makes this correct in-cluster.
            - name: SUPABASE_DB_HOST
              value: {{ include "aber.supabaseDb.host" . | quote }}
            - name: SUPABASE_DB_PORT
              value: {{ include "aber.supabaseDb.port" . | quote }}
            {{- include "aber.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- /* The broker port and transport follow `mosquitto.tls.internalClients` with every
                   other in-cluster client; the CA projection below is the same one. */}}
            {{- include "aber.brokerClientEnv" . | nindent 12 }}
            {{- /*
              The validator connects AS AN ORDINARY GATEWAY, confined by its own broker role to its
              own edge-node subtree exactly as a Remote one is. The username is the `sparkplug_id`
              generated from VAL_GW_UUID in validate.py -- pinned there precisely so this
              credential can be issued before the row exists. A mismatch between the two shows up
              as every publish being silently dropped, and the run failing as "no telemetry".
            */}}
            {{/*
              THE ENV NAMES MUST BE MQTT_VALIDATOR_*, not the generic MQTT_USER/MQTT_PASSWORD they
              were until 2026-08. This Job always read the right SECRET KEYS; it exposed them under
              names that invited the exact confusion validate.py now refuses -- the generic pair is
              what the INGESTION service is given, and that principal cannot publish DBIRTH or
              DDATA at all. validate.py reads the validator names directly and exits naming the
              variable if they are absent, so a rename here is not cosmetic: it is the wiring.
            */}}
            {{- include "aber.secretEnv" (dict "name" "MQTT_VALIDATOR_USER" "secretName" $secretName "key" "MQTT_VALIDATOR_USER") | nindent 12 }}
            {{- include "aber.secretEnv" (dict "name" "MQTT_VALIDATOR_PASSWORD" "secretName" $secretName "key" "MQTT_VALIDATOR_PASSWORD") | nindent 12 }}
            {{/*
              The primary host id the daemon publishes its STATE under. THE SAME HELPER THE DAEMON
              AND THE BROKER RECONCILE USE, so check 15 asserts against the value that was actually
              deployed rather than a word restated here. Its whole point is to read that topic the
              way a third-party gateway does -- which this Job's credential is, a gateway account
              holding the shared role's read of `spBv1.0/STATE/#`.
            */}}
            - name: PRIMARY_HOST_ID
              value: {{ include "aber.primaryHostId" . | quote }}
            # validate.py publishes under this group, and the gateway row it seeds carries it.
            - name: SPARKPLUG_GROUP
              value: {{ include "aber.sparkplugGroup" . | quote }}
            - name: SUPABASE_URL
              value: {{ include "aber.supabase.internalUrl" . | quote }}
            # WITHOUT THE SECRET KEY the script seeds nothing and fails about 12 of 20 checks in a
            # way that reads like a schema fault ("no quarantined device reported", "no telemetry
            # records"), with the real cause one line up in its own banner: "Secret key: MISSING".
            # The service-role JWT is read by one check only, which proves the gateway refuses it.
            {{- include "aber.secretEnv" (dict "name" "SUPABASE_SECRET_KEY" "secretName" $secretName "key" "SUPABASE_SECRET_KEY") | nindent 12 }}
            {{- include "aber.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 12 }}
            {{- include "aber.secretEnv" (dict "name" "SUPABASE_SERVICE_ROLE_KEY" "secretName" $secretName "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            # Check 7 probes all three Node-RED auth surfaces -- the editor, the /flows admin API and
            # the webhook receiver -- and it has to be an end-to-end check: the fix is a runtime
            # property of the assembled stack, and a settings.js securing only /flows would leave the
            # webhook receiver open.
            {{- /*
              THE PUBLIC ORIGIN, NOT THE IN-CLUSTER ONE, AND THE COOKIE IS THE REASON.

              7b drives the real browser handshake, and the state and PKCE verifier live in
              Node-RED's express session, so the callback has to arrive carrying the cookie the
              /auth/strategy request set. A COOKIE JAR IS HOST-SCOPED: starting at `node-red:1880`
              and receiving the callback at `nodered.<publicBaseDomain>` -- which is what the OAuth
              client's registered redirect_uri necessarily is -- means the cookie is never sent
              back, Node-RED has no verifier for the code, and Passport fails with 403 surfacing as
              `AuthenticationError: Forbidden`.

              The public origin makes the flow single-origin, and check 7 then exercises the ingress
              path a real operator uses. Falls back to the in-cluster Service with no public domain
              configured, so such a stack still runs the suite.
            */}}
            - name: NODERED_BASE_URL
              value: {{ (.Values.publicUrls.nodered | default (ternary (printf "%s://nodered.%s" .Values.global.scheme .Values.global.publicBaseDomain) "" (ne (.Values.global.publicBaseDomain | toString) ""))) | default "http://node-red:1880" | quote }}
            {{- include "aber.secretEnv" (dict "name" "NODERED_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "NODERED_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- /*
              I3X_BASE_URL WAS NEVER SET HERE, so checks 12-12f have never actually run on this
              target. validate.py defaults it to `http://localhost:8090`, which inside this Job's
              own pod is the Job itself -- nothing listens, and the suite reported `/info returned
              HTTP 0`, indistinguishable from a broken i3X server. This is the in-cluster name the
              rest of the stack uses.
            */}}
            {{- if .Values.i3xService.enabled }}
            - name: I3X_BASE_URL
              value: http://i3x-service:8090
            {{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            {{- toYaml .Values.e2e.resources | nindent 12 }}
          {{- $brokerTls := and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
          {{- if or $brokerTls .Values.postgresTls.enabled }}
          volumeMounts:
            {{- if $brokerTls }}
            {{- include "aber.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
            {{- with include "aber.dbClientCaMount" . }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
      {{- if or $brokerTls .Values.postgresTls.enabled }}
      volumes:
        {{- if $brokerTls }}
        {{- include "aber.brokerClientCaVolume" . | nindent 8 }}
        {{- end }}
        {{- with include "aber.dbClientCaVolume" . }}{{ . | nindent 8 }}{{- end }}
      {{- end }}
{{- end }}
