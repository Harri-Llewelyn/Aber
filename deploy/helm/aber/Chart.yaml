apiVersion: v2
name: aber
description: Aber, the shopfloor data platform — Supabase BaaS, TimescaleDB historian, Sparkplug B ingestion, Node-RED edge automation and Grafana.
type: application

# The release this tree is. The commit a `v*` tag points at sets both of these to the tag's
# version, in the pull request that prepares the release, and release.yml refuses a tag they
# disagree with. So a checkout of the tag renders, documents and (through `npm run setup`) prints
# the install of the release it is. Between releases they stay at the last release, so a working
# tree renders as the release it descends from rather than as one that does not exist yet.
# release.yml also stamps both from the tag when it packages the chart.
version: 1.0.2

# The platform release this chart deploys, and -- because `image.tag` is empty for every image
# this repository builds -- the tag those five images are pulled at. That coupling is the point:
# the chart and the images it names ship from one tag and cannot drift apart. Third-party images
# keep their own explicit pins, which must NOT float, since several of them carry a schema
# migration or a version coupling -- the couplings to an image this repository builds FROM are
# held by check-docs-drift.mjs.
#
# Quoted because Helm requires a string here and an unquoted 0.1.0 is fine but 1.0 would become
# a float.
appVersion: "1.0.2"

kubeVersion: ">=1.25.0-0"

home: https://github.com/Harri-Llewelyn/Aber
sources:
  - https://github.com/Harri-Llewelyn/Aber

keywords:
  - factory-plus
  - sparkplug-b
  - mqtt
  - timescaledb
  - supabase
  - industrial-iot

annotations:
  # The whole stack is in this chart: the data tier, the Supabase control plane, messaging, the
  # edge and frontend, ingress, hardening and telemetry. The design reasoning for each is in
  # docs/kubernetes-architecture.md, which source comments cite by section number. What is and is
  # not deployed is in deploy/k8s/README.md.

  # OFF BY DEFAULT, and named here because they are the difference between a chart that installs
  # and one that installs correctly for a given cluster. Each needs a value the chart cannot
  # infer, and each fails as something other than itself -- see values-prod.yaml.example.
  aber.io/optional-features: "networkPolicy,podDisruptionBudgets,autoscaling,backup"
