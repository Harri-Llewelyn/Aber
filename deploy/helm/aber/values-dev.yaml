# =============================================================================================
# Local k3s development profile.
#
#   helm install aber deploy/helm/aber -f deploy/helm/aber/values-dev.yaml
#
# EVERY CREDENTIAL BELOW IS A PUBLISHED DEMO VALUE, the demonstration set. They are in
# git, they are in the repository's CI logs, and they are the same on every developer's machine.
# That is fine for a laptop k3s and is NEVER acceptable anywhere else -- values-prod.yaml.example
# is the starting point for anything reachable by another person.
#
# The anon and service-role keys are JWTs signed ES256 by the demonstration key pair in jwtKeys
# below, which carries jwtSecret as its legacy key; the set is matching and must be replaced
# together. See the note on `secrets` in values.yaml.
# =============================================================================================

global:
  # Every `*.localhost` name is this machine: browsers resolve it themselves, Windows and
  # systemd-resolved resolve it for everything else, and browsers treat it as a secure context,
  # which the Studio and forge logins need over plain HTTP (they set Secure cookies, which any
  # other http host loses). Feeds both the Ingress rules and the browser-facing URLs the OAuth
  # clients are registered with -- one value, so they cannot disagree.
  publicBaseDomain: localhost
  scheme: http
  # k3s's built-in provisioner. Node-local and ReadWriteOnce -- see values.yaml.
  storageClass: local-path

supabaseAuth:
  # The four demo personas (supabase/seed.sql), whose password is published. This file is the only
  # place they are turned on; validate.py and the stack lane sign in as them.
  demoAccounts: true
  # ES256, so the stack lane tests the signing new sites get; the upgrade rehearsal keeps HS256.
  es256Signing: true

dbInit:
  # The example metric catalog (supabase/example-metrics.sql). validate.py and the AAS conformance
  # fixture read the catalog rows of the metrics they publish.
  exampleMetrics: true

secrets:
  jwtSecret: super-secret-jwt-token-with-at-least-32-characters
  # The DEMONSTRATION EC P-256 pair, for development only like everything here: GoTrue's signing
  # set and the verifiers' JWKS, each with jwtSecret above as the legacy `oct` key.
  jwtKeys: '[{"kty":"EC","kid":"aber-development-demonstration-key","use":"sig","alg":"ES256","crv":"P-256","x":"7_yJLFbbSFPSHklYZFespYf-U4kxR_CqJtnAaKaLnvg","y":"sNgk6zj2eHqrFMfnAtFsoS6HLeNWyePs5tQ7x7GQO5M","key_ops":["sign","verify"],"d":"_ZIWwzwKT1hRrDYRBv5EuCpn-r1ZS_nkFh8ISZQVbaM"},{"kty":"oct","k":"c3VwZXItc2VjcmV0LWp3dC10b2tlbi13aXRoLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnM","alg":"HS256"}]'
  jwtJwks: '{"keys":[{"kty":"EC","kid":"aber-development-demonstration-key","use":"sig","alg":"ES256","crv":"P-256","x":"7_yJLFbbSFPSHklYZFespYf-U4kxR_CqJtnAaKaLnvg","y":"sNgk6zj2eHqrFMfnAtFsoS6HLeNWyePs5tQ7x7GQO5M","key_ops":["verify"]},{"kty":"oct","k":"c3VwZXItc2VjcmV0LWp3dC10b2tlbi13aXRoLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnM","alg":"HS256"}]}'
  anonKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFiZXItZGV2ZWxvcG1lbnQtZGVtb25zdHJhdGlvbi1rZXkifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiZXhwIjoyMDAwMDAwMDAwfQ.JMb7HUEgwdqrj-6LwYAEYRassYEe7ZXBwRrBcmNJ77d0w9xG0dynSoCcNTOc_QMQdR2J4Z7JFRV5prMWdBxL6w
  serviceRoleKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFiZXItZGV2ZWxvcG1lbnQtZGVtb25zdHJhdGlvbi1rZXkifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJleHAiOjIwMDAwMDAwMDB9._7pCG15S37d0VzyCq5F2jHhRgMonld1k26pQV8U9NRyBUy9PkodxdEOsI9s_vNI0d7pDc4_pZA1kiC30aGj0yQ
  # The keys callers present; demo values, as the two JWTs above are.
  publishableKey: sb_publishable_aber_dev_00000000000000000000
  secretKey: sb_secret_aber_dev_000000000000000000000000
  postgresPassword: postgres
  timescalePassword: postgres

  # THE TWO HISTORIAN ROLES, required by `aber.validateSecrets` since
  # d2b80d5. This fixture did not carry them, so `helm template -f values-dev.yaml` failed at
  # NOTES.txt for four days and nothing said so -- every CI run was failing at the billing gate
  # before it reached the step. Distinct values rather than one shared password: the whole point of
  # the pair is that the FDW mapping and the ingestion daemon authenticate as different roles, and
  # a fixture that gives them the same secret cannot catch a mix-up between them.
  ingestWriterPassword: aber-ingest-writer
  fdwReaderPassword: aber-fdw-reader

  # THE TWO MACHINE-PRINCIPAL KEYS, and their absence is a CRASH LOOP rather than a render error.
  # The chart has always carried the plumbing -- secret.yaml maps both, and the two Deployments
  # read them -- but this fixture left them empty, so `helm install` succeeded and the ingestion
  # pod halted itself: "CRITICAL SECURITY ERROR: Supabase client is uninitialized ... refusing to
  # start MQTT loop in fail-open state." Correct behaviour, ten minutes of `0 of 1 updated
  # replicas are available`, and a failure that names neither the chart nor this file.
  #
  # Demonstration JWTs signed ES256 by the key pair above:
  # Service_Ingestor is sub b0000000-...-0002 (0046), Service_Playback is ...-0003 (0056) and
  # Service_ReleaseCheck is ...-0004 (0181).
  # None is `service_role` -- that is the whole point of Machine Identities, and copying the
  # service key here instead would produce a working stack that proves nothing.
  ingestionKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFiZXItZGV2ZWxvcG1lbnQtZGVtb25zdHJhdGlvbi1rZXkifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhdXRoZW50aWNhdGVkIiwic3ViIjoiYjAwMDAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDAwMDAyIiwiZXhwIjoyMDAwMDAwMDAwfQ.DHKaCbVTO-HtuwaYNDYAuECayJiZvAIuBY0RsQzmCr-V8KWxy5f66XnW61SY9Y8qtxMD241wFA8nX4I6SRkXXA
  playbackKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFiZXItZGV2ZWxvcG1lbnQtZGVtb25zdHJhdGlvbi1rZXkifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhdXRoZW50aWNhdGVkIiwic3ViIjoiYjAwMDAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDAwMDAzIiwiZXhwIjoyMDAwMDAwMDAwfQ.jawkPFYTd_7y-KX2iyF96O3UlezB3OiU5BDwgviVWo5TnfTayn_AuJrbCsCzbmsCgSVc-yVOqjt02bF2FqNSLg
  releaseCheckKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFiZXItZGV2ZWxvcG1lbnQtZGVtb25zdHJhdGlvbi1rZXkifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhdXRoZW50aWNhdGVkIiwic3ViIjoiYjAwMDAwMDAtMDAwMC00MDAwLTgwMDAtMDAwMDAwMDAwMDA0IiwiZXhwIjoyMDAwMDAwMDAwfQ.ZPRR0A0dLCvz4rqYUnU6dTC1o-2KTqLHFOWleJoKdgAUkhS1mc7SiXv2JVqgJw-io69NQpjtIPPo-BFH2DOpWg

  # Realtime's own metrics endpoint, separate from the session JWT secret.
  realtimeMetricsJwtSecret: aber_realtime_metrics_jwt_secret_development_only

  # EXACTLY 16 characters, and AT LEAST 64 characters. The chart asserts both.
  realtimeDbEncKey: supabaserealtime
  realtimeSecretKeyBase: 8f2c1d4b7a9e0356c8b1f4d72e5a90c3b6d8f1a4e7c025d9a3e6b8c1f4d7a0e39

  pgMetaCryptoKey: aber-pg-meta-crypto-key

  # The platform principals; see values.yaml for why the validator's username is a sparkplug_id
  # and not free text. One shared password here only because this file is the CI fixture.
  mqttIngestionUser: aber_ingestion
  mqttIngestionPassword: aber123
  mqttI3xUser: aber_i3x
  mqttI3xPassword: aber123
  mqttValidatorUser: gwy110000000000400080000
  mqttValidatorPassword: aber123
  mqttMonitorUser: aber_monitor
  mqttMonitorPassword: aber123
  # The plugin's admin. Required: the broker's initContainer exits without it.
  mqttDynsecAdminUser: dynsec-admin
  mqttDynsecAdminPassword: aber123dynsecadmin

  # The bearer token supabase-functions presents to the gateway-credential sidecar.
  #
  # NOT OPTIONAL, AND NOT A DEFAULT THE SERVICE CAN INVENT. It exits 2 on anything shorter than 32
  # characters rather than running open -- that service can issue a broker account for any edge
  # node, and the gateway's role makes an account the ability to publish telemetry as that gateway. Unset, the
  # sidecar CrashLoopBackOffs, which takes the whole mosquitto POD out of Ready and stalls every
  # workload that waits on the broker. The symptom is i3x-service and ingestion timing out, naming
  # neither this value nor the container that refused to start.
  mqttCredentialServiceToken: aber-dev-credential-service-token-not-a-secret

  giteaAdminPassword: gitea-admin
  # The forge's door (0094).
  giteaOAuthClientSecret: change-me-gitea-oauth-client-secret
  giteaProxyHmacSecret: change-me-gitea-proxy-hmac-secret
  giteaWebhookSecret: change-me-gitea-webhook-secret
  # Studio's door: on here because ingress.routes.studio is, below.
  studioOAuthClientSecret: change-me-studio-oauth-client-secret
  studioProxyHmacSecret: change-me-studio-proxy-hmac-secret

  grafanaAdminUser: admin
  grafanaAdminPassword: admin
  grafanaOAuthClientSecret: change-me-grafana-oauth-client-secret
  grafanaAlertWebhookSecret: change-me-grafana-alert-webhook-bearer-min-32-chars
  # Grafana connects to the historian as `powerbi_reader`, never as `postgres`.
  biReaderPassword: aber123

  noderedCredentialSecret: abersecret
  noderedOAuthClientSecret: change-me-nodered-oauth-client-secret
  noderedWebhookJwtSecret: change-me-nodered-webhook-signing-key-min-32-chars
  # Break-glass path stays shut by default.
  noderedAdminToken: ""

# Studio's route is off by default as an exposure decision (values.yaml). On a loopback domain
# there is nothing to expose, and with it on the Directory's studio link works.
ingress:
  routes:
    studio: true

# Small volumes: a laptop k3s is usually running on the same disk as everything else, and
# local-path takes the space from the node's filesystem immediately.
timescaledb:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  # The backup sidecar checks every 10 s rather than every minute, so the stack lane's wait for one
  # more pass of it is short (timescaledb/test_physical_backup.py reads the value from the pod).
  # `npm run dev:up` turns the backup itself on.
  physicalBackup:
    pollSeconds: 10

supabaseDb:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # As the historian's, so the two sidecars run alike.
  physicalBackup:
    pollSeconds: 10

# The dev loop reaches both databases through port-forwards on `localhost`, which the certificate
# has to name for a host-side client to verify it. `npm run dev:up` turns the TLS itself on.
postgresTls:
  extraDnsSans:
    - localhost

# The one-liner over plain HTTP, on this laptop cluster alone: it has no ingress TLS to pin, and
# the installer would otherwise refuse to be minted or served (values.yaml says why).
supabaseFunctions:
  gatewayEnrolment:
    allowPlaintextInstaller: true

# On by default in values.yaml too; stated here because the dev loop depends on it.
# `test_playback_replay.py` replays a fixture onto the seeded Playback gateway through the real
# worker, real broker and real daemon, and needs the Deployment running. No credential is set
# here: one is minted and DELIVERED during that suite, which is the half that has broken twice.
playback:
  enabled: true

# REQUIRED, both, and values.yaml deliberately ships them empty. A real site names its own
# because every gateway is configured with them; the dev cluster names the platform.
ingestion:
  primaryHostId: Aber
  sparkplugGroup: Aber

# The forge's SSH port `npm run setup` writes for a new site, so the dev loop and CI enrol gateways
# the way a new site does: the clone URL carries the port and known_hosts names `[host]:2222`. The
# container still listens on 22, which is where the dev loop's port-forward goes.
gitea:
  ssh:
    external:
      port: 2222
