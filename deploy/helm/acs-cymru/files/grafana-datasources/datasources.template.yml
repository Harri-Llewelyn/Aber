# TimescaleDB datasource -- A TEMPLATE, rendered before Grafana reads it.
#
# ONE TEMPLATE SERVES BOTH DEPLOYMENT TARGETS, the same arrangement supabase/kong.yml uses:
#   * Docker Compose: the grafana service's entrypoint substitutes __DB_PASSWORD__ with `sed` and
#     writes the result into the grafana_provisioning_datasources volume.
#   * Kubernetes: Helm renders the same placeholder into a Secret mounted directly at
#     /etc/grafana/provisioning/datasources/datasources.yml, and Grafana runs its stock /run.sh
#     with no entrypoint override at all. See docs/kubernetes-architecture.md §2.4.
#
# THE PLACEHOLDER IS `__BI_READER_PASSWORD__`, not `${BI_READER_PASSWORD}`. The shell form had to
# survive Compose's own variable substitution AND sed's, which is what produced the
# barely-readable `sed "s/\$${DB_PASSWORD}/$$DB_PASSWORD/g"` this replaces. `__UPPER_SNAKE__`
# needs no escaping in either substituter and matches the convention kong.yml already uses.
#
# The password is NOT committed here, for the same reason the Kong API keys are not: .env stays
# the single source of truth, and the rendered file lands on an internal volume or in a Secret.
#
# ---------------------------------------------------------------------------------------------
# GRAFANA CONNECTS AS `powerbi_reader`, NOT AS `postgres`.
#
# It used to hold the superuser credential, which meant a service fronted by browser SSO carried
# the credential that owns the historian -- and a dashboard query with a typo could DROP a
# hypertable. The role is created by timescaledb/roles.sql and may SELECT the three rollup views
# and nothing else: raw `telemetry`, `assets` and `telemetry_latest` are explicitly revoked.
#
# THAT RESTRICTION HAS A CONSEQUENCE WORTH KNOWING BEFORE YOU EDIT A DASHBOARD. A panel querying
# raw `telemetry` now fails with a permission error rather than returning rows. That is the
# intended behaviour -- charting raw is what the rollups exist to avoid, and `telemetry_gapfill()`
# is how a report-by-exception series is meant to be read -- but it is a real change in what a
# dashboard author may write. Widen the grant in roles.sql deliberately if a panel genuinely needs
# raw, rather than repointing this datasource back at the superuser.
#
# The provisioned dashboard already reads only the rollups, so nothing shipped here changes.
#
# `BI_READER_PASSWORD` EMPTY MEANS THE ROLE WAS NEVER CREATED, and Grafana will fail to connect
# with "password authentication failed". That is the honest failure: the alternative is falling
# back to the superuser, which is the thing this removed.
apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    # In-network service name and the STANDARD port, not the host-published 5433. Identical on
    # both targets -- which is the point of keeping Kubernetes Service names the same as the
    # Compose service names.
    url: timescaledb:5432
    user: grafana_reader
    database: postgres
    isDefault: true
    version: 2
    secureJsonData:
      password: __BI_READER_PASSWORD__
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true

  # ---------------------------------------------------------------------------------------------
  # The Supabase database -- ONE VIEW, and the reason it is here at all.
  # ---------------------------------------------------------------------------------------------
  # The storage question spans two databases and neither can answer it alone. TimescaleDB knows
  # what the telemetry costs and nothing about `digital_thread` -- the table this platform promises
  # never to prune, and therefore the one whose growth actually needs watching. The postgres_fdw
  # link runs Supabase -> TimescaleDB and nothing runs back, so `public.storage_footprint` (created
  # by archived migration 0027, over `timescaledb/storage.sql`) can only live on this side. That is what
  # makes a second datasource necessary rather than merely convenient.
  #
  # IT CONNECTS AS `grafana_reader`, WHICH MAY SELECT THAT ONE VIEW.
  #
  # Grafana used to hold the `postgres` superuser credential for the HISTORIAN and that was removed
  # deliberately: a service fronted by browser SSO must not carry the key that owns the database.
  # Repeating it here would be strictly worse, because the Supabase superuser bypasses RLS and can
  # rewrite the audit trail. archived migration 0027 creates the role, grants SELECT on the view, and then
  # re-revokes everything else in the schema on every boot -- so the grant is reconciled rather
  # than merely initial.
  #
  # SAME NAME AND SAME PASSWORD AS THE HISTORIAN'S `grafana_reader`, on purpose. It is the same
  # tool, and a second secret to rotate for it is a second secret to forget. The two roles are
  # unrelated objects in unrelated databases and share nothing but the credential; neither can
  # reach anything in the other.
  #
  # AN EMPTY BI_READER_PASSWORD SKIPS THE ROLE, in 0027 exactly as in timescaledb/roles.sql -- so
  # on a stack that never configured one, this datasource fails its health check with
  # "password authentication failed". That is the honest failure: the alternative is falling back
  # to a credential that can rewrite the digital thread.
  - name: Supabase
    uid: supabase
    type: postgres
    access: proxy
    # In-network service name and the STANDARD port, not the host-published 54322. Identical on
    # both targets, which is what lets this file be mirrored into a Helm ConfigMap verbatim -- the
    # renderer substitutes the password and nothing else, so it cannot use a chart helper here.
    url: supabase-db:5432
    user: grafana_reader
    database: postgres
    # NOT default. The historian above stays default so that an existing panel, and any dashboard
    # imported without an explicit datasource, keeps resolving to the telemetry it was written
    # against.
    isDefault: false
    version: 1
    secureJsonData:
      password: __BI_READER_PASSWORD__
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1700
      # NOT a TimescaleDB connection, whatever the view underneath reaches over the FDW. Setting
      # this true makes Grafana's query builder offer `time_bucket()` and friends against a server
      # that has no TimescaleDB extension installed, and the resulting panel fails at run time with
      # an undefined-function error that names neither cause.
      timescaledb: false

  # ===============================================================================================
  # Prometheus -- the metrics store, and the only datasource here that is not a database.
  #
  # NO CREDENTIAL, AND NOTHING TO SUBSTITUTE. The two Postgres datasources above carry
  # __BI_READER_PASSWORD__ because they authenticate; Prometheus is reachable on the compose network
  # and serves reads to anything that can connect. That is also why the port is not published to the
  # host for Grafana's benefit -- it does not need to be.
  #
  # THE URL IS A PLACEHOLDER BECAUSE THE TWO TARGETS REACH DIFFERENT PROMETHEUS INSTANCES. Compose
  # runs its own and substitutes the compose service name; Kubernetes defers to the cluster's
  # Operator-managed one and substitutes `grafana.prometheusUrl`, which defaults to
  # kube-prometheus-stack's conventional service. Hardcoding `prometheus:9090` here would have put
  # a name that means nothing on Kubernetes into the file both targets share.
  #
  # A CLUSTER WITH NO PROMETHEUS gets a datasource whose health check fails, and the five ingestion
  # rules report DatasourceError. That is the same honest failure the Supabase datasource above
  # makes when BI_READER_PASSWORD is unset -- a rule that cannot reach its data should say so rather
  # than evaluate to OK.
  # ===============================================================================================
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: __PROMETHEUS_URL__
    # NOT default. The historian stays default so an existing panel, and any dashboard imported
    # without an explicit datasource, keeps resolving to the telemetry it was written against.
    isDefault: false
    version: 1
    jsonData:
      # Matches `global.scrape_interval` in prometheus/prometheus.yml. Grafana uses it to choose a
      # sensible minimum step, and a value larger than the real interval silently coarsens every
      # graph drawn against this datasource.
      timeInterval: 15s
      httpMethod: POST

  # ===============================================================================================
  # Loki -- the log store, and the drill-down half of every drop counter (roadmap 12).
  #
  # NO CREDENTIAL AND NOTHING TO SUBSTITUTE BUT THE URL, exactly like Prometheus above and for the
  # same reason: Loki is reachable on the compose network and serves reads to anything that can
  # connect. `auth_enabled: false` in loki/loki.yaml is a MULTI-TENANCY switch, not a password --
  # there is no password to configure -- so no `X-Scope-OrgID` header is needed here either.
  #
  # WHICH IS THE WHOLE COST ARGUMENT FOR THE STORE, EXPRESSED AS A FILE. Rendering archived
  # telemetry in Grafana was refused because it would add "a container, a gateway route and an
  # auth surface over raw plant history". This is the third of those three: a fourth datasource
  # beside three that already exist, behind the Grafana login that already exists, with no new
  # principal and no second place to manage access. The store is not published and has no route.
  #
  # THE URL IS A PLACEHOLDER FOR THE REASON PROMETHEUS' IS. The two targets reach different Loki
  # instances: Compose runs its own and substitutes the compose service name; Kubernetes defers to
  # whatever the cluster already runs and substitutes `grafana.lokiUrl`. The chart deploys no Loki,
  # for the same reason it deploys no Prometheus -- a second one would duplicate every line the
  # cluster's collector already ships and give an operator two places to configure retention.
  #
  # A CLUSTER WITH NO LOKI gets a datasource whose health check fails. That is the same honest
  # failure the Supabase datasource makes with no BI_READER_PASSWORD, and it is preferable to a
  # panel that renders empty and reads as "nothing was logged".
  #
  # WHAT A QUERY LOOKS LIKE, because the label set is deliberately small and this is not obvious.
  # alloy/config.alloy labels streams by `service` and `container` only; `reason`, `device` and
  # `edge_node` are FIELDS inside the JSON line, not labels, because labelling by device would be
  # unbounded -- the same rule metrics.py states for Prometheus. So the drill-down from a spike on
  # acs_ingestion_messages_dropped_total{reason="gateway_binding"} is:
  #
  #     {service="ingestion"} | json | reason = "gateway_binding"
  #
  # and it resolves to the same events because test_structured_logging.py asserts the Prometheus
  # label and the logged field carry the same string.
  # ===============================================================================================
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: __LOKI_URL__
    # NOT default. The historian stays default so an existing panel, and any dashboard imported
    # without an explicit datasource, keeps resolving to the telemetry it was written against.
    isDefault: false
    version: 1
    jsonData:
      # A CAP ON RETURNED LINES, AND NOTHING TO DO WITH THE TIME WINDOW. This bounds how many
      # entries one query brings back, so a panel pointed at a busy hour renders instead of trying
      # to draw a million rows into a browser.
      #
      # IT IS NOT A RETENTION SETTING and does not constrain the range a query may ask for --
      # earlier wording here claimed both, which would have sent someone looking for the wrong
      # cause when a long range came back empty. The window is bounded by
      # `limits_config.retention_period` in loki/loki.yaml, at the store, and asking beyond it
      # returns nothing rather than an error.
      maxLines: 5000
