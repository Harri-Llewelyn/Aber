# Alert delivery -- A TEMPLATE, rendered before Grafana reads it.
#
# Same arrangement as datasources.template.yml: an initContainer substitutes the __PLACEHOLDER__
# forms with `sed` into an emptyDir mounted at /etc/grafana/provisioning/alerting, and Grafana
# runs its stock /run.sh.
#
# The substituter asserts that no `__UPPER_SNAKE__` marker survives. An unsubstituted placeholder
# reaching Grafana would be a contact point that authenticates with the literal string, which the
# webhook rejects with 401 -- reported by Grafana as a delivery failure buried in its own logs,
# several steps from the cause.
#
# =============================================================================================
# GRAFANA IS NOT GIVEN `service_role`, AND THAT IS THE WHOLE POINT OF THIS FILE.
#
# The obvious way to let Grafana write to Supabase is to hand it the service-role key. That key
# bypasses RLS entirely and can rewrite `digital_thread`, and this stack has already corrected
# exactly this shape once: Grafana used to connect to the historian as the `postgres` superuser --
# a service fronted by browser SSO holding the credential that owns the database -- and the fix was
# the read-only `grafana_reader` role. Handing it service_role would be strictly worse than the
# credential that was removed, and on Kubernetes the provisioning file is mounted from a Secret
# precisely so this one is not readable by anything with namespace read.
#
# So Grafana holds a NARROW BEARER SECRET that authorises one thing: recording an alert. The edge
# function checks it and then uses its own service-role client internally, which is the same shape
# `nodered_webhook_jwt_secret` gives the quarantine webhook.
#
# TWO CREDENTIALS ARE IN PLAY HERE AND THEY DO DIFFERENT JOBS:
#
#   * `apikey` IN A REQUEST HEADER gets past the gateway. `/functions/v1/` is gated (only four
#     routes are exempt and this is not one of them), so without it the request is refused at the
#     gateway and never reaches the function. The publishable key is public by construction -- it
#     is shipped to every browser -- and the gateway strips it on this route, so it is not
#     forwarded upstream either.
#   * `Authorization: Bearer` is the secret the FUNCTION checks. This is the one that matters.
#
# THE apikey MOVED OUT OF THE QUERY STRING, and the reason it was ever there has expired. Grafana's
# webhook integration used to expose exactly one header pair (`authorization_scheme` +
# `authorization_credentials`), which is spent on the bearer secret below -- so the only remaining
# place to put a second credential was the URL. A query-string credential is logged: it lands in
# Grafana's own delivery log and in the access log of anything between here and the gateway, which is a
# poor place for a value to sit even when that value is public. Grafana's `headers` map (11.6+;
# this stack pins 13.1.3, see deploy/helm/acs-cymru/values.yaml) removed the constraint.
#
# IF THIS EVER RUNS ON A GRAFANA WITHOUT `headers`, the symptom is specific and worth knowing:
# Grafana ignores the unknown setting, the gateway refuses the request with 401 for a missing apikey, and
# the notification fails in Grafana's delivery log while the alert rule itself still reports
# correctly. Nothing appears in the edge function's log, because nothing reached it.
# =============================================================================================
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ACS-Cymru Webhook
    receivers:
      - uid: acs-cymru-webhook
        type: webhook
        settings:
          # The gateway's Service name and port.
          #
          # NO CREDENTIAL IN THIS URL. Both now travel as headers; see the header of this file.
          url: http://supabase-kong:8000/functions/v1/grafana-alert-webhook
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: __GRAFANA_ALERT_WEBHOOK_SECRET__
          # The gateway reads `apikey` from a header or the query string (the query form is for
          # the Realtime client's sake); this is the header form. Separate from the pair above
          # because they authenticate at different layers -- this one gets past the GATEWAY, that
          # one is checked by the FUNCTION -- and conflating them is how Grafana ends up holding a
          # credential broader than "may record an alert".
          headers:
            apikey: __SUPABASE_PUBLISHABLE_KEY__
          # 0 means "no cap". A cap silently truncates the alert array, and a multi-dimensional rule
          # over six devices can legitimately deliver six instances in one notification -- dropping
          # some of them would leave the dashboard showing a subset with nothing indicating that.
          maxAlerts: 0
        # Resolved notifications are the entire mechanism by which the dashboard's toast clears and
        # the Topbar pill decrements. Grafana defaults this to true; it is stated because switching
        # it off would leave every alert latched on in the UI forever, with the rule showing Normal.
        disableResolveMessage: false
