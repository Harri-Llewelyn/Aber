# =============================================================================================
# Kong declarative configuration -- Factory+ API gateway
#
# THIS FILE IS A TEMPLATE, and ONE TEMPLATE SERVES BOTH DEPLOYMENT TARGETS.
#
#   * Docker Compose: `supabase-kong-init` substitutes the __PLACEHOLDERS__ with `sed` and writes
#     the result to a volume Kong reads. Kong 2.8 has no environment interpolation in declarative
#     config (that arrived in 3.x), and the alternative -- committing the literal keys here --
#     would create a second source of truth that silently disagrees with .env the first time
#     anyone rotates a key.
#   * Kubernetes: Helm renders the same placeholders into a Secret mounted at the same path, and
#     `supabase-kong-init` does not exist at all. See docs/kubernetes-architecture.md §2.3.
#
# EVERY PLACEHOLDER IS `__UPPER_SNAKE__`, and both substituters assert that none survive. Adding
# one means adding it to `supabase-kong-init` in docker-compose.yml AND to the chart.
#
# FOUR ROUTES ARE DELIBERATELY EXEMPT from `key-auth`, and all four are load bearing:
#
#   * `/auth/v1/`                                    -- sign-in must work before a session exists
#   * `/functions/v1/{grafana,nodered}-userinfo`     -- an OAuth client sends client credentials,
#                                                       never a Supabase apikey
#   * `/storage/v1/object/public/`                   -- an AAS File URL must resolve with no session
#   * `/ping` and `/v1/`                             -- the Factory+ Directory adapter, whose
#                                                       clients have no apikey. `/ping` is open by
#                                                       specification; `/v1/` is authenticated by
#                                                       the FUNCTION, not by the gateway
#
# Each carries a note at its own service definition. The full reasoning, and what the exemptions
# do and do not expose:  supabase/README.md -> "API Gateway (kong.yml)"
# =============================================================================================

_format_version: "2.1"

# ---------------------------------------------------------------------------------------------
# API key consumers
# ---------------------------------------------------------------------------------------------
# The anon key is public by construction -- it ships inside the frontend bundle. The service
# role key is not, and appears here only because the gateway must be able to recognise it; the
# rendered file lives on an internal volume, never in the repository.
consumers:
  - username: anon
    keyauth_credentials:
      - key: __SUPABASE_ANON_KEY__
  - username: service_role
    keyauth_credentials:
      - key: __SUPABASE_SERVICE_ROLE_KEY__

services:
  # OPEN BY DESIGN -- see the header. GoTrue authenticates its own callers.
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-routes
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-routes
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          # supabase-js sends the key as a header; the Realtime client sends it in the query
          # string. Both forms are accepted so one plugin configuration serves every client.
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # Do not forward the key upstream. PostgREST authorises on the JWT in the
          # Authorization header, so passing the apikey on serves no purpose and would widen
          # where the service-role key appears in logs.
          hide_credentials: true

  # WebSocket change feed. Two details that are easy to get wrong:
  #   * The upstream path is /socket/ (not /), so a subscriber connecting to
  #     /realtime/v1/websocket reaches /socket/websocket on Realtime.
  #   * THE LEADING HOSTNAME LABEL MUST BE `realtime-dev`. Realtime reads the tenant id from it
  #     rather than from the JWT, so addressing the service by its plain name makes every
  #     handshake fail with a bare 403. Kong runs `preserve_host: false` (the default), which is
  #     what makes the upstream Host header come from this URL in the first place.
  #
  # THIS IS THE ONE UPSTREAM THAT DIFFERS BETWEEN THE TWO TARGETS, hence the placeholder:
  #   * Compose  -> http://realtime-dev.supabase-realtime:4000/socket/
  #                 `realtime-dev.supabase-realtime` is a NETWORK ALIAS declared on the
  #                 supabase-realtime service in docker-compose.yml; the two change together.
  #   * Kubernetes -> http://realtime-dev:4000/socket/
  #                 The Service is simply NAMED `realtime-dev`, so the leading label falls out of
  #                 ordinary in-cluster DNS and no alias mechanism is needed. This is why Realtime
  #                 is the single exception to keeping Service names identical to Compose service
  #                 names -- see docs/kubernetes-architecture.md §3.4.
  - name: realtime-v1
    url: __REALTIME_UPSTREAM_URL__
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
        protocols:
          - http
          - https
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          # The Realtime client puts the key in the query string of the WebSocket URL, which is
          # why key_in_query matters here specifically -- there is no opportunity to set a
          # header on a browser WebSocket handshake.
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # NOT hidden here. Realtime reads the apikey from the query string itself to identify
          # the tenant and evaluate RLS; stripping it breaks the handshake.
          hide_credentials: false

  # Object storage. Uploads go through here rather than straight to supabase-storage so the
  # browser talks to exactly one origin (and one CORS policy) for auth, REST and files alike --
  # and so a public model URL embedded in an exported AAS shell names the gateway, which is the
  # only address that is reachable from outside the compose network.
  #
  # storage-api serves its routes at the ROOT (/bucket, /object/...), so the /storage/v1 prefix
  # is ours and must be stripped.
  # PUBLIC OBJECTS ONLY, and deliberately unauthenticated -- see the header.
  #
  # Declared as its own service rather than as an exempt route on storage-v1 because the upstream
  # path has to survive. With `strip_path: true` the matched prefix is removed, so pointing this
  # at the storage root would forward `/asset-3d-models/x.glb` and lose the `/object/public/`
  # segment storage-api routes on. Baking that segment into the service URL restores it.
  #
  # Kong prefers the longer prefix, so this route wins over `/storage/v1/` below for public
  # object reads and only for those.
  - name: storage-v1-public
    url: http://supabase-storage:5000/object/public/
    routes:
      - name: storage-v1-public-routes
        strip_path: true
        paths:
          - /storage/v1/object/public/

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-routes
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # storage-api authorises uploads on the JWT, not the apikey.
          hide_credentials: true

  # OPEN BY DESIGN. An OAuth client presents client credentials, not a Supabase apikey, and
  # Grafana's `api_url` lands on an edge function rather than on GoTrue. Gated, it 401s and
  # Grafana reports `[oauth.invalid_role] invalid role: Authenticated` -- an RBAC fault, not a
  # gateway one. No Grafana setting can add a header to `api_url`, so the fix has to be here.
  #
  # EXACT PATHS, NOT A PREFIX: `/functions/v1/` would re-open the whole runtime, and naming the
  # endpoints means a function added later is gated by default.
  #
  # ONE SERVICE PER FUNCTION, forced not stylistic: `strip_path` removes the WHOLE matched path,
  # so an exact-path route pointing at `…:9000/` hands the runtime an empty service name and it
  # answers 400 -- naming nothing. The upstream URL must carry the function name itself.
  #
  # What this exposes, and why it is narrower than the other two exemptions:
  #   supabase/README.md -> "API Gateway (kong.yml)"
  - name: functions-v1-grafana-userinfo
    url: http://supabase-functions:9000/grafana-userinfo
    routes:
      - name: functions-v1-grafana-userinfo-route
        strip_path: true
        paths:
          - /functions/v1/grafana-userinfo

  - name: functions-v1-nodered-userinfo
    url: http://supabase-functions:9000/nodered-userinfo
    routes:
      - name: functions-v1-nodered-userinfo-route
        strip_path: true
        paths:
          - /functions/v1/nodered-userinfo

  # ---------------------------------------------------------------------------------------------
  # Factory+ Directory adapter -- the FOURTH key-auth exemption.
  #
  # WHY IT IS EXEMPT. A Factory+ client has no Supabase apikey and no way to acquire one; gating
  # this route would make the adapter unreachable by exactly the clients it exists for, which is
  # the same argument as the two userinfo endpoints above. `/ping` must additionally be reachable
  # with no credential at all -- the component specification requires it for discovery.
  #
  # WHAT STANDS IN FRONT OF THE DATA IS THE FUNCTION, NOT KONG. Every `/v1/` path in
  # fplus-directory refuses a request with no bearer token, before it routes, and then queries as
  # the CALLER so RLS still applies. That inversion is deliberate but it is also the whole
  # security boundary for these routes, so `validate.py` asserts the 401 rather than trusting it.
  #
  # `strip_path: false`, UNLIKE the userinfo routes. Those match one exact path and want it
  # removed; these must preserve `/v1/device/<uuid>` for the function to route on. With
  # strip_path false Kong appends the request path to the service URL, so the runtime receives
  # `/fplus-directory/v1/device/<uuid>` -- which is also how main/index.ts learns which worker to
  # spawn, since it reads the first path segment. Setting strip_path true here would hand it an
  # empty service name and it would answer 400, naming nothing.
  # ---------------------------------------------------------------------------------------------
  - name: fplus-directory
    url: http://supabase-functions:9000/fplus-directory
    routes:
      - name: fplus-directory-ping
        strip_path: false
        paths:
          - /ping
      - name: fplus-directory-v1
        strip_path: false
        paths:
          - /v1/

  - name: functions-v1
    url: http://supabase-functions:9000/
    routes:
      - name: functions-v1-routes
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # THE MOST IMPORTANT OF THE FOUR. The edge runtime boots with VERIFY_JWT="false"
          # because each function performs its own role check, so before this plugin existed an
          # unauthenticated request could reach and start any worker. Now a caller must at least
          # present a recognised key to get that far, and the function's own check still decides
          # what they may do.
          hide_credentials: true

plugins:
  # ---------------------------------------------------------------------------------------------
  # Prometheus metrics for every route and service Kong fronts.
  #
  # KONG IS THE ONLY PLACE THE HTTP TIER CAN BE MEASURED FROM. PostgREST 12.2.0 exposes no metrics
  # at all -- its admin server serves /ready and /live and nothing else -- and neither GoTrue nor
  # storage-api ships an exporter. Because every one of their requests passes through here, Kong's
  # per-service latency and status-code counters cover the whole API surface from one scrape.
  #
  # DECLARED GLOBALLY, ON PURPOSE: a per-service plugin would measure whichever services someone
  # remembered to annotate, and the gap would look like an idle service rather than an unmeasured
  # one.
  #
  # THE METRICS ARE NOT SERVED ON THE PROXY PORT. They appear on Kong's STATUS listener
  # (`KONG_STATUS_LISTEN`, :8100/metrics), which the chart enables when
  # `supabaseKong.metrics.enabled`. Loading the plugin without that listener is harmless and costs
  # a shared-dict counter per request; it simply means nothing can scrape it.
  #
  # `prometheus` MUST ALSO APPEAR IN `KONG_PLUGINS` on both targets. Naming any plugin in that
  # variable REPLACES the bundled set rather than adding to it, so a plugin referenced here but
  # missing there stops Kong dead at boot with `plugin 'prometheus' not enabled; add it to the
  # 'plugins' configuration property` -- which reads as a config-file error and is an env-var one.
  # ---------------------------------------------------------------------------------------------
  - name: prometheus
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        # Swagger UI ("Try it out" issues browser requests from its own origin).
        - "http://localhost:8088"
        - "http://127.0.0.1:8088"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true
