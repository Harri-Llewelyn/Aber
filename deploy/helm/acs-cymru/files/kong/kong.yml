# =============================================================================================
# Kong declarative configuration -- retained as the chart's revert path only.
#
# The gateway is Envoy (supabase/envoy.yaml). The chart reads this file
# only when `supabaseKong.enabled=true` and `supabaseEnvoy.enabled=false`, in which case Helm
# renders the `__UPPER_SNAKE__` placeholders into a Secret. The keys are not committed here.
#
# Six routes are exempt from `key-auth`, across four exemptions:
#   * `/auth/v1/`                                    -- sign-in must work before a session exists
#   * `/functions/v1/{grafana,nodered}-userinfo`     -- an OAuth client sends client credentials
#   * `/storage/v1/object/public/`                   -- an AAS File URL must resolve with no session
#   * `/ping` and `/v1/`                             -- the Factory+ Directory adapter; `/v1/` is
#                                                       authenticated by the function
# The reasoning is in supabase/README.md -> "API Gateway".
# =============================================================================================

_format_version: "3.0"

# ---------------------------------------------------------------------------------------------
# API key consumers
# ---------------------------------------------------------------------------------------------
# The anon key ships inside the frontend bundle; the service-role key appears here only so the
# gateway can recognise it, and the rendered file never lands in the repository.
consumers:
  - username: anon
    keyauth_credentials:
      - key: __SUPABASE_ANON_KEY__
  - username: service_role
    keyauth_credentials:
      - key: __SUPABASE_SERVICE_ROLE_KEY__

services:
  # OPEN BY DESIGN -- see the header. GoTrue authenticates its own callers.
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-routes
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-routes
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          # supabase-js sends the key as a header; the Realtime client sends it in the query
          # string. Both forms are accepted so one plugin configuration serves every client.
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # Do not forward the key upstream. PostgREST authorises on the JWT in the
          # Authorization header, so passing the apikey on serves no purpose and would widen
          # where the service-role key appears in logs.
          hide_credentials: true

  # WebSocket change feed. The upstream path is /socket/, and the leading hostname label must be
  # `realtime-dev`: Realtime reads the tenant id from it. On Kubernetes the Service is named
  # `realtime-dev`, which is why Realtime is the one Service not named after its component.
  - name: realtime-v1
    url: __REALTIME_UPSTREAM_URL__
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
        protocols:
          - http
          - https
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          # The Realtime client puts the key in the query string of the WebSocket URL, which is
          # why key_in_query matters here specifically -- there is no opportunity to set a
          # header on a browser WebSocket handshake.
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # NOT hidden here. Realtime reads the apikey from the query string itself to identify
          # the tenant and evaluate RLS; stripping it breaks the handshake.
          hide_credentials: false

  # Object storage, through the gateway so the browser talks to one origin and a public model URL
  # names an address reachable from outside. storage-api serves its routes at the root, so the
  # /storage/v1 prefix is stripped. Public objects only, unauthenticated (see the header). Its own
  # service because `strip_path` removes the whole matched prefix and the `/object/public/` segment
  # has to survive in the service URL. Kong prefers the longer prefix, so this wins over
  # `/storage/v1/` for public reads only.
  - name: storage-v1-public
    url: http://supabase-storage:5000/object/public/
    routes:
      - name: storage-v1-public-routes
        strip_path: true
        paths:
          - /storage/v1/object/public/

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-routes
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # storage-api authorises uploads on the JWT, not the apikey.
          hide_credentials: true

  # Open by design: an OAuth client presents client credentials, not a Supabase apikey. Exact
  # paths, not a prefix, so a function added later is gated by default. One service per function
  # because `strip_path` removes the whole matched path and the upstream URL must carry the
  # function name.
  - name: functions-v1-grafana-userinfo
    url: http://supabase-functions:9000/grafana-userinfo
    routes:
      - name: functions-v1-grafana-userinfo-route
        strip_path: true
        paths:
          - /functions/v1/grafana-userinfo

  - name: functions-v1-nodered-userinfo
    url: http://supabase-functions:9000/nodered-userinfo
    routes:
      - name: functions-v1-nodered-userinfo-route
        strip_path: true
        paths:
          - /functions/v1/nodered-userinfo

  # ---------------------------------------------------------------------------------------------
  # Factory+ Directory adapter, the fourth exemption: a Factory+ client has no Supabase apikey,
  # and `/ping` must be reachable with no credential by specification. Every `/v1/` path refuses a
  # request with no bearer token and queries as the caller, so the function is the boundary and
  # validate.py asserts the 401. `strip_path: false` so `/v1/device/<uuid>` reaches the function.
  # ---------------------------------------------------------------------------------------------
  - name: fplus-directory
    url: http://supabase-functions:9000/fplus-directory
    routes:
      - name: fplus-directory-ping
        strip_path: false
        paths:
          - /ping
      - name: fplus-directory-v1
        strip_path: false
        paths:
          - /v1/

  - name: functions-v1
    url: http://supabase-functions:9000/
    routes:
      - name: functions-v1-routes
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: true
          key_in_body: false
          # The edge runtime boots with VERIFY_JWT="false" because each function performs its own role
          # check; this plugin is what stops an unauthenticated request starting a worker at all.
          hide_credentials: true

plugins:
  # ---------------------------------------------------------------------------------------------
  # Prometheus metrics for every route and service, declared globally so an unannotated service
  # cannot read as an idle one. Served on the status listener (`KONG_STATUS_LISTEN`, :8100), not
  # the proxy port. `prometheus` must also appear in `KONG_PLUGINS`: naming any plugin there
  # replaces the bundled set. The three flags below default to false on Kong 3.x, and without them
  # every per-service series disappears while the scrape stays UP. `upstream_health_metrics` is
  # off because every service here is declared with a plain `url:`.
  # ---------------------------------------------------------------------------------------------
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
  # ---------------------------------------------------------------------------------------------
  # The only statement of origin policy: `_shared/cors.ts` carries no Access-Control-Allow-Origin,
  # so this list is load-bearing on its own. Substituted from the same helpers the ingress hosts
  # come from (`acs-cymru.corsOrigins`), so an origin cannot disagree with a hostname the chart
  # serves. A YAML flow sequence, because `sed` substitutes a line and both substituters emit a
  # JSON array.
  # ---------------------------------------------------------------------------------------------
  - name: cors
    config:
      origins: __CORS_ORIGINS__
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true
