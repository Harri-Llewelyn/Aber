# MQTTS listener on 8883. APPENDED to mosquitto.conf, never a replacement for it.
#
# WHY THIS IS A SEPARATE FILE. Mosquitto exits 1 when `certfile` names a file that is not there, and
# it says so as three lines of raw OpenSSL output:
#
#   OpenSSL Error[0]: error:80000002:system library::No such file or directory
#   OpenSSL Error[1]: error:10080002:BIO routines::system lib
#   OpenSSL Error[2]: error:0A080002:SSL routines::system lib
#
# -- which names neither the file nor the option nor the listener. Putting this stanza in
# mosquitto.conf unconditionally would therefore crash-loop the broker on every Compose stack that
# has no certificates, and the log would point nowhere near the cause. The base policy stays valid
# with no certificates present; this file is concatenated onto it only where they exist.
#
# So the two targets differ in ONE way, and only one: Kubernetes appends this when
# `mosquitto.tls.enabled` (cert-manager supplies the Secret); Compose does not append it unless an
# operator mounts certificates themselves and opts in. The base policy above is byte-identical.
#
# ---------------------------------------------------------------------------------------------------
# NO SECURITY OPTIONS IN HERE. `allow_anonymous` and the `plugin` lines are declared once in
# mosquitto.conf's global section and apply to this listener too; a `plugin` line under a listener
# is refused without per_listener_settings, and 2.0.x exits on a duplicated global option -- see
# that file's header. This stanza carries transport settings only.
# ---------------------------------------------------------------------------------------------------

listener 8883 0.0.0.0

# The cert-manager Certificate's Secret, mounted at /mosquitto/certs. `tls.crt` / `tls.key` /
# `ca.crt` are kubernetes.io/tls key names, not names chosen here.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/tls.crt
keyfile /mosquitto/certs/tls.key

# PASSWORD AUTH OVER TLS, NOT MUTUAL TLS. `require_certificate false` is the default and is stated
# explicitly because it is the security decision this listener makes: the client is authenticated by
# the same username/password as on 1883, and TLS is here to stop that password crossing a plant
# network in clear text and to let a gateway verify it is talking to the real broker.
#
# Turning this on means every gateway needs its own client certificate issued, distributed and
# renewed, and `use_identity_as_username` would then replace the password -- so the certificate's
# CN would have to be the sparkplug_id the gateway's role is named for. That is a coherent design
# (and a better one), but it is a different design, and half of it is worse than neither half.
require_certificate false

# TLS 1.2 floor. Mosquitto 2.0 negotiates the highest both ends support, so this only excludes the
# versions with known problems; gateways too old for 1.2 are a fleet problem, not a broker setting.
tls_version tlsv1.2
