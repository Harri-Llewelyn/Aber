; Grafana configuration for ACS-Cymru single sign-on against Supabase Auth.
;
; Everything not related to auth stays in docker-compose.yml environment variables, which is
; where this stack has always configured Grafana. Only the OAuth block lives here, because it
; is too long to express readably as GF_AUTH_GENERIC_OAUTH_* variables.
; FIXME - This file mentions Kong when we have migrated to Envoy

[server]
root_url = http://localhost:3002/

[auth]
; The local admin login is deliberately kept as a break-glass path. If Supabase Auth, Kong or
; the edge runtime is down, SSO is down with them -- and Grafana is where you would go to look
; at why. Disabling the form would make the monitoring stack unreachable exactly when needed.
disable_login_form = false

; SIGNING OUT OF GRAFANA DOES NOT SIGN YOU OUT OF ACS-CYMRU, and that is a consequence of the
; decision recorded under [auth.generic_oauth] below rather than a defect to chase.
;
; It looks like one: sign out, click sign in, and you are back in with no password prompt. What
; happened is that only Grafana's session ended. The Supabase session is untouched, so the next
; /oauth/authorize issues a code immediately.
;
; NEITHER OF THE TWO STANDARD FIXES IS AVAILABLE HERE, both for the same root cause:
;
;   signout_redirect_url   Would have to point at GoTrue's /auth/v1/logout, which is POST-only
;                          and requires a bearer token -- 405 to a GET, 401 without the header.
;                          A browser redirect is a GET with no Authorization header, so it can
;                          never reach it. RP-initiated logout (`end_session_endpoint`) is an
;                          OIDC feature, and this is deliberately not an OIDC flow.
;
;   login_prompt = login   Would ask the provider to re-authenticate. GoTrue IGNORES the OAuth
;                          `prompt` parameter: `login`, `select_account` and `none` all return
;                          an identical 302, and `none` is required by spec to error without a
;                          session. Verified against the running stack.
;
; So this is left unset deliberately. To end both sessions, sign out of the ACS-Cymru frontend,
; which calls supabase.auth.signOut() properly. Setting this to the frontend URL would only
; change where the browser LANDS -- it would not end the Supabase session, and a redirect that
; looks like a logout without being one is worse than none.
; signout_redirect_url =

[auth.generic_oauth]
enabled = true
name = ACS-Cymru SSO
allow_sign_up = true
client_id = c0ffee00-0000-4000-8000-000000000001
client_secret = $__env{GRAFANA_OAUTH_CLIENT_SECRET}
; NOTE THE ABSENT `openid` SCOPE -- this is required, not an oversight.
; 
; Requesting `openid` makes GoTrue mint an ID token, and it refuses to:
;   HS256 is not supported for ID token signing
; This whole stack is HS256 on a shared secret (SUPABASE_JWT_SECRET), which Kong, PostgREST,
; Realtime and the pre-minted anon/service_role keys all depend on. Giving GoTrue an
; asymmetric signing key to satisfy OIDC would change how every Supabase JWT is signed.
;
; Grafana does not need an ID token here: identity comes from api_url below. So this is a
; plain OAuth2 authorization-code flow (with PKCE) rather than a strict OIDC one, and the
; token endpoint then succeeds. Verified against all four seeded personas.
scopes = email profile

; auth_url is followed by the BROWSER, so it must be the host-facing Kong address.
; token_url and api_url are called by the Grafana CONTAINER, so they must be the
; compose-internal address. Using one for both is the classic way this breaks: a browser
; cannot resolve `supabase-kong`, and the container's `127.0.0.1` is itself.
auth_url = http://127.0.0.1:54321/auth/v1/oauth/authorize
token_url = http://supabase-kong:8000/auth/v1/oauth/token
api_url = http://supabase-kong:8000/functions/v1/grafana-userinfo

; GoTrue's OAuth server REQUIRES PKCE. Without this Grafana omits code_challenge and every
; login fails at /oauth/authorize with
;   invalid_request: PKCE flow requires both code_challenge and code_challenge_method
use_pkce = true

; Send the client secret as an HTTP Basic Authorization header, not in the POST body.
;
; Required. The client is registered in auth.oauth_clients with
; token_endpoint_auth_method = 'client_secret_basic', and GoTrue enforces that exactly:
;   400 invalid_credentials -- "invalid authentication method: client is registered for
;   'client_secret_basic' but 'client_secret_post' was used"
; Left unset, Grafana's Go oauth2 client auto-detects and picks the POST-body form, which
; surfaces in the browser only as the generic "could not get a token from the provider".
;
; Fixing it here rather than re-registering the client as 'client_secret_post' keeps the
; secret out of the request body, which is what OAuth 2.1 recommends.
auth_style = InHeader

; Discovery is deliberately not used. GoTrue's /.well-known/openid-configuration reports
; "issuer": "" and relative endpoint paths, which is not a usable discovery document.
; The three URLs above are configured explicitly instead.

; --- Role mapping ------------------------------------------------------------------------
; `role` is supplied by the grafana-userinfo edge function (api_url above), which reads
; public.user_roles and maps Administrator -> Admin, Shopfloor_Manager -> Editor,
; Operator/Auditor -> Viewer. It is NOT read from the OIDC token: GoTrue's OIDC claims do not
; include app_metadata, so a token-based path would find nothing here.
role_attribute_path = role

; Fail closed, matching the posture of the RLS policies and the edge functions. A user whose
; role does not map is REFUSED, not quietly admitted as a Viewer. The edge function omits the
; `role` key entirely for an unmapped role, which is what this then rejects.
role_attribute_strict = true

; Grafana admin (server-wide, not org-level) is deliberately not granted to anyone over SSO.
;
; This is what puts the plugin catalogue out of reach of an SSO session: installing a plugin
; requires SERVER admin in OSS Grafana, and an ACS-Cymru Administrator maps to org Admin. That is
; the intended outcome. A plugin installed through the UI lands in the grafana_data volume, which
; is invisible to this repository, absent from a fresh deployment and absent from the chart --
; declare plugins in GF_INSTALL_PLUGINS instead, where they are reviewable and reproducible.
;
; Granting it would also be much wider than "can install plugins": server admin creates and
; deletes users across every org, changes any password, and grants server admin to others. And a
; plugin is arbitrary code inside a container holding BI_READER_PASSWORD,
; GRAFANA_ALERT_WEBHOOK_SECRET, SUPABASE_ANON_KEY and GRAFANA_OAUTH_CLIENT_SECRET.
allow_assign_grafana_admin = false

; RE-SYNC THE ROLE ON EVERY LOGIN. Pinned explicitly rather than left to the default, because the
; default is the correct value and the failure mode of changing it is silent: with sync skipped, a
; user promoted or demoted in public.user_roles keeps whatever Grafana role they were first given,
; for ever. The RBAC story this stack demonstrates would then be true in the database and false in
; Grafana, and nothing would report the disagreement.
skip_org_role_sync = false

; NOT ENABLED, AND THE ONE-CLICK SAVING IS NOT WORTH WHAT IT COSTS.
;
; `auto_login` skips the login screen and redirects straight to the provider. It would defeat the
; break-glass path that [auth] disable_login_form exists to keep: with SSO down -- which is
; exactly when Grafana is where you go to look at why -- every visit bounces into a dead provider,
; and the escape (/login?disableAutoLogin=true) is not something anyone recalls under pressure.
;
; It also makes switching between the four seeded personas painful, since signing out of Grafana
; leaves the Supabase session intact (see the note under [auth] above) and would immediately
; bounce back in as the same user.
;
; Spelled `auto_login` under this provider, NOT `oauth_auto_login` under [auth], which this file
; used until now: that key is deprecated and Grafana warns about it on boot.
auto_login = false

[users]
auto_assign_org = true
auto_assign_org_role = Viewer
