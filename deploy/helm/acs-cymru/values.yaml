# =============================================================================================
# Factory+ — default values
#
# These defaults are deliberately NOT a working configuration: the four Supabase credentials in
# `secrets` are empty and the chart REFUSES TO RENDER without them (see _helpers.tpl,
# `acs-cymru.validateSecrets`). That is the opposite of most charts and it is intentional --
# see the comment on `secrets` below.
#
# For a local k3s stack use `-f values-dev.yaml`, which supplies the documented demo credentials
# from .env.example. For anything else, copy values-prod.yaml.example.
# =============================================================================================

global:
  # The DNS suffix every ingress hostname is built from: app.<domain>, api.<domain>,
  # nodered.<domain>, grafana.<domain>, studio.<domain>, docs.<domain>, mqtt.<domain>.
  # Subdomains rather than paths -- Grafana, Node-RED and Studio all assume they own a root, and
  # Node-RED's webhook path is registered in the database. See architecture §7.1.
  #
  # Required when `ingress.enabled`; the render fails rather than emitting empty `host:` fields.
  publicBaseDomain: ""

  # http | https. Decides the scheme in every browser-facing URL the chart composes.
  scheme: http

  # PVC storage class for every stateful component. `local-path` is k3s's built-in provisioner and
  # is NODE-LOCAL -- lose the node, lose the volume, with no degraded mode in between.
  #
  # REPLACE THIS on a multi-node or production cluster (`longhorn` is the usual on-prem choice).
  # Whatever you choose must support ReadWriteOnce AND fsGroup ownership remapping: a class that
  # ignores fsGroup gives "permission denied" on a volume that mounts perfectly.
  #
  # Which volumes a node loss actually costs you, and what the nightly dump does and does not
  # cover:  deploy/k8s/README.md -> "Storage classes and what a node loss costs"
  storageClass: local-path

  # Applied to every pod. Empty by default; a real cluster usually wants a registry pull secret.
  imagePullSecrets: []

  # Extra labels/annotations merged onto every object the chart creates.
  commonLabels: {}
  commonAnnotations: {}

# ---------------------------------------------------------------------------------------------
# Credentials
#
# ALL FOUR SUPABASE VALUES ARE A SET, and that is why none of them is generated.
#
# `anonKey` and `serviceRoleKey` are JWTs SIGNED BY `jwtSecret`. The obvious convenience -- a Helm
# `randAlphaNum` on jwtSecret at install time -- silently invalidates both pre-minted keys, and
# every request through Kong's key-auth then fails against a stack that otherwise reports healthy.
# So the chart requires all four together and fails the render if any is missing, rather than
# generating one and leaving the others stale.
#
# Generate a matching set with any JWT tool, signing HS256 with jwtSecret and the claims
# {"iss":"supabase","role":"anon"} / {"iss":"supabase","role":"service_role"}.
#
# Renders a plain Secret. External Secrets / SOPS attach through `existingSecret` below.
# ---------------------------------------------------------------------------------------------
secrets:
  # Reference an EXISTING Secret instead of rendering one. When set, every value below is ignored
  # and the named Secret must carry the same keys. This is the seam external secret management
  # plugs into without a template rewrite.
  existingSecret: ""

  # HS256 signing key shared by GoTrue, PostgREST, Realtime, Storage, Kong and Node-RED.
  jwtSecret: ""
  anonKey: ""
  serviceRoleKey: ""

  # Superuser password for Supabase Postgres, and the password set on the scoped roles
  # (supabase_auth_admin, authenticator, supabase_storage_admin) by the roles-init Job.
  postgresPassword: ""

  # TimescaleDB (the historian) — a separate database with its own credentials.
  timescalePassword: ""

  # Realtime. LENGTHS ARE ENFORCED BY THE CONTAINER, not by preference:
  #   dbEncKey       EXACTLY 16 characters
  #   secretKeyBase  AT LEAST 64 characters
  # The chart asserts both, so a bad value is a legible Helm error rather than a CrashLoopBackOff
  # with an Elixir stacktrace.
  realtimeDbEncKey: ""
  realtimeSecretKeyBase: ""

  # postgres-meta encrypts stored connection strings with this; Studio must be given the same.
  pgMetaCryptoKey: acs-cymru-pg-meta-crypto-key

  # --- MQTT: FIVE PRINCIPALS, AND NO WILDCARD ACCOUNT ANYWHERE -------------------------------
  # There used to be ONE `factoryplus` account holding `readwrite spBv1.0/#`, shared by the
  # ingestion daemon, the i3X server, the Node-RED simulator and the E2E validator. Any of them
  # could publish DBIRTH or DDATA for any machine on the site, and `verify_gateway_binding()`
  # could not catch it -- a forged message under a CORRECTLY BOUND device satisfies that check by
  # construction. mosquitto.acl now confines each account; see its header for the verified
  # behaviour of each rule against the pinned broker image.
  #
  # THE TWO GATEWAY USERNAMES ARE NOT FREE TEXT. The ACL pins the topic's edge-node segment to
  # `%u`, and that segment must be the gateway row's GENERATED `sparkplug_id` ('gwy' + the first
  # 21 hex characters of its UUID) or ingestion rejects the message. Both rows therefore have
  # pinned UUIDs, which is the only reason a credential can be issued before the row exists:
  #   10000000-0000-4000-8000-000000000001 -> gwy100000000000400080000  (retired simulator; see below)
  #   11000000-0000-4000-8000-000000000001 -> gwy110000000000400080000  (validate.py's gateway)
  # `acs-cymru.validateMqttPrincipals` fails the render rather than letting a friendly name
  # authenticate successfully and then have every publish silently dropped by the broker.
  #
  # Each password is independent. Confinement buys nothing if one leak opens all five.

  # Reads spBv1.0/#; publishes ONLY rebirth NCMDs.
  mqttIngestionUser: factoryplus_ingestion
  mqttIngestionPassword: ""
  # Read-only. The i3X server refuses writes in code (405); this says so where the broker can
  # enforce it, which is the control that cannot be argued with.
  mqttI3xUser: factoryplus_i3x
  mqttI3xPassword: ""
  # The RETIRED single-device simulator gateway. Migration 0020 deletes its gateway row, so a
  # message published under this username is now refused by verify_gateway_binding(); the shipped
  # flow connects as four per-cell gateways whose credentials `scripts/provision-gateways.mjs`
  # issues. Kept because node-red-init applies it to the legacy `mqtt-broker-config` node, which
  # survives on a Node-RED PVC created before the flow was consolidated -- dropping the account
  # would turn a stale flow into a broker that refuses the connection outright.
  mqttSimulatorUser: gwy100000000000400080000
  mqttSimulatorPassword: ""
  # ingestion/validate.py's gateway. A FIXTURE -- a production install can leave this empty and
  # set e2e.enabled: false, and no account is created.
  mqttValidatorUser: gwy110000000000400080000
  mqttValidatorPassword: ""
  # $SYS only, for the broker probes and the Prometheus exporter sidecar. Can publish nothing.
  # Without it the healthcheck never passes and every dependent workload fails to start, so it is
  # load-bearing rather than optional.
  mqttMonitorUser: factoryplus_monitor
  mqttMonitorPassword: ""
  # The bearer token supabase-functions presents to the gateway-credential sidecar, which is the only
  # thing that may add an account to the broker's password file.
  #
  # ITS OWN VALUE, never shared with another secret. That service can mint a credential for any edge
  # node, and mosquitto.acl turns an account into the ability to publish Sparkplug telemetry as that
  # gateway -- so a token reused elsewhere means one leak grants forgery across the site. The service
  # REFUSES TO START if it is shorter than 32 characters; `npm run setup` generates one for Compose.
  mqttCredentialServiceToken: ""

  grafanaAdminUser: admin
  grafanaAdminPassword: ""
  grafanaOAuthClientSecret: ""
  # Grafana -> grafana-alert-webhook. Its own value, shared with nothing: this exists precisely so
  # Grafana is not handed the service-role key, and reusing another secret here would mean one leak
  # reopens the authority it was created to withhold.
  grafanaAlertWebhookSecret: ""

  # The read-only historian role external BI tools connect as -- and the role GRAFANA connects as,
  # replacing the `postgres` superuser it used to hold. Created on the TimescaleDB instance by
  # timescaledb/roles.sql, which the maintenance Job applies after the rollups it grants on.
  #
  # EMPTY MEANS NO ROLE, not a role with a blank password: roles.sql skips it entirely. With
  # Grafana enabled the render fails instead, because a Grafana that cannot authenticate reports
  # a database fault rather than a missing setting -- see acs-cymru.validateSecrets.
  #
  # It may SELECT telemetry_1m / 5m / 1h and is explicitly revoked on raw `telemetry`, `assets`
  # and `telemetry_latest`. Setting it here rotates the password on the next install or upgrade.
  biReaderPassword: ""

  noderedCredentialSecret: ""
  noderedOAuthClientSecret: ""
  noderedWebhookJwtSecret: ""
  # Break-glass only; empty means the static-token path is shut. See .env.example.
  noderedAdminToken: ""

# ---------------------------------------------------------------------------------------------
# Data tier
# ---------------------------------------------------------------------------------------------

timescaledb:
  enabled: true
  image:
    repository: timescale/timescaledb
    # Pinned to match docker-compose.yml. Both targets must pin the SAME tag -- see
    # scripts/check-image-tag-parity.mjs, which CI runs.
    #
    # A VERSION, NOT `latest-pg17`, and that is a correction rather than a preference. This read
    # `latest-pg15` until 2026-08, which looked like tracking upstream and had silently stopped
    # being that: TimescaleDB 2.29.0 dropped PostgreSQL 15, so `latest-pg15` froze at 2.28.3 on
    # 2026-07-16 and will never move again. A floating tag that stops floating gives no signal at
    # all. Every other pin in this file states a version; this one now does too, and bumping it is
    # a decision someone makes rather than one that happens.
    tag: 2.29.1-pg17
    pullPolicy: IfNotPresent
  database: postgres
  username: postgres
  persistence:
    enabled: true
    size: 20Gi
    # Inherits global.storageClass when empty.
    storageClass: ""
    accessMode: ReadWriteOnce
  # M5. VERIFIED against the pinned tag, as the note here always asked: `timescale/timescaledb` is
  # Alpine and its `postgres` user is uid/gid **70**, not 999. It said 999 — the Debian number —
  # from the day it was written, and nothing caught it because it does not have to be right: this
  # image's entrypoint runs as root and chowns the data directory to `postgres` itself before
  # dropping privileges, so fsGroup only decides the group ownership of the mount root for the few
  # milliseconds before that. It is corrected so the value states a fact, and so anyone who later
  # sets `runAsUser` — at which point the entrypoint can no longer chown and fsGroup becomes
  # load-bearing — starts from a true number instead of a plausible one.
  podSecurityContext:
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
  # --- Telemetry lifecycle --------------------------------------------------------------------
  # Applied by the `timescaledb-retention` hook Job on every install AND every upgrade, so these
  # values are authoritative against a database that already holds data. That is the whole reason
  # the policies moved out of the initdb scripts: those run only on an empty data directory, which
  # on Kubernetes means the interval could not be changed without deleting the PVC.
  #
  # Both take any PostgreSQL interval ('7 days', '12 hours', '5 years'); `never` removes the policy.
  retention:
    enabled: true
    # How old a chunk must be before it is converted to the columnstore (Hypercore).
    #
    # THIS DOES NOT BOUND THE LATE-ARRIVAL WINDOW, and it used to say that it did: "compressed
    # chunks are effectively read-only, so telemetry timestamped older than this is rejected
    # rather than inserted". That was measured on 2.29.1 and is FALSE -- an INSERT into a
    # compressed chunk succeeds, including the exact `ON CONFLICT (time, asset_id, metric_name)
    # DO NOTHING` form the ingestion daemon uses, the unique constraint is still enforced against
    # compressed data, UPDATE and DELETE both work, and the chunk stays compressed throughout.
    #
    # It was not the PG17/2.29 upgrade that changed this. The same test passes on 2.28.3, the
    # version this stack ran before -- the note described much older TimescaleDB behaviour and had
    # simply outlived it.
    #
    # So the ONLY thing bounding late arrivals is TELEMETRY_MAX_AGE_SECONDS in the ingestion
    # daemon (24h). A gateway that buffers through an outage and flushes on reconnect is limited
    # by that and by nothing here. Widening this value does not widen the accepted window, and
    # narrowing it does not close it.
    compressAfter: "7 days"
    # A HARD DELETE with no undo -- TimescaleDB drops whole chunks and nothing in this chart copies
    # them anywhere first. 90 days is a starting point, NOT a compliance decision: manufacturing
    # traceability obligations run from weeks to decades and only the operator knows which applies.
    # `never` keeps everything, which is a valid choice and not an unconfigured one.
    retainFor: "90 days"
  # --- Rollups (continuous aggregates) ---------------------------------------------------------
  # 1-minute, 5-minute and 1-hour buckets, built 1m -> 5m -> 1h. Grafana's trend panels and any
  # long-window query read these instead of scanning the raw hypertable; the dashboard's
  # latest-value routes use the `telemetry_latest` view, which is created by the same script.
  #
  # THEY OUTLIVE THE RAW DATA ON PURPOSE. Each rollup is independent of the hypertable, so it
  # survives `retention.retainFor`: raw at 90 days but hourly buckets at 5 years keeps shape,
  # excursions and state transitions long after the rows are gone, at a fraction of the size.
  #
  # Disabling this leaves any rollups that already exist in place and simply stops reconciling
  # them -- it does not drop years of history because a flag was flipped. Drop them by hand if
  # that is what you mean.
  rollups:
    enabled: true
    oneMinuteRetainFor: "180 days"
    fiveMinuteRetainFor: "1 year"
    oneHourRetainFor: "5 years"
  # The read-only BI role's password is a CREDENTIAL and lives under `secrets.biReaderPassword`
  # with the others, not here -- anything under `secrets` is covered by `secrets.existingSecret`,
  # and a password declared in this block would quietly bypass that whole mechanism in production.
  # What the role may read is described in timescaledb/roles.sql.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

supabaseDb:
  enabled: true
  image:
    repository: supabase/postgres
    tag: 17.6.1.160
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # VERIFIED against the pinned tag: `supabase/postgres:17.6.1.160` is **Alpine 3.23** (Nix-built)
  # and its `postgres` user is uid 100 / gid **101**.
  #
  # BOTH NUMBERS AND THE DISTRO CHANGED AT 17.6, which is worth stating because this comment
  # previously said the opposite and was right at the time: the 15.x image was Ubuntu 20.04 with
  # `postgres` at 105:106, and the note here explained that it was NOT the same lineage as
  # TimescaleDB. It is now — both databases are Alpine, and TimescaleDB remains 70:70, so they
  # still differ from each other and still need separate values.
  #
  # Same caveat as above: the entrypoint runs as root and chowns, so this is a statement of fact
  # rather than a working part today. It becomes the whole permission story the moment anyone sets
  # `runAsUser`. See the statefulset for what DID break here.
  podSecurityContext:
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# Realtime
# ---------------------------------------------------------------------------------------------
realtime:
  enabled: true
  image:
    repository: supabase/realtime
    tag: v2.34.47
    pullPolicy: IfNotPresent
  # Never more than one. Realtime holds a LOGICAL REPLICATION SLOT, which is per-instance state,
  # and clustering additional nodes needs DNS_NODES configuration this stack does not have.
  replicas: 1
  # DO NOT RENAME. Realtime resolves its tenant from the LEADING HOSTNAME LABEL of the Host
  # header, not from the JWT, and `realtime-dev` is the tenant SEED_SELF_HOST creates. Naming the
  # Service for the tenant is what makes Kong's upstream Host header correct through ordinary
  # in-cluster DNS, with no header rewriting. This is the ONE Service whose name deliberately
  # differs from its Compose service name (`supabase-realtime`). See architecture §3.4.
  serviceName: realtime-dev
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# ---------------------------------------------------------------------------------------------
# Browser-facing URLs
#
# The in-cluster URLs are NOT configurable and do not appear here: Service names are kept
# identical to the Compose service names, so `http://supabase-kong:8000`, `timescaledb:5432` and
# `mosquitto:1883` resolve unchanged. Only the addresses a BROWSER follows are deployment
# specific, and each is derived from global.publicBaseDomain unless overridden.
# ---------------------------------------------------------------------------------------------
publicUrls:
  frontend: ""
  supabase: ""
  # M3. Feeds BOTH the OAuth client's redirect_uris (registered by 0002_seed_data.sql via
  # db-init) and Grafana's own GF_SERVER_ROOT_URL. One value, so the two cannot drift.
  grafana: ""
  # Feeds the Node-RED OAuth client's redirect_uris (0003) and settings.js's callbackURL.
  nodered: ""
  studio: ""
  docs: ""
  # MQTT over WebSockets (9001). Raw MQTT on 1883 is TCP and is exposed by the
  # mosquitto-external LoadBalancer instead -- an HTTP Ingress cannot carry it.
  mqtt: ""

# ---------------------------------------------------------------------------------------------
# Supabase control plane
#
# Every image tag here is pinned to the tag docker-compose.yml runs, and several of those pins
# carry a paragraph of reasoning in the compose file. TWO TARGETS ON DIFFERENT TAGS BREAK PRECISELY
# THE COUPLINGS THOSE PINS EXIST TO HOLD -- supabase/realtime and supabase/storage-api migrate
# shared schemas on boot, supabase/studio is Zod-coupled to a postgres-meta version.
# ---------------------------------------------------------------------------------------------

supabaseAuth:
  enabled: true
  image:
    repository: supabase/gotrue
    tag: v2.189.0
    pullPolicy: IfNotPresent
  replicas: 1
  # Allows self-registration through the auth API. Off is the safe default: a self-registered user
  # has no row in public.user_roles, and every RLS policy and edge function then refuses them --
  # an account that signs in and can do nothing reads as a broken deployment.
  disableSignup: false
  jwtExpiry: 3600
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

supabaseRest:
  enabled: true
  image:
    repository: postgrest/postgrest
    tag: v12.2.0
    pullPolicy: IfNotPresent
  # Stateless and horizontally scalable -- one of the three sensible HPA candidates.
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

supabaseKong:
  enabled: true
  image:
    repository: kong
    tag: 2.8.1-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  # NAMING A PLUGIN HERE REPLACES THE DEFAULT `bundled` SET rather than adding to it. key-auth was
  # not merely unused before it was listed -- it was UNAVAILABLE, and referencing it in kong.yml
  # would have failed Kong's startup. Removing a name from this list disables that plugin.
  #
  # `prometheus` is declared globally in kong.yml, which BOTH TARGETS SHARE -- so it must stay in
  # this list and in docker-compose.yml's KONG_PLUGINS together. Dropping it from either does not
  # merely lose metrics: Kong refuses to boot with "plugin 'prometheus' not enabled".
  plugins: request-transformer,cors,key-auth,prometheus
  # -------------------------------------------------------------------------------------------
  # Kong's Prometheus endpoint, on the STATUS listener (:8100/metrics) -- never the proxy port.
  #
  # WORTH MORE THAN ANY OTHER SCRAPE IN THIS STACK. Every REST, Auth, Storage, Realtime and edge
  # function request passes through Kong, and none of those components exposes metrics of its own
  # (PostgREST 12.2.0 has no metrics endpoint at all -- its admin server is health-only). So this
  # one target measures the entire HTTP surface: per-service latency, status codes, bandwidth.
  #
  # The listener is separate from the proxy port because these metrics are an internal detail:
  # published on :8000 they would sit behind the ingress on a public hostname, describing the
  # gateway's whole traffic profile to anyone who asked.
  # -------------------------------------------------------------------------------------------
  metrics:
    enabled: false
    port: 8100
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

supabaseFunctions:
  enabled: true
  image:
    # BUILT FROM supabase/functions/Dockerfile, not pulled: the functions and
    # node_red_flow.json are baked in, because there is no repository on a cluster node to mount
    # and a rollback must roll the functions back with the image.
    #   docker build -f supabase/functions/Dockerfile -t <repo>:<tag> .
    #
    # PUBLISHED, so this installs from a registry with no local build. The build command above is
    # still the supported path for a fork or an air-gapped cluster -- retag and override.
    repository: ghcr.io/harri-llewelyn/acs-cymru/edge-runtime
    # Empty on purpose: resolved to Chart.AppVersion by the `acs-cymru.image` helper, so the
    # chart and the image it names ship from one release tag. Set it to pull a specific build.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Each function checks its own role claim, which is why the runtime does not.
  verifyJwt: false
  # AAS export. These MUST be declared on this service, not only in a values file: an edge worker
  # isolate sees nothing but the variables main/index.ts forwards to it.
  # ===============================================================================================
  # Physical gateway enrolment addresses (enroll-gateway, gateway-bundle)
  # ===============================================================================================
  # WHAT AN APPLIANCE DIALS, which is never what this cluster dials. SUPABASE_PUBLIC_URL is derived
  # from global.publicBaseDomain automatically; only the broker's address needs stating, and only
  # when it differs from the `mqtt.` subdomain the chart already derives for the external broker.
  #
  # BOTH FUNCTIONS REFUSE RATHER THAN GUESS: gateway-bundle answers 503 and mints no token if the
  # public URL is in-stack, and enroll-gateway answers 503 WITHOUT CONSUMING THE TOKEN if the broker
  # host is. A wrong value here would otherwise produce appliances that enrol perfectly and then
  # connect to nothing, which is the hardest version of this failure to diagnose.
  #
  # THE ADDRESS MUST ALSO BE IN THE BROKER CERTIFICATE'S SAN -- see mosquitto.tls.extraSans. A
  # certificate that does not name it fails verification at every appliance while in-cluster clients
  # verify perfectly, so the stack reports itself healthy and the fleet is silently off.
  gatewayEnrolment:
    # Empty = the `mqtt.<publicBaseDomain>` host the chart already derives.
    mqttPublicHost: ""
    mqttPublicTlsPort: 8883

  aas:
    # Namespaces every globalAssetId and submodel id the shell carries, so it has to name the
    # organisation publishing the document.
    baseIri: https://acs-cymru.local/ids/asset/
    # Where a consumer fetches the samples a Time Series LinkedSegment points at. Never the rows
    # themselves. Derived from publicUrls.supabase when empty.
    historianEndpoint: ""
    # Public base for the 3D models a VisualRepresentation submodel points at. CANNOT be derived
    # from the in-cluster Supabase URL: that resolves for the worker and for nothing outside the
    # cluster, so a shell handed to a partner would carry a dead link.
    modelPublicBase: ""
    # Above this, an .aasx falls back to a URL reference rather than holding the bytes in memory.
    maxBundledModelBytes: 33554432
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

supabaseStorage:
  enabled: true
  image:
    repository: supabase/storage-api
    tag: v1.11.13
    pullPolicy: IfNotPresent
  # ONE REPLICA on the file backend: it is a single-writer local filesystem on a ReadWriteOnce
  # PVC. Switch backend to s3 (below) to lift that.
  replicas: 1
  bucket: asset-3d-models
  fileSizeLimit: 52428800
  # The PRIVATE bucket holding Node-RED flow backups from physical gateway appliances, stored under
  # <sparkplug_id>/. Created by the storage-init Job alongside the one above.
  #
  # THE NAME MUST MATCH supabase/storage-policies.sql, which grants read to Administrator,
  # Shopfloor_Manager and Auditor and write to the first two only. A bucket with no policies is
  # invisible to every browser-facing role, and a policy naming a bucket that was never created is
  # dead text -- neither errors, which is why these are kept in step by hand.
  gatewayBackupBucket: gateway-backups
  # Its own limit, deliberately not fileSizeLimit: that one is sized for 3D geometry, and a
  # flows.json anywhere near 50 MiB is not a flow.
  gatewayBackupFileSizeLimit: 5242880
  # file | s3. s3 (MinIO or cloud) is the better production answer and removes the single-writer
  # constraint; file is the default. See docs/kubernetes-architecture.md §4.4 and §11.
  backend: file
  persistence:
    enabled: true
    size: 10Gi
    # -----------------------------------------------------------------------------------------
    # THE ONE PVC WHOSE CONTENTS ARE IN NO DATABASE DUMP.
    #
    # These objects are referenced by `devices.model_3d_path`, which IS backed up -- so losing
    # this volume alone leaves every row intact and pointing at nothing. An AAS export then emits
    # a VisualRepresentation File element with a URL that 404s, which the exporter cannot detect
    # and which surfaces only when someone opens the shell in a viewer.
    #
    # Two independent ways to cover it, and they are not alternatives so much as different
    # trade-offs -- see backup.includeStorage below, and volumeAnnotations here.
    # -----------------------------------------------------------------------------------------
    storageClass: ""
    accessMode: ReadWriteOnce
    # Merged onto the PVC, for a snapshotter driven off the CLAIM. A CSI VolumeSnapshotClass needs
    # nothing here -- it is driven by VolumeSnapshot objects referencing the PVC, which is why the
    # chart does not try to own it.
    annotations: {}
  # Merged onto the storage POD. This is where Velero's file-level backup annotation belongs --
  # Velero reads it from the pod and resolves it against the pod's volume NAMES:
  #
  #   podAnnotations:
  #     backup.velero.io/backup-volumes: data
  #
  # The volume is `data`. Not `storage`, not the PVC name, not the bucket name -- all three are
  # plausible guesses and all three silently capture nothing, because a volume name Velero cannot
  # resolve is skipped and the backup still reports success.
  podAnnotations: {}
  # M5. node:alpine-derived image running as uid/gid 1000.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

supabaseMeta:
  enabled: true
  image:
    # Pinned to the version the official self-hosted stack pairs with the Studio tag below.
    # v0.91.0 omitted "formattedError", which failed Studio's Zod schema on the Database page.
    repository: supabase/postgres-meta
    tag: v0.96.6
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

supabaseStudio:
  enabled: true
  image:
    repository: supabase/studio
    tag: 2026.07.07-sha-a6a04f2
    pullPolicy: IfNotPresent
  replicas: 1
  organizationName: Factory+
  projectName: ACS-Cymru Asset Tracking
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

swaggerUi:
  enabled: true
  image:
    repository: swaggerapi/swagger-ui
    tag: v5.17.14
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

# ---------------------------------------------------------------------------------------------
# Initialisation Jobs
#
# The replacements for docker-compose's `depends_on: condition: service_completed_successfully`.
# All three are post-install/post-upgrade Helm hooks, ordered by weight, and all three are SAFE TO
# RE-RUN -- supabase-db-init already replays every migration on every boot with no applied-ledger,
# so a `helm upgrade` re-running them is normal operation rather than a risk.
# ---------------------------------------------------------------------------------------------
initJobs:
  enabled: true
  # Applied to every init Job. Failed Jobs are kept for inspection rather than reaped.
  backoffLimit: 3
  # How long the wait-for initContainers poll a dependency before giving up, in seconds.
  waitTimeout: 600
  # Kept after success so `kubectl logs job/...` still answers "what did the migrations say".
  ttlSecondsAfterFinished: 3600

# ---------------------------------------------------------------------------------------------
# Messaging
# ---------------------------------------------------------------------------------------------
mosquitto:
  enabled: true
  image:
    repository: eclipse-mosquitto
    tag: "2.0.20"
    pullPolicy: IfNotPresent
  # ALWAYS ONE, AND NOT A TUNABLE. Mosquitto does not cluster: two brokers behind one Service split
  # the fleet in half, each seeing only the gateways that happened to land on it, and Sparkplug
  # state (birth/death, sequence numbers) is per-connection. HA needs a different broker (EMQX,
  # HiveMQ), which is out of scope.
  replicas: 1
  # M5. The `mosquitto` user in eclipse-mosquitto is uid/gid 1883. Confirm against the pinned tag
  # before changing -- it is an image property, not a convention.
  podSecurityContext:
    fsGroup: 1883
    fsGroupChangePolicy: OnRootMismatch
  # -------------------------------------------------------------------------------------------
  # Broker metrics, via an exporter sidecar.
  #
  # MOSQUITTO HAS NO PROMETHEUS ENDPOINT AND CANNOT BE GIVEN ONE. It publishes its statistics to
  # `$SYS/broker/#` MQTT topics instead, so scraping it means running something that subscribes to
  # those topics and re-serves them over HTTP. That is all this sidecar is.
  #
  # WORTH HAVING IN AN MQTT-CENTRED STACK: `broker_clients_connected` is the closest thing to a
  # fleet-size signal, and `broker_publish_messages_dropped` is the one number that reveals the
  # broker shedding load -- a condition that otherwise appears as gaps in telemetry, indistinguish-
  # able from machines being switched off.
  #
  # THE METRIC PREFIX IS `broker_`, NOT `mosquitto_`. Dashboards and alerts written against
  # `mosquitto_*` match nothing and render as empty panels rather than as errors. Verified against
  # this image: 48 `broker_*` series, including clients_connected, messages_sent/received,
  # bytes_sent/received and publish_messages_dropped.
  #
  # OFF BY DEFAULT because it is a third-party image and an extra container per broker pod. It
  # authenticates with the platform account, exactly as the ingestion daemon does.
  # -------------------------------------------------------------------------------------------
  metrics:
    enabled: false
    port: 9234
    image:
      repository: sapcc/mosquitto-exporter
      tag: "0.8.0"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  # Per-gateway credentials live in a Secret so they are reviewable, backed-up state rather than
  # something typed into a running container. See `credentialSecret` below,
  # scripts/mosquitto-provision-gateway.mjs (the operator path) and `gatewayCredential` at the
  # bottom of this file (the automated enrolment path).
  credentials:
    # Name of the Secret holding the hashed `password_file`. The chart CREATES IT EMPTY if absent
    # and never overwrites an existing one -- otherwise every `helm upgrade` would delete every
    # gateway credential provisioned since the last one.
    secretName: mosquitto-passwords
    # How often the reload sidecar compares the projected Secret against the file the broker is
    # using. The kubelet refreshes a projected volume on its own sync period (60-90s in practice),
    # so this is the *second* half of the delay, not the whole of it -- which is why the
    # provisioning script forces the reload rather than waiting. See M1.
    watchIntervalSeconds: 15
  # -------------------------------------------------------------------------------------------
  # MQTTS on 8883.
  #
  # OFF BY DEFAULT, because it needs cert-manager and a ClusterIssuer that the chart cannot
  # create -- see deploy/k8s/internal-ca.yaml for why the CA deliberately lives outside Helm.
  #
  # 1883 STAYS OPEN WHEN THIS IS ON, and that is a migration decision, not an oversight. A fleet
  # is converted gateway by gateway: flipping the broker to TLS-only takes every gateway offline
  # at once, and Sparkplug's birth/death semantics mean the whole plant re-registers. Run both,
  # move the fleet, then narrow `networkPolicy.mqttAllowedCidrs` and stop publishing 1883
  # externally (`external.plaintext: false` below) -- in that order.
  # -------------------------------------------------------------------------------------------
  tls:
    enabled: false
    # The cert-manager issuer to request the broker certificate from. `acs-cymru-ca` is what
    # deploy/k8s/internal-ca.yaml creates. An ACME issuer works here too and nothing else changes.
    clusterIssuer: acs-cymru-ca
    # Set if your issuer is a namespaced Issuer rather than a ClusterIssuer.
    issuerKind: ClusterIssuer
    # Where the issued keypair lands. Mounted read-only at /mosquitto/certs.
    secretName: mosquitto-tls
    # 90 days with 30 days' notice. Short on purpose: renewal is exercised four times a year
    # rather than being a thing that has never happened when it first matters. Mosquitto reloads
    # certificates on SIGHUP (verified against 2.0.20), and the reload sidecar sends it, so a
    # renewal does NOT restart the broker or drop a connected gateway.
    duration: 2160h
    renewBefore: 720h
    # -----------------------------------------------------------------------------------------
    # THE LOADBALANCER IP MUST BE LISTED HERE, AND THIS IS THE #1 THING THAT GOES WRONG.
    #
    # Gateways connect to the broker BY ADDRESS, not by DNS name -- there is usually no plant DNS
    # entry for it. A certificate carrying only `mosquitto` therefore verifies perfectly from
    # inside the cluster (which is where you will test it) and fails on every gateway with a
    # hostname-mismatch alert the broker does not log. It reads as a gateway or network fault.
    #
    # `external.loadBalancerIP` is added automatically when set. Add anything else the fleet dials
    # here: a node IP for NodePort, a VIP, a NAT address, a DNS name from plant DNS.
    # -----------------------------------------------------------------------------------------
    extraIpSans: []
    #  - 10.20.0.50
    extraDnsSans: []
    #  - mqtt.plant.example.com
    # -----------------------------------------------------------------------------------------
    # Put the IN-CLUSTER clients (the ingestion daemon and Node-RED) on 8883 as well.
    #
    # OFF BY DEFAULT, and that is a considered position rather than laziness. Those two reach the
    # broker over the pod network, which never leaves the cluster; the exposure TLS exists to close
    # here is the plant network the gateways cross. Turning this on buys defence in depth against
    # an attacker already inside the pod network, and costs a CA file becoming a hard startup
    # dependency of both workloads.
    #
    # It is ONE switch for both, not one each: they sit in the same trust domain and share the
    # certificate, so a partial migration would only create a configuration nobody tests.
    #
    # Both clients FAIL CLOSED if this is on and the CA is unreadable -- they refuse to start
    # rather than fall back to plaintext or to unverified TLS. That is the intended behaviour: a
    # silent downgrade to an unverified connection is indistinguishable from an interception.
    # -----------------------------------------------------------------------------------------
    internalClients: false
  # External exposure for shopfloor gateways. MQTT is raw TCP and cannot ride an HTTP Ingress.
  external:
    enabled: true
    # LoadBalancer works on k3s with NO MetalLB: the built-in ServiceLB (Klipper) satisfies it by
    # binding the port on nodes that have it free. NodePort is the fallback for a cluster started
    # with --disable=servicelb.
    #
    # KLIPPER BINDS THE PORT ON THE NODE, so 1883 must be free on the host -- a Compose stack still
    # running on the same machine holds it, and the Service then sits <pending> with no obvious
    # cause. Most likely first-boot surprise for anyone running both targets on one laptop.
    type: LoadBalancer
    # Only set when type is NodePort.
    nodePort: null
    # Only set when type is NodePort and mosquitto.tls.enabled. Klipper/NodePort cannot share one
    # node port between two service ports, so 8883 needs its own.
    tlsNodePort: null
    # Empty means "whatever the cluster assigns". Also added to the broker certificate's IP SANs
    # when mosquitto.tls.enabled -- which is the only way a gateway dialling the IP can verify it.
    loadBalancerIP: ""
    # ---------------------------------------------------------------------------------------
    # Publish plaintext 1883 externally. THE LAST STEP OF A TLS MIGRATION, NOT THE FIRST.
    #
    # Set false only once every gateway is on 8883. It removes 1883 from the external Service
    # while leaving it on the in-cluster one, so the ingestion daemon and Node-RED are unaffected
    # -- but any gateway still on plaintext stops connecting, and a Sparkplug device that cannot
    # connect is indistinguishable at the dashboard from one that is switched off.
    # ---------------------------------------------------------------------------------------
    plaintext: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

ingestion:
  enabled: true
  image:
    # BUILT FROM the repository-root Dockerfile, not pulled:
    #   docker build -f Dockerfile -t <repo>:<tag> .
    #
    # PUBLISHED -- see supabaseFunctions.image for what the empty tag means.
    repository: ghcr.io/harri-llewelyn/acs-cymru/ingestion
    tag: ""
    pullPolicy: IfNotPresent
  # Liveness. ingestion.py already writes this file every `healthIntervalSeconds` while its MQTT
  # connection is up, and stops when the connection drops -- so a wedged daemon goes stale and gets
  # restarted, which is the one failure Kubernetes can fix here for free. Unset on Compose, where
  # the heartbeat is a no-op.
  healthFile: /tmp/ingestion-health
  healthIntervalSeconds: 15
  # Device liveness watchdog. A device that stops publishing writes nothing and emits no DDEATH,
  # so without this it stays ONLINE forever. Gateway staleness is a read-time VIEW instead, for
  # reasons the 0024 migration header sets out; a device has no last-seen column to derive from,
  # which is why this one is a writer. It writes ONLY on the ONLINE -> OFFLINE transition.
  #
  # 0 disables. Raise it for a fleet of event-driven devices that legitimately stay quiet.
  # MUST MATCH docker-compose.yml -- validate.py's check 10 reads these names to decide whether
  # the window is short enough to wait for, and runs against both targets.
  deviceOfflineTimeoutSeconds: 300
  deviceWatchdogIntervalSeconds: 30
  # Rate limit on Sparkplug NCMD rebirth requests, per edge node. Rebirth is what recovers the
  # in-memory alias table after a restart; the limit is what stops a gateway that reboots on
  # rebirth being held in a loop by the mechanism meant to recover it.
  rebirthRequestIntervalSeconds: 300
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------------------------
# i3X 1.0 server (CESMII Industrial Information Interoperability eXchange)
#
# A READ-SIDE ADAPTER over the model this stack already holds: `schemas.schema_definition` IS an
# i3X ObjectType (both are JSON Schema, so there is no translation), `sparkplug_id` IS an elementId,
# and Unmodelled IS `isExtended`. What it adds is a live query surface and subscriptions.
#
# Conformance is measured, not asserted: CESMII publishes a 60-test suite and CI runs it against
# this service. The current verdict is **1.0 Compatible** -- every MUST passes; the optional Update
# methods are deliberately not implemented (see `PUT /objects/value` -> 405 below).
# ---------------------------------------------------------------------------------------------
i3xService:
  enabled: true
  image:
    # BUILT FROM i3x/Dockerfile with the REPOSITORY ROOT as context, because it compiles
    # sparkplug_b.proto:
    #   docker build -f i3x/Dockerfile -t <repo>:<tag> .
    #
    # PUBLISHED -- see supabaseFunctions.image for what the empty tag means.
    repository: ghcr.io/harri-llewelyn/acs-cymru/i3x-service
    tag: ""
    pullPolicy: IfNotPresent
  # Reported by GET /info as `serverName`. Worth setting per environment: an i3X client browsing
  # several sites has no other way to tell two servers apart.
  serverName: acs-cymru-i3x
  # A spec MUST: a subscription with neither an open stream nor a /sync call inside this window is
  # DELETED, along with its queued values. Without it, a client that walks away holds a queue open
  # for the lifetime of the process. An open SSE stream counts as activity, so a quiet-but-connected
  # machine is not reaped out from under a healthy connection.
  subscriptionTtlSeconds: 300
  # How many update batches one subscription may queue before the OLDEST are dropped. Dropping is
  # not silent -- the next /sync answers HTTP 206 and the client computes the exact gap from the
  # sequence numbers, then backfills from /objects/history. Raise it for slow pollers; the cost is
  # memory per subscription.
  subscriptionQueueLimit: 10000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    # The value cache is one entry per device-metric and the queues are bounded by the limit above,
    # so this is sized for connection handling rather than for data.
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------------------------
# Edge and frontend
# ---------------------------------------------------------------------------------------------
nodeRed:
  enabled: true
  image:
    # BUILT FROM node-red/Dockerfile:
    #   docker build -f node-red/Dockerfile -t <repo>:<tag> node-red
    #
    # A CUSTOM IMAGE IS REQUIRED, not a convenience. settings.js lives on the data volume and Node
    # resolves require() from the requiring FILE's location, so it reaches /data/node_modules and
    # /node_modules -- never the image's. The base image is pinned because settings.js depends on
    # three contracts internal enough to move between releases.
    #
    # PUBLISHED -- see supabaseFunctions.image for what the empty tag means.
    repository: ghcr.io/harri-llewelyn/acs-cymru/node-red
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  oauthClientId: c0ffee00-0000-4000-8000-000000000002
  # Re-seed the flow even though /data is already provisioned. Destructive to editor changes --
  # node-red-init backs the previous flow up to flows.json.pre-seed first.
  forceSeed: false
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # M5. The `node-red` user is uid/gid 1000. THIS REPLACES the `chown -R 1000:1000 /data` the
  # Compose init entrypoint runs -- Kubernetes does it natively on volume mount.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

frontend:
  enabled: true
  image:
    # BUILT FROM frontend/Dockerfile WITH VITE_RUNTIME_CONFIG=true:
    #   docker build -f frontend/Dockerfile --build-arg VITE_RUNTIME_CONFIG=true \
    #     -t <repo>:<tag> frontend
    #
    # That build arg is the whole point of that arg: it bakes nothing, so this ONE image serves any
    # environment and reads its configuration from the /config.js ConfigMap below.
    #
    # PUBLISHED -- see supabaseFunctions.image for what the empty tag means. It bakes nothing, so
    # the published image is the same one every environment runs; the ConfigMap below differs.
    repository: ghcr.io/harri-llewelyn/acs-cymru/frontend
    tag: ""
    pullPolicy: IfNotPresent
  # The only component here that scales freely -- NGINX serving static files, no state, no upstream
  # connection pool. First HPA candidate alongside Kong and PostgREST.
  replicas: 2
  # Delivered to the browser through the /config.js ConfigMap, NOT baked into the image. That is
  # what makes these flippable with a `helm upgrade` here while the Compose path still needs an
  # image rebuild -- see the header of frontend/src/config.js.
  #
  # Gates every supabase.channel() subscription. With it off the tabs fall back to a 3s poll.
  enableRealtime: true
  # Where the Report Bug button files issues. A fork that leaves this at the default sends its
  # reports to the upstream tracker.
  githubRepoUrl: https://github.com/Harri-Llewelyn/ACS-Cymru
  # Off by default: a self-registered user has no row in public.user_roles, and every RLS policy
  # and edge function then refuses them -- an account that signs in and can do nothing reads as a
  # broken deployment rather than a closed one.
  allowSignup: false
  #
  # THERE IS DELIBERATELY NO `grafanaUrl` HERE. The dashboard's "View in Grafana" links on an active
  # alert are built from `publicUrls.grafana` (falling back to grafana.<publicBaseDomain>) -- the same
  # helper Grafana's own root_url and its OAuth redirect_uris come from. A second value would let the
  # link and the login point at different origins, and only one of those two failures is visible.
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------------------------
# Observability and exposure
# ---------------------------------------------------------------------------------------------
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    # Pinned, unlike Compose's `:latest`. grafana.ini depends on behaviour that has moved between
    # releases -- `use_pkce`, `auth_style`, and the env-override mapping this chart relies on to
    # replace auth_url without editing the file.
    tag: "13.1.3"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    # Grafana's SQLite: SSO-created users, their org roles, and dashboards saved in the UI. Small,
    # but not reproducible from the repository the way provisioned content is.
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # M5. grafana/grafana runs as uid/gid 472 -- NOT 1000. The common mistake here, and it presents as
  # "GF_PATHS_DATA is not writable" on a volume that looks fine.
  podSecurityContext:
    fsGroup: 472
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  # k3s ships Traefik enabled by default, which is why it is the default here. ingress-nginx needs
  # only this value changed.
  className: traefik
  # Merged onto the Ingress. cert-manager's issuer annotation is added automatically when
  # `tls.certManager.clusterIssuer` is set below, so it does not need repeating here.
  annotations: {}
  tls:
    enabled: false
    # ONE WILDCARD CERTIFICATE for *.<publicBaseDomain> is the intended arrangement: seven
    # subdomains means seven separate certificates and seven ACME challenges otherwise, and they
    # would renew independently.
    secretName: acs-cymru-tls
    certManager:
      # e.g. letsencrypt-prod. Setting it adds the cert-manager.io/cluster-issuer annotation, which
      # is what makes cert-manager issue into `secretName` above.
      clusterIssuer: ""
  # Per-route overrides, keyed by the route names in acs-cymru.ingressRoutes: frontend, supabase,
  # nodered, grafana, studio, docs, mqtt. Set one to false to keep a service off the ingress while
  # leaving it running in-cluster -- studio and docs are the usual candidates on a public deployment,
  # since neither is meant for anyone outside the operations team.
  routes: {}
  #  studio: false
  #  docs: false

# ---------------------------------------------------------------------------------------------
# In-cluster conformance suites
#
# OFF BY DEFAULT. These SEED AND DELETE fixtures, drive real MQTT traffic and take minutes -- not
# something to attach to an ordinary install. Enable them in CI, or deliberately against a stack you
# are willing to have written to:
#
#   helm upgrade ... --set e2e.enabled=true
#   kubectl -n <ns> wait --for=condition=complete job/<release>-acs-cymru-e2e-validate --timeout=15m
#
# The FAST gate is separate and always available -- `helm test` runs the postgres_fdw check (M6),
# which takes about a second and mutates nothing.
# ---------------------------------------------------------------------------------------------
e2e:
  enabled: false
  image:
    # BUILT FROM tests/Dockerfile with the REPOSITORY ROOT as context. It extends the ingestion
    # image (which already has psycopg2, paho and a protoc-generated sparkplug_b_pb2) with
    # jsonschema and the AAS suite -- jsonschema is deliberately NOT in the production ingestion
    # image, and without it the schema-conformance tests skip themselves while still reporting
    # success.
    #   docker build -f tests/Dockerfile -t <repo>:<tag> .
    #
    # PUBLISHED -- see supabaseFunctions.image for what the empty tag means. It is published for
    # the same reason it exists: a conformance suite that only runs where the repository is
    # checked out cannot be run against the cluster it is meant to judge.
    repository: ghcr.io/harri-llewelyn/acs-cymru/test-runner
    tag: ""
    pullPolicy: IfNotPresent
  # How long the AAS Job waits for the validate Job to finish. validate.py drives MQTT round trips
  # and its own retries, so this is minutes, not seconds.
  waitTimeout: 900
  # Kept well after success: the whole value of a conformance run is its output.
  ttlSecondsAfterFinished: 86400
  # The ingress controller's address, used ONLY to add hostAliases to the validate Job.
  #
  # Check 7b signs in through the real OAuth chain, so it follows BROWSER-FACING URLs -- which is
  # what makes it able to catch a redirect_uri that disagrees with what a service advertises. A pod
  # does not resolve those names the way a browser does: with the dev domain `127.0.0.1.nip.io`
  # they resolve to 127.0.0.1, which inside that pod is the pod itself, and the check fails as
  # `Connection refused` while every service is healthy.
  #
  # Set this to the ingress controller's ClusterIP (on k3d: `kubectl -n kube-system get svc traefik
  # -o jsonpath='{.spec.clusterIP}'`). Leave it empty where the public domain already resolves from
  # inside the cluster -- the aliases are then simply absent.
  ingressIp: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# ---------------------------------------------------------------------------------------------
# Hardening
# ---------------------------------------------------------------------------------------------

# M4. Default-deny both directions, with one explicit allow per flow. See
# templates/networkpolicy.yaml -- the flow graph is declared ONCE as edges and both directions are
# generated from it, so allowing egress from A while forgetting ingress on B is unrepresentable.
#
# OFF BY DEFAULT, and that is considered rather than timid: the two namespace knobs below cannot be
# inferred from anything the chart can see, and getting either wrong produces a stack where every
# pod reports healthy and nothing reaches anything. Turn it on deliberately, having set them.
# ---------------------------------------------------------------------------------------------
# Self-monitoring (Prometheus Operator)
#
# REQUIRES THE PROMETHEUS OPERATOR CRDs first: ServiceMonitor is not a core type, so with the CRD
# absent `helm install` fails outright with `no matches for kind "ServiceMonitor"`. Hence off by
# default rather than merely unused.
#
# Only three targets exist (grafana, supabase-kong, mosquitto), why supabase-rest is deliberately
# not a fourth, and why Grafana being inside the observed stack means alerting off-cluster:
#   deploy/k8s/README.md -> "Self-monitoring"
# ---------------------------------------------------------------------------------------------
telemetry:
  serviceMonitor:
    enabled: false
    # -----------------------------------------------------------------------------------------
    # THE LABEL PROMETHEUS OPERATOR SELECTS ON, and the commonest reason a correct-looking setup
    # produces no targets.
    #
    # The operator only adopts ServiceMonitors matching its own `serviceMonitorSelector`, which
    # kube-prometheus-stack defaults to `release: <the operator's release name>`. Without a
    # matching label here the objects are created successfully, appear in `kubectl get
    # servicemonitors`, and are silently ignored -- no target, no error, nothing logged.
    #
    # Check what yours wants:
    #   kubectl get prometheus -A -o jsonpath='{.items[*].spec.serviceMonitorSelector}'
    # -----------------------------------------------------------------------------------------
    labels: {}
    #  release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s

# ===============================================================================================
# Broker credential-issuing service
# ===============================================================================================
# The narrow authority the enroll-gateway edge function calls to mint a gateway's Mosquitto account.
#
# IT RUNS AS A SIDECAR IN THE BROKER'S POD, not as a Deployment of its own -- Mosquitto re-reads its
# password file only on SIGHUP, and a signal cannot cross a PID namespace. See the container block in
# templates/messaging/mosquitto.yaml, and templates/messaging/gateway-credential.yaml for its
# ServiceAccount, Role, Service and script ConfigMap.
#
# DISABLING IT does not break anything already enrolled -- existing credentials live in the Secret
# and the broker keeps serving them. It removes the ability to enrol a NEW physical gateway without
# an operator running scripts/mosquitto-provision-gateway.mjs by hand, which remains supported and
# is the only path on a cluster where you would rather not run this at all.
gatewayCredential:
  enabled: true
  image:
    repository: ghcr.io/harri-llewelyn/acs-cymru/gateway-credential
    # EMPTY = built here, resolved from Chart.appVersion. Built FROM eclipse-mosquitto so it carries
    # the broker's own mosquitto_passwd -- the hash has to be readable by the mosquitto that will
    # verify it, and a reimplementation produces a file that looks right and refuses every login.
    tag: ""
    pullPolicy: IfNotPresent
  port: 9010
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

networkPolicy:
  enabled: false
  # Where CoreDNS/kube-dns runs. WITHOUT DNS EGRESS NOTHING RESOLVES, and the symptom is "could not
  # translate host name" -- which reads as a wrong hostname, not as a blocked packet.
  dnsNamespace: kube-system
  # Where the ingress controller runs. kube-system on k3s (Traefik ships there); ingress-nginx
  # usually has its own namespace. A wrong value means every route 502s while every pod is healthy.
  ingressControllerNamespace: kube-system
  # Shopfloor gateways are not pods, so no selector describes them -- only an ipBlock. The default is
  # open because guessing a plant CIDR would silently drop the fleet. NARROW THIS: the broker is the
  # one service deliberately reachable from the plant network, and it is plaintext with password auth.
  #
  # Traffic arrives SNAT'd by ServiceLB, so the source address seen is the NODE's.
  mqttAllowedCidrs:
    - 0.0.0.0/0
  # For the e2e-aas-export initContainer, which reads a Job's status with kubectl. Narrow to the
  # service CIDR; empty removes the rule (and that Job then cannot run under policy).
  apiServerCidr: 0.0.0.0/0
  apiServerPorts: [443, 6443]
  # Raw NetworkPolicy spec, for flows the chart cannot express: an off-cluster SMTP relay, an
  # External Secrets webhook, an S3 endpoint for backups, a corporate proxy.
  extraEgress: {}
  # -------------------------------------------------------------------------------------------
  # The INGRESS half of the same escape hatch. Raw NetworkPolicy spec, so podSelector is yours.
  #
  # The generated rules cover flows BETWEEN COMPONENTS OF THIS CHART only, so anything reaching in
  # from outside has no `from` component to name and needs a rule here. Prometheus is the case
  # this exists for; a kubelet-probe allow also belongs here if your CNI does not exempt them.
  # (deploy/k8s/README.md -> "NetworkPolicies (M4)")
  #
  #  extraIngress:
  #    podSelector:
  #      matchLabels:
  #        app.kubernetes.io/part-of: acs-cymru
  #    policyTypes: [Ingress]
  #    ingress:
  #      - from:
  #          - namespaceSelector:
  #              matchLabels:
  #                kubernetes.io/metadata.name: monitoring
  #        ports:
  #          - protocol: TCP
  #            port: 9100
  # -------------------------------------------------------------------------------------------
  extraIngress: {}

# PodDisruptionBudgets -- ONLY for workloads that genuinely run more than one replica.
#
# A PDB on a single-replica workload is actively harmful: `minAvailable: 1` against one pod can never
# be satisfied by an eviction, so `kubectl drain` hangs indefinitely and node maintenance silently
# stops working. Every single-writer component here is deliberately one replica, so none gets one --
# and the chart refuses to create one for them.
podDisruptionBudgets:
  enabled: false
  # maxUnavailable rather than minAvailable, so it stays correct as replicas change.
  maxUnavailable: 1

# HPAs for the stateless components only.
#
# The chart REFUSES to create one for a single-writer workload (acs-cymru.validateAutoscaling).
# That is not a style rule: scaling `ingestion` duplicates every telemetry row, every quarantine
# decision and every append-only audit row, silently.
#
# NEEDS metrics-server. CI's k3d cluster disables it deliberately, which is one reason this is off.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Adding a single-writer component here fails the render rather than the cluster.
  components:
    - supabase-rest
    - supabase-kong
    - supabase-functions
    - frontend

# Scheduled logical backups -- OPT-IN, and the only recovery path this stack has. `local-path` is a
# node-local provisioner with no replication, and neither database is replicated.
backup:
  enabled: false
  # 02:30 daily. Deliberately not "@daily", which is midnight -- the same minute as every other
  # default-scheduled job on the cluster.
  schedule: "30 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Dumps older than this are pruned by the same Job that writes them.
  retentionDays: 14
  # ---------------------------------------------------------------------------------------------
  # Also archive the 3D model objects from supabase-storage's PVC.
  #
  # WHY IT IS WORTH A SWITCH AT ALL. The two pg_dumps capture `devices.model_3d_path` but not the
  # bytes it points at. Restore from them alone and every device row comes back intact, referencing
  # objects that no longer exist -- so an AAS export emits a VisualRepresentation File element with
  # a dead URL. The exporter cannot detect that (it composes the URL from a key, it does not fetch
  # it), so the damage appears only when someone opens the shell in a viewer, potentially long
  # after the restore was signed off.
  #
  # WHY IT IS OFF BY DEFAULT. The PVC is ReadWriteOnce, so this Job must land on the SAME NODE as
  # the running storage pod to mount it -- RWO permits multiple pods only within one node. The
  # chart adds a podAffinity to arrange that; on a cluster where the node is full or cordoned, the
  # Job stays Pending instead of running, and a backup that silently stops running is worse than
  # one that was never enabled. Turn it on deliberately, and check the first run completed.
  #
  # If you have Velero or a CSI snapshotter, prefer that -- see supabaseStorage.podAnnotations and
  # persistence.annotations. This exists for stacks with neither.
  # ---------------------------------------------------------------------------------------------
  includeStorage: false
  # pvc | s3
  destination: pvc
  persistence:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  s3:
    # destination: s3 only. The bucket must already exist.
    bucket: ""
    # e.g. https://s3.eu-west-2.amazonaws.com, or a MinIO endpoint.
    endpoint: ""
    region: ""
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are read from this Secret. Kept out of the chart's
    # own Secret because backup credentials have a different lifetime and a different blast radius.
    existingSecret: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
