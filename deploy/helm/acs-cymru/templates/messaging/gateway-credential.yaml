{{- if .Values.gatewayCredential.enabled }}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{/*
  =================================================================================================
  The credential service's identity, authority and address.

  THE CONTAINER ITSELF IS NOT HERE -- it is a sidecar in the broker's pod
  (messaging/mosquitto.yaml), beside the broker it administers over loopback, with its code in that
  file's ConfigMap. This file is everything around it.

  WHAT THE AUTHORITY IS, precisely: `get` and `patch` on ONE Secret, named, for the playback
  delivery file (0078). Gateway accounts are in the broker's own document, not in any Secret. Not
  `list`, which would let it enumerate every Secret in the namespace, not `create`, not `delete`,
  and not a wildcard -- the difference between this and `secrets: ["*"]` is the difference between
  a service that can hand playback a password and one that can read the Postgres password, the
  service-role key and every OAuth client secret in the release.
  =================================================================================================
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-gateway-credential" $fullname }}
  labels:
    {{- include "acs-cymru.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-credential
# The pod projects this token explicitly into one container; nothing should mount it by default.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-gateway-credential" $fullname }}
  labels:
    {{- include "acs-cymru.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-credential
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # NAMED. `resourceNames` is what makes this Role about the playback delivery Secret rather than
    # about secrets in general. It costs one line and removes every other Secret in the namespace
    # from reach -- including the release's own, which holds the service-role key.
    #
    # NOTE: resourceNames cannot restrict `list` or `watch` (the API server cannot filter a
    # collection request by name), which is exactly why neither verb is granted. The service reads
    # this Secret by name and nothing else.
    resourceNames:
      - {{ .Values.mosquitto.credentials.secretName | quote }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-gateway-credential" $fullname }}
  labels:
    {{- include "acs-cymru.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-credential
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-gateway-credential" $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-gateway-credential" $fullname }}
    namespace: {{ .Release.Namespace }}
---
{{/*
  A SEPARATE SERVICE FROM `mosquitto`, pointing at the same pods.

  The broker's Service carries 1883/9001/8883 and is what every gateway on the site addresses. This
  one carries 9010 and is addressed by exactly one caller. Keeping them apart means the NetworkPolicy
  can admit the edge functions to credential issuance without touching who may reach the broker, and
  it keeps "what is this port for" answerable from the object rather than from a port number.

  ClusterIP, and never a NodePort or LoadBalancer: this must not be reachable from outside the
  cluster. Issuing a credential is, through the gateway's own role, the ability to publish telemetry
  as that gateway.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-gateway-credential" $fullname }}
  labels:
    {{- include "acs-cymru.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-credential
spec:
  type: ClusterIP
  {{/*
    SELECTS THE BROKER'S PODS, because that is where the sidecar runs. The helper already emits
    `app.kubernetes.io/component`, so the component is passed in rather than appended -- appending a
    second copy of that key produces a selector with a duplicate mapping key, which YAML resolves by
    last-wins and would silently work until the helper's own value changed.
  */}}
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" "mosquitto") | nindent 4 }}
  ports:
    - name: credential
      port: {{ .Values.gatewayCredential.port }}
      targetPort: credential
      protocol: TCP
{{- end }}
