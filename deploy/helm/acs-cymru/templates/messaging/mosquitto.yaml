{{- if .Values.mosquitto.enabled }}
{{- $component := "mosquitto" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $conf := .Files.Get "files/mosquitto/mosquitto.conf" -}}
{{- $acl := .Files.Get "files/mosquitto/mosquitto.acl" -}}
{{- $tlsConf := .Files.Get "files/mosquitto/mosquitto-tls.conf" -}}
{{- $tls := .Values.mosquitto.tls -}}
{{- if and $tls.enabled (not $tlsConf) }}
{{- fail "\n\nacs-cymru: mosquitto.tls.enabled is set but files/mosquitto/mosquitto-tls.conf is missing.\n\nMirror it with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render rather than silently omitting the listener: the Service would publish 8883, the\nNetworkPolicy would allow it, the certificate would be issued -- and nothing would be listening on\nit. Every gateway would fail to connect against a stack that reports entirely healthy.\n" }}
{{- end }}
{{- if or (not $conf) (not $acl) }}
{{- fail "\n\nacs-cymru: files/mosquitto/mosquitto.conf and/or mosquitto.acl are missing.\n\nMirror them with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render is deliberate. Without mosquitto.conf the broker falls back to its BUILT-IN\nDEFAULTS -- which on 2.x means listening on loopback only, so every gateway simply cannot connect;\nand without the acl_file line it would accept `allow_anonymous false` credentials and then let ANY\nauthenticated client publish to ANY topic, which is exactly the forgery the ACL exists to prevent.\n" }}
{{- end }}
---
{{/*
Broker policy: repository-managed, read-only, identical on both targets.

mosquitto.conf declares `acl_file` GLOBALLY rather than per-listener, and that is what guarantees
the TCP (1883) and WebSocket (9001) listeners are authorised identically -- declaring it once is the
mechanism, not a tidiness choice.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-mosquitto-policy" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  mosquitto.conf: |
{{ $conf | indent 4 }}
  mosquitto.acl: |
{{ $acl | indent 4 }}
  {{- if $tls.enabled }}
  # Appended to mosquitto.conf by the assemble-config initContainer. Carried as a separate key so
  # `kubectl get cm -o yaml` shows the base policy unchanged and the TLS addendum as its own object
  # -- the diff between the two targets is then one file, visible, rather than a merged blob.
  mosquitto-tls.conf: |
{{ $tlsConf | indent 4 }}
  {{- end }}
{{- if $tls.enabled }}
---
{{/*
=================================================================================================
The broker's server certificate.

WHY A cert-manager Certificate AND NOT A HAND-MADE SECRET. Renewal. A certificate that is created
once by hand expires in the middle of a shift 90 days later, and the failure is every gateway
refusing to connect at once with a hostname/expiry alert the broker does not log -- the fleet simply
goes quiet. cert-manager renews at renewBefore and the reload sidecar SIGHUPs the broker, which
re-reads the certificate WITHOUT dropping connected gateways (verified against eclipse-mosquitto
2.0.20, and carried forward to the 2.0.22 pin unre-verified: swapping the files and sending
SIGHUP changes the served certificate in place).

THE SAN LIST IS THE WHOLE DIFFICULTY, and it is asymmetric in a way that hides the mistake:

  - IN-CLUSTER clients (the ingestion daemon, Node-RED) dial `mosquitto`, which is in the list
    below, so they verify correctly the moment this is enabled. That is where you will test.
  - GATEWAYS dial an IP ADDRESS, because there is rarely plant DNS for the broker. If that address
    is not in ipAddresses below, every gateway fails verification while the in-cluster clients are
    perfectly happy -- so the stack reports healthy, telemetry keeps flowing from the simulator,
    and the fleet is off. It reads as a gateway fault.

`external.loadBalancerIP` is included automatically when set. Everything else the fleet dials goes
in `tls.extraIpSans` / `tls.extraDnsSans`.
=================================================================================================
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-mosquitto-tls" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  secretName: {{ $tls.secretName }}
  duration: {{ $tls.duration }}
  renewBefore: {{ $tls.renewBefore }}
  # A SERVER certificate. `clientAuth` is deliberately absent: the listener runs
  # `require_certificate false`, so the broker proves its identity and the client proves its own with
  # the same password it uses on 1883. See mosquitto-tls.conf for why half a mutual-TLS design is
  # worse than none.
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    # RSA to match the root, and for the same fleet-compatibility reason -- see
    # deploy/k8s/internal-ca.yaml. 2048 for a 90-day leaf.
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always
  commonName: mosquitto
  dnsNames:
    # The in-cluster name, which is what the ingestion daemon and Node-RED connect to and is
    # identical on both targets.
    - mosquitto
    - {{ printf "mosquitto.%s" .Release.Namespace }}
    - {{ printf "mosquitto.%s.svc" .Release.Namespace }}
    - {{ printf "mosquitto.%s.svc.cluster.local" .Release.Namespace }}
    {{- if .Values.mosquitto.external.enabled }}
    - mosquitto-external
    - {{ printf "mosquitto-external.%s.svc.cluster.local" .Release.Namespace }}
    {{- end }}
    {{- with .Values.global.publicBaseDomain }}
    # The name the WebSocket route is published under, so a browser-side MQTT client verifies too.
    - {{ printf "mqtt.%s" . }}
    {{- end }}
    {{- range $tls.extraDnsSans }}
    - {{ . | quote }}
    {{- end }}
  {{- $ips := concat (ternary (list .Values.mosquitto.external.loadBalancerIP) (list) (ne (toString .Values.mosquitto.external.loadBalancerIP) "")) ($tls.extraIpSans | default list) }}
  {{- if $ips }}
  ipAddresses:
    {{- range $ips }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  issuerRef:
    name: {{ $tls.clusterIssuer }}
    kind: {{ $tls.issuerKind }}
    group: cert-manager.io
{{- end }}
---
{{/*
Per-gateway credentials.

CREATED EMPTY AND NEVER OVERWRITTEN. `helm.sh/resource-policy: keep` plus the lookup below mean an
existing Secret is left exactly as it is -- otherwise every `helm upgrade` would wipe every gateway
credential provisioned since the last one, and the fleet would fall off the broker in one go with
`helm upgrade` as the only clue.

The five PLATFORM principals are NOT in here. They come from `secrets.mqtt*` and are re-applied by
the initContainer (and the reload sidecar) on every start, so rotating one in values reaches the
broker on restart. This Secret holds only what the provisioning script adds.

Option C (mosquitto-go-auth against the `gateways` table, where the username is already the
sparkplug_id the ACL's %u matches) remains the recorded future direction -- see architecture §5.1.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.mosquitto.credentials.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mosquitto.credentials.secretName }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # Empty on first install. `helm upgrade` re-renders this document, so preserving the current
  # contents through `lookup` is what stops it being reset -- `resource-policy: keep` only governs
  # deletion, not update.
  password_file: |
{{ if $existing }}{{ (index $existing.data "password_file" | default "" | b64dec) | indent 4 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  # THE NAME IS `mosquitto`, matching the Compose service name -- the ingestion daemon and
  # Node-RED's broker node both address it as `mosquitto:1883` and neither changes between targets.
  name: mosquitto
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    # 1883 is NEVER removed from the in-cluster Service, even with TLS on. The ingestion daemon and
    # Node-RED both reach the broker over the pod network, which does not cross a plant boundary, and
    # forcing them onto TLS would mean the CA bundle becoming a hard dependency of two workloads that
    # gain nothing from it. `mosquitto.external.plaintext: false` is how 1883 stops being published
    # OUTSIDE -- which is the exposure that matters.
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: mqtt-ws
      port: 9001
      targetPort: mqtt-ws
      protocol: TCP
    {{- if $tls.enabled }}
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
    {{- end }}
    {{- if .Values.mosquitto.metrics.enabled }}
    # ON THE IN-CLUSTER SERVICE ONLY -- deliberately never added to mosquitto-external below.
    # These statistics describe the whole fleet's connection and throughput behaviour, and that
    # Service is reachable from the plant network.
    - name: metrics
      port: {{ .Values.mosquitto.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- if .Values.mosquitto.external.enabled }}
---
{{/*
External exposure for shopfloor gateways.

A SECOND Service, not a change of type on the one above: the in-cluster name must stay a plain
ClusterIP so `mosquitto:1883` resolves the same way on both targets, and mixing the two would tie
internal service discovery to an external IP allocation.

MQTT IS RAW TCP AND CANNOT RIDE AN HTTP INGRESS. On k3s the built-in ServiceLB (Klipper) satisfies
`LoadBalancer` with no MetalLB by binding the port on nodes that have it free -- which also means
1883 must BE free: a Compose stack running on the same machine holds it and this Service sits
<pending> with nothing naming the conflict.

The WebSocket listener (9001) is exposed here too for parity, but it can also ride the
Ingress, which is the better place for it once TLS terminates there.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-external
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    acs-cymru.io/note: >-
      {{ if $tls.enabled -}}
      Shopfloor gateways connect here. 8883 is TLS; 1883 is plaintext and is
      {{ if .Values.mosquitto.external.plaintext }}still published for migration -- set
      mosquitto.external.plaintext=false once every gateway is on 8883{{ else }}not published{{ end }}.
      {{- else -}}
      Shopfloor gateways connect here. Plaintext with password auth -- set mosquitto.tls.enabled
      before this is reachable from anything but a trusted network.
      {{- end }}
spec:
  type: {{ .Values.mosquitto.external.type }}
  {{- with .Values.mosquitto.external.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    {{- if .Values.mosquitto.external.plaintext }}
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
      {{- if and (eq .Values.mosquitto.external.type "NodePort") .Values.mosquitto.external.nodePort }}
      nodePort: {{ .Values.mosquitto.external.nodePort }}
      {{- end }}
    {{- end }}
    {{- if $tls.enabled }}
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
      {{- if and (eq .Values.mosquitto.external.type "NodePort") .Values.mosquitto.external.tlsNodePort }}
      nodePort: {{ .Values.mosquitto.external.tlsNodePort }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.mosquitto.replicas }}
  strategy:
    # Recreate. Two brokers behind one Service split the fleet in half, each seeing only the
    # gateways that landed on it -- and Sparkplug state (birth/death, sequence numbers) is
    # per-connection, so the halves do not reconcile.
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the broker when the policy changes. Mosquitto reloads conf and ACL on SIGHUP, but a
        # listener change needs a restart, and this makes a policy edit visible in rollout history.
        #
        # The TLS stanza is in the checksum for exactly that reason: turning `tls.enabled` on ADDS A
        # LISTENER, which SIGHUP cannot do. Without it here, enabling TLS would update the ConfigMap,
        # leave the running broker with no 8883, and present as "the port is published but refuses
        # connections" -- with the ConfigMap showing the listener plainly declared.
        checksum/policy: {{ printf "%s%s%s" $conf $acl (ternary $tlsConf "" $tls.enabled) | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Lets the reload sidecar signal the broker process. Without it the sidecar sees only its own
      # PID namespace and `kill -HUP` has nothing to address. The gateway-credential sidecar depends
      # on the same property, and for the same reason.
      shareProcessNamespace: true
      {{- if .Values.gatewayCredential.enabled }}
      serviceAccountName: {{ printf "%s-gateway-credential" $fullname }}
      {{/*
        OFF AT THE POD LEVEL, ON FOR ONE CONTAINER. The default mounts the ServiceAccount token into
        EVERY container, which would give the broker and the metrics exporter a token that can patch
        the credential Secret -- authority neither has any use for, in containers that are the two
        most exposed things in this pod (one terminates every gateway connection, the other serves
        HTTP). The token is projected into the gateway-credential container alone; see `volumes`.
      */}}
      automountServiceAccountToken: false
      {{- end }}
      # M5. eclipse-mosquitto runs as uid/gid 1883.
      securityContext:
        {{- toYaml .Values.mosquitto.podSecurityContext | nindent 8 }}
      initContainers:
        {{/*
          Assembles /mosquitto/config as a WRITABLE emptyDir.

          WHY NOT MOUNT THE THREE FILES DIRECTLY. mosquitto.conf names
          `/mosquitto/config/password_file` and `/mosquitto/config/mosquitto.acl` -- paths shared
          with the Compose target, so they cannot be moved without changing both. Mounting a
          ConfigMap over that directory would make it read-only and hide the password file;
          mounting each file with subPath works but subPath mounts never receive updates, which
          would defeat the reload sidecar. One assembled emptyDir avoids both.

          MODE 0600 AND OWNED BY THE BROKER'S uid. Mosquitto WARNS on a world-readable password
          file, and a Secret projection is 0644 by default. fsGroup makes the emptyDir
          group-writable by 1883, which is what lets this container (running as root) hand the file
          over with a mode the broker will accept without complaint.
        */}}
        - name: assemble-config
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          securityContext:
            # Root, to chown. The broker container itself does not run as root.
            runAsUser: 0
          env:
            {{- include "acs-cymru.mqttPrincipalEnv" . | nindent 12 }}
          command:
            - /bin/sh
            - -e
            - -c
            - |
              cp /policy/mosquitto.conf /mosquitto/config/mosquitto.conf
              cp /policy/mosquitto.acl  /mosquitto/config/mosquitto.acl
              {{- if $tls.enabled }}

              # The MQTTS listener, APPENDED -- see mosquitto-tls.conf for why it is not simply part
              # of mosquitto.conf. Refuse to start rather than append a listener whose certificate is
              # not there yet: mosquitto would exit 1 on three lines of OpenSSL "system library"
              # output that name neither the file nor the option, and the pod would CrashLoopBackOff
              # with a message pointing nowhere near a pending cert-manager Certificate.
              if [ ! -s /mosquitto/certs/tls.crt ] || [ ! -s /mosquitto/certs/tls.key ]; then
                echo 'MQTTS is enabled but /mosquitto/certs/tls.crt is missing or empty.' >&2
                echo 'The certificate has not been issued yet. Check it:' >&2
                echo '  kubectl describe certificate {{ printf "%s-mosquitto-tls" $fullname }}' >&2
                echo 'A ClusterIssuer of kind CA resolves its key pair in CERT-MANAGERs namespace,' >&2
                echo 'not this one -- that is the usual cause. See deploy/k8s/internal-ca.yaml.' >&2
                exit 1
              fi
              cat /policy/mosquitto-tls.conf >> /mosquitto/config/mosquitto.conf
              # No openssl in eclipse-mosquitto, so the certificate cannot be described here --
              # `kubectl describe certificate` is where its SANs and expiry live. This records only
              # that the listener was added and that the files were present when it was.
              echo "Appended the MQTTS listener (8883); certificate present at /mosquitto/certs/tls.crt."
              {{- end }}

              # Gateway credentials, as provisioned into the Secret. Absent or empty on a fresh
              # install, which is correct -- no gateways exist yet.
              if [ -s /passwd-src/password_file ]; then
                cp /passwd-src/password_file /mosquitto/config/password_file
              else
                : > /mosquitto/config/password_file
              fi

              # The FIVE PLATFORM PRINCIPALS, re-applied on every start from values rather than
              # stored in the Secret, so rotating one in values reaches the broker on the next
              # restart. Shared with the reload sidecar so the two cannot disagree about the set.
              {{- include "acs-cymru.mqttPrincipalUpserts" . | nindent 14 }}

              chown 1883:1883 /mosquitto/config/password_file
              chmod 0600 /mosquitto/config/password_file
              echo "Assembled broker config; $(grep -c : /mosquitto/config/password_file) account(s) in the password file."
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: passwd-src
              mountPath: /passwd-src
              readOnly: true
            - name: config
              mountPath: /mosquitto/config
            {{- if $tls.enabled }}
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          args: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: mqtt-ws
              containerPort: 9001
              protocol: TCP
            {{- if $tls.enabled }}
            - name: mqtts
              containerPort: 8883
              protocol: TCP
            {{- end }}
          env:
            {{- /*
              THE MONITORING PRINCIPAL, which can read $SYS and publish nothing anywhere. The
              probes below are the only reason the broker container needs a credential at all, and
              giving them the ingestion or simulator account would leave a credential able to write
              Sparkplug topics sitting in the broker's own environment for the sake of a health
              check. Read-only is exactly the authority a probe needs.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_MONITOR_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASSWORD" "secretName" $secretName "key" "MQTT_MONITOR_PASSWORD") | nindent 12 }}
          # A REAL SUBSCRIBE, not a TCP check. The broker runs `allow_anonymous false`, so a
          # tcpSocket probe passes while every client is being refused with CONNACK 5 -- which is
          # precisely the failure mode this stack has hit before (a stale credential file, or a
          # missing one). Subscribing to $SYS proves the listener AND the password file together.
          #
          # $SYS is deliberate: it needs no application topic to exist, so this works on an idle
          # broker with no gateways yet.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: data
              mountPath: /mosquitto/data
            {{- if $tls.enabled }}
            # Read straight from the projected Secret, NOT copied into the assembled config dir.
            # That is what makes renewal work: cert-manager rewrites the Secret, the kubelet
            # refreshes this mount, and the sidecar's SIGHUP makes the broker re-read these exact
            # paths. A copy taken at start would freeze the certificate for the pod's lifetime and
            # the broker would keep serving an expired one until something happened to restart it.
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
        {{/*
          =========================================================================================
          M1 -- the credential reload sidecar.

          THE PROBLEM. A kubelet refreshes a projected Secret volume on its own sync period, not on
          write: 60-90 seconds in practice. And Mosquitto reads the password file ONCE at start, so
          even after the file changes the broker keeps refusing the new gateway. A freshly
          provisioned credential therefore appears not to work, for a minute or more, with nothing
          to distinguish "not synced yet" from "wrong password" -- an engineer commissioning a
          gateway will retype it and conclude the tooling is broken well before the file lands.

          THIS SIDECAR closes the second half of that gap: it notices the projected file changing
          and SIGHUPs the broker, which re-reads the password and ACL files WITHOUT dropping
          connected gateways.

          It does NOT close the first half -- the kubelet's sync delay is not something a sidecar
          can shorten. That is why the provisioning script forces the reload itself rather than
          waiting (see scripts/mosquitto-provision-gateway.mjs --target=k8s).

          IT IS STILL REQUIRED even with the script forcing reloads, and this is the part worth
          keeping: it is the only path by which a Secret changed by ANY OTHER ROUTE -- a
          `helm upgrade`, a restore from backup, another operator's kubectl, an External Secrets
          refresh -- reaches the running broker at all.
          =========================================================================================
        */}}
        - name: credential-reload
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          securityContext:
            # Root, so it can write the broker-owned file and signal the broker process.
            runAsUser: 0
          env:
            {{- include "acs-cymru.mqttPrincipalEnv" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              # Compares the PROJECTED Secret against what the broker is using. Content, not mtime:
              # a projected volume's timestamps move on every kubelet sync whether or not the data
              # changed, so mtime would HUP the broker every 60s forever.
              last=""
              if [ -s /passwd-src/password_file ]; then
                last=$(md5sum < /passwd-src/password_file)
              fi
              {{- if $tls.enabled }}
              # ---------------------------------------------------------------------------------
              # THE CERTIFICATE IS WATCHED THE SAME WAY, AND FOR A SHARPER REASON.
              #
              # cert-manager renews the leaf on its own schedule and rewrites the Secret in place.
              # Nothing restarts the broker: a Deployment's pod template has not changed, so there
              # is no rollout. Mosquitto read the certificate once at start, so without this it
              # keeps serving the OLD one until it expires, and then every gateway fails
              # verification at once -- weeks after the renewal that was supposed to prevent it,
              # with a healthy cert-manager reporting the certificate valid.
              #
              # SIGHUP is enough: verified against eclipse-mosquitto 2.0.20 (not re-verified on the
              # 2.0.22 pin, same 2.0.x line) that swapping the files
              # and sending SIGHUP changes the certificate served on an established listener, with
              # no restart and no disconnection. That is why this is a sidecar and not a
              # `kubectl rollout restart` on a schedule.
              # ---------------------------------------------------------------------------------
              lastcert=""
              if [ -s /mosquitto/certs/tls.crt ]; then
                lastcert=$(md5sum < /mosquitto/certs/tls.crt)
              fi
              {{- end }}
              while :; do
                sleep {{ .Values.mosquitto.credentials.watchIntervalSeconds }}
                {{- if $tls.enabled }}
                nowcert=""
                if [ -s /mosquitto/certs/tls.crt ]; then
                  nowcert=$(md5sum < /mosquitto/certs/tls.crt)
                fi
                if [ "$nowcert" != "$lastcert" ]; then
                  lastcert="$nowcert"
                  echo "broker certificate changed (renewal); reloading"
                  pid=$(pidof mosquitto 2>/dev/null || true)
                  if [ -n "$pid" ]; then
                    kill -HUP $pid && echo "sent SIGHUP to mosquitto (pid $pid) for the new certificate"
                  fi
                fi
                {{- end }}
                now=""
                if [ -s /passwd-src/password_file ]; then
                  now=$(md5sum < /passwd-src/password_file)
                fi
                [ "$now" = "$last" ] && continue
                last="$now"

                echo "gateway credentials changed; rebuilding the password file and reloading"
                if [ -s /passwd-src/password_file ]; then
                  cp /passwd-src/password_file /mosquitto/config/password_file
                else
                  : > /mosquitto/config/password_file
                fi
                # Re-add the platform principals: the Secret holds per-gateway credentials only, so
                # dropping these would disconnect the ingestion daemon, the i3X server and Node-RED
                # on the next reload -- and take the broker's own probes with them, which turns a
                # credential rotation into a NotReady pod. Shared with assemble-config so the two
                # cannot disagree about the set.
                {{- include "acs-cymru.mqttPrincipalUpserts" . | nindent 16 }}
                chown 1883:1883 /mosquitto/config/password_file
                chmod 0600 /mosquitto/config/password_file

                # SIGHUP, not a restart: Mosquitto re-reads the password and ACL files in place and
                # keeps every connected gateway. Resolved by name because shareProcessNamespace
                # makes the broker visible here, but its PID is not 1 (the pause container is).
                pid=$(pidof mosquitto 2>/dev/null || true)
                if [ -n "$pid" ]; then
                  kill -HUP $pid && echo "sent SIGHUP to mosquitto (pid $pid)"
                else
                  echo "mosquitto process not found; it will pick the file up when it starts" >&2
                fi
              done
          volumeMounts:
            - name: passwd-src
              mountPath: /passwd-src
              readOnly: true
            - name: config
              mountPath: /mosquitto/config
            {{- if $tls.enabled }}
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        {{- if .Values.gatewayCredential.enabled }}
        {{/*
          =========================================================================================
          The credential-issuing service.

          A SIDECAR IN THIS POD, NOT A DEPLOYMENT OF ITS OWN, and the reason is the same one that
          put the reload sidecar here: Mosquitto re-reads its password file only on SIGHUP, and a
          signal cannot cross a PID namespace. `shareProcessNamespace: true` is already set above,
          so a container here can apply a new credential to the RUNNING broker immediately. A
          separate Deployment could patch the Secret and then wait 60-90 seconds for the kubelet to
          sync the projected volume -- during which a freshly enrolled gateway is refused with
          nothing to distinguish "not synced yet" from "wrong password". That is the M1 problem the
          provisioning script already forces its way around, and re-creating it for the automated
          enrolment path would be worse: an appliance has no engineer watching it to retry.

          It is the exact counterpart of the Compose service's `pid: "service:mosquitto"`.

          THE SECRET IS STILL THE SOURCE OF TRUTH and is written FIRST, through the Kubernetes API.
          The local write is an acceleration of a change already committed, never a substitute --
          a pod rescheduled between the two steps comes back holding the credential.

          IT HOLDS A SERVICEACCOUNT TOKEN, AND ONLY THIS CONTAINER DOES. The pod sets
          `automountServiceAccountToken: false` and the token is projected into this container
          alone, so the broker and the exporter cannot reach the API server at all. The Role behind
          it permits `get` and `patch` on ONE Secret, by name.
          =========================================================================================
        */}}
        - name: gateway-credential
          image: {{ include "acs-cymru.image" (dict "ctx" . "image" .Values.gatewayCredential.image) | quote }}
          imagePullPolicy: {{ .Values.gatewayCredential.image.pullPolicy }}
          securityContext:
            # Root, for the same two reasons as the reload sidecar: it writes a file owned by uid
            # 1883 at mode 0600, and it signals a process running as 1883.
            runAsUser: 0
          command: ["node", "/scripts/gateway-credential-service.mjs"]
          env:
            - name: CREDENTIAL_TARGET
              value: k8s
            - name: MQTT_CREDENTIAL_SERVICE_PORT
              value: {{ .Values.gatewayCredential.port | quote }}
            - name: MOSQUITTO_SECRET
              value: {{ .Values.mosquitto.credentials.secretName | quote }}
            - name: ACS_CYMRU_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_CREDENTIAL_SERVICE_TOKEN" "secretName" $secretName "key" "MQTT_CREDENTIAL_SERVICE_TOKEN") | nindent 12 }}
          ports:
            - name: credential
              containerPort: {{ .Values.gatewayCredential.port }}
              protocol: TCP
          readinessProbe:
            # /healthz reports liveness and the configured target, never the state of the password
            # file or which accounts exist. It is the one unauthenticated route.
            httpGet:
              path: /healthz
              port: credential
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # The assembled config directory the broker is actually reading. WRITABLE: this is the
            # one container that may add an account.
            - name: config
              mountPath: /mosquitto/config
            {{- if $tls.enabled }}
            # The CA only, returned to an enrolling appliance so it can verify the broker. Read
            # from the SAME projected Secret the broker serves from, so the two cannot drift --
            # which is the whole reason this is read here rather than configured into an edge
            # function. `tls.key` is in this Secret too; nothing in this container reads it.
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
            - name: credential-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.gatewayCredential.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.mosquitto.metrics.enabled }}
        {{/*
          =========================================================================================
          The metrics exporter.

          MOSQUITTO PUBLISHES STATISTICS AS MQTT TOPICS, NOT AS HTTP. There is no endpoint to
          scrape and no setting that creates one -- `$SYS/broker/#` is the entire interface. So
          this container is an MQTT CLIENT that subscribes to those topics and re-serves them in
          Prometheus format. That is why it needs broker credentials at all, which no other
          exporter in this chart does.

          IT CONNECTS OVER PLAINTEXT 1883 ON LOOPBACK even when MQTTS is enabled. Sharing the pod's
          network namespace, the traffic never leaves the pod, so there is nothing for TLS to
          protect here -- and pointing it at 8883 would make it verify a certificate whose SANs
          name the Service, not `127.0.0.1`, for no gain. 1883 is never removed from the broker's
          own listeners (see mosquitto.conf), so this arm is always available.

          THE METRICS ARE PREFIXED `broker_`, NOT `mosquitto_`. Alerts written against the latter
          match nothing, silently.
          =========================================================================================
        */}}
        - name: metrics
          image: "{{ .Values.mosquitto.metrics.image.repository }}:{{ .Values.mosquitto.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.metrics.image.pullPolicy }}
          env:
            - name: BROKER_ENDPOINT
              value: tcp://127.0.0.1:1883
            {{- /* THE MONITORING PRINCIPAL. `$SYS/#` is precisely what this exporter reads and the
                   only thing that account can reach -- it cannot publish anywhere, which is the
                   right authority for something whose whole job is to observe. */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_MONITOR_USER") | nindent 12 }}
            {{- /* MQTT_PASS, not MQTT_PASSWORD: this exporter's own variable name. Reusing the
                   block the other containers share would leave it unauthenticated against a broker
                   running allow_anonymous false, and it would report that as a connection failure
                   rather than as a credential one. */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASS" "secretName" $secretName "key" "MQTT_MONITOR_PASSWORD") | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.mosquitto.metrics.port }}
              protocol: TCP
          readinessProbe:
            # A REAL SCRAPE, not a TCP check. The exporter binds its HTTP port before it has
            # connected to the broker, so a tcpSocket probe passes while it is serving nothing --
            # and an exporter serving nothing is exactly as invisible as no exporter at all.
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mosquitto.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ printf "%s-mosquitto-policy" $fullname }}
        - name: passwd-src
          secret:
            secretName: {{ .Values.mosquitto.credentials.secretName }}
            optional: true
        {{- if .Values.gatewayCredential.enabled }}
        {{/*
          `items` WITH AN EXPLICIT PATH, not a bare configMap mount. The service does
          `import ... from './lib/mosquitto-credentials.mjs'`, and a ConfigMap key cannot contain a
          slash -- so the library is stored under a flat key and projected back into `lib/` here.
          Mounted flat instead, the import resolves to a file that is not there and the container
          crash-loops on ERR_MODULE_NOT_FOUND naming a path that exists in the repository.
        */}}
        - name: scripts
          configMap:
            name: {{ printf "%s-gateway-credential-scripts" $fullname }}
            items:
              - key: gateway-credential-service.mjs
                path: gateway-credential-service.mjs
              - key: mosquitto-credentials.mjs
                path: lib/mosquitto-credentials.mjs
        {{/*
          THE TOKEN IS PROJECTED, NOT AUTOMOUNTED, so it exists in one container instead of all
          four. `automountServiceAccountToken: false` on the pod turns the default off; this volume
          is mounted only by the gateway-credential container above.

          A PROJECTED TOKEN IS ALSO SHORT-LIVED AND ROTATED IN PLACE by the kubelet, unlike the
          legacy Secret-backed kind. That is why the service re-reads it from disk on every API call
          rather than caching it at boot -- a cached value expires while the process keeps running,
          and every write then fails 401 hours after a healthy start.
        */}}
        - name: credential-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if $tls.enabled }}
        # NOT optional. A missing certificate Secret must hold the pod in ContainerCreating with
        # `secret "mosquitto-tls" not found` on the pod's events -- which names the cause exactly.
        # Marked optional, the volume would mount empty, the initContainer's guard would fire and the
        # pod would CrashLoopBackOff instead, moving the diagnosis one layer further from the fact.
        #
        # 0440 with fsGroup 1883: the broker reads the key as group, and it is not world-readable.
        # A Secret projection is 0644 by default, which is a private key readable by anything that
        # gets into the container.
        - name: certs
          secret:
            secretName: {{ $tls.secretName }}
            defaultMode: 0440
        {{- end }}
        # Assembled at start by the initContainer, mutated in place by the sidecar. Nothing here
        # needs to survive a restart: the policy comes from the ConfigMap and the credentials from
        # the Secret, both of which are the actual sources of truth.
        - name: config
          emptyDir: {}
        # Mosquitto's own persistence directory. An emptyDir deliberately: `persistence` is not
        # enabled in mosquitto.conf, so this holds nothing across a restart anyway, and giving it a
        # PVC would pin the broker to one node for no benefit. Retained queues for offline
        # subscribers are not part of this stack's design -- Sparkplug rebirths instead.
        - name: data
          emptyDir: {}
{{- end }}
