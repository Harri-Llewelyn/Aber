{{- if .Values.mosquitto.enabled }}
{{- $component := "mosquitto" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $conf := .Files.Get "files/mosquitto/mosquitto.conf" -}}
{{- $roles := .Files.Get "files/mosquitto/dynsec-roles.json" -}}
{{- $tlsConf := .Files.Get "files/mosquitto/mosquitto-tls.conf" -}}
{{- $init := .Files.Get "files/gateway-credential/mosquitto-dynsec-init.mjs" -}}
{{- $service := .Files.Get "files/gateway-credential/gateway-credential-service.mjs" -}}
{{- $libCredentials := .Files.Get "files/gateway-credential-lib/mosquitto-credentials.mjs" -}}
{{- $libDynsec := .Files.Get "files/gateway-credential-lib/mosquitto-dynsec.mjs" -}}
{{- $libControl := .Files.Get "files/gateway-credential-lib/mosquitto-control.mjs" -}}
{{- $tls := .Values.mosquitto.tls -}}
{{- /* True once no client outside this pod dials 1883: every in-cluster client is on 8883 and the
     external Service no longer publishes it. The listener then binds to loopback, for the two
     sidecars that share the pod's network namespace, and the in-cluster Service drops the port. */ -}}
{{- $plaintextLoopback := and $tls.enabled $tls.internalClients (or (not .Values.mosquitto.external.enabled) (not .Values.mosquitto.external.plaintext)) -}}
{{- $dataClaim := .Values.mosquitto.persistence.existingClaim | default (printf "%s-mosquitto-data" $fullname) -}}
{{- if and $tls.enabled (not $tlsConf) }}
{{- fail "\n\nacs-cymru: mosquitto.tls.enabled is set but files/mosquitto/mosquitto-tls.conf is missing.\n\nMirror it with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render rather than silently omitting the listener: the Service would publish 8883, the\nNetworkPolicy would allow it, the certificate would be issued -- and nothing would be listening on\nit. Every gateway would fail to connect against a stack that reports entirely healthy.\n" }}
{{- end }}
{{- if or (not $conf) (not $roles) (not $init) (not $service) (not $libCredentials) (not $libDynsec) (not $libControl) }}
{{- fail "\n\nacs-cymru: one of files/mosquitto/{mosquitto.conf,dynsec-roles.json},\nfiles/gateway-credential/{mosquitto-dynsec-init.mjs,gateway-credential-service.mjs} or\nfiles/gateway-credential-lib/{mosquitto-credentials,mosquitto-dynsec,mosquitto-control}.mjs is missing.\n\nMirror them with:  node scripts/sync-helm-chart-files.mjs\n\nFailing the render is deliberate. Without mosquitto.conf the broker falls back to its BUILT-IN\nDEFAULTS -- which on 2.x means listening on loopback only, so every gateway simply cannot connect;\nwithout the roles the reconcile has no policy to write and the plugin admits nobody; and without\nthe scripts the initContainer has nothing to run.\n" }}
{{- end }}
---
{{/*
Broker policy: repository-managed and read-only; the initContainer assembles the copy the broker reads.

mosquitto.conf declares `allow_anonymous` and the Dynamic Security `plugin` GLOBALLY rather than
per-listener, and that is what guarantees the TCP (1883), WebSocket (9001) and TLS (8883) listeners
authenticate and authorise identically. dynsec-roles.json is the policy the plugin enforces; the
reconcile below writes it into the plugin's document on every start.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-mosquitto-policy" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  mosquitto.conf: |
{{ $conf | indent 4 }}
  dynsec-roles.json: |
{{ $roles | indent 4 }}
  {{- if $tls.enabled }}
  # Appended to mosquitto.conf by the assemble-config initContainer. Carried as a separate key so
  # `kubectl get cm -o yaml` shows the base policy unchanged and the TLS addendum as its own object,
  # visible as one file rather than merged into a blob.
  mosquitto-tls.conf: |
{{ $tlsConf | indent 4 }}
  {{- end }}
{{- if $tls.enabled }}
---
{{/*
=================================================================================================
The broker's server certificate.

WHY A cert-manager Certificate AND NOT A HAND-MADE SECRET: renewal. One made by hand expires
mid-shift 90 days later, and the failure is every gateway refusing to connect at once, with an
expiry the broker does not log -- the fleet simply goes quiet. cert-manager renews at renewBefore
and the reload sidecar SIGHUPs the broker, which re-reads the certificate without dropping
connected gateways (verified on eclipse-mosquitto 2.0.20, carried to the 2.0.22 pin unre-verified).

THE SAN LIST IS THE WHOLE DIFFICULTY, and it is asymmetric in a way that hides the mistake:

  - IN-CLUSTER clients dial `mosquitto`, which is in the list below, so they verify the moment this
    is enabled. That is where you will test.
  - GATEWAYS dial an IP ADDRESS, because there is rarely plant DNS for the broker. If it is not in
    ipAddresses below, every gateway fails verification while the in-cluster clients are happy --
    the stack reports healthy, the simulator keeps producing, and the fleet is off.

`external.loadBalancerIP` is included automatically when set. Everything else the fleet dials goes
in `tls.extraIpSans` / `tls.extraDnsSans`.
=================================================================================================
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-mosquitto-tls" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  secretName: {{ $tls.secretName }}
  duration: {{ $tls.duration }}
  renewBefore: {{ $tls.renewBefore }}
  # A SERVER certificate. `clientAuth` is deliberately absent: the listener runs
  # `require_certificate false`, so the broker proves its identity and the client proves its own with
  # the same password it uses on 1883. See mosquitto-tls.conf for why half a mutual-TLS design is
  # worse than none.
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    # RSA to match the root, and for the same fleet-compatibility reason -- see
    # deploy/k8s/internal-ca.yaml. 2048 for a 90-day leaf.
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always
  commonName: mosquitto
  dnsNames:
    # The in-cluster name, which every in-cluster client dials.
    - mosquitto
    - {{ printf "mosquitto.%s" .Release.Namespace }}
    - {{ printf "mosquitto.%s.svc" .Release.Namespace }}
    - {{ printf "mosquitto.%s.svc.cluster.local" .Release.Namespace }}
    {{- if .Values.mosquitto.external.enabled }}
    - mosquitto-external
    - {{ printf "mosquitto-external.%s.svc.cluster.local" .Release.Namespace }}
    {{- end }}
    {{- with .Values.global.publicBaseDomain }}
    # The name the WebSocket route is published under, so a browser-side MQTT client verifies too.
    - {{ printf "mqtt.%s" . }}
    {{- end }}
    {{- range $tls.extraDnsSans }}
    - {{ . | quote }}
    {{- end }}
  {{- $ips := concat (ternary (list .Values.mosquitto.external.loadBalancerIP) (list) (ne (toString .Values.mosquitto.external.loadBalancerIP) "")) ($tls.extraIpSans | default list) }}
  {{- if $ips }}
  ipAddresses:
    {{- range $ips }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  issuerRef:
    name: {{ $tls.clusterIssuer }}
    kind: {{ $tls.issuerKind }}
    group: cert-manager.io
{{- end }}
---
{{/*
The Secret the credential service patches: the playback delivery file (0078), which playback reads
through its own projection, and a `password_file` key from a release predating the Dynamic Security
plugin, imported into the plugin's document on first start.

CREATED EMPTY AND NEVER OVERWRITTEN. `helm upgrade` re-renders this document, so preserving the
current contents through the `lookup` below is what stops it being reset -- `resource-policy: keep`
governs deletion, not update.

Gateway accounts are NOT here: they live in the plugin's document on the data PVC, written by the
broker itself.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.mosquitto.credentials.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mosquitto.credentials.secretName }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password_file: |
{{ if $existing }}{{ (index $existing.data "password_file" | default "" | b64dec) | indent 4 }}{{ end }}
  playback_credentials.json: |
{{ if $existing }}{{ (index $existing.data "playback_credentials.json" | default "" | b64dec) | indent 4 }}{{ end }}
---
{{/*
The plugin's document. A PVC, and the only one the broker has: the document is every issued gateway
account, rewritten by the plugin on each change, and there is no other copy. `resource-policy: keep`
so that uninstalling the release does not disconnect the fleet; an operator deletes the claim by
hand when that is what they mean. RWO is enough: the Deployment's strategy is Recreate.
*/}}
{{- if not .Values.mosquitto.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $dataClaim }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.mosquitto.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mosquitto.persistence.size }}
---
{{- end }}
{{/*
The reconcile's and the credential service's code, mirrored from scripts/ by
scripts/sync-helm-chart-files.mjs. Mounted rather than baked into the image, unlike node-red-init and
storage-init are: the image supplies the runtime (node, mosquitto_passwd, mosquitto_rr) and the
chart supplies the code, so a script change needs no image rebuild.

Unconditional, because the initContainer runs the reconcile whether or not the credential service
is enabled. The `lib/` subdirectory is flattened into keys (a ConfigMap key cannot hold a slash)
and projected back into place by the volume's `items`, below.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-mosquitto-scripts" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  mosquitto-dynsec-init.mjs: |
{{ $init | indent 4 }}
  gateway-credential-service.mjs: |
{{ $service | indent 4 }}
  mosquitto-credentials.mjs: |
{{ $libCredentials | indent 4 }}
  mosquitto-dynsec.mjs: |
{{ $libDynsec | indent 4 }}
  mosquitto-control.mjs: |
{{ $libControl | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  # THE NAME IS `mosquitto`: every in-cluster client addresses the broker by it.
  name: mosquitto
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    {{- if not $plaintextLoopback }}
    # Published while any client outside the broker's pod still dials it: the in-cluster clients
    # until `tls.internalClients`, the fleet until `external.plaintext` is withdrawn. With both
    # gone the listener is on loopback and the port is dropped here, so `kubectl get svc` states
    # what is reachable.
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    {{- end }}
    - name: mqtt-ws
      port: 9001
      targetPort: mqtt-ws
      protocol: TCP
    {{- if $tls.enabled }}
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
    {{- end }}
    {{- if .Values.mosquitto.metrics.enabled }}
    # ON THE IN-CLUSTER SERVICE ONLY -- deliberately never added to mosquitto-external below.
    # These statistics describe the whole fleet's connection and throughput behaviour, and that
    # Service is reachable from the plant network.
    - name: metrics
      port: {{ .Values.mosquitto.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- if .Values.mosquitto.external.enabled }}
---
{{/*
External exposure for shopfloor gateways.

A SECOND Service, not a change of type on the one above: the in-cluster name must stay a plain
ClusterIP so `mosquitto` keeps resolving for in-cluster clients, and mixing the two would tie
service discovery to an external IP allocation.

MQTT IS RAW TCP AND CANNOT RIDE AN HTTP INGRESS. On k3s the built-in ServiceLB satisfies
`LoadBalancer` with no MetalLB by binding the port on nodes that have it free -- so 1883 must BE
free: anything else holding it leaves this Service at <pending> with nothing naming the conflict.

The WebSocket listener (9001) is exposed here for parity, but it can also ride the Ingress, which
is the better place for it once TLS terminates there.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-external
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    acs-cymru.io/note: >-
      {{ if $tls.enabled -}}
      Shopfloor gateways connect here. 8883 is TLS; 1883 is plaintext and is
      {{ if .Values.mosquitto.external.plaintext }}still published for migration -- set
      mosquitto.external.plaintext=false once every gateway is on 8883{{ else }}not published{{ end }}.
      {{- else -}}
      Shopfloor gateways connect here. Plaintext with password auth -- set mosquitto.tls.enabled
      before this is reachable from anything but a trusted network.
      {{- end }}
spec:
  type: {{ .Values.mosquitto.external.type }}
  {{- with .Values.mosquitto.external.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    {{- if .Values.mosquitto.external.plaintext }}
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
      {{- if and (eq .Values.mosquitto.external.type "NodePort") .Values.mosquitto.external.nodePort }}
      nodePort: {{ .Values.mosquitto.external.nodePort }}
      {{- end }}
    {{- end }}
    {{- if $tls.enabled }}
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
      {{- if and (eq .Values.mosquitto.external.type "NodePort") .Values.mosquitto.external.tlsNodePort }}
      nodePort: {{ .Values.mosquitto.external.tlsNodePort }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.mosquitto.replicas }}
  strategy:
    # Recreate. Two brokers behind one Service split the fleet in half, each seeing only the
    # gateways that landed on it -- and Sparkplug state (birth/death, sequence numbers) is
    # per-connection, so the halves do not reconcile.
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the broker when the policy or the scripts change. The roles are applied by the
        # reconcile at start, a listener change needs a restart, and this makes a policy edit
        # visible in rollout history.
        #
        # The TLS stanza is in the checksum for exactly that reason: turning `tls.enabled` on ADDS A
        # LISTENER, which SIGHUP cannot do. Without it here, enabling TLS would update the ConfigMap,
        # leave the running broker with no 8883, and present as "the port is published but refuses
        # connections" -- with the ConfigMap showing the listener plainly declared. The loopback
        # rebind of 1883 is a listener change too, so its flag is in the checksum for the same reason.
        checksum/policy: {{ printf "%s%s%s%s" $conf $roles (ternary $tlsConf "" $tls.enabled) (ternary "loopback" "" $plaintextLoopback) | sha256sum }}
        checksum/scripts: {{ printf "%s%s%s%s%s" $init $service $libCredentials $libDynsec $libControl | sha256sum }}
        {{- if .Values.mosquitto.metrics.enabled }}
        # The exporter sidecar; the broker itself has no HTTP surface.
        {{- include "acs-cymru.scrapeAnnotations" (dict "port" .Values.mosquitto.metrics.port "path" "/metrics") | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $tls.enabled }}
      # Lets the certificate-reload sidecar signal the broker process. Without it the sidecar sees
      # only its own PID namespace and `kill -HUP` has nothing to address. Nothing else in the pod
      # needs it: credentials reach the running broker through the plugin, not a signal.
      shareProcessNamespace: true
      {{- end }}
      {{- if .Values.gatewayCredential.enabled }}
      serviceAccountName: {{ printf "%s-gateway-credential" $fullname }}
      {{/*
        OFF AT THE POD LEVEL, ON FOR ONE CONTAINER. The default mounts the ServiceAccount token into
        EVERY container, which would give the broker and the metrics exporter a token that can patch
        the playback delivery Secret -- authority neither has any use for, in containers that are
        the two most exposed things in this pod (one terminates every gateway connection, the other
        serves HTTP). The token is projected into the gateway-credential container alone; see
        `volumes`.
      */}}
      automountServiceAccountToken: false
      {{- end }}
      # M5. eclipse-mosquitto runs as uid/gid 1883.
      securityContext:
        {{- toYaml .Values.mosquitto.podSecurityContext | nindent 8 }}
      initContainers:
        {{/*
          Assembles /mosquitto/config as a WRITABLE emptyDir, then writes the plugin's document onto
          the data PVC with the reconcile in scripts/mosquitto-dynsec-init.mjs: roles from the
          ConfigMap, platform principals and the plugin's admin from the Secret, every existing
          gateway account kept as it is.

          WHY NOT MOUNT mosquitto.conf DIRECTLY: the TLS stanza is appended to it when certificates
          exist, and a ConfigMap mount is read-only.

          THE CREDENTIAL SERVICE'S IMAGE, not the broker's: the reconcile needs node beside the
          broker's own mosquitto_passwd, and that image is built FROM the broker's for this. Root,
          because the document is written owned by uid 1883 at mode 0600; the plugin warns on
          anything wider.
        */}}
        - name: assemble-config
          image: {{ include "acs-cymru.image" (dict "ctx" . "image" .Values.gatewayCredential.image) | quote }}
          imagePullPolicy: {{ .Values.gatewayCredential.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          env:
            {{- include "acs-cymru.mqttPrincipalEnv" . | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_DYNSEC_ADMIN_USER" "secretName" $secretName "key" "MQTT_DYNSEC_ADMIN_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_DYNSEC_ADMIN_PASSWORD" "secretName" $secretName "key" "MQTT_DYNSEC_ADMIN_PASSWORD") | nindent 12 }}
            - name: DYNSEC_POLICY_FILE
              value: /policy/dynsec-roles.json
            {{/*
              The primary host's write grant is derived from this rather than written into
              dynsec-roles.json, because the id belongs to the site. THE SAME HELPER THE INGESTION
              DAEMON'S ENV USES: a broker granted one host id while the daemon publishes another
              would deny every STATE publish, and QoS 1 or not, nothing on the daemon's side stops
              for it.
            */}}
            - name: PRIMARY_HOST_ID
              value: {{ include "acs-cymru.primaryHostId" . | quote }}
            {{/*
              The Directory grant is derived from the prefix for the same reason: the subtree
              belongs to the site's group, which this file does not name. THE SAME HELPER THE
              INGESTION DAEMON'S ENV USES, so a broker granted one prefix while the daemon
              publishes another cannot happen -- and at QoS 0 that mismatch would be silent.
            */}}
            - name: DIRECTORY_MQTT_TOPIC_PREFIX
              value: {{ include "acs-cymru.directoryTopicPrefix" . | quote }}
            - name: LEGACY_PASSWORD_FILE
              value: /passwd-src/password_file
            # The validator is a fixture: a production install leaves its password empty and gets
            # no account. The monitor is always required by the script itself.
            - name: DYNSEC_REQUIRED_PRINCIPALS
              value: "INGESTION I3X"
          command:
            - /bin/sh
            - -e
            - -c
            - |
              cp /policy/mosquitto.conf /mosquitto/config/mosquitto.conf
              {{- if $tls.enabled }}

              # The MQTTS listener, APPENDED -- see mosquitto-tls.conf for why it is not simply part
              # of mosquitto.conf. Refuse to start rather than append a listener whose certificate is
              # not there yet: mosquitto would exit 1 on three lines of OpenSSL "system library"
              # output that name neither the file nor the option, and the pod would CrashLoopBackOff
              # with a message pointing nowhere near a pending cert-manager Certificate.
              if [ ! -s /mosquitto/certs/tls.crt ] || [ ! -s /mosquitto/certs/tls.key ]; then
                echo 'MQTTS is enabled but /mosquitto/certs/tls.crt is missing or empty.' >&2
                echo 'The certificate has not been issued yet. Check it:' >&2
                echo '  kubectl describe certificate {{ printf "%s-mosquitto-tls" $fullname }}' >&2
                echo 'A ClusterIssuer of kind CA resolves its key pair in CERT-MANAGERs namespace,' >&2
                echo 'not this one -- that is the usual cause. See deploy/k8s/internal-ca.yaml.' >&2
                exit 1
              fi
              cat /policy/mosquitto-tls.conf >> /mosquitto/config/mosquitto.conf
              # No openssl in eclipse-mosquitto, so the certificate cannot be described here --
              # `kubectl describe certificate` is where its SANs and expiry live. This records only
              # that the listener was added and that the files were present when it was.
              echo "Appended the MQTTS listener (8883); certificate present at /mosquitto/certs/tls.crt."
              {{- end }}
              {{- if $plaintextLoopback }}

              # No client outside this pod dials 1883 any more: every in-cluster client is on 8883
              # and the external Service no longer publishes it. Bind it to loopback for the two
              # sidecars that share the pod's network namespace. Refuse to start if the line was
              # not found: a listener silently left on 0.0.0.0 is the state this exists to end.
              sed -i 's/^listener 1883 0\.0\.0\.0$/listener 1883 127.0.0.1/' /mosquitto/config/mosquitto.conf
              if ! grep -q '^listener 1883 127\.0\.0\.1$' /mosquitto/config/mosquitto.conf; then
                echo 'mosquitto.conf has no `listener 1883 0.0.0.0` line to bind to loopback.' >&2
                exit 1
              fi
              echo "Bound the plaintext listener (1883) to loopback: no client outside this pod dials it."
              {{- end }}
              echo "Assembled broker config."

              # The plugin's document. An empty legacy key is not a file to import.
              if [ -f /passwd-src/password_file ] && [ ! -s /passwd-src/password_file ]; then
                unset LEGACY_PASSWORD_FILE
              fi
              exec node /scripts/mosquitto-dynsec-init.mjs
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: passwd-src
              mountPath: /passwd-src
              readOnly: true
            - name: config
              mountPath: /mosquitto/config
            - name: data
              mountPath: /mosquitto/data
            {{- if $tls.enabled }}
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
      containers:
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          args: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            {{- if not $plaintextLoopback }}
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            {{- end }}
            - name: mqtt-ws
              containerPort: 9001
              protocol: TCP
            {{- if $tls.enabled }}
            - name: mqtts
              containerPort: 8883
              protocol: TCP
            {{- end }}
          env:
            {{- /*
              THE MONITORING PRINCIPAL, which can read $SYS and publish nothing anywhere. The
              probes below are the only reason the broker container needs a credential at all, and
              giving them the ingestion or simulator account would leave a credential able to write
              Sparkplug topics sitting in the broker's own environment for the sake of a health
              check. Read-only is exactly the authority a probe needs.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_MONITOR_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASSWORD" "secretName" $secretName "key" "MQTT_MONITOR_PASSWORD") | nindent 12 }}
          # A REAL SUBSCRIBE, not a TCP check. The broker runs `allow_anonymous false`, so a
          # tcpSocket probe passes while every client is being refused with CONNACK 5 -- which is
          # precisely the failure mode this stack has hit before (a stale credential file, or a
          # missing one). Subscribing to $SYS proves the listener AND the plugin's document together.
          #
          # $SYS is deliberate: it needs no application topic to exist, so this works on an idle
          # broker with no gateways yet.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -V mqttv5 -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -V mqttv5 -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mosquitto_sub -V mqttv5 -u "$MQTT_USER" -P "$MQTT_PASSWORD" -t '$SYS/broker/version' -C 1 -W 3
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: data
              mountPath: /mosquitto/data
            {{- if $tls.enabled }}
            # Read straight from the projected Secret, NOT copied into the assembled config dir.
            # That is what makes renewal work: cert-manager rewrites the Secret, the kubelet
            # refreshes this mount, and the sidecar's SIGHUP makes the broker re-read these exact
            # paths. A copy taken at start would freeze the certificate for the pod's lifetime and
            # the broker would keep serving an expired one until something happened to restart it.
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
        {{- if $tls.enabled }}
        {{/*
          =========================================================================================
          The certificate reload sidecar.

          cert-manager renews the leaf and rewrites the Secret in place. Nothing restarts the
          broker -- a Deployment's pod template has not changed, so there is no rollout -- and
          mosquitto read the certificate once at start. Without this it serves the OLD one until it
          expires, and then every gateway fails verification at once, weeks after the renewal that
          was supposed to prevent it, with cert-manager reporting the certificate valid.

          SIGHUP is enough: verified on eclipse-mosquitto 2.0.20 (not re-verified on the 2.0.22
          pin, same 2.0.x line) that swapping the files and sending SIGHUP changes the certificate
          served on an established listener, with no restart and no disconnection. That is why this
          is a sidecar rather than a scheduled rollout restart, and the only reason the pod shares
          a PID namespace.
          =========================================================================================
        */}}
        - name: certificate-reload
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          securityContext:
            # Root, to signal a process running as 1883.
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              # Content, not mtime: a projected volume's timestamps move on every kubelet sync
              # whether or not the data changed, so mtime would HUP the broker every 60s forever.
              lastcert=""
              if [ -s /mosquitto/certs/tls.crt ]; then
                lastcert=$(md5sum < /mosquitto/certs/tls.crt)
              fi
              while :; do
                sleep {{ $tls.watchIntervalSeconds }}
                nowcert=""
                if [ -s /mosquitto/certs/tls.crt ]; then
                  nowcert=$(md5sum < /mosquitto/certs/tls.crt)
                fi
                [ "$nowcert" = "$lastcert" ] && continue
                lastcert="$nowcert"
                echo "broker certificate changed (renewal); reloading"
                # Resolved by name because shareProcessNamespace makes the broker visible here,
                # but its PID is not 1 (the pause container is).
                pid=$(pidof mosquitto 2>/dev/null || true)
                if [ -n "$pid" ]; then
                  kill -HUP $pid && echo "sent SIGHUP to mosquitto (pid $pid) for the new certificate"
                else
                  echo "mosquitto process not found; it will read the certificate when it starts" >&2
                fi
              done
          volumeMounts:
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        {{- end }}
        {{- if .Values.gatewayCredential.enabled }}
        {{/*
          =========================================================================================
          The credential service.

          Issues a gateway's account, disables one, lists what the broker holds -- by sending the
          Dynamic Security plugin's commands to the broker over MQTT as the plugin's admin. The
          broker applies each change to itself and rewrites its own document, so nothing here is
          signalled, shared or copied.

          A SIDECAR IN THIS POD for the shape rather than a mechanism: it dials the broker on
          loopback, the CA it returns to an enrolling appliance is the same projected Secret the
          broker serves from, and the NetworkPolicy's one edge into credential issuance stays a
          port on the broker's pods.

          IT HOLDS A SERVICEACCOUNT TOKEN, AND ONLY THIS CONTAINER DOES, for one purpose: the
          playback delivery file (0078) is a key on the credential Secret, patched through the API
          and read by playback through its own projection. The pod sets
          `automountServiceAccountToken: false`, the token is projected into this container alone,
          and the Role behind it permits `get` and `patch` on ONE Secret, by name.
          =========================================================================================
        */}}
        - name: gateway-credential
          image: {{ include "acs-cymru.image" (dict "ctx" . "image" .Values.gatewayCredential.image) | quote }}
          imagePullPolicy: {{ .Values.gatewayCredential.image.pullPolicy }}
          securityContext:
            # The broker's uid: the CA is projected 0440 to group 1883, and the service writes
            # nothing on this target. The image's default user is root and is not needed.
            runAsUser: 1883
            runAsGroup: 1883
          command: ["node", "/scripts/gateway-credential-service.mjs"]
          env:
            - name: MQTT_CREDENTIAL_SERVICE_PORT
              value: {{ .Values.gatewayCredential.port | quote }}
            - name: MOSQUITTO_SECRET
              value: {{ .Values.mosquitto.credentials.secretName | quote }}
            - name: ACS_CYMRU_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # Loopback: the broker is in this pod, and 1883 always listens there whatever the
            # Services publish.
            - name: MQTT_HOST
              value: "127.0.0.1"
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_CREDENTIAL_SERVICE_TOKEN" "secretName" $secretName "key" "MQTT_CREDENTIAL_SERVICE_TOKEN") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_DYNSEC_ADMIN_USER" "secretName" $secretName "key" "MQTT_DYNSEC_ADMIN_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_DYNSEC_ADMIN_PASSWORD" "secretName" $secretName "key" "MQTT_DYNSEC_ADMIN_PASSWORD") | nindent 12 }}
          ports:
            - name: credential
              containerPort: {{ .Values.gatewayCredential.port }}
              protocol: TCP
          readinessProbe:
            # /healthz reports liveness and the configured target, never which accounts exist. It
            # is the one unauthenticated route.
            httpGet:
              path: /healthz
              port: credential
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            {{- if $tls.enabled }}
            # The CA only, returned to an enrolling appliance so it can verify the broker. Read
            # from the SAME projected Secret the broker serves from, so the two cannot drift --
            # which is the whole reason this is read here rather than configured into an edge
            # function. `tls.key` is in this Secret too; nothing in this container reads it.
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            {{- end }}
            - name: credential-sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.gatewayCredential.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.mosquitto.metrics.enabled }}
        {{/*
          =========================================================================================
          The metrics exporter.

          MOSQUITTO PUBLISHES STATISTICS AS MQTT TOPICS, NOT AS HTTP: `$SYS/broker/#` is the entire
          interface, and no setting creates an endpoint. This container is an MQTT CLIENT that
          subscribes and re-serves them in Prometheus format, which is why it needs broker
          credentials at all.

          IT CONNECTS OVER PLAINTEXT 1883 ON LOOPBACK even when MQTTS is enabled. Sharing the pod's
          network namespace, the traffic never leaves the pod, and pointing it at 8883 would make
          it verify a certificate whose SANs name the Service, not `127.0.0.1`. 1883 always listens
          on loopback whatever the Services publish (mosquitto.conf), so this arm is always there.

          THE METRICS ARE PREFIXED `broker_`, NOT `mosquitto_`. Alerts against the latter match
          nothing, silently.
          =========================================================================================
        */}}
        - name: metrics
          image: "{{ .Values.mosquitto.metrics.image.repository }}:{{ .Values.mosquitto.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.metrics.image.pullPolicy }}
          env:
            - name: BROKER_ENDPOINT
              value: tcp://127.0.0.1:1883
            {{- /* THE MONITORING PRINCIPAL. `$SYS/#` is precisely what this exporter reads and the
                   only thing that account can reach -- it cannot publish anywhere, which is the
                   right authority for something whose whole job is to observe. */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_MONITOR_USER") | nindent 12 }}
            {{- /* MQTT_PASS, not MQTT_PASSWORD: this exporter's own variable name. Reusing the
                   block the other containers share would leave it unauthenticated against a broker
                   running allow_anonymous false, and it would report that as a connection failure
                   rather than as a credential one. */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASS" "secretName" $secretName "key" "MQTT_MONITOR_PASSWORD") | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.mosquitto.metrics.port }}
              protocol: TCP
          readinessProbe:
            # A REAL SCRAPE, not a TCP check. The exporter binds its HTTP port before it has
            # connected to the broker, so a tcpSocket probe passes while it is serving nothing --
            # and an exporter serving nothing is exactly as invisible as no exporter at all.
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mosquitto.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ printf "%s-mosquitto-policy" $fullname }}
        # A release from before the plugin left a `password_file` here; the initContainer imports
        # it once. Optional, because a fresh install has no such Secret until the first delivery.
        - name: passwd-src
          secret:
            secretName: {{ .Values.mosquitto.credentials.secretName }}
            optional: true
        {{/*
          `items` WITH AN EXPLICIT PATH, not a bare configMap mount. The scripts do
          `import ... from './lib/<name>.mjs'`, and a ConfigMap key cannot contain a slash -- so
          each library is stored under a flat key and projected back into `lib/` here. Mounted
          flat instead, the import resolves to a file that is not there and the container
          crash-loops on ERR_MODULE_NOT_FOUND naming a path that exists in the repository.
        */}}
        - name: scripts
          configMap:
            name: {{ printf "%s-mosquitto-scripts" $fullname }}
            items:
              - key: mosquitto-dynsec-init.mjs
                path: mosquitto-dynsec-init.mjs
              - key: gateway-credential-service.mjs
                path: gateway-credential-service.mjs
              - key: mosquitto-credentials.mjs
                path: lib/mosquitto-credentials.mjs
              - key: mosquitto-dynsec.mjs
                path: lib/mosquitto-dynsec.mjs
              - key: mosquitto-control.mjs
                path: lib/mosquitto-control.mjs
        {{- if .Values.gatewayCredential.enabled }}
        {{/*
          THE TOKEN IS PROJECTED, NOT AUTOMOUNTED, so it exists in one container instead of all
          four. `automountServiceAccountToken: false` on the pod turns the default off; this volume
          is mounted only by the gateway-credential container above. 0440 with fsGroup 1883, so the
          container, which runs as 1883, reads it as group.

          A PROJECTED TOKEN IS ALSO SHORT-LIVED AND ROTATED IN PLACE by the kubelet, unlike the
          legacy Secret-backed kind. That is why the service re-reads it from disk on every API call
          rather than caching it at boot -- a cached value expires while the process keeps running,
          and every write then fails 401 hours after a healthy start.
        */}}
        - name: credential-sa-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if $tls.enabled }}
        # NOT optional. A missing certificate Secret must hold the pod in ContainerCreating with
        # `secret "mosquitto-tls" not found` on the pod's events -- which names the cause exactly.
        # Marked optional, the volume would mount empty, the initContainer's guard would fire and the
        # pod would CrashLoopBackOff instead, moving the diagnosis one layer further from the fact.
        #
        # 0440 with fsGroup 1883: the broker reads the key as group, and it is not world-readable.
        # A Secret projection is 0644 by default, which is a private key readable by anything that
        # gets into the container.
        - name: certs
          secret:
            secretName: {{ $tls.secretName }}
            defaultMode: 0440
        {{- end }}
        # Assembled at start by the initContainer. Nothing here needs to survive a restart: the
        # policy comes from the ConfigMap, which is the actual source of truth.
        - name: config
          emptyDir: {}
        # The plugin's document lives here, and it is the only copy of every issued gateway
        # account, so this is the one volume the broker keeps. Mosquitto's own `persistence` stays
        # off in mosquitto.conf: retained queues for offline subscribers are not part of this
        # stack's design -- Sparkplug rebirths instead.
        - name: data
          persistentVolumeClaim:
            claimName: {{ $dataClaim }}
{{- end }}
