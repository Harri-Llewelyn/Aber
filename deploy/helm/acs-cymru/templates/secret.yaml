{{- /*
The chart's Secret. Rendered ONLY when secrets.existingSecret is empty -- pointing at a
externally-managed Secret is how External Secrets / SOPS plugs in with no template
change, so this file must not be the only thing that can produce these keys.

KEY NAMES ARE THE ENVIRONMENT VARIABLE NAMES the containers expect, not camelCase values-file
names. That is deliberate: it means a Deployment can use `envFrom.secretRef` where it wants the
whole block, and an externally-managed Secret has one obvious contract to satisfy.

Values are placed in `stringData`, not `data`. Helm would otherwise need b64enc on every line,
and a mis-encoded value fails as an authentication error at runtime rather than at render.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "acs-cymru.fullname" .) }}
  labels:
    {{- include "acs-cymru.labels" . | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # --- Supabase: a matching SET, see values.yaml -------------------------------------------
  SUPABASE_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.anonKey | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.serviceRoleKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # --- TimescaleDB (separate database, separate credential) --------------------------------
  DB_PASSWORD: {{ .Values.secrets.timescalePassword | default .Values.secrets.postgresPassword | quote }}
  # The read-only role reporting tools connect as. NOT defaulted to DB_PASSWORD: falling back to
  # the superuser credential is precisely what this replaced, and a default that silently restored
  # it would be worse than the empty string, which fails loudly.
  BI_READER_PASSWORD: {{ .Values.secrets.biReaderPassword | quote }}

  # --- Realtime: lengths asserted by acs-cymru.validateRealtime ---------------------------
  REALTIME_DB_ENC_KEY: {{ .Values.secrets.realtimeDbEncKey | quote }}
  REALTIME_SECRET_KEY_BASE: {{ .Values.secrets.realtimeSecretKeyBase | quote }}

  PG_META_CRYPTO_KEY: {{ .Values.secrets.pgMetaCryptoKey | quote }}

  # --- MQTT: FIVE PRINCIPALS, NO SHARED ACCOUNT ---------------------------------------------
  # mosquitto.acl confines each to a different subtree and none of them can publish asset data
  # for an edge node other than itself. Each password is separate on purpose -- confinement is
  # worth nothing if one leaked credential opens all five.
  #
  # The USERNAMES are not free choices. The simulator's and the validator's must equal the
  # `sparkplug_id` of the gateway row they publish under (the ACL matches the topic's edge-node
  # segment against `%u`, and verify_gateway_binding() re-checks it), which is why both rows have
  # pinned UUIDs. acs-cymru.validateMqttPrincipals fails the render on a bad one.
  MQTT_INGESTION_USER: {{ .Values.secrets.mqttIngestionUser | quote }}
  MQTT_INGESTION_PASSWORD: {{ .Values.secrets.mqttIngestionPassword | quote }}
  MQTT_I3X_USER: {{ .Values.secrets.mqttI3xUser | quote }}
  MQTT_I3X_PASSWORD: {{ .Values.secrets.mqttI3xPassword | quote }}
  MQTT_SIMULATOR_USER: {{ .Values.secrets.mqttSimulatorUser | quote }}
  MQTT_SIMULATOR_PASSWORD: {{ .Values.secrets.mqttSimulatorPassword | quote }}
  MQTT_VALIDATOR_USER: {{ .Values.secrets.mqttValidatorUser | quote }}
  MQTT_VALIDATOR_PASSWORD: {{ .Values.secrets.mqttValidatorPassword | quote }}
  MQTT_MONITOR_USER: {{ .Values.secrets.mqttMonitorUser | quote }}
  MQTT_MONITOR_PASSWORD: {{ .Values.secrets.mqttMonitorPassword | quote }}

  # --- Grafana -----------------------------------------------------------------------------
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  GRAFANA_OAUTH_CLIENT_SECRET: {{ .Values.secrets.grafanaOAuthClientSecret | quote }}
  # The bearer secret Grafana's alert contact point presents to grafana-alert-webhook. Deliberately
  # NOT the service-role key: it authorises recording an alert and nothing else.
  GRAFANA_ALERT_WEBHOOK_SECRET: {{ .Values.secrets.grafanaAlertWebhookSecret | quote }}

  # --- Node-RED ----------------------------------------------------------------------------
  NODERED_CREDENTIAL_SECRET: {{ .Values.secrets.noderedCredentialSecret | quote }}
  NODERED_OAUTH_CLIENT_SECRET: {{ .Values.secrets.noderedOAuthClientSecret | quote }}
  # A SIGNING key for the per-event quarantine webhook token, deliberately NOT the admin token:
  # /hooks/quarantine is served by an `http in` node, so any flow author can read the headers.
  NODERED_WEBHOOK_JWT_SECRET: {{ .Values.secrets.noderedWebhookJwtSecret | quote }}
  # Break-glass only. Empty means the static-token path is shut, which is the default posture.
  NODERED_ADMIN_TOKEN: {{ .Values.secrets.noderedAdminToken | default "" | quote }}
{{- end }}
