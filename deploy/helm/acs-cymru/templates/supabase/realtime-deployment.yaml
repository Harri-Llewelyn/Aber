{{- if .Values.realtime.enabled }}
{{- $component := "realtime" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{/*
=================================================================================================
Realtime: the WAL change feed behind the `realtime-dev` Service.

FOUR CONTAINER REQUIREMENTS, each of which crash-loops or 403s the service, and none of which
names itself in the resulting error:

  1. RLIMIT_NOFILE must be set. The image's /app/run.sh runs `ulimit -n $RLIMIT_NOFILE` under
     `set -u`, so leaving it unset kills the container on "unbound variable" BEFORE the Elixir app
     starts -- there is no application log to read.
  2. The `_realtime` schema must pre-exist. An upstream Realtime migration, folded into 0001, creates it -- which
     is why this waits on db-init rather than merely on the database.
  3. The tenant is `realtime-dev`, and SEED_SELF_HOST IGNORES TENANT_NAME. Probing
     /api/tenants/realtime/health returns 404 against a perfectly healthy server.
  4. Kong must address it as `realtime-dev...`, which here is the Service NAME -- see
     realtime-service.yaml.

Two more that are equally load-bearing:
  * DB_USER is supabase_admin, NOT authenticator. Realtime needs REPLICATION privilege to create
    its logical slot and the scoped PostgREST role does not have it.
  * RLS_ENABLED is required, not optional. RLS is evaluated per change per subscriber, and
    digital_thread is restricted to privileged roles -- that has to hold over the socket exactly as
    it does over PostgREST.
=================================================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-realtime
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  # ALWAYS ONE. Realtime holds a logical replication slot, which is per-instance state; a second
  # node needs DNS_NODES clustering this stack does not configure. `replicas` is in values only so
  # it can be scaled to ZERO for debugging, never up.
  replicas: {{ .Values.realtime.replicas }}
  strategy:
    # Recreate, not RollingUpdate: two Realtime instances would contend for the same replication
    # slot, and the new one fails to acquire it while the old one is still terminating.
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          Waits for the `_realtime` SCHEMA, not just for the database. Realtime runs its own
          migrations against that schema on boot and fails outright if it does not exist -- and it
          is created by 0001, so this is really a wait on db-init having completed. Checking the
          schema rather than the Job keeps it honest: it tests the postcondition, not the actor.
        */}}
        - name: wait-for-realtime-schema
          image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
          env:
            {{- include "acs-cymru.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              deadline=$(( $(date +%s) + {{ .Values.initJobs.waitTimeout }} ))
              until psql -h {{ include "acs-cymru.supabaseDb.host" . }} -p {{ include "acs-cymru.supabaseDb.port" . }} \
                        -U supabase_admin -d postgres -tAc \
                        "SELECT 1 FROM information_schema.schemata WHERE schema_name = '_realtime'" \
                    2>/dev/null | grep -q 1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "timed out waiting for the _realtime schema (created by db-init via migration 0001)" >&2
                  exit 1
                fi
                echo "waiting for the _realtime schema ..."
                sleep 3
              done
              echo "_realtime schema exists"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: realtime
          image: "{{ .Values.realtime.image.repository }}:{{ .Values.realtime.image.tag }}"
          imagePullPolicy: {{ .Values.realtime.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.realtime.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.realtime.port | quote }}
            - name: DB_HOST
              value: {{ include "acs-cymru.supabaseDb.host" . | quote }}
            - name: DB_PORT
              value: {{ include "acs-cymru.supabaseDb.port" . | quote }}
            # supabase_admin, NOT authenticator: creating a logical replication slot needs
            # REPLICATION privilege, which the scoped PostgREST role does not have.
            - name: DB_USER
              value: supabase_admin
            {{- include "acs-cymru.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: DB_NAME
              value: postgres
            - name: DB_AFTER_CONNECT_QUERY
              value: "SET search_path TO _realtime"
            {{- if .Values.postgresTls.enabled }}
            # Realtime's own pool takes the CA as a file and verifies the server against it
            # (OTP 27's client default). Its per-tenant connections are another matter: they
            # follow the tenant row's `ssl_enforced`, which the image's seed hardcodes false and
            # which, when true, gives Postgrex `verify: :verify_none` with no CA option at all.
            # The seed is overridden below so the tenant encrypts; that link is the one client in
            # the chart that cannot verify the server.
            - name: DB_SSL
              value: "true"
            - name: DB_SSL_CA_CERT
              value: {{ include "acs-cymru.dbCaPath" . }}
            {{- end }}
            {{- include "acs-cymru.secretEnv" (dict "name" "DB_ENC_KEY" "secretName" $secretName "key" "REALTIME_DB_ENC_KEY") | nindent 12 }}
            # Must be the same secret Kong, PostgREST and GoTrue verify with, or every subscriber
            # is rejected at the socket handshake.
            {{- include "acs-cymru.secretEnv" (dict "name" "API_JWT_SECRET" "secretName" $secretName "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SECRET_KEY_BASE" "secretName" $secretName "key" "REALTIME_SECRET_KEY_BASE") | nindent 12 }}
            {{/*
              MANDATORY SINCE realtime v2.102.3 -- `System.fetch_env!`, so the container refuses to
              boot rather than defaulting, and the failure is a CrashLoopBackOff whose message is an
              Elixir stack trace ten frames deep. secret.yaml gained REALTIME_METRICS_JWT_SECRET when
              the version was pinned and NOTHING CONSUMED IT, so the chart carried the value and
              never passed it.

              It signs the bearer token realtime's /metrics endpoint requires. Nothing scrapes that
              endpoint here yet, so the value only has to exist and be secret -- and deliberately is
              NOT SUPABASE_JWT_SECRET, which would let anyone holding the API signing key mint
              metrics tokens: a wider grant for no gain.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "METRICS_JWT_SECRET" "secretName" $secretName "key" "REALTIME_METRICS_JWT_SECRET") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_ANON_KEY" "secretName" $secretName "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            - name: ERL_AFLAGS
              value: "-proto_dist inet_tcp"
            - name: DNS_NODES
              value: "''"
            # NOT OPTIONAL. /app/run.sh does `ulimit -n $RLIMIT_NOFILE` under `set -u`; unset kills
            # the container on "unbound variable" before the Elixir app starts.
            - name: RLIMIT_NOFILE
              value: "10000"
            # RLS is evaluated per change, per subscriber. digital_thread is restricted to
            # privileged roles and that must hold over the socket exactly as over PostgREST.
            - name: RLS_ENABLED
              value: "true"
            - name: SEED_SELF_HOST
              value: "true"
            - name: RUN_JANITOR
              value: "true"
            - name: APP_NAME
              value: realtime
          # THE TENANT HEALTH ENDPOINT IS AUTHENTICATED, and the tenant is `realtime-dev` (the name
          # SEED_SELF_HOST creates -- TENANT_NAME is ignored). An unauthenticated probe gets a flat
          # 403 and the pod never reports ready against a healthy server; the wrong tenant name
          # gets a 404.
          #
          # An `exec` probe rather than `httpGet` because the bearer token has to come from the
          # container's environment -- an httpGet header would mean templating the anon key into
          # the pod spec. Using the anon key here also proves API_JWT_SECRET matches what the
          # browser will present on the socket.
          # THE SINGLE QUOTES ARE LOAD-BEARING. `Authorization: Bearer …` contains a colon followed
          # by a space, which YAML reads as a key/value separator -- so an unquoted list item parses
          # as a MAPPING, not a string, and the probe silently becomes
          #   {"curl -sf -H \"Authorization": "Bearer $SUPABASE_ANON_KEY\" http://…"}
          #
          # Nothing in the chart's own tooling catches it. `helm template` emits it happily, `helm
          # lint` passes, and the YAML is perfectly valid -- it just describes something else. It
          # fails at the API server, as:
          #   cannot unmarshal object into Go struct field ExecAction...command of type string
          # which names a Go type and no file, and aborts the WHOLE `helm install` before any
          # resource is created, so the stack looks entirely broken over one missing pair of quotes.
          #
          # Single quotes rather than double: the command already contains double quotes around the
          # header value, and those have to reach curl.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $SUPABASE_ANON_KEY" http://localhost:{{ .Values.realtime.port }}/api/tenants/{{ .Values.realtime.serviceName }}/health'
            periodSeconds: 10
            timeoutSeconds: 5
            # Realtime applies its own _realtime migrations and seeds the tenant before answering.
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $SUPABASE_ANON_KEY" http://localhost:{{ .Values.realtime.port }}/api/tenants/{{ .Values.realtime.serviceName }}/health'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.realtime.resources | nindent 12 }}
          {{- if .Values.postgresTls.enabled }}
          volumeMounts:
            {{- include "acs-cymru.dbClientCaMount" . | nindent 12 }}
            # The seed with `ssl_enforced` taken from DB_SSL, over the image's copy. The path
            # carries the release version, so a tag bump must keep this in step.
            - name: seeds
              mountPath: {{ printf "/app/lib/realtime-%s/priv/repo/seeds.exs" (trimPrefix "v" .Values.realtime.image.tag) }}
              subPath: seeds.exs
              readOnly: true
          {{- end }}
      {{- if .Values.postgresTls.enabled }}
      volumes:
        {{- include "acs-cymru.dbClientCaVolume" . | nindent 8 }}
        - name: seeds
          configMap:
            name: {{ printf "%s-realtime-seeds" (include "acs-cymru.fullname" .) }}
      {{- end }}
{{- if .Values.postgresTls.enabled }}
---
{{/*
The image's priv/repo/seeds.exs (v2.102.3) with one change: `ssl_enforced` comes from DB_SSL
instead of being false. SEED_SELF_HOST runs this on every start, deleting and recreating the
tenant, so a row updated any other way would not survive a restart. Re-copy on a tag bump.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-realtime-seeds" (include "acs-cymru.fullname" .) }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  seeds.exs: |
    require Logger

    import Ecto.Adapters.SQL, only: [query: 3]

    alias Realtime.Api.Tenant
    alias Realtime.Repo
    alias Realtime.Tenants

    tenant_name = System.get_env("SELF_HOST_TENANT_NAME", "realtime-dev")
    default_db_host = "host.docker.internal"

    {:ok, tenant} =
      Repo.transaction(fn ->
        case Repo.get_by(Tenant, external_id: tenant_name) do
          %Tenant{} = tenant -> Repo.delete!(tenant)
          nil -> {:ok, nil}
        end

        %Tenant{}
        |> Tenant.changeset(%{
          "name" => tenant_name,
          "external_id" => tenant_name,
          "jwt_secret" => System.get_env("API_JWT_SECRET", "super-secret-jwt-token-with-at-least-32-characters-long"),
          "jwt_jwks" => System.get_env("API_JWT_JWKS") |> then(fn v -> if v, do: Jason.decode!(v) end),
          "extensions" => [
            %{
              "type" => "postgres_cdc_rls",
              "settings" => %{
                "db_name" => System.get_env("DB_NAME", "postgres"),
                "db_host" => System.get_env("DB_HOST", default_db_host),
                "db_user" => System.get_env("DB_USER", "supabase_admin"),
                "db_password" => System.get_env("DB_PASSWORD", "postgres"),
                "db_port" => System.get_env("DB_PORT", "5433"),
                "region" => "us-east-1",
                "poll_interval_ms" => 100,
                "poll_max_record_bytes" => 1_048_576,
                "ssl_enforced" => System.get_env("DB_SSL", "false") == "true"
              }
            }
          ]
        })
        |> Repo.insert!()
      end)

    tenant = Tenants.get_tenant_by_external_id(tenant_name)

    with res when res in [:noop, :ok] <- Tenants.Migrations.run_migrations(tenant),
         :ok <- Tenants.Janitor.MaintenanceTask.run(tenant.external_id) do
      Logger.info("Tenant set-up successfully")
    else
      error ->
        Logger.info("Failed to set-up tenant: #{inspect(error)}")
    end
{{- end }}
{{- end }}
