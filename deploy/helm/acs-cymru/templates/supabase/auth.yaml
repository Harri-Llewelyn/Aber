{{- if .Values.supabaseAuth.enabled }}
{{- $component := "supabase-auth" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-auth
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 9999
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-auth
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseAuth.replicas }}
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          GoTrue connects as supabase_auth_admin, whose password is set by the db-roles-init hook.
          Waiting on the DATABASE is not sufficient -- it is up long before that Job runs -- so this
          waits on the role actually being usable. Without it GoTrue crash-loops on 28P01 until the
          hook lands, which is noise that looks like a credential error.
        */}}
        {{- include "acs-cymru.waitForPostgres" (dict "ctx" . "name" "wait-for-auth-role" "host" (include "acs-cymru.supabaseDb.host" .) "port" (include "acs-cymru.supabaseDb.port" .) "user" "supabase_auth_admin" "db" "postgres" "passwordKey" "POSTGRES_PASSWORD") | nindent 8 }}
      containers:
        - name: gotrue
          image: "{{ .Values.supabaseAuth.image.repository }}:{{ .Values.supabaseAuth.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseAuth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9999
              protocol: TCP
          env:
            - name: GOTRUE_API_HOST
              value: 0.0.0.0
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            # Composed at runtime from the env var above rather than rendered by Helm, so the
            # password never appears in the manifest. GoTrue expands $(VAR) from earlier entries.
            - name: GOTRUE_DB_DATABASE_URL
              value: "postgres://supabase_auth_admin:$(POSTGRES_PASSWORD)@{{ include "acs-cymru.supabaseDb.host" . }}:{{ include "acs-cymru.supabaseDb.port" . }}/postgres?sslmode=disable"
            # THE APPLICATION'S URL, NOT THE GATEWAY'S. GoTrue builds user-facing redirects from
            # this, including the OAuth consent redirect below -- pointing it at the API gateway
            # would send the browser to a URL that serves no UI.
            - name: GOTRUE_SITE_URL
              value: {{ include "acs-cymru.frontendUrl" . | quote }}
            # Followed by the BROWSER, so the ingress address rather than the in-cluster one.
            - name: API_EXTERNAL_URL
              value: {{ include "acs-cymru.supabaseUrl" . | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "GOTRUE_JWT_SECRET" "secretName" $secretName "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            - name: GOTRUE_JWT_EXP
              value: {{ .Values.supabaseAuth.jwtExpiry | quote }}
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: authenticated
            # GoTrue does NOT default the audience. Without this it looks users up with aud = '',
            # never matches the seeded aud = 'authenticated' rows, and EVERY LOGIN FAILS with
            # "Invalid login credentials" -- which reads as a wrong password, not a missing setting.
            - name: GOTRUE_JWT_AUD
              value: authenticated
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: service_role
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "true"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
            - name: GOTRUE_DISABLE_SIGNUP
              value: {{ .Values.supabaseAuth.disableSignup | quote }}
            - name: GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED
              value: "true"
            - name: GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI
              value: "pg-functions://postgres/public/custom_access_token_hook"
            # OAuth 2.1 server, used by Grafana's [auth.generic_oauth] and Node-RED's adminAuth.
            #
            # GoTrue serves /.well-known/openid-configuration UNCONDITIONALLY, whether or not this
            # is on -- a 200 there proves nothing. With the server disabled every endpoint it
            # advertises returns 404 ("OAuth server is disabled"). This flag is what makes
            # /oauth/authorize, /oauth/token and /oauth/userinfo real.
            - name: GOTRUE_OAUTH_SERVER_ENABLED
              value: "true"
            - name: GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION
              value: "true"
            # GoTrue SHIPS NO CONSENT UI. On /oauth/authorize it redirects the browser to
            # GOTRUE_SITE_URL + this path with ?authorization_id=..., and the application is
            # expected to render consent and POST the decision back. Without it /oauth/authorize
            # fails with "oauth authorization path not configured" and no OAuth client can ever
            # complete a login. The route is served by the React dashboard (pages/OAuthConsent.jsx).
            - name: GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH
              value: "/oauth/consent"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.supabaseAuth.resources | nindent 12 }}
{{- end }}
