{{- if .Values.supabaseRest.enabled }}
{{- $component := "supabase-rest" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-rest
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # storage-api reaches this as POSTGREST_URL=http://supabase-rest:3000, and kong.yml routes
      # /rest/v1/ to it on the same address.
      port: 3000
      targetPort: http
      protocol: TCP
    # Scraped by Prometheus, reachable from nothing else. See the PGRST_ADMIN_SERVER_PORT note on
    # the Deployment for why this is not routed.
    - name: admin
      port: 3001
      targetPort: admin
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseRest.replicas }}
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          PostgREST connects as `authenticator`, whose password db-roles-init sets. It also caches
          the schema at startup, so starting before db-init has run leaves it serving an EMPTY
          SCHEMA -- 404 on every table, with a healthy-looking process. Waiting on the role covers
          the credential; the schema-cache reload below covers the rest.
        */}}
        {{- include "acs-cymru.waitForPostgres" (dict "ctx" . "name" "wait-for-authenticator" "host" (include "acs-cymru.supabaseDb.host" .) "port" (include "acs-cymru.supabaseDb.port" .) "user" "authenticator" "db" "postgres" "passwordKey" "POSTGRES_PASSWORD") | nindent 8 }}
      containers:
        - name: postgrest
          image: "{{ .Values.supabaseRest.image.repository }}:{{ .Values.supabaseRest.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseRest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGRES_PASSWORD)@{{ include "acs-cymru.supabaseDb.host" . }}:{{ include "acs-cymru.supabaseDb.port" . }}/postgres"
            # `storage` is exposed because storage-api resolves the caller's claims through
            # PostgREST; `graphql_public` because the Supabase client expects it to exist.
            - name: PGRST_DB_SCHEMAS
              value: public,storage,graphql_public
            - name: PGRST_DB_ANON_ROLE
              value: anon
            {{- include "acs-cymru.secretEnv" (dict "name" "PGRST_JWT_SECRET" "secretName" $secretName "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
            # The revocation choke point (0074), identical to Compose. Run in the caller's role
            # before every request; it RAISEs on a revoked `jti` and returns quietly otherwise.
            # A single point of failure by construction -- its fail-open paths are asserted in
            # supabase/migrations/test_service_token_revocation.py, and a misspelling here is a
            # total outage rather than a skipped hook.
            - name: PGRST_DB_PRE_REQUEST
              value: public.auth_pre_request
            # PostgREST caches the schema on connect and reloads on a NOTIFY. The migrations end
            # with `NOTIFY pgrst, 'reload schema'`, which is what makes a `helm upgrade` that adds
            # a table visible without a restart -- but only if PostgREST is listening on the right
            # channel, which is what this declares.
            - name: PGRST_DB_CHANNEL_ENABLED
              value: "true"
            - name: PGRST_DB_CHANNEL
              value: pgrst
            - name: PGRST_SERVER_PORT
              value: "3000"
            # The admin listener, which is the only place PostgREST serves /metrics. Off unless
            # this is set -- no admin server is bound at all by default, which is why the metrics
            # gap existed rather than being a missing ServiceMonitor.
            #
            # NEW WITH v14.12. On v12.2.0 this port served /ready and /live and nothing else.
            #
            # NOT in the Ingress and NOT routed by Kong. The admin server has NO AUTHENTICATION,
            # and its readiness endpoints describe the database connection -- so it is a
            # ClusterIP-only port for Prometheus, in the same shape as the ingestion daemon's.
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
            # An unauthenticated liveness probe needs SOMETHING to answer. The OpenAPI root is
            # served to `anon` and is the cheapest endpoint that proves the schema cache is loaded.
            - name: PGRST_OPENAPI_MODE
              value: follow-privileges
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.supabaseRest.resources | nindent 12 }}
{{- end }}
