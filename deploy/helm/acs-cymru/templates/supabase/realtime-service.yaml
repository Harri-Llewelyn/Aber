{{- if .Values.realtime.enabled }}
{{- $component := "realtime" -}}
{{- /*
=================================================================================================
THE ONE SERVICE WHOSE NAME DELIBERATELY DIFFERS FROM ITS COMPOSE SERVICE NAME.

Everywhere else this chart keeps Kubernetes Service names identical to the Compose service names,
so every compose-internal URL already in the stack's configuration resolves unchanged. Realtime is
the exception, and the exception is what makes it work rather than a compromise:

  * Realtime resolves WHICH TENANT a request belongs to from the LEADING HOSTNAME LABEL of the
    Host header -- not from the JWT, not from a setting. `realtime-dev` is the tenant
    SEED_SELF_HOST creates, and TENANT_NAME is ignored.
  * Kong runs `preserve_host: false` (the default), so the upstream Host header is taken from the
    service URL in kong.yml. Point it at a Service called `supabase-realtime` and the leading
    label is `supabase-realtime`, no tenant matches, and EVERY WebSocket handshake is rejected
    with a bare 403 that mentions neither tenants nor hostnames.

On Docker Compose this needs a network ALIAS (`realtime-dev.supabase-realtime`, declared on the
supabase-realtime service) because the service is already named something else. Kubernetes has no
per-Service alias of that shape -- but it does not need one: NAMING THE SERVICE FOR THE TENANT
makes the leading label fall out of ordinary in-cluster DNS. `http://realtime-dev:4000/socket/` is
then correct with no header rewriting at all.

That is why supabase/kong.yml carries `__REALTIME_UPSTREAM_URL__` as a placeholder
rather than a literal: it is the one upstream that genuinely differs between the two targets.

acs-cymru.validateRealtimeServiceName in _helpers.tpl refuses any other name, matching the guard
supabase-kong-init applies to REALTIME_UPSTREAM_URL on the Compose side.

THE SERVICE NAME IS THE ARCHITECTURAL DECISION here, and the thing later work must not undo; the
workload behind it is ordinary.
=================================================================================================
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.realtime.serviceName }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    acs-cymru.io/tenant-note: >-
      Named for the Realtime TENANT, not the workload. Renaming breaks every WebSocket handshake
      with a bare 403. See architecture §3.4.
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.realtime.port }}
      targetPort: http
      protocol: TCP
{{- end }}
