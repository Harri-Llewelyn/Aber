{{- if .Values.supabaseEnvoy.enabled }}
{{- $component := "supabase-envoy" -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $envoy := .Files.Get "files/envoy/envoy.yaml" -}}
{{- if not $envoy }}
{{- fail "\n\nacs-cymru: files/envoy/envoy.yaml is missing.\n\nMirror it with:  node scripts/sync-helm-chart-files.mjs\n\nEnvoy refuses to start on a config it cannot parse, so an absent one is a CrashLoopBackOff rather\nthan a silent 404 -- but the message points at a path, not at the sync step, which is why this fails here.\n" }}
{{- end }}
{{/*
THE GATEWAY ON THIS TARGET. Kong is off by default and retained.

WHAT WAS UNPROVEN, AND WHAT CLOSED IT. This template shipped disabled because a hand-installed
cluster could not exercise anything needing this project's own images -- `db-init` and
`gateway-credential` are unpublished GHCR tags, so no migrations ran, no edge functions deployed,
and the authenticated probe's markers cannot be satisfied against empty upstreams. The Realtime
handshake, the ServiceMonitor scrape and the Ingress were untested for the same class of reason.
That remainder was downstream of CI, not of the chart:
the k3d job BUILDS those images and imports them, so `Verify The Live Gateway Surface — Envoy,
In-Cluster` runs the same probe the Compose job runs, against a stack that has a schema behind it.

WHAT HELD BEFORE THAT, observed rather than translated: the `supabase-kong` Service selects
`component=supabase-envoy` and gets a live endpoint, so the name adoption the promotion rests on
works; the unauthenticated probe reports the same 3 gated / 6 open / 4 exemptions as Compose; and
credentials behave in both directions.

TO RE-RUN IT BY HAND:

  kubectl -n <ns> port-forward svc/supabase-kong 18080:8000
  SUPABASE_ANON_KEY=<the cluster's, from its Secret -- NOT .env's>
    node scripts/check-gateway-surface.mjs --runtime --authenticated http://127.0.0.1:18080

Two traps worth carrying: the key must come from the CLUSTER's Secret, and Windows reserves
54328-54427, which silently refuses the obvious port-forward ports. See docs/gateway-migration.md.
*/}}
{{- if and .Values.supabaseKong.enabled (eq .Values.supabaseEnvoy.serviceName "supabase-kong") }}
{{- fail "\n\nacs-cymru: supabaseKong.enabled and supabaseEnvoy.serviceName=supabase-kong at once.\n\nTwo Deployments would answer on one Service name and requests would be load-balanced across the\ngateway being replaced and the one replacing it -- which is not a migration, it is a coin toss per\nrequest, and the probe would report whichever one it happened to reach.\n\nRun them side by side with supabaseEnvoy.serviceName=supabase-envoy, or promote by setting\nsupabaseKong.enabled=false in the same change that renames the Service.\n" }}
{{- end }}
---
{{/*
The Envoy config, from the SHARED template -- the same argument kong.yml's ConfigMap makes.

SUBSTITUTION IN AN initContainer, NOT IN HELM, and for the reason recorded on the Kong ConfigMap:
with `secrets.existingSecret` set, `.Values.secrets.anonKey` is empty and Helm would substitute an
EMPTY STRING into the Lua key comparison. That is worse here than it was there. Kong's key-auth
accepts an empty registered key; this filter would accept `key == ""` from any caller presenting an
empty apikey header, which is every caller who sends the header at all.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-envoy-template" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  envoy.yaml: |
{{ $envoy | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  {{/*
  NAMED FROM VALUES, and that is the whole promotion mechanism.

  `http://supabase-kong:8000` is carried by Studio, the edge runtime, Grafana's token_url and
  api_url, Node-RED's token and userinfo URLs, the ingestion daemon and both e2e Jobs -- fifteen
  files. Kubernetes has no Service aliasing, so the way to move the gateway without touching any of
  them is for the replacement to ADOPT THE NAME. Promotion is then two values in one change:

      supabaseKong.enabled: false
      supabaseEnvoy.serviceName: supabase-kong

  rather than an edit to fifteen consumers, each of which is a chance to miss one. The guard above
  refuses the state where both are enabled under that name.
  */}}
  name: {{ .Values.supabaseEnvoy.serviceName }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # 8000, matching Kong's Service port exactly -- consumers carry the port as well as the host.
      port: 8000
      targetPort: http
      protocol: TCP
    # STUDIO'S DOOR, and the only backend the studio ingress route may name. Pointing that route at
    # the `supabase-studio` Service instead reaches the console with no login in front of it, which
    # is what this port exists to prevent -- so the route is built from the gateway Service in
    # `acs-cymru.ingressRoutes`, where there is one definition of it to get right.
    - name: studio
      port: 8001
      targetPort: studio
      protocol: TCP
    # THE FORGE'S DOOR, and the only backend the gitea ingress route may name, for the reason the
    # studio port gives -- with reverse-proxy authentication on, `gitea:3000` signs in whoever a
    # request header names, so a route pointing there would let the internet pick its own identity.
    - name: forge
      port: 8002
      targetPort: forge
      protocol: TCP
    {{- if .Values.supabaseEnvoy.metrics.enabled }}
    # NAMED `metrics`, selected BY NAME by the ServiceMonitor, as Kong's is.
    #
    # THE PATH DIFFERS FROM KONG'S AND THE SERVICEMONITOR MUST SAY SO. Kong exposes /metrics on a
    # dedicated status listener; Envoy exposes /stats/prometheus on its ADMIN listener. Same
    # scrape, different path, and a ServiceMonitor carried over unchanged scrapes 404 while
    # reporting the target as up -- an unmeasured gateway that reads as an idle one, which is the
    # exact failure the three Kong prometheus flags were added for.
    - name: metrics
      port: {{ .Values.supabaseEnvoy.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-envoy
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseEnvoy.replicas }}
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the gateway when the ROUTES change. Envoy reads its bootstrap once at start, so
        # without this a route change would sit in the ConfigMap unread -- same as Kong.
        #
        # It does NOT cover the API keys, which live in the Secret the chart may not own. Rotating
        # one needs `kubectl rollout restart deployment/supabase-envoy`.
        checksum/envoy-template: {{ $envoy | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: render-config
          image: alpine:3.24
          command:
            - /bin/sh
            - -e
            - -c
            - |
              if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
                echo 'SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY must be set -- an empty key substituted into the Lua filter would be accepted from any caller sending an empty apikey.' >&2
                exit 1
              fi
              # THE ONE COMBINATION THAT LOCKS EVERYBODY OUT, refused here rather than
              # discovered. Legacy off with no new keys registered leaves the filter accepting
              # NOTHING: every gated route answers 401, every pod reports healthy, and the cause is
              # one boolean three layers down. Made on both targets for the reason every other check
              # here is: they share the template and not the substituter.
              case "$LEGACY_KEYS_ACCEPTED" in
                true|false) ;;
                *)
                  echo "LEGACY_KEYS_ACCEPTED must be exactly 'true' or 'false' -- it is substituted into the Lua filter as a bare boolean. Got: $LEGACY_KEYS_ACCEPTED" >&2
                  exit 1
                  ;;
              esac
              if [ "$LEGACY_KEYS_ACCEPTED" = "false" ] && [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
                echo 'LEGACY_KEYS_ACCEPTED=false with no SUPABASE_PUBLISHABLE_KEY set -- the gateway would accept no API key at all and refuse every request. Mint the new pair first, migrate your consumers onto it, and only then turn the legacy keys off.' >&2
                exit 1
              fi
              # ONE OF THE NEW PAIR IS WORSE THAN NEITHER -- the same guard Compose's substituter
              # makes, and it has to be made twice for the reason every other check here is: the
              # two targets share the template and not the substituter, so a rule enforced on one
              # is a per-target divergence that surfaces as a boot failure on the other.
              if { [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$SUPABASE_SECRET_KEY" ]; } || { [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SECRET_KEY" ]; }; then
                echo 'SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY are a pair -- set BOTH to accept the new key format, or NEITHER to run legacy-only.' >&2
                exit 1
              fi
              case "$ENVOY_CORS_ORIGINS" in
                '['*']') ;;
                *)
                  echo "ENVOY_CORS_ORIGINS must be a JSON array of browser origins. Got: $ENVOY_CORS_ORIGINS" >&2
                  exit 1
                  ;;
              esac
              case "$REALTIME_UPSTREAM_HOST" in
                realtime-dev*) ;;
                *)
                  echo "REALTIME_UPSTREAM_HOST must begin with the label 'realtime-dev' -- Realtime reads the tenant id from it and answers a bare 403 otherwise. Got: $REALTIME_UPSTREAM_HOST" >&2
                  exit 1
                  ;;
              esac

              # Kong takes origins as a JSON array of strings; Envoy takes a list of string
              # matchers. THE SPACE AFTER THE COLON IS REQUIRED: `{exact:"a"}` is a single scalar
              # key in a YAML flow mapping, not a key and a value, and Envoy refuses the whole
              # bootstrap. Verified on Compose, where it refused to start.
              CORS_MATCHERS=$(printf '%s' "$ENVOY_CORS_ORIGINS" | sed 's/"\([^"]*\)"/{exact: "\1"}/g')

              # The signing secret as an `oct` JWKS key, which the studio listener verifies session
              # tokens against. base64url, so the wrapping, the +/ alphabet and the padding all
              # have to go -- a stray newline yields a JWKS Envoy parses and then rejects every
              # token against.
              JWT_B64URL=$(printf '%s' "$SUPABASE_JWT_SECRET" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')

              # FAIL CLOSED, NOT SHUT, matching Compose. The chart does not publish the studio
              # listener at all by default (routes.studio is false), so an unset pair here is the
              # ordinary case rather than a misconfiguration -- and refusing to boot over it would
              # take down the gateway every other service sits behind.
              if [ -z "$STUDIO_OAUTH_CLIENT_SECRET" ] || [ -z "$STUDIO_PROXY_HMAC_SECRET" ]; then
                echo 'NOTE: Studio OAuth client secret / cookie key are not set. The studio listener will answer a login that cannot complete.' >&2
                STUDIO_OAUTH_CLIENT_SECRET='unconfigured'
                STUDIO_PROXY_HMAC_SECRET=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              fi

              # SDS, because OAuth2Credentials takes a secret config source rather than a string.
              # ONE SECRET PER FILE: a path source carrying two is accepted at boot and rejected at
              # runtime, leaving a listener with no credentials in it.
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: studio-oauth-client-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$STUDIO_OAUTH_CLIENT_SECRET\" }" \
                > /config/studio-client-secret.yaml
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: studio-proxy-hmac-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$STUDIO_PROXY_HMAC_SECRET\" }" \
                > /config/studio-hmac-secret.yaml

              # The forge's door, the same way. Unlike Studio's route, the gitea route is ON by
              # default, so an unset pair here is a forge nobody can sign into -- reported, and
              # still not a reason to refuse the gateway every other service sits behind.
              if [ -z "$GITEA_OAUTH_CLIENT_SECRET" ] || [ -z "$GITEA_PROXY_HMAC_SECRET" ]; then
                echo 'NOTE: forge OAuth client secret / cookie key are not set. The forge listener will answer a login that cannot complete. Set secrets.giteaOAuthClientSecret and secrets.giteaProxyHmacSecret.' >&2
                GITEA_OAUTH_CLIENT_SECRET='unconfigured'
                GITEA_PROXY_HMAC_SECRET=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              fi
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: forge-oauth-client-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$GITEA_OAUTH_CLIENT_SECRET\" }" \
                > /config/forge-client-secret.yaml
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: forge-proxy-hmac-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$GITEA_PROXY_HMAC_SECRET\" }" \
                > /config/forge-hmac-secret.yaml
              # No trailing slash on a redirect_uri, or GoTrue answers `invalid redirect_uri`.
              GITEA_PUBLIC_URL="${GITEA_PUBLIC_URL%/}"

              sed -e "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" \
                  -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$SUPABASE_SERVICE_ROLE_KEY|g" \
                  -e "s|__SUPABASE_PUBLISHABLE_KEY__|$SUPABASE_PUBLISHABLE_KEY|g" \
                  -e "s|__SUPABASE_SECRET_KEY__|$SUPABASE_SECRET_KEY|g" \
                  -e "s|__LEGACY_KEYS_ACCEPTED__|$LEGACY_KEYS_ACCEPTED|g" \
                  -e "s|__REALTIME_UPSTREAM_HOST__|$REALTIME_UPSTREAM_HOST|g" \
                  -e "s|__REALTIME_UPSTREAM_ADDRESS__|$REALTIME_UPSTREAM_ADDRESS|g" \
                  -e "s|__CORS_ORIGINS__|$CORS_MATCHERS|g" \
                  -e "s|__SUPABASE_PUBLIC_URL__|$SUPABASE_PUBLIC_URL|g" \
                  -e "s|__STUDIO_PUBLIC_URL__|$STUDIO_PUBLIC_URL|g" \
                  -e "s|__STUDIO_UPSTREAM_ADDRESS__|$STUDIO_UPSTREAM_ADDRESS|g" \
                  -e "s|__GITEA_PUBLIC_URL__|$GITEA_PUBLIC_URL|g" \
                  -e "s|__GITEA_UPSTREAM_ADDRESS__|$GITEA_UPSTREAM_ADDRESS|g" \
                  -e "s|__SUPABASE_JWT_SECRET_B64URL__|$JWT_B64URL|g" \
                  /template/envoy.yaml > /config/envoy.yaml

              # The leftover scan both targets run. Comments are excluded -- envoy.yaml's header
              # documents the placeholders by name.
              LEFTOVER=$(grep -vE '^[[:space:]]*#' /config/envoy.yaml | grep -oE '__[A-Z0-9_]+__' | sort -u || true)
              if [ -n "$LEFTOVER" ]; then
                echo "Unsubstituted placeholder(s) left in envoy.yaml: $LEFTOVER" >&2
                exit 1
              fi
              echo 'envoy.yaml rendered.'
          env:
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: SUPABASE_SERVICE_ROLE_KEY
            # THE NEW KEY FORMAT, and `optional: true` is the whole compatibility story on this
            # target. With `secrets.existingSecret` set, the chart does not own the Secret and an
            # operator's existing one has neither of these keys -- a required secretKeyRef would
            # then refuse to start the gateway on every cluster that upgraded without minting them.
            # Absent means empty, empty means legacy-only, and the Lua filter checks for exactly
            # that. The pair guard above catches the half-configured case.
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: SUPABASE_PUBLISHABLE_KEY
                  optional: true
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: SUPABASE_SECRET_KEY
                  optional: true
            # THE DEACTIVATION SWITCH, from VALUES rather than from the Secret: it is a
            # posture, not a credential, and it belongs where an operator reads the rest of the
            # gateway's configuration. See supabaseEnvoy.legacyKeysAccepted in values.yaml.
            - name: LEGACY_KEYS_ACCEPTED
              value: {{ .Values.supabaseEnvoy.legacyKeysAccepted | toString | quote }}
            # Kong's initContainer builds a full URL because Kong routes on one. Envoy splits the
            # concern: the cluster carries the address, this carries only the Host header.
            - name: REALTIME_UPSTREAM_HOST
              value: {{ .Values.realtime.serviceName | quote }}
            # AND THE ADDRESS, which on this target is the same string and on Compose is not.
            # The template used to hard-code Compose's container name, so this cluster resolved
            # nothing here and Realtime answered 503 through a gateway that was otherwise right.
            - name: REALTIME_UPSTREAM_ADDRESS
              value: {{ .Values.realtime.serviceName | quote }}
            # THE SAME HELPER THE INGRESS HOSTS COME FROM, so an origin cannot name a hostname the
            # chart does not serve. Identical to Kong's KONG_CORS_ORIGINS for the same reason:
            # origin policy has one source or it has none.
            - name: ENVOY_CORS_ORIGINS
              value: {{ include "acs-cymru.corsOrigins" . | quote }}
            # ------------------------------------------------------------------------------
            # The studio listener's inputs. See the listener in files/envoy/envoy.yaml.
            # ------------------------------------------------------------------------------
            # What jwt_authn verifies the session token against -- the same secret GoTrue signs
            # with, which is why it is this key and not one of its own.
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_JWT_SECRET" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            # OPTIONAL, unlike every secret above. `routes.studio` is false by default, so most
            # installs never publish this listener and have no reason to hold its credential; a
            # required ref would fail those pods on a key nothing reads. The init container's
            # fail-closed branch covers the absent case.
            - name: STUDIO_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: STUDIO_OAUTH_CLIENT_SECRET
                  optional: true
            - name: STUDIO_PROXY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: STUDIO_PROXY_HMAC_SECRET
                  optional: true
            # Both are addresses the BROWSER uses -- the ingress hostnames, never the in-cluster
            # Service names, which is what the token endpoint in the config uses instead.
            - name: SUPABASE_PUBLIC_URL
              value: {{ include "acs-cymru.supabaseUrl" . | quote }}
            - name: STUDIO_PUBLIC_URL
              value: {{ include "acs-cymru.studioUrl" . | quote }}
            # The name Envoy DIALS. Compose has a container of the same name; here it is the
            # Service in templates/supabase/studio.yaml.
            - name: STUDIO_UPSTREAM_ADDRESS
              value: supabase-studio
            # ------------------------------------------------------------------------------
            # The forge listener's inputs (0094). It shares the JWKS key and SUPABASE_PUBLIC_URL
            # with Studio's. OPTIONAL refs for the reason Studio's are -- an operator's existing
            # Secret predates them -- with the init container's fail-closed branch covering
            # the absent case.
            # ------------------------------------------------------------------------------
            - name: GITEA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: GITEA_OAUTH_CLIENT_SECRET
                  optional: true
            - name: GITEA_PROXY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: GITEA_PROXY_HMAC_SECRET
                  optional: true
            # The address the BROWSER reaches the forge on: the same helper Gitea's ROOT_URL and
            # the Ingress host come from, so the three cannot disagree.
            - name: GITEA_PUBLIC_URL
              value: {{ include "acs-cymru.giteaUrl" . | quote }}
            # The name Envoy DIALS -- the Service in templates/apps/gitea.yaml.
            - name: GITEA_UPSTREAM_ADDRESS
              value: gitea
          volumeMounts:
            - name: template
              mountPath: /template
            - name: config
              mountPath: /config
      containers:
        - name: envoy
          image: "{{ .Values.supabaseEnvoy.image.repository }}:{{ .Values.supabaseEnvoy.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseEnvoy.image.pullPolicy }}
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - {{ .Values.supabaseEnvoy.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8000
            # Studio's listener. Declared unconditionally because the bootstrap declares it
            # unconditionally -- the port is open in the pod whether or not `ingress.routes.studio`
            # publishes it, and a containerPort that disagreed with the config would make the pod
            # describe itself wrongly without changing what it serves.
            - name: studio
              containerPort: 8001
            # The forge's listener, declared unconditionally for the same reason.
            - name: forge
              containerPort: 8002
            {{- if .Values.supabaseEnvoy.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.supabaseEnvoy.metrics.port }}
            {{- end }}
          # `/ready` on the admin listener answers 200 only once the listener is serving. Envoy
          # exits non-zero on a config it cannot parse, so a bad translation is a CrashLoopBackOff
          # rather than a gateway answering 404 for everything.
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.supabaseEnvoy.metrics.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.supabaseEnvoy.metrics.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.supabaseEnvoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: {{ printf "%s-envoy-template" $fullname }}
        # emptyDir, not a Secret: the rendered file carries both API keys and must not outlive the
        # pod or appear in any manifest. Same treatment as Kong's rendered config.
        - name: config
          emptyDir: {}
{{- end }}
