{{- if .Values.supabaseEnvoy.enabled }}
{{- $component := "supabase-envoy" -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $envoy := .Files.Get "files/envoy/envoy.yaml" -}}
{{- if not $envoy }}
{{- fail "\n\nacs-cymru: files/envoy/envoy.yaml is missing.\n\nMirror it with:  node scripts/sync-helm-chart-files.mjs\n\nEnvoy refuses to start on a config it cannot parse, so an absent one is a CrashLoopBackOff rather\nthan a silent 404 -- but the message points at a path, not at the sync step, which is why this fails here.\n" }}
{{- end }}
{{/*
THE GATEWAY (docs/gateway.md). CI runs `check-gateway-surface.mjs --runtime --authenticated`
against the k3d stack; to re-run it by hand:

  kubectl -n <ns> port-forward svc/supabase-kong 18080:8000
  SUPABASE_PUBLISHABLE_KEY=<the cluster's, from its Secret>
    node scripts/check-gateway-surface.mjs --runtime --authenticated http://127.0.0.1:18080

The key must come from the CLUSTER's Secret, and Windows reserves 54328-54427, which silently
refuses the obvious port-forward ports.
*/}}
---
{{/*
The Envoy config, from the mirrored template (scripts/sync-helm-chart-files.mjs).

SUBSTITUTION IN AN initContainer, NOT IN HELM: with `secrets.existingSecret` set the chart cannot
see the keys, and Helm would substitute an EMPTY STRING into the Lua key comparison, which then
admits any caller presenting an empty apikey header.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-envoy-template" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  envoy.yaml: |
{{ $envoy | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  {{/*
  NAMED FROM VALUES. `http://supabase-kong:8000` is carried by Studio, the edge runtime, Grafana's
  token_url and api_url, Node-RED's token and userinfo URLs, the ingestion daemon and both e2e
  Jobs; Kubernetes has no Service aliasing, so the gateway keeps the name every consumer carries.
  */}}
  name: {{ .Values.supabaseEnvoy.serviceName }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      # 8000: consumers carry the port as well as the host.
      port: 8000
      targetPort: http
      protocol: TCP
    # STUDIO'S DOOR, and the only backend the studio ingress route may name. Pointing that route at
    # the `supabase-studio` Service instead reaches the console with no login in front of it, which
    # is what this port exists to prevent -- so the route is built from the gateway Service in
    # `acs-cymru.ingressRoutes`, where there is one definition of it to get right.
    - name: studio
      port: 8001
      targetPort: studio
      protocol: TCP
    # THE FORGE'S DOOR, and the only backend the gitea ingress route may name, for the reason the
    # studio port gives -- with reverse-proxy authentication on, `gitea:3000` signs in whoever a
    # request header names, so a route pointing there would let the internet pick its own identity.
    - name: forge
      port: 8002
      targetPort: forge
      protocol: TCP
    {{- if .Values.supabaseEnvoy.metrics.enabled }}
    # NAMED `metrics`, selected BY NAME by the ServiceMonitor, which scrapes /stats/prometheus on
    # the admin listener. A ServiceMonitor with the wrong path scrapes 404 while reporting the
    # target as up.
    - name: metrics
      port: {{ .Values.supabaseEnvoy.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-envoy
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.supabaseEnvoy.replicas }}
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll the gateway when the ROUTES change. Envoy reads its bootstrap once at start, so
        # without this a route change would sit in the ConfigMap unread.
        #
        # It does NOT cover the API keys, which live in the Secret the chart may not own. Rotating
        # one needs `kubectl rollout restart deployment/supabase-envoy`.
        checksum/envoy-template: {{ $envoy | sha256sum }}
        {{- if .Values.supabaseEnvoy.metrics.enabled }}
        # The admin listener serves the scrape at /stats/prometheus, not /metrics.
        {{- include "acs-cymru.scrapeAnnotations" (dict "port" .Values.supabaseEnvoy.metrics.port "path" "/stats/prometheus") | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: render-config
          image: alpine:3.24
          command:
            - /bin/sh
            - -e
            - -c
            - |
              # All four, or nothing: an empty key substituted into the Lua filter is matched by
              # any caller sending an empty apikey, and an empty JWT is a bearer no upstream
              # accepts, which answers 401 to every request while every pod reports healthy.
              for name in SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
                eval "value=\$$name"
                if [ -z "$value" ]; then
                  echo "$name must be set -- see secrets in values.yaml; node scripts/setup.mjs mints the set." >&2
                  exit 1
                fi
              done
              case "$ENVOY_CORS_ORIGINS" in
                '['*']') ;;
                *)
                  echo "ENVOY_CORS_ORIGINS must be a JSON array of browser origins. Got: $ENVOY_CORS_ORIGINS" >&2
                  exit 1
                  ;;
              esac
              case "$REALTIME_UPSTREAM_HOST" in
                realtime-dev*) ;;
                *)
                  echo "REALTIME_UPSTREAM_HOST must begin with the label 'realtime-dev' -- Realtime reads the tenant id from it and answers a bare 403 otherwise. Got: $REALTIME_UPSTREAM_HOST" >&2
                  exit 1
                  ;;
              esac

              # The chart hands over origins as a JSON array of strings; Envoy takes a list of
              # string matchers. THE SPACE AFTER THE COLON IS REQUIRED: `{exact:"a"}` is a single scalar
              # key in a YAML flow mapping, not a key and a value, and Envoy refuses the whole
              # bootstrap. Measured: Envoy refused to start.
              CORS_MATCHERS=$(printf '%s' "$ENVOY_CORS_ORIGINS" | sed 's/"\([^"]*\)"/{exact: "\1"}/g')

              # The signing secret as an `oct` JWKS key, which the studio listener verifies session
              # tokens against. base64url, so the wrapping, the +/ alphabet and the padding all
              # have to go -- a stray newline yields a JWKS Envoy parses and then rejects every
              # token against.
              JWT_B64URL=$(printf '%s' "$SUPABASE_JWT_SECRET" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')

              # FAIL CLOSED, NOT SHUT. The chart does not publish the studio
              # listener at all by default (routes.studio is false), so an unset pair here is the
              # ordinary case rather than a misconfiguration -- and refusing to boot over it would
              # take down the gateway every other service sits behind.
              if [ -z "$STUDIO_OAUTH_CLIENT_SECRET" ] || [ -z "$STUDIO_PROXY_HMAC_SECRET" ]; then
                echo 'NOTE: Studio OAuth client secret / cookie key are not set. The studio listener will answer a login that cannot complete.' >&2
                STUDIO_OAUTH_CLIENT_SECRET='unconfigured'
                STUDIO_PROXY_HMAC_SECRET=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              fi

              # SDS, because OAuth2Credentials takes a secret config source rather than a string.
              # ONE SECRET PER FILE: a path source carrying two is accepted at boot and rejected at
              # runtime, leaving a listener with no credentials in it.
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: studio-oauth-client-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$STUDIO_OAUTH_CLIENT_SECRET\" }" \
                > /config/studio-client-secret.yaml
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: studio-proxy-hmac-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$STUDIO_PROXY_HMAC_SECRET\" }" \
                > /config/studio-hmac-secret.yaml

              # The forge's door, the same way. Unlike Studio's route, the gitea route is ON by
              # default, so an unset pair here is a forge nobody can sign into -- reported, and
              # still not a reason to refuse the gateway every other service sits behind.
              if [ -z "$GITEA_OAUTH_CLIENT_SECRET" ] || [ -z "$GITEA_PROXY_HMAC_SECRET" ]; then
                echo 'NOTE: forge OAuth client secret / cookie key are not set. The forge listener will answer a login that cannot complete. Set secrets.giteaOAuthClientSecret and secrets.giteaProxyHmacSecret.' >&2
                GITEA_OAUTH_CLIENT_SECRET='unconfigured'
                GITEA_PROXY_HMAC_SECRET=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              fi
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: forge-oauth-client-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$GITEA_OAUTH_CLIENT_SECRET\" }" \
                > /config/forge-client-secret.yaml
              printf '%s\n' \
                'resources:' \
                '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
                '    name: forge-proxy-hmac-secret' \
                '    generic_secret:' \
                "      secret: { inline_string: \"$GITEA_PROXY_HMAC_SECRET\" }" \
                > /config/forge-hmac-secret.yaml
              # No trailing slash on a redirect_uri, or GoTrue answers `invalid redirect_uri`.
              GITEA_PUBLIC_URL="${GITEA_PUBLIC_URL%/}"

              sed -e "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" \
                  -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$SUPABASE_SERVICE_ROLE_KEY|g" \
                  -e "s|__SUPABASE_PUBLISHABLE_KEY__|$SUPABASE_PUBLISHABLE_KEY|g" \
                  -e "s|__SUPABASE_SECRET_KEY__|$SUPABASE_SECRET_KEY|g" \
                  -e "s|__REALTIME_UPSTREAM_HOST__|$REALTIME_UPSTREAM_HOST|g" \
                  -e "s|__REALTIME_UPSTREAM_ADDRESS__|$REALTIME_UPSTREAM_ADDRESS|g" \
                  -e "s|__CORS_ORIGINS__|$CORS_MATCHERS|g" \
                  -e "s|__SUPABASE_PUBLIC_URL__|$SUPABASE_PUBLIC_URL|g" \
                  -e "s|__STUDIO_PUBLIC_URL__|$STUDIO_PUBLIC_URL|g" \
                  -e "s|__STUDIO_UPSTREAM_ADDRESS__|$STUDIO_UPSTREAM_ADDRESS|g" \
                  -e "s|__GITEA_PUBLIC_URL__|$GITEA_PUBLIC_URL|g" \
                  -e "s|__GITEA_UPSTREAM_ADDRESS__|$GITEA_UPSTREAM_ADDRESS|g" \
                  -e "s|__SUPABASE_JWT_SECRET_B64URL__|$JWT_B64URL|g" \
                  /template/envoy.yaml > /config/envoy.yaml

              # The leftover scan. Comments are excluded -- envoy.yaml's header documents the
              # placeholders by name.
              LEFTOVER=$(grep -vE '^[[:space:]]*#' /config/envoy.yaml | grep -oE '__[A-Z0-9_]+__' | sort -u || true)
              if [ -n "$LEFTOVER" ]; then
                echo "Unsubstituted placeholder(s) left in envoy.yaml: $LEFTOVER" >&2
                exit 1
              fi
              echo 'envoy.yaml rendered.'
          env:
            # The two keys callers present, and the two JWTs the filter substitutes for them.
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_SECRET_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_SECRET_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_ANON_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_SERVICE_ROLE_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            # The cluster carries the address; this carries only the Host header Realtime reads
            # its tenant from.
            - name: REALTIME_UPSTREAM_HOST
              value: {{ .Values.realtime.serviceName | quote }}
            - name: REALTIME_UPSTREAM_ADDRESS
              value: {{ .Values.realtime.serviceName | quote }}
            # THE SAME HELPER THE INGRESS HOSTS COME FROM, so an origin cannot name a hostname the
            # chart does not serve: origin policy has one source or it has none.
            - name: ENVOY_CORS_ORIGINS
              value: {{ include "acs-cymru.corsOrigins" . | quote }}
            # ------------------------------------------------------------------------------
            # The studio listener's inputs. See the listener in files/envoy/envoy.yaml.
            # ------------------------------------------------------------------------------
            # What jwt_authn verifies the session token against -- the same secret GoTrue signs
            # with, which is why it is this key and not one of its own.
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_JWT_SECRET" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            # OPTIONAL, unlike every secret above. `routes.studio` is false by default, so most
            # installs never publish this listener and have no reason to hold its credential; a
            # required ref would fail those pods on a key nothing reads. The init container's
            # fail-closed branch covers the absent case.
            - name: STUDIO_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: STUDIO_OAUTH_CLIENT_SECRET
                  optional: true
            - name: STUDIO_PROXY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: STUDIO_PROXY_HMAC_SECRET
                  optional: true
            # Both are addresses the BROWSER uses -- the ingress hostnames, never the in-cluster
            # Service names, which is what the token endpoint in the config uses instead.
            - name: SUPABASE_PUBLIC_URL
              value: {{ include "acs-cymru.supabaseUrl" . | quote }}
            - name: STUDIO_PUBLIC_URL
              value: {{ include "acs-cymru.studioUrl" . | quote }}
            # The name Envoy DIALS: the Service in templates/supabase/studio.yaml.
            - name: STUDIO_UPSTREAM_ADDRESS
              value: supabase-studio
            # ------------------------------------------------------------------------------
            # The forge listener's inputs (0094). It shares the JWKS key and SUPABASE_PUBLIC_URL
            # with Studio's. OPTIONAL refs for the reason Studio's are -- an operator's existing
            # Secret predates them -- with the init container's fail-closed branch covering
            # the absent case.
            # ------------------------------------------------------------------------------
            - name: GITEA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: GITEA_OAUTH_CLIENT_SECRET
                  optional: true
            - name: GITEA_PROXY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "acs-cymru.secretName" . }}
                  key: GITEA_PROXY_HMAC_SECRET
                  optional: true
            # The address the BROWSER reaches the forge on: the same helper Gitea's ROOT_URL and
            # the Ingress host come from, so the three cannot disagree.
            - name: GITEA_PUBLIC_URL
              value: {{ include "acs-cymru.giteaUrl" . | quote }}
            # The name Envoy DIALS -- the Service in templates/apps/gitea.yaml.
            - name: GITEA_UPSTREAM_ADDRESS
              value: gitea
          volumeMounts:
            - name: template
              mountPath: /template
            - name: config
              mountPath: /config
      containers:
        - name: envoy
          image: "{{ .Values.supabaseEnvoy.image.repository }}:{{ .Values.supabaseEnvoy.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseEnvoy.image.pullPolicy }}
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - {{ .Values.supabaseEnvoy.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8000
            # Studio's listener. Declared unconditionally because the bootstrap declares it
            # unconditionally -- the port is open in the pod whether or not `ingress.routes.studio`
            # publishes it, and a containerPort that disagreed with the config would make the pod
            # describe itself wrongly without changing what it serves.
            - name: studio
              containerPort: 8001
            # The forge's listener, declared unconditionally for the same reason.
            - name: forge
              containerPort: 8002
            {{- if .Values.supabaseEnvoy.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.supabaseEnvoy.metrics.port }}
            {{- end }}
          # `/ready` on the admin listener answers 200 only once the listener is serving. Envoy
          # exits non-zero on a config it cannot parse, so a bad translation is a CrashLoopBackOff
          # rather than a gateway answering 404 for everything.
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.supabaseEnvoy.metrics.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.supabaseEnvoy.metrics.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.supabaseEnvoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: {{ printf "%s-envoy-template" $fullname }}
        # emptyDir, not a Secret: the rendered file carries both API keys and must not outlive the
        # pod or appear in any manifest.
        - name: config
          emptyDir: {}
{{- end }}
