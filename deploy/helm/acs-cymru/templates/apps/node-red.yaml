{{- if .Values.nodeRed.enabled }}
{{- $component := "node-red" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $flow := .Files.Get "files/node-red/node_red_flow.json" -}}
{{- $initScript := .Files.Get "files/node-red-scripts/node-red-init.mjs" -}}
{{- if or (not $flow) (not $initScript) }}
{{- fail "\n\nacs-cymru: files/node-red/node_red_flow.json and/or files/node-red-scripts/node-red-init.mjs are missing.\n\nMirror them with:  node scripts/sync-helm-chart-files.mjs\n\nWithout the init script Node-RED comes up with NO settings.js -- which means no adminAuth, no\nhttpNodeAuth, and the editor plus the /flows admin API plus POST /hooks/quarantine all open to\nanyone who can reach port 1880.\n" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-node-red-seed" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  # Mounted at /seed/flows.json -- the path node-red-init.mjs defaults to (NODE_RED_SEED_FLOW).
  flows.json: |
{{ $flow | indent 4 }}
  node-red-init.mjs: |
{{ $initScript | indent 4 }}
---
{{- if .Values.nodeRed.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-node-red" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    # Survives `helm uninstall`. /data holds the live flow (which an operator may have edited in the
    # editor), the encrypted credentials, and the persisted editor sessions and user map.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - {{ .Values.nodeRed.persistence.accessMode }}
  {{- include "acs-cymru.storageClass" (dict "ctx" . "component" .Values.nodeRed.persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.nodeRed.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  # THE NAME IS `node-red`, matching the Compose service name: the deploy-nodered edge function
  # reaches it as http://node-red:1880/flows, and webhook_endpoints seeds
  # http://node-red:1880/hooks/quarantine as the pg_net target. Neither changes between targets.
  name: node-red
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 1880
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.nodeRed.replicas }}
  strategy:
    # Recreate. Node-RED is a single-writer runtime: two instances against one /data race on
    # flows.json, .sessions.json and the editor-user map. It is also a ReadWriteOnce PVC, so a
    # rolling update's second pod could not bind the volume anyway.
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Roll when the seeded flow or the init script changes. node-red-init only RE-seeds the flow
        # when forceSeed is set, so this mostly makes a settings.js regeneration take effect.
        checksum/seed: {{ printf "%s%s" $flow $initScript | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/*
        M5. The `node-red` user is uid/gid 1000, and local-path hands over a root-owned directory.

        THIS REPLACES the `chown -R 1000:1000 /data` the Compose init entrypoint runs -- Kubernetes
        does it natively on volume mount, and OnRootMismatch avoids a recursive chgrp on every
        restart. The initContainer below therefore does NOT chown, which is the one difference
        between the two targets' provisioning.
      */}}
      securityContext:
        {{- toYaml .Values.nodeRed.podSecurityContext | nindent 8 }}
      initContainers:
        {{/*
          =========================================================================================
          node-red-init, AS AN initContainer BUILT FROM THE SAME IMAGE AS THE MAIN CONTAINER.

          THE SHARED IMAGE IS LOAD-BEARING, not tidiness. settingsAreCorrect() in
          node-red-init.mjs EVALUATES the settings.js it finds, and that file `require`s
          passport-oauth2 and jsonwebtoken by absolute path into the image's node_modules. An init
          image without them throws on the require -- and that throw is already handled as
          "unloadable, replace it", so the script rewrites settings.js and CLOBBERS settings.js.bak
          on every single boot, silently. If the log says `settings.js written` on more than the
          first boot, this is why.

          One image value feeds both containers, so they cannot drift apart.

          THREE WRITES WITH THREE LIFETIMES, and collapsing them behind one guard is what broke the
          Compose stack twice: the FLOW is user content (seed once, guarded on
          /data/.factoryplus-seeded), while settings.js and the CREDENTIALS are stack configuration
          that must be reconciled on every boot -- a volume outlives a fix.
          =========================================================================================
        */}}
        - name: node-red-init
          image: {{ include "acs-cymru.image" (dict "image" .Values.nodeRed.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.nodeRed.image.pullPolicy }}
          command: ["node", "/seed/node-red-init.mjs"]
          env:
            {{/*
              THE SHARED AUTH BLOCK, included here AND in the main container below.

              BOTH MUST RECEIVE IT, IDENTICALLY. settings.js resolves every one of these from
              process.env at load time, and settingsAreCorrect() evaluates that same file from
              here. A value present when the file is written and absent when it is read makes the
              settings look wrong on every boot and get rewritten forever. This is the chart's
              counterpart to docker-compose.yml's `x-nodered-auth-env` anchor and exists for
              exactly that reason -- one definition, included twice.
            */}}
            {{- include "acs-cymru.noderedAuthEnv" . | nindent 12 }}
            {{- /*
              THE SIMULATOR IS OPT-IN (roadmap §14), and this is the Kubernetes half of the same
              switch `NODE_RED_SEED_SIMULATOR` gives Compose. Unset, node-red-init seeds a one-node
              "Start here" flow declaring no broker nodes, so a fresh install publishes nothing and
              generates no assets -- matching a database that now seeds none either.

              THE FLOW ConfigMap IS STILL MOUNTED EITHER WAY, and that is deliberate. It costs one
              projected volume, it is what `NODE_RED_SEED_SIMULATOR=true` plus a pod restart then
              reads, and gating the MOUNT as well would turn a values flip into a values flip that
              also has to be right about which volumes exist.

              It shares `simulation.grafana.enabled`'s parent key rather than inventing a second
              top-level flag: one `simulation:` block, one thing being switched on.
            */}}
            - name: NODE_RED_SEED_SIMULATOR
              value: {{ .Values.simulation.nodeRed.enabled | quote }}
            # node-red-init also writes the broker credentials into flows_cred.json, so it needs
            # these two on top of the auth block.
            {{- /*
              A GATEWAY CREDENTIAL, not a shared platform account: mosquitto.acl's
              `pattern readwrite spBv1.0/+/+/%u/#` pins the topic's edge-node segment to the
              username, so it must be a gateway's generated `sparkplug_id`. A friendly name here
              authenticates fine and then has every publish silently dropped by the broker.

              THIS PAIR IS THE LEGACY FALLBACK. node-red-init applies it only to a
              `mqtt-broker-config` node, which no longer exists in the shipped flow -- the
              consolidated `Simulated Shopfloor` tab carries one broker per cell gateway, each
              naming its own credential pair. It is still passed because a Node-RED PVC created
              before that consolidation still holds the old flow.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_SIMULATOR_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASSWORD" "secretName" $secretName "key" "MQTT_SIMULATOR_PASSWORD") | nindent 12 }}
            {{- /*
              AND THE PAIRS THE SHIPPED FLOW ACTUALLY DECLARES, one per cell gateway.

              node-red-init reads `acsCredentialsEnv` off each broker node and FAILS CLOSED when the
              named pair is absent -- deliberately, because the alternative is seeding an empty
              username, which the broker refuses with CONNACK 5 while Node-RED reports only
              "Connection failed to broker: <clientId>@<url>", naming the client id rather than the
              username and reading identically to a wrong host.

              So an install missing these does not get a quiet simulator: this init container exits 1
              and Node-RED never starts. Passed to the INIT container only -- the runtime reads the
              credentials from flows_cred.json, which this writes.
            */}}
            {{- range $p := list "GW_CNC_MACHINING" "GW_ROBOTIC_ASSEMBLY" "GW_AGV_FLEET" "GW_FACILITY_BMS" }}
            {{- include "acs-cymru.secretEnv" (dict "name" (printf "MQTT_%s_USER" $p) "secretName" $secretName "key" (printf "MQTT_%s_USER" $p)) | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" (printf "MQTT_%s_PASSWORD" $p) "secretName" $secretName "key" (printf "MQTT_%s_PASSWORD" $p)) | nindent 12 }}
            {{- end }}
            {{/*
              The broker's transport, from the same helper the ingestion daemon uses.

              node-red-init reconciles the mqtt-broker node in flows.json from these -- port,
              usetls, and a tls-config node pointing at the CA. It is the init container and not the
              runtime that does it because the flow has to be correct on disk BEFORE Node-RED reads
              it; Node-RED has no way to take a broker port from the environment.
            */}}
            {{- include "acs-cymru.brokerClientEnv" . | nindent 12 }}
            - name: NODE_RED_FORCE_SEED
              value: {{ .Values.nodeRed.forceSeed | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
            {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
            {{- /* Mounted here as well as in the runtime so the init container can FAIL on an absent
                   CA. Node-RED itself would report only a generic "Connection failed to broker",
                   identical to a wrong password, with certificates never mentioned. */}}
            {{- include "acs-cymru.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: node-red
          image: {{ include "acs-cymru.image" (dict "image" .Values.nodeRed.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.nodeRed.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 1880
              protocol: TCP
          env:
            # The same block the initContainer got -- see the note there for why parity matters.
            {{- include "acs-cymru.noderedAuthEnv" . | nindent 12 }}
          {{/*
            PROBED ON `/` WITH NO CREDENTIALS, and that needs saying because it looks wrong.

            settings.js declares adminAuth, so the editor at / redirects rather than serving --
            which is still a 2xx/3xx and proves the runtime loaded settings.js and is serving. What
            it deliberately does NOT do is assert authorisation works: BOTH of the editor defects
            this stack has hit answered 200 on the calls a status-only probe makes. One 401'd only
            AFTER login; the other returned a perfectly healthy /settings whose `user` object was
            missing `permissions`.

            So a probe is the wrong instrument for that, and validate.py check 7b is the right one:
            it signs in for real and asserts the permissions VALUE. Keep the probe cheap and keep
            the assertion in the conformance suite.
          */}}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.nodeRed.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
            {{- /* The runtime reads this path when the flow is deployed -- tls-config's certType is
                   `files`, so `ca` is read with fs.readFileSync, not baked into the flow. */}}
            {{- include "acs-cymru.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
        {{- include "acs-cymru.brokerClientCaVolume" . | nindent 8 }}
        {{- end }}
        - name: data
          {{- if .Values.nodeRed.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-node-red" $fullname }}
          {{- else }}
          {{/*
            An emptyDir loses the encrypted credentials, the persisted editor sessions AND
            /data/.factoryplus-editor-users.json on every restart. That last one is the nasty part:
            without it a live Administrator silently degrades to a read-only editor -- Node-RED
            draws a padlock on Deploy -- while the admin API would still accept the deploy. It is
            not a logout, so nothing tells the user. Only for throwaway testing.
          */}}
          emptyDir: {}
          {{- end }}
        - name: seed
          configMap:
            name: {{ printf "%s-node-red-seed" $fullname }}
{{- end }}
