{{- if .Values.ingestion.enabled }}
{{- $component := "ingestion" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{/*
=================================================================================================
The Sparkplug B ingestion daemon: MQTT -> Supabase (metadata, quarantine) + TimescaleDB (telemetry).

NO SERVICE FOR ITS WORK, ONE FOR ITS METRICS. It is a pure consumer -- it subscribes to
`spBv1.0/#` and writes to two databases -- so nothing calls it and there is no application traffic
to expose. The headless Service at the foot of this file carries the `/metrics` port and nothing
else, because a ServiceMonitor selects Services rather than Pods (issue #22).
=================================================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  {{/*
    ============================================================================================
    EXACTLY ONE REPLICA. THIS IS NOT A TUNABLE, AND SCALING IT CORRUPTS DATA.

    Spelled out here because Kubernetes makes `replicas: 2` a one-word change, and the damage is
    silent -- no error, no crash, just wrong data:

      * DOUBLE-CONSUMPTION. ingestion.py does a plain paho subscribe with NO shared-subscription
        group ($share/...), so every broker message is delivered to EVERY replica. Two replicas
        means two INSERTs per telemetry sample. The historian insert is ON CONFLICT DO NOTHING and
        the hypertable's key includes `time`, so duplicates land as separate rows whenever the
        timestamps differ by a microsecond -- which they do, because each replica stamps its own.
      * DUPLICATED QUARANTINE DECISIONS. An unknown device makes both replicas race to insert the
        same row, and each writes a digital_thread audit row via the trigger. digital_thread is
        APPEND-ONLY, so that noise is permanent.
      * DOUBLED HEARTBEATS. Every replica stamps gateways.last_heartbeat, firing the pg_net
        quarantine webhook's UPDATE trigger twice per beat.

    Scaling this out means adding MQTT v5 shared subscriptions to ingestion.py first. Until then,
    one.

    `replicas` is not templated for the same reason: values should not offer the choice.
    ============================================================================================
  */}}
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. A rolling update runs the new pod alongside the old one, which
    # is momentarily the two-replica case above -- brief, but it lands duplicate telemetry every
    # single deploy.
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      {{- if .Values.ingestion.metrics.enabled }}
      annotations:
        {{- include "acs-cymru.scrapeAnnotations" (dict "port" .Values.ingestion.metrics.port "path" "/metrics") | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          Waits for the API gateway, which is how EVERY device lookup is made (SUPABASE_URL is
          http://supabase-kong:8000). The Compose target declares the same dependency.

          ORDERING ONLY. The property that makes an unresolvable lookup harmless lives in
          ingestion.py: an unreachable directory raises DirectoryUnavailable instead of resolving
          to None, because process_dbirth() answers None -- "unregistered" -- by writing a
          quarantine row, which persists and needs an operator to clear. Relying on start order
          for that would leave the same fault reachable any time Kong restarts.
        */}}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-kong" "image" "curlimages/curl:8.10.1" "command" "curl -sf -o /dev/null http://supabase-kong:8000/auth/v1/health" "describe" "supabase-kong (every device lookup is routed through it)") | nindent 8 }}
        {{/*
          Waits for the historian's SCHEMA, not just for the server. The daemon writes to the
          `telemetry` hypertable on its first DDATA, and TimescaleDB's bootstrap scripts run only on
          an empty data directory -- so "server up" and "schema present" are genuinely different
          states here. Without this the daemon starts, connects, and fails on the first sample with
          a relation error that reads as a code fault.
        */}}
        - name: wait-for-telemetry-table
          image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
          env:
            {{- include "acs-cymru.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              deadline=$(( $(date +%s) + {{ .Values.initJobs.waitTimeout }} ))
              until psql -h {{ include "acs-cymru.timescale.host" . }} -p {{ include "acs-cymru.timescale.port" . }} \
                        -U {{ .Values.timescaledb.username }} -d {{ .Values.timescaledb.database }} -tAc \
                        "SELECT 1 FROM information_schema.tables WHERE table_name = 'telemetry'" \
                    2>/dev/null | grep -q 1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "timed out waiting for the telemetry hypertable (created by timescaledb/init on an EMPTY data directory)" >&2
                  exit 1
                fi
                echo "waiting for the telemetry hypertable ..."
                sleep 3
              done
              echo "telemetry hypertable exists"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: ingestion
          # BUILT FROM ingestion/Dockerfile with the REPOSITORY ROOT as context (it compiles
          # sparkplug_b.proto with protoc at build time, and the .proto is at the root), not
          # pulled:  docker build -f ingestion/Dockerfile -t <repo>:<tag> .
          image: {{ include "acs-cymru.image" (dict "image" .Values.ingestion.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
          env:
            {{- /*
              The Prometheus endpoint (issues #22, #24). 0 disables it in ingestion.py -- see
              start_metrics_endpoint(), where the disable is a CONFIGURATION decision; metrics.py
              treats port 0 as "ask the OS for a free one", as the socket API does everywhere else.
            */}}
            - name: INGESTION_METRICS_PORT
              value: {{ ternary (.Values.ingestion.metrics.port | toString) "0" .Values.ingestion.metrics.enabled | quote }}
            # TimescaleDB. M2: the in-cluster name and the STANDARD port -- 5433 is only
            # docker-compose's published port and means nothing here.
            - name: DB_HOST
              value: {{ include "acs-cymru.timescale.host" . | quote }}
            - name: DB_PORT
              value: {{ include "acs-cymru.timescale.port" . | quote }}
            - name: DB_NAME
              value: {{ .Values.timescaledb.database | quote }}
            {{- /*
              WHICH ROLE THIS DAEMON HOLDS ON THE HISTORIAN.

              It connected as the admin user, which is superuser there: the process most exposed to
              the plant network could DROP the hypertable and rewrite any observation, while the
              README's security model listed "append-only historian writes" as a control at this
              layer. `ingest_writer` (timescaledb/roles.sql) makes that claim a grant.

              THE PASSWORD FOLLOWS THE USER rather than being set beside it. One setting decides
              both, so they cannot disagree -- a dbUser of `ingest_writer` paired with the admin
              password is a stack that fails to authenticate and reports it as a database outage.

              DEFAULTS TO WHAT IT WAS. An upgrade that sets nothing keeps the admin credential, so
              this cannot break a deployment that has not opted in. Set ingestion.dbUser only AFTER
              secrets.ingestWriterPassword is set and the maintenance Job has created the role --
              the reverse order points the daemon at a role that does not exist.
            */}}
            {{- $ingestUser := .Values.ingestion.dbUser | default .Values.timescaledb.username }}
            {{- $ingestPwKey := ternary "INGEST_WRITER_PASSWORD" "DB_PASSWORD" (eq $ingestUser "ingest_writer") }}
            - name: DB_USER
              value: {{ $ingestUser | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" $ingestPwKey) | nindent 12 }}
            {{- /* Host, port and TLS from one shared helper, so this and Node-RED cannot drift. */}}
            {{- include "acs-cymru.brokerClientEnv" . | nindent 12 }}
            {{- /*
              THE INGESTION PRINCIPAL AND NOTHING WIDER. The broker's roles grant it `read spBv1.0/#`
              plus `write spBv1.0/+/NCMD/+`, which is exactly what this daemon does -- it is a
              consumer whose only publish() is the rebirth NCMD. It CANNOT publish DBIRTH or DDATA,
              so this credential cannot forge telemetry for a device that is correctly bound to its
              gateway: the one forgery verify_gateway_binding() cannot detect, because such a
              message satisfies it by construction.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" $secretName "key" "MQTT_INGESTION_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASSWORD" "secretName" $secretName "key" "MQTT_INGESTION_PASSWORD") | nindent 12 }}
            # Through Kong, in-cluster. THE DAEMON IS NOT A SERVICE-ROLE CLIENT: that key
            # bypasses RLS entirely and would sit in the process most exposed to the
            # plant network. It registers discovered devices, sets is_quarantined and stamps
            # gateway heartbeats through the SECURITY DEFINER gates in archived migration 0047, as the
            # Service_Ingestor principal seeded by 0046.
            #
            # BOTH KEYS, DOING DIFFERENT JOBS. The anon key is the apikey the gateway checks --
            # its filter admits exactly two literal keys, so the ingestion token is refused at the
            # edge if sent in its place. The ingestion token is the Authorization bearer.
            - name: SUPABASE_URL
              value: {{ include "acs-cymru.supabase.internalUrl" . | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_ANON_KEY" "secretName" $secretName "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            {{- include "acs-cymru.optionalSecretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_INGESTION_KEY" "secretName" $secretName "key" "SUPABASE_INGESTION_KEY") | nindent 12 }}
            - name: PYTHONUNBUFFERED
              value: "1"
            # JSON log lines, as on Compose: `reason`, `device` and `edge_node` are top-level keys,
            # which is what a Loki `| json` query filters on. This sat on the init container's env
            # until the first live log-pipeline run against the chart found the daemon logging prose.
            - name: LOG_FORMAT
              value: "json"
            # Enables the heartbeat the liveness probe reads. UNSET IS A NO-OP, which is why the
            # Compose path is unaffected by any of this.
            - name: INGESTION_HEALTH_FILE
              value: {{ .Values.ingestion.healthFile | quote }}
            - name: INGESTION_HEALTH_INTERVAL
              value: {{ .Values.ingestion.healthIntervalSeconds | quote }}
            {{/*
              Device liveness and Sparkplug rebirth. Both targets must carry the same values --
              validate.py runs against Compose AND in-cluster, and its watchdog check reads these
              names from its own environment to decide whether the window is short enough to wait
              for. A chart that quietly used a different default would make that check assert
              against a timeout the daemon does not have.
            */}}
            - name: DEVICE_OFFLINE_TIMEOUT_SECONDS
              value: {{ .Values.ingestion.deviceOfflineTimeoutSeconds | quote }}
            - name: DEVICE_WATCHDOG_INTERVAL_SECONDS
              value: {{ .Values.ingestion.deviceWatchdogIntervalSeconds | quote }}
            - name: REBIRTH_REQUEST_INTERVAL_SECONDS
              value: {{ .Values.ingestion.rebirthRequestIntervalSeconds | quote }}
            {{/*
              The Directory's MQTT half. Passed unconditionally rather than behind an `if`, so that
              the daemon logs which of the two states it is in on every boot -- a publisher that is
              off and silent is indistinguishable from one that is on and failing, and only the
              second is a fault. See values.yaml for why the default is false.
            */}}
            - name: DIRECTORY_MQTT_ENABLED
              value: {{ .Values.ingestion.directoryMqttEnabled | quote }}
            - name: DIRECTORY_MQTT_TOPIC_PREFIX
              value: {{ .Values.ingestion.directoryMqttTopicPrefix | quote }}
            - name: DIRECTORY_MQTT_INTERVAL_SECONDS
              value: {{ .Values.ingestion.directoryMqttIntervalSeconds | quote }}
            {{/* The Unified Namespace bridge, passed unconditionally for the same reason. */}}
            - name: UNS_MQTT_ENABLED
              value: {{ .Values.ingestion.unsMqttEnabled | quote }}
            - name: UNS_MQTT_TOPIC_ROOT
              value: {{ .Values.ingestion.unsMqttTopicRoot | quote }}
            - name: UNS_CONTEXT_TTL_SECONDS
              value: {{ .Values.ingestion.unsContextTtlSeconds | quote }}
          {{/*
            LIVENESS ON A HEARTBEAT FILE'S AGE.

            This is the one failure Kubernetes can fix here for free, and Compose cannot detect at
            all: paho's network loop dies, the process stays alive, and the daemon silently stops
            ingesting. Nothing crashes, nothing logs, and telemetry just stops arriving.

            ingestion.py's heartbeat thread writes this file every INGESTION_HEALTH_INTERVAL
            seconds ONLY WHILE `client.is_connected()`, so a wedged or disconnected loop lets the
            file go stale and this probe restarts the pod. The write is also deliberately forgiving
            of IO errors -- a read-only filesystem stops the heartbeat, which correctly reports
            unhealthy rather than crashing a daemon that is otherwise fine.

            THE THRESHOLD IS DELIBERATELY SLACK: 3 x the write interval before a single failure,
            then 3 consecutive failures. A broker restart drops the connection briefly and the
            daemon reconnects on its own; killing the pod for that would turn a two-second blip
            into a full restart cycle.
          */}}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -n "$(find {{ .Values.ingestion.healthFile }} -newermt '-{{ mul .Values.ingestion.healthIntervalSeconds 3 }} seconds' 2>/dev/null)"
            # First check only after the daemon has had time to connect and write once.
            initialDelaySeconds: {{ mul .Values.ingestion.healthIntervalSeconds 3 }}
            periodSeconds: {{ .Values.ingestion.healthIntervalSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.ingestion.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ingestion.metrics.port }}
              protocol: TCP
          {{- end }}
          {{/*
            NO READINESS PROBE, AND THE REASON HAS CHANGED RATHER THAN GONE AWAY.

            It used to be that this pod backed no Service, so readiness had no consumer. It now
            backs one -- the metrics Service below, added for issue #22 -- and readiness would
            therefore start gating something: Prometheus stops scraping a target whose pod is not
            Ready.

            That is precisely the wrong behaviour here. The moment worth scraping is the one where
            the daemon is unhealthy, and a readiness probe would remove the evidence exactly then.
            `acs_ingestion_up` and a flat `messages_total` say "running but consuming nothing",
            which is a diagnosis; a target that has vanished says only that something is wrong
            somewhere.

            Liveness above still restarts a wedged daemon, which is the failure Kubernetes can fix.
          */}}
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
          {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
          volumeMounts:
            {{- include "acs-cymru.brokerClientCaMount" . | nindent 12 }}
          {{- end }}
      {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
      volumes:
        {{- include "acs-cymru.brokerClientCaVolume" . | nindent 8 }}
      {{- end }}

{{- if .Values.ingestion.metrics.enabled }}
---
{{/*
A SERVICE THAT EXISTS ONLY TO BE SCRAPED.

The daemon serves no application traffic -- it is an MQTT client and a database writer, and nothing
in the cluster calls it. This Service exists because a ServiceMonitor selects Services, not Pods,
which is the one piece of plumbing between a `/metrics` endpoint and a Prometheus that will read it.

`clusterIP: None` because there is nothing to load-balance: the workload is pinned to one replica
(it holds an unshared `spBv1.0/#` subscription) and a headless Service gives the operator the pod
endpoint directly rather than a virtual IP in front of a single backend.

publishNotReadyAddresses IS DELIBERATE. There is no readiness probe here, but this states the
intent rather than relying on its absence: an unhealthy daemon is exactly what someone wants to
scrape, and a Service that withdrew the endpoint would take the evidence away at the only moment
it mattered.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: ingestion-metrics
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.ingestion.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- end }}
