{{/*
i3X 1.0 server (CESMII Industrial Information Interoperability eXchange).

A READ-SIDE ADAPTER. Metadata comes from PostgREST and current values from the MQTT broker; it owns
no data and nothing upstream knows it exists.

REPLICAS: 1 IS A CORRECTNESS CONSTRAINT, not a default, and for two independent reasons:

  * It holds a plain `spBv1.0/#` subscription with no shared-subscription group, so every replica
    would consume every message -- the same reason ingestion is pinned to one.
  * Subscription state is IN MEMORY. Queues, sequence numbers and open SSE streams live in the
    process. A second replica would answer `/subscriptions/sync` for a subscriptionId it has never
    seen and return 404 to a client whose subscription is perfectly alive, intermittently, depending
    on which pod the Service picked.

`Recreate` for the same reason: a rolling update would briefly run two, which is exactly the state
the replica count exists to prevent.
*/}}
{{- if .Values.i3xService.enabled }}
{{- $component := "i3x-service" }}
{{- $fullname := include "acs-cymru.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i3x-service
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        {{/*
          The broker port follows the SAME switch as the client env below and as the NetworkPolicy
          edge -- 8883 once in-cluster clients are on TLS. A hardcoded 1883 here would wait on a
          port nothing is listening on the moment `mosquitto.tls.internalClients` is turned on, and
          would report as this service alone failing to start on an otherwise healthy stack.
        */}}
        {{- $brokerPort := ternary 8883 1883 (and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients) }}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-mosquitto" "command" (printf "nc -z mosquitto %d" (int $brokerPort)) "describe" (printf "mosquitto:%d (the spBv1.0/# subscription that feeds every i3X value)" (int $brokerPort))) | nindent 8 }}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-kong" "image" "curlimages/curl:8.10.1" "command" (printf "curl -s -o /dev/null %s/rest/v1/" (include "acs-cymru.supabase.internalUrl" .)) "describe" "supabase-kong (every metadata read is a PostgREST call made as the caller)") | nindent 8 }}
      containers:
        - name: i3x-service
          image: {{ include "acs-cymru.image" (dict "image" .Values.i3xService.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.i3xService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SUPABASE_URL
              value: {{ include "acs-cymru.supabase.internalUrl" . | quote }}
            # THE ANON KEY ONLY. This service authenticates the caller and queries PostgREST as that
            # caller, so RLS -- not this code -- decides what the address space contains. The
            # process REFUSES TO START if SUPABASE_SERVICE_ROLE_KEY is set, which turns a
            # copy-pasted env block into a CrashLoopBackOff with a legible message rather than a
            # silent, total RLS bypass across every asset on the site. Do not add the service-role
            # key here "for convenience".
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_ANON_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            {{- include "acs-cymru.brokerClientEnv" . | nindent 12 }}
            {{- /*
              THE BROKER CREDENTIAL WAS MISSING HERE ENTIRELY, and this is a fix rather than a
              rename. brokerClientEnv carries host, port and TLS only, so on Kubernetes this pod
              connected anonymously to a broker running `allow_anonymous false` -- refused with
              CONNACK 5, after which i3x_service falls back to its Python default and Compose
              happened to supply the shared account that no longer exists. The service came up,
              answered /info, and served an address space whose values never updated.

              READ-ONLY, and separate from the ingestion account on purpose: this server refuses
              writes in code (405 on PUT /objects/value, `update.current: false`), and that stance
              is worth more when the broker enforces it too -- a credential that cannot publish
              cannot be talked into publishing.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_USER" "secretName" (include "acs-cymru.secretName" .) "key" "MQTT_I3X_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_PASSWORD" "secretName" (include "acs-cymru.secretName" .) "key" "MQTT_I3X_PASSWORD") | nindent 12 }}
            - name: I3X_SUBSCRIPTION_TTL_SECONDS
              value: {{ .Values.i3xService.subscriptionTtlSeconds | quote }}
            - name: I3X_SUBSCRIPTION_QUEUE_LIMIT
              value: {{ .Values.i3xService.subscriptionQueueLimit | quote }}
            - name: I3X_SERVER_NAME
              value: {{ .Values.i3xService.serverName | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          # GET /info is the health probe, and that is a design property rather than a convenience:
          # the spec requires it to be unauthenticated precisely so it can serve as one, which means
          # no credential has to be mounted into a probe.
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            # Generous, because a liveness restart drops every open SSE stream and every in-memory
            # subscription queue with it. A slow /info is not worth that.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.i3xService.resources | nindent 12 }}
          volumeMounts:
            {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
            {{- include "acs-cymru.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
            # `readOnlyRootFilesystem: true` above means the image's own filesystem is immutable, so
            # anything that needs a scratch path needs this. Python does not write files here, but
            # the interpreter and OpenSSL both use TMPDIR opportunistically, and a read-only /tmp
            # fails as an unrelated-looking error deep in a library rather than as a permission
            # problem at the path.
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
        {{- include "acs-cymru.brokerClientCaVolume" . | nindent 8 }}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: i3x-service
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
{{- end }}
