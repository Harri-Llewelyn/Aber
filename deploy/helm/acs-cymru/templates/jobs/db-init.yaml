{{- if and .Values.initJobs.enabled .Values.supabaseDb.enabled }}
{{- $component := "db-init" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
---
{{/*
The migrations and the seed, as ConfigMaps.

MIRRORED from supabase/migrations/ and supabase/seed.sql by scripts/sync-helm-chart-files.mjs --
Helm cannot read outside its chart. CI runs that script with --check.

THE MIGRATIONS ARE GZIPPED, ONE ARCHIVE PER FILE, IN `binaryData`.

A ConfigMap cannot exceed 1 MiB. That is an etcd object limit rather than a Kubernetes preference,
and breaching it fails at APPLY time with "Request entity too large" -- naming the ConfigMap and not
the file that grew, on an upgrade that was working yesterday. The chain reached 878 KiB, 85% of it,
and only grows: 57% of those bytes are generated reference vocabulary (ASHRAE 223P alone is 339 KiB,
MTConnect 2.8 is 598 rows) and it is the kind of content that arrives in one commit.

Compressed it is ~150 KiB, ~200 KiB once base64-encoded into this manifest -- 20% of the limit, with
room for several more vocabularies of that size. SQL is close to ideal input for it: thousands of
near-identical INSERTs over a handful of tables.

SQUASHING THE CHAIN WAS THE OTHER CANDIDATE AND CANNOT REACH THE GOAL. The generated vocabulary and
the SQL statements -- 81% of the bytes between them -- have to survive verbatim into whatever
replaces them, so the floor is ~703 KiB, still 69% of the limit, and one more ASHRAE-sized
vocabulary exceeds it either way. The only thing a squash removes at scale is the 163 KiB of
migration headers, which is where this repository keeps the reasoning for every schema guard.

ONE KEY PER MIGRATION, not a single tarball, at a cost of ~12 KiB against compressing the
concatenation. It keeps the apply loop below ordering on filenames, keeps the sync script's orphan
sweep working, and keeps a single migration individually retrievable.

COMPOSE APPLIES THE PLAIN FILES and is untouched -- it bind-mounts supabase/migrations/ directly. So
the two targets differ in transport and not in content, and the sync check proves it by comparing
DECOMPRESSED bytes rather than archives (the gzip OS byte differs between a Windows and a Linux
build, which would otherwise report drift on every CI run).

supabase/migrations/archive/ is NOT included, and that is load-bearing rather than an oversight:
those are the 38 pre-beta migrations, preserved as reasoning and deliberately never executed. The
sync script does not recurse, which is what keeps them out.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-migrations" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT -5: the ConfigMaps must exist before the Job that mounts them. A hook resource
    # created at the same weight as its consumer is a race that usually wins and occasionally
    # does not.
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
binaryData:
{{- $found := 0 }}
{{- range $path, $bytes := .Files.Glob "files/migrations/*.sql.gz" }}
{{- $found = add1 $found }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc | quote }}
{{- end }}
{{- if eq $found 0 }}
{{- fail "\n\nacs-cymru: no migrations found at files/migrations/*.sql.gz\n\nMirror them with:  node scripts/sync-helm-chart-files.mjs\n\nThese are GZIPPED now -- a chart still carrying plain .sql mirrors predates that change and needs\na re-sync. Failing the render rather than installing an empty ConfigMap is deliberate: db-init would\nrun, find nothing to apply, exit 0, and every downstream service would then fail against a database\nwith no schema -- which reads as a dozen unrelated faults rather than as one missing step.\n" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-seed" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- range $path, $bytes := .Files.Glob "files/seed/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-db-init" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT 10 -- after db-roles-init (0), before storage-init (20).
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "acs-cymru.waitForPostgres" (dict "ctx" . "name" "wait-for-supabase-db" "host" (include "acs-cymru.supabaseDb.host" .) "port" (include "acs-cymru.supabaseDb.port" .) "user" "postgres" "db" "postgres" "passwordKey" "POSTGRES_PASSWORD") | nindent 8 }}
        {{- if .Values.supabaseAuth.enabled }}
        {{/*
          WAITING FOR GOTRUE IS NOT OPTIONAL, and it is the ordering constraint that is easiest to
          miss: GoTrue creates and owns the `auth` schema, and the migrations build on it --
          auth.users, auth.oauth_clients, the auth.uid()/auth.jwt() helpers every RLS policy calls.
          Run them first and 0001 fails part-way through, leaving a HALF-APPLIED SCHEMA, which is
          the worst outcome available here because the next replay starts from an inconsistent
          state rather than a clean one.

          docker-compose expresses this as `depends_on: supabase-auth: condition: service_healthy`.
        */}}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-auth" "image" "curlimages/curl:8.10.1" "command" "curl -sf http://supabase-auth:9999/health >/dev/null 2>&1" "describe" "supabase-auth (it owns the auth schema the migrations build on)") | nindent 8 }}
        {{- end }}
      containers:
        - name: db-init
          image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
          env:
            {{- include "acs-cymru.secretEnv" (dict "name" "PGPASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            # TimescaleDB connection, handed to the migrations as psql variables so
            # 0001_baseline_schema.sql can build its postgres_fdw link without hardcoding
            # credentials.
            #
            # M2: HOST timescaledb, PORT 5432 -- the in-cluster address and the port the server
            # listens on. NOT 5433, which is only docker-compose's published port. A foreign server
            # pointed at 5433 fails as a relation-level error from PostgREST, which reads as a
            # schema fault; `helm test` (M6) queries the foreign table to catch exactly that.
            - name: TS_HOST
              value: {{ include "acs-cymru.timescale.host" . | quote }}
            - name: TS_PORT
              value: {{ include "acs-cymru.timescale.port" . | quote }}
            - name: TS_DBNAME
              value: {{ .Values.timescaledb.database | quote }}
            - name: TS_USER
              value: {{ .Values.timescaledb.username | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "TS_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "NODERED_ADMIN_TOKEN" "secretName" $secretName "key" "NODERED_ADMIN_TOKEN") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "GRAFANA_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "GRAFANA_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "NODERED_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "NODERED_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "NODERED_WEBHOOK_JWT_SECRET" "secretName" $secretName "key" "NODERED_WEBHOOK_JWT_SECRET") | nindent 12 }}
            # M3. These two are why changing an ingress hostname is safe: both client rows are
            # upserted with DO UPDATE from these values on every replay, so a `helm upgrade` that
            # changes publicBaseDomain re-registers the OAuth clients in the SAME operation. A
            # hardcoded URL in the seed is rewritten back on every boot instead -- which is exactly
            # what Grafana's did until it was parameterised.
            - name: GRAFANA_PUBLIC_URL
              value: {{ include "acs-cymru.grafanaUrl" . | quote }}
            - name: NODERED_OAUTH_CALLBACK_URL
              value: {{ printf "%s/auth/strategy/callback" (include "acs-cymru.noderedUrl" .) | quote }}
          command:
            - /bin/sh
            - -e
            - -c
            - |
              PSQL="psql -v ON_ERROR_STOP=1 -h {{ include "acs-cymru.supabaseDb.host" . }} -p {{ include "acs-cymru.supabaseDb.port" . }} -U postgres -d postgres"

              echo 'Configuring PostgreSQL search_path...'
              $PSQL -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;'

              # -------------------------------------------------------------------------------
              # DECOMPRESS FIRST. The ConfigMap carries one gzip archive per migration -- see the
              # header above for why. Expanded into an emptyDir rather than piped straight into
              # psql, for two reasons: `psql -f` wants a path (a pipe would mean `psql -c` with the
              # whole file as one argument, and 262 KiB of SQL through argv is a different failure),
              # and a file on disk is what makes a failed migration inspectable in the pod.
              #
              # FAILS CLOSED. `set -e` is on, so a corrupt archive aborts here rather than leaving
              # the loop below with a short file list to apply successfully and exit 0 -- which
              # would report a healthy init against a partially built schema.
              # -------------------------------------------------------------------------------
              echo 'Decompressing migrations...'
              mkdir -p /tmp/migrations
              for gz in /migrations/*.sql.gz; do
                [ -f "$gz" ] || continue
                base=$(basename "$gz" .gz)
                gunzip -c "$gz" > "/tmp/migrations/$base"
              done

              COUNT=$(ls -1 /tmp/migrations/*.sql 2>/dev/null | wc -l)
              if [ "$COUNT" -eq 0 ]; then
                echo 'No migrations were decompressed from the ConfigMap.' >&2
                echo 'The chart mounts files/migrations/*.sql.gz; re-run: node scripts/sync-helm-chart-files.mjs' >&2
                exit 1
              fi
              echo "Decompressed $COUNT migration(s)."

              # ORDERING IS LEXICAL, matching docker-compose's `for f in /migrations/*.sql`. The
              # numeric prefixes are what make that correct; a migration added without one would
              # sort unpredictably against the rest.
              echo 'Applying Supabase database migrations...'
              for f in /tmp/migrations/*.sql; do
                [ -f "$f" ] || continue
                echo "Executing migration $f..."
                $PSQL \
                  -v ts_host="$TS_HOST" \
                  -v ts_port="$TS_PORT" \
                  -v ts_dbname="$TS_DBNAME" \
                  -v ts_user="$TS_USER" \
                  -v ts_password="$TS_PASSWORD" \
                  -v nodered_admin_token="$NODERED_ADMIN_TOKEN" \
                  -v grafana_oauth_client_secret="$GRAFANA_OAUTH_CLIENT_SECRET" \
                  -v grafana_public_url="$GRAFANA_PUBLIC_URL" \
                  -v nodered_oauth_client_secret="$NODERED_OAUTH_CLIENT_SECRET" \
                  -v nodered_webhook_jwt_secret="$NODERED_WEBHOOK_JWT_SECRET" \
                  -v nodered_redirect_uri="$NODERED_OAUTH_CALLBACK_URL" \
                  -f "$f"
              done

              # Runs AFTER the migrations, not before: it inserts GoTrue users and user_roles rows
              # against tables 0001 creates.
              if [ -f /seed/seed.sql ]; then
                echo 'Executing seed.sql...'
                $PSQL -f /seed/seed.sql
              fi

              echo 'Supabase database initialized successfully.'
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            # Scratch space for the decompressed SQL. An explicit emptyDir rather than relying on
            # the image's writable /tmp: a ConfigMap mount is read-only, so the archives cannot be
            # expanded in place, and declaring the scratch volume means this Job keeps working if
            # the pod is ever hardened with readOnlyRootFilesystem.
            - name: migrations-expanded
              mountPath: /tmp/migrations
            - name: seed
              mountPath: /seed
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: migrations
          configMap:
            name: {{ printf "%s-migrations" $fullname }}
        - name: migrations-expanded
          emptyDir: {}
        - name: seed
          configMap:
            name: {{ printf "%s-seed" $fullname }}
{{- end }}
