{{- if and .Values.initJobs.enabled .Values.supabaseStorage.enabled }}
{{- $component := "storage-init" -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-storage-init" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- range $path, $bytes := .Files.Glob "files/scripts/storage-init.mjs" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-storage-init" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # WEIGHT 20 -- LAST. It calls the Storage REST API, which needs storage-api running, which
    # needs db-init (10) to have created the schema AND db-roles-init (0) to have set
    # supabase_storage_admin's password.
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{/*
          Waits on storage-api's OWN readiness, not just on the database.

          storage-api creates and migrates the `storage` schema on boot. Up to
          supabase/postgres:15.6.1.143 the image shipped a STUB of it (buckets/objects/migrations,
          with no `public` or `file_size_limit` column); 17.6.1.160 ships the schema EMPTY, so
          there is now no stub at all. Either way the conclusion is the same and stronger than
          before: the bucket is created here, through the REST API, rather than by a SQL migration,
          because db-init finishes long before storage-api starts. An INSERT into storage.buckets
          would once have hit the stub and been unable to mark the bucket public; today it would
          hit nothing at all. It would come up PRIVATE (or not at all) on a fresh install, and
          every AAS `File` URL in every exported shell would 404 for a viewer holding no session.

          The RLS policies on storage.objects moved out of 0001 for exactly this reason -- see the
          storage-policies Job, which runs at weight 25.
        */}}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-storage" "image" "curlimages/curl:8.10.1" "command" "curl -sf http://supabase-storage:5000/status >/dev/null 2>&1" "describe" "supabase-storage (it migrates the storage schema on boot)") | nindent 8 }}
      containers:
        - name: storage-init
          image: node:24-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: STORAGE_URL
              value: http://supabase-storage:5000
            {{- include "acs-cymru.secretEnv" (dict "name" "SERVICE_ROLE_KEY" "secretName" (include "acs-cymru.secretName" .) "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            - name: STORAGE_BUCKET
              value: {{ .Values.supabaseStorage.bucket | quote }}
            - name: STORAGE_MODEL_FILE_SIZE_LIMIT
              {{- /* int64 first: `quote` alone renders this float as "5.24288e+07", which
                     storage-init's parseInt reads as 5 -- creating the bucket with a five-byte
                     limit. See the note in supabase/storage.yaml. */}}
              value: {{ .Values.supabaseStorage.modelFileSizeLimit | int64 | quote }}
            - name: GATEWAY_BACKUP_BUCKET
              value: {{ .Values.supabaseStorage.gatewayBackupBucket | quote }}
            - name: CAPTURE_BUCKET
              value: {{ .Values.supabaseStorage.captureBucket | quote }}
            - name: CAPTURE_FILE_SIZE_LIMIT
              {{- /* int64 first, like both of its neighbours and for the same reason: `quote`
                     alone renders 104857600 as "1.048576e+08", which parseInt reads as 1. The
                     capture bucket arrived after the other two and did not get the treatment, so
                     a 100 MiB bucket would have been created with a one-byte limit and every
                     upload refused. Caught by "Verify No Rendered Value Uses Scientific
                     Notation", which is the guard the other two comments were written for. */}}
              value: {{ .Values.supabaseStorage.captureFileSizeLimit | int64 | quote }}
            - name: GATEWAY_BACKUP_FILE_SIZE_LIMIT
              {{- /* int64 first, for the same reason as the limit above -- `quote` alone renders
                     5242880 as "5.24288e+06", which parseInt reads as 5. */}}
              value: {{ .Values.supabaseStorage.gatewayBackupFileSizeLimit | int64 | quote }}
          command: ["node", "/app/storage-init.mjs"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: script
          configMap:
            name: {{ printf "%s-storage-init" $fullname }}
{{- end }}
