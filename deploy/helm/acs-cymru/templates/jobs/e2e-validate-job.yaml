{{- if .Values.e2e.enabled }}
{{- $component := "e2e-validate" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{/*
=================================================================================================
`ingestion/validate.py`, run as a Job IN the namespace.

THIS IS THE SIMPLER OF THE TWO WAYS TO RUN IT. From the host (`npm run dev:test`) the script
reaches the stack through port-forwards on 5433 / 54322 / 1883 / 54321, because the in-cluster names
do not resolve outside the cluster. In-cluster the SERVICE NAMES ARE THE CORRECT CONFIGURATION, so
the values below are the plain defaults with no rewriting and no port-forwarding.

NOT A `helm test` HOOK, deliberately, unlike test-fdw. This suite SEEDS AND DELETES fixtures, drives
real MQTT traffic and takes minutes; `helm test` should stay the cheap gate anyone can run against a
live stack without thinking about it. Gated on `e2e.enabled` so it exists only when asked for.

IT IS THE SAME 20 CHECKS `npm run dev:test` runs from the host; if both pass, the wiring agrees
with itself where it matters.
=================================================================================================
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-e2e-validate" (include "acs-cymru.fullname" .) }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  annotations:
    # A plain Job, not a hook: it is triggered on purpose, and `kubectl wait` on it is what CI does.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # NO RETRIES. A failed conformance run is a result to read, not a flake to paper over -- and the
  # suite is not idempotent mid-flight: a retry starting while fixtures from the previous attempt
  # exist reports collisions rather than the original failure.
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.e2e.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        CHECK 7b SIGNS IN THROUGH THE REAL OAUTH CHAIN, so it follows BROWSER-FACING URLs:
        /auth/strategy redirects to `api.<publicBaseDomain>`, and GoTrue then hands back a callback
        on `nodered.<publicBaseDomain>`. That is the point of the check -- it is what catches a
        redirect_uri that disagrees with what the service advertises -- and it cannot be replaced by
        in-cluster names without testing something else entirely.

        But a pod does not resolve those names the way a browser does. With the dev domain
        `localhost` they resolve to 127.0.0.1 -- which inside this pod is THE POD ITSELF -- or, as
        `*.localhost` names, to nothing. 7b failed as `Connection refused`, reading as a broken
        Node-RED rather than as a name pointing at the wrong host.

        `e2e.ingressIp` maps those hostnames onto the ingress controller instead, so the Job walks
        the same redirect chain a browser would. Left empty the aliases are simply absent, which is
        right for any deployment whose public domain already resolves from inside the cluster.
      */}}
      {{- if .Values.e2e.ingressIp }}
      hostAliases:
        - ip: {{ .Values.e2e.ingressIp | quote }}
          hostnames:
            {{- range $sub := list "api" "nodered" "app" "grafana" }}
            - {{ printf "%s.%s" $sub $.Values.global.publicBaseDomain | quote }}
            {{- end }}
      {{- end }}
      initContainers:
        {{/*
          WAITS FOR THE MIGRATIONS, NOT FOR THE GATEWAY. This is a plain Job, so Kubernetes creates
          it at `helm install` time -- alongside every Deployment and MINUTES BEFORE the
          post-install hooks that bootstrap the database. It previously waited only on the gateway, and
          that failed in CI in the most misleading way available:

            * the gateway answers as soon as it is up, long before PostgREST has a schema behind it;
            * the probe was `curl -s -o /dev/null`, with NO `-f`, so the 502 the gateway returns while its
              upstream is broken counted as SUCCESS.

          So the Job started ~3 minutes early, found `supabase-db` still refusing connections, and
          died reporting `relation "public.devices" does not exist` and a pydantic parse error
          inside the PostgREST client. The pod ages are what gave it away: `e2e-validate` was
          3m27s old while `db-init` was 43s old. Nothing in the failure named ordering.

          Waiting on a QUERY covers both halves at once -- `psql` exits non-zero whether the server
          is down or the object does not exist yet -- and the answer to both is the same: keep
          waiting. It is the same discipline `ingestion` uses against the telemetry hypertable:
          probe the OBJECT the workload needs, not the process that serves it.

          THAT OBJECT WAS `public.devices`, AND IT WAS THE WRONG ONE. 0001 creates it, so the probe
          started passing once ONE migration of seventy had run and then stayed passing for the
          other sixty-nine. It proved the chain had STARTED. On CI run 33503395769 validate.py began
          publishing while the chain was in its fifties, and checks 1/1d/1e/1f failed against a
          `devices` table that did not have `conformance_policy` yet -- a column 0050 adds. The
          suite was green whenever db-init happened to win the race, so it read as four flaky
          quarantine bugs rather than as one ordering fault. 0072 has the full account.

          `1/count(*)` IS DELIBERATE, AND IT IS THE WHOLE POINT OF THE FIX. This helper reads the
          EXIT CODE, and a query that matches no rows still exits 0 -- which is why the old probe
          could not have expressed "and the chain has finished" no matter which table it named. The
          division makes an empty result an ERROR: no sentinel row yet, or `completed_at` still NULL
          because db-init is mid-chain, and psql exits non-zero and the loop waits. Complete, and it
          evaluates to 1.
        */}}
        {{- include "acs-cymru.waitForPostgres" (dict
             "ctx" .
             "name" "wait-for-migrations"
             "host" (include "acs-cymru.supabaseDb.host" .)
             "port" (include "acs-cymru.supabaseDb.port" .)
             "user" "postgres"
             "db" "postgres"
             "passwordKey" "POSTGRES_PASSWORD"
             "query" "SELECT 1/count(*) FROM public.schema_bootstrap WHERE completed_at IS NOT NULL;"
             "describe" "db-init to finish the whole migration chain (public.schema_bootstrap.completed_at) — it is a post-install hook and runs AFTER this Job is created")
           | nindent 8 }}
        {{/*
          The gateway second, and with `-f` this time. validate.py reaches Supabase THROUGH the
          gateway, so the database being ready is necessary but not sufficient. `-f` matters:
          without it any response at all -- including the 502 the gateway returns while its
          upstream is down -- satisfies the probe, which is exactly how this check came to pass
          while proving nothing.

          The secret key alone: the gateway matches it as an opaque string and hands PostgREST the
          service-role bearer, which holds SELECT on `devices`. Measured: no key -> 401, the
          publishable key alone -> 401 (anon holds no SELECT there), the secret key -> 200.
        */}}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-gateway" "image" "curlimages/curl:8.10.1" "command" (printf "curl -sf -o /dev/null -H \"apikey: $SUPABASE_SECRET_KEY\" '%s/rest/v1/devices?limit=1'" (include "acs-cymru.supabase.internalUrl" .)) "describe" "the gateway routing to PostgREST with a live schema" "env" (include "acs-cymru.secretEnv" (dict "name" "SUPABASE_SECRET_KEY" "secretName" $secretName "key" "SUPABASE_SECRET_KEY"))) | nindent 8 }}
        {{/*
          NODE-RED AND i3X TOO, because validate.py asserts against them directly -- checks 7/7b
          drive a real editor sign-in and 12-12f exercise the i3X address space.

          THIS JOB'S START TIME IS NOT ORDERED BY THE CI WORKFLOW. It is a plain Job created at
          install, so its own initContainers are the only thing holding it back; CI's "wait for
          every workload" step runs CONCURRENTLY with it, not before it. Once the database wait
          above stopped it racing db-init, it simply raced these two instead -- and failed with
          `Connection refused` and `HTTP 0`, which read as broken services rather than as a Job
          that started too early. Both pods were 1/1 Running by the time diagnostics ran.

          `curl -s` WITHOUT `-f` FOR NODE-RED, deliberately, and it is not the mistake corrected
          above. curl still exits non-zero when it cannot connect, so this proves the port is open
          and speaking HTTP -- and Node-RED's admin API answers 401 unauthenticated, which is what
          check 7 asserts, so demanding a 2xx here would wait forever for something that must not
          happen. i3X's /info is unauthenticated by specification, so `-f` is right there.
        */}}
        {{- if .Values.nodeRed.enabled }}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-node-red" "image" "curlimages/curl:8.10.1" "command" "curl -s -o /dev/null http://node-red:1880/" "describe" "node-red (checks 7/7b sign in to the editor)") | nindent 8 }}
        {{- end }}
        {{- if .Values.i3xService.enabled }}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-i3x" "image" "curlimages/curl:8.10.1" "command" "curl -sf -o /dev/null http://i3x-service:8090/v1/info" "describe" "i3x-service (checks 12-12f read its address space)") | nindent 8 }}
        {{- end }}
        {{/*
          AND THE INGESTION DAEMON LAST, ON ITS OWN METRIC RATHER THAN ON ITS POD.

          THIS IS THE ONE THAT WAS MISSING, and CI run 33606772340 on `main` is what it cost:
          twelve checks failed at once -- quarantine, birth parameters, birth-metric observation,
          unmodelled detection, telemetry, rename safety, label propagation, every alias check and
          the rebirth NCMD -- while i3X, the Directory, Node-RED and the Digital Thread all passed.
          That split is the signature: everything that needed the daemon to have CONSUMED something
          failed, and everything that read the database directly passed. The daemon's log told the
          rest -- it logged `Subscribed to 'spBv1.0/#'` at 08:13:48, and validate.py had published
          its entire scenario between 08:10:55 and then. Sparkplug fixtures go out at QoS 0, so
          those messages were not queued for a late subscriber; they were simply gone.

          The daemon is held behind its own wait on the telemetry hypertable, so on a slow node it
          reaches the broker minutes after this Job is created. Nothing ordered the two.

          THE CI WORKFLOW'S OWN "WAIT FOR THE INGESTION DAEMON TO BE CONSUMING" STEP DOES NOT COVER
          THIS, for the reason the block above already gives about Node-RED and i3X: this is a plain
          Job created at install time, so a workflow step runs CONCURRENTLY with it. On that run the
          step passed at 08:13:51, five seconds after the suite had already failed and reported.

          `acs_ingestion_mqtt_connected`, NOT `acs_ingestion_up`. `up` says the process is alive,
          which it is throughout the failure; the subscription is the thing being waited on. Read
          from the headless metrics Service, which sets `publishNotReadyAddresses` precisely so an
          unhealthy daemon can still be scraped -- exactly the state this probe has to observe
          rather than be hidden from.
        */}}
        {{- if .Values.ingestion.enabled }}
        {{- include "acs-cymru.waitFor" (dict "ctx" . "name" "wait-for-ingestion" "command" "wget -q -O - http://ingestion-metrics:9108/metrics 2>/dev/null | awk '/^acs_ingestion_mqtt_connected /{found=($2==1)} END{exit found?0:1}'" "describe" "the ingestion daemon to be subscribed to spBv1.0/# (every check that asserts on consumed telemetry)") | nindent 8 }}
        {{- end }}
      containers:
        - name: validate
          # The test-runner image: the ingestion image plus jsonschema and the AAS suite. Built from
          # test-harness/Dockerfile with the REPOSITORY ROOT as context.
          image: {{ include "acs-cymru.image" (dict "image" .Values.e2e.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.e2e.image.pullPolicy }}
          command: ["python", "validate.py"]
          env:
            # TimescaleDB. M2: the standard port. validate.py defaults DB_PORT to 5433 only when
            # DB_HOST is UNSET -- naming the host is what selects 5432 -- but both are set here
            # explicitly so the Job's environment reads as a complete statement of its topology.
            {{- with include "acs-cymru.dbClientTlsEnv" . }}{{ . | nindent 12 }}{{- end }}
            - name: DB_HOST
              value: {{ include "acs-cymru.timescale.host" . | quote }}
            - name: DB_PORT
              value: {{ include "acs-cymru.timescale.port" . | quote }}
            - name: DB_NAME
              value: {{ .Values.timescaledb.database | quote }}
            - name: DB_USER
              value: {{ .Values.timescaledb.username | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" "DB_PASSWORD") | nindent 12 }}
            # Supabase's own database, reached directly for the audit-row cleanup that migration
            # 0003 deliberately put out of reach of service_role. SUPABASE_DB_PORT's conditional
            # default is what makes this correct in-cluster.
            - name: SUPABASE_DB_HOST
              value: {{ include "acs-cymru.supabaseDb.host" . | quote }}
            - name: SUPABASE_DB_PORT
              value: {{ include "acs-cymru.supabaseDb.port" . | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- /* The broker port and transport follow `mosquitto.tls.internalClients` with every
                   other in-cluster client; the CA projection below is the same one. */}}
            {{- include "acs-cymru.brokerClientEnv" . | nindent 12 }}
            {{- /*
              The validator connects AS AN ORDINARY GATEWAY, confined by its own broker role to its
              own edge-node subtree exactly as a physical one is. The username is the `sparkplug_id`
              generated from VAL_GW_UUID in validate.py -- pinned there precisely so this
              credential can be issued before the row exists. A mismatch between the two shows up
              as every publish being silently dropped, and the run failing as "no telemetry".
            */}}
            {{/*
              THE ENV NAMES MUST BE MQTT_VALIDATOR_*, not the generic MQTT_USER/MQTT_PASSWORD they
              were until 2026-08. This Job always read the right SECRET KEYS; it exposed them under
              names that invited the exact confusion validate.py now refuses -- the generic pair is
              what the INGESTION service is given, and that principal cannot publish DBIRTH or
              DDATA at all. validate.py reads the validator names directly and exits naming the
              variable if they are absent, so a rename here is not cosmetic: it is the wiring.
            */}}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_VALIDATOR_USER" "secretName" $secretName "key" "MQTT_VALIDATOR_USER") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "MQTT_VALIDATOR_PASSWORD" "secretName" $secretName "key" "MQTT_VALIDATOR_PASSWORD") | nindent 12 }}
            - name: SUPABASE_URL
              value: {{ include "acs-cymru.supabase.internalUrl" . | quote }}
            # WITHOUT THE SECRET KEY the script seeds nothing and fails about 12 of 20 checks in a
            # way that reads like a schema fault ("no quarantined device reported", "no telemetry
            # records"), with the real cause one line up in its own banner: "Secret key: MISSING".
            # The service-role JWT is read by one check only, which proves the gateway refuses it.
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_SECRET_KEY" "secretName" $secretName "key" "SUPABASE_SECRET_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_SERVICE_ROLE_KEY" "secretName" $secretName "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            # Check 7 probes all three Node-RED auth surfaces -- the editor, the /flows admin API and
            # the webhook receiver -- and it has to be an end-to-end check: the fix is a runtime
            # property of the assembled stack, and a settings.js securing only /flows would leave the
            # webhook receiver open.
            {{- /*
              THE PUBLIC ORIGIN, NOT THE IN-CLUSTER ONE, AND THE COOKIE IS THE REASON.

              This was `http://node-red:1880`, which is correct for check 7 and silently wrong for
              7b. 7b drives the real browser handshake, and validate.py says why in its own comment:
              "the state and PKCE verifier live in Node-RED's express session, so the callback has
              to arrive carrying the cookie the /auth/strategy request set".

              A cookie jar is HOST-SCOPED. Starting the flow at `node-red:1880` and receiving the
              callback at `nodered.<publicBaseDomain>` -- which is what the OAuth client's
              registered redirect_uri necessarily is -- means the session cookie is never sent
              back. Node-RED then has no PKCE verifier for the code, and Passport fails the callback
              with 403, surfacing as `AuthenticationError: Forbidden`. Nothing is broken; the
              handshake was split across two origins.

              Using the public origin here makes the flow single-origin, and has the side benefit
              that check 7 now exercises the ingress path a real operator uses.

              Falls back to the in-cluster Service when no public domain is configured, so a stack
              installed without one still runs the suite instead of rendering an unusable hostname.
            */}}
            - name: NODERED_BASE_URL
              value: {{ (.Values.publicUrls.nodered | default (ternary (printf "%s://nodered.%s" .Values.global.scheme .Values.global.publicBaseDomain) "" (ne (.Values.global.publicBaseDomain | toString) ""))) | default "http://node-red:1880" | quote }}
            {{- include "acs-cymru.secretEnv" (dict "name" "NODERED_OAUTH_CLIENT_SECRET" "secretName" $secretName "key" "NODERED_OAUTH_CLIENT_SECRET") | nindent 12 }}
            {{- /*
              I3X_BASE_URL WAS NEVER SET HERE, so checks 12-12f have never actually run on this
              target. validate.py defaults it to `http://localhost:8090`, which inside this Job's
              own pod is the Job itself -- nothing listens, and the suite reported `/info returned
              HTTP 0`, indistinguishable from a broken i3X server. This is the in-cluster name the
              rest of the stack uses.
            */}}
            {{- if .Values.i3xService.enabled }}
            - name: I3X_BASE_URL
              value: http://i3x-service:8090
            {{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            {{- toYaml .Values.e2e.resources | nindent 12 }}
          {{- $brokerTls := and .Values.mosquitto.tls.enabled .Values.mosquitto.tls.internalClients }}
          {{- if or $brokerTls .Values.postgresTls.enabled }}
          volumeMounts:
            {{- if $brokerTls }}
            {{- include "acs-cymru.brokerClientCaMount" . | nindent 12 }}
            {{- end }}
            {{- with include "acs-cymru.dbClientCaMount" . }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
      {{- if or $brokerTls .Values.postgresTls.enabled }}
      volumes:
        {{- if $brokerTls }}
        {{- include "acs-cymru.brokerClientCaVolume" . | nindent 8 }}
        {{- end }}
        {{- with include "acs-cymru.dbClientCaVolume" . }}{{ . | nindent 8 }}{{- end }}
      {{- end }}
{{- end }}
