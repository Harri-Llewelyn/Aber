{{- if .Values.coldArchive.enabled }}
{{- $component := "cold-archive" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{/*
=================================================================================================
Cold telemetry archival: export a chunk, verify the object, record it, and only then drop it
(ingestion/cold_archive.py). Turns the historian's retention policy from delete into move.

The ingestion image under a different command, as the playback worker is: `cold_archive` reads
the chunk with the daemon's own historian role, so the two cannot disagree about which rows they
are looking at. The object goes to the S3 endpoint under coldArchive.s3 -- somewhere else, and
only somewhere else, because `--drop` deletes the only other copy.

`--drop` is on by default because the retention policy is: without it the chunks are exported
and kept, and the historian never shrinks. Every drop is recorded in telemetry_archive_manifest,
which refuses one that was not verified. Off: coldArchive.drop=false, an export-only cadence.
=================================================================================================
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-cold-archive" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  schedule: {{ .Values.coldArchive.schedule | quote }}
  # Never two at once: the claim step is what makes a crashed run resolvable by the next.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: cold-archive
              image: {{ include "acs-cymru.image" (dict "image" .Values.ingestion.image "ctx" $) | quote }}
              imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
              command:
                - python
                - -m
                - cold_archive
                {{- if .Values.coldArchive.drop }}
                - --drop
                {{- end }}
              env:
                {{- with include "acs-cymru.dbClientTlsEnv" . }}{{ . | nindent 16 }}{{- end }}
                - name: LOG_FORMAT
                  value: "json"
                - name: DB_HOST
                  value: {{ include "acs-cymru.timescale.host" . | quote }}
                - name: DB_PORT
                  value: {{ include "acs-cymru.timescale.port" . | quote }}
                - name: DB_NAME
                  value: {{ .Values.timescaledb.database | quote }}
                # The historian role the daemon writes as; the chunks it exports are its own.
                - name: DB_USER
                  value: "ingest_writer"
                {{- include "acs-cymru.secretEnv" (dict "name" "DB_PASSWORD" "secretName" $secretName "key" "INGEST_WRITER_PASSWORD") | nindent 16 }}
                - name: SUPABASE_URL
                  value: {{ include "acs-cymru.supabase.internalUrl" . | quote }}
                {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_PUBLISHABLE_KEY" "secretName" $secretName "key" "SUPABASE_PUBLISHABLE_KEY") | nindent 16 }}
                {{- include "acs-cymru.secretEnv" (dict "name" "SUPABASE_INGESTION_KEY" "secretName" $secretName "key" "SUPABASE_INGESTION_KEY") | nindent 16 }}
                {{/*
                  The destination. Rendered whether or not it is configured, because the exporter's
                  refusal names the variables that are empty -- a missing variable and an empty one
                  would otherwise read differently in `kubectl describe` for no reason.

                  The site key is NOT here: it is read from the database, where 0132 froze it, so
                  that the value addressing every existing object cannot be changed by a redeploy.
                */}}
                - name: ARCHIVE_S3_ENDPOINT
                  value: {{ .Values.coldArchive.s3.endpoint | default "" | quote }}
                - name: ARCHIVE_S3_REGION
                  value: {{ .Values.coldArchive.s3.region | default "" | quote }}
                - name: ARCHIVE_S3_BUCKET
                  value: {{ .Values.coldArchive.s3.bucket | default "" | quote }}
                - name: ARCHIVE_S3_ACCESS_KEY_ID
                  value: {{ .Values.coldArchive.s3.accessKeyId | default "" | quote }}
                - name: ARCHIVE_S3_PATH_STYLE
                  value: {{ .Values.coldArchive.s3.pathStyle | default false | quote }}
                # Optional, as the SMTP relay's password is: an externally-managed Secret that
                # predates this key still starts the Job, which then reports it as missing.
                - name: ARCHIVE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: ARCHIVE_S3_SECRET_ACCESS_KEY
                      optional: true
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                {{- toYaml .Values.coldArchive.resources | nindent 16 }}
              {{- if .Values.postgresTls.enabled }}
              volumeMounts:
                {{- include "acs-cymru.dbClientCaMount" . | nindent 16 }}
              {{- end }}
          {{- if .Values.postgresTls.enabled }}
          volumes:
            {{- include "acs-cymru.dbClientCaVolume" . | nindent 12 }}
          {{- end }}
{{- end }}
