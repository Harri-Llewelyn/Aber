{{- if .Values.supabaseDb.enabled }}
{{- $component := "supabase-db" -}}
{{- $secretName := include "acs-cymru.secretName" . -}}
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-db-headless
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
{{/*
THE NAME IS `supabase-db`, matching the Compose service name.

GoTrue, PostgREST, Realtime, Storage, postgres-meta and Studio all address it by that name in
their existing configuration; keeping it means none of those strings changes between targets.

PORT 5432. docker-compose publishes it on 54322 to avoid colliding with a local PostgreSQL; that
number has no meaning inside a cluster. validate.py's SUPABASE_DB_PORT carries the same
distinction: its default is conditional on where it runs.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: supabase-db
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: supabase-db
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: supabase-db-headless
  # ONE REPLICA, AND NOT A TUNABLE -- see the note on timescaledb. Additionally: Realtime holds a
  # LOGICAL REPLICATION SLOT against this database, and slots are per-instance state. A second
  # server would not carry it.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # M5. Same reasoning and the same uid as TimescaleDB -- both are Debian postgres images.
      securityContext:
        {{- toYaml .Values.supabaseDb.podSecurityContext | nindent 8 }}
      containers:
        - name: supabase-db
          image: "{{ .Values.supabaseDb.image.repository }}:{{ .Values.supabaseDb.image.tag }}"
          imagePullPolicy: {{ .Values.supabaseDb.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: postgres
            {{- include "acs-cymru.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secretName" $secretName "key" "POSTGRES_PASSWORD") | nindent 12 }}
            # The supabase/postgres image reads these at first boot to provision the scoped roles
            # and the auth schema helpers. They must be the SAME values every other service is
            # given -- see the note on `secrets` in values.yaml for why the three are a set.
            {{- include "acs-cymru.secretEnv" (dict "name" "JWT_SECRET" "secretName" $secretName "key" "SUPABASE_JWT_SECRET") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "ANON_KEY" "secretName" $secretName "key" "SUPABASE_ANON_KEY") | nindent 12 }}
            {{- include "acs-cymru.secretEnv" (dict "name" "SERVICE_ROLE_KEY" "secretName" $secretName "key" "SUPABASE_SERVICE_ROLE_KEY") | nindent 12 }}
            {{/*
            NO `PGDATA` OVERRIDE, and setting one takes the database down on a fresh volume.

            The habit of pointing PGDATA at a SUBDIRECTORY of the mount comes from stock `postgres`,
            where it avoids initdb tripping over a `lost+found`. It cannot work here, because
            `supabase/postgres` ships `/etc/postgresql/postgresql.conf` with

                data_directory = '/var/lib/postgresql/data'

            hardcoded, and launches the server with that config file. So PGDATA steers only the
            entrypoint: initdb populates `.../data/pgdata` and chowns THAT, then the server starts,
            reads the config, and opens `.../data` -- the mount root, still owned by root because
            fsGroup sets the GROUP and never the owner. The result is

                FATAL:  data directory "/var/lib/postgresql/data" has wrong ownership

            on a volume the entrypoint has just reported initialising successfully, with every
            Supabase service behind it stuck on an init container and nothing naming the cause.
            docker-compose sets no PGDATA, which is why this only ever broke Kubernetes -- exactly
            the class of divergence CI runs validate.py against both targets to catch.

            Left unset, the image's own default IS the mount root, the root entrypoint chowns it to
            postgres before dropping privileges, and both targets agree.

            TIMESCALEDB KEEPS ITS PGDATA OVERRIDE, and that is not an inconsistency to tidy away.
            `timescale/timescaledb` ships no `/etc/postgresql` at all -- the stock entrypoint runs
            the server with `-D "$PGDATA"`, so there the override is honoured end to end and buys
            the usual protection against initdb meeting a `lost+found` on a fresh volume. The two
            images differ in how they locate the data directory, so the two templates differ too.
            That difference is precisely why timescaledb came up healthy in the same cluster where
            supabase-db crash-looped, which made the fault look like a Supabase problem.
            */}}
          # The Compose healthcheck runs pg_isready AND `psql -c 'SELECT 1'`, because this image
          # answers pg_isready during its own bootstrap while still refusing connections. Both are
          # kept: readiness gates the init Jobs, and a database that accepts a connection
          # but not a query would let the migrations start and fail.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'
            periodSeconds: 10
            timeoutSeconds: 10
            # 5 minutes. This image does substantially more first-boot work than stock postgres.
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          # Slacker than readiness, deliberately -- see the note on timescaledb's liveness probe.
          # pg_isready only here: the SELECT adds a connection slot and a query per check, and
          # liveness is about "is the process lost", not "is it answering well".
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.supabaseDb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- with .Values.supabaseDb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supabaseDb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supabaseDb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.supabaseDb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.supabaseDb.persistence.accessMode }}
        {{- include "acs-cymru.storageClass" (dict "ctx" . "component" .Values.supabaseDb.persistence) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.supabaseDb.persistence.size }}
  {{- end }}
{{- end }}
{{- /*
NO /docker-entrypoint-initdb.d MOUNT HERE, unlike timescaledb, and that is not an omission.

Supabase's schema arrives through supabase-db-init replaying supabase/migrations/*.sql on every
boot -- an init Job. Putting the migrations in an initdb mount would run them exactly once, on
an empty volume, which is the opposite of the idempotent-replay contract 0001/0002 are built
around and would make every later migration unreachable on an existing database.
*/ -}}
