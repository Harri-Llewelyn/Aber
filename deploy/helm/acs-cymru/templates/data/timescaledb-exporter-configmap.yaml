{{- if and .Values.timescaledb.enabled .Values.databaseMetrics.enabled }}
{{- $component := "timescaledb" -}}
{{/*
The historian's custom exporter queries, mounted into its postgres_exporter sidecar.

ONLY THE HISTORIAN HAS ONE. Every query in it reads `timescaledb_information` or the storage
footprint view, neither of which exists on supabase-db -- and a custom-query file naming a missing
relation does not fail the scrape: the collector errors, the exporter keeps serving, and the series
are absent. So this is mounted where its queries can run and nowhere else.

A CHANGE HERE ROLLS THE POD. The exporter reads the file once at startup, so the checksum annotation
on the StatefulSet is what makes an edit take effect rather than sit in the ConfigMap unread.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-timescaledb-exporter" (include "acs-cymru.fullname" .) }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  queries.yaml: |
{{ .Files.Get "files/timescaledb-exporter/queries.yaml" | indent 4 }}
{{- end }}
