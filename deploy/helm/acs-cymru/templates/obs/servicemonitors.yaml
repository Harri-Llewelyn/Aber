{{- if .Values.telemetry.serviceMonitor.enabled }}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{/*
=================================================================================================
ServiceMonitors -- ONLY for endpoints that actually serve Prometheus metrics.

THE POINT OF THIS FILE IS WHAT IT REFUSES TO CREATE. A ServiceMonitor naming a port that serves
nothing does not fail: Prometheus lists the target as DOWN, or worse scrapes an endpoint that
answers 200 with no metrics, and the dashboards built on it render empty panels. Someone then
concludes the component is idle. That is a monitoring stack lying about the thing it was installed
to observe, which is worse than not monitoring it at all.

So each entry below was verified against the pinned image before it was written:

  grafana         SERVES METRICS NATIVELY on its normal HTTP port at /metrics, unauthenticated.
                  (grafana 11.6.1: 1250 metric series.) Nothing to enable.

  supabase-kong   SERVES METRICS ONLY WITH THE PLUGIN, THE STATUS LISTENER, AND -- SINCE KONG 3.x
                  -- THREE PLUGIN FLAGS ALL ON. The `prometheus` plugin is declared globally in
                  kong.yml and named in KONG_PLUGINS; `supabaseKong.metrics.enabled` adds
                  KONG_STATUS_LISTEN and the port; and `status_code_metrics` / `latency_metrics` /
                  `bandwidth_metrics` are set in kong.yml because 3.0 made them opt-in.
                  WITHOUT THOSE FLAGS THIS TARGET IS A LIE OF EXACTLY THE KIND THIS HEADER IS
                  ABOUT: it scrapes UP, answers 200, and carries only node-level nginx and memory
                  gauges -- every per-service series silently absent.
                  (kong 3.9.3: 106 kong_* series on :8100/metrics, measured on the live stack.)
                  THE MOST VALUABLE TARGET HERE, because every REST, Auth, Storage, Realtime and
                  edge-function request passes through it -- see the note on supabase-rest.

                  THIS METRIC NAME HAS NOW BEEN WRONG IN BOTH DIRECTIONS, WHICH IS THE LESSON.
                  It first said `kong_http_requests_total`, written from documentation; a live
                  scrape of the then-pinned 2.8.1 showed `kong_http_status`, so it was corrected.
                  The 3.9.3 upgrade renamed it BACK -- 3.x really does expose
                  `kong_http_requests_total`, `kong_bandwidth_bytes`, and three separate latency
                  histograms (`kong_request_latency_ms_*`, `kong_upstream_latency_ms_*`,
                  `kong_kong_latency_ms_*`) in place of 2.8's single `kong_latency_*`.
                  Every name above was read off the running gateway, not off a changelog. A panel
                  built from the wrong one draws an empty graph and reports nothing.

  mosquitto       HAS NO HTTP METRICS SURFACE AT ALL and cannot be given one; it publishes to
                  `$SYS/broker/#` MQTT topics. `mosquitto.metrics.enabled` runs an exporter
                  sidecar that subscribes and re-serves them.
                  (sapcc/mosquitto-exporter 0.8.0: 48 broker_* series -- note the `broker_`
                  prefix, not `mosquitto_`.)

  supabase-rest   NO LONGER TRUE AS OF v14.12, AND THE OLD TEXT IS KEPT BELOW BECAUSE THE REASON
                  IT WAS WRONG IS THE USEFUL PART. It read:

                    "POSTGREST 12.2.0 EXPOSES NO METRICS. Its admin server (`admin-server-port`)
                     serves /ready and /live and nothing else -- there is no metrics setting in
                     the configuration at all. A ServiceMonitor for it would be pure fiction."

                  That was accurate for 12.2.0 and stopped being accurate the moment the pin
                  moved. Current PostgREST serves Prometheus text on the admin server at
                  /metrics. Read off a running v14.12 rather than off a changelog:
                  `pgrst_db_pool_max`, `pgrst_db_pool_waiting`, `pgrst_schema_cache_loads_total`,
                  `pgrst_schema_cache_query_time_seconds`, and the three
                  `pgrst_jwt_cache_*_total` counters.

                  THOSE ARE EXACTLY THE THINGS KONG CANNOT SEE. Every PostgREST request does
                  arrive through Kong, so `kong_http_requests_total` and the
                  `kong_request_latency_ms_*` histograms cover the HTTP tier -- but a gateway-side
                  200 says nothing about a schema cache reload or a connection pool with requests
                  queued behind it. Those are process-internal and one hop removed.

                  IT IS NOW A TARGET, on the `admin` port, and this entry stays here only
                  because the reason it was wrong is worth keeping. The admin listener is bound by
                  `PGRST_ADMIN_SERVER_PORT` on both deployments; it is a ClusterIP port, absent
                  from the Ingress and unrouted by Kong, because THE ADMIN SERVER HAS NO
                  AUTHENTICATION and its readiness endpoints describe the database connection.

DELIBERATELY ABSENT, and this is the part worth reading:

  supabase-db /   Postgres exposes nothing without postgres_exporter, which is a separate
  timescaledb     deployment with its own credentials and its own scrape story. Worth doing, and
                  worth doing properly rather than half-added here.

  (ingestion USED TO BE LISTED HERE, on the reasoning that it was "a Python daemon with no HTTP
  server" and that giving it one would mean adding a listener to a process whose whole design is a
  single MQTT loop. Issues #22 and #24 overturned that, and the second half of the argument turned
  out to be the weaker one: the daemon ALREADY runs three background threads -- a device watchdog,
  a liveness heartbeat and a stats reporter -- so a fourth serving a text endpoint fits the shape
  it already had. What it is NOT is a re-instrumentation: the counters existed, and metrics.py
  renders the registry they already fill. It is a target below.)

REQUIRES THE PROMETHEUS OPERATOR CRDs. ServiceMonitor is not a core Kubernetes type; without
kube-prometheus-stack (or at least its CRDs) installed, `helm install` fails with
`no matches for kind "ServiceMonitor"`. Hence opt-in, and hence the note in values.yaml.

NETWORK POLICY. Under `networkPolicy.enabled` every scrape is dropped by the default-deny rule --
the generated edges only describe flows between components of this chart, and Prometheus is not one
of them. `networkPolicy.extraIngress` is the seam; values-prod.yaml.example carries a working rule.
Without it the targets are simply DOWN, which reads as the pods being unreachable.
=================================================================================================
*/}}
{{- $targets := list -}}
{{- if .Values.grafana.enabled -}}
{{- $targets = append $targets (dict
      "name" "grafana"
      "component" "grafana"
      "service" "grafana"
      "port" "http"
      "path" "/metrics"
      "why" "native, unauthenticated, on the normal HTTP port") -}}
{{- end -}}
{{- if and .Values.supabaseKong.enabled .Values.supabaseKong.metrics.enabled -}}
{{- $targets = append $targets (dict
      "name" "supabase-kong"
      "component" "supabase-kong"
      "service" "supabase-kong"
      "port" "metrics"
      "path" "/metrics"
      "why" "the prometheus plugin on the status listener") -}}
{{- end -}}
{{/*
  THE ONLY TARGET ON THE CRITICAL DATA PATH. Everything else here observes a request tier; this one
  says whether telemetry is being recorded at all.

  It scrapes `ingestion-metrics`, the headless Service in apps/ingestion.yaml, which exists solely
  because a ServiceMonitor selects Services rather than Pods.

  `acs_ingestion_messages_dropped_total` is the series worth a panel: any non-zero value is
  telemetry that was NOT written, and under report-by-exception nothing ever restates it.
*/}}
{{- if and .Values.ingestion.enabled .Values.ingestion.metrics.enabled -}}
{{- $targets = append $targets (dict
      "name" "supabase-rest"
      "component" "supabase-rest"
      "service" "supabase-rest"
      "port" "admin"
      "path" "/metrics"
      "why" "PostgREST's admin server, which serves metrics from v14.12 and did not before") -}}
{{- $targets = append $targets (dict
      "name" "ingestion"
      "component" "ingestion"
      "service" "ingestion-metrics"
      "port" "metrics"
      "path" "/metrics"
      "why" "the daemon's own counter registry, rendered by ingestion/metrics.py") -}}
{{- end -}}
{{- if and .Values.mosquitto.enabled .Values.mosquitto.metrics.enabled -}}
{{- $targets = append $targets (dict
      "name" "mosquitto"
      "component" "mosquitto"
      "service" "mosquitto"
      "port" "metrics"
      "path" "/metrics"
      "why" "the exporter sidecar; metrics are prefixed broker_") -}}
{{- end -}}
{{- range $t := $targets }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-%s" $fullname $t.name }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" $ "component" $t.component) | nindent 4 }}
    {{- /* Prometheus Operator only adopts ServiceMonitors matching its own serviceMonitorSelector,
           which kube-prometheus-stack sets to `release: <its release>` by default. A ServiceMonitor
           with no matching label is created successfully, is visible to kubectl, and is IGNORED --
           no target appears and nothing reports why. That is the single most common way this fails,
           which is why the value exists rather than being assumed. */}}
    {{- with $.Values.telemetry.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" $ "component" $t.component) | nindent 6 }}
  endpoints:
    # {{ $t.why }}
    - port: {{ $t.port }}
      {{- /* BY NAME, not by number: the Service and this file would otherwise carry the same port
             in two places and drift. The operator resolves the name against the Service. */}}
      path: {{ $t.path }}
      interval: {{ $.Values.telemetry.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.telemetry.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
{{- if not $targets }}
{{/*
Nothing to scrape: serviceMonitor.enabled is on but every metrics source is off.

Rendered as a comment rather than failing, because this is a reachable and legitimate intermediate
state -- turning the master switch on before the per-component ones, or running with grafana
disabled. Saying so in the output beats an empty file, which reads as a broken template.

To get targets: supabaseKong.metrics.enabled, mosquitto.metrics.enabled, or grafana.enabled.
*/}}
{{- end }}
{{- end }}
