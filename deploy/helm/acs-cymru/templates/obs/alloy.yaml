{{- if .Values.observability.enabled }}
{{- $component := "alloy" -}}
{{- $fullname := include "acs-cymru.fullname" . -}}
{{- $cfg := .Values.observability.alloy -}}
{{- $name := include "acs-cymru.name" . -}}
{{/*
=================================================================================================
Alloy -- the one collector. A DaemonSet, one pod per node, and each pod handles the pods on
its own node: it scrapes the ones annotated `prometheus.io/scrape` and remote-writes the
series to Prometheus, tails every container in the release and ships the lines to Loki, and
serves the node's own metrics from the host's /proc, /sys and /.

DISCOVERY GOES THROUGH THE API SERVER, which is why there is a ServiceAccount and a ClusterRole
below and no hostPath under /var/log. Pod logs come the way `kubectl logs` gets them, with the
pod and container names attached by the kubelet, so nothing here has to be told what a
container is called. The ClusterRole is read-only and lists exactly what discovery and log
tailing need.

LABELS ARE TWO, `service` AND `container`, AND STAY TWO. Loki indexes by label set, so every
label is a cardinality budget; `service` is the pod's component and is what every shipped log
query selects on, `container` is what `kubectl logs -c` calls it. `reason`, `device` and
`edge_node` are fields in the JSON lines and are queried at read time: {service="ingestion"} |
json | reason = "gateway_binding".

LINES ARE FORWARDED WHOLE. What the store holds is what the container printed. The one
exception is the traceback rejoin for the two services whose format this repository controls;
its firstline regex describes logging_config.py's formats and nothing else, and applying it to
a mixed stream swallows unrelated lines into the wrong record (measured).
=================================================================================================
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-alloy" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Cluster-scoped, so namespaced by name: two installs in two namespaces must not share one.
  name: {{ printf "%s-%s-alloy" .Release.Namespace $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
rules:
  # discovery.kubernetes, role=pod.
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list, watch]
  # loki.source.kubernetes reads container logs through the API server.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-alloy" .Release.Namespace $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-alloy" .Release.Namespace $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-alloy" $fullname }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-alloy-config" $fullname }}
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
data:
  config.alloy: |
    logging {
      // WARN: Alloy's own stdout is collected by Alloy, so an info-level default writes about
      // writing, forever.
      level  = "warn"
      format = "logfmt"
    }

    // ------------------------------------------------------------------------------------------
    // Discovery: the pods of this release on this node. Each DaemonSet pod covers its own node,
    // so a pod is scraped and tailed exactly once however many nodes there are.
    // ------------------------------------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        own_namespace = true
      }
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "release" {
      targets = discovery.kubernetes.pods.targets

      // This release only. Other people's pods in the namespace are not ours to collect.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
        regex         = {{ .Release.Name | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = {{ $name | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "service"
      }
    }

    // ------------------------------------------------------------------------------------------
    // Logs.
    // ------------------------------------------------------------------------------------------
    discovery.relabel "logs" {
      targets = discovery.relabel.release.output

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.logs.output
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      forward_to = [loki.write.local.receiver]

      // The source adds `job` (namespace/pod:container) and `instance` of its own. The stream
      // contract is `service` and `container`, nothing else: a per-pod label means a new stream
      // set on every restart, and the dashboards and rules select on the two alone.
      stage.label_drop {
        values = ["job", "instance"]
      }

      // Rejoin Python tracebacks for the two services that emit logging_config.py's formats:
      // a line that starts with neither a `{` nor an ISO timestamp belongs to the record above.
      stage.match {
        selector = "{service=~\"ingestion|playback\"}"

        stage.multiline {
          firstline     = "^(\\{|\\d{4}-\\d{2}-\\d{2}T)"
          max_wait_time = "3s"
          max_lines     = 200
        }
      }
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"

        // Loki answers 429 when a burst exceeds its ingest ceiling; this turns that into a delay
        // rather than a loss, up to the last retry. See loki.yaml for the ceilings.
        max_backoff_period  = "5m"
        max_backoff_retries = 20
      }

      // The write-ahead log makes a container restart lossless. It lives on the pod's emptyDir,
      // so a pod replaced on a rollout starts afresh; that is the trade for no hostPath writes.
      wal {
        enabled = true
      }
    }

    // ------------------------------------------------------------------------------------------
    // Metrics: every pod annotated prometheus.io/scrape, on the port and path it names. A pod
    // yields one discovery target per container port; after relabelling those share a label
    // set and the scraper keeps one. Pod-level labels only, for that reason.
    // ------------------------------------------------------------------------------------------
    discovery.relabel "metrics" {
      targets = discovery.relabel.release.output

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        separator     = ":"
        regex         = "(.+):(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      // `job` and `component` both carry the component name, which is what the dashboards and
      // rules select on.
      rule {
        source_labels = ["service"]
        target_label  = "job"
      }
      rule {
        source_labels = ["service"]
        target_label  = "component"
      }
    }

    prometheus.scrape "pods" {
      targets         = discovery.relabel.metrics.output
      forward_to      = [prometheus.remote_write.local.receiver]
      scrape_interval = {{ $cfg.scrapeInterval | quote }}
      scrape_timeout  = "10s"
    }
{{- if $cfg.hostMetrics }}

    // ------------------------------------------------------------------------------------------
    // The node. node_exporter's collectors, in-process, reading the host's filesystems mounted
    // read-only. Container and pseudo filesystems are excluded, or every overlay mount appears
    // as a disk.
    // ------------------------------------------------------------------------------------------
    prometheus.exporter.unix "host" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      rootfs_path = "/host/root"
      // diskstats reads udev properties from this directory, which is on the host, not in
      // the pod; the default path logs an error on every start and disables them.
      udev_data_path = "/host/root/run/udev/data"

      filesystem {
        mount_points_exclude = "^/(sys|proc|dev|host|etc|run|var/lib/kubelet)($|/)"
        fs_types_exclude     = "^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
      }
    }

    discovery.relabel "host" {
      targets = prometheus.exporter.unix.host.targets

      rule {
        target_label = "job"
        replacement  = "node"
      }
      rule {
        target_label = "component"
        replacement  = "host"
      }
      rule {
        target_label = "instance"
        replacement  = sys.env("NODE_NAME")
      }
    }

    prometheus.scrape "host" {
      targets         = discovery.relabel.host.output
      forward_to      = [prometheus.remote_write.local.receiver]
      scrape_interval = {{ $cfg.scrapeInterval | quote }}
    }
{{- end }}

    prometheus.remote_write "local" {
      endpoint {
        url = "http://prometheus:9090/api/v1/write"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 12345
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "acs-cymru.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acs-cymru.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        # Alloy does not reload on a ConfigMap change; a change to the values that shape the
        # config rolls the pods. The rest of the config is fixed per chart version, and the
        # chart label on the pod template rolls it on upgrade.
        checksum/config: {{ toYaml $cfg | sha256sum }}
        {{- include "acs-cymru.scrapeAnnotations" (dict "port" 12345 "path" "/metrics") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ printf "%s-alloy" $fullname }}
      containers:
        - name: alloy
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 20
            failureThreshold: 4
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            {{- if $cfg.hostMetrics }}
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-alloy-config" $fullname }}
        - name: data
          emptyDir: {}
        {{- if $cfg.hostMetrics }}
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-root
          hostPath:
            path: /
        {{- end }}
{{- end }}
