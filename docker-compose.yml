services:
  # ---------------------------------------------------------------------------
  # Standalone TimescaleDB (Telemetry Hypertable Storage)
  # ---------------------------------------------------------------------------
  timescaledb:
    container_name: factoryplus_timescaledb
    image: timescale/timescaledb:latest-pg15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Note: Initialization scripts in /docker-entrypoint-initdb.d only run on an empty data directory.
      # Existing pgdata volumes must be recreated (docker compose down -v) to pick up schema changes.
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Self-Hosted Supabase Stack (Postgres, GoTrue Auth, PostgREST, Kong, Studio)
  # ---------------------------------------------------------------------------
  supabase-db:
    container_name: factoryplus_supabase_db
    image: supabase/postgres:15.6.1.143
    restart: always
    ports:
      - "${SUPABASE_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  supabase-db-roles-init:
    container_name: factoryplus_supabase_db_roles_init
    image: supabase/postgres:15.6.1.143
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: >
      /bin/sh -c "
      echo 'Setting passwords for scoped Supabase roles...';
      psql -h supabase-db -U supabase_admin -d postgres -c \"ALTER USER supabase_auth_admin WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';\";
      psql -h supabase-db -U supabase_admin -d postgres -c \"ALTER USER authenticator WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';\";
      echo 'Scoped role passwords set successfully.';
      "
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-db-init:
    container_name: factoryplus_supabase_db_init
    image: supabase/postgres:15.6.1.143
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Configuring PostgreSQL search_path...';
      psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;';
      echo 'Applying Supabase database migrations and seeds...';
      for f in /migrations/*.sql; do
        if [ -f \"$$f\" ]; then
          echo \"Executing migration $$f...\";
          psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -f \"$$f\";
        fi
      done;
      if [ -f /seed.sql ]; then
        echo 'Executing seed.sql...';
        psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -f /seed.sql;
      fi;
      echo 'Supabase database initialized successfully.';
      "
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_healthy

  supabase-auth:
    container_name: factoryplus_supabase_auth
    image: supabase/gotrue:v2.189.0
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      API_EXTERNAL_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # GoTrue does not default the audience. Without this it looks users up with
      # aud = '', never matches the seeded aud = 'authenticated' rows, and every
      # login fails with "Invalid login credentials".
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-rest:
    container_name: factoryplus_supabase_rest
    image: postgrest/postgrest:v12.2.0
    restart: always
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-kong:
    container_name: factoryplus_supabase_kong
    image: kong:2.8.1-alpine
    restart: always
    ports:
      - "${KONG_HTTP_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-functions:
        condition: service_started

  supabase-functions:
    container_name: factoryplus_supabase_functions
    image: supabase/edge-runtime:v1.74.2
    restart: always
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      VERIFY_JWT: "false"
      NODERED_URL: ${NODERED_URL:-http://node-red:1880/flows}
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      # The canonical Node-RED flow - the "git" side of the GitOps sync that
      # deploy-nodered pushes to the running Node-RED.
      - ./node_red_flow.json:/home/deno/flows/node_red_flow.json:ro
      # Persist fetched remote modules so functions don't re-download on restart.
      - deno_cache:/root/.cache/deno
    # An edge-runtime user worker has no filesystem access to these mounts, so the
    # flow is handed to it through the environment instead: main/index.ts forwards
    # every env var to each worker it spawns. Reading the file here (in the plain
    # container shell, before edge-runtime starts) sidesteps the worker sandbox
    # without nesting a mountpoint inside the read-only functions mount, which
    # would create a stray 0-byte file in the repository.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        export NODERED_FLOW_JSON="$$(cat /home/deno/flows/node_red_flow.json)"
        exec edge-runtime start --main-service /home/deno/functions/main
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Schema introspection API backing Supabase Studio's Database pages.
  # Studio speaks the postgres-meta protocol; pointing it at PostgREST returns
  # error payloads without the message/code/formattedError fields Studio's Zod
  # schema requires, which surfaces as a validation error in the UI.
  supabase-meta:
    container_name: factoryplus_supabase_meta
    # Pinned to the version the official self-hosted stack pairs with the Studio
    # tag below. v0.91.0 omitted "formattedError" from its error payloads, which
    # failed Studio's Zod schema on the Database page.
    image: supabase/postgres-meta:v0.96.6
    restart: always
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-factoryplus-pg-meta-crypto-key}
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-studio:
    container_name: factoryplus_supabase_studio
    # Pinned rather than :latest -- Studio's Zod schemas are coupled to a specific
    # postgres-meta version. This is the pairing the official stack ships.
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: always
    ports:
      - "${STUDIO_PORT:-54323}:3000"
    environment:
      # Without this Next.js binds only the container's own interface, so the
      # image's bundled localhost healthcheck fails with ECONNREFUSED.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-factoryplus-pg-meta-crypto-key}
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      # Server-side calls run inside the container, so this must be the internal
      # Kong address. SUPABASE_PUBLIC_URL stays host-facing for the browser.
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: Factory+
      DEFAULT_PROJECT_NAME: Factory+ Asset Tracking
      # Studio reads Edge Functions from disk, not over HTTP.
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./supabase/functions:/app/edge-functions:ro
      - studio_snippets:/app/snippets
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/platform/profile')
          .then((r) => { if (r.status !== 200) throw new Error(r.status) })"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      supabase-kong:
        condition: service_started
      supabase-meta:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Messaging & Edge Infrastructure
  # ---------------------------------------------------------------------------
  mosquitto-init:
    container_name: factoryplus_mosquitto_init
    image: eclipse-mosquitto:latest
    user: "0"
    environment:
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - mosquitto_data:/mosquitto/config
    entrypoint: >
      /bin/sh -c "
      mosquitto_passwd -b -c /mosquitto/config/password_file \"$MQTT_USER\" \"$MQTT_PASSWORD\";
      chmod 644 /mosquitto/config/password_file;
      echo 'Mosquitto password file initialized';
      "

  mosquitto:
    container_name: factoryplus_mosquitto
    image: eclipse-mosquitto:latest
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - mosquitto_data:/mosquitto/config
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u $${MQTT_USER:-factoryplus} -P $${MQTT_PASSWORD} -t '$$SYS/broker/version' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Application Runtimes & Ingestion
  # ---------------------------------------------------------------------------
  # React Web Dashboard (multi-stage build serving static assets via NGINX on port 3000)
  frontend:
    container_name: factoryplus_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: always
    ports:
      - "3000:3000"

  ingestion:
    container_name: factoryplus_ingestion
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PYTHONUNBUFFERED: "1"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      supabase-db-init:
        condition: service_completed_successfully

  node-red-init:
    container_name: factoryplus_node_red_init
    image: nodered/node-red:latest
    user: "0"
    environment:
      NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET}
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - nodered_data:/data
      - ./node_red_flow.json:/seed/flows.json:ro
      - ./scripts/node-red-init.mjs:/seed/node-red-init.mjs:ro
    # Writes flows_cred.json encrypted at rest. The script fails closed if it
    # cannot produce ciphertext, rather than silently emitting plaintext secrets.
    entrypoint: >
      /bin/sh -e -c "
      node /seed/node-red-init.mjs;
      chown -R 1000:1000 /data;
      "

  node-red:
    container_name: factoryplus_node_red
    image: nodered/node-red:latest
    restart: always
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      node-red-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy

  grafana:
    container_name: factoryplus_grafana
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "http://localhost:3002/"
      GF_INSTALL_PLUGINS: ""
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/datasources:/tmp/datasources-template:ro
      - grafana_provisioning_datasources:/etc/grafana/provisioning/datasources
    entrypoint: ["/bin/sh", "-c", "sed \"s/\\$${DB_PASSWORD}/$$DB_PASSWORD/g\" /tmp/datasources-template/datasources.template.yml > /etc/grafana/provisioning/datasources/datasources.yml && exec /run.sh"]
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  pgdata:
  nodered_data:
  grafana_data:
  grafana_provisioning_datasources:
  mosquitto_data:
  supabase_db_data:
  studio_snippets:
  deno_cache:
