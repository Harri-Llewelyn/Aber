services:
  # ---------------------------------------------------------------------------
  # Standalone TimescaleDB (Telemetry Hypertable Storage)
  # ---------------------------------------------------------------------------
  timescaledb:
    container_name: factoryplus_timescaledb
    image: timescale/timescaledb:latest-pg15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Note: Initialization scripts in /docker-entrypoint-initdb.d only run on an empty data directory.
      # Existing pgdata volumes must be recreated (docker compose down -v) to pick up schema changes.
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Self-Hosted Supabase Stack (Postgres, GoTrue Auth, PostgREST, Kong, Studio)
  # ---------------------------------------------------------------------------
  supabase-db:
    container_name: factoryplus_supabase_db
    image: supabase/postgres:15.6.1.143
    restart: always
    ports:
      - "${SUPABASE_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  supabase-db-roles-init:
    container_name: factoryplus_supabase_db_roles_init
    image: supabase/postgres:15.6.1.143
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: >
      /bin/sh -c "
      echo 'Setting passwords for scoped Supabase roles...';
      psql -h supabase-db -U supabase_admin -d postgres -c \"ALTER USER supabase_auth_admin WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';\";
      psql -h supabase-db -U supabase_admin -d postgres -c \"ALTER USER authenticator WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';\";
      echo 'Scoped role passwords set successfully.';
      "
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-db-init:
    container_name: factoryplus_supabase_db_init
    image: supabase/postgres:15.6.1.143
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: >
      /bin/sh -c "
      echo 'Configuring PostgreSQL search_path...';
      psql -h supabase-db -U postgres -d postgres -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;';
      echo 'Applying Supabase database migrations and seeds...';
      for f in /migrations/*.sql; do
        if [ -f \"$$f\" ]; then
          echo \"Executing migration $$f...\";
          psql -h supabase-db -U postgres -d postgres -f \"$$f\";
        fi
      done;
      if [ -f /seed.sql ]; then
        echo 'Executing seed.sql...';
        psql -h supabase-db -U postgres -d postgres -f /seed.sql;
      fi;
      echo 'Supabase database initialized successfully.';
      "
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_healthy

  supabase-auth:
    container_name: factoryplus_supabase_auth
    image: supabase/gotrue:v2.189.0
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      API_EXTERNAL_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-rest:
    container_name: factoryplus_supabase_rest
    image: postgrest/postgrest:v12.2.0
    restart: always
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-kong:
    container_name: factoryplus_supabase_kong
    image: kong:2.8.1-alpine
    restart: always
    ports:
      - "${KONG_HTTP_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-functions:
        condition: service_started

  supabase-functions:
    container_name: factoryplus_supabase_functions
    image: supabase/edge-runtime:v1.74.2
    restart: always
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      VERIFY_JWT: "false"
      NODERED_URL: ${NODERED_URL:-http://node-red:1880/flows}
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  supabase-studio:
    container_name: factoryplus_supabase_studio
    image: supabase/studio:latest
    restart: always
    ports:
      - "${STUDIO_PORT:-54323}:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-rest:3000
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      supabase-kong:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Messaging & Edge Infrastructure
  # ---------------------------------------------------------------------------
  mosquitto-init:
    container_name: factoryplus_mosquitto_init
    image: eclipse-mosquitto:latest
    user: "0"
    environment:
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - mosquitto_data:/mosquitto/config
    entrypoint: >
      /bin/sh -c "
      mosquitto_passwd -b -c /mosquitto/config/password_file \"$MQTT_USER\" \"$MQTT_PASSWORD\";
      chmod 644 /mosquitto/config/password_file;
      echo 'Mosquitto password file initialized';
      "

  mosquitto:
    container_name: factoryplus_mosquitto
    image: eclipse-mosquitto:latest
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - mosquitto_data:/mosquitto/config
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u $${MQTT_USER:-factoryplus} -P $${MQTT_PASSWORD} -t '$$SYS/broker/version' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Application Runtimes & Ingestion
  # ---------------------------------------------------------------------------
  # React Web Dashboard (multi-stage build serving static assets via NGINX on port 3000)
  frontend:
    container_name: factoryplus_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: always
    ports:
      - "3000:3000"

  ingestion:
    container_name: factoryplus_ingestion
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PYTHONUNBUFFERED: "1"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      supabase-db-init:
        condition: service_completed_successfully

  node-red-init:
    container_name: factoryplus_node_red_init
    image: nodered/node-red:latest
    user: "0"
    environment:
      NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET}
      MQTT_USER: ${MQTT_USER:-factoryplus}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - nodered_data:/data
      - ./node_red_flow.json:/seed/flows.json:ro
    entrypoint: >
      /bin/sh -c "
      cp /seed/flows.json /data/flows.json;
      echo \"module.exports = { credentialSecret: \\\"$NODERED_CREDENTIAL_SECRET\\\" };\" > /data/settings.js;
      node -e \"
        const credentials = require('/usr/src/node-red/node_modules/@node-red/runtime/lib/nodes/credentials');
        credentials.init({ settings: { userDir: '/data', credentialSecret: process.env.NODERED_CREDENTIAL_SECRET } });
        credentials.add('mqtt-broker-config', { user: process.env.MQTT_USER || 'factoryplus', password: process.env.MQTT_PASSWORD });
        credentials.export().then(creds => {
            require('fs').writeFileSync('/data/flows_cred.json', JSON.stringify(creds));
        });
      \";
      chown -R 1000:1000 /data;
      echo 'Node-RED flow and credentials initialized';
      "

  node-red:
    container_name: factoryplus_node_red
    image: nodered/node-red:latest
    restart: always
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      node-red-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy

  grafana:
    container_name: factoryplus_grafana
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "http://localhost:3002/"
      GF_INSTALL_PLUGINS: ""
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/datasources:/tmp/datasources-template:ro
      - grafana_provisioning_datasources:/etc/grafana/provisioning/datasources
    entrypoint: ["/bin/sh", "-c", "sed \"s/\\$${DB_PASSWORD}/$$DB_PASSWORD/g\" /tmp/datasources-template/datasources.template.yml > /etc/grafana/provisioning/datasources/datasources.yml && exec /run.sh"]
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  pgdata:
  nodered_data:
  grafana_data:
  grafana_provisioning_datasources:
  mosquitto_data:
  supabase_db_data:
