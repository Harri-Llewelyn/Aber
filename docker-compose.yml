# =============================================================================================
# Node-RED authentication -- shared by node-red-init (which WRITES settings.js) and node-red
# (which LOADS it). settings.js reads all of this from process.env at load time rather than
# having it baked in as literals, so the secrets stay in the container environment instead of
# sitting in a file on a shared volume that every flow author can read.
#
# The two services must agree exactly. node-red-init's settingsAreCorrect() evaluates the file
# it wrote; a variable present in one container and absent from the other makes settings.js
# look wrong on every boot and get rewritten forever.
# =============================================================================================
x-nodered-auth-env: &nodered-auth-env
  NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET}

  # --- Human auth: OAuth2 + PKCE against GoTrue's OAuth server -------------------------------
  NODERED_OAUTH_CLIENT_ID: ${NODERED_OAUTH_CLIENT_ID:-c0ffee00-0000-4000-8000-000000000002}
  # Hashed into auth.oauth_clients by migration 0003. Rotating it means changing .env and
  # restarting supabase-db-init as well as these two services.
  NODERED_OAUTH_CLIENT_SECRET: ${NODERED_OAUTH_CLIENT_SECRET}
  # auth_url is followed by the BROWSER, so it must be the host-facing Kong address; token_url
  # and the userinfo endpoint are called by the CONTAINER, so they must be compose-internal.
  # Using one for both is the classic way this breaks -- see grafana.ini:36-42.
  NODERED_OAUTH_AUTH_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}/auth/v1/oauth/authorize
  NODERED_OAUTH_TOKEN_URL: http://supabase-kong:8000/auth/v1/oauth/token
  NODERED_USERINFO_URL: http://supabase-kong:8000/functions/v1/nodered-userinfo
  # Must match redirect_uris in auth.oauth_clients, or /oauth/authorize answers
  # "invalid redirect_uri". /auth/strategy/callback is Node-RED's own fixed route.
  NODERED_OAUTH_CALLBACK_URL: ${NODERED_PUBLIC_URL:-http://localhost:1880}/auth/strategy/callback

  # --- Machine auth ---------------------------------------------------------------------------
  # Verifies the Supabase access token deploy-nodered forwards. The same secret Kong, PostgREST,
  # Realtime and GoTrue sign and verify with.
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  # Verifies the 60-second token dispatch_device_quarantine_webhook() mints per event. A SIGNING
  # KEY, deliberately not a bearer credential and deliberately not the admin token: /hooks/
  # quarantine is an http-in node, so any flow author can read msg.req.headers.
  NODERED_WEBHOOK_JWT_SECRET: ${NODERED_WEBHOOK_JWT_SECRET}
  # Break-glass only, empty by default. A static token that bypasses Supabase entirely, for when
  # Supabase Auth is down and the flows still have to be reachable. Same reasoning as
  # disable_login_form = false in grafana/grafana.ini.
  NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}

services:
  # ---------------------------------------------------------------------------
  # Standalone TimescaleDB (Telemetry Hypertable Storage)
  # ---------------------------------------------------------------------------
  timescaledb:
    container_name: acs-cymru_timescaledb
    image: timescale/timescaledb:2.29.1-pg17
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Note: Initialization scripts in /docker-entrypoint-initdb.d only run on an empty data directory.
      # Existing pgdata volumes must be recreated (docker compose down -v) to pick up schema changes.
      # That is exactly why the retention policies and the rollups are NOT here -- see
      # timescaledb-maintenance below.
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Telemetry lifecycle reconciliation (runs on EVERY boot)
  # ---------------------------------------------------------------------------
  # Applies timescaledb/retention.sql (compression + retention on raw) and
  # timescaledb/aggregates.sql (the 1m/5m/1h rollups, their refresh and retention policies, and
  # the telemetry_latest view) with whatever intervals .env currently says -- so changing any of
  # them takes effect on the next `docker compose up`.
  #
  # NEITHER CAN LIVE IN /docker-entrypoint-initdb.d: those scripts run only on an empty data
  # directory, so the intervals could only ever be chosen before the first telemetry row existed
  # and no edit could reach a running stack. Rollups defined there would exist on fresh installs
  # and silently not exist anywhere else.
  #
  # Retention is a HARD DELETE with no undo, so every interval is the operator's to set. `never`
  # disables any individual policy.
  timescaledb-maintenance:
    container_name: acs-cymru_timescaledb_maintenance
    image: timescale/timescaledb:2.29.1-pg17
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TS_DBNAME: ${DB_NAME:-postgres}
      TS_USER: ${DB_USER:-postgres}
      TIMESCALE_COMPRESS_AFTER: ${TIMESCALE_COMPRESS_AFTER:-7 days}
      TIMESCALE_RETAIN_FOR: ${TIMESCALE_RETAIN_FOR:-90 days}
      # The rollups outlive the raw data deliberately -- see aggregates.sql. Each is far smaller
      # than the last, so a longer horizon costs little and answers questions the raw retention
      # window has already closed.
      TIMESCALE_ROLLUP_1M_RETAIN_FOR: ${TIMESCALE_ROLLUP_1M_RETAIN_FOR:-180 days}
      TIMESCALE_ROLLUP_5M_RETAIN_FOR: ${TIMESCALE_ROLLUP_5M_RETAIN_FOR:-1 year}
      TIMESCALE_ROLLUP_1H_RETAIN_FOR: ${TIMESCALE_ROLLUP_1H_RETAIN_FOR:-5 years}
      # Read-only role for external BI tools. EMPTY MEANS NO ROLE -- roles.sql skips it rather
      # than creating one with a blank password. See timescaledb/roles.sql.
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-}
    volumes:
      - ./timescaledb/retention.sql:/retention.sql:ro
      - ./timescaledb/storage.sql:/storage.sql:ro
      - ./timescaledb/aggregates.sql:/aggregates.sql:ro
      - ./timescaledb/roles.sql:/roles.sql:ro
    # The healthcheck cannot be trusted to mean "init has finished": the postgres entrypoint runs
    # initdb scripts against a temporary server that already answers on the unix socket, which is
    # what `pg_isready` inside the container asks. So wait for the hypertable itself -- the object
    # this script needs -- rather than for the port.
    entrypoint: >
      /bin/sh -e -c "
      echo 'Waiting for the telemetry hypertable...';
      i=0;
      until psql -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -tAc \"SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_name = 'telemetry'\" | grep -q 1; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo 'timed out waiting for the telemetry hypertable (created by timescaledb/init/001_schema.sql on an EMPTY data directory)' >&2; exit 1; fi;
        sleep 2;
      done;
      echo 'Reconciling compression and retention policies...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v compress_after=\"$$TIMESCALE_COMPRESS_AFTER\" -v retain_after=\"$$TIMESCALE_RETAIN_FOR\" -f /retention.sql;
      echo 'Reconciling telemetry rollups...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v rollup_1m_retain=\"$$TIMESCALE_ROLLUP_1M_RETAIN_FOR\" -v rollup_5m_retain=\"$$TIMESCALE_ROLLUP_5M_RETAIN_FOR\" -v rollup_1h_retain=\"$$TIMESCALE_ROLLUP_1H_RETAIN_FOR\" -f /aggregates.sql;
      echo 'Reconciling the storage footprint view...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -f /storage.sql;
      echo 'Reconciling read-only BI role...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v bi_reader_password=\"$$BI_READER_PASSWORD\" -f /roles.sql;
      "
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Self-Hosted Supabase Stack (Postgres, GoTrue Auth, PostgREST, Kong, Studio)
  # ---------------------------------------------------------------------------
  supabase-db:
    container_name: acs-cymru_supabase_db
    image: supabase/postgres:17.6.1.160
    restart: always
    ports:
      - "${SUPABASE_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # THE PGSODIUM ROOT KEY LIVES HERE, NOT IN PGDATA, and that asymmetry is the whole reason
      # this mount exists. /usr/lib/postgresql/bin/pgsodium_getkey.sh hardcodes
      # /etc/postgresql-custom/pgsodium_root.key and GENERATES A FRESH ONE when the file is absent.
      #
      # Without this volume the key is part of the container filesystem while the ciphertext it
      # protects is in supabase_db_data. `docker compose down` destroys the container and keeps the
      # volume, so `up` mints a new key and every vault.secrets row becomes undecryptable:
      #
      #   ERROR: pgsodium_crypto_aead_det_decrypt_by_id: invalid ciphertext
      #
      # which surfaces as migration 0006 failing and supabase-db-init exiting 3. `restart` and
      # `stop`/`start` keep the container, so this only bites on down/up -- which is why it can sit
      # unnoticed for a long time.
      #
      # BUMPING THE supabase/postgres TAG MEANS DELETING THIS VOLUME. Docker populates a new named
      # volume from the image on first use, so this directory ALSO carries image-owned, version
      # coupled config that postgresql.conf `include`s -- supautils.conf, read-replica.conf,
      # wal-g.conf and extension-custom-scripts/. Once the volume exists it shadows the image's
      # copies, so a stale supautils.conf would apply an old extension allow-list to a new server.
      # After an image bump:  docker compose down && docker volume rm <project>_supabase_db_config
      # (0006 now recovers from the resulting key loss on its own -- see its header.)
      - supabase_db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  supabase-db-roles-init:
    container_name: acs-cymru_supabase_db_roles_init
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Exec form with a literal block, NOT the folded `>` string form -- same reasoning as
    # supabase-kong-init, and additionally because `sh -c "a; b; c; echo done"` HAS NO ERROR
    # HANDLING: every psql failure is skipped and the exit status is the echo's, so this Job
    # reported "passwords set successfully" while having set none, and
    # `service_completed_successfully` was satisfied by a Job that did nothing. The cost landed
    # two services away, as GoTrue restarting on
    # `password authentication failed for user "supabase_auth_admin"`.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        echo 'Setting passwords for scoped Supabase roles...'

        # PREFLIGHT, because this is the failure people actually hit. POSTGRES_PASSWORD is read by
        # the postgres image ONLY AT INITDB -- that is, on a first boot against an empty data
        # directory. Change it in .env with supabase_db_data already populated and the database
        # keeps the OLD password, so this connection is the first thing to fail, and the message
        # below is the only place that can explain why.
        if ! psql -h supabase-db -U supabase_admin -d postgres -c 'SELECT 1' >/dev/null 2>&1; then
          echo '' >&2
          echo 'ERROR: cannot authenticate to supabase-db as supabase_admin.' >&2
          echo '' >&2
          echo 'POSTGRES_PASSWORD in .env does not match what this data volume was initialised' >&2
          echo 'with. The postgres image applies POSTGRES_PASSWORD at initdb only, so rotating it' >&2
          echo 'against an existing volume never reaches the database. Either:' >&2
          echo '' >&2
          echo '  * recreate the volume:  docker compose down -v && docker compose up -d' >&2
          echo '    (destroys all data), or' >&2
          echo '  * set the old password back in .env, then ALTER USER supabase_admin by hand.' >&2
          echo '' >&2
          exit 1
        fi

        # :'pw' rather than interpolating the password into the SQL text. Compose would otherwise
        # bake it into the entrypoint, where `docker inspect` shows it to anyone who can reach the
        # daemon; read from PGPASSWORD it stays in the environment. psql also quotes it correctly,
        # so a generated password containing a quote cannot break the statement.
        #
        # READ FROM A FILE, NOT PASSED VIA -c. psql expands :variables only in input it READS --
        # a file or standard input. A -c string goes to the server unexpanded, so it receives the
        # literal `:'pw'` and answers `syntax error at or near ":"`.
        echo "ALTER USER :\"role\" WITH PASSWORD :'pw';" > /tmp/set-role-password.sql

        for role in supabase_auth_admin authenticator supabase_storage_admin; do
          psql -h supabase-db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
               -v pw="$$PGPASSWORD" -v role="$$role" -f /tmp/set-role-password.sql
        done

        echo 'Scoped role passwords set successfully.'
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-db-init:
    container_name: acs-cymru_supabase_db_init
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # TimescaleDB connection settings, handed to the migrations as psql variables so
      # 0001_baseline_schema.sql can build its postgres_fdw link
      # without hardcoding credentials. Host/port are the compose-internal ones.
      TS_HOST: timescaledb
      TS_PORT: "5432"
      TS_DBNAME: ${DB_NAME:-postgres}
      TS_USER: ${DB_USER:-postgres}
      TS_PASSWORD: ${DB_PASSWORD:-postgres}
      # Seeded into Supabase Vault by 0002_seed_data.sql, which is the only
      # place it can live: the quarantine webhook trigger has to read it from SQL. Empty on
      # the default stack, where Node-RED runs without adminAuth -- the migration then leaves
      # the secret unset and the webhook goes out unauthenticated.
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
      # Hashed into auth.oauth_clients by 0002_seed_data.sql. Grafana
      # reads the same plaintext from its own environment via grafana.ini.
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      # The public origin the BROWSER reaches Grafana on. 0002_seed_data.sql registers
      # <this>/login/generic_oauth as the Grafana client's redirect_uris and sets client_uri to
      # <this>; the grafana service builds GF_SERVER_ROOT_URL from the same value, so the row and
      # Grafana's own idea of where it lives cannot drift. It MUST be passed here: the upsert is
      # DO UPDATE, so a hardcoded value would be rewritten back on every boot and no manual
      # correction would survive a restart.
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3002}
      # Node-RED's own OAuth client, hashed into auth.oauth_clients by 0003. Node-RED reads the
      # same plaintext from its own environment (see the x-nodered-auth-env anchor above).
      NODERED_OAUTH_CLIENT_SECRET: ${NODERED_OAUTH_CLIENT_SECRET:-}
      # Seeded into Vault by 0003 and read by dispatch_device_quarantine_webhook() to SIGN the
      # per-event webhook token. Node-RED holds the same key to verify it.
      NODERED_WEBHOOK_JWT_SECRET: ${NODERED_WEBHOOK_JWT_SECRET:-}
      # Registered as redirect_uris on the Node-RED OAuth client by 0003. Built from the same
      # NODERED_PUBLIC_URL as the callbackURL settings.js uses, so the two cannot drift apart --
      # they must match exactly or /oauth/authorize answers "invalid redirect_uri".
      NODERED_OAUTH_CALLBACK_URL: ${NODERED_PUBLIC_URL:-http://localhost:1880}/auth/strategy/callback
      # Creates the Supabase-side `grafana_reader` in migration 0027 -- the role Grafana connects
      # as to read public.storage_footprint. THE SAME CREDENTIAL as the historian's reader of the
      # same name, on purpose: it is the same tool, and a second secret to rotate for it is a
      # second secret to forget. The privileges are granted per database and share nothing but the
      # password. Empty skips the role entirely rather than creating one with a blank secret.
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Configuring PostgreSQL search_path...';
      psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;';
      echo 'Applying Supabase database migrations and seeds...';
      for f in /migrations/*.sql; do
        if [ -f \"$$f\" ]; then
          echo \"Executing migration $$f...\";
          attempt=1;
          while :; do
            if psql -v ON_ERROR_STOP=1 -v ts_host=\"$$TS_HOST\" -v ts_port=\"$$TS_PORT\" -v ts_dbname=\"$$TS_DBNAME\" -v ts_user=\"$$TS_USER\" -v ts_password=\"$$TS_PASSWORD\" -v nodered_admin_token=\"$$NODERED_ADMIN_TOKEN\" -v grafana_oauth_client_secret=\"$$GRAFANA_OAUTH_CLIENT_SECRET\" -v grafana_public_url=\"$$GRAFANA_PUBLIC_URL\" -v nodered_oauth_client_secret=\"$$NODERED_OAUTH_CLIENT_SECRET\" -v nodered_webhook_jwt_secret=\"$$NODERED_WEBHOOK_JWT_SECRET\" -v nodered_redirect_uri=\"$$NODERED_OAUTH_CALLBACK_URL\" -v bi_reader_password=\"$$BI_READER_PASSWORD\" -h supabase-db -U postgres -d postgres -f \"$$f\" > /tmp/migration.log 2>&1; then cat /tmp/migration.log; break; fi;
            cat /tmp/migration.log;
            # RETRIED ONLY ON A DEADLOCK, never on anything else. Every migration here is
            # idempotent and is replayed on every boot already, so re-running one is safe by
            # construction -- but retrying a genuine schema error three times only delays the
            # failure and prints it three times. A deadlock is the transient case: db-init takes
            # DDL locks on tables that supabase-realtime is concurrently reading for its
            # subscriptions, and either side can be chosen as the victim.
            if [ $$attempt -ge 3 ] || ! grep -q 'deadlock detected' /tmp/migration.log; then
              echo \"Migration $$f failed.\" >&2; exit 1;
            fi;
            echo \"Deadlock on $$f (attempt $$attempt) -- retrying in 3s.\" >&2;
            attempt=$$((attempt+1)); sleep 3;
          done;
        fi
      done;
      if [ -f /seed.sql ]; then
        echo 'Executing seed.sql...';
        psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -f /seed.sql;
      fi;
      echo 'Supabase database initialized successfully.';
      "
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_healthy
      # 0010 MAPS objects that timescaledb-maintenance CREATES on the historian -- the rollups and
      # telemetry_latest -- and its self-check reads each one over the FDW. Mapping them first
      # would succeed (postgres_fdw is lazy) and then fail at the first dashboard query, so the
      # dependency is real and stated here rather than left to start-up luck.
      timescaledb-maintenance:
        condition: service_completed_successfully

  supabase-auth:
    container_name: acs-cymru_supabase_auth
    image: supabase/gotrue:v2.189.0
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?sslmode=disable
      # The application's own URL, not Kong's. GoTrue builds user-facing redirects from this,
      # including the OAuth consent redirect below -- pointing it at the API gateway would
      # send the browser to a URL that serves no UI.
      GOTRUE_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # GoTrue does not default the audience. Without this it looks users up with
      # aud = '', never matches the seeded aud = 'authenticated' rows, and every
      # login fails with "Invalid login credentials".
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # CLOSED BY DEFAULT, and this is the only switch. There used to be a VITE_ALLOW_SIGNUP
      # build arg on the frontend that hid the sign-up form while this stayed "false" -- so the
      # endpoint was open to anyone who could reach Kong, and a self-registered account landed on
      # the default 'Operator' role handle_new_user() assigns. A client-side flag is not an access
      # control; this is.
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # OAuth 2.1 / OIDC authorization server, used by Grafana's [auth.generic_oauth].
      #
      # GoTrue serves /.well-known/openid-configuration unconditionally, whether or not this
      # is on -- a 200 there proves nothing. With the server disabled every endpoint it
      # advertises returns 404 ("OAuth server is disabled"). This flag is what makes
      # /oauth/authorize, /oauth/token and /oauth/userinfo real.
      GOTRUE_OAUTH_SERVER_ENABLED: "true"
      # Lets a client self-register at /oauth/clients/register. Kept on because the Grafana
      # client is seeded by migration through auth.oauth_clients instead, and this is the
      # documented way to mint a correctly-hashed secret if that ever needs redoing by hand.
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "true"
      # GoTrue ships NO consent UI. On /oauth/authorize it redirects the browser to
      # GOTRUE_SITE_URL + this path with ?authorization_id=..., and the application is
      # expected to render consent and POST the decision back to
      # /oauth/authorizations/{id}/consent. Without it, /oauth/authorize fails with
      # "oauth authorization path not configured" and no OIDC client can ever complete a login.
      # The route is served by the React dashboard (frontend/src/pages/OAuthConsent.jsx).
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: "/oauth/consent"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-rest:
    container_name: acs-cymru_supabase_rest
    image: postgrest/postgrest:v12.2.0
    restart: always
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  # Realtime v2: tails the Postgres WAL through a logical replication slot and fans
  # changes out over WebSockets, replacing the dashboard's 3s polling loops.
  #
  # Only the metadata tables in the `supabase_realtime` publication are published --
  # `cells`, `gateways` and `devices`, which is exactly what the dashboard subscribes to.
  # `public.telemetry` is deliberately excluded and cannot ever be included: it is a
  # postgres_fdw foreign table (0001_baseline_schema.sql) whose rows live in TimescaleDB's
  # WAL, never this database's, so it would emit nothing.
  # `public.digital_thread` is excluded for a different reason -- an unauthenticated
  # subscriber still receives the change ENVELOPE, so publishing the audit log leaks the
  # timing of quarantine and reconfiguration events. Nothing subscribed to it. Reading it
  # through PostgREST is unaffected; see the publication block in 0001_baseline_schema.sql.
  supabase-realtime:
    container_name: acs-cymru_supabase_realtime
    # Pinned rather than :latest -- Realtime runs its own migrations against the
    # _realtime schema on boot and is coupled to the Postgres image version.
    image: supabase/realtime:v2.34.47
    restart: always
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      # Needs REPLICATION privilege to create its logical slot. The scoped
      # `authenticator` role PostgREST connects as does not have it.
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      # Must be the same secret Kong, PostgREST and GoTrue verify with, or every
      # subscriber is rejected at the socket handshake.
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      # The image's /app/run.sh runs `ulimit -n $RLIMIT_NOFILE` under `set -u`, so
      # leaving this unset crash-loops the container on "unbound variable" before
      # the Elixir app ever starts. It is not optional.
      RLIMIT_NOFILE: "10000"
      # RLS is evaluated per change, per subscriber. Required: digital_thread is
      # restricted to privileged/auditor roles (migration 0005), and that has to
      # hold over the socket exactly as it does over PostgREST.
      RLS_ENABLED: "true"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      APP_NAME: realtime
    # Realtime resolves which tenant a request belongs to from the LEADING HOSTNAME
    # LABEL of the Host header, not from the JWT. Kong must therefore address it as
    # `realtime-dev.<something>` or every socket handshake is rejected with a bare 403.
    # `realtime-dev` is the tenant SEED_SELF_HOST creates. This alias is what makes the
    # upstream URL in supabase/kong.yml resolvable -- the two must be changed together.
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime
    healthcheck:
      # Two non-obvious details, both verified against this image:
      #   * The tenant is `realtime-dev`. SEED_SELF_HOST uses its own built-in name and
      #     ignores TENANT_NAME, so probing /api/tenants/realtime/health returns 404.
      #   * The endpoint is authenticated. An unauthenticated probe gets a flat 403 and
      #     the container never reports healthy. Using the anon key here also proves
      #     API_JWT_SECRET matches what the browser will present on the socket.
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Bearer ${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Object storage for binary asset artefacts -- today, the 3D visual models an AAS
  # `VisualRepresentation` submodel points at (archived migration 0035).
  #
  # It owns the `storage` schema and runs its OWN migrations against it on boot. Up to
  # supabase/postgres:15.6.1.143 the database image shipped a STUB of that schema
  # (buckets/objects/migrations, no `public` or `file_size_limit` columns); 17.6.1.160 ships the
  # schema EMPTY. That is why the bucket is created by supabase-storage-init afterwards rather
  # than by a SQL migration: supabase-db-init finishes long before this service starts, so a
  # migration inserting into storage.buckets would once have hit the stub and been unable to set
  # `public` -- and would now hit no table at all.
  #
  # The RLS policies on storage.objects moved out of migration 0001 for the same reason when the
  # stub disappeared. See supabase-storage-policies below.
  #
  # Pinned rather than :latest for the same reason as supabase-realtime -- it migrates a shared
  # schema on boot and is coupled to the Postgres image version.
  supabase-storage:
    container_name: acs-cymru_supabase_storage
    image: supabase/storage-api:v1.11.13
    restart: always
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      # Storage evaluates RLS on storage.objects by impersonating the caller's role, so it needs
      # the same PostgREST URL the rest of the stack uses to resolve the JWT's claims.
      POSTGREST_URL: http://supabase-rest:3000
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      # Required by the S3 code path even on the file backend; unused here.
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      # 127.0.0.1, not localhost: the image's musl resolver answers `localhost` with ::1 first and
      # storage-api binds 0.0.0.0 (IPv4 only), so the probe gets ECONNREFUSED against a healthy
      # server and the container never leaves `starting`.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Creates the `asset-3d-models` bucket through the Storage REST API rather than by writing to
  # storage.buckets directly: the API is the supported entry point and is indifferent to which
  # columns this storage-api version's schema actually has. Idempotent -- see the script.
  supabase-storage-init:
    container_name: acs-cymru_supabase_storage_init
    image: node:20-alpine
    environment:
      STORAGE_URL: http://supabase-storage:5000
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_BUCKET: ${STORAGE_MODEL_BUCKET:-asset-3d-models}
      STORAGE_FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      # The PRIVATE bucket holding Node-RED flow backups from gateway appliances, under
      # <sparkplug_id>/. Its own size limit, deliberately not STORAGE_FILE_SIZE_LIMIT: that one is
      # sized for 3D geometry, and a flows.json anywhere near 50 MiB is not a flow.
      #
      # THE NAME MUST MATCH supabase/storage-policies.sql. A bucket with no policies is invisible to
      # every browser-facing role, and a policy naming a bucket that was never created is dead text;
      # neither errors, so the two files are kept in step by hand.
      GATEWAY_BACKUP_BUCKET: ${GATEWAY_BACKUP_BUCKET:-gateway-backups}
      GATEWAY_BACKUP_FILE_SIZE_LIMIT: ${GATEWAY_BACKUP_FILE_SIZE_LIMIT:-5242880}
    volumes:
      - ./scripts/storage-init.mjs:/app/storage-init.mjs:ro
    command: ["node", "/app/storage-init.mjs"]
    restart: "no"
    depends_on:
      # NOT `supabase-storage: service_healthy` -- that is necessary but not sufficient. Creating
      # the bucket is served by storage-api AS service_role, so it needs the grants that
      # supabase-storage-policies applies. Without them the call fails 400 "new row violates
      # row-level security policy", which names the wrong mechanism entirely.
      supabase-storage-policies:
        condition: service_completed_successfully

  # RLS policies and grants on storage.buckets / storage.objects.
  #
  # A SEPARATE SERVICE RATHER THAN A MIGRATION, and that is forced rather than chosen. These were
  # section 6 of 0001_baseline_schema.sql until the PG17 bump: `supabase/postgres:15.6.1.143`
  # shipped a stub `storage` schema so `storage.objects` existed from first boot, and 17.6.1.160
  # ships that schema EMPTY. storage-api creates the tables in its own migrations when it boots,
  # and it depends on supabase-db-init having COMPLETED -- so no migration can attach a policy to
  # them, on either target, by construction.
  #
  # BETWEEN supabase-storage AND supabase-storage-init, in that order. See the file's header: the
  # bucket cannot be created until service_role has been granted the privileges this applies.
  #
  # Uses the supabase/postgres image for its psql, the same way supabase-db-roles-init does.
  supabase-storage-policies:
    container_name: acs-cymru_supabase_storage_policies
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/storage-policies.sql:/storage-policies.sql:ro
    # AS supabase_admin, NOT postgres -- the same role supabase-db-roles-init uses. The storage
    # tables are owned by `supabase_storage_admin` (storage-api created them), and `postgres` is
    # neither a superuser nor a member of that role in this image, so `ALTER TABLE ... ENABLE ROW
    # LEVEL SECURITY` fails with "must be owner of table objects". Verified against 17.6.1.160.
    entrypoint: >
      /bin/sh -e -c "
      echo 'Applying storage policies and grants...';
      psql -v ON_ERROR_STOP=1 -h supabase-db -U supabase_admin -d postgres -f /storage-policies.sql;
      "
    restart: "no"
    depends_on:
      supabase-storage:
        condition: service_healthy

  # Renders supabase/kong.yml (a template) into the config volume with the real API keys and the
  # Realtime upstream substituted. Kong 2.8 cannot read environment variables from declarative
  # config, and committing the keys into the template would put a copy of the service-role key in
  # git and make .env no longer authoritative. sed is safe here: a Supabase JWT is base64url, so
  # it contains no character that could be read as a sed delimiter or backreference.
  #
  # THIS SERVICE HAS NO KUBERNETES COUNTERPART -- Helm renders the same template into a Secret
  # directly. The template is shared; only the substituter differs. Adding a placeholder means
  # adding it here AND in the chart. See docs/kubernetes-architecture.md §2.3.
  supabase-kong-init:
    container_name: acs-cymru_supabase_kong_init
    image: alpine:3.20
    environment:
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Realtime resolves its tenant from the LEADING HOSTNAME LABEL, so this must begin
      # `realtime-dev.`. On Compose that is the network alias declared on the supabase-realtime
      # service; on Kubernetes the Service is simply named `realtime-dev` and the chart supplies
      # `http://realtime-dev:4000/socket/` here instead.
      REALTIME_UPSTREAM_URL: ${REALTIME_UPSTREAM_URL:-http://realtime-dev.supabase-realtime:4000/socket/}
      # THE BROWSER ORIGINS Kong will echo an Access-Control-Allow-Origin for.
      #
      # This is the whole origin policy for the stack: the edge functions deliberately declare
      # none (supabase/functions/_shared/cors.ts), because the gateway is the only layer that
      # sees a request before deciding to route it. An origin missing from this list is not a
      # degraded response -- it is a browser refusing to read a 200 the gateway happily returned.
      #
      # A JSON ARRAY, substituted into a YAML flow sequence -- see the note in supabase/kong.yml.
      # The default covers the two published ports of a stock Compose stack. Override it when the
      # dashboard is reached by any other name (a LAN hostname, a tunnel, a reverse proxy) --
      # which is the situation Kubernetes is permanently in, and the reason this is a variable
      # rather than the four literals it used to be.
      KONG_CORS_ORIGINS: '${KONG_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8088","http://127.0.0.1:8088"]}'
    volumes:
      - ./supabase/kong.yml:/template/kong.yml:ro
      - kong_config:/config
    # Exec form with a literal block, NOT the folded `>` string form. Compose shell-tokenizes a
    # string entrypoint, and the nested quotes the sed expressions need do not survive that
    # round trip -- the `-e` flags ended up as arguments to sh itself ("sh: -e: not found").
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        if [ -z "$$SUPABASE_ANON_KEY" ] || [ -z "$$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo 'SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY must be set -- Kong would otherwise register empty API keys, which key-auth accepts.' >&2
          exit 1
        fi
        # An empty or non-array value renders `origins:` as null, which Kong reads as "no origin
        # policy": it starts cleanly and then blocks every browser request, logging nothing.
        case "$$KONG_CORS_ORIGINS" in
          '['*']') ;;
          *)
            echo "KONG_CORS_ORIGINS must be a JSON array of browser origins. Got: $$KONG_CORS_ORIGINS" >&2
            exit 1
            ;;
        esac
        case "$$REALTIME_UPSTREAM_URL" in
          http://realtime-dev*|https://realtime-dev*) ;;
          *)
            echo "REALTIME_UPSTREAM_URL must have 'realtime-dev' as its leading hostname label -- Realtime reads the tenant id from it and answers a bare 403 otherwise. Got: $$REALTIME_UPSTREAM_URL" >&2
            exit 1
            ;;
        esac
        sed -e "s|__SUPABASE_ANON_KEY__|$$SUPABASE_ANON_KEY|g" \
            -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$$SUPABASE_SERVICE_ROLE_KEY|g" \
            -e "s|__REALTIME_UPSTREAM_URL__|$$REALTIME_UPSTREAM_URL|g" \
            -e "s|__CORS_ORIGINS__|$$KONG_CORS_ORIGINS|g" \
            /template/kong.yml > /config/kong.yml
        # Matches ANY surviving marker, not just the __SUPABASE_ ones. A placeholder added to the
        # template and forgotten here would otherwise render literally into Kong's config, where
        # it fails as a routing error rather than as a missing value.
        #
        # COMMENT LINES ARE EXCLUDED, and that is not cosmetic: kong.yml's header documents the
        # placeholder convention by name, so a whole-file scan flags the documentation of the rule
        # as a violation of it. A real placeholder is always in a value position.
        LEFTOVER=$$(grep -vE '^[[:space:]]*#' /config/kong.yml | grep -noE '__[A-Z0-9_]+__' || true)
        if [ -n "$$LEFTOVER" ]; then
          echo 'Kong config still contains unsubstituted placeholders:' >&2
          echo "$$LEFTOVER" >&2
          exit 1
        fi
        echo 'Rendered Kong declarative config with API key consumers.'

  supabase-kong:
    container_name: acs-cymru_supabase_kong
    image: kong:2.8.1-alpine
    restart: always
    ports:
      - "${KONG_HTTP_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      # key-auth had to be added explicitly: naming any plugin in KONG_PLUGINS REPLACES the
      # default `bundled` set rather than adding to it, so key-auth was not merely unused --
      # it was unavailable, and referencing it in kong.yml would have failed Kong's startup.
      #
      # `prometheus` is here for the same reason and MUST STAY IN STEP WITH THE CHART'S OWN LIST:
      # kong.yml is shared by both targets and declares the plugin globally, so a target missing it
      # here does not merely lose metrics -- Kong refuses to boot with "plugin 'prometheus' not
      # enabled". The metrics themselves are served on the STATUS listener, which Compose does not
      # publish; loading the plugin without it costs a shared-dict counter per request and is what
      # keeps the two targets' gateway configuration identical.
      KONG_PLUGINS: request-transformer,cors,key-auth,prometheus
      # THE PLUGIN ALONE SERVES NOTHING. `prometheus` collects, but the metrics are published on
      # the STATUS listener, which Kong does not start unless this is set -- so without it the
      # plugin is enabled, the scrape target is DOWN, and nothing says why. Bound to the compose
      # network only; it is not in `ports:` and no host publishes it.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
    volumes:
      - kong_config:/usr/local/kong/declarative:ro
    # ADDED so `ingestion` can wait on it -- see that service's depends_on for the failure this
    # closes. `kong health` checks the local node's own workers, which is the right question here:
    # "can this container route a request yet", not "is an upstream up".
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      supabase-kong-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-functions:
        condition: service_started
      # service_started, not service_healthy, to match its siblings: Kong should
      # not block stack startup on Realtime finishing its _realtime migrations.
      supabase-realtime:
        condition: service_started
      supabase-storage:
        condition: service_started

  supabase-functions:
    container_name: acs-cymru_supabase_functions
    image: supabase/edge-runtime:v1.74.2
    restart: always
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      VERIFY_JWT: "false"
      NODERED_URL: ${NODERED_URL:-http://node-red:1880/flows}
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
      # AAS export (aas-export). The base IRI namespaces every `globalAssetId` and submodel id the
      # shell carries, so it has to name the organisation publishing the document -- the default is
      # only correct for a local stack. Declared here rather than only in .env because an edge
      # worker sees nothing but the vars main/index.ts forwards to it.
      AAS_BASE_IRI: ${AAS_BASE_IRI:-https://acs-cymru.local/ids/asset/}
      # Where a consumer fetches the samples a Time Series LinkedSegment points at. Never the rows
      # themselves -- the shell references the historian, it does not embed it.
      AAS_HISTORIAN_ENDPOINT: ${AAS_HISTORIAN_ENDPOINT:-http://localhost:54321/rest/v1/telemetry}
      # Public base for the 3D models a VisualRepresentation submodel points at. It CANNOT be
      # derived from SUPABASE_URL: inside this network that is http://supabase-kong:8000, which
      # resolves for the worker and for nothing outside Docker, so a shell handed to a partner
      # would carry a dead link. Same reasoning as AAS_BASE_IRI -- an outbound reference has to
      # name an address the recipient can actually reach.
      AAS_MODEL_PUBLIC_BASE: ${AAS_MODEL_PUBLIC_BASE:-http://localhost:54321/storage/v1/object/public/asset-3d-models}
      STORAGE_MODEL_BUCKET: ${STORAGE_MODEL_BUCKET:-asset-3d-models}
      AAS_MAX_BUNDLED_MODEL_BYTES: ${AAS_MAX_BUNDLED_MODEL_BYTES:-33554432}
      # The bearer secret grafana-alert-webhook verifies. Grafana holds the same value, substituted
      # into its contact point -- it is NOT given the service-role key, which is what this narrow
      # credential exists to avoid. No `:-` default: an empty value makes the function answer 503
      # rather than accept unauthenticated writes, and a silent default here would hide that.
      GRAFANA_ALERT_WEBHOOK_SECRET: ${GRAFANA_ALERT_WEBHOOK_SECRET}
      # The credential-issuing service enroll-gateway calls (Phase 3). Compose-internal by
      # construction: that service publishes no port, so this address is only resolvable from
      # inside the network. The token is its bearer credential -- see .env.example for why it is
      # its own value and not shared with any other secret.
      MQTT_CREDENTIAL_SERVICE_URL: ${MQTT_CREDENTIAL_SERVICE_URL:-http://gateway-credential:9010}
      MQTT_CREDENTIAL_SERVICE_TOKEN: ${MQTT_CREDENTIAL_SERVICE_TOKEN:-}
      # Where an ENROLLED APPLIANCE dials the broker, returned in the enrolment response. NO
      # `mosquitto` DEFAULT ON PURPOSE: that resolves on this network and nowhere a gateway lives,
      # so a default would produce bundles that enrol perfectly and then connect to nothing.
      # enroll-gateway answers 503 rather than consume a token when this is unset or internal.
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
      MQTT_PUBLIC_TLS_PORT: ${MQTT_PUBLIC_TLS_PORT:-8883}
      # Where an APPLIANCE reaches the platform, written into the bundle's .env.
      #
      # NO DEFAULT, DELIBERATELY -- and specifically NOT `${SUPABASE_URL:-...}`. That variable is
      # http://127.0.0.1:54321 on a local stack, which is correct for a browser on this machine and
      # wrong for every appliance: inside a container 127.0.0.1 is the container itself. Defaulting
      # to it would produce bundles that look right and cannot enrol, which is the failure this
      # whole class of variable exists to prevent. Empty makes gateway-bundle answer 503 naming
      # this setting, before any token is issued.
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      # The canonical Node-RED flow - the "git" side of the GitOps sync that
      # deploy-nodered pushes to the running Node-RED.
      - ./node_red_flow.json:/home/deno/flows/node_red_flow.json:ro
      # The physical gateway bundle template gateway-bundle zips and serves. Read in the entrypoint
      # below for the same reason as the flow -- an edge worker cannot see this mount.
      - ./templates/physical-gateway:/home/deno/templates/physical-gateway:ro
      # Persist fetched remote modules so functions don't re-download on restart.
      - deno_cache:/root/.cache/deno
    # An edge-runtime user worker has no filesystem access to these mounts, so the
    # flow is handed to it through the environment instead: main/index.ts forwards
    # every env var to each worker it spawns. Reading the file here (in the plain
    # container shell, before edge-runtime starts) sidesteps the worker sandbox
    # without nesting a mountpoint inside the read-only functions mount, which
    # would create a stray 0-byte file in the repository.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        export NODERED_FLOW_JSON="$$(cat /home/deno/flows/node_red_flow.json)"
        # The bundle template, one variable per file. Static names, because FUNCTION_REGISTRY in
        # main/index.ts is an allow-list of variable NAMES and a dynamic set could not be declared
        # there. Kept in step with supabase/functions/Dockerfile's ENTRYPOINT, which does the same
        # for the Kubernetes target.
        T=/home/deno/templates/physical-gateway
        export GW_BUNDLE_COMPOSE="$$(cat $$T/docker-compose.yml)"
        export GW_BUNDLE_DOCKERFILE="$$(cat $$T/Dockerfile)"
        export GW_BUNDLE_BOOTSTRAP="$$(cat $$T/bootstrap.mjs)"
        export GW_BUNDLE_FLOWS="$$(cat $$T/flows.template.json)"
        export GW_BUNDLE_README="$$(cat $$T/README.md)"
        exec edge-runtime start --main-service /home/deno/functions/main
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Schema introspection API backing Supabase Studio's Database pages.
  # Studio speaks the postgres-meta protocol; pointing it at PostgREST returns
  # error payloads without the message/code/formattedError fields Studio's Zod
  # schema requires, which surfaces as a validation error in the UI.
  supabase-meta:
    container_name: acs-cymru_supabase_meta
    # Pinned to the version the official self-hosted stack pairs with the Studio
    # tag below. v0.91.0 omitted "formattedError" from its error payloads, which
    # failed Studio's Zod schema on the Database page.
    image: supabase/postgres-meta:v0.96.6
    restart: always
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-acs-cymru-pg-meta-crypto-key}
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-studio:
    container_name: acs-cymru_supabase_studio
    # Pinned rather than :latest -- Studio's Zod schemas are coupled to a specific
    # postgres-meta version. This is the pairing the official stack ships.
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: always
    ports:
      - "${STUDIO_PORT:-54323}:3000"
    environment:
      # Without this Next.js binds only the container's own interface, so the
      # image's bundled localhost healthcheck fails with ECONNREFUSED.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-acs-cymru-pg-meta-crypto-key}
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      # Server-side calls run inside the container, so this must be the internal
      # Kong address. SUPABASE_PUBLIC_URL stays host-facing for the browser.
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: ACS-Cymru
      DEFAULT_PROJECT_NAME: ACS-Cymru
      # Studio reads Edge Functions from disk, not over HTTP.
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./supabase/functions:/app/edge-functions:ro
      - studio_snippets:/app/snippets
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/platform/profile')
          .then((r) => { if (r.status !== 200) throw new Error(r.status) })"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      supabase-kong:
        condition: service_started
      supabase-meta:
        condition: service_started

  # Interactive API reference for the platform's HTTP surface (Kong -> Auth /
  # PostgREST / Edge Functions). Serves the curated spec in docs/openapi.yaml
  # alongside the live spec PostgREST generates from the database schema.
  swagger-ui:
    container_name: acs-cymru_swagger_ui
    image: swaggerapi/swagger-ui:v5.17.14
    restart: always
    ports:
      - "${SWAGGER_PORT:-8088}:8080"
    environment:
      # The two curated specs are mounted; the PostgREST entry is fetched by the browser from
      # Kong, so it needs the CORS origin allowed in supabase/kong.yml.
      #
      # i3X is a SECOND spec rather than a section of the first: it is served by i3x-service on
      # 8090, not by Kong, so it cannot share a `servers:` block -- and /v1/schema is already the
      # Factory+ Directory adapter's on this gateway. Its "Try it out" does not work, because the
      # i3X server sends no CORS headers and answers OPTIONS with 501; the spec's description says
      # so rather than leaving the button to fail mysteriously.
      # THE POSTGREST LIVE-SCHEMA ENTRY WAS REMOVED, and deliberately not repaired. It pointed at
      # /rest/v1/, which Kong gates with key-auth, so Swagger UI fetched it without an apikey and
      # the definition failed to load -- presenting as an authorization error rather than as a
      # missing key. It could have been made to load (kong.yml sets key_in_query on that route, so
      # `?apikey=<anon>` would work), but it was duplicating docs/openapi.yaml, which is
      # hand-maintained AND enforced: check-docs-drift.mjs asserts it covers every published
      # relation and every edge function. A second, auto-generated view of the same surface that
      # no check can keep honest is worth less than the one that is.
      URLS: >-
        [{"url":"/openapi.yaml","name":"ACS-Cymru Platform API"},
         {"url":"/i3x-openapi.yaml","name":"i3X 1.0 Server"}]
      URLS_PRIMARY_NAME: ACS-Cymru Platform API
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
    volumes:
      - ./docs/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
      - ./docs/i3x-openapi.yaml:/usr/share/nginx/html/i3x-openapi.yaml:ro

  # ---------------------------------------------------------------------------
  # Messaging & Edge Infrastructure
  # ---------------------------------------------------------------------------
  # Provisions the FIVE platform principals mosquitto.acl confines. There is deliberately no
  # wildcard-write account any more -- see the header of mosquitto.acl for what that account could
  # do and why verify_gateway_binding() could not catch it.
  #
  # NEVER `mosquitto_passwd -b -c` ON THE MERGED FILE: `-c` CREATES the file and discards
  # everything already in it, which on a stack with provisioned gateways means every physical
  # gateway loses its credential at once. It is conditional on the file not existing, below.
  #
  # THE PLATFORM PRINCIPALS ARE REWRITTEN ON EVERY RUN -- they come from .env and must follow it.
  # Anything else in the file is left alone, because that is where issued gateway credentials live
  # and this service is not their source of truth.
  #
  # Why the `-c` was once applied to the first account, and what that cost:
  #   docs/incidents.md -> "Truncating the broker password file"
  #
  # A one-shot is NOT run once. Compose re-runs a completed one-shot whenever something that
  # depends on it is brought up, which is the property that made the above a live fault rather
  # than a first-boot one.
  # ---------------------------------------------------------------------------
  # Broker CA and MQTTS leaf certificate (Compose only)
  # ---------------------------------------------------------------------------
  # THE COMPOSE COUNTERPART OF deploy/k8s/internal-ca.yaml. On Kubernetes cert-manager issues the
  # broker's leaf from a ClusterIssuer and the chart appends mosquitto-tls.conf when the Secret
  # exists; Compose had no equivalent, so MQTTS was a manual, documented-but-unbuilt opt-in and the
  # physical-gateway flow was Kubernetes-only by accident of certificate management.
  #
  # THE ROOT IS NEVER REGENERATED ONCE IT EXISTS -- see the script's header. It is distributed by
  # hand to every physical gateway's trust store, so minting a new one does not fail loudly, it
  # succeeds and takes the whole fleet offline. `mosquitto_certs` is a named volume for exactly that
  # reason: `docker compose down` must not take the CA with it.
  #
  # THIS SERVICE HAS NO KUBERNETES COUNTERPART. Do not add one -- cert-manager owns that half.
  mosquitto-tls-init:
    container_name: acs-cymru_mosquitto_tls_init
    build:
      context: ./mosquitto-tls-init
    # Root, because it chowns the key to the uid mosquitto drops to (1883). The broker reads its
    # own key AFTER dropping privileges, so a key it cannot read exits the broker with an OpenSSL
    # "system library" error that names neither the file nor the permission.
    user: "0"
    environment:
      # Folded into the certificate's SAN. A gateway dials the broker by this name, and a
      # certificate that does not carry it fails verification at the appliance -- which is the
      # correct outcome for a wrong name and an infuriating one for a missing entry.
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
      MQTT_TLS_SAN_EXTRA: ${MQTT_TLS_SAN_EXTRA:-}
    volumes:
      - mosquitto_certs:/mosquitto/certs
      - ./scripts/mosquitto-tls-init.mjs:/scripts/mosquitto-tls-init.mjs:ro
    command: ["node", "/scripts/mosquitto-tls-init.mjs"]
    restart: "no"

  mosquitto-init:
    container_name: acs-cymru_mosquitto_init
    image: eclipse-mosquitto:2.0.20
    user: "0"
    environment:
      MQTT_INGESTION_USER: ${MQTT_INGESTION_USER:-factoryplus_ingestion}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD}
      MQTT_I3X_USER: ${MQTT_I3X_USER:-factoryplus_i3x}
      MQTT_I3X_PASSWORD: ${MQTT_I3X_PASSWORD}
      MQTT_SIMULATOR_USER: ${MQTT_SIMULATOR_USER:-gwy100000000000400080000}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      MQTT_VALIDATOR_USER: ${MQTT_VALIDATOR_USER:-gwy110000000000400080000}
      MQTT_VALIDATOR_PASSWORD: ${MQTT_VALIDATOR_PASSWORD}
      MQTT_MONITOR_USER: ${MQTT_MONITOR_USER:-factoryplus_monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD}
      # THE FOUR SIMULATED CELL GATEWAYS, seeded here rather than by `provision:gateways`.
      #
      # The broker is the only place these accounts can exist, and node-red-init -- which runs in
      # this same `up` -- fails closed without them. Provisioning cannot fill that gap because it
      # needs the stack it is blocking. An EMPTY password skips the account rather than creating an
      # empty one, so a production install that does not want the simulator simply leaves them
      # unset. Same rule, same reasoning, as the chart's `acs-cymru.mqttPrincipalUpserts`.
      MQTT_GW_CNC_MACHINING_USER: ${MQTT_GW_CNC_MACHINING_USER:-gwy120000000000400080000}
      MQTT_GW_CNC_MACHINING_PASSWORD: ${MQTT_GW_CNC_MACHINING_PASSWORD:-}
      MQTT_GW_ROBOTIC_ASSEMBLY_USER: ${MQTT_GW_ROBOTIC_ASSEMBLY_USER:-gwy130000000000400080000}
      MQTT_GW_ROBOTIC_ASSEMBLY_PASSWORD: ${MQTT_GW_ROBOTIC_ASSEMBLY_PASSWORD:-}
      MQTT_GW_AGV_FLEET_USER: ${MQTT_GW_AGV_FLEET_USER:-gwy140000000000400080000}
      MQTT_GW_AGV_FLEET_PASSWORD: ${MQTT_GW_AGV_FLEET_PASSWORD:-}
      MQTT_GW_FACILITY_BMS_USER: ${MQTT_GW_FACILITY_BMS_USER:-gwy150000000000400080000}
      MQTT_GW_FACILITY_BMS_PASSWORD: ${MQTT_GW_FACILITY_BMS_PASSWORD:-}
    volumes:
      - mosquitto_data:/mosquitto/config
      # THE POLICY FILES MOVED TO /policy, AND mosquitto.conf IS NOW ASSEMBLED RATHER THAN
      # BIND-MOUNTED. The TLS stanza has to be APPENDED to the base config when certificates exist
      # (mosquitto exits 1 on a `certfile` that is not there), and a read-only bind mount cannot be
      # appended to. This is the same assembly the Helm chart's initContainer already performs, so
      # the two targets now differ in transport and not in method. mosquitto.acl is deliberately
      # NOT assembled -- it stays a read-only bind mount on the broker itself, because it is the
      # security-critical file and nothing should be able to rewrite it at runtime.
      - ./mosquitto.conf:/policy/mosquitto.conf:ro
      - ./mosquitto-tls.conf:/policy/mosquitto-tls.conf:ro
      - mosquitto_certs:/certs:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Assembling broker configuration...';
      cp /policy/mosquitto.conf /mosquitto/config/mosquitto.conf;
      if [ -s /certs/tls.crt ] && [ -s /certs/tls.key ] && [ -s /certs/ca.crt ]; then
        echo '' >> /mosquitto/config/mosquitto.conf;
        cat /policy/mosquitto-tls.conf >> /mosquitto/config/mosquitto.conf;
        echo 'Appended the MQTTS listener (8883); certificates are present.';
      else
        echo 'NO BROKER CERTIFICATES FOUND -- 8883 will not be offered, and physical gateways cannot enrol. Check the mosquitto-tls-init service.' >&2;
      fi;
      if [ -z \"$$MQTT_INGESTION_PASSWORD\" ] || [ -z \"$$MQTT_I3X_PASSWORD\" ] || [ -z \"$$MQTT_VALIDATOR_PASSWORD\" ] || [ -z \"$$MQTT_MONITOR_PASSWORD\" ]; then
        echo 'One or more MQTT_*_PASSWORD values are empty. The broker runs allow_anonymous false, so an empty credential fails as CONNACK 5 with no useful log line at either end. Run: node scripts/setup.mjs' >&2;
        exit 1;
      fi;
      if [ ! -f /mosquitto/config/password_file ]; then
        mosquitto_passwd -b -c /mosquitto/config/password_file \"$$MQTT_INGESTION_USER\" \"$$MQTT_INGESTION_PASSWORD\";
      else
        mosquitto_passwd -b /mosquitto/config/password_file \"$$MQTT_INGESTION_USER\" \"$$MQTT_INGESTION_PASSWORD\";
      fi;
      mosquitto_passwd -b /mosquitto/config/password_file \"$$MQTT_I3X_USER\" \"$$MQTT_I3X_PASSWORD\";
      if [ -n \"$$MQTT_SIMULATOR_PASSWORD\" ]; then
        mosquitto_passwd -b /mosquitto/config/password_file \"$$MQTT_SIMULATOR_USER\" \"$$MQTT_SIMULATOR_PASSWORD\";
        echo \"Created the LEGACY simulator account '$$MQTT_SIMULATOR_USER' -- its gateway row was deleted by migration 0020, so nothing on a current stack publishes under it.\";
      fi;
      mosquitto_passwd -b /mosquitto/config/password_file \"$$MQTT_VALIDATOR_USER\" \"$$MQTT_VALIDATOR_PASSWORD\";
      mosquitto_passwd -b /mosquitto/config/password_file \"$$MQTT_MONITOR_USER\" \"$$MQTT_MONITOR_PASSWORD\";
      for p in GW_CNC_MACHINING GW_ROBOTIC_ASSEMBLY GW_AGV_FLEET GW_FACILITY_BMS; do
        eval user=\"\\$$MQTT_$${p}_USER\";
        eval pass=\"\\$$MQTT_$${p}_PASSWORD\";
        if [ -n \"$$pass\" ]; then
          mosquitto_passwd -b /mosquitto/config/password_file \"$$user\" \"$$pass\";
        else
          echo \"MQTT_$${p}_PASSWORD is empty -- not creating an account for '$$user'.\";
        fi;
      done;
      chmod 644 /mosquitto/config/password_file;
      echo \"Mosquitto password file initialized with $$(grep -c : /mosquitto/config/password_file) account(s)\";
      "
    depends_on:
      # The assembly above decides whether to append the TLS listener by asking whether the
      # certificates exist, so it must run AFTER they have been issued. Without this the first
      # `docker compose up` on a fresh volume races: the config is assembled with no certificates,
      # the broker comes up on 1883 only, and MQTTS appears to be broken until something else
      # happens to restart this one-shot.
      mosquitto-tls-init:
        condition: service_completed_successfully

  mosquitto:
    container_name: acs-cymru_mosquitto
    image: eclipse-mosquitto:2.0.20
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
      # MQTTS. PLAINTEXT 1883 STAYS OPEN AND THAT IS DELIBERATE: the in-network services
      # (ingestion, i3x, the Node-RED simulator) and the virtual gateways all speak to the broker
      # over the Docker network, where the credential never leaves the host. 8883 exists for the
      # clients that are NOT on that network -- physical gateways -- whose bundles and templates
      # are configured for it exclusively. Two listeners, one password file, one ACL: mosquitto.conf
      # declares the security options globally, so both are authorised identically.
      - "8883:8883"
    environment:
      # The healthcheck's credential ONLY. It reads $SYS/# and can publish nothing, so the probe
      # is not a standing wildcard credential sitting in the broker's own environment.
      MQTT_MONITOR_USER: ${MQTT_MONITOR_USER:-factoryplus_monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD}
    volumes:
      # mosquitto.conf arrives THROUGH THIS VOLUME, assembled by mosquitto-init -- it is no longer
      # bind-mounted here, because the TLS stanza has to be appended to it and a read-only bind
      # cannot be appended to. The repository is still the only source of its content; see the
      # note on mosquitto-init's volumes.
      - mosquitto_data:/mosquitto/config
      # Topic authorisation. STILL a read-only bind mount, and deliberately not assembled: it is
      # repository-managed policy, it is the file that confines every principal, and nothing at
      # runtime should be able to rewrite it.
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      # The paths mosquitto-tls.conf names. Read-only: the broker presents this leaf, it does not
      # manage it. The CA's private key is NOT in this volume's readable set for the broker uid --
      # mosquitto-tls-init leaves ca.key root-owned and 0600.
      - mosquitto_certs:/mosquitto/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u $${MQTT_MONITOR_USER:-factoryplus_monitor} -P $${MQTT_MONITOR_PASSWORD} -t '$$SYS/broker/version' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Broker credential-issuing service
  # ---------------------------------------------------------------------------
  # The narrow authority `enroll-gateway` calls to mint a gateway's Mosquitto account.
  #
  # WHY IT IS A SERVICE AT ALL. An edge worker has no Docker socket, no kubectl and no access to the
  # password file, so it cannot issue an account -- and giving it a credential that could (a Docker
  # socket is root on the host) would be a far larger authority than "add one line to a file". This
  # container holds that authority instead, and holds nothing else: one endpoint, one verb, no
  # database, no way to read a password back.
  #
  # NO `ports:`, AND THAT IS THE PRIMARY CONTROL. It is reachable only from the compose network, by
  # name, on 9010. Publishing it would put credential minting on the host interface, and because
  # mosquitto.acl confines an account to `spBv1.0/+/+/%u/#`, minting is the ability to publish
  # telemetry as any gateway on the site. The bearer token is the second layer, not the first.
  #
  # `pid: "service:mosquitto"` IS LOAD-BEARING, not a convenience. Mosquitto re-reads the password
  # file only on SIGHUP, and a signal cannot cross a PID namespace -- without this the service would
  # write a correct file that the running broker ignores until its next restart, so a freshly
  # enrolled gateway would be refused with nothing to distinguish "not reloaded" from "wrong
  # password". It is the Compose equivalent of `shareProcessNamespace: true` on the broker's pod,
  # which the chart already sets for the existing reload sidecar.
  gateway-credential:
    container_name: acs-cymru_gateway_credential
    build:
      context: ./gateway-credential
    restart: always
    pid: "service:mosquitto"
    environment:
      CREDENTIAL_TARGET: compose
      # The service REFUSES TO START without this, rather than defaulting or running open -- a
      # default would live in the repository and therefore be known. Generated by scripts/setup.mjs
      # and shared with supabase-functions, which is the only caller.
      MQTT_CREDENTIAL_SERVICE_TOKEN: ${MQTT_CREDENTIAL_SERVICE_TOKEN}
      MQTT_CREDENTIAL_SERVICE_PORT: "9010"
    volumes:
      # The same volume the broker reads its password file from. Writable: this is the one service
      # that may add an account.
      - mosquitto_data:/mosquitto/config
      # READ-ONLY, and for the CA only. An appliance needs the root that signs the certificate the
      # broker will present, and this service is the only component sitting beside the broker on
      # both targets -- so it is the only one that can read the CA actually in use. `ca.key` is in
      # this volume too and is never opened: mosquitto-tls-init leaves it root-owned at 0600.
      - mosquitto_certs:/mosquitto/certs:ro
      - ./scripts/gateway-credential-service.mjs:/scripts/gateway-credential-service.mjs:ro
      - ./scripts/lib/mosquitto-credentials.mjs:/scripts/lib/mosquitto-credentials.mjs:ro
    command: ["node", "/scripts/gateway-credential-service.mjs"]
    healthcheck:
      # wget, not curl: the eclipse-mosquitto base is Alpine and ships busybox wget.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9010/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      # `pid: service:mosquitto` requires the broker's namespace to exist, so this cannot start
      # first -- Compose enforces that for the pid reference, and the healthy condition additionally
      # means the password file is present and readable before the first issuance is attempted.
      mosquitto:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application Runtimes & Ingestion
  # ---------------------------------------------------------------------------
  # React Web Dashboard (multi-stage build serving static assets via NGINX on port 3000)
  #
  # BAKED CONFIGURATION, deliberately: Compose builds the image against the stack it will serve, so
  # inlining is simpler and there is nothing to mount. The Kubernetes path builds the same
  # Dockerfile with VITE_RUNTIME_CONFIG=true and mounts a ConfigMap over /config.js instead --
  # frontend/src/config.js prefers the runtime value and falls through to these. See
  # docs/kubernetes-architecture.md §2.1.
  frontend:
    container_name: acs-cymru_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_ENABLE_REALTIME: ${VITE_ENABLE_REALTIME:-true}
        VITE_GITHUB_REPO_URL: ${VITE_GITHUB_REPO_URL:-https://github.com/Harri-Llewelyn/ACS-Cymru}
        # Defaults to GRAFANA_PUBLIC_URL, so a stack that moves Grafana gets the dashboard's
        # "View in Grafana" links right without a second variable. VITE_GRAFANA_URL still overrides
        # it, for the case where the browser reaches Grafana on a different origin from the one
        # registered as the OAuth redirect.
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-${GRAFANA_PUBLIC_URL:-http://localhost:3002}}
        # Only needed if a bucket was renamed; src/api.js defaults to the same names
        # storage-init.mjs does, so the two agree without either being set.
        VITE_MODEL_3D_BUCKET: ${STORAGE_BUCKET:-asset-3d-models}
        VITE_GATEWAY_BACKUP_BUCKET: ${GATEWAY_BACKUP_BUCKET:-gateway-backups}
    restart: always
    ports:
      - "3000:3000"

  ingestion:
    container_name: acs-cymru_ingestion
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # PUBLISHED SO IT CAN BE SCRAPED, and there is nothing here to scrape it with -- this stack
    # ships no Prometheus, and Grafana holds two Postgres datasources and no others. The port is
    # published anyway because the endpoint is how the daemon is INSPECTED: `curl localhost:9108/
    # metrics` answers "is it dropping anything" without reading a log, and an operator running
    # their own Prometheus alongside can point it here. See issues #22 and #24.
    ports:
      - "${INGESTION_METRICS_PORT:-9108}:9108"
    environment:
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # The ingestion principal: reads spBv1.0/# and may publish ONLY rebirth NCMDs. It cannot
      # publish DBIRTH or DDATA at all, which is what stops this daemon's credential being usable
      # to forge telemetry for a device that is correctly bound -- the one forgery
      # verify_gateway_binding() cannot detect, because such a message satisfies it by design.
      MQTT_USER: ${MQTT_INGESTION_USER:-factoryplus_ingestion}
      MQTT_PASSWORD: ${MQTT_INGESTION_PASSWORD}
      # MQTTS, opt-in and EMPTY BY DEFAULT -- this broker declares no TLS listener (see
      # mosquitto-tls.conf for why it is a separate file). An empty MQTT_TLS_ENABLED is a no-op in
      # ingestion.py, so the default path is unchanged. Passed through rather than omitted so that
      # an operator who does mount certificates does not have to edit this file.
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Device liveness watchdog. A device that stops publishing writes nothing and emits no
      # DDEATH, so without this it stays ONLINE forever. 0 disables it; raise the window for a
      # fleet of event-driven devices that legitimately stay quiet for long periods.
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-300}
      DEVICE_WATCHDOG_INTERVAL_SECONDS: ${DEVICE_WATCHDOG_INTERVAL_SECONDS:-30}
      # Rebirth requests are what recover a Sparkplug alias table after a restart. Rate limited
      # per edge node, because a gateway that reboots on rebirth would otherwise be held in a
      # loop by the mechanism meant to recover it.
      REBIRTH_REQUEST_INTERVAL_SECONDS: ${REBIRTH_REQUEST_INTERVAL_SECONDS:-300}
      PYTHONUNBUFFERED: "1"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      supabase-db-init:
        condition: service_completed_successfully
      # EVERY DEVICE LOOKUP GOES THROUGH KONG (SUPABASE_URL above is http://supabase-kong:8000),
      # and this dependency was missing. `supabase-db-init` completing says the DATA is there; it
      # says nothing about the gateway that reads it, which starts in parallel with this service.
      #
      # Ordering only, and deliberately NOT the safety property. What makes an unresolvable lookup
      # harmless is ingestion.py refusing to read "unreachable" as "unregistered" -- see
      # DirectoryUnavailable, and process_dbirth(), which answers "unregistered" by writing a
      # quarantine row. That guard is the one that matters, because Kong can become unreachable
      # long after boot, where no depends_on helps at all.
      #
      # This is here so the daemon's first lookups do not fail for a reason the stack already
      # knows about, which keeps the startup log free of errors that are not faults.
      supabase-kong:
        condition: service_healthy

  # i3X 1.0 server (CESMII Industrial Information Interoperability eXchange).
  #
  # A READ-SIDE ADAPTER, alongside ingestion rather than inside it. It holds its own `spBv1.0/#`
  # subscription because i3X subscriptions must accumulate value changes between client polls, and
  # those values cannot come from Supabase Realtime -- `telemetry` is a postgres_fdw foreign table
  # whose rows never enter Supabase's WAL, so publishing it emits nothing at all, silently.
  #
  # `replicas: 1` is a correctness constraint here as it is for ingestion, and for a second reason
  # on top of the duplicate-consumption one: subscription state (queues, sequence numbers, open SSE
  # streams) is in memory, so a second replica would answer `/subscriptions/sync` for a
  # subscription it has never heard of and return 404 for a live client.
  i3x-service:
    container_name: acs-cymru_i3x
    build:
      # REPOSITORY ROOT: sparkplug_b.proto lives there and the image compiles it.
      context: .
      dockerfile: i3x/Dockerfile
    restart: always
    ports:
      - "${I3X_PORT:-8090}:8090"
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      # THE ANON KEY, AND DELIBERATELY NOT THE SERVICE-ROLE KEY. This service authenticates the
      # caller and then queries PostgREST as that caller, so RLS decides what the i3X address space
      # contains. `main()` REFUSES TO START if SUPABASE_SERVICE_ROLE_KEY is present, which turns a
      # copy-paste of the ingestion environment block into a container that will not boot rather
      # than into a silent, total RLS bypass over every asset on the site.
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # READ-ONLY at the broker, matching what this service already refuses to do in code: writes
      # answer 405 and `/info` declares `update.current: false`. Sharing the ingestion account
      # would hand a service designed not to write a credential that can publish NCMD.
      MQTT_USER: ${MQTT_I3X_USER:-factoryplus_i3x}
      MQTT_PASSWORD: ${MQTT_I3X_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      # Subscription limits. The TTL is a spec MUST -- an abandoned subscription must be deleted, or
      # a client that walks away holds a queue open forever. The queue limit is what makes overflow
      # a reported 206 rather than unbounded memory growth.
      I3X_SUBSCRIPTION_TTL_SECONDS: ${I3X_SUBSCRIPTION_TTL_SECONDS:-300}
      I3X_SUBSCRIPTION_QUEUE_LIMIT: ${I3X_SUBSCRIPTION_QUEUE_LIMIT:-10000}
      PYTHONUNBUFFERED: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
      supabase-kong:
        condition: service_started
      supabase-db-init:
        condition: service_completed_successfully

  node-red-init:
    container_name: acs-cymru_node_red_init
    # Built, not pulled, and from the SAME context as node-red below. settingsAreCorrect()
    # evaluates settings.js, which requires passport-oauth2 -- an init container without it
    # concludes the settings are wrong and rewrites them on every boot. See node-red/Dockerfile.
    build:
      context: ./node-red
    user: "0"
    environment:
      <<: *nodered-auth-env
      # LEGACY FALLBACK ONLY. This was the credential of the single-device simulator, whose gateway
      # row migration 0020 deletes -- so nothing the shipped flow publishes uses it any more. It is
      # still passed because node-red-init applies it to a `mqtt-broker-config` node, which exists
      # only on a Node-RED volume created before the flow was consolidated. Every broker node in
      # the current flow names its own pair through `acsCredentialsEnv`; see below.
      MQTT_USER: ${MQTT_SIMULATOR_USER:-gwy100000000000400080000}
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      # ---------------------------------------------------------------------------------------
      # ONE CREDENTIAL PAIR PER CELL GATEWAY, because mosquitto.acl pins the topic's edge-node
      # segment to the connecting username -- four cells cannot share a connection.
      #
      # Each broker node in node_red_flow.json names its pair in `acsCredentialsEnv`, and
      # node-red-init fails closed when a declared pair is absent rather than seeding an empty
      # username (which the broker refuses with CONNACK 5 while Node-RED reports only
      # "Connection failed to broker").
      #
      # The PASSWORDS are generated by `npm run setup` and the accounts are created by
      # mosquitto-init, in the same `up` as this container -- provisioning cannot do it, because it
      # needs the running stack that this container is blocking.
      #
      # Rotate with: npm run provision:gateways -- --env-out=.env.gateways
      # Then fold that file into .env, or mosquitto-init puts the old password back on the next
      # start: .env is authoritative for these accounts, exactly as values are on Kubernetes.
      #
      # THE USERNAMES DEFAULT TO THE SEEDED sparkplug_ids rather than to empty. An empty username
      # is the failure this whole block exists to prevent, so it is not the fallback.
      # ---------------------------------------------------------------------------------------
      MQTT_GW_CNC_MACHINING_USER: ${MQTT_GW_CNC_MACHINING_USER:-gwy120000000000400080000}
      MQTT_GW_CNC_MACHINING_PASSWORD: ${MQTT_GW_CNC_MACHINING_PASSWORD:-}
      MQTT_GW_ROBOTIC_ASSEMBLY_USER: ${MQTT_GW_ROBOTIC_ASSEMBLY_USER:-gwy130000000000400080000}
      MQTT_GW_ROBOTIC_ASSEMBLY_PASSWORD: ${MQTT_GW_ROBOTIC_ASSEMBLY_PASSWORD:-}
      MQTT_GW_AGV_FLEET_USER: ${MQTT_GW_AGV_FLEET_USER:-gwy140000000000400080000}
      MQTT_GW_AGV_FLEET_PASSWORD: ${MQTT_GW_AGV_FLEET_PASSWORD:-}
      MQTT_GW_FACILITY_BMS_USER: ${MQTT_GW_FACILITY_BMS_USER:-gwy150000000000400080000}
      MQTT_GW_FACILITY_BMS_PASSWORD: ${MQTT_GW_FACILITY_BMS_PASSWORD:-}
      # Seeding is first-run only, so editor changes survive `docker compose up`.
      # Set to true for a deliberate reset back to the repo's flow.
      NODE_RED_FORCE_SEED: ${NODE_RED_FORCE_SEED:-false}
    volumes:
      - nodered_data:/data
      - ./node_red_flow.json:/seed/flows.json:ro
      - ./scripts/node-red-init.mjs:/seed/node-red-init.mjs:ro
    # Writes flows_cred.json encrypted at rest. The script fails closed if it
    # cannot produce ciphertext, rather than silently emitting plaintext secrets.
    entrypoint: >
      /bin/sh -e -c "
      node /seed/node-red-init.mjs;
      chown -R 1000:1000 /data;
      "

  node-red:
    container_name: acs-cymru_node_red
    build:
      context: ./node-red
    restart: always
    # settings.js resolves every one of these from process.env when Node-RED loads it, so the
    # runtime container needs the same block the init container was given. A value present at
    # write time but absent at load time yields an adminAuth whose strategy has no clientID --
    # which fails at login rather than at boot.
    environment:
      <<: *nodered-auth-env
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      node-red-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      # Start the simulator after the consumer so the first DBIRTH is less likely to be
      # published into an empty subscription. The flow also rebirths every 60s, which is
      # what actually guarantees the birth certificate is eventually seen.
      ingestion:
        condition: service_started

  # ===============================================================================================
  # Prometheus -- the metrics store the alert rules read.
  #
  # COMPOSE ONLY. On Kubernetes the chart renders ServiceMonitor objects and defers to the cluster's
  # own Operator-managed Prometheus; shipping a second one there would duplicate every series and
  # give an operator two places to set retention. The divergence is recorded in
  # deploy/k8s/README.md and in prometheus/prometheus.yml's header.
  #
  # NOT AN ALERT ENGINE HERE. It stores; Grafana evaluates. That keeps every alert in this platform
  # in one file and one contact-point tree rather than splitting them by which datasource answers.
  # ===============================================================================================
  prometheus:
    container_name: acs-cymru_prometheus
    image: prom/prometheus:v3.1.0
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # THIRTY DAYS, SET RATHER THAN DEFAULTED. The default is 15d, which is a reasonable number
      # nobody chose; this host also carries two Postgres data directories, so the size of this
      # database is a decision about somebody else's disk. Long enough that a weekly pattern is
      # visible and a Monday-morning question about last Tuesday can be answered.
      - '--storage.tsdb.retention.time=30d'
      # A hard ceiling as well as a time bound. Retention by time alone is unbounded in BYTES: a
      # burst of new series -- a fleet of gateways enrolled at once -- fills the disk inside the
      # window. Whichever limit is reached first wins.
      - '--storage.tsdb.retention.size=8GB'
      # NO `--web.enable-lifecycle`, AND IT WAS HERE UNTIL IT WAS TESTED. That flag enables
      # POST /-/reload, which is convenient -- and POST /-/quit, which is a REMOTE SHUTDOWN of the
      # monitoring, on an endpoint that takes no credential. Verified reachable before removing it.
      #
      # Prometheus has no authentication of its own beyond a basic-auth web config, so the controls
      # available are: what the endpoint can DO, and who can reach the port. This is the first.
      # A config change here is a `docker compose restart prometheus`, which is what the reload
      # would have saved and is not worth a kill switch.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # LOOPBACK ONLY, and the only published port in this file that is. Prometheus has no
      # authentication -- that is a deliberate decision, not an oversight -- so the control over who
      # reads it is who can reach the port. Bound to all interfaces on the deployment VM, its
      # expression browser would offer every metric here to anyone on the plant network: Kong
      # request rates by route, host disk, every gateway's wire id.
      #
      # `127.0.0.1:` MAKES IT SSH-TUNNEL-ONLY AND COSTS NOTHING OPERATIONALLY. Grafana reaches it
      # over the compose network rather than through this mapping, so the dashboards and the alert
      # rules are unaffected; what changes is that a human wanting the expression browser tunnels
      # in. That is the right shape for a debugging tool on a shopfloor host.
      #
      # Everything else here is published broadly because it either authenticates (Grafana, the
      # frontend, Node-RED) or is a protocol endpoint that has to be reachable (the broker).
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      ingestion:
        condition: service_started

  # ===============================================================================================
  # node_exporter -- HOST metrics for the machine the stack runs on.
  #
  # WHAT IT MEASURES DEPENDS ON WHERE THIS RUNS, and it is worth being explicit rather than letting
  # someone read a graph about the wrong computer: on the Debian VM this is intended for, the mounts
  # below give the real host. On Docker Desktop for Windows or macOS it reports the Linux virtual
  # machine the engine runs inside, which is not the developer's laptop.
  #
  # DISK IS THE METRIC THAT EARNS IT. This host carries two Postgres data directories and now a
  # TSDB; filling it takes the whole stack down at once, and it is the failure `storage_footprint`
  # (migration 0027) was added to make visible from the inside. This is the same question asked from
  # outside the databases, which is the half that notices the log files and the images.
  #
  # READ-ONLY MOUNTS AND NO CAPABILITIES. It reads /proc and /sys and reports numbers; nothing here
  # needs to write, and `pid: host` is required for process metrics rather than for privilege.
  # ===============================================================================================
  node-exporter:
    container_name: acs-cymru_node_exporter
    image: prom/node-exporter:v1.8.2
    restart: always
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Container and pseudo filesystems excluded, or every image layer and overlay mount appears
      # as a separate "disk" and the one number anybody wants -- free space on the real volume --
      # is buried among dozens that are not disks at all.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # NOT PUBLISHED. Nothing outside the compose network has any business reading host metrics, and
    # unlike the ingestion endpoint there is no inspection case that justifies the exposure.

  grafana:
    container_name: acs-cymru_grafana
    image: grafana/grafana:13.1.3
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Built from the SAME value supabase-db-init registers as the OAuth client's redirect_uris,
      # so the two cannot drift -- a mismatch is `invalid redirect_uri` at /oauth/authorize, which
      # reads as a Grafana fault rather than as a registration one. Overrides grafana.ini's
      # [server] root_url, which keeps the localhost default for a standalone read of that file.
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3002}/
      GF_INSTALL_PLUGINS: ""
      # The READ-ONLY historian role, not DB_PASSWORD. Grafana previously connected as the
      # `postgres` superuser -- a service fronted by browser SSO holding the credential that owns
      # the database. See grafana/provisioning/datasources/datasources.template.yml.
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      # Read by grafana.ini through $__env{GRAFANA_OAUTH_CLIENT_SECRET}, so the secret is not
      # committed. Must match what 0002_seed_data.sql hashed into auth.oauth_clients.
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      # The alert webhook's bearer secret, and the anon key that gets the request past Kong's
      # key-auth. Both are substituted into contact-points.template.yaml below. Grafana is NOT given
      # the service-role key -- see that file's header for why that distinction is load-bearing.
      GRAFANA_ALERT_WEBHOOK_SECRET: ${GRAFANA_ALERT_WEBHOOK_SECRET:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/tmp/datasources-template:ro
      - grafana_provisioning_datasources:/etc/grafana/provisioning/datasources
      # Alerting: the rules and the policy tree are plain files; the contact point is a template
      # because it carries a secret. Same split, and the same rendered-into-a-volume arrangement,
      # as the datasource above.
      - ./grafana/provisioning/alerting:/tmp/alerting-template:ro
      - grafana_provisioning_alerting:/etc/grafana/provisioning/alerting
    # Renders the datasource template, then hands over to Grafana's own /run.sh.
    #
    # The placeholder is __DB_PASSWORD__ rather than ${DB_PASSWORD}, so this expression no longer
    # has to escape a shell variable past Compose's substitution as well as sed's. The guard is
    # the same one supabase-kong-init uses: an unsubstituted marker reaching Grafana surfaces as
    # "password authentication failed", which points at the database rather than at this line.
    #
    # THIS OVERRIDE HAS NO KUBERNETES COUNTERPART -- Helm renders the same template into a Secret
    # and Grafana runs its stock entrypoint. See docs/kubernetes-architecture.md §2.4.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        if [ -z "$$BI_READER_PASSWORD" ]; then
          echo 'BI_READER_PASSWORD must be set -- Grafana would otherwise provision the TimescaleDB datasource with an empty password. It is the password of the read-only powerbi_reader role created by timescaledb/roles.sql.' >&2
          exit 1
        fi
        # __PROMETHEUS_URL__ is substituted here rather than committed into the template, because
        # Kubernetes puts a DIFFERENT value into the same file -- it defers to the cluster's own
        # Operator-managed Prometheus. See the template's header.
        sed -e "s|__BI_READER_PASSWORD__|$$BI_READER_PASSWORD|g" \
            -e "s|__PROMETHEUS_URL__|http://prometheus:9090|g" \
            /tmp/datasources-template/datasources.template.yml \
            > /etc/grafana/provisioning/datasources/datasources.yml
        # Comment lines excluded for the same reason as in supabase-kong-init: the template's own
        # header documents the placeholder convention by name.
        if grep -vE '^[[:space:]]*#' /etc/grafana/provisioning/datasources/datasources.yml \
           | grep -qE '__[A-Z0-9_]+__'; then
          echo 'Grafana datasource config still contains unsubstituted placeholders.' >&2
          exit 1
        fi
        # -----------------------------------------------------------------------------------
        # Alerting. The plain files are COPIED and the contact point is RENDERED, so the volume
        # ends up holding a complete provisioning directory either way.
        #
        # COPIED, NOT SYMLINKED OR MOUNTED OVER: the whole directory is one Grafana provisioning
        # path, and mounting the repo copy read-only at that path would leave nowhere to write the
        # rendered contact point. Rendering into the same volume keeps it one directory.
        # -----------------------------------------------------------------------------------
        if [ -z "$$GRAFANA_ALERT_WEBHOOK_SECRET" ]; then
          echo 'GRAFANA_ALERT_WEBHOOK_SECRET must be set -- Grafana would otherwise provision the alert contact point with an empty bearer token, and grafana-alert-webhook would refuse every notification with 401 while the rules themselves looked healthy. Run: node scripts/setup.mjs' >&2
          exit 1
        fi
        if [ -z "$$SUPABASE_ANON_KEY" ]; then
          echo 'SUPABASE_ANON_KEY must be set -- it is what gets the alert webhook past Kong key-auth. Run: node scripts/setup.mjs' >&2
          exit 1
        fi
        cp /tmp/alerting-template/policies.yaml /tmp/alerting-template/alert-rules.yaml \
           /etc/grafana/provisioning/alerting/
        sed -e "s|__GRAFANA_ALERT_WEBHOOK_SECRET__|$$GRAFANA_ALERT_WEBHOOK_SECRET|g" \
            -e "s|__SUPABASE_ANON_KEY__|$$SUPABASE_ANON_KEY|g" \
            /tmp/alerting-template/contact-points.template.yaml \
            > /etc/grafana/provisioning/alerting/contact-points.yaml
        if grep -vE '^[[:space:]]*#' /etc/grafana/provisioning/alerting/contact-points.yaml \
           | grep -qE '__[A-Z0-9_]+__'; then
          echo 'Grafana alert contact point still contains unsubstituted placeholders.' >&2
          exit 1
        fi
        exec /run.sh
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  pgdata:
  nodered_data:
  grafana_data:
  # Prometheus' TSDB. A named volume rather than a bind mount because it is a database, not
  # configuration -- and because it shares a disk with two Postgres data directories, which is
  # exactly why `--storage.tsdb.retention.time` below is set rather than left at the 15-day
  # default nobody remembers.
  prometheus_data:
  # Holds the RENDERED alerting provisioning -- the copied rules and policy plus the contact point
  # with its bearer secret substituted in. A volume rather than a bind mount for the same reason as
  # grafana_provisioning_datasources: the rendered file carries a credential and must not be written
  # back into the repository.
  grafana_provisioning_alerting:
  grafana_provisioning_datasources:
  mosquitto_data:
  # The broker's CA and its MQTTS leaf, issued by mosquitto-tls-init.
  #
  # A NAMED VOLUME BECAUSE THE ROOT MUST SURVIVE `docker compose down`. The CA is distributed by
  # hand to every physical gateway's trust store; losing it does not fail loudly, it mints a new
  # root on the next `up` and every appliance in the plant then rejects the broker while the stack
  # reports itself healthy. Same reasoning as `helm.sh/resource-policy: keep` on the chart's
  # credential Secret, and as internal-ca.yaml living outside the chart entirely.
  #
  # `docker volume rm <project>_mosquitto_certs` IS THEREFORE A FLEET-WIDE RE-ENROLMENT, not a reset.
  mosquitto_certs:
  supabase_db_data:
  # /etc/postgresql-custom. Holds the pgsodium root key, WITHOUT WHICH every vault.secrets row in
  # supabase_db_data is undecryptable -- see the mount on supabase-db for the failure it prevents
  # and for why an image bump means deleting this volume.
  supabase_db_config:
  studio_snippets:
  deno_cache:
  storage_data:
  # Holds the rendered Kong declarative config produced by supabase-kong-init. Not a bind mount:
  # the rendered file contains the service-role key and must not be written into the repository.
  kong_config:
