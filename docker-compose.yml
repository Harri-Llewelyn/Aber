# Node-RED authentication, shared by node-red-init (writes settings.js) and node-red (loads it).
# settings.js reads these from process.env at load time, so the two services must receive the
# same block: a variable present in one and absent from the other makes node-red-init rewrite
# settings.js on every boot.
x-nodered-auth-env: &nodered-auth-env
  NODERED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET}

  # Human auth: OAuth2 + PKCE against GoTrue's OAuth server.
  NODERED_OAUTH_CLIENT_ID: ${NODERED_OAUTH_CLIENT_ID:-c0ffee00-0000-4000-8000-000000000002}
  # Hashed into auth.oauth_clients by the migrations; rotating it means restarting supabase-db-init too.
  NODERED_OAUTH_CLIENT_SECRET: ${NODERED_OAUTH_CLIENT_SECRET}
  # auth_url is followed by the BROWSER (host-facing address); token_url and the userinfo endpoint
  # are called by the CONTAINER (compose-internal address). The gateway keeps `supabase-kong` as a
  # network alias.
  NODERED_OAUTH_AUTH_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}/auth/v1/oauth/authorize
  NODERED_OAUTH_TOKEN_URL: http://supabase-kong:8000/auth/v1/oauth/token
  NODERED_USERINFO_URL: http://supabase-kong:8000/functions/v1/nodered-userinfo
  # Must match redirect_uris in auth.oauth_clients exactly. /auth/strategy/callback is Node-RED's own route.
  NODERED_OAUTH_CALLBACK_URL: ${NODERED_PUBLIC_URL:-http://localhost:1880}/auth/strategy/callback

  # Machine auth.
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  # Verifies the 60-second per-event token dispatch_device_quarantine_webhook() mints. A signing
  # key, not the admin token: any flow author can read msg.req.headers on an http-in node.
  NODERED_WEBHOOK_JWT_SECRET: ${NODERED_WEBHOOK_JWT_SECRET}
  # Break-glass static token for when Supabase Auth is down. Empty means the path is shut.
  NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}

# Gitea configuration, shared by gitea-init (creates app.ini and the administrator) and gitea
# (serves from it). Gitea's entrypoint builds app.ini from `GITEA__section__KEY` variables and
# MERGES into an existing file, so the two services must receive the same block, and unsetting a
# variable here does not unset the setting on an existing volume: state the value instead.
x-gitea-env: &gitea-env
  # The uid/gid Gitea runs as and writes /data as.
  USER_UID: "1000"
  USER_GID: "1000"
  GITEA__server__PROTOCOL: http
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
  # Printed in clone commands; must be the address the forge is actually reached on.
  GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:${GITEA_HTTP_PORT:-3003}/}
  # SSH is served by the image's own sshd on 22 (container-side, never the host's). Gitea's
  # built-in SSH server must stay off: both binding 22 crash-loops the container.
  GITEA__server__START_SSH_SERVER: "false"
  # The port a clone URL advertises: the published one, not the listener.
  GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
  GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-${GITEA_DOMAIN:-localhost}}
  GITEA__database__DB_TYPE: sqlite3
  GITEA__database__PATH: /data/gitea/gitea.db
  # No web installer; gitea-init creates the administrator instead.
  GITEA__security__INSTALL_LOCK: "true"
  # Nobody self-registers, nothing is readable without an account, and no repository can be
  # public: a flows.json names the plant's brokers and devices.
  GITEA__service__DISABLE_REGISTRATION: "true"
  GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
  GITEA__repository__FORCE_PRIVATE: "true"
  GITEA__repository__DEFAULT_PRIVATE: private
  # The login is the gateway's `forge` listener (supabase/envoy.yaml), which verifies the token
  # and hands the identity down as X-WEBAUTH-* headers. Gitea trusts those headers from ANY peer
  # (REVERSE_PROXY_TRUSTED_PROXIES governs X-Forwarded-For only), so the access control is the
  # `forge` network at the foot of this file: only the gateway and the edge runtime can reach
  # port 3000. The API ignores the header (`..._AUTHENTICATION_API` off), so the machine account's
  # basic-auth path is not a second door. Username is the token's `sub` (Gitea refuses `@`).
  GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
  GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
  GITEA__service__ENABLE_REVERSE_PROXY_EMAIL: "true"
  GITEA__service__ENABLE_REVERSE_PROXY_FULL_NAME: "true"
  GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API: "false"
  # No password form: the door is the login. Basic auth on the API stays on for the machine account.
  GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
  # X-Forwarded-For from the gateway, so the forge logs the browser's address.
  GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: "*"
  GITEA__security__REVERSE_PROXY_LIMIT: "1"
  # Off. A runner executes whatever a repository tells it to, and a registry is a fourth
  # credential plane; turning either on is a decision (docs/roadmap.md, "The appliance itself").
  GITEA__actions__ENABLED: "false"
  GITEA__packages__ENABLED: "false"
  # PROJECTS AND PACKAGES ARE HIDDEN FROM EVERY REPOSITORY, hand-made ones included. Packages is
  # off above and this removes its tab too; Projects is a kanban on a repository whose whole content
  # is one flow, and every tab a person has to learn to ignore is a cost. The wiki and issues stay:
  # the wiki is seeded at enrolment (forge.ts) as the unreviewed place for what people know about a
  # gateway, and issues are its incident log.
  GITEA__repository__DISABLED_REPO_UNITS: "repo.projects,repo.packages"
  # WEBHOOKS MAY CALL PRIVATE ADDRESSES, because the one they call is the edge runtime on this
  # stack's own network (forge-events, 0095). Gitea's default is `external` -- public addresses
  # only -- which refuses every in-stack target as a server-side request forgery guard. `private`
  # admits RFC 1918 and nothing public, which is the opposite of the default and the right way round
  # here: nothing in this forge should be made to call out of the plant.
  GITEA__webhook__ALLOWED_HOST_LIST: "private"
  # A container in a plant does not call home to check for releases.
  GITEA__cron.update_checker__ENABLED: "false"
  GITEA__log__LEVEL: ${GITEA_LOG_LEVEL:-info}

services:
  # ---------------------------------------------------------------------------
  # Standalone TimescaleDB (Telemetry Hypertable Storage)
  # ---------------------------------------------------------------------------
  timescaledb:
    container_name: acs-cymru_timescaledb
    image: timescale/timescaledb:2.29.2-pg17
    restart: always
    # Worker pool: max_worker_processes = 1 + max_background_workers + max_parallel_workers
    # (upstream's arithmetic). With the defaults (8 vs 16) policy jobs fail to launch and
    # retention/refresh windows are silently skipped. All three are pinned so the sum holds.
    # `shared_preload_libraries` comes from the image's postgresql.conf and is not repeated here.
    # Telemetry is off because this stack has no egress; `basic` restores the upstream default.
    command:
      - postgres
      - -c
      - max_worker_processes=25
      - -c
      - timescaledb.max_background_workers=16
      - -c
      - max_parallel_workers=8
      - -c
      - timescaledb.telemetry_level=off
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Loopback only. 5433 avoids a collision with a host Postgres; in-stack services use
      # `timescaledb:5432`. A raw database port neither authenticates a browser session nor is a
      # protocol endpoint the fleet dials, which is the rule for publishing broadly in this file.
      - "127.0.0.1:5433:5432"
    volumes:
      # Initialisation scripts run only on an EMPTY data directory, which is why the retention
      # policies and rollups live in timescaledb-maintenance instead.
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Telemetry lifecycle reconciliation (runs on EVERY boot)
  # ---------------------------------------------------------------------------
  # Applies extension.sql, retention.sql, storage.sql, aggregates.sql, cold_archive.sql and
  # roles.sql with whatever intervals .env currently says, so a change takes effect on the next
  # `docker compose up`. Retention is a HARD DELETE; `never` disables an individual policy.
  # extension.sql runs first, in its own psql session: `ALTER EXTENSION timescaledb UPDATE` is
  # refused once a connection has loaded the old library.
  timescaledb-maintenance:
    container_name: acs-cymru_timescaledb_maintenance
    image: timescale/timescaledb:2.29.2-pg17
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TS_DBNAME: ${DB_NAME:-postgres}
      TS_USER: ${DB_USER:-postgres}
      # roles.sql skips a role whose password is empty rather than creating it with a blank one.
      INGEST_WRITER_PASSWORD: ${INGEST_WRITER_PASSWORD:?INGEST_WRITER_PASSWORD is required; run `npm run setup`}
      FDW_READER_PASSWORD: ${FDW_READER_PASSWORD:?FDW_READER_PASSWORD is required; run `npm run setup`}
      TIMESCALE_COMPRESS_AFTER: ${TIMESCALE_COMPRESS_AFTER:-7 days}
      TIMESCALE_RETAIN_FOR: ${TIMESCALE_RETAIN_FOR:-90 days}
      # The rollups outlive the raw data deliberately (see aggregates.sql).
      TIMESCALE_ROLLUP_1M_RETAIN_FOR: ${TIMESCALE_ROLLUP_1M_RETAIN_FOR:-180 days}
      TIMESCALE_ROLLUP_5M_RETAIN_FOR: ${TIMESCALE_ROLLUP_5M_RETAIN_FOR:-1 year}
      TIMESCALE_ROLLUP_1H_RETAIN_FOR: ${TIMESCALE_ROLLUP_1H_RETAIN_FOR:-5 years}
      # Read-only role for external BI tools and Grafana. Empty means no role.
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-}
    volumes:
      - ./timescaledb/extension.sql:/extension.sql:ro
      - ./timescaledb/retention.sql:/retention.sql:ro
      - ./timescaledb/storage.sql:/storage.sql:ro
      - ./timescaledb/aggregates.sql:/aggregates.sql:ro
      - ./timescaledb/cold_archive.sql:/cold_archive.sql:ro
      - ./timescaledb/roles.sql:/roles.sql:ro
    # Waits for the hypertable itself: the postgres entrypoint answers `pg_isready` on the unix
    # socket while initdb is still running.
    entrypoint: >
      /bin/sh -e -c "
      echo 'Waiting for the telemetry hypertable...';
      i=0;
      until psql -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -tAc \"SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_name = 'telemetry'\" | grep -q 1; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then echo 'timed out waiting for the telemetry hypertable (created by timescaledb/init/001_schema.sql on an EMPTY data directory)' >&2; exit 1; fi;
        sleep 2;
      done;
      echo 'Updating the timescaledb extension to the version the image ships...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -f /extension.sql;
      echo 'Reconciling compression and retention policies...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v compress_after=\"$$TIMESCALE_COMPRESS_AFTER\" -v retain_after=\"$$TIMESCALE_RETAIN_FOR\" -f /retention.sql;
      echo 'Reconciling telemetry rollups...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v rollup_1m_retain=\"$$TIMESCALE_ROLLUP_1M_RETAIN_FOR\" -v rollup_5m_retain=\"$$TIMESCALE_ROLLUP_5M_RETAIN_FOR\" -v rollup_1h_retain=\"$$TIMESCALE_ROLLUP_1H_RETAIN_FOR\" -f /aggregates.sql;
      echo 'Reconciling the storage footprint view...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -f /storage.sql;
      echo 'Reconciling the cold archive manifest...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -f /cold_archive.sql;
      echo 'Reconciling read-only BI role...';
      psql -v ON_ERROR_STOP=1 -h timescaledb -U \"$$TS_USER\" -d \"$$TS_DBNAME\" -v bi_reader_password=\"$$BI_READER_PASSWORD\" -v ingest_writer_password=\"$$INGEST_WRITER_PASSWORD\" -v fdw_reader_password=\"$$FDW_READER_PASSWORD\" -f /roles.sql;
      "
    depends_on:
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Self-Hosted Supabase Stack (Postgres, GoTrue Auth, PostgREST, Envoy, Studio)
  # ---------------------------------------------------------------------------
  supabase-db:
    container_name: acs-cymru_supabase_db
    image: supabase/postgres:17.6.1.160
    restart: always
    ports:
      # Loopback only, as for timescaledb. SUPABASE_DB_PORT chooses the number.
      - "127.0.0.1:${SUPABASE_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # Holds the pgsodium root key, which the image generates afresh when the file is absent.
      # Without this volume `docker compose down && up` mints a new key and every vault.secrets
      # row becomes undecryptable. The directory also carries image-owned config that shadows the
      # image's copies, so after bumping the supabase/postgres tag:
      #   docker compose down && docker volume rm <project>_supabase_db_config
      - supabase_db_config:/etc/postgresql-custom
    # `-h 127.0.0.1` is required: the temporary server initdb runs listens on the unix socket
    # only, so a socket-only check reports healthy mid-bootstrap and supabase-db-roles-init then
    # fails to authenticate as supabase_admin.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  supabase-db-roles-init:
    container_name: acs-cymru_supabase_db_roles_init
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Exec form with `-e`, so a failed psql fails the service rather than being skipped.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        echo 'Setting passwords for scoped Supabase roles...'

        # POSTGRES_PASSWORD is applied by the image at initdb only. Rotating it against an
        # existing volume leaves the database on the old password, and this is the first
        # connection to fail.
        if ! psql -h supabase-db -U supabase_admin -d postgres -c 'SELECT 1' >/dev/null 2>&1; then
          echo '' >&2
          echo 'ERROR: cannot authenticate to supabase-db as supabase_admin.' >&2
          echo '' >&2
          echo 'POSTGRES_PASSWORD in .env does not match what this data volume was initialised' >&2
          echo 'with. The postgres image applies POSTGRES_PASSWORD at initdb only, so rotating it' >&2
          echo 'against an existing volume never reaches the database. Either:' >&2
          echo '' >&2
          echo '  * recreate the volume:  docker compose down -v && docker compose up -d' >&2
          echo '    (destroys all data), or' >&2
          echo '  * set the old password back in .env, then ALTER USER supabase_admin by hand.' >&2
          echo '' >&2
          exit 1
        fi

        # The password reaches psql as a :variable from PGPASSWORD (never interpolated into the
        # SQL text, which `docker inspect` would show) and from a FILE, because psql expands
        # :variables only in input it reads, not in a -c string.
        echo "ALTER USER :\"role\" WITH PASSWORD :'pw';" > /tmp/set-role-password.sql

        # supabase_read_only_user is a reserved role only a superuser may alter, so it is set
        # here rather than in a migration. It ships with no password; Studio's read-only branch
        # cannot authenticate as it until this runs (asserted in 0082).
        for role in supabase_auth_admin authenticator supabase_storage_admin supabase_read_only_user; do
          psql -h supabase-db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
               -v pw="$$PGPASSWORD" -v role="$$role" -f /tmp/set-role-password.sql
        done

        echo 'Scoped role passwords set successfully.'
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-db-init:
    container_name: acs-cymru_supabase_db_init
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Historian connection, handed to the migrations as psql variables for the postgres_fdw link.
      TS_HOST: timescaledb
      TS_PORT: "5432"
      TS_DBNAME: ${DB_NAME:-postgres}
      TS_USER: ${DB_USER:-postgres}
      TS_PASSWORD: ${DB_PASSWORD:-postgres}
      # What the FDW's PUBLIC user mapping authenticates as. Blank falls back to the admin pair.
      TS_FDW_USER: ${TS_FDW_USER:-fdw_reader}
      TS_FDW_PASSWORD: ${FDW_READER_PASSWORD:?FDW_READER_PASSWORD is required -- Supabase's postgres_fdw mapping authenticates as fdw_reader, and the only alternative is the historian superuser. Run `npm run setup`.}
      # Seeded into Vault; the quarantine webhook trigger reads it from SQL. Empty leaves the
      # webhook unauthenticated.
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
      # Stored in Vault so a trigger on `gateways` can reach revoke-gateway-credential through the
      # gateway. The Vault entry keeps the name `supabase_anon_key` whichever key format is stored.
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      GATEWAY_REVOKE_SECRET: ${GATEWAY_REVOKE_SECRET:-}
      # Likewise, so pg_cron can ask forge-sweep for a pass (0099).
      FORGE_SWEEP_SECRET: ${FORGE_SWEEP_SECRET:-}
      # OAuth client secrets, hashed into auth.oauth_clients. Each client's public URL is what
      # its redirect_uri is registered against; the upserts are DO UPDATE, so the value must be
      # passed here or a hand correction is rewritten on the next boot.
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3002}
      STUDIO_OAUTH_CLIENT_SECRET: ${STUDIO_OAUTH_CLIENT_SECRET:-}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://127.0.0.1:${STUDIO_PORT:-54323}}
      GITEA_OAUTH_CLIENT_SECRET: ${GITEA_OAUTH_CLIENT_SECRET:-}
      # GITEA_ROOT_URL is the one value Gitea prints, the forge listener redirects to, and 0094
      # registers (trailing slash trimmed).
      GITEA_PUBLIC_URL: ${GITEA_ROOT_URL:-http://localhost:${GITEA_HTTP_PORT:-3003}/}
      NODERED_OAUTH_CLIENT_SECRET: ${NODERED_OAUTH_CLIENT_SECRET:-}
      # Seeded into Vault; dispatch_device_quarantine_webhook() signs the per-event token with it.
      NODERED_WEBHOOK_JWT_SECRET: ${NODERED_WEBHOOK_JWT_SECRET:-}
      # Must match settings.js's callbackURL exactly, so both derive from NODERED_PUBLIC_URL.
      NODERED_OAUTH_CALLBACK_URL: ${NODERED_PUBLIC_URL:-http://localhost:1880}/auth/strategy/callback
      # Creates the Supabase-side `grafana_reader` (reads public.storage_footprint). The same
      # password as the historian's reader of the same name. Empty skips the role.
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Configuring PostgreSQL search_path...';
      psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -c 'ALTER ROLE postgres SET search_path TO auth, public, extensions;';
        # Marks the chain in progress (0072); stamped complete after seed.sql. Must exist
        # identically on both targets. `|| true` covers the first boot, before 0072 has created the table.
        psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -c 'UPDATE public.schema_bootstrap SET started_at = now(), completed_at = NULL' >/dev/null 2>&1 || true;
      echo 'Applying Supabase database migrations and seeds...';
      for f in /migrations/*.sql; do
        if [ -f \"$$f\" ]; then
          echo \"Executing migration $$f...\";
          attempt=1;
          while :; do
            if PGOPTIONS=\"-c lock_timeout=5s\" psql -v ON_ERROR_STOP=1 -v ts_host=\"$$TS_HOST\" -v ts_port=\"$$TS_PORT\" -v ts_dbname=\"$$TS_DBNAME\" -v ts_user=\"$$TS_USER\" -v ts_password=\"$$TS_PASSWORD\" -v ts_fdw_user=\"$$TS_FDW_USER\" -v ts_fdw_password=\"$$TS_FDW_PASSWORD\" -v nodered_admin_token=\"$$NODERED_ADMIN_TOKEN\" -v grafana_oauth_client_secret=\"$$GRAFANA_OAUTH_CLIENT_SECRET\" -v grafana_public_url=\"$$GRAFANA_PUBLIC_URL\" -v studio_oauth_client_secret=\"$$STUDIO_OAUTH_CLIENT_SECRET\" -v studio_public_url=\"$$STUDIO_PUBLIC_URL\" -v gitea_oauth_client_secret=\"$$GITEA_OAUTH_CLIENT_SECRET\" -v gitea_public_url=\"$$GITEA_PUBLIC_URL\" -v nodered_oauth_client_secret=\"$$NODERED_OAUTH_CLIENT_SECRET\" -v nodered_webhook_jwt_secret=\"$$NODERED_WEBHOOK_JWT_SECRET\" -v nodered_redirect_uri=\"$$NODERED_OAUTH_CALLBACK_URL\" -v bi_reader_password=\"$$BI_READER_PASSWORD\" -v supabase_functions_url=\"http://supabase-kong:8000/functions/v1\" -v supabase_anon_key=\"$${SUPABASE_PUBLISHABLE_KEY:-$$SUPABASE_ANON_KEY}\" -v gateway_revoke_secret=\"$$GATEWAY_REVOKE_SECRET\" -v forge_sweep_secret=\"$$FORGE_SWEEP_SECRET\" -h supabase-db -U postgres -d postgres -f \"$$f\" > /tmp/migration.log 2>&1; then cat /tmp/migration.log; break; fi;
            cat /tmp/migration.log;
            # Retried on lock contention only. Migrations take DDL locks on tables Realtime is
            # reading; `lock_timeout=5s` makes db-init the predictable loser instead of Realtime.
            if [ $$attempt -ge 3 ] || ! grep -qE 'deadlock detected|due to lock timeout' /tmp/migration.log; then
              echo \"Migration $$f failed.\" >&2; exit 1;
            fi;
            echo \"Deadlock on $$f (attempt $$attempt) -- retrying in 3s.\" >&2;
            attempt=$$((attempt+1)); sleep 3;
          done;
        fi
      done;
      if [ -f /seed.sql ]; then
        echo 'Executing seed.sql...';
        psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -f /seed.sql;
      fi;
        # A non-null completed_at means every migration and seed.sql succeeded on this boot.
        psql -v ON_ERROR_STOP=1 -h supabase-db -U postgres -d postgres -c 'INSERT INTO public.schema_bootstrap (id, completed_at) VALUES (true, now()) ON CONFLICT (id) DO UPDATE SET completed_at = excluded.completed_at';
      echo 'Supabase database initialized successfully.';
      "
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_healthy
      # The migrations map objects timescaledb-maintenance creates on the historian.
      timescaledb-maintenance:
        condition: service_completed_successfully

  supabase-auth:
    container_name: acs-cymru_supabase_auth
    image: supabase/gotrue:v2.189.0
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?sslmode=disable
      # The dashboard's URL: GoTrue builds user-facing redirects (including OAuth consent) from it.
      GOTRUE_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Without this GoTrue looks users up with aud = '' and every login fails.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Closed by default. This is the only signup control; a frontend flag is not one.
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-true}
      # Password reset. The link's target must be on this list, or GoTrue sends the browser to
      # GOTRUE_SITE_URL and the dashboard opens instead of the reset form. SMTP is optional: with
      # no host a reset request fails and the sign-in card tells the user to ask an administrator.
      # Sign-up confirmation is off (GOTRUE_MAILER_AUTOCONFIRM), so this is the only mail sent.
      GOTRUE_URI_ALLOW_LIST: ${FRONTEND_URL:-http://localhost:3000}/reset-password
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-ACS Cymru}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your ACS Cymru password"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # The OAuth 2.1 server Grafana, Node-RED, Studio's door and the forge's door authenticate
      # against. /.well-known/openid-configuration answers 200 whether or not this is on.
      GOTRUE_OAUTH_SERVER_ENABLED: "true"
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "true"
      # GoTrue ships no consent UI; the dashboard serves this route (frontend/src/pages/OAuthConsent.jsx).
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: "/oauth/consent"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  supabase-rest:
    container_name: acs-cymru_supabase_rest
    image: postgrest/postgrest:v14.12
    restart: always
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # The token-revocation choke point (0074): runs before every request and RAISEs on a
      # revoked `jti`. A misspelled name here is a total API outage that /live and /ready do
      # not report; check-docs-drift.mjs asserts it against the migrations.
      PGRST_DB_PRE_REQUEST: public.auth_pre_request
      # The admin server (/metrics, /live, /ready). Unauthenticated, so not published and not routed.
      PGRST_ADMIN_SERVER_PORT: "3001"
    depends_on:
      supabase-db-roles-init:
        condition: service_completed_successfully

  # Realtime v2: fans WAL changes out over WebSockets for the dashboard's live updates. Only
  # `cells`, `gateways` and `devices` are published (see the publication in 0001).
  supabase-realtime:
    container_name: acs-cymru_supabase_realtime
    image: supabase/realtime:v2.102.3
    restart: always
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      # Needs REPLICATION privilege for its logical slot.
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      # Mandatory from v2.102.3. Signs the bearer for /metrics; deliberately not the API secret.
      METRICS_JWT_SECRET: ${REALTIME_METRICS_JWT_SECRET:?REALTIME_METRICS_JWT_SECRET is required from realtime v2.102.3; run `npm run setup` or copy it from .env.example}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      # The image's run.sh uses this under `set -u`; unset crash-loops the container.
      RLIMIT_NOFILE: "10000"
      # RLS per change, per subscriber, so digital_thread's restrictions hold over the socket.
      RLS_ENABLED: "true"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      APP_NAME: realtime
    # Realtime resolves its tenant from the LEADING HOSTNAME LABEL of the Host header, so the
    # gateway addresses it as `realtime-dev.<...>`. This alias and REALTIME_UPSTREAM_HOST on
    # supabase-envoy-init change together.
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime
    healthcheck:
      # The tenant is `realtime-dev` (SEED_SELF_HOST ignores TENANT_NAME) and the endpoint is
      # authenticated.
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Bearer ${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Object storage: 3D models, broker captures and the (retiring) gateway flow backups. Owns the
  # `storage` schema and creates it on boot, which is why buckets are created by
  # supabase-storage-init and the policies by supabase-storage-policies rather than by a migration.
  supabase-storage:
    container_name: acs-cymru_supabase_storage
    image: supabase/storage-api:v1.60.4
    restart: always
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      POSTGREST_URL: http://supabase-rest:3000
      # The global ceiling. storage-api refuses to CREATE a bucket whose own limit exceeds it, so
      # this must clear the largest per-bucket limit (captures: 100 MiB).
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-1073741824}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      # Required by the S3 code path even on the file backend.
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 and binds IPv4 only.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Creates the buckets through the Storage REST API (idempotent; see scripts/storage-init.mjs).
  # Bucket names must match supabase/storage-policies.sql: a bucket with no policies is invisible
  # to every browser role, and a policy naming an absent bucket is dead text. Neither errors.
  supabase-storage-init:
    container_name: acs-cymru_supabase_storage_init
    image: node:24-alpine
    environment:
      STORAGE_URL: http://supabase-storage:5000
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_BUCKET: ${STORAGE_MODEL_BUCKET:-asset-3d-models}
      STORAGE_MODEL_FILE_SIZE_LIMIT: ${STORAGE_MODEL_FILE_SIZE_LIMIT:-52428800}
      # Private, keyed <sparkplug_id>/. Nothing in the browser writes to it any more; retiring it
      # is docs/roadmap.md ("Retiring the flow-backup bucket").
      GATEWAY_BACKUP_BUCKET: ${GATEWAY_BACKUP_BUCKET:-gateway-backups}
      GATEWAY_BACKUP_FILE_SIZE_LIMIT: ${GATEWAY_BACKUP_FILE_SIZE_LIMIT:-5242880}
      # Private, keyed <sparkplug_id>/ of the subject recorded. Must exceed the 50 MiB
      # capture_jobs cap, or a completed capture is refused at upload.
      CAPTURE_BUCKET: ${CAPTURE_BUCKET:-broker-captures}
      CAPTURE_FILE_SIZE_LIMIT: ${CAPTURE_FILE_SIZE_LIMIT:-104857600}
    volumes:
      - ./scripts/storage-init.mjs:/app/storage-init.mjs:ro
    command: ["node", "/app/storage-init.mjs"]
    restart: "no"
    depends_on:
      # Bucket creation runs as service_role and needs the grants storage-policies applies.
      supabase-storage-policies:
        condition: service_completed_successfully

  # RLS policies and grants on storage.buckets / storage.objects. A service rather than a
  # migration because storage-api creates those tables after db-init has completed. Runs as
  # supabase_admin: the tables are owned by supabase_storage_admin and `postgres` is not a superuser.
  supabase-storage-policies:
    container_name: acs-cymru_supabase_storage_policies
    image: supabase/postgres:17.6.1.160
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/storage-policies.sql:/storage-policies.sql:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Applying storage policies and grants...';
      psql -v ON_ERROR_STOP=1 -h supabase-db -U supabase_admin -d postgres -f /storage-policies.sql;
      "
    restart: "no"
    depends_on:
      supabase-storage:
        condition: service_healthy

  # Renders supabase/envoy.yaml, substituting the API keys and the origin policy into an internal
  # volume. The template is shared with the chart, which substitutes it in an initContainer:
  # a placeholder added to the template must be added to both substituters
  # (scripts/check-gateway-surface.mjs asserts it).
  supabase-envoy-init:
    container_name: acs-cymru_supabase_envoy_init
    image: alpine:3.24
    environment:
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # The new key format (opaque, not JWTs), accepted alongside the legacy pair. Empty means
      # legacy-only. Set both or neither.
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      # `false` stops the gateway accepting the anon and service-role JWTs. Flip it only once the
      # `acs-legacy-api-key` access log is silent and `rbac.legacy_api_key_.shadow_allowed` is
      # flat at zero over a representative window (docs/gateway-migration.md).
      LEGACY_KEYS_ACCEPTED: ${LEGACY_KEYS_ACCEPTED:-true}
      # Must begin `realtime-dev.` (the tenant label). A HOST for the header rewrite, not a URL.
      REALTIME_UPSTREAM_HOST: ${REALTIME_UPSTREAM_HOST:-realtime-dev.supabase-realtime}
      # The name Envoy DIALS, as distinct from the Host header it sends.
      REALTIME_UPSTREAM_ADDRESS: ${REALTIME_UPSTREAM_ADDRESS:-supabase-realtime}
      # The whole origin policy for the stack; the edge functions declare none. An origin
      # missing here is a browser refusing a 200 the gateway returned. The variable keeps its
      # historical name because existing .env files set it.
      KONG_CORS_ORIGINS: '${KONG_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8088","http://127.0.0.1:8088"]}'
      # The Studio listener's inputs (see the listener in supabase/envoy.yaml).
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # The OAuth client 0081 registers and the cookie-signing key. Unset is a working stack
      # with an unusable Studio door (see the fail-closed branch below).
      STUDIO_OAUTH_CLIENT_SECRET: ${STUDIO_OAUTH_CLIENT_SECRET:-}
      STUDIO_PROXY_HMAC_SECRET: ${STUDIO_PROXY_HMAC_SECRET:-}
      # Where the browser reaches the proxy: what 0081 registers as the redirect_uri.
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://127.0.0.1:${STUDIO_PORT:-54323}}
      # The browser follows /auth/v1/oauth/authorize on this address; Envoy exchanges the token
      # against the container.
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      STUDIO_UPSTREAM_ADDRESS: ${STUDIO_UPSTREAM_ADDRESS:-supabase-studio}
      # The forge listener's inputs. The OAuth client 0094 registers and its cookie key.
      GITEA_OAUTH_CLIENT_SECRET: ${GITEA_OAUTH_CLIENT_SECRET:-}
      GITEA_PROXY_HMAC_SECRET: ${GITEA_PROXY_HMAC_SECRET:-}
      # One value with GITEA__server__ROOT_URL: Gitea prints it, 0094 registers
      # <this>/oauth2/callback, and the listener redirects to it. Trailing slash trimmed below.
      GITEA_PUBLIC_URL: ${GITEA_ROOT_URL:-http://localhost:${GITEA_HTTP_PORT:-3003}/}
      GITEA_UPSTREAM_ADDRESS: ${GITEA_UPSTREAM_ADDRESS:-gitea}
    volumes:
      - ./supabase/envoy.yaml:/template/envoy.yaml:ro
      - envoy_config:/config
    # Exec form with a literal block: the nested quotes the sed expressions need do not survive
    # Compose's shell tokenisation of a string entrypoint.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        if [ -z "$$SUPABASE_ANON_KEY" ] || [ -z "$$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo 'SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY must be set -- an empty key substituted into the Lua filter would be accepted from any caller sending an empty apikey.' >&2
          exit 1
        fi
        if [ -z "$$SUPABASE_JWT_SECRET" ]; then
          echo 'SUPABASE_JWT_SECRET must be set -- it is the JWKS key the Studio listener verifies session tokens against, and an empty one is a door that verifies nothing.' >&2
          exit 1
        fi
        # Legacy off with no new keys registered would accept nothing at all.
        case "$$LEGACY_KEYS_ACCEPTED" in
          true|false) ;;
          *)
            echo "LEGACY_KEYS_ACCEPTED must be exactly 'true' or 'false' -- it is substituted into the Lua filter as a bare boolean, and any other value is a config Envoy refuses to parse. Got: $$LEGACY_KEYS_ACCEPTED" >&2
            exit 1
            ;;
        esac
        if [ "$$LEGACY_KEYS_ACCEPTED" = "false" ] && [ -z "$$SUPABASE_PUBLISHABLE_KEY" ]; then
          echo 'LEGACY_KEYS_ACCEPTED=false with no SUPABASE_PUBLISHABLE_KEY set -- the gateway would accept no API key at all and refuse every request. Mint the new pair first, migrate your consumers onto it, and only then turn the legacy keys off.' >&2
          exit 1
        fi
        # Half of the new pair would refuse server-side callers while the browser kept working.
        if { [ -n "$$SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$$SUPABASE_SECRET_KEY" ]; } || { [ -z "$$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$$SUPABASE_SECRET_KEY" ]; }; then
          echo 'SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY are a pair -- set BOTH to accept the new key format, or NEITHER to run legacy-only.' >&2
          exit 1
        fi
        case "$$KONG_CORS_ORIGINS" in
          '['*']') ;;
          *)
            echo "KONG_CORS_ORIGINS must be a JSON array of browser origins. Got: $$KONG_CORS_ORIGINS" >&2
            exit 1
            ;;
        esac
        case "$$REALTIME_UPSTREAM_HOST" in
          realtime-dev*) ;;
          *)
            echo "REALTIME_UPSTREAM_HOST must begin with the label 'realtime-dev' -- Realtime reads the tenant id from it and answers a bare 403 otherwise. Got: $$REALTIME_UPSTREAM_HOST" >&2
            exit 1
            ;;
        esac

        # ["a","b"] -> [{exact: "a"},{exact: "b"}]. The space after the colon is required: in a
        # YAML flow mapping `{exact:"a"}` is a single scalar key and Envoy refuses the bootstrap.
        CORS_MATCHERS=$$(printf '%s' "$$KONG_CORS_ORIGINS" | sed 's/"\([^"]*\)"/{exact: "\1"}/g')

        # The signing secret as a JWKS `oct` key: base64url, unwrapped, unpadded. A stray newline
        # produces a JWKS Envoy parses and then rejects every token against.
        JWT_B64URL=$$(printf '%s' "$$SUPABASE_JWT_SECRET" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')

        # Fail closed, not shut: an existing stack without these keeps its gateway and gets a
        # Studio door nobody can pass.
        if [ -z "$$STUDIO_OAUTH_CLIENT_SECRET" ] || [ -z "$$STUDIO_PROXY_HMAC_SECRET" ]; then
          echo 'WARNING: STUDIO_OAUTH_CLIENT_SECRET / STUDIO_PROXY_HMAC_SECRET are not set. Studio will answer every request with a login it cannot complete. Run: node scripts/setup.mjs' >&2
          STUDIO_OAUTH_CLIENT_SECRET='unconfigured'
          STUDIO_PROXY_HMAC_SECRET=$$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
        fi

        # SDS secrets, one per file (two in one file is rejected at runtime, not at boot).
        # `printf` rather than a heredoc: an indented heredoc terminator inside this YAML block
        # is not a terminator.
        printf '%s\n' \
          'resources:' \
          '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
          '    name: studio-oauth-client-secret' \
          '    generic_secret:' \
          "      secret: { inline_string: \"$$STUDIO_OAUTH_CLIENT_SECRET\" }" \
          > /config/studio-client-secret.yaml
        printf '%s\n' \
          'resources:' \
          '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
          '    name: studio-proxy-hmac-secret' \
          '    generic_secret:' \
          "      secret: { inline_string: \"$$STUDIO_PROXY_HMAC_SECRET\" }" \
          > /config/studio-hmac-secret.yaml

        # The forge's door, the same way.
        if [ -z "$$GITEA_OAUTH_CLIENT_SECRET" ] || [ -z "$$GITEA_PROXY_HMAC_SECRET" ]; then
          echo 'WARNING: GITEA_OAUTH_CLIENT_SECRET / GITEA_PROXY_HMAC_SECRET are not set. The forge will answer every request with a login it cannot complete. Run: node scripts/setup.mjs' >&2
          GITEA_OAUTH_CLIENT_SECRET='unconfigured'
          GITEA_PROXY_HMAC_SECRET=$$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
        fi
        printf '%s\n' \
          'resources:' \
          '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
          '    name: forge-oauth-client-secret' \
          '    generic_secret:' \
          "      secret: { inline_string: \"$$GITEA_OAUTH_CLIENT_SECRET\" }" \
          > /config/forge-client-secret.yaml
        printf '%s\n' \
          'resources:' \
          '  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret' \
          '    name: forge-proxy-hmac-secret' \
          '    generic_secret:' \
          "      secret: { inline_string: \"$$GITEA_PROXY_HMAC_SECRET\" }" \
          > /config/forge-hmac-secret.yaml

        # Gitea wants a trailing slash on ROOT_URL; the redirect_uri must not have one.
        # Trailing slash off, WITHOUT the shell's brace-expansion form: check-env-drift reads the
        # variable name inside that form as a Compose variable with no default, and Compose itself
        # refuses a dollar-brace it cannot close. printf and sed say the same thing in plain text.
        GITEA_PUBLIC_URL="$$(printf '%s' "$$GITEA_PUBLIC_URL" | sed 's:/*$$::')"

        # `|` as the delimiter, because every value here contains `/`.
        sed -e "s|__SUPABASE_ANON_KEY__|$$SUPABASE_ANON_KEY|g" \
            -e "s|__SUPABASE_SERVICE_ROLE_KEY__|$$SUPABASE_SERVICE_ROLE_KEY|g" \
            -e "s|__SUPABASE_PUBLISHABLE_KEY__|$$SUPABASE_PUBLISHABLE_KEY|g" \
            -e "s|__SUPABASE_SECRET_KEY__|$$SUPABASE_SECRET_KEY|g" \
            -e "s|__LEGACY_KEYS_ACCEPTED__|$$LEGACY_KEYS_ACCEPTED|g" \
            -e "s|__REALTIME_UPSTREAM_HOST__|$$REALTIME_UPSTREAM_HOST|g" \
            -e "s|__REALTIME_UPSTREAM_ADDRESS__|$$REALTIME_UPSTREAM_ADDRESS|g" \
            -e "s|__CORS_ORIGINS__|$$CORS_MATCHERS|g" \
            -e "s|__SUPABASE_PUBLIC_URL__|$$SUPABASE_PUBLIC_URL|g" \
            -e "s|__STUDIO_PUBLIC_URL__|$$STUDIO_PUBLIC_URL|g" \
            -e "s|__STUDIO_UPSTREAM_ADDRESS__|$$STUDIO_UPSTREAM_ADDRESS|g" \
            -e "s|__GITEA_PUBLIC_URL__|$$GITEA_PUBLIC_URL|g" \
            -e "s|__GITEA_UPSTREAM_ADDRESS__|$$GITEA_UPSTREAM_ADDRESS|g" \
            -e "s|__SUPABASE_JWT_SECRET_B64URL__|$$JWT_B64URL|g" \
            /template/envoy.yaml > /config/envoy.yaml

        # A placeholder this script does not know would reach Envoy literally. Comment lines are
        # excluded because the template's header names the placeholders.
        LEFTOVER=$$(grep -vE '^[[:space:]]*#' /config/envoy.yaml | grep -oE '__[A-Z0-9_]+__' | sort -u || true)
        if [ -n "$$LEFTOVER" ]; then
          echo "Unsubstituted placeholder(s) left in envoy.yaml: $$LEFTOVER" >&2
          echo "Add them to the sed above, or remove them from supabase/envoy.yaml." >&2
          exit 1
        fi
        echo 'Rendered Envoy gateway config with API key consumers.'

  # The API gateway (Envoy). It answers to the network alias `supabase-kong` because that name is
  # carried by every in-network consumer and by a Vault secret in the database; the chart's
  # Service adopts the same name. The migration from Kong is documented in docs/gateway-migration.md.
  supabase-envoy:
    container_name: acs-cymru_supabase_envoy
    # Minimum 1.34: the oauth2 filter could not send PKCE before then, and GoTrue requires it.
    image: envoyproxy/envoy:v1.39.1
    restart: always
    ports:
      # The variable keeps its historical name because existing .env files set it.
      - "${KONG_HTTP_PORT:-54321}:8000"
      # Studio's door, on the port Studio used to publish itself (the Directory entry names it).
      # Safe to publish only because the listener behind it authenticates.
      - "${STUDIO_PORT:-54323}:8001"
      # The forge's door, on the port the forge used to publish itself. The gitea service
      # publishes SSH alone.
      - "${GITEA_HTTP_PORT:-3003}:8002"
    volumes:
      - envoy_config:/etc/envoy:ro
    command:
      - envoy
      - --config-path
      - /etc/envoy/envoy.yaml
      - --log-level
      - ${ENVOY_LOG_LEVEL:-info}
    networks:
      default:
        aliases:
          - supabase-kong
      # The door onto the forge's HTTP port (see the `forge` network at the foot of this file).
      forge: {}
    healthcheck:
      # /ready on the admin listener answers 200 once the proxy listener is serving. The image
      # has no HTTP client, so this speaks HTTP over bash's /dev/tcp (CMD-SHELL is dash).
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9901 && printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      supabase-envoy-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-functions:
        condition: service_started
      # service_started: the gateway does not block startup on Realtime's own migrations.
      supabase-realtime:
        condition: service_started
      supabase-storage:
        condition: service_started

  supabase-functions:
    container_name: acs-cymru_supabase_functions
    image: supabase/edge-runtime:v1.74.2
    restart: always
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Forwarded to every worker by main/index.ts; _shared/gatewayKey.ts prefers it over the anon key.
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      VERIFY_JWT: "false"
      NODERED_URL: ${NODERED_URL:-http://node-red:1880/flows}
      NODERED_ADMIN_TOKEN: ${NODERED_ADMIN_TOKEN:-}
      # AAS export. An edge worker sees only the variables main/index.ts forwards, so these are
      # declared here. Outbound references (base IRI, historian endpoint, model base) must name
      # addresses the recipient of a shell can reach, not in-stack ones.
      AAS_BASE_IRI: ${AAS_BASE_IRI:-https://acs-cymru.local/ids/asset/}
      AAS_HISTORIAN_ENDPOINT: ${AAS_HISTORIAN_ENDPOINT:-http://localhost:54321/rest/v1/telemetry}
      AAS_MODEL_PUBLIC_BASE: ${AAS_MODEL_PUBLIC_BASE:-http://localhost:54321/storage/v1/object/public/asset-3d-models}
      STORAGE_MODEL_BUCKET: ${STORAGE_MODEL_BUCKET:-asset-3d-models}
      AAS_MAX_BUNDLED_MODEL_BYTES: ${AAS_MAX_BUNDLED_MODEL_BYTES:-33554432}
      # The bearer grafana-alert-webhook verifies (Grafana holds the same value). No default: an
      # empty value makes the function answer 503 rather than accept unauthenticated writes.
      GRAFANA_ALERT_WEBHOOK_SECRET: ${GRAFANA_ALERT_WEBHOOK_SECRET}
      # The credential-issuing service enroll-gateway calls. Compose-internal; it publishes no port.
      MQTT_CREDENTIAL_SERVICE_URL: ${MQTT_CREDENTIAL_SERVICE_URL:-http://gateway-credential:9010}
      MQTT_CREDENTIAL_SERVICE_TOKEN: ${MQTT_CREDENTIAL_SERVICE_TOKEN:-}
      # Verified by revoke-gateway-credential. VERIFY_JWT is false, so a function that does not
      # check its own secret is an open endpoint.
      GATEWAY_REVOKE_SECRET: ${GATEWAY_REVOKE_SECRET:-}
      # Verified by forge-sweep, for the same reason (0099).
      FORGE_SWEEP_SECRET: ${FORGE_SWEEP_SECRET:-}
      # The forge, for enrolment's fourth step. In-stack address: the clone URL an appliance is
      # handed comes from the forge's own ROOT_URL/SSH_DOMAIN. All three or none.
      GITEA_INTERNAL_URL: ${GITEA_INTERNAL_URL:-http://gitea:3000}
      GITEA_MACHINE_USER: ${GITEA_MACHINE_USER:-acs_platform}
      GITEA_MACHINE_PASSWORD: ${GITEA_MACHINE_PASSWORD:-acs-platform-machine-account}
      # The push webhook enrolment registers on each gateway repository (0095): where Gitea
      # delivers -- this container, reached over the `forge` network, NOT through the gateway --
      # and the secret Gitea signs with and forge-events verifies against. Empty secret: no hook.
      GITEA_WEBHOOK_URL: ${GITEA_WEBHOOK_URL:-http://supabase-functions:9000/forge-events}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-}
      # Where an enrolled appliance dials the broker. No `mosquitto` default: that resolves
      # nowhere a gateway lives. enroll-gateway answers 503 without consuming a token when unset.
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
      MQTT_PUBLIC_TLS_PORT: ${MQTT_PUBLIC_TLS_PORT:-8883}
      # Where an appliance reaches the platform, written into the bundle's .env. No default, and
      # deliberately not SUPABASE_URL (127.0.0.1 is the container itself from an appliance).
      # Empty makes gateway-bundle answer 503 before any token is issued.
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      # The appliance bundle template gateway-bundle serves; read in the entrypoint below.
      - ./gateway-bundle-template:/home/deno/gateway-bundle-template:ro
      - deno_cache:/root/.cache/deno
    # An edge worker has no filesystem access to these mounts, so the bundle files are handed to
    # it through the environment. Static names: FUNCTION_REGISTRY in main/index.ts is an
    # allow-list of variable names. Kept in step with supabase/functions/Dockerfile's ENTRYPOINT.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        T=/home/deno/gateway-bundle-template
        export GW_BUNDLE_COMPOSE="$$(cat $$T/docker-compose.yml)"
        export GW_BUNDLE_DOCKERFILE="$$(cat $$T/Dockerfile)"
        export GW_BUNDLE_BOOTSTRAP="$$(cat $$T/bootstrap.mjs)"
        export GW_BUNDLE_FLOWS="$$(cat $$T/flows.template.json)"
        export GW_BUNDLE_FLOW_SYNC="$$(cat $$T/flow-sync.mjs)"
        export GW_BUNDLE_README="$$(cat $$T/README.md)"
        exec edge-runtime start --main-service /home/deno/functions/main
    # Both networks: enroll-gateway and forge-membership reach the forge's API, which is on
    # `forge` only and ignores the identity header.
    networks:
      - default
      - forge
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully

  # Schema introspection API for Studio's Database pages.
  supabase-meta:
    container_name: acs-cymru_supabase_meta
    # Pinned to the version the official stack pairs with the Studio tag below (Zod-coupled).
    image: supabase/postgres-meta:v0.96.6
    restart: always
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-acs-cymru-pg-meta-crypto-key}
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-studio:
    container_name: acs-cymru_supabase_studio
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: always
    # No `ports:`. Studio has no authentication of its own and runs as the database owner; it is
    # reached only through the gateway's `studio` listener on 54323 (an Administrator login). If
    # the proxy is ever removed, this block comes back with a `127.0.0.1:` binding, never an
    # unqualified port.
    environment:
      # Without this Next.js binds only the container's own interface and the healthcheck fails.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-acs-cymru-pg-meta-crypto-key}
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      # Studio picks its database user per request; unset, the read-only branch silently used
      # `postgres`. The role's password is set by supabase-db-roles-init (0082).
      POSTGRES_USER_READ_ONLY: supabase_read_only_user
      # Server-side calls use the internal gateway address; the browser uses the public one.
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: ACS-Cymru
      DEFAULT_PROJECT_NAME: ACS-Cymru
      # Studio reads edge functions from disk.
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./supabase/functions:/app/edge-functions:ro
      - studio_snippets:/app/snippets
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/platform/profile')
          .then((r) => { if (r.status !== 200) throw new Error(r.status) })"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      supabase-envoy:
        condition: service_started
      supabase-meta:
        condition: service_started

  # Interactive API reference: docs/openapi.yaml (hand-maintained, enforced by
  # check-docs-drift.mjs) and the i3X spec. The PostgREST live-schema entry is deliberately not
  # offered: it duplicated the curated spec and no check could keep it honest.
  swagger-ui:
    container_name: acs-cymru_swagger_ui
    image: swaggerapi/swagger-ui:v5.32.14
    restart: always
    ports:
      - "${SWAGGER_PORT:-8088}:8080"
    environment:
      # i3X is a second spec because it is served by i3x-service on 8090, not by the gateway.
      # Its "Try it out" does not work (no CORS headers on that server), as its description says.
      URLS: >-
        [{"url":"/openapi.yaml","name":"ACS-Cymru Platform API"},
         {"url":"/i3x-openapi.yaml","name":"i3X 1.0 Server"}]
      URLS_PRIMARY_NAME: ACS-Cymru Platform API
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
    volumes:
      - ./docs/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
      - ./docs/i3x-openapi.yaml:/usr/share/nginx/html/i3x-openapi.yaml:ro

  # ---------------------------------------------------------------------------
  # Messaging & Edge Infrastructure
  # ---------------------------------------------------------------------------
  # Broker CA and MQTTS leaf certificate (Compose only; cert-manager owns this on Kubernetes).
  # The root is never regenerated once it exists: it is in every physical gateway's trust store,
  # so a new root takes the fleet offline silently. `mosquitto_certs` is a named volume for that reason.
  mosquitto-tls-init:
    container_name: acs-cymru_mosquitto_tls_init
    build:
      context: ./mosquitto/tls-init
    # Root, to chown the key to the uid the broker drops to (1883).
    user: "0"
    environment:
      # Folded into the certificate's SAN; a gateway dials the broker by this name.
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
      MQTT_TLS_SAN_EXTRA: ${MQTT_TLS_SAN_EXTRA:-}
    volumes:
      - mosquitto_certs:/mosquitto/certs
      - ./scripts/mosquitto-tls-init.mjs:/scripts/mosquitto-tls-init.mjs:ro
    command: ["node", "/scripts/mosquitto-tls-init.mjs"]
    restart: "no"

  # Assembles mosquitto.conf (appending the TLS stanza when certificates exist), then writes the
  # Dynamic Security plugin's document with scripts/mosquitto-dynsec-init.mjs: the roles from
  # mosquitto/dynsec-roles.json, the platform principals and the plugin's admin from the
  # environment, and every gateway account already in the document kept as it is. A stack that
  # still has a password file from before the plugin has it imported on the first run and renamed
  # `.imported`. mosquitto/README.md states the reconcile rules. Runs on the credential service's
  # image, which carries the broker's own mosquitto_passwd beside node.
  mosquitto-init:
    container_name: acs-cymru_mosquitto_init
    build:
      context: ./gateway-credential
    environment:
      MQTT_INGESTION_USER: ${MQTT_INGESTION_USER:-factoryplus_ingestion}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD}
      MQTT_I3X_USER: ${MQTT_I3X_USER:-factoryplus_i3x}
      MQTT_I3X_PASSWORD: ${MQTT_I3X_PASSWORD}
      MQTT_VALIDATOR_USER: ${MQTT_VALIDATOR_USER:-gwy110000000000400080000}
      MQTT_VALIDATOR_PASSWORD: ${MQTT_VALIDATOR_PASSWORD}
      MQTT_MONITOR_USER: ${MQTT_MONITOR_USER:-factoryplus_monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD}
      # The account the credential service administers the plugin as. Required.
      MQTT_DYNSEC_ADMIN_USER: ${MQTT_DYNSEC_ADMIN_USER:-dynsec-admin}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD}
      # The validator is optional, as on the chart: leave MQTT_VALIDATOR_PASSWORD unset and no
      # account is created. MONITOR is always required by the init.
      DYNSEC_REQUIRED_PRINCIPALS: "INGESTION I3X"
      LEGACY_PASSWORD_FILE: /mosquitto/config/password_file
      # No gateway accounts are seeded here: a gateway's credential is minted once its row exists
      # (dashboard, or the enrolment bundle).
    volumes:
      - mosquitto_data:/mosquitto/config
      - mosquitto_dynsec:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/policy/mosquitto.conf:ro
      - ./mosquitto/mosquitto-tls.conf:/policy/mosquitto-tls.conf:ro
      - ./mosquitto/dynsec-roles.json:/policy/dynsec-roles.json:ro
      - ./scripts/mosquitto-dynsec-init.mjs:/scripts/mosquitto-dynsec-init.mjs:ro
      - ./scripts/lib/mosquitto-credentials.mjs:/scripts/lib/mosquitto-credentials.mjs:ro
      - ./scripts/lib/mosquitto-dynsec.mjs:/scripts/lib/mosquitto-dynsec.mjs:ro
      - mosquitto_certs:/certs:ro
    entrypoint: >
      /bin/sh -e -c "
      echo 'Assembling broker configuration...';
      cp /policy/mosquitto.conf /mosquitto/config/mosquitto.conf;
      if [ -s /certs/tls.crt ] && [ -s /certs/tls.key ] && [ -s /certs/ca.crt ]; then
        echo '' >> /mosquitto/config/mosquitto.conf;
        cat /policy/mosquitto-tls.conf >> /mosquitto/config/mosquitto.conf;
        echo 'Appended the MQTTS listener (8883); certificates are present.';
      else
        echo 'NO BROKER CERTIFICATES FOUND -- 8883 will not be offered, and physical gateways cannot enrol. Check the mosquitto-tls-init service.' >&2;
      fi;
      exec node /scripts/mosquitto-dynsec-init.mjs;
      "
    depends_on:
      # The TLS stanza is appended only if the certificates already exist.
      mosquitto-tls-init:
        condition: service_completed_successfully

  mosquitto:
    container_name: acs-cymru_mosquitto
    image: eclipse-mosquitto:2.0.22
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
      # MQTTS for clients off the Docker network (physical gateways). 1883 stays open for the
      # in-network services and virtual gateways. One plugin document serves both.
      - "8883:8883"
    environment:
      # The healthcheck's credential only: reads $SYS/# and can publish nothing.
      MQTT_MONITOR_USER: ${MQTT_MONITOR_USER:-factoryplus_monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD}
    volumes:
      # mosquitto.conf arrives assembled by mosquitto-init through this volume.
      - mosquitto_data:/mosquitto/config
      # The plugin's document, written by mosquitto-init before the broker starts and rewritten by
      # the plugin itself on every change the credential service makes.
      - mosquitto_dynsec:/mosquitto/data
      # The leaf and CA the broker presents. ca.key is root-owned 0600 and unreadable to the broker uid.
      - mosquitto_certs:/mosquitto/certs:ro
    healthcheck:
      # MQTT 5, because that is what every application client here speaks.
      test: ["CMD-SHELL", "mosquitto_sub -V mqttv5 -u $${MQTT_MONITOR_USER:-factoryplus_monitor} -P $${MQTT_MONITOR_PASSWORD} -t '$$SYS/broker/version' -C 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Broker credential-issuing service
  # ---------------------------------------------------------------------------
  # The narrow authority the edge functions call: issue a gateway's Mosquitto account, disable one,
  # list what the broker holds. No database. Not published: issuing is the ability to publish
  # telemetry as any gateway on the site, and reachability from the compose network is the primary
  # control. It speaks to the broker's Dynamic Security plugin over MQTT as the plugin's admin, so
  # a change is applied to the running broker by the broker itself; nothing is signalled and no
  # file is shared.
  gateway-credential:
    container_name: acs-cymru_gateway_credential
    build:
      context: ./gateway-credential
    restart: always
    environment:
      CREDENTIAL_TARGET: compose
      # Required; the service refuses to start without it. Shared only with supabase-functions.
      MQTT_CREDENTIAL_SERVICE_TOKEN: ${MQTT_CREDENTIAL_SERVICE_TOKEN}
      MQTT_CREDENTIAL_SERVICE_PORT: "9010"
      MQTT_HOST: mosquitto
      # The plugin's admin: its role reaches $CONTROL/dynamic-security/# and nothing else.
      MQTT_DYNSEC_ADMIN_USER: ${MQTT_DYNSEC_ADMIN_USER:-dynsec-admin}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD}
    volumes:
      # Read-only, for ca.crt, which it returns at enrolment.
      - mosquitto_certs:/mosquitto/certs:ro
      # Write end of the playback credential delivery path (0078); the playback worker mounts
      # the same volume read-only.
      - playback_credentials:/var/lib/acs-cymru/playback
      - ./scripts/gateway-credential-service.mjs:/scripts/gateway-credential-service.mjs:ro
      - ./scripts/lib/mosquitto-credentials.mjs:/scripts/lib/mosquitto-credentials.mjs:ro
      - ./scripts/lib/mosquitto-dynsec.mjs:/scripts/lib/mosquitto-dynsec.mjs:ro
      - ./scripts/lib/mosquitto-control.mjs:/scripts/lib/mosquitto-control.mjs:ro
    command: ["node", "/scripts/gateway-credential-service.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9010/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mosquitto:
        condition: service_healthy

  # The backup service: turns a backup_jobs row (0101) into a tier 1 backup on `backup_data`.
  # Both databases as their superusers, the storage objects and the forge, one directory per
  # backup, and the schedule and retention window from the two variables below. Not published:
  # it serves /healthz on the compose network and nothing else, and the dumps never leave the
  # volume. Restore is the runbook in supabase/README.md, from a shell, against that volume.
  backup-service:
    container_name: acs-cymru_backup_service
    build:
      context: ./backup-service
    restart: always
    environment:
      SUPABASE_DB_HOST: supabase-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_USER: ${DB_USER:-postgres}
      TIMESCALE_DB: ${DB_NAME:-postgres}
      TIMESCALE_PASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_FORMAT: ${BACKUP_FORMAT:-plain}
    volumes:
      - backup_data:/backups
      # Read-only: the service copies these and never writes into them.
      - storage_data:/storage:ro
      - gitea_data:/forge:ro
      - ./scripts/backup-service.mjs:/scripts/backup-service.mjs:ro
    command: ["node", "/scripts/backup-service.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9020/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application Runtimes & Ingestion
  # ---------------------------------------------------------------------------
  # React dashboard, served by NGINX. Configuration is baked at build time here; the chart builds
  # the same Dockerfile with VITE_RUNTIME_CONFIG=true and mounts a ConfigMap instead
  # (docs/kubernetes-architecture.md §2.1).
  frontend:
    container_name: acs-cymru_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        # Public in the same way as the anon key; config.js prefers it and falls back.
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_ENABLE_REALTIME: ${VITE_ENABLE_REALTIME:-true}
        VITE_GITHUB_REPO_URL: ${VITE_GITHUB_REPO_URL:-https://github.com/Harri-Llewelyn/ACS-Cymru}
        # Derived from the public URLs the OAuth clients are registered against, so the
        # dashboard's links and the sign-out beacons name the host each session was opened on.
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-${GRAFANA_PUBLIC_URL:-http://localhost:3002}}
        VITE_STUDIO_URL: ${VITE_STUDIO_URL:-${STUDIO_PUBLIC_URL:-http://127.0.0.1:${STUDIO_PORT:-54323}}}
        VITE_GITEA_URL: ${VITE_GITEA_URL:-${GITEA_ROOT_URL:-http://localhost:${GITEA_HTTP_PORT:-3003}/}}
        # Only needed if a bucket was renamed; src/api.js defaults match storage-init.mjs.
        VITE_MODEL_3D_BUCKET: ${STORAGE_BUCKET:-asset-3d-models}
        VITE_CAPTURE_BUCKET: ${CAPTURE_BUCKET:-broker-captures}
        # The version the account menu reports. Compose cannot run a command, so pass it in:
        #   APP_VERSION=$(git describe --tags --always --dirty) docker compose up --build -d frontend
        # Unset reports "unknown".
        VITE_APP_VERSION: ${APP_VERSION:-}
    restart: always
    ports:
      - "3000:3000"

  ingestion:
    container_name: acs-cymru_ingestion
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: always
    # Loopback only. Prometheus scrapes `ingestion:9108` over the compose network; the endpoint
    # takes no credential (see ingestion/metrics.py for what may appear on it).
    ports:
      - "127.0.0.1:${INGESTION_METRICS_PORT:-9108}:9108"
    environment:
      # JSON logs, so the drop fields (`reason`, `device`, `edge_node`) are queryable in Loki. The
      # code default stays `text` for a daemon run by hand; the chart sets the same value.
      LOG_FORMAT: json
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      # The historian credential: `ingest_writer` may INSERT and cannot UPDATE, DELETE or
      # TRUNCATE. Override the user and password TOGETHER for a recovery; INGEST_DB_USER alone
      # would authenticate as nothing.
      DB_USER: ${INGEST_DB_USER:-ingest_writer}
      DB_PASSWORD: ${INGEST_DB_PASSWORD:-${INGEST_WRITER_PASSWORD:?INGEST_WRITER_PASSWORD is required -- the ingestion daemon connects to the historian as ingest_writer, and the only alternative is the superuser it replaced. Run `npm run setup`, or set it in .env.}}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # Reads spBv1.0/# and may publish only rebirth NCMDs, so this credential cannot forge telemetry.
      MQTT_USER: ${MQTT_INGESTION_USER:-factoryplus_ingestion}
      MQTT_PASSWORD: ${MQTT_INGESTION_PASSWORD}
      # MQTTS, opt-in. Empty is a no-op.
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      SUPABASE_URL: http://supabase-kong:8000
      # No service-role key. The anon/publishable key is the gateway's apikey; the ingestion
      # token is the Authorization bearer naming Service_Ingestor, whose writes all go through
      # SECURITY DEFINER gates (supabase/README.md, Machine Identities).
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_INGESTION_KEY: ${SUPABASE_INGESTION_KEY}
      # Device liveness watchdog; a silent device emits no DDEATH. 0 disables.
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-300}
      DEVICE_WATCHDOG_INTERVAL_SECONDS: ${DEVICE_WATCHDOG_INTERVAL_SECONDS:-30}
      # Rebirth requests recover the alias table after a restart; rate limited per edge node.
      REBIRTH_REQUEST_INTERVAL_SECONDS: ${REBIRTH_REQUEST_INTERVAL_SECONDS:-300}
      # The Directory's MQTT half, off by default: a topic has no caller, so the whole address
      # space would be behind mosquitto.acl alone. The prefix must stay inside the ACL's
      # `topic write ACS-Cymru/Directory/#` rule, or publishes are dropped silently at QoS 0.
      DIRECTORY_MQTT_ENABLED: ${DIRECTORY_MQTT_ENABLED:-}
      DIRECTORY_MQTT_TOPIC_PREFIX: ${DIRECTORY_MQTT_TOPIC_PREFIX:-ACS-Cymru/Directory/v1}
      DIRECTORY_MQTT_INTERVAL_SECONDS: ${DIRECTORY_MQTT_INTERVAL_SECONDS:-60}
      # The Unified Namespace bridge, off by default for the same reason: every decoded reading,
      # retained under uns/..., behind mosquitto.acl alone. The root must stay inside the ACL's
      # `topic write uns/#` rule.
      UNS_MQTT_ENABLED: ${UNS_MQTT_ENABLED:-}
      UNS_MQTT_TOPIC_ROOT: ${UNS_MQTT_TOPIC_ROOT:-uns}
      UNS_CONTEXT_TTL_SECONDS: ${UNS_CONTEXT_TTL_SECONDS:-60}
      PYTHONUNBUFFERED: "1"
    # The CA, mounted unconditionally so MQTT_TLS_ENABLED is the only switch. ca.key is unreadable.
    volumes:
      - mosquitto_certs:/etc/acs-cymru/broker-ca:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      supabase-db-init:
        condition: service_completed_successfully
      # roles.sql creates `ingest_writer`, which this connects as.
      timescaledb-maintenance:
        condition: service_completed_successfully
      # Ordering only. The safety property is ingestion.py refusing to read "unreachable" as
      # "unregistered" (DirectoryUnavailable), which matters long after boot.
      supabase-envoy:
        condition: service_healthy

  # Cold telemetry archival: exports chunks past the retention threshold to Parquet, verifies
  # each object, then drops the raw rows. Same image as `ingestion` under a different command.
  # Re-reads `archive.enabled` every pass and is inert while it is off. Set
  # TIMESCALE_RETAIN_FOR=never when enabling, or the retention timer drops chunks first.
  cold-archiver:
    container_name: acs-cymru_cold_archiver
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: always
    command: ["python", "-m", "cold_archive", "--drop", "--loop", "${COLD_ARCHIVE_INTERVAL_SECONDS:-86400}"]
    environment:
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      # ingest_writer holds neither DELETE nor TRUNCATE; dropping goes through cold_tier_drop_verified().
      DB_USER: ${INGEST_DB_USER:-ingest_writer}
      DB_PASSWORD: ${INGEST_DB_PASSWORD:-${INGEST_WRITER_PASSWORD:?INGEST_WRITER_PASSWORD is required -- the cold archiver connects to the historian as ingest_writer. Run `npm run setup`, or set it in .env.}}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_INGESTION_KEY: ${SUPABASE_INGESTION_KEY}
      PYTHONUNBUFFERED: "1"
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      supabase-envoy:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # Broker playback: publishes a stored capture back into the stack. Same image as `ingestion`
  # under a different command, with a separate principal (Service_Playback) and no historian or
  # ingestion credentials. Its MQTT identity is the target gateway's own, so the ACL confines it.
  playback:
    container_name: acs-cymru_playback
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["python", "playback_worker.py"]
    restart: always
    environment:
      # JSON logs, as for ingestion.
      LOG_FORMAT: json
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # One password per target gateway, keyed by sparkplug_id:
      #   MQTT_PLAYBACK_CREDENTIALS={"gwy130000000000400080000":"..."}
      # Empty is valid: the worker starts and refuses each job naming the missing credential.
      # The delivered file (below) wins over these.
      MQTT_PLAYBACK_CREDENTIALS: ${MQTT_PLAYBACK_CREDENTIALS:-}
      MQTT_PLAYBACK_USER: ${MQTT_PLAYBACK_USER:-}
      MQTT_PLAYBACK_PASSWORD: ${MQTT_PLAYBACK_PASSWORD:-}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_PLAYBACK_KEY: ${SUPABASE_PLAYBACK_KEY:?SUPABASE_PLAYBACK_KEY is required -- the playback worker authenticates as Service_Playback (archived migration 0056) and can claim nothing without it. Run `npm run setup`, or copy it from .env.example.}
      CAPTURE_BUCKET: ${CAPTURE_BUCKET:-broker-captures}
      PYTHONUNBUFFERED: "1"
    volumes:
      - mosquitto_certs:/etc/acs-cymru/broker-ca:ro
      # Read end of the credential delivery path, read-only: this worker never issues credentials.
      - playback_credentials:/var/lib/acs-cymru/playback:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      supabase-db-init:
        condition: service_completed_successfully
      supabase-envoy:
        condition: service_healthy

  # i3X 1.0 server: a read-side adapter with its own `spBv1.0/#` subscription (subscription
  # values cannot come from Realtime, since `telemetry` is a foreign table). Single replica:
  # subscription state is in memory.
  i3x-service:
    container_name: acs-cymru_i3x
    build:
      # Repository root: sparkplug_b.proto lives there.
      context: .
      dockerfile: i3x/Dockerfile
    restart: always
    ports:
      - "${I3X_PORT:-8090}:8090"
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      # The anon key only. The service queries PostgREST as the CALLER so RLS decides the address
      # space, and main() refuses to start if SUPABASE_SERVICE_ROLE_KEY is present.
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # Read-only at the broker, matching what the service refuses in code (405).
      MQTT_USER: ${MQTT_I3X_USER:-factoryplus_i3x}
      MQTT_PASSWORD: ${MQTT_I3X_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
      # The TTL is a spec MUST; the queue limit makes overflow a reported 206 rather than
      # unbounded memory.
      I3X_SUBSCRIPTION_TTL_SECONDS: ${I3X_SUBSCRIPTION_TTL_SECONDS:-300}
      I3X_SUBSCRIPTION_QUEUE_LIMIT: ${I3X_SUBSCRIPTION_QUEUE_LIMIT:-10000}
      PYTHONUNBUFFERED: "1"
    volumes:
      - mosquitto_certs:/etc/acs-cymru/broker-ca:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      supabase-envoy:
        condition: service_started
      supabase-db-init:
        condition: service_completed_successfully

  node-red-init:
    container_name: acs-cymru_node_red_init
    # Same build context as node-red: settingsAreCorrect() evaluates settings.js, which requires
    # passport-oauth2; without it the init rewrites the settings on every boot.
    build:
      context: ./node-red
    user: "0"
    environment:
      <<: *nodered-auth-env
      # No flow is seeded and no broker credential is passed: the editor opens empty. A user
      # building a flow mints a credential from the Gateways tab and sets the pair their broker
      # node's `acsCredentialsEnv` names (tutorial/README.md).
      # The MQTT transport for any broker node a user adds; node-red-init reconciles broker nodes
      # onto TLS and fails closed when the CA is missing.
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-}
    volumes:
      - nodered_data:/data
      - mosquitto_certs:/etc/acs-cymru/broker-ca:ro
      - ./scripts/node-red-init.mjs:/seed/node-red-init.mjs:ro
    # Writes flows_cred.json encrypted at rest and fails closed if it cannot.
    entrypoint: >
      /bin/sh -e -c "
      node /seed/node-red-init.mjs;
      chown -R 1000:1000 /data;
      "

  node-red:
    container_name: acs-cymru_node_red
    build:
      context: ./node-red
    restart: always
    # settings.js resolves these from process.env at load time; the runtime needs the same block
    # the init container was given.
    environment:
      <<: *nodered-auth-env
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      # The runtime needs the CA too: node-red-init writes its PATH into the tls-config node.
      - mosquitto_certs:/etc/acs-cymru/broker-ca:ro
    depends_on:
      node-red-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      ingestion:
        condition: service_started

  # ===============================================================================================
  # GITEA -- the forge. One private repository per enrolled gateway, holding that appliance's
  # flows.json; the appliance pulls it with a per-gateway read-only deploy key (flow-sync.mjs).
  #
  # Self-hosted, so the plant's edge topology stays on site and deploys do not depend on the
  # internet link. Not an identity store: roles stay in Postgres, the platform reaches the forge
  # through one machine account, and only Administrator and Shopfloor_Manager hold a login
  # (through the gateway's `forge` listener). SQLite, like Grafana's backend: a handful of commits
  # a day does not belong inside the platform database.
  #
  # Backup: this volume is not in any dump (see the `gitea_data` volume below).
  # ===============================================================================================
  gitea-init:
    container_name: acs-cymru_gitea_init
    image: gitea/gitea:1.27.3
    # Creates the administrator and the machine account out of band, because INSTALL_LOCK closes
    # the web installer. Runs the image's own setup script so app.ini is built identically to the
    # server's. Idempotent by inspection: "already exists" is expected, every other non-zero exit
    # stops the stack.
    environment:
      <<: *gitea-env
      # Read by /etc/s6/gitea/setup, which chowns what it writes to this account.
      USER: git
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-gitea-admin}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-gitea-admin@acs-cymru.invalid}
      # Not an admin: it owns the per-gateway repositories and can attach a read-only deploy key,
      # which is all enroll-gateway needs. Empty means no forge integration.
      GITEA_MACHINE_USER: ${GITEA_MACHINE_USER:-acs_platform}
      GITEA_MACHINE_PASSWORD: ${GITEA_MACHINE_PASSWORD:-acs-platform-machine-account}
      GITEA_MACHINE_EMAIL: ${GITEA_MACHINE_EMAIL:-acs-platform@acs-cymru.invalid}
    volumes:
      - gitea_data:/data
      # Mirrored into the chart by scripts/sync-helm-chart-files.mjs.
      - ./scripts/gitea-init.sh:/seed/gitea-init.sh:ro
    # Root: the setup script chowns /data to `git`, and every gitea command inside runs via su-exec.
    entrypoint: ["/bin/bash", "/seed/gitea-init.sh"]

  gitea:
    container_name: acs-cymru_gitea
    # Pinned: deploy-key semantics are the forge's behaviour, not git's.
    image: gitea/gitea:1.27.3
    restart: always
    environment:
      <<: *gitea-env
    volumes:
      - gitea_data:/data
    # The `forge` network only: whoever can reach 3000 can sign in as anybody, so the set of
    # containers that can reach it is the access control. HTTP is published by the gateway's
    # forge listener on GITEA_HTTP_PORT; this container publishes SSH alone.
    networks:
      - forge
    ports:
      # Not loopback: appliances on the plant network dial it. Every repository is private and
      # every key is per-gateway and read-only.
      - "${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      # /api/healthz reports the database and caches, not merely an open socket.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      gitea-init:
        condition: service_completed_successfully

  # ===============================================================================================
  # Prometheus -- the metrics store the alert rules read. Compose only: the chart ships
  # ServiceMonitors and defers to the cluster's Prometheus. It stores; Grafana evaluates.
  # ===============================================================================================
  prometheus:
    container_name: acs-cymru_prometheus
    image: prom/prometheus:v3.14.0
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Long enough that a weekly pattern is visible. Matched by Loki's retention.
      - '--storage.tsdb.retention.time=30d'
      # A byte ceiling as well: a burst of new series would otherwise fill the disk inside the window.
      - '--storage.tsdb.retention.size=8GB'
      # No `--web.enable-lifecycle`: it enables POST /-/quit, an unauthenticated remote shutdown.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Loopback only. Prometheus has no authentication, and its expression browser would offer
      # every metric here to the plant network. Grafana reaches it over the compose network. The
      # rule for this file: a port is published broadly only if it authenticates a browser session
      # (Grafana, the frontend, Node-RED) or is a protocol endpoint the fleet dials (the broker).
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      ingestion:
        condition: service_started

  # ===============================================================================================
  # node_exporter -- host metrics. On Docker Desktop it reports the engine's Linux VM, not the
  # laptop. Disk is the metric that matters: this host carries two Postgres data directories, a
  # TSDB and a log store. Read-only mounts; `pid: host` is for process metrics.
  # ===============================================================================================
  node-exporter:
    container_name: acs-cymru_node_exporter
    image: prom/node-exporter:v1.12.1
    restart: always
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Container and pseudo filesystems excluded, or every overlay mount appears as a disk.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # Not published.

  # ===============================================================================================
  # The log store: Loki, with Alloy collecting through a read-only Docker socket proxy. Every
  # `drop("<reason>")` in the daemon is a counter (Prometheus) and a line naming the device
  # (here). Grafana reaches Loki over the compose network as a datasource behind its own login.
  # These logs are not the audit trail; that is `digital_thread`.
  # ===============================================================================================
  loki:
    container_name: acs-cymru_loki
    image: grafana/loki:3.5.7
    restart: always
    command:
      - '-config.file=/etc/loki/loki.yaml'
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      # Loopback only, as for Prometheus: Loki has no authentication (`auth_enabled` is a
      # multi-tenancy switch), and these lines carry every gateway's wire id.
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      # /ready answers 200 only once the ingester accepts writes; alloy depends on this.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The Docker API, narrowed. A socket mount's `:ro` makes the socket FILE read-only and grants
  # the full API behind it (including creating a container that bind-mounts the host root), so
  # the socket is mounted here and every path group but CONTAINERS and NETWORKS is refused.
  # Not published.
  docker-socket-proxy:
    container_name: acs-cymru_docker_socket_proxy
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: always
    environment:
      # /containers/json to discover, /containers/<id>/logs to read.
      CONTAINERS: 1
      # Every write verb refused; without this CONTAINERS: 1 would permit POST /containers/create.
      POST: 0
      EXEC: 0
      VOLUMES: 0
      IMAGES: 0
      # Required: discovery.docker calls GET /networks after GET /containers/json and fails
      # wholesale (nothing collected) when it is refused. Read-only with POST: 0.
      NETWORKS: 1
      SERVICES: 0
      SWARM: 0
      NODES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      # The one socket mount in this repository.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The collector. Labels and the cardinality decision are in alloy/config.alloy.
  alloy:
    container_name: acs-cymru_alloy
    image: grafana/alloy:v1.11.2
    restart: always
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      # Loopback only: Alloy's UI shows the live pipeline and the last lines through it.
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  grafana:
    container_name: acs-cymru_grafana
    image: grafana/grafana:13.2.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # The same value the migrations register as the OAuth client's redirect_uris, so the two
      # cannot drift. Overrides grafana.ini's [server] root_url.
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3002}/
      GF_INSTALL_PLUGINS: ""
      # The read-only historian role, not the superuser (see datasources.template.yml).
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      # Read by grafana.ini through $__env{...}; must match what the migrations hashed.
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      # The alert webhook's bearer secret and a gateway key, substituted into the contact point.
      # Grafana is not given the service-role key.
      GRAFANA_ALERT_WEBHOOK_SECRET: ${GRAFANA_ALERT_WEBHOOK_SECRET:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/tmp/datasources-template:ro
      - grafana_provisioning_datasources:/etc/grafana/provisioning/datasources
      # Rules and the policy tree are plain files; the contact point is a template with a secret.
      - ./grafana/provisioning/alerting:/tmp/alerting-template:ro
      - grafana_provisioning_alerting:/etc/grafana/provisioning/alerting
    # Renders the datasource and contact-point templates into volumes, then hands over to
    # Grafana's own /run.sh. The chart renders the same templates into a Secret instead
    # (docs/kubernetes-architecture.md §2.4).
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        if [ -z "$$BI_READER_PASSWORD" ]; then
          echo 'BI_READER_PASSWORD must be set -- Grafana would otherwise provision the TimescaleDB datasource with an empty password. It is the password of the read-only powerbi_reader role created by timescaledb/roles.sql.' >&2
          exit 1
        fi
        # The store URLs are substituted here because the chart puts different values into the same template.
        sed -e "s|__BI_READER_PASSWORD__|$$BI_READER_PASSWORD|g" \
            -e "s|__PROMETHEUS_URL__|http://prometheus:9090|g" \
            -e "s|__LOKI_URL__|http://loki:3100|g" \
            /tmp/datasources-template/datasources.template.yml \
            > /etc/grafana/provisioning/datasources/datasources.yml
        # Comment lines excluded: the template's header names the placeholders.
        if grep -vE '^[[:space:]]*#' /etc/grafana/provisioning/datasources/datasources.yml \
           | grep -qE '__[A-Z0-9_]+__'; then
          echo 'Grafana datasource config still contains unsubstituted placeholders.' >&2
          exit 1
        fi
        # Alerting: plain files copied, the contact point rendered, into one provisioning directory.
        if [ -z "$$GRAFANA_ALERT_WEBHOOK_SECRET" ]; then
          echo 'GRAFANA_ALERT_WEBHOOK_SECRET must be set -- Grafana would otherwise provision the alert contact point with an empty bearer token, and grafana-alert-webhook would refuse every notification with 401 while the rules themselves looked healthy. Run: node scripts/setup.mjs' >&2
          exit 1
        fi
        # Either key format satisfies the gateway; the publishable key wins where both are set.
        GATEWAY_KEY=$${SUPABASE_PUBLISHABLE_KEY:-$$SUPABASE_ANON_KEY}
        if [ -z "$$GATEWAY_KEY" ]; then
          echo 'SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY must be set -- it is what gets the alert webhook past the gateway key-auth. Run: node scripts/setup.mjs' >&2
          exit 1
        fi
        # Globbed on the suffix, so a rules file added to grafana/provisioning/alerting/ is picked up.
        cp /tmp/alerting-template/policies.yaml /tmp/alerting-template/*alert-rules.yaml \
           /etc/grafana/provisioning/alerting/
        sed -e "s|__GRAFANA_ALERT_WEBHOOK_SECRET__|$$GRAFANA_ALERT_WEBHOOK_SECRET|g" \
            -e "s|__SUPABASE_ANON_KEY__|$$GATEWAY_KEY|g" \
            /tmp/alerting-template/contact-points.template.yaml \
            > /etc/grafana/provisioning/alerting/contact-points.yaml
        if grep -vE '^[[:space:]]*#' /etc/grafana/provisioning/alerting/contact-points.yaml \
           | grep -qE '__[A-Z0-9_]+__'; then
          echo 'Grafana alert contact point still contains unsubstituted placeholders.' >&2
          exit 1
        fi
        exec /run.sh
    depends_on:
      timescaledb:
        condition: service_healthy

# The forge network. Gitea signs in whoever the X-WEBAUTH-USER header names, from any peer, so
# Gitea's HTTP port is reachable only from the gateway (the door) and the edge runtime (the API,
# which ignores the header). Node-RED runs flow-author JavaScript and must not resolve the name.
# Not `internal: true`: an internal network cannot publish ports, and 2222 is the fleet's transport.
networks:
  forge: {}

volumes:
  pgdata:
  nodered_data:
  grafana_data:
  # Gitea: the SQLite database, every repository, and the SSH host keys appliances pin in
  # known_hosts. Holds the only copy of every gateway's edge flow. In every backup the backup
  # service takes (as forge-<stamp>.tar.gz); regenerating the host keys makes every gateway refuse
  # to clone, so a restored forge is restored from that archive, host keys included.
  gitea_data:
  # The backup service's output: one directory per backup, each holding both dumps, the storage
  # objects, the forge and a manifest. Survives `docker compose down`; `docker volume rm` on it is
  # the loss of every backup, which is the moment they are wanted.
  backup_data:

  # Prometheus' TSDB. Retention is set on the service because it shares a disk with two databases.
  prometheus_data:
  # Loki's chunks and index. Not backed up, deliberately: the store answers a question being asked
  # during a fault, and everything from the lines that matters beyond it is already a row in
  # digital_thread or platform_alerts, both in the tier 1 dump. `docker volume rm` loses up to
  # thirty days of logs and nothing else.
  loki_data:
  # Alloy's positions file: a restart resumes rather than re-shipping every line it can still see.
  alloy_data:
  # Rendered provisioning carrying credentials; volumes so nothing is written back into the repository.
  grafana_provisioning_alerting:
  grafana_provisioning_datasources:
  # The assembled mosquitto.conf, and a pre-plugin stack's password file until mosquitto-init
  # imports it.
  mosquitto_data:
  # The Dynamic Security plugin's document: every gateway account the credential service has
  # issued, as hashes. Durable because it is the only copy; `docker volume rm` on it disconnects
  # the whole fleet, and each gateway must then be re-issued.
  mosquitto_dynsec:
  # Broker passwords for playback targets, written by gateway-credential and read by playback.
  # A volume because it holds credential material, and durable because it is the only copy.
  playback_credentials:
  # The broker's CA and MQTTS leaf. The root must survive `docker compose down`: it is in every
  # physical gateway's trust store, so `docker volume rm <project>_mosquitto_certs` is a
  # fleet-wide re-enrolment, not a reset.
  mosquitto_certs:
  supabase_db_data:
  # /etc/postgresql-custom: the pgsodium root key (see the mount on supabase-db).
  supabase_db_config:
  studio_snippets:
  deno_cache:
  storage_data:
  # The rendered Envoy bootstrap, which contains both API keys.
  envoy_config:
