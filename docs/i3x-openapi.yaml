openapi: 3.0.3

info:
  title: Aber i3X 1.0 Server
  version: "0.1.0"
  description: |
    A conformant [i3X](https://github.com/cesmii/i3X) (CESMII Industrial Information
    Interoperability eXchange) read-side view of this platform's asset model — **52 passed,
    0 failed** against CESMII's official 60-test conformance suite at `3eae7ea4` (cesmii/i3X,
    2026-09-25), the ref CI pins, which tests shape. What it says about a seeded plant is
    checked against the Directory by `ingestion/validate.py` (checks 12 and 17).

    ### This is a different service from the Platform API

    It is **not behind the gateway**. It listens on its own port, takes no `apikey`
    header, and speaks the i3X wire format rather than PostgREST's. That is why it has its
    own document instead of a section in `openapi.yaml` — one `servers:` block cannot
    describe two origins, and `/v1/schema` already means something else on the gateway.

    | | Platform API (`openapi.yaml`) | i3X (this document) |
    | :--- | :--- | :--- |
    | Origin | the gateway, `:54321` | i3X service, `:8090` |
    | Headers | `apikey` **and** `Authorization` | `Authorization` only |
    | Shape | one path per table/view | one address space, browsed by relationship |

    ### The `/v1` prefix is part of the base URL

    Every path below is served under `/v1`, and the server returns **404 for anything
    outside it** — including `/info`. Clients that take a base URL (i3X Explorer, the
    CESMII MCP server) must be given `http://localhost:8090/v1`, not `http://localhost:8090`.
    A client pointed at the bare host fails its version probe and silently falls back to
    treating the server as pre-1.0.

    ### Authentication

    `Authorization: Bearer <access_token>` — the **user's own** access token from
    `POST /auth/v1/token?grant_type=password` on the Platform API, or a service principal's
    token minted for i3X clients.

    Every request except `GET /info` is authenticated first, by one PostgREST call carrying
    your token, so a revoked or expired token is refused here as it is on the Platform API
    (within 15 seconds). A subscription belongs to your token's `sub` as well as to its
    `clientId`: another principal gets `404` for it.

    > ⚠️ **The anon key is not a substitute.** This service holds no service-role key and
    > refuses to start if one is in its environment. It replays your token to PostgREST for
    > every metadata read, so RLS decides what the address space contains. The publishable
    > key stands for `anon` and is refused with
    > `401 The data layer refused this token: a user or service access token is required`.

    > ℹ️ **Tokens expire after an hour.** A client that persists its connection settings —
    > Explorer does — will start returning 401 on a profile that worked earlier. Paste a
    > fresh token.

    ### Row Level Security, including on values

    Metadata is safe because PostgREST enforces policy. The **MQTT value cache has no RLS**,
    so a value request is answered in two steps: resolve the requested elementIds through
    PostgREST *as the caller* first, then serve only the ids that came back. An element you
    cannot see reports as `404 Not Found`, indistinguishable from one that does not exist.

    ### Response envelopes

    Two shapes, and which one you get depends on the operation, not the outcome:

    * **Single** — `{"success": true, "result": …}`
    * **Bulk** — `{"success": …, "results": [{"success": …, "elementId": …, "result": …}]}`,
      **always in the order requested**. A bulk response is `200` even when items failed:
      the request itself succeeded. The top-level `success` is the AND of the items.

    Errors carry `responseDetail: {title, status, detail}`.

    ### Availability, and what a restart costs you

    **One replica, and subscriptions do not survive a restart.** This is a declared characteristic
    of the service rather than a defect, and a client integrating against it has to build for it.

    | | Commitment |
    | :--- | :--- |
    | Replicas | Exactly one, always. The service holds a plain `spBv1.0/#` broker subscription and its subscription state is in process memory; a second instance would answer `/subscriptions/sync` for ids it has never seen |
    | Reachability during a restart | None — the old instance stops before the new one starts, so the endpoint is absent rather than degraded |
    | Subscriptions across a restart | None. Queues, sequence numbers and open streams are lost |
    | Current values just after a restart | Filled on the first read: what the value cache lacks for a device is read from `telemetry_latest`, with each sample's stored time. Only a metric the historian does not hold is `GoodNoData` until it next changes |
    | Metadata and history | Unaffected — neither is held by this service |

    `/subscriptions/sync` and `/subscriptions/stream` answer **404** for a subscriptionId this
    instance has never seen, and the correct response is to create a new subscription. **The i3X
    lifecycle already requires that path**, because `I3X_SUBSCRIPTION_TTL_SECONDS` deletes an idle
    subscription anyway — a restart is the same recovery on the same code path.

    What the server commits to is that it will not do anything subtler. There is no partially
    restored queue and no sequence number that resumes from a value you never received: **a lost
    subscription is reported as gone.** A subscription that lied about its continuity would be
    worse than one that admits it is new.

    Expect roughly one restart per platform release, plus cluster-operational events. See
    [`i3x/README.md`](https://github.com/Harri-Llewelyn/Aber/blob/main/i3x/README.md#availability).

    > ⚠️ **"Try it out" will not work from this page.** The i3X server sends no CORS headers
    > and answers `OPTIONS` with `501`, so a browser cannot call it cross-origin from Swagger
    > UI. Use `curl`, the desktop [i3X Explorer](https://github.com/ace-technologies-inc/i3X-Explorer)
    > (its Electron shell disables web security for exactly this reason), or the CESMII MCP
    > server. This document is a reference, not a live console.

  contact:
    name: Aber
    url: https://github.com/Harri-Llewelyn/Aber

servers:
  - url: http://localhost:8090/v1
    description: The i3X server through `npm run dev:forward` — note the /v1 suffix is part of the base URL

security:
  - bearerAuth: []

tags:
  - name: Discovery
    description: What this server is and what vocabularies it speaks.
  - name: Types
    description: ObjectTypes and RelationshipTypes — i3X introduces no new type system, these are the platform's own schemas.
  - name: Objects
    description: The address space — browse by hierarchy and by relationship.
  - name: Values
    description: Current values from the MQTT cache; history from TimescaleDB.
  - name: Subscriptions
    description: Server-accumulated value changes between client polls.

paths:

  # ------------------------------------------------------------- Discovery ----

  /info:
    get:
      tags: [Discovery]
      summary: Server identity and capabilities
      description: |
        **Unauthenticated by specification**, and it doubles as the container health check.
        It reports capabilities and **nothing about the address space**, which is what makes
        being open cost nothing.

        Clients use this to detect the wire format: `specVersion` of `1.0` with no `beta` in
        `serverVersion` means the 1.0 release format.

        `update.current` and `update.history` are `false` — see `PUT /objects/value`.
      security: []
      responses:
        '200':
          description: The server is live.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/ServerInfo' }

  /namespaces:
    get:
      tags: [Discovery]
      summary: Namespaces in use
      description: |
        Exactly the namespaces the served types belong to: the local one, the relationship
        namespace, and each one a metric type takes from its catalog row's semantic id.

        MTConnect and ISO 22400 ids are minted here, so their namespaces are local
        (`https://aber.local/semantics/mtconnect/v2.0`, `https://aber.local/semantics/iso22400`).
        An OPC UA or ASHRAE 223P id is the standard's own, and a scalar type adapted from it is an
        in-exact implementation of that namespace, marked as the i3X guide asks with a
        `projection` suffix: `http://opcfoundation.org/UA/Machinery/?projection=i3X`,
        `http://data.ashrae.org/standard223?projection=i3X`. A namespace no served type
        belongs to is never listed.
      responses:
        '200':
          description: Namespaces this address space draws on.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Namespace' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Types ----

  /objecttypes:
    get:
      tags: [Types]
      summary: Every ObjectType
      description: |
        Rows from `schemas` — **a `schema_definition` already is a JSON Schema**, so there is
        no translation step — plus the synthetic Site, Area, Cell, Lane, Unassigned, Gateway
        and untyped-device types that give the structural objects something to point at.

        The metric types, always served so every metric's `typeElementId` resolves:
        * `i3x:type:metric:<name>` per `metric_catalog` row: a scalar schema from its Sparkplug
          datatype, with `description` and the unit as `x-unit`, and its semantic id as
          `sourceTypeId`;
        * `i3x:type:sparkplug:<datatype>` for a metric the catalog lacks, by its DBIRTH datatype;
        * `UnknownType` (`i3x:type:unknown`), schema `{}`, when no datatype is known.

        And `i3x:type:schemas:<ids sorted, joined by +>` for each distinct set of schemas
        attached to a device: `allOf` over their definitions, inlined.
      parameters:
        - name: namespaceUri
          in: query
          schema: { type: string, format: uri, example: 'https://aber.local/i3x' }
          description: 'Return only the types in this namespace. One this server does not serve gives an empty list, not an error.'
      responses:
        '200':
          description: All object types visible to this caller.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/ObjectType' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objecttypes/query:
    post:
      tags: [Types]
      summary: Fetch specific ObjectTypes
      description: 'An empty or omitted `elementIds` returns everything, as a single-result envelope rather than a bulk one.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                elementIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Results in request order; unknown ids are per-item 404s.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /relationshiptypes:
    get:
      tags: [Types]
      summary: The six relationship types
      description: |
        `HasParent`/`HasChildren`, `HasComponent`/`ComponentOf`, and
        `ConnectsVia`/`ProvidesConnectivityFor` — each registered with its `reverseOf`.

        The pairing that matters: **`parentId` is where the asset is, not the gateway.** A
        device here has two parents — a place (its cell, else its area, else the site) and a
        gateway (how its data arrives). i3X gives an Object one parent, `HasParent` is
        organizational hierarchy, so the place wins and the data path becomes
        `ConnectsVia`/`ProvidesConnectivityFor`. Collapsing them would make a host-run gateway
        unrepresentable.

        Location is `HasParent`/`HasChildren` only: the site, areas, cells and lanes compose
        nothing. `HasComponent`/`ComponentOf` is kept for what a device's value is composed of.
      parameters:
        - name: namespaceUri
          in: query
          schema: { type: string, format: uri, example: 'https://aber.local/i3x/relationships' }
          description: 'Return only the types in this namespace. One this server does not serve gives an empty list, not an error.'
      responses:
        '200':
          description: All relationship types.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/RelationshipType' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /relationshiptypes/query:
    post:
      tags: [Types]
      summary: Fetch specific RelationshipTypes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                elementIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Results in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- Objects ----

  /objects:
    get:
      tags: [Objects]
      summary: Browse the address space
      description: |
        ```
        i3x:site                          synthetic root, named by site.name — the only parentId: null
        ├── <area uuid>                   areas
        │   ├── <cell uuid>               cells filed in that area
        │   │   ├── <gwy…>                gateways in that cell
        │   │   └── <dev…>                devices whose RESOLVED cell is that cell
        │   └── <gwy…> / <dev…>           area-wide gateways and devices
        ├── <cell uuid>                   cells filed in no area, with their gateways and devices
        ├── <gwy…> / <dev…>               site-wide gateways and devices
        ├── i3x:lane:simulated            synthetic — behind a simulated gateway; only while non-empty
        ├── i3x:lane:shadow               synthetic — behind a playback gateway; only while non-empty
        └── i3x:unassigned                synthetic — assets nobody has placed
        ```

        **Unassigned and the lanes are synthetic, and deliberately so.** `parentId: null` means
        root, so an unplaced device would otherwise become a second root. A synthetic object is
        legitimate where a magic `cells` row is not: it has no table behind it, so it cannot
        be edited, deleted, or swept by the pg_cron purge that runs past RLS. Unassigned holds
        only assets nobody has placed; a simulated or replayed asset is in its lane, which
        claims no place.
      parameters:
        - name: root
          in: query
          schema: { type: string, enum: ['true'] }
          description: '`true` returns only objects with `parentId: null` — exactly one, the synthetic site.'
        - name: typeElementId
          in: query
          schema: { type: string }
          description: Return only objects of this ObjectType.
        - name: includeMetadata
          in: query
          schema: { type: string, enum: ['true'] }
          description: '`metadata` is the expensive half of an Object and is omitted unless asked for. Relationships live in it.'
      responses:
        '200':
          description: Matching objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/I3xObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objects/list:
    post:
      tags: [Objects]
      summary: Fetch objects by id, in bulk
      description: 'Results come back **in the order requested** — a client pairing responses positionally would otherwise mis-attribute every item in the batch.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                includeMetadata: { type: boolean, default: false }
      responses:
        '200':
          description: One result per requested id, in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objects/related:
    post:
      tags: [Objects]
      summary: Traverse relationships
      description: |
        Edges out of each requested object as `{sourceRelationship, object}` pairs.

        Bulk over `elementIds` rather than one element per call, because relationship
        traversal is *the* hot operation in a browse client and a round trip per node is what
        makes an exploratory UI feel slow against a remote server.

        Edges to objects the caller cannot see are omitted, not reported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                relationshipType:
                  type: string
                  description: Return only edges of this type.
                  example: HasChildren
                includeMetadata: { type: boolean, default: false }
      responses:
        '200':
          description: Edges per requested object, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Values ----

  /objects/value:
    post:
      tags: [Values]
      summary: Current values
      description: |
        Served from the MQTT value cache, **gated on a PostgREST read as the caller** — see
        the RLS note in the introduction.

        `quality` is derived at read time, never stored, from the device, its gateway and
        whether a value is held: see `Quality`. What the value cache lacks for a device named
        here is read once from `telemetry_latest` as the caller, and a failed read makes what
        is missing `Bad`.

        **A device and its metrics.** A device's value is the map of its metrics' latest
        values. Each metric is also an object, `<sparkplug_id>/<metric name>`, and a component
        of the device, whose value is a bare scalar: its latest sample, or `null` with
        `GoodNoData` (or `Bad`, per `Quality`) when it has none. So `maxDepth: 1` on a device
        returns the map, and `maxDepth: 0` or `2` adds each metric's own value under
        `components`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                maxDepth:
                  type: integer
                  default: 1
                  minimum: 0
                  description: '`1` is the object itself. `0` is unbounded; anything higher descends that many levels of `HasComponent` into `components`. Anything but an integer of 0 or more is a 400.'
      responses:
        '200':
          description: Current value per requested id, in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
              example:
                success: true
                results:
                  - success: true
                    elementId: dev220000000000400080000
                    result:
                      isComposition: true
                      value:
                        Systems/TEMPERATURE: 37.13
                        Controller/EXECUTION: ACTIVE
                      quality: Good
                      timestamp: '2026-08-10T13:06:29.423Z'
                  - success: true
                    elementId: dev220000000000400080000/Systems/TEMPERATURE
                    result:
                      isComposition: false
                      value: 37.13
                      quality: Good
                      timestamp: '2026-08-10T13:06:29.423Z'
        '206':
          description: |
            The components past `I3X_MAX_COMPONENTS` (default 10000), counted over the whole
            request, were left out. Each item cut carries its own `responseDetail` with status
            206 saying how many; the top-level one names every item cut. Request those
            elementIds on their own for the rest.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkEnvelope'
                  - type: object
                    properties:
                      responseDetail: { $ref: '#/components/schemas/ResponseDetail' }
        '400':
          description: '`elementIds` missing or not an array of strings, or `maxDepth` not an integer of 0 or more.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Values]
      summary: Write a current value — refused
      description: |
        **405, deliberately and permanently.** Update is a MAY in i3X 1.0 and `GET /info`
        declares `update.current: false`; this is the durable half of that statement, because
        a capability flag is advice and an unimplemented verb is a fact.

        The MCP server has an `--enable-writes` flag, but that is client-side — a server that
        does not implement the verb cannot be talked into it. Writes belong on the
        Sparkplug/NCMD command path, where they are audited.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /objects/history:
    post:
      tags: [Values]
      summary: Historical values
      description: |
        From the TimescaleDB hypertable through PostgREST, **never** from the value cache, so
        these reads carry the caller's token like every other.

        `startTime` and `endTime` are **required**: an unbounded history query over a
        hypertable is not a slow request, it is an availability incident. Both are RFC 3339
        with an offset, parsed in full, and a start after the end is a 400.

        What comes back depends on the element, newest first in every case:

        * **A metric**, `<sparkplug_id>/<metric_name>` split at the first `/`: its stored
          samples as scalar VQTs.
        * **A device**: one map per instant at which any of its metrics changed, holding every
          metric's newest value at that instant, the shape of its current value. Sparkplug
          reports by exception, so values carry forward from before the window. A metric with
          no value yet is absent from the map rather than invented.
        * **Its components**, at `maxDepth` 0 or above 1: each metric's samples under
          `components`, keyed by elementId and taken from the device's own rows.
        * **Anything else** (the site, a cell, a gateway) has no series of its own and returns
          an empty `values`. Inventing an aggregate would assert a measurement nobody took.

        **Nothing is cut silently.** `I3X_HISTORY_MAX_ROWS` (default 1000) bounds each series:
        the rows it reads and the values it returns, a device's map of N metrics counting N. A
        series that stops short keeps its newest values and answers **206**. Its item's
        `responseDetail` names the instant it stops at, and asking again with that instant as
        `endTime` returns the rest. `I3X_MAX_COMPONENTS` bounds the components, as on
        `/objects/value`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds, startTime, endTime]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                startTime:
                  type: string
                  format: date-time
                  description: 'RFC 3339 with `Z` or an offset. Required, and not after `endTime`.'
                  example: '2026-09-28T10:00:00Z'
                endTime:
                  type: string
                  format: date-time
                  description: RFC 3339 with `Z` or an offset. Required. Inclusive.
                  example: '2026-09-28T11:00:00Z'
                limit:
                  type: integer
                  minimum: 1
                  description: 'Not an i3X parameter. Values per series, at most `I3X_HISTORY_MAX_ROWS`: a larger value is served as that, and omitting it asks for that.'
                maxDepth:
                  type: integer
                  default: 1
                  minimum: 0
                  description: '`1` is the element alone. `0` or above 1 adds a device''s metrics under `components`.'
      responses:
        '200':
          description: One `HistoryResult` per requested id, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
              example:
                success: true
                results:
                  - success: true
                    elementId: dev220000000000400080000
                    result:
                      isComposition: true
                      values:
                        - value: { Controller/EXECUTION: ACTIVE, Systems/TEMPERATURE: 37.4 }
                          quality: Good
                          timestamp: '2026-09-28T10:20:00Z'
                        - value: { Controller/EXECUTION: READY, Systems/TEMPERATURE: 37.4 }
                          quality: Good
                          timestamp: '2026-09-28T10:10:00Z'
                  - success: true
                    elementId: dev220000000000400080000/Systems/TEMPERATURE
                    result:
                      isComposition: false
                      values:
                        - { value: 37.4, quality: Good, timestamp: '2026-09-28T10:10:00Z' }
        '206':
          description: |
            A server limit cut at least one series or components list short. Each item cut is
            still `success: true` and carries its own `responseDetail` with status 206 saying
            where it stops; the top-level one names every item cut.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkEnvelope'
                  - type: object
                    properties:
                      responseDetail: { $ref: '#/components/schemas/ResponseDetail' }
              example:
                success: true
                results:
                  - success: true
                    elementId: dev220000000000400080000/Systems/TEMPERATURE
                    result:
                      isComposition: false
                      values:
                        - { value: 37.6, quality: Good, timestamp: '2026-09-28T10:50:00Z' }
                        - { value: 37.5, quality: Good, timestamp: '2026-09-28T10:40:00Z' }
                    responseDetail:
                      title: Partial results returned
                      status: 206
                      detail: "This series stops at this request's limit of 2 rows: nothing at or before 2026-09-28T10:30:00.000000Z was returned. Request it again with that endTime for the rest."
                responseDetail:
                  title: Partial results returned
                  status: 206
                  detail: "A server limit cut 1 result(s) short: dev220000000000400080000/Systems/TEMPERATURE. Each one's responseDetail says where."
        '400':
          description: '`elementIds` missing or not an array of strings, `startTime`/`endTime` absent, not RFC 3339 or the start after the end, `limit` not a positive integer, or `maxDepth` not an integer of 0 or more.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Values]
      summary: Write history — refused
      description: '**405.** See `PUT /objects/value`.'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # --------------------------------------------------------- Subscriptions ----

  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: |
        Subscriptions are why this is a long-lived service rather than a stateless adapter:
        i3X requires the server to accumulate value changes between client polls, and those
        values **cannot come from Supabase Realtime** — `telemetry` is a `postgres_fdw`
        foreign table whose rows enter TimescaleDB's WAL and never Supabase's, so adding it
        to the publication does not error, it silently emits nothing.

        **State is in memory**, which is why the workload is pinned to one replica. A restart
        drops every subscription; clients get 404 and must re-create, which the spec's
        lifecycle already requires them to handle.

        Abandoned subscriptions are deleted after `I3X_SUBSCRIPTION_TTL_SECONDS` (default
        300) — a spec MUST, or a client that walks away holds a queue open forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                displayName: { type: string }
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 'The caller''s principal holds `I3X_MAX_SUBSCRIPTIONS_PER_PRINCIPAL` subscriptions (default 20), or the server holds `I3X_MAX_SUBSCRIPTIONS` (default 500). `responseDetail.detail` names which.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /subscriptions/list:
    post:
      tags: [Subscriptions]
      summary: List your subscriptions
      description: 'Scoped to `clientId` and your token''s principal: an id that is not yours is a per-item 404, exactly as one that does not exist. Only the ids you name are listed. `monitoredObjects` is the set as of the last check of your view, made by each `/sync` and stream tick, each `{elementId, maxDepth}` with the depth of its first registration.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                subscriptionIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 'One result per id, at its position in the request. An id that is not a string fails its own item with a 400; one that is not yours, or does not exist, with a 404.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400':
          description: '`subscriptionIds` present but not an array.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/delete:
    post:
      tags: [Subscriptions]
      summary: Delete subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionIds]
              properties:
                clientId: { type: string }
                subscriptionIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 'One result per id, at its position in the request. An id that is not a string fails its own item with a 400; one that is unknown or not yours, including one deleted earlier in the same request, with a 404.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400':
          description: '`subscriptionIds` present but not an array.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/register:
    post:
      tags: [Subscriptions]
      summary: Add objects to a subscription
      description: |
        Registration is **validated against the caller's own address space**, per item, not
        accepted blindly. An unknown elementId that registered "successfully" would produce a
        subscription that can never emit anything, and the client has no way to tell that from
        a machine that is simply quiet — it waits forever for a value that cannot arrive.

        Validating here also means the monitored set can only contain ids this caller may see,
        so a subscription cannot become a way around RLS on the value path. Each delivery checks
        again: see `/subscriptions/sync`.

        **`maxDepth` applies to every elementId in the call.** What each registration then
        receives:

        | Registered | Receives updates for |
        | :--- | :--- |
        | A device at `maxDepth: 1` | The device: its map of metrics |
        | A device at `maxDepth: 0`, or 2 or more | The device, and each of its metrics as `<device>/<metric>`, in one batch when both change |
        | A metric, `<device>/<metric>` | That metric only |
        | A gateway | That gateway only (its birth, its death, and a heartbeat that changes its live status), not its devices |
        | The site, an area, a cell, a lane or Unassigned | Nothing: their values change only with the Directory, which is not staged |

        **Registering an object again succeeds and changes nothing**, as the guide requires, so
        its first `maxDepth` stands. Unregister it first to change the depth.

        **Each device registered, or whose metric is, has what the server lacks for it filled
        from the historian**, as `/objects/value` fills it, so the first map staged for it is
        complete. A fill that fails does not fail the registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                elementIds:
                  type: array
                  description: 'Objects to monitor. `objects` is accepted in its place.'
                  items: { type: string }
                objects:
                  type: array
                  description: 'An alias of `elementIds`, taking bare id strings or `{elementId}` objects. Only `elementId` is read from an object.'
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          elementId: { type: string }
                maxDepth:
                  type: integer
                  minimum: 0
                  default: 1
                  description: '`1` is the object alone, `0` is unbounded, N descends N-1 levels of `HasComponent`, as on `/objects/value`. For every elementId in the call; register separately to use different depths.'
      responses:
        '200':
          description: 'One result per entry, at its position in the request, so a repeated elementId has a result at each place. An elementId that is not a non-empty string fails its own item with a 400, and one not in your address space with a 404.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400':
          description: '`maxDepth` not an integer of 0 or more, `elementIds` (or `objects`) not an array, more entries than the server accepts, or a `subscriptionId` that is not a string.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

  /subscriptions/unregister:
    post:
      tags: [Subscriptions]
      summary: Remove objects from a subscription
      description: |
        Removing something that was never registered is **not** an error — the end state you
        asked for is the end state you get. An elementId that does not exist at all *is*,
        because it means the client is working from a stale view of the address space and
        silence would let it keep doing so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                elementIds:
                  type: array
                  description: 'Objects to stop monitoring. `objects` is accepted in its place.'
                  items: { type: string }
                objects:
                  type: array
                  description: 'An alias of `elementIds`, taking bare id strings or `{elementId}` objects.'
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          elementId: { type: string }
      responses:
        '200':
          description: 'One result per entry, at its position in the request. An elementId that is not a non-empty string fails its own item with a 400, and one not in your address space with a 404.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400':
          description: '`elementIds` (or `objects`) not an array, more entries than the server accepts, or a `subscriptionId` that is not a string.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

  /subscriptions/sync:
    post:
      tags: [Subscriptions]
      summary: Drain accumulated updates
      description: |
        The polling half of subscriptions, and a spec MUST. Three acknowledgement rules that
        each fail quietly if got wrong:

        1. **Omitted or invalid `lastSequenceNumber` must not clear the queue.** Treating
           "omitted" as "acknowledge all" is the obvious implementation and it loses exactly
           the updates a client crashed before processing.
        2. A valid value clears everything **at or below** it.
        3. `-1` clears everything.

        **Overflow is reported, not hidden.** Past `I3X_SUBSCRIPTION_QUEUE_LIMIT` (default
        500) the oldest batches drop and the next sync answers **206**. Compute the gap
        from `lastSequenceNumber + 1` to `result[0].sequenceNumber - 1`.

        **What it delivers is checked against your view first.** Each call reads your address
        space as you (cached per token for `I3X_ADDRESS_SPACE_TTL_SECONDS`). A registered element
        you can no longer see, or a metric `<device>/<metric>` whose device you can no longer see,
        is removed from the subscription and its queued updates are discarded, not delivered. The
        call then answers **206**, with or without batches, and `responseDetail` names what was
        removed, so "left your view" is not mistaken for "nothing changed". A batch left empty is
        dropped, so its sequence number is a gap. If that read fails, the call answers `502` and
        acknowledges and delivers nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                lastSequenceNumber:
                  type: integer
                  description: 'Acknowledge up to and including this. `-1` acknowledges everything. **Omit to acknowledge nothing.**'
      responses:
        '200':
          description: Accumulated batches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/UpdateBatch' }
        '206':
          description: 'Delivered, but batches were dropped from the queue, or registered elements left your view and were removed with their queued updates, or both. `responseDetail` says which and names the removed elements. Reported once.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400':
          description: 'A `subscriptionId` that is not a string.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }
        '409':
          description: 'This subscription has an open stream. Close it before calling `/sync`: the stream has already delivered, and discarded, the queue a sync would acknowledge.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: 'Your address space could not be read to check what may be delivered. Nothing was acknowledged or delivered; retry.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /subscriptions/stream:
    post:
      tags: [Subscriptions]
      summary: Server-sent event stream
      description: |
        The push half, and a MAY — `GET /info` declares `subscribe.stream: true`. Responds
        `text/event-stream`, chunked, starting with any backlog already queued.

        **One stream per subscription.** There is no fan-out in i3X: a second consumer creates
        its own subscription. Opening a second stream closes the first *cleanly* — a
        terminating zero-length chunk — because the spec says the displaced client sees a
        close with no error.

        **An abandoned stream is noticed at once, not at the next keepalive.** The wait loop
        `select`s on the connection rather than sleeping, so a client that hangs up frees the
        thread and socket immediately. Sleeping blind looks harmless and is not: HTTP/1.1
        keep-alive *serialises* a connection, so a pooling client that abandons a stream and
        immediately issues another request has that request queued behind the corpse of the
        first — which presents as a hung server on an endpoint that was never reached.

        **A client that stops reading loses its stream after 10 seconds.** A write that cannot
        finish in that time ends the stream, and the connection with it; nothing else waits on it.

        **What it carries is checked against your view**, as `/sync` checks it: at open, before
        the backlog is sent, and on each 15-second keepalive tick, together with your token. An
        element you can no longer see stops arriving, and its queued updates are discarded. A
        stream whose last element left ends cleanly, and so does one whose check fails on a tick;
        a check that fails at open answers `502` and leaves the queue in place. The stream cannot
        say why, so the next `/sync` answers 206 naming what was removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
      responses:
        '200':
          description: An open SSE stream; each event is one `UpdateBatch`'s `updates` array.
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: 'A `subscriptionId` that is not a string.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }
        '429':
          description: 'The server has `I3X_MAX_STREAMS` streams open (default 50). Replacing this subscription''s own stream is not refused. Poll `/subscriptions/sync` instead.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: 'Your address space could not be read to check what may be streamed. No stream was opened and the queue is untouched; retry.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The **user's** access token from `POST /auth/v1/token?grant_type=password` on the
        Platform API, or a service principal's minted token. Not the anon key. This server holds
        no service-role key and refuses to start if one is in its environment.

  responses:
    Unauthorized:
      description: |
        No `Authorization` header, or a token PostgREST refused: not a token, the anon key,
        expired, or revoked. Checked before every request except `GET /info`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Malformed body — typically a missing or non-array `elementIds`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SubscriptionNotFound:
      description: 'No such subscription for this `clientId` and this token''s principal, or no `subscriptionId` given — including after a restart, since subscription state is in memory.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MethodNotAllowed:
      description: 'This server is read-only. Carries `Allow: POST`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    Envelope:
      type: object
      description: The single-result envelope.
      properties:
        success: { type: boolean }
        result: {}
        responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    BulkEnvelope:
      type: object
      description: |
        The bulk envelope. **`200` even when items failed** — the request succeeded; the items
        are what did or did not. `results` is always in the order requested.
      properties:
        success:
          type: boolean
          description: The AND of every item's `success`.
        results:
          type: array
          items:
            type: object
            properties:
              success: { type: boolean }
              elementId: { type: string }
              result: {}
              responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    ResponseDetail:
      type: object
      properties:
        title: { type: string, example: Unauthorized }
        status: { type: integer, example: 401 }
        detail: { type: string, example: The supplied credentials were rejected by the data layer. }

    ServerInfo:
      type: object
      properties:
        specVersion: { type: string, example: '1.0' }
        serverVersion: { type: string, example: 0.1.0, description: "The Helm chart's `appVersion`; `dev` when started without the chart." }
        serverName: { type: string, example: aber-i3x }
        capabilities:
          type: object
          properties:
            query:
              type: object
              properties:
                history: { type: boolean, example: true }
            update:
              type: object
              description: Both false. Not a limitation to be lifted — see `PUT /objects/value`.
              properties:
                current: { type: boolean, example: false }
                history: { type: boolean, example: false }
            subscribe:
              type: object
              properties:
                stream: { type: boolean, example: true }

    Namespace:
      type: object
      properties:
        uri: { type: string, format: uri, example: 'https://aber.local/i3x' }
        displayName: { type: string, example: Aber Local }

    ObjectType:
      type: object
      properties:
        elementId: { type: string, example: i3x:type:cell }
        displayName: { type: string, example: Cell }
        namespaceUri: { type: string, format: uri }
        sourceTypeId:
          type: string
          description: |
            The platform's own `semantic_id` (a schema's, or a catalog metric's), else its name;
            a synthetic type's or Sparkplug datatype's name; or, for a set of schemas, the type's
            own id, since no source namespace defines the combination.
        version: { type: string, example: 1.0.0 }
        schema:
          type: object
          description: |
            `schemas.schema_definition` verbatim — it already is a JSON Schema, so nothing is
            translated. A metric type's is a scalar such as `{"type": "number", "x-unit":
            "CELSIUS"}`; `UnknownType`'s is `{}`; a set of schemas' is `{"type": "object",
            "allOf": [...]}` over their definitions.
        related:
          type: object
          description: 'Only on a type synthesized for a set of schemas: `{relationshipType: InheritsFrom, types: [<schema ids>]}`, the schemas it is a kind of.'

    RelationshipType:
      type: object
      properties:
        elementId: { type: string, example: HasParent }
        displayName: { type: string }
        namespaceUri: { type: string, format: uri }
        relationshipId: { type: string }
        reverseOf: { type: string, example: HasChildren }
        metadata:
          type: object
          properties:
            description: { type: string }

    I3xObject:
      type: object
      properties:
        elementId:
          type: string
          description: |
            The platform's `sparkplug_id` — immutable and on the wire. i3X requires an
            elementId that is unique *and persistent*, which `name` is not: it is a freely
            editable display label. A metric's is `<sparkplug_id>/<metric name>`; a
            `sparkplug_id` never contains `/`, so the first `/` splits it.
          example: dev220000000000400080000
        displayName: { type: string, example: Sim_CNC_Mill_01 }
        typeElementId: { type: string }
        parentId:
          type: string
          nullable: true
          description: 'Where the object is — its cell, area or lane, else the site — never its gateway. `null` only on `i3x:site`.'
        isComposition: { type: boolean }
        isExtended:
          type: boolean
          description: |
            Whether the object publishes beyond its type. Derived from `last_birth_metrics`,
            so it reflects the most recent DBIRTH — a device that has never birthed reports
            `false` rather than unknown — judged against every schema attached to the device.
            `metadata.schemaExtensions` names what is beyond them.
        metadata:
          $ref: '#/components/schemas/ObjectMetadata'

    ObjectMetadata:
      type: object
      description: 'Returned only when `includeMetadata` is set — it is the expensive half of an Object.'
      properties:
        description: { type: string, nullable: true }
        typeNamespaceUri: { type: string, format: uri }
        sourceTypeId:
          type: string
          description: "The same as its ObjectType's: a schema's `semantic_id`, else its name; the synthesized type's id for a device with several schemas; `Device` for a device with none. A metric's is its catalog row's `semantic_id`, else its name, or its Sparkplug datatype's name or `UnknownType` when the catalog lacks it."
        schemaExtensions:
          type: object
          description: 'Only when `isExtended` is true: each metric the device declared beyond its schemas, with a JSON Schema fragment from its DBIRTH datatype, or `{}` when none is known.'
          additionalProperties: { type: object }
          example:
            Environmental/HUMIDITY_RELATIVE: { type: number }
        system:
          type: object
          description: 'Vendor keys, on a device. i3X requires it whenever `isExtended` is true; a device always sends it.'
          properties:
            quarantined:
              type: boolean
              description: 'Present in the directory but its telemetry is being dropped. Makes a held value `Uncertain` and no value `Bad`.'
        relationships:
          type: object
          description: |
            Edge lists keyed by relationship type. `HasParent`/`HasChildren` is the location
            tree and is never descended by a value query; `HasComponent` is composition, what
            `maxDepth > 1` descends, and no location object carries it.
          additionalProperties:
            type: array
            items: { type: string }
          example:
            HasParent: [i3x:unassigned]
            ConnectsVia: [gwy120000000000400080000]

    ValueResult:
      type: object
      properties:
        isComposition: { type: boolean }
        value:
          description: |
            For a device, an object of metric name to latest value, `null` when quality is
            `GoodNoData` or `Bad`. Every other object sends exactly what its ObjectType declares: the site
            `{cellCount, deviceCount}`, an area `{cellCount, deviceCount, description}`, a cell,
            lane or Unassigned `{deviceCount, description}`, a gateway `{status, sparkplugGroup,
            lastHeartbeat}`, or `null` with `GoodNoData` when it has no stored status. Counts are
            of devices or cells, never of children.
            A metric sends its latest value, a bare scalar.
        quality: { $ref: '#/components/schemas/Quality' }
        timestamp: { type: string, format: date-time }
        components:
          type: object
          description: 'Present only when `maxDepth` is 0 or above 1. Keyed by elementId.'
          additionalProperties: { $ref: '#/components/schemas/ValueResult' }

    HistoryResult:
      type: object
      properties:
        isComposition: { type: boolean }
        values:
          type: array
          description: |
            Newest first, all inside the window. A metric's are scalars; a device's are maps of
            metric name to value, one per instant a metric changed. Empty for anything else.
          items:
            type: object
            properties:
              value: {}
              quality: { $ref: '#/components/schemas/Quality' }
              timestamp: { type: string, format: date-time }
        components:
          type: object
          description: 'Present only when `maxDepth` is 0 or above 1. Keyed by elementId, each with its own `values`.'
          additionalProperties: { $ref: '#/components/schemas/HistoryResult' }

    Quality:
      type: string
      enum: [Good, GoodNoData, Uncertain, Bad]
      description: |
        Derived at read time, never stored, by one rule for values, subscription updates and
        history, following the i3X guide's quality table:

        | Condition | With a held value | Without one |
        | :--- | :--- | :--- |
        | Device quarantined | `Uncertain` | `Bad` |
        | Device OFFLINE, or its gateway OFFLINE or STALE | `Uncertain` | `Bad` |
        | Device online, never published | n/a | `GoodNoData` |
        | Otherwise | `Good` | n/a |

        A device's map takes the worst quality among the metrics it holds. A gateway's own
        value is its live status (STALE after 90 s without a heartbeat), and is `Good`
        whenever that is known: it is the devices behind it whose values are stale. A stored
        history sample is `Good`. `timestamp` is never null: the sample's, else the
        device's last birth or death, else the time of the read.

    Subscription:
      type: object
      properties:
        clientId: { type: string }
        subscriptionId: { type: string }
        displayName: { type: string }

    UpdateBatch:
      type: object
      description: One batch of accumulated changes. Each SSE event carries one batch's `updates` array.
      properties:
        sequenceNumber:
          type: integer
          description: 'Increasing per subscription and never reused. A gap is updates that were dropped, by overflow or because their element left your view; the 206 that reports it says which.'
        updates:
          type: array
          description: 'Each update names its own object: a registered one, or `<device>/<metric>` for a device registered at `maxDepth` 0 or 2 or more.'
          items:
            type: object
            properties:
              elementId: { type: string }
              value: {}
              quality: { $ref: '#/components/schemas/Quality' }
              timestamp: { type: string, format: date-time }
