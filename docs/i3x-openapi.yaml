openapi: 3.0.3

info:
  title: Aber i3X 1.0 Server
  version: "0.1.0"
  description: |
    A conformant [i3X](https://github.com/cesmii/i3X) (CESMII Industrial Information
    Interoperability eXchange) read-side view of this platform's asset model — **52 passed,
    0 failed** against CESMII's official 60-test conformance suite.

    ### This is a different service from the Platform API

    It is **not behind the gateway**. It listens on its own port, takes no `apikey`
    header, and speaks the i3X wire format rather than PostgREST's. That is why it has its
    own document instead of a section in `openapi.yaml` — one `servers:` block cannot
    describe two origins, and `/v1/schema` already means something else on the gateway.

    | | Platform API (`openapi.yaml`) | i3X (this document) |
    | :--- | :--- | :--- |
    | Origin | the gateway, `:54321` | i3X service, `:8090` |
    | Headers | `apikey` **and** `Authorization` | `Authorization` only |
    | Shape | one path per table/view | one address space, browsed by relationship |

    ### The `/v1` prefix is part of the base URL

    Every path below is served under `/v1`, and the server returns **404 for anything
    outside it** — including `/info`. Clients that take a base URL (i3X Explorer, the
    CESMII MCP server) must be given `http://localhost:8090/v1`, not `http://localhost:8090`.
    A client pointed at the bare host fails its version probe and silently falls back to
    treating the server as pre-1.0.

    ### Authentication

    `Authorization: Bearer <access_token>` — the **user's own** access token from
    `POST /auth/v1/token?grant_type=password` on the Platform API.

    > ⚠️ **The anon key is not a substitute.** This service holds no service-role key and
    > refuses to start if one is in its environment. It replays your token to PostgREST for
    > every metadata read, so RLS decides what the address space contains. The anon key
    > authenticates but is rejected by the data layer with
    > `401 The supplied credentials were rejected by the data layer`.

    > ℹ️ **Tokens expire after an hour.** A client that persists its connection settings —
    > Explorer does — will start returning 401 on a profile that worked earlier. Paste a
    > fresh token.

    ### Row Level Security, including on values

    Metadata is safe because PostgREST enforces policy. The **MQTT value cache has no RLS**,
    so a value request is answered in two steps: resolve the requested elementIds through
    PostgREST *as the caller* first, then serve only the ids that came back. An element you
    cannot see reports as `404 Not Found`, indistinguishable from one that does not exist.

    ### Response envelopes

    Two shapes, and which one you get depends on the operation, not the outcome:

    * **Single** — `{"success": true, "result": …}`
    * **Bulk** — `{"success": …, "results": [{"success": …, "elementId": …, "result": …}]}`,
      **always in the order requested**. A bulk response is `200` even when items failed:
      the request itself succeeded. The top-level `success` is the AND of the items.

    Errors carry `responseDetail: {title, status, detail}`.

    ### Availability, and what a restart costs you

    **One replica, and subscriptions do not survive a restart.** This is a declared characteristic
    of the service rather than a defect, and a client integrating against it has to build for it.

    | | Commitment |
    | :--- | :--- |
    | Replicas | Exactly one, always. The service holds a plain `spBv1.0/#` broker subscription and its subscription state is in process memory; a second instance would answer `/subscriptions/sync` for ids it has never seen |
    | Reachability during a restart | None — the old instance stops before the new one starts, so the endpoint is absent rather than degraded |
    | Subscriptions across a restart | None. Queues, sequence numbers and open streams are lost |
    | Current values just after a restart | Cold and **reported as cold**: `quality: "GoodNoData"` with a null value, until that device next publishes |
    | Metadata and history | Unaffected — neither is held by this service |

    `/subscriptions/sync` and `/subscriptions/stream` answer **404** for a subscriptionId this
    instance has never seen, and the correct response is to create a new subscription. **The i3X
    lifecycle already requires that path**, because `I3X_SUBSCRIPTION_TTL_SECONDS` deletes an idle
    subscription anyway — a restart is the same recovery on the same code path.

    What the server commits to is that it will not do anything subtler. There is no partially
    restored queue and no sequence number that resumes from a value you never received: **a lost
    subscription is reported as gone.** A subscription that lied about its continuity would be
    worse than one that admits it is new.

    Expect roughly one restart per platform release, plus cluster-operational events. See
    [`i3x/README.md`](https://github.com/Harri-Llewelyn/Aber/blob/main/i3x/README.md#availability).

    > ⚠️ **"Try it out" will not work from this page.** The i3X server sends no CORS headers
    > and answers `OPTIONS` with `501`, so a browser cannot call it cross-origin from Swagger
    > UI. Use `curl`, the desktop [i3X Explorer](https://github.com/ace-technologies-inc/i3X-Explorer)
    > (its Electron shell disables web security for exactly this reason), or the CESMII MCP
    > server. This document is a reference, not a live console.

  contact:
    name: Aber
    url: https://github.com/Harri-Llewelyn/Aber

servers:
  - url: http://localhost:8090/v1
    description: The i3X server through `npm run dev:forward` — note the /v1 suffix is part of the base URL

security:
  - bearerAuth: []

tags:
  - name: Discovery
    description: What this server is and what vocabularies it speaks.
  - name: Types
    description: ObjectTypes and RelationshipTypes — i3X introduces no new type system, these are the platform's own schemas.
  - name: Objects
    description: The address space — browse by hierarchy and by relationship.
  - name: Values
    description: Current values from the MQTT cache; history from TimescaleDB.
  - name: Subscriptions
    description: Server-accumulated value changes between client polls.

paths:

  # ------------------------------------------------------------- Discovery ----

  /info:
    get:
      tags: [Discovery]
      summary: Server identity and capabilities
      description: |
        **Unauthenticated by specification**, and it doubles as the container health check.
        It reports capabilities and **nothing about the address space**, which is what makes
        being open cost nothing.

        Clients use this to detect the wire format: `specVersion` of `1.0` with no `beta` in
        `serverVersion` means the 1.0 release format.

        `update.current` and `update.history` are `false` — see `PUT /objects/value`.
      security: []
      responses:
        '200':
          description: The server is live.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/ServerInfo' }

  /namespaces:
    get:
      tags: [Discovery]
      summary: Namespaces in use
      description: |
        The local namespace, which every ObjectType belongs to, and the relationship namespace.
        **No vocabulary is listed:** a schema is a type written here even when its metrics come
        from MTConnect or OPC UA, and a namespace no type belongs to would promise a client
        types it never meets.
      responses:
        '200':
          description: Namespaces this address space draws on.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Namespace' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Types ----

  /objecttypes:
    get:
      tags: [Types]
      summary: Every ObjectType
      description: |
        Rows from `schemas` — **a `schema_definition` already is a JSON Schema**, so there is
        no translation step — plus the synthetic Site, Cell, Gateway and untyped-device types
        that give the structural objects something to point at.
      parameters:
        - name: namespaceUri
          in: query
          schema: { type: string, format: uri, example: 'https://aber.local/i3x' }
          description: 'Return only the types in this namespace. One this server does not serve gives an empty list, not an error.'
      responses:
        '200':
          description: All object types visible to this caller.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/ObjectType' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objecttypes/query:
    post:
      tags: [Types]
      summary: Fetch specific ObjectTypes
      description: 'An empty or omitted `elementIds` returns everything, as a single-result envelope rather than a bulk one.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                elementIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Results in request order; unknown ids are per-item 404s.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /relationshiptypes:
    get:
      tags: [Types]
      summary: The six relationship types
      description: |
        `HasParent`/`HasChildren`, `HasComponent`/`ComponentOf`, and
        `ConnectsVia`/`ProvidesConnectivityFor` — each registered with its `reverseOf`.

        The pairing that matters: **`parentId` is the cell, not the gateway.** A device here
        has two parents — a cell (where it is) and a gateway (how its data arrives). i3X
        gives an Object one parent, `HasParent` is organizational hierarchy, so the cell wins
        and the data path becomes `ConnectsVia`/`ProvidesConnectivityFor`. Collapsing them
        would make a host-run gateway unrepresentable.
      parameters:
        - name: namespaceUri
          in: query
          schema: { type: string, format: uri, example: 'https://aber.local/i3x/relationships' }
          description: 'Return only the types in this namespace. One this server does not serve gives an empty list, not an error.'
      responses:
        '200':
          description: All relationship types.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/RelationshipType' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /relationshiptypes/query:
    post:
      tags: [Types]
      summary: Fetch specific RelationshipTypes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                elementIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Results in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- Objects ----

  /objects:
    get:
      tags: [Objects]
      summary: Browse the address space
      description: |
        ```
        i3x:site                          synthetic root — the only parentId: null
        ├── <cell uuid>                   cells
        │   ├── <gwy…>                    gateways in that cell
        │   └── <dev…>                    devices whose RESOLVED cell is that cell
        ├── i3x:unassigned                synthetic — assets with no resolved cell
        └── <gwy…>                        site-wide gateways
        ```

        **Unassigned is synthetic, and deliberately so.** `parentId: null` means root, so a
        device with no cell would otherwise become a second root. A synthetic object is
        legitimate where a magic `cells` row is not: it has no table behind it, so it cannot
        be edited, deleted, or swept by the pg_cron purge that runs past RLS.
      parameters:
        - name: root
          in: query
          schema: { type: string, enum: ['true'] }
          description: '`true` returns only objects with `parentId: null` — exactly one, the synthetic site.'
        - name: typeElementId
          in: query
          schema: { type: string }
          description: Return only objects of this ObjectType.
        - name: includeMetadata
          in: query
          schema: { type: string, enum: ['true'] }
          description: '`metadata` is the expensive half of an Object and is omitted unless asked for. Relationships live in it.'
      responses:
        '200':
          description: Matching objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/I3xObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objects/list:
    post:
      tags: [Objects]
      summary: Fetch objects by id, in bulk
      description: 'Results come back **in the order requested** — a client pairing responses positionally would otherwise mis-attribute every item in the batch.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                includeMetadata: { type: boolean, default: false }
      responses:
        '200':
          description: One result per requested id, in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objects/related:
    post:
      tags: [Objects]
      summary: Traverse relationships
      description: |
        Edges out of each requested object as `{sourceRelationship, object}` pairs.

        Bulk over `elementIds` rather than one element per call, because relationship
        traversal is *the* hot operation in a browse client and a round trip per node is what
        makes an exploratory UI feel slow against a remote server.

        Edges to objects the caller cannot see are omitted, not reported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                relationshipType:
                  type: string
                  description: Return only edges of this type.
                  example: HasChildren
                includeMetadata: { type: boolean, default: false }
      responses:
        '200':
          description: Edges per requested object, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Values ----

  /objects/value:
    post:
      tags: [Values]
      summary: Current values
      description: |
        Served from the MQTT value cache, **gated on a PostgREST read as the caller** — see
        the RLS note in the introduction.

        `quality` is derived at read time, never stored: a quarantined device or stale
        gateway is `Uncertain`; a metric that has never been published is `GoodNoData` with
        no value; anything else is `Good`. A `quality` column on the hypertable would be a
        stored verdict that goes stale the moment the gateway does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                maxDepth:
                  type: integer
                  default: 1
                  description: '`1` is the object itself. `0` is unbounded; anything higher descends that many levels of `HasComponent` into `components`.'
      responses:
        '200':
          description: Current value per requested id, in order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
              example:
                success: true
                results:
                  - success: true
                    elementId: dev220000000000400080000
                    result:
                      isComposition: false
                      value:
                        Systems/TEMPERATURE: 37.13
                        Controller/EXECUTION: ACTIVE
                      quality: Good
                      timestamp: '2026-08-10T13:06:29.423Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Values]
      summary: Write a current value — refused
      description: |
        **405, deliberately and permanently.** Update is a MAY in i3X 1.0 and `GET /info`
        declares `update.current: false`; this is the durable half of that statement, because
        a capability flag is advice and an unimplemented verb is a fact.

        The MCP server has an `--enable-writes` flag, but that is client-side — a server that
        does not implement the verb cannot be talked into it. Writes belong on the
        Sparkplug/NCMD command path, where they are audited.
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /objects/history:
    post:
      tags: [Values]
      summary: Historical values
      description: |
        From the TimescaleDB hypertable through PostgREST, **never** from the value cache, so
        this read carries the caller's token like every other.

        `startTime` and `endTime` are **required**: an unbounded history query over a
        hypertable is not a slow request, it is an availability incident.

        Only devices carry telemetry. A cell has no series of its own and returns an empty
        `values` — inventing an aggregate would assert a measurement nobody took.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elementIds, startTime, endTime]
              properties:
                elementIds:
                  type: array
                  items: { type: string }
                startTime: { type: string, format: date-time, description: RFC 3339. Required. }
                endTime: { type: string, format: date-time, description: RFC 3339. Required. }
                limit: { type: integer, default: 1000, maximum: 10000 }
                maxDepth: { type: integer, default: 1 }
      responses:
        '200':
          description: Samples per requested id, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '400':
          description: '`elementIds` missing, or `startTime`/`endTime` absent or not RFC 3339.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Values]
      summary: Write history — refused
      description: '**405.** See `PUT /objects/value`.'
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # --------------------------------------------------------- Subscriptions ----

  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: |
        Subscriptions are why this is a long-lived service rather than a stateless adapter:
        i3X requires the server to accumulate value changes between client polls, and those
        values **cannot come from Supabase Realtime** — `telemetry` is a `postgres_fdw`
        foreign table whose rows enter TimescaleDB's WAL and never Supabase's, so adding it
        to the publication does not error, it silently emits nothing.

        **State is in memory**, which is why the workload is pinned to one replica. A restart
        drops every subscription; clients get 404 and must re-create, which the spec's
        lifecycle already requires them to handle.

        Abandoned subscriptions are deleted after `I3X_SUBSCRIPTION_TTL_SECONDS` (default
        300) — a spec MUST, or a client that walks away holds a queue open forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                displayName: { type: string }
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/list:
    post:
      tags: [Subscriptions]
      summary: List your subscriptions
      description: 'Scoped to `clientId` — you cannot enumerate another client''s subscriptions. An empty `subscriptionIds` lists all of yours.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                subscriptionIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Subscriptions owned by this client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/delete:
    post:
      tags: [Subscriptions]
      summary: Delete subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionIds]
              properties:
                clientId: { type: string }
                subscriptionIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: One result per id; unknown or unowned ids are per-item failures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/register:
    post:
      tags: [Subscriptions]
      summary: Add objects to a subscription
      description: |
        Registration is **validated against the caller's own address space**, per item, not
        accepted blindly. An unknown elementId that registered "successfully" would produce a
        subscription that can never emit anything, and the client has no way to tell that from
        a machine that is simply quiet — it waits forever for a value that cannot arrive.

        Validating here also means the monitored set can only contain ids this caller may see,
        so a subscription cannot become a way around RLS on the value path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                objects:
                  type: array
                  description: 'Objects to monitor. Accepts bare id strings or `{elementId}` objects; `elementIds` is accepted as an alias.'
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          elementId: { type: string }
      responses:
        '200':
          description: One result per entry, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

  /subscriptions/unregister:
    post:
      tags: [Subscriptions]
      summary: Remove objects from a subscription
      description: |
        Removing something that was never registered is **not** an error — the end state you
        asked for is the end state you get. An elementId that does not exist at all *is*,
        because it means the client is working from a stale view of the address space and
        silence would let it keep doing so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                objects:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          elementId: { type: string }
      responses:
        '200':
          description: One result per entry, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

  /subscriptions/sync:
    post:
      tags: [Subscriptions]
      summary: Drain accumulated updates
      description: |
        The polling half of subscriptions, and a spec MUST. Three acknowledgement rules that
        each fail quietly if got wrong:

        1. **Omitted or invalid `lastSequenceNumber` must not clear the queue.** Treating
           "omitted" as "acknowledge all" is the obvious implementation and it loses exactly
           the updates a client crashed before processing.
        2. A valid value clears everything **at or below** it.
        3. `-1` clears everything.

        **Overflow is reported, not hidden.** Past `I3X_SUBSCRIPTION_QUEUE_LIMIT` (default
        10,000) the oldest batches drop and the next sync answers **206**. Compute the gap
        from `lastSequenceNumber + 1` to `result[0].sequenceNumber - 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
                lastSequenceNumber:
                  type: integer
                  description: 'Acknowledge up to and including this. `-1` acknowledges everything. **Omit to acknowledge nothing.**'
      responses:
        '200':
          description: Accumulated batches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/UpdateBatch' }
        '206':
          description: 'Delivered, but batches were dropped from the queue. `responseDetail` says so.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

  /subscriptions/stream:
    post:
      tags: [Subscriptions]
      summary: Server-sent event stream
      description: |
        The push half, and a MAY — `GET /info` declares `subscribe.stream: true`. Responds
        `text/event-stream`, chunked, starting with any backlog already queued.

        **One stream per subscription.** There is no fan-out in i3X: a second consumer creates
        its own subscription. Opening a second stream closes the first *cleanly* — a
        terminating zero-length chunk — because the spec says the displaced client sees a
        close with no error.

        **An abandoned stream is noticed at once, not at the next keepalive.** The wait loop
        `select`s on the connection rather than sleeping, so a client that hangs up frees the
        thread and socket immediately. Sleeping blind looks harmless and is not: HTTP/1.1
        keep-alive *serialises* a connection, so a pooling client that abandons a stream and
        immediately issues another request has that request queued behind the corpse of the
        first — which presents as a hung server on an endpoint that was never reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, subscriptionId]
              properties:
                clientId: { type: string }
                subscriptionId: { type: string }
      responses:
        '200':
          description: An open SSE stream of `UpdateBatch` events.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SubscriptionNotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The **user's** access token from `POST /auth/v1/token?grant_type=password` on the
        Platform API. Not the anon key, and not a service-role key — this server refuses to
        start if one is in its environment.

  responses:
    Unauthorized:
      description: |
        No `Authorization` header, or a token the data layer rejected. Only `GET /info` is
        unauthenticated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Malformed body — typically a missing or non-array `elementIds`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SubscriptionNotFound:
      description: 'No such subscription for this `clientId` — including after a restart, since subscription state is in memory.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MethodNotAllowed:
      description: 'This server is read-only. Carries `Allow: POST`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    Envelope:
      type: object
      description: The single-result envelope.
      properties:
        success: { type: boolean }
        result: {}
        responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    BulkEnvelope:
      type: object
      description: |
        The bulk envelope. **`200` even when items failed** — the request succeeded; the items
        are what did or did not. `results` is always in the order requested.
      properties:
        success:
          type: boolean
          description: The AND of every item's `success`.
        results:
          type: array
          items:
            type: object
            properties:
              success: { type: boolean }
              elementId: { type: string }
              result: {}
              responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        responseDetail: { $ref: '#/components/schemas/ResponseDetail' }

    ResponseDetail:
      type: object
      properties:
        title: { type: string, example: Unauthorized }
        status: { type: integer, example: 401 }
        detail: { type: string, example: The supplied credentials were rejected by the data layer. }

    ServerInfo:
      type: object
      properties:
        specVersion: { type: string, example: '1.0' }
        serverVersion: { type: string, example: 0.1.0 }
        serverName: { type: string, example: aber-i3x }
        capabilities:
          type: object
          properties:
            query:
              type: object
              properties:
                history: { type: boolean, example: true }
            update:
              type: object
              description: Both false. Not a limitation to be lifted — see `PUT /objects/value`.
              properties:
                current: { type: boolean, example: false }
                history: { type: boolean, example: false }
            subscribe:
              type: object
              properties:
                stream: { type: boolean, example: true }

    Namespace:
      type: object
      properties:
        uri: { type: string, format: uri, example: 'https://aber.local/i3x' }
        displayName: { type: string, example: Aber Local }

    ObjectType:
      type: object
      properties:
        elementId: { type: string, example: i3x:type:cell }
        displayName: { type: string, example: Factory Cell }
        namespaceUri: { type: string, format: uri }
        sourceTypeId:
          type: string
          description: The platform's own `semantic_id`, or the synthetic type's name.
        version: { type: string, example: 1.0.0 }
        schema:
          type: object
          description: '`schemas.schema_definition` verbatim — it already is a JSON Schema, so nothing is translated.'

    RelationshipType:
      type: object
      properties:
        elementId: { type: string, example: HasParent }
        displayName: { type: string }
        namespaceUri: { type: string, format: uri }
        relationshipId: { type: string }
        reverseOf: { type: string, example: HasChildren }
        metadata:
          type: object
          properties:
            description: { type: string }

    I3xObject:
      type: object
      properties:
        elementId:
          type: string
          description: |
            The platform's `sparkplug_id` — immutable and on the wire. i3X requires an
            elementId that is unique *and persistent*, which `name` is not: it is a freely
            editable display label.
          example: dev220000000000400080000
        displayName: { type: string, example: Sim_CNC_Mill_01 }
        typeElementId: { type: string }
        parentId:
          type: string
          nullable: true
          description: 'The **cell**, not the gateway. `null` only on `i3x:site`.'
        isComposition: { type: boolean }
        isExtended:
          type: boolean
          description: |
            Whether the object publishes beyond its type. Derived from `last_birth_metrics`,
            so it reflects the most recent DBIRTH — a device that has never birthed reports
            `false` rather than unknown.
        metadata:
          $ref: '#/components/schemas/ObjectMetadata'

    ObjectMetadata:
      type: object
      description: 'Returned only when `includeMetadata` is set — it is the expensive half of an Object.'
      properties:
        description: { type: string, nullable: true }
        typeNamespaceUri: { type: string, format: uri }
        sourceTypeId:
          type: string
          description: "The same as its ObjectType's: a schema's `semantic_id`, else its name; `Device` for a device with no schema."
        quarantined:
          type: boolean
          description: 'Present in the directory but its telemetry is being dropped. Drives `quality: Uncertain`.'
        relationships:
          type: object
          description: |
            Edge lists keyed by relationship type. `HasComponent` is carried **alongside**
            `HasChildren`, not instead of it — they answer different questions: `HasChildren`
            is the browse hierarchy, `HasComponent` is what `maxDepth > 1` descends.
          additionalProperties:
            type: array
            items: { type: string }
          example:
            HasParent: [i3x:unassigned]
            ConnectsVia: [gwy120000000000400080000]

    ValueResult:
      type: object
      properties:
        isComposition: { type: boolean }
        value:
          description: 'For a device, an object of metric name to latest value. `null` when quality is `GoodNoData`.'
        quality: { $ref: '#/components/schemas/Quality' }
        timestamp: { type: string, format: date-time }
        components:
          type: object
          description: 'Present only when `maxDepth` is 0 or above 1. Keyed by elementId.'
          additionalProperties: { $ref: '#/components/schemas/ValueResult' }

    HistoryResult:
      type: object
      properties:
        isComposition: { type: boolean }
        values:
          type: array
          description: Newest first. Empty for anything that is not a device.
          items:
            type: object
            properties:
              value: {}
              quality: { $ref: '#/components/schemas/Quality' }
              timestamp: { type: string, format: date-time }
        components:
          type: object
          additionalProperties: { $ref: '#/components/schemas/HistoryResult' }

    Quality:
      type: string
      enum: [Good, Uncertain, GoodNoData]
      description: |
        Derived at read time, never stored. `Uncertain` — quarantined device, or a gateway
        that is STALE/OFFLINE/UNKNOWN. `GoodNoData` — never published, and no value is
        carried. `Good` — otherwise.

        A STALE gateway is `Uncertain` rather than `Bad`: it has not been heard from inside
        the threshold, which is doubt about currency, not a fault.

    Subscription:
      type: object
      properties:
        clientId: { type: string }
        subscriptionId: { type: string }
        displayName: { type: string }

    UpdateBatch:
      type: object
      description: One batch of accumulated changes. Also the SSE event payload.
      properties:
        sequenceNumber:
          type: integer
          description: 'Monotonic per subscription. A gap after a 206 is the overflow window.'
        timestamp: { type: string, format: date-time }
        values:
          type: array
          items:
            type: object
            properties:
              elementId: { type: string }
              value: {}
              quality: { $ref: '#/components/schemas/Quality' }
              timestamp: { type: string, format: date-time }
