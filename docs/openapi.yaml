openapi: 3.0.3

info:
  title: Aber API
  version: "1.6.0"
  description: |
    The HTTP surface of Aber, the shopfloor data platform. Every request goes through
    the **Envoy API gateway** on `http://127.0.0.1:54321`, which routes to five upstreams:

    | Prefix | Upstream | `apikey` required? |
    | :--- | :--- | :--- |
    | `/auth/v1/` | Supabase Auth (GoTrue) | yes |
    | `/rest/v1/` | PostgREST — one endpoint per table, view and RPC | yes |
    | `/storage/v1/` | Supabase storage-api — the `asset-3d-models` bucket | yes |
    | `/storage/v1/object/public/` | storage-api, public read | **no** |
    | `/realtime/v1/` | Supabase Realtime — WebSocket change feed | yes |
    | `/functions/v1/` | Supabase Edge Runtime | yes, except the two userinfo endpoints |

    ### Authentication

    Every request needs **both** headers, with two documented exceptions:

    * `apikey: <publishable key>` — the project's `sb_publishable_*` key.
    * `Authorization: Bearer <access_token>` — the JWT from `POST /auth/v1/token`.

    The exceptions are `/storage/v1/object/public/…` (public-read bucket) and
    `/functions/v1/{grafana,nodered}-userinfo`, which are exempt from the gateway's API-key check
    because an OAuth client presents client credentials and has no way to add a Supabase
    header. Both still validate the bearer token themselves.

    Sign in first with `admin@aber.local` / `aber123` (local dev seed).

    > ⚠️ **"Example Value" is documentation, not data.** Swagger UI synthesises samples from
    > this spec's schemas whether or not those rows exist. Press **Execute** and read the
    > **Response body** panel to see what your stack actually holds.

    > ℹ️ **A token ends with its session.** Once its `auth.sessions` row is gone (a Sign Out,
    > a new password, `npm run dev:reset`), PostgREST answers `401` with the code
    > `session_not_found`, and Edge Functions answer `401 Invalid user token`. Sign in again
    > for a fresh token.

    ### Authorization

    Row Level Security is enforced by PostgreSQL, not by this gateway, and fails closed.
    Reads are open to any authenticated user; writes to `cells`, `gateways`, `devices` and
    friends require `Administrator` or `Shopfloor_Manager`. `audit_trail` is readable by
    `Administrator`, `Shopfloor_Manager` and `Auditor` only, and is **append-only** — the
    write verbs are revoked from every application role including `service_role`.

    The reference vocabularies (`mtconnect_vocabulary`, `iso22400_vocabulary`,
    `opcua_vocabulary`, `ashrae223_vocabulary`, `idta_submodel_templates`) and the
    `concept_definitions` view over them are `SELECT`-only for `authenticated`; `anon` is revoked.

    ### PostgREST conventions

    All `/rest/v1/` collections share the same grammar:

    * **Select columns / embed relations** — `?select=id,name,gateways(id,name,devices(id,name))`
    * **Filter** — `?status=eq.ONLINE`, `?time=gte.2026-01-01T00:00:00Z`, `?name=like.*CNC*`
      (operators: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `like`, `ilike`, `in`, `is`)
    * **Order** — `?order=created_at.desc`
    * **Paginate** — `?limit=500&offset=500`, or the `Range` header
    * **Return the written rows** — `Prefer: return=representation`
    * **Exact row count** — `Prefer: count=exact` (returned in `Content-Range`)

    Every collection returns a JSON **array**, never a bare object — including when a filter
    matches exactly one row.

    ### Asset identity

    Gateways and devices carry an immutable **`sparkplug_id`**: a 3-character type prefix
    (`gwy` / `dev`) plus 21 lowercase hex characters, 24 in total, generated from the row's
    UUID primary key. **That is the identity on the wire** — it appears in the MQTT topic and
    keys `telemetry.asset_id` and `asset_config.asset_id`.

    `name` is a display label. It is freely editable, is **not unique** on gateways or
    devices, and renaming never detaches telemetry.

    ### Asset location

    A device has **two** relationships to a cell, and they answer different questions:

    * `devices.gateway_id → gateways.cell_id` is the **data path** — what the Sparkplug topic
      carries.
    * `devices.cell_id` is an explicit **location override**. `NULL` means inherit from the
      gateway; it is not a stored "unassigned", and the column has no default.

    Resolution is `COALESCE(device.cell_id, gateway.cell_id)`, exposed by the
    **`device_locations`** view. `location_scope` (`cell` | `area_wide` | `site_wide`) records an
    operator's assertion that an asset has no single cell; a CHECK forbids either wide scope with
    a populated `cell_id`.

    Above the cell sits the ISA-95 **area** (one part of the site, `/rest/v1/areas`):
    `cells.area_id` files a cell, and a device's `effective_area_id` on the same view is its cell's
    area, or its own `area_id` when it is `area_wide`. The site is one campus and lives in `system_settings` as
    `site.name`; the enterprise is each gateway's `sparkplug_group`. An area carries one SVG
    **plan** (`areas.plan_path`), and a cell's `plan_x`/`plan_y` place says where the Site Map
    pins it on that plan; nothing else reads them. A floor is not a level of the hierarchy and is
    not modelled: a building with two floors is two areas.

    **No embed can express this.** `cells?select=*,gateways(devices(*))` returns devices by
    inheritance only, so a device explicitly placed in cell B whose gateway serves cell A comes
    back under A. Read `device_locations` and merge by `device_id`.

  contact:
    name: Aber
    url: https://github.com/Harri-Llewelyn/Aber

servers:
  - url: http://127.0.0.1:54321
    description: The gateway (Envoy) through `npm run dev:forward`

security:
  - bearerAuth: []
    apiKeyAuth: []

tags:
  - name: Auth
    description: Supabase Auth (GoTrue) session management.
  - name: Assets
    description: Cells, gateways and devices — the shopfloor asset hierarchy.
  - name: Location
    description: Where an asset is, as opposed to how its data reaches the platform.
  - name: Telemetry
    description: Time-series metrics, served from the standalone TimescaleDB hypertable.
  - name: Audit
    description: The append-only Audit Trail.
  - name: Registry
    description: Schemas, metric catalog, reference vocabularies, links and services.
  - name: Storage
    description: 3D asset models in the `asset-3d-models` bucket.
  - name: Realtime
    description: WebSocket change feed.
  - name: Edge Functions
    description: Privileged server-side operations.
  - name: Directory
    description: >-
      Factory+ Directory adapter. Served at the UNPREFIXED paths an upstream Factory+ client
      expects, because such a client has no Supabase apikey.


paths:

  # ---------------------------------------------------------------- Auth ----
  /auth/v1/token:
    post:
      tags: [Auth]
      summary: Sign in and obtain an access token
      description: |
        Exchanges credentials for a JWT. The returned `access_token` is what every other
        endpoint expects in `Authorization: Bearer <token>`.

        The token carries the caller's role in `app_metadata.role`, refreshed from the
        database on every issue by `custom_access_token_hook()`.
      security:
        - apiKeyAuth: []
      parameters:
        - name: grant_type
          in: query
          required: true
          schema:
            type: string
            enum: [password, refresh_token]
            default: password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: admin@aber.local }
                password: { type: string, format: password, example: aber123 }
                refresh_token:
                  type: string
                  description: Send this instead of email/password when `grant_type=refresh_token`.
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, example: 3600 }
                  refresh_token: { type: string }
                  user: { type: object }
        '400':
          description: Invalid login credentials.

  /auth/v1/signup:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Refused while `supabaseAuth.disableSignup` is true, the default. When it is opened, a
        self-registered account starts with no role: nothing gives one at sign-up (`0167` dropped
        `handle_new_user()`). An `Administrator` gives it one on the People tab.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Account created; a session is returned when auto-confirm is enabled.

  /auth/v1/user:
    get:
      tags: [Auth]
      summary: Get the current user
      responses:
        '200':
          description: The user behind the bearer token, including `app_metadata.role`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------- Assets ----
  /rest/v1/cells:
    get:
      tags: [Assets]
      summary: List shopfloor cells
      description: |
        `?select=*,gateways(*,devices(*))` embeds the data path in one request. It does
        **not** give you device *location* — see the Asset location note above.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: name
          in: query
          schema: { type: string }
          description: 'Filter, e.g. `eq.Assembly Line 1`. Unlike gateways and devices, cell names ARE unique.'
        - name: is_archived
          in: query
          schema: { type: string }
          description: 'Filter, e.g. `eq.false`.'
      responses:
        '200':
          description: Matching cells.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cell' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Assets]
      summary: Create a cell
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CellWrite' }
      responses:
        '201': { description: Created. }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Assets]
      summary: Update cells matching a filter
      description: |
        Always send a filter, e.g. `?id=eq.<uuid>`; an unfiltered PATCH updates every row.

        Archiving (`is_archived` from false to true) is refused while any device resolves to the
        cell or any gateway is filed in it. Every device counts, whatever its lifecycle: archived,
        quarantined, offline, and those in the cell through their gateway (read
        `device_locations.effective_cell_id`). So does an archived gateway. The error counts both
        and names the gateways. Move them to another cell, or delete them, first. Restoring a cell,
        and editing an archived one, are not refused.
      parameters:
        - { name: id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CellWrite' }
      responses:
        '204': { description: Updated. }
        '400': { description: 'The archive was refused: the cell still holds a device or a gateway (`23001`).' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Assets]
      summary: Delete cells matching a filter
      description: |
        Un-files what was in the cell: gateways and devices referencing it have `cell_id` set to
        NULL, never deleted — neither is a child of its location. Prefer archiving.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/areas:
    get:
      tags: [Assets]
      summary: List areas
      description: |
        The ISA-95 level above the cells. `?select=*,cells(*)` embeds each area's cells; devices
        are not embeddable here for the reason in the Asset location note — read
        `device_locations.effective_area_id`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: name
          in: query
          schema: { type: string }
          description: 'Filter, e.g. `eq.North Shop`. Names are unique.'
      responses:
        '200':
          description: Matching areas.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Area' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Assets]
      summary: Create an area
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaWrite' }
      responses:
        '201': { description: Created. }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Assets]
      summary: Update areas matching a filter
      description: |
        Always send a filter, e.g. `?id=eq.<uuid>`; an unfiltered PATCH updates every row.

        Archiving an area (`is_archived` from false to true) is refused while any device or gateway
        is `area_wide` in it, archived ones included: the nightly purge could never delete it. Make
        each one Site-Wide, put it in a cell, or delete it, then archive the area. Cells filed in
        the area do not block it. Once it is archived, nothing can be made `area_wide` in it.
      parameters:
        - { name: id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaWrite' }
      responses:
        '204': { description: Updated. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { description: 'The archive was refused: a device or gateway is still `area_wide` in the area (`23001`).' }
    delete:
      tags: [Assets]
      summary: Delete areas matching a filter
      description: |
        Cells filed in the area have `area_id` set to NULL, never deleted. Refused while a device
        or gateway is `area_wide` in it: that scope requires its area, so move the asset first.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: An area-wide asset still names this area. }

  /rest/v1/gateways:
    get:
      tags: [Assets]
      summary: List edge gateways
      description: |
        `last_heartbeat` is stamped by the ingestion daemon on every node-level Sparkplug B
        message (`NBIRTH`/`NDATA`/`NDEATH`). A gateway that stops publishing never writes an
        OFFLINE status — it goes quiet. **Read `gateway_status` instead of deriving staleness
        yourself**; it applies the 90-second threshold at read time.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - name: cell_id
          in: query
          schema: { type: string }
          description: 'e.g. `eq.<uuid>`, or `is.null` for gateways in no cell.'
        - name: location_scope
          in: query
          schema: { type: string }
          description: '`eq.cell` | `eq.site_wide`'
      responses:
        '200':
          description: Matching gateways.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Gateway' } }
    post:
      tags: [Assets]
      summary: Register a gateway
      description: |
        Do not send `id` or `sparkplug_id` — both are generated. The issued `sparkplug_id` is
        what the edge node must publish as; configure the gateway with the value returned here.
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayWrite' }
      responses:
        '201': { description: Created. }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Assets]
      summary: Update gateways matching a filter
      parameters:
        - { name: id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayWrite' }
      responses:
        '204': { description: Updated. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/gateway_status:
    get:
      tags: [Assets]
      summary: Gateways with read-time staleness applied
      description: |
        Read-only view: every `gateways` column plus `live_status`, `is_stale` and
        `heartbeat_age_seconds`, derived at read time against a 90-second threshold.

        **Staleness is deliberately not stored.** A sweep writing `STALE` would fire
        `log_audit_trail_event()` on every tick and append to an append-only audit table
        forever, and would be correct only between ticks.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - name: is_stale
          in: query
          schema: { type: string }
          description: 'e.g. `eq.true`'
      responses:
        '200':
          description: Matching gateways with derived status.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GatewayStatus' } }

  /rest/v1/devices:
    get:
      tags: [Assets]
      summary: List devices
      description: |
        Embed the serving gateway with `?select=*,gateways(id,name,cell_id)` for the data
        path. For the device's **effective cell**, read `device_locations` and merge by
        `device_id` — an embed cannot express the override.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - name: is_quarantined
          in: query
          schema: { type: string }
          description: '`eq.true` returns the zero-touch onboarding queue.'
        - name: gateway_id
          in: query
          schema: { type: string }
          description: 'e.g. `eq.<uuid>`, or `is.null` for devices bound to no gateway.'
        - name: cell_id
          in: query
          schema: { type: string }
          description: 'The explicit override only. `is.null` means "inherits", NOT "unassigned".'
        - name: sparkplug_id
          in: query
          schema: { type: string }
          description: 'e.g. `eq.dev220000000000400080000`'
      responses:
        '200':
          description: Matching devices.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
    post:
      tags: [Assets]
      summary: Register a device
      description: |
        `id` and `sparkplug_id` are generated — do not send them. The issued `sparkplug_id`
        is what the gateway must publish this device as.

        **Do not set `cell_id` on create.** Leaving it NULL is what lets the device inherit
        its gateway's cell; a value here is an explicit override that survives re-homing.
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceWrite' }
      responses:
        '201': { description: Created. }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Assets]
      summary: Update devices matching a filter
      description: |
        `gateway_id` moves a device along the data path. `cell_id` / `location_scope` move it
        on the shopfloor map. Setting `location_scope=site_wide` requires `cell_id` to be
        NULL in the same request, or a CHECK rejects it with `400`.
      parameters:
        - { name: id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceWrite' }
      responses:
        '204': { description: Updated. }
        '400': { description: 'CHECK violation — most often `site_wide` with a populated `cell_id`.' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------ Location ----
  /rest/v1/device_locations:
    get:
      tags: [Location]
      summary: Each device's effective cell, resolved at read time
      description: |
        Read-only view resolving `COALESCE(device.cell_id, gateway.cell_id)`.

        **Never collapse `effective_cell_id` and `explicit_cell_id`.** The first is what to
        display; the second is what to put back in an edit form. A form that round-trips the
        effective value converts an inherited cell into an explicit override.

        `location_source` says which arm won (`device` | `gateway` | `none`), and
        `cell_mismatch` is true when an explicit cell disagrees with the gateway's.
      parameters:
        - $ref: '#/components/parameters/Select'
        - name: device_id
          in: query
          schema: { type: string }
          description: 'e.g. `eq.<uuid>`'
        - name: effective_cell_id
          in: query
          schema: { type: string }
          description: '`is.null` is the Unassigned lane — a derived state, not a `cells` row.'
      responses:
        '200':
          description: Resolved locations.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceLocation' } }

  /rest/v1/device_uns_paths:
    get:
      tags: [Location]
      summary: Each device's place in the Unified Namespace, or why it has none
      description: |
        Read-only view (0214), one row per device. `uns_path` is its path below the UNS bridge's
        root, `<enterprise>/<site>/<area>/<cell>/<device>` at the levels the device occupies;
        `skip_reason` says why it has none. Exactly one is set.

        **The topic is `<root>/<uns_path>`**, and each metric publishes retained beneath it at
        `<root>/<uns_path>/<metric name>`. The root is `ingestion.unsMqttTopicRoot` (`uns` by
        default), and nothing is published while `ingestion.unsMqttEnabled` is off, its default.
        The path follows names: renaming an area, a cell or a device moves every topic beneath it.
        The Sparkplug ID never moves.

        Runs as the caller (`security_invoker`): their policies on devices, gateways, cells, areas
        and settings apply. `anon` reads nothing.
      parameters:
        - $ref: '#/components/parameters/Select'
        - name: device_id
          in: query
          schema: { type: string }
          description: 'e.g. `eq.<uuid>`'
        - name: area_id
          in: query
          schema: { type: string }
          description: "The devices beneath an area, its cells' and its Area-Wide ones: `eq.<uuid>`."
        - name: skip_reason
          in: query
          schema: { type: string }
          description: '`not.is.null` lists the devices the bridge skips.'
      responses:
        '200':
          description: One row per device the caller may read.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceUnsPath' } }

  # ----------------------------------------------------------- Telemetry ----
  /rest/v1/telemetry:
    get:
      tags: [Telemetry]
      summary: Read time-series telemetry
      description: |
        Read-only projection over the standalone TimescaleDB `telemetry` hypertable, reached
        with `postgres_fdw`. `asset_id` holds the device's immutable **`sparkplug_id`**, not
        its UUID and not its editable name.

        `postgres_fdw` pushes `WHERE` clauses to TimescaleDB but **not** `LIMIT`, so always
        constrain the time window on large ranges:

        `?asset_id=eq.dev220000000000400080000&time=gte.2026-01-01T00:00:00Z&order=time.desc&limit=500`

        > **This table cannot be subscribed to over Realtime.** Its rows enter TimescaleDB's
        > WAL, never Supabase's, so adding it to the publication emits nothing — silently.
        > Poll it instead.
      parameters:
        - { name: asset_id, in: query, schema: { type: string }, description: 'Device Sparkplug ID, e.g. `eq.dev220000000000400080000`.' }
        - { name: metric_name, in: query, schema: { type: string }, description: 'e.g. `eq.Systems/TEMPERATURE`.' }
        - { name: time, in: query, schema: { type: string }, description: 'e.g. `gte.2026-01-01T00:00:00Z`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching telemetry rows.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TelemetryRow' } }
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  /rest/v1/telemetry_latest:
    get:
      tags: [Telemetry]
      summary: Read the newest sample per device and metric
      description: |
        One row per `(asset_id, metric_name)` — the most recent sample, whenever it arrived.

        **Prefer this over `/rest/v1/telemetry` for "what is it reading now".** It is evaluated on
        the TimescaleDB side, so `postgres_fdw` ships one row per series instead of a whole time
        window. Asking `/rest/v1/telemetry` for the last 24 hours and keeping the newest of each
        metric transfers a day of rows to discard almost all of them; this does not, and its cost
        is bounded by the number of series rather than by how much history exists.

        There is no time parameter, deliberately: "latest" is not a window. Filter on `time` if
        you need to exclude series that have gone stale.
      parameters:
        - { name: asset_id, in: query, schema: { type: string }, description: 'Device Sparkplug ID, e.g. `eq.dev220000000000400080000`.' }
        - { name: metric_name, in: query, schema: { type: string }, description: 'e.g. `eq.Systems/TEMPERATURE`.' }
        - { name: time, in: query, schema: { type: string }, description: 'Staleness filter, e.g. `gte.2026-01-01T00:00:00Z`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest row per series.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TelemetryRow' } }
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  /rest/v1/telemetry_horizons:
    get:
      tags: [Telemetry]
      summary: How far back each telemetry resolution reaches
      description: |
        Four rows, one per relation: `telemetry` (raw) and the `telemetry_1m`, `telemetry_5m` and
        `telemetry_1h` rollups, each with the oldest timestamp it still holds.

        **What is held, not what the retention policy promises.** The policy says what will
        eventually be dropped; it cannot tell you what is there. A stack installed three weeks ago
        holds three weeks of raw however `retainFor` is set, and widening a policy does not restore
        chunks already deleted. This reads `min()` from each relation on the TimescaleDB side, so
        four rows cross `postgres_fdw` rather than a scan — the same move `/rest/v1/telemetry_latest`
        makes, and necessary for the same reason: the wrapper pushes `WHERE` down but not `LIMIT`,
        so `order=time.asc&limit=1` over the projection would stream the relation to discard all
        but one row.

        A null `oldest` means that relation is empty. That is not the same as "does not reach that
        far": an empty stack covers nothing at any resolution.

        **What it is for.** Exporting a range older than the raw retention window used to return
        nothing and report that the device had published nothing. This is how a client tells the
        difference, and which coarser resolution still answers.

        No parameters: retention is a property of the chunk, not of a device, so the horizon is the
        same for every asset. It carries no metric values and no device identity.
      parameters:
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: One row per resolution.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    relation:
                      type: string
                      enum: [telemetry, telemetry_1m, telemetry_5m, telemetry_1h]
                      description: The relation this horizon describes.
                    oldest:
                      type: string
                      format: date-time
                      nullable: true
                      description: Oldest timestamp held, or null when the relation is empty.
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  /rest/v1/telemetry_1m:
    get:
      tags: [Telemetry]
      summary: Read one-minute telemetry rollups
      description: |
        Continuous aggregate over the hypertable, bucketed to one minute. Use it — or the coarser
        views below — for trends and long windows instead of scanning raw.

        `avg_double` is derived from a stored sum and count, so it is a true weighted mean across
        the bucket. **`min_double` and `max_double` are carried too**: an average hides the
        excursion, and in manufacturing the excursion is usually the point.

        **State metrics are not lost.** `last_string` and `last_bool` carry the value each metric
        held at the end of the bucket, which is the correct summary for a state such as
        `Controller/EXECUTION`. `n_double` counts the numeric samples; `n_rows` counts all of them.

        Buckets still being written are visible immediately — real-time aggregation unions the
        materialised part with the raw tail, so this does not lag behind `/rest/v1/telemetry`.
      parameters:
        - { name: asset_id, in: query, schema: { type: string }, description: 'e.g. `eq.dev220000000000400080000`.' }
        - { name: metric_name, in: query, schema: { type: string }, description: 'e.g. `eq.Systems/TEMPERATURE`.' }
        - { name: bucket, in: query, schema: { type: string }, description: 'Bucket start, e.g. `gte.2026-01-01T00:00:00Z`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching rollup buckets.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TelemetryBucket' } }
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  /rest/v1/telemetry_5m:
    get:
      tags: [Telemetry]
      summary: Read five-minute telemetry rollups
      description: |
        As `/rest/v1/telemetry_1m`, bucketed to five minutes and aggregated from it. Identical
        columns.
      parameters:
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: metric_name, in: query, schema: { type: string } }
        - { name: bucket, in: query, schema: { type: string }, description: 'e.g. `gte.2026-01-01T00:00:00Z`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching rollup buckets.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TelemetryBucket' } }
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  /rest/v1/telemetry_1h:
    get:
      tags: [Telemetry]
      summary: Read hourly telemetry rollups
      description: |
        As `/rest/v1/telemetry_1m`, bucketed to one hour and aggregated from `telemetry_5m`.

        **This view outlives the raw data.** Rollups are independent of the hypertable, so they
        survive its retention policy — by default raw is dropped at 90 days while these buckets are
        kept for five years. For any question about a period older than the raw window, this is the
        only place an answer exists.
      parameters:
        - { name: asset_id, in: query, schema: { type: string } }
        - { name: metric_name, in: query, schema: { type: string } }
        - { name: bucket, in: query, schema: { type: string }, description: 'e.g. `gte.2026-01-01T00:00:00Z`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching rollup buckets.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TelemetryBucket' } }
        '401':
          description: Granted to authenticated users only; `anon` is refused.

  # --------------------------------------------------------------- Audit ----
  /rest/v1/audit_trail:
    get:
      tags: [Audit]
      summary: Read the Audit Trail
      description: |
        **Append-only.** Rows are written only by `log_audit_trail_event()` and its named
        siblings: triggers on the audited tables, and the `SECURITY DEFINER` functions behind
        proposals, backups, service identities and gateway credentials. `INSERT`/`UPDATE`/`DELETE`
        are revoked from every application role — `service_role` included. The asset lane
        (`audit_domain = 'asset'`) is readable by `Administrator`, `Shopfloor_Manager` and
        `Auditor`, the security lane by `Administrator` and `Auditor`.

        `entity_type` names the table an event is about: `areas`, `cells`, `gateways`, `devices`,
        `device_nameplate`, `device_submodels`, `schemas`, `metric_catalog` and `change_proposals` in
        the asset lane, and `user_roles`, `service_principals`, `broker_accounts` (a read-only broker
        account, 0218), `system_settings`, `backup_jobs` and `backups` in the security lane. A trail older than their retirement also holds `area_floors`,
        `cell_links`, `gateway_links` and `device_links` rows. Rows key on `entity_id`. To find an
        entity's history after deleting it, collect the ids first.

        `actor_source` records who made the change (`user` / `ingestion` / `service` /
        `migration`). The trigger refuses to accept `user` from a client-supplied header.
      parameters:
        - { name: entity_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - { name: entity_type, in: query, schema: { type: string }, description: 'e.g. `eq.devices` or `eq.metric_catalog`; any `AuditTrailEntry.entity_type`' }
        - { name: action, in: query, schema: { type: string }, description: 'e.g. `eq.UPDATE` or `eq.TOKEN_REVOKED`; any `AuditTrailEntry.action`' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching audit entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditTrailEntry' } }
        '403': { description: Role lacks Audit Trail read access. }

  /rest/v1/revoked_service_tokens:
    get:
      tags: [Audit]
      summary: List revoked service tokens still inside their lifetime
      description: |
        The denylist `auth_pre_request()` consults before every PostgREST request (`0074`). A
        service token whose `jti` appears here is refused with `42501` until it expires.

        **Operational, not audit.** Rows are pruned once the token they name has expired, because
        the signature check refuses it from then on — so this is *not* the history of revocations.
        That is the `TOKEN_REVOKED` entry in `/rest/v1/audit_trail`, which is append-only and
        carries the original mint in `old_data` so it stays readable after the row here is gone.

        **Revocation reaches PostgREST only.** `supabase-storage`, `supabase-realtime`, the edge
        runtime and Studio each verify `SUPABASE_JWT_SECRET` for themselves and consult no
        denylist, so a listed token still satisfies those four until it expires.

        Read is `Administrator` and `Auditor`; `anon` is granted nothing.
      parameters:
        - { name: jti, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` to check one token.' }
        - { name: principal_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` for one identity''s withdrawn tokens.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Unexpired revoked tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jti:          { type: string, description: The token identifier the denylist matches on. }
                    principal_id: { type: string, format: uuid }
                    expires_at:   { type: string, format: date-time, description: The token's own expiry. The row is pruned past it. }
                    revoked_at:   { type: string, format: date-time }
                    revoked_by:   { type: string, format: uuid, description: The Administrator who withdrew it. }
        '403': { description: Role is neither Administrator nor Auditor. }

  /rest/v1/revoked_service_principals:
    get:
      tags: [Audit]
      summary: List withdrawn service principals
      description: |
        Service principals `auth_pre_request()` refuses by **subject** (`0076`). Every token naming
        one is refused — including tokens this stack has no `TOKEN_MINTED` row for, and any issued
        afterwards. That reach is what distinguishes it from withdrawing tokens one at a time.

        **Not self-pruning**, unlike `/rest/v1/revoked_service_tokens`. A token row can go once the
        token expires, because the signature check refuses it from then on; a principal has no
        expiry and stays until `reinstate_service_principal()` removes the row. So an empty list
        here really does mean "none withdrawn".

        **Reinstating restores the identity, not its credentials.** Revocation denylists each
        outstanding token individually, and `revoke_service_token()` has no inverse — so tokens
        withdrawn alongside a principal stay withdrawn and a new one must be minted.

        A person's account can never appear here: `revoke_service_principal()` refuses anything
        that can sign in, because `sub` is on every JWT and a row naming a human would refuse the
        very request that would undo it.

        Read is `Administrator` and `Auditor`; `anon` is granted nothing.
      parameters:
        - { name: principal_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` to check one identity.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Withdrawn service principals.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    principal_id: { type: string, format: uuid }
                    revoked_at:   { type: string, format: date-time }
                    revoked_by:   { type: string, format: uuid, description: The Administrator who withdrew it. }
                    reason:       { type: string, nullable: true, description: Free text supplied at revocation. }
        '403': { description: Role is neither Administrator nor Auditor. }

  /rest/v1/service_token_last_use:
    get:
      tags: [Audit]
      summary: When each service token was last used through the i3X server
      description: |
        One row per service token the i3X server has accepted (`0209`): its `jti`, its identity
        and `last_used_at`, the start of the latest UTC hour in which the i3X server accepted it.
        A token with no row has never been presented there. A client calling the REST API
        directly is not recorded, so no row is not proof that a token is unused.

        **Written only by `/rest/v1/rpc/record_service_token_use`**, which the i3X server calls
        as the token's own caller. No write policy exists, and nothing is audited: the token's
        `TOKEN_MINTED` entry in `/rest/v1/audit_trail` stays its record.

        Read is `Administrator` and `Auditor`, as for the token list's other parts; any other
        role reads an empty array, and `anon` is granted nothing.
      parameters:
        - { name: jti, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` for one token.' }
        - { name: principal_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` for one identity''s tokens.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: The recorded tokens, or an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jti:          { type: string, description: The token's jti, as its TOKEN_MINTED row records it. }
                    principal_id: { type: string, format: uuid }
                    last_used_at: { type: string, format: date-time, description: The start of the latest UTC hour in which the i3X server accepted the token. }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/rpc/record_service_token_use:
    post:
      tags: [Audit]
      summary: Record that your own service token was used this hour
      description: |
        The i3X server calls this with the caller's own token after accepting it (`0209`). It
        takes no argument: the `jti` and `sub` come from the verified token, so a caller can
        record only its own. It records a token whose `jti` has a `TOKEN_MINTED` row for that
        `sub`, at the start of the current UTC hour. Anything else, a person's session token or a
        key, records nothing. A second call in the same hour writes nothing.

        A POST: PostgREST runs a GET read-only. Granted to `authenticated`, not `anon` or
        `service_role`. A revoked token is refused before the call, as on every request.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: '`true` when this call recorded the hour, `false` when there was nothing to record.'
          content:
            application/json:
              schema: { type: boolean }
        '401': { description: 'Not authenticated, or the token was revoked; `anon` may not call it.' }

  /rest/v1/machine_principals:
    get:
      tags: [Audit]
      summary: List the names Administrators gave machine principals
      description: |
        One row per database principal created from the Access Control page (`0125`): the name
        the page lists it by, the purpose in the Administrator's own words, who created it and
        when. The three identities a migration pinned have no row here; the dashboard names them
        from its own registry.

        **Written only by `create_machine_principal()`**, in the same transaction as the
        `auth.users` row it describes, so an identity created from the page cannot exist without a
        name. No write policy exists. Deleting the `auth.users` row cascades to this one.

        Read is `Administrator` and `Auditor`, matching `list_user_accounts()`: a name here labels
        audit-trail rows both roles may read, and holds nothing a token could be derived from.
      parameters:
        - { name: principal_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` to name one identity.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Named machine principals.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    principal_id: { type: string, format: uuid }
                    name:         { type: string, description: Unique ignoring case, 1 to 80 characters. }
                    purpose:      { type: string, nullable: true, description: Up to 500 characters. }
                    created_by:   { type: string, format: uuid, nullable: true, description: The Administrator whose session created it. }
                    created_at:   { type: string, format: date-time }
        '403': { description: Role is neither Administrator nor Auditor. }

  /rest/v1/rpc/list_people:
    post:
      tags: [Auth]
      summary: List every person, with their role and whether they can sign in
      description: |
        For the People tab on Access Control (`0166`). One row per `auth.users` account that is not
        a machine principal. Administrator only.

        `status` is `removed` while the person's access is removed (here or by a GoTrue ban),
        `invited` until they first sign in, and `active` after. `sign_in_blocked` says whether
        GoTrue bans the account now; `removed` with `false` means the ban still has to be made.
        `display_name` is the person's display name (`0203`), NULL when they have none.
      responses:
        '200':
          description: Every person, by email.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:         { type: string, format: uuid }
                    email:           { type: string, nullable: true }
                    role:            { type: string, nullable: true, enum: [Administrator, Shopfloor_Manager, Operator, Auditor] }
                    status:          { type: string, enum: [active, invited, removed] }
                    sign_in_blocked: { type: boolean }
                    role_on_restore: { type: string, nullable: true, description: The role restoring access gives back. }
                    invited_at:      { type: string, format: date-time, nullable: true }
                    last_sign_in_at: { type: string, format: date-time, nullable: true }
                    created_at:      { type: string, format: date-time, nullable: true }
                    display_name:    { type: string, nullable: true, description: 'Read live. 1 to 80 characters; NULL when the person has none.' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/set_display_name:
    post:
      tags: [Auth]
      summary: Set or clear a person's display name
      description: |
        A person sets their own; an Administrator sets anyone's (`0203`). The name is trimmed, and
        an empty or null `p_name` clears it. A change writes one `DISPLAY_NAME_CHANGED` row in the
        person's lane of the Audit Trail (old and new name, and who changed it); setting the name a
        person already has writes nothing. The email stays the identifier: the dashboard shows it
        beside the name wherever trust matters.

        Refused, with the reason in the message: another person's name unless you are an
        Administrator (403); a machine identity (400, `22023`); a name over 80 characters, or one
        holding a control character such as a line break, a tab or a bidirectional control (400,
        `22023`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_name]
              properties:
                p_user_id: { type: string, format: uuid }
                p_name:    { type: string, nullable: true, description: 'Up to 80 characters after trimming. Empty or null clears the name.' }
      responses:
        '200':
          description: The name the person holds now, or null.
          content:
            application/json:
              schema: { type: string, nullable: true }
        '400': { description: 'A machine identity, or a name the database refuses.' }
        '403': { description: "Another person's name, and you are not an Administrator." }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/set_own_picture:
    post:
      tags: [Auth]
      summary: Record that you have a picture, or that you have none
      description: |
        Sets or clears `avatar_path` on your own `person_profiles` row (`0213`). It takes no id:
        nobody records or clears another person's picture, an `Administrator` included. Upload the
        picture first, with your token, to `/storage/v1/object/avatars/<your id>/avatar` (PNG, JPEG
        or WebP, 512 KiB at most, `x-upsert: true` to replace it), then call this with `true`. To
        remove it, delete the object, then call this with `false`. Only you can read the object.
        Writes no audit row.

        Refused (403, `42501`) for a caller who holds no role: a machine identity, or a person whose
        access is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_present]
              properties:
                p_present: { type: boolean, nullable: true, description: 'true records `<your id>/avatar`; false or null clears it.' }
      responses:
        '200':
          description: The path now recorded, or null.
          content:
            application/json:
              schema: { type: string, nullable: true }
        '403': { description: 'You hold no role.' }

  /rest/v1/rpc/display_names_for:
    post:
      tags: [Auth]
      summary: Look up the display names of people you can already see
      description: |
        For Approvals and Archived Entities (`0203`), which Operators and Shopfloor Managers read
        too. Answers for your own id, for the proposer of a change proposal you may read, and for
        the retirer of a retired entity you may read. Any other id is left out rather than refused,
        and so is a person with no name: show the email alone for those.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_ids]
              properties:
                p_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: One row per id answered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:      { type: string, format: uuid }
                    display_name: { type: string }

  /rest/v1/rpc/list_my_sessions:
    post:
      tags: [Auth]
      summary: List your own sessions, in every browser and service
      description: |
        For the Security tab on the Profile page (`0206`). One row per GoTrue session you hold: a
        sign-in to the dashboard, a script's password sign-in, or a service's (Grafana, Node-RED,
        Studio, the forge). The session your token names comes first, then the most recently
        active. Any person role; an account with no role, such as a machine identity, is refused.

        A service session carries `service_name` and GoTrue's own client as its `user_agent`: the
        service's server signed you in, so no device is known for it. No address is recorded.
      responses:
        '200':
          description: Your sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:             { type: string, format: uuid }
                    service_name:   { type: string, nullable: true, description: "The OAuth client's name for a service's session; null for a dashboard or password sign-in." }
                    user_agent:     { type: string, nullable: true }
                    created_at:     { type: string, format: date-time }
                    last_active_at: { type: string, format: date-time, description: 'The latest of its last refresh, last update and start.' }
                    not_after:      { type: string, format: date-time, nullable: true, description: 'When GoTrue ends it regardless, if ever.' }
                    is_current:     { type: boolean, description: "True for the session this request's token belongs to." }
        '403': { description: 'An account with no role, such as a machine identity (`42501`).' }

  /rest/v1/rpc/end_my_session:
    post:
      tags: [Auth]
      summary: End one of your own sessions
      description: |
        Deletes the session (`0206`), as a sign-out does: nothing refreshes it again, and the API
        refuses its access token from the next request (401 `session_not_found`, `0205`). Grafana
        and Node-RED notice on their own schedule. One `SESSIONS_ENDED` row in your lane of the
        Audit Trail names you, with a count of 1 and the session's service name, user agent, start
        and last activity (`0211`).

        The session your token belongs to is refused (400, `22023`): sign out to end it. To end
        all the others at once, call `/rest/v1/rpc/end_my_other_sessions`. A session that is not
        yours is answered exactly as one that does not exist (404). A refused call writes no row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_session_id]
              properties:
                p_session_id: { type: string, format: uuid }
      responses:
        '204': { description: The session has ended. }
        '400': { description: 'The session this token belongs to (`22023`).' }
        '403': { description: 'An account with no role, such as a machine identity (`42501`).' }
        '404': { description: 'No session of yours with that id (`P0002`).' }

  /rest/v1/rpc/end_my_other_sessions:
    post:
      tags: [Auth]
      summary: End every session you hold but the one in use
      description: |
        Sign Out of All Other Sessions on the Profile page's Security tab (`0211`). Deletes every
        GoTrue session you hold except the one your token belongs to: other browsers, programs, and
        the Grafana, Node-RED, Studio and forge sign-ins. GoTrue's `POST /auth/v1/logout?scope=others`
        deletes the same rows. Their refresh tokens go with them, and the API refuses their access
        tokens from the next request (401 `session_not_found`, `0205`). Grafana and Node-RED notice
        on their own schedule.

        Writes one `SESSIONS_ENDED` row in your lane of the Audit Trail with how many ended, and
        none when nothing did. A token that names no session of yours is refused (400, `22023`) and
        ends nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: How many sessions ended.
          content:
            application/json:
              schema: { type: integer, minimum: 0 }
        '400': { description: 'The token names no session of yours (`22023`).' }
        '403': { description: 'An account with no role, such as a machine identity (`42501`).' }

  /rest/v1/rpc/end_my_door_sessions:
    post:
      tags: [Auth]
      summary: End every Studio and forge door session you hold
      description: |
        The dashboard calls this at Sign Out, before ending its own session (`0208`). It ends every
        GoTrue session you hold through the gateway's Studio or forge door, in any browser, and
        leaves your other sessions: the dashboard's, Grafana's and Node-RED's. A door in another
        browser signs in again by itself while the dashboard is signed in there. Call it before
        signing out: once your session has ended, the API refuses its token.

        Refused for a machine identity, or a token that names nobody (403, `42501`). Writes no
        Audit Trail row.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: How many door sessions ended.
          content:
            application/json:
              schema: { type: integer, minimum: 0 }
        '403': { description: 'A machine identity, or a token that names nobody (`42501`).' }

  /rest/v1/rpc/set_person_role:
    post:
      tags: [Auth]
      summary: Give a person one of the four roles
      description: |
        Leaves the person exactly one `user_roles` row. `log_role_assignment()` records the change
        as `ROLE_GRANTED` in the Audit Trail's security lane, naming the caller. Administrator only.

        Refused, with the reason in the message: your own role (403); a machine identity (400);
        a person whose access is removed, until it is restored (400, `P0001`); and a change that
        would leave no Administrator who can sign in (400, `P0001`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_role]
              properties:
                p_user_id: { type: string, format: uuid }
                p_role:    { type: string, enum: [Administrator, Shopfloor_Manager, Operator, Auditor] }
      responses:
        '200':
          description: Whether the role changed; `false` when the person already held it.
          content:
            application/json:
              schema: { type: boolean }
        '400': { description: 'Unknown role, a machine identity, a removed person, or the last Administrator.' }
        '403': { description: 'Not an Administrator, or your own role.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/record_person_added:
    post:
      tags: [Auth]
      summary: Give a just-created account its role and record who added it
      description: |
        Called by `/functions/v1/manage-people` in the caller's session, after GoTrue created or
        invited the account. Gives the role and writes a `PERSON_ADDED` row (email, role and
        method, never a password). Refuses an account that has signed in or is more than an hour
        old. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_role, p_invited]
              properties:
                p_user_id: { type: string, format: uuid }
                p_role:    { type: string, enum: [Administrator, Shopfloor_Manager, Operator, Auditor] }
                p_invited: { type: boolean, description: True for an invitation, false for a password shown once. }
      responses:
        '204': { description: Recorded. }
        '400': { description: 'Unknown role, a machine identity, or not a new account.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'No such account (`P0002`).' }

  /rest/v1/rpc/remove_person_access:
    post:
      tags: [Auth]
      summary: Remove a person's role, before their account is banned
      description: |
        Called by `/functions/v1/manage-people` in the caller's session, BEFORE it bans the account
        in GoTrue. Deletes the person's `user_roles` row, so every role check refuses them at once,
        keeps the role to give back, and writes `ACCESS_REMOVED`. Refuses your own access and the
        last Administrator who can sign in. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id]
              properties:
                p_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Whether access was removed now; `false` when it already was.
          content:
            application/json:
              schema: { type: boolean }
        '400': { description: 'A machine identity, or the last Administrator who can sign in.' }
        '403': { description: 'Not an Administrator, or your own access.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/restore_person_access:
    post:
      tags: [Auth]
      summary: Give back a removed person's role, before the ban is lifted
      description: |
        Called by `/functions/v1/manage-people` in the caller's session, BEFORE it lifts the GoTrue
        ban. Gives back the role kept at removal and writes `ACCESS_RESTORED`. Refuses your own
        access and a person whose access is not removed. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id]
              properties:
                p_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: The role the person holds now, or null.
          content:
            application/json:
              schema: { type: string, nullable: true }
        '400': { description: 'A machine identity, or access that is not removed.' }
        '403': { description: 'Not an Administrator, or your own access.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/record_person_password_set:
    post:
      tags: [Auth]
      summary: Decide, then record, an Administrator setting a person's password
      description: |
        Called twice by `/functions/v1/manage-people` in the caller's session (`0167`): with
        `p_check_only` true BEFORE GoTrue sets the password, which checks and writes nothing, and
        with false AFTER, which writes `PASSWORD_SET` (email and method, never the password). A null
        `p_check_only` checks only. Administrator only.

        Refused, with the reason in the message: your own password (403; Change Password is how you
        change it); a machine identity (400); a person whose access is removed, until it is
        restored (400, `P0001`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_check_only]
              properties:
                p_user_id:    { type: string, format: uuid }
                p_check_only: { type: boolean, description: True to check only; false to record a change GoTrue has made. }
      responses:
        '204': { description: Allowed, and recorded when `p_check_only` is false. }
        '400': { description: 'A machine identity, or a person whose access is removed.' }
        '403': { description: 'Not an Administrator, or your own password.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/record_person_mfa_reset:
    post:
      tags: [Auth]
      summary: Decide, then record, an Administrator resetting a person's second factor
      description: |
        Called twice by `/functions/v1/manage-people`'s `reset-mfa` in the caller's session
        (`0216`): with `p_check_only` true BEFORE GoTrue deletes the person's factors, which checks
        and writes nothing, and with false AFTER, which writes one `MFA_RESET` row in the person's
        lane with their email and `p_factors_removed`. A null `p_check_only` checks only.
        Administrator only. It ends no session.

        Refused, with the reason in the message: your own account (403; you remove your own factor
        on Profile › Security); a machine identity (400); a record with no count, or a negative one
        (400). A removed person's factors may be reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_check_only]
              properties:
                p_user_id:    { type: string, format: uuid }
                p_check_only: { type: boolean, description: True to check only; false to record a reset GoTrue has made. }
                p_factors_removed: { type: integer, minimum: 0, nullable: true, description: 'How many factors GoTrue deleted. Required when `p_check_only` is false.' }
      responses:
        '204': { description: Allowed, and recorded when `p_check_only` is false. }
        '400': { description: 'A machine identity, or a missing or negative count.' }
        '403': { description: 'Not an Administrator, or your own account.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/end_person_session:
    post:
      tags: [Auth]
      summary: End one of a person's sessions
      description: |
        End on a row of the session list in a person's drawer on People (`0212`). Deletes that one
        `auth.sessions` row, so nothing refreshes it again and `auth_pre_request()` refuses its
        access token at the API on the next request (401 `session_not_found`). The person's other
        sessions are untouched. Writes one `SESSIONS_ENDED` row in the person's lane of the Audit
        Trail, with you in `changed_by`: their email, a count of 1 and the session's service name,
        user agent, start and last activity, as `end_my_session()` writes them (`0211`). A removed
        person's session may be ended. Administrator only.

        Refused, with no row written: a session that is not that person's, answered exactly as one
        that does not exist (404); your own session (403; end it on the Profile page's Security
        tab); a machine identity (400, `22023`); an unknown person (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_session_id]
              properties:
                p_user_id:    { type: string, format: uuid }
                p_session_id: { type: string, format: uuid }
      responses:
        '204': { description: The session has ended. }
        '400': { description: 'A machine identity (`22023`).' }
        '403': { description: 'Not an Administrator, or your own session (`42501`).' }
        '404': { description: 'No such person, or no session of theirs with that id (`P0002`).' }

  /rest/v1/rpc/end_person_sessions:
    post:
      tags: [Auth]
      summary: End every session a person holds
      description: |
        End Sessions in a person's drawer on People (`0207`). Deletes every `auth.sessions` row the
        person holds, in every browser and every service, so none of their refresh tokens works and
        `auth_pre_request()` refuses their access tokens at the API on the next request
        (401 `session_not_found`). Writes one `SESSIONS_ENDED` row in the person's lane of the
        Audit Trail: their email and how many sessions ended. They keep their role. A removed
        person's sessions may be ended. Administrator only.

        Refused, with the reason in the message: your own sessions (403; Sign Out of All Other
        Sessions on the Profile page's Security tab ends the others, `0212`); a machine identity
        (400, `22023`). To end one session, call `/rest/v1/rpc/end_person_session`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id]
              properties:
                p_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: How many sessions ended; 0 when they held none.
          content:
            application/json:
              schema: { type: integer }
        '400': { description: 'A machine identity.' }
        '403': { description: 'Not an Administrator, or your own sessions.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/person_session_summary:
    post:
      tags: [Auth]
      summary: Count a person's sessions, and say when one was last active
      description: |
        For a person's drawer on People (`0207`). How many `auth.sessions` rows the person holds,
        and the latest time one was refreshed, updated or started. The list is
        `/rest/v1/rpc/person_sessions` (`0212`). Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id]
              properties:
                p_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: One row.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    open_sessions:  { type: integer }
                    last_active_at: { type: string, format: date-time, nullable: true, description: 'NULL when they hold none.' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/person_sessions:
    post:
      tags: [Auth]
      summary: List a person's sessions, in every browser and service
      description: |
        For the session list in a person's drawer on People (`0212`). One row per GoTrue session the
        person holds, newest activity first, with the columns `/rest/v1/rpc/list_my_sessions`
        returns the person, except `is_current`: your token names your session, never theirs. No
        address is recorded. No rows for a person holding none, or an id that names nobody.
        Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id]
              properties:
                p_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Their sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:             { type: string, format: uuid }
                    service_name:   { type: string, nullable: true, description: "The OAuth client's name for a service's session; null for a dashboard or password sign-in." }
                    user_agent:     { type: string, nullable: true }
                    created_at:     { type: string, format: date-time }
                    last_active_at: { type: string, format: date-time, description: 'The latest of its last refresh, last update and start.' }
                    not_after:      { type: string, format: date-time, nullable: true, description: 'When GoTrue ends it regardless, if ever.' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/check_person_email_change:
    post:
      tags: [Auth]
      summary: Decide whether a person's email address may change
      description: |
        Called by `/functions/v1/manage-people` in the caller's session (`0207`), BEFORE GoTrue
        changes the address. Writes nothing, and answers with the address the person has now.
        The new address is trimmed and lower-cased first. Administrator only.

        Refused, with the reason in the message: your own address (403); a person whose access is
        removed, until it is restored (400, `P0001`); an address another account holds (400,
        `P0001`, naming the address and not the account); the address they already have, or one
        that is not an address (400, `22023`); a machine identity (400, `22023`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_email]
              properties:
                p_user_id: { type: string, format: uuid }
                p_email:   { type: string, format: email }
      responses:
        '200':
          description: The address the person has now.
          content:
            application/json:
              schema: { type: string }
        '400': { description: 'A machine identity, a removed person, a taken address, or not a new address.' }
        '403': { description: 'Not an Administrator, or your own address.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/record_person_email_change:
    post:
      tags: [Auth]
      summary: Record a person's new email address, and end their sessions
      description: |
        Called by `/functions/v1/manage-people` in the caller's session (`0207`), AFTER GoTrue
        changed the address. Refuses unless the account holds `p_email` now. Writes one
        `EMAIL_CHANGED` row (the old and the new address), then ends every session the person
        holds through `end_person_sessions()`, which writes `SESSIONS_ENDED` in the same
        transaction: their access token still carries the old address. Administrator only, and
        never your own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_user_id, p_old_email, p_email]
              properties:
                p_user_id:   { type: string, format: uuid }
                p_old_email: { type: string, description: 'The address check_person_email_change() answered.' }
                p_email:     { type: string, format: email }
      responses:
        '200':
          description: How many sessions ended.
          content:
            application/json:
              schema: { type: integer }
        '400': { description: 'The account does not hold the new address, or no old address was given.' }
        '403': { description: 'Not an Administrator, or your own address.' }
        '404': { description: 'No such person (`P0002`).' }

  /rest/v1/rpc/record_broker_account_created:
    post:
      tags: [Auth]
      summary: Record a read-only broker account made
      description: |
        Called by `/functions/v1/broker-subscriber` in the caller's session (`0218`), AFTER the
        broker made the account. Writes one `INSERT` row in the `broker_accounts` lane of the
        security domain: the name, description, MQTT username and role (`subscriber`), with you
        in `changed_by`. Never a password. The entity id is the username's 21 hex characters
        padded with zeros, so the deletion's row shares it. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_username, p_name, p_description]
              properties:
                p_username:    { type: string, pattern: '^sub[0-9a-f]{21}$' }
                p_name:        { type: string, description: '1-80 characters after trimming, on one line.' }
                p_description: { type: string, description: '1-500 characters after trimming, on one line.' }
      responses:
        '200':
          description: The audit row's id.
          content:
            application/json:
              schema: { type: integer }
        '400': { description: 'A username outside the subscriber scheme, or a name or description outside the rule (`22023`).' }
        '403': { description: 'Not an Administrator (`42501`).' }

  /rest/v1/rpc/record_broker_account_deleted:
    post:
      tags: [Auth]
      summary: Record a read-only broker account deleted
      description: |
        Called by `/functions/v1/broker-subscriber` in the caller's session (`0218`), AFTER the
        broker deleted the account. Writes one `DELETE` row in the `broker_accounts` lane: the
        name and description the broker held (NULL where it held none) and the MQTT username, with
        you in `changed_by`, under the entity id the creation's row carries. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_username]
              properties:
                p_username:    { type: string, pattern: '^sub[0-9a-f]{21}$' }
                p_name:        { type: string, nullable: true }
                p_description: { type: string, nullable: true }
      responses:
        '200':
          description: The audit row's id.
          content:
            application/json:
              schema: { type: integer }
        '400': { description: 'A username outside the subscriber scheme (`22023`).' }
        '403': { description: 'Not an Administrator (`42501`).' }

  # ------------------------------------------------------------ Registry ----
  /rest/v1/asset_config:
    get:
      tags: [Registry]
      summary: Read device birth (DBIRTH) parameters
      description: |
        Configuration metrics announced by a device in its Sparkplug B birth certificate —
        firmware version, serial number, thresholds, interlocks. Written by the ingestion
        daemon on every `DBIRTH`, upserted per `(asset_id, metric_name)`.

        **`asset_id` is the device's `sparkplug_id`**, not its name and not its UUID.

        Recorded for quarantined devices too, so an administrator can inspect what a newly
        discovered device claims before approving it.
      parameters:
        - { name: asset_id, in: query, schema: { type: string }, description: 'Device Sparkplug ID, e.g. `eq.dev220000000000400080000`.' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Birth parameters for the device.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AssetConfigRow' } }

  /rest/v1/schemas:
    get:
      tags: [Registry]
      summary: List schema versions
      description: |
        A schema is **versioned, not edited**. `status` is `draft` | `active` | `archived`;
        an `active` or `archived` row is frozen by a trigger that binds every application
        role. `schema_name` stays UNIQUE, so each version carries a derived name
        (`Foo` → `Foo_v2`).

        Filter to the working set with `?status=in.(draft,active)`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: status, in: query, schema: { type: string }, description: '`eq.active` | `eq.draft` | `eq.archived`' }
        - { name: parent_schema_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>` to walk a lineage.' }
      responses:
        '200':
          description: Schema registry entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Schema' } }
    patch:
      tags: [Registry]
      summary: Edit a DRAFT schema
      description: |
        Only a `draft` row is writable. A PATCH against an `active` or `archived` version is
        rejected by `prevent_active_schema_mutation()` — including with the service role.

        A draft inherits its parent's `semantic_id` and `semantic_id_type` from `fork_schema()`,
        so the draft is where a wrong claim is corrected or cleared. The dashboard's draft save
        sends the pair together, with the type NULL whenever the id is.

        `version` and `status` cannot be set directly: use the two RPCs below.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                schema_definition: { type: object, description: JSON Schema document. }
                change_description: { type: string }
                semantic_id: { type: string, nullable: true }
                semantic_id_type: { $ref: '#/components/schemas/SemanticIdType' }
      responses:
        '204': { description: Updated. }
        '400': { description: The target is not a draft, or a frozen column was sent. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/fork_schema:
    post:
      tags: [Registry]
      summary: Fork a published schema into the next draft version
      description: |
        `version` is computed from the parent — **there is no manual version input, by
        design.** At most one open draft per parent, enforced by a partial unique index.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_schema_id]
              properties:
                parent_schema_id: { type: string, format: uuid }
                change_description: { type: string, nullable: true }
      responses:
        '200':
          description: The new draft.
          content:
            application/json:
              schema: { type: object, description: 'The created draft row as JSON.' }
        '400': { description: The parent already has an open draft. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/rpc/publish_schema_version:
    post:
      tags: [Registry]
      summary: Publish a draft, archiving its predecessor
      description: |
        One transaction: flips the draft to `active`, archives the predecessor, repoints every
        `device_submodels` row, and logs each repoint to the Audit Trail under its device.
        `devices_rebound` and `submodels_rebound` count the repointed rows. `schema_ids_rebound`
        is always 0, since the `devices.schema_id` column it counted was removed in 1.3.0. It is
        deprecated, and removed no sooner than 1.7.0.

        A device attached to both versions has its redundant old attachment dropped first, or
        the repoint would collide on `uq_device_submodels`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_schema_id]
              properties:
                draft_schema_id: { type: string, format: uuid }
      responses:
        '200':
          description: The now-active version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: object, description: 'The published row as JSON.' }
                  archived_schema_id: { type: string, format: uuid, nullable: true, description: 'The parent it archived; NULL for a first version.' }
                  archived_schema_name: { type: string, nullable: true }
                  devices_rebound: { type: integer, description: 'Attachments repointed from the parent to this version.' }
                  submodels_rebound: { type: integer, description: 'The same count as `devices_rebound`.' }
                  schema_ids_rebound: { type: integer, enum: [0], deprecated: true, description: 'Always 0: the `devices.schema_id` column it counted was removed in 1.3.0. Deprecated in 1.6.0, and removed no sooner than 1.7.0. Read `devices_rebound`.' }
                  duplicate_submodels_removed: { type: integer, description: 'Old-version attachments dropped from a device that already carried this version.' }
        '400': { description: The target is not a draft. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/device_submodels:
    get:
      tags: [Registry]
      summary: Schemas attached to a device
      description: |
        Many schemas per device, one AAS Submodel each. This is the one place a device's schemas
        are attached: the Devices page writes them through `rpc/set_device_schemas`. 1.3.0
        removed `devices.schema_id`, the column 1.1.0 deprecated, and moved what it held into
        rows here. **Prefer `device_schemas`** for reading — it is what ingestion, the AAS
        export, i3X, the Directory and the frontend resolve through.

        The modelled metric set is the **union** across attachments. Judging a device against
        one schema flags it for publishing what another of its own submodels accounts for.
      parameters:
        - $ref: '#/components/parameters/Select'
        - { name: device_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '200':
          description: Attachments.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceSubmodel' } }
    post:
      tags: [Registry]
      summary: Attach a schema to a device
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, schema_id]
              properties:
                device_id: { type: string, format: uuid }
                schema_id: { type: string, format: uuid }
                submodel_key: { type: string, nullable: true }
      responses:
        '201': { description: Attached. }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Registry]
      summary: Detach a schema from a device
      description: 'Ordinary reconfiguration — reversible, and it changes no wire contract.'
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '204': { description: Detached. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/device_schemas:
    get:
      tags: [Registry]
      summary: Resolved schema attachments
      description: |
        Read-only view, one row per (device, schema): every `device_submodels` row. `source` is
        always `device_submodels`, and is deprecated: it is removed no sooner than 1.7.0.
        Read this rather than `device_submodels` unless you are writing attachments.
      parameters:
        - $ref: '#/components/parameters/Select'
        - { name: device_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '200':
          description: Resolved attachments.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceSchema' } }

  /rest/v1/rpc/set_device_schemas:
    post:
      tags: [Registry]
      summary: Set a device's schemas
      description: |
        Makes the device's schemas exactly `p_schema_ids`, in one transaction: inserts the missing
        `device_submodels` rows and deletes the rest.
        An empty array detaches every schema. A row the device keeps keeps its `submodel_key`.
        This is how the Devices page saves its schema picker. `Administrator` or
        `Shopfloor_Manager`.

        An archived schema is refused unless the device already carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_device_id, p_schema_ids]
              properties:
                p_device_id: { type: string, format: uuid }
                p_schema_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: The device's schemas after the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id: { type: string, format: uuid }
                  schema_ids: { type: array, items: { type: string, format: uuid } }
                  attached: { type: integer, description: Schemas the device did not carry before. }
                  detached: { type: integer, description: Schemas the device no longer carries. }
        '400': { description: An archived schema the device does not already carry. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/metric_catalog:
    get:
      tags: [Registry]
      summary: List the metrics this deployment's devices publish
      description: |
        Deployment state, not the standard. Filter with `?deprecated=is.false` for the active
        set, or `?metric_group=eq.Axes` for one component path.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: metric_group, in: query, schema: { type: string }, description: 'e.g. `eq.Axes`, or `is.null` for ungrouped.' }
        - { name: deprecated, in: query, schema: { type: string }, description: 'e.g. `is.false`' }
        - { name: standard, in: query, schema: { type: string }, description: '`eq.MTConnect` | `eq.ISO 22400` | `eq.OPC UA` | `is.null` for a local extension.' }
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MetricCatalogEntry' } }
    post:
      tags: [Registry]
      summary: Add a metric to the catalog
      description: |
        **`name` is immutable once created** — a device is configured against that exact
        string. Changing a metric is deprecate-and-supersede, never a rename.

        `name` must match `^[A-Za-z0-9_]+(/[A-Za-z0-9_]+)*$` — the Factory+ format, enforced
        by `metric_catalog_name_format` (archived migration 0007). `/` separates folders; only
        alphanumerics and `_` are legal inside a segment. **`.` is not a legal character.**

        The group is derived from the first segment and its spelling is checked against
        `metric_groups` plus the groups already in use, case-insensitively.
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricCatalogWrite' }
      responses:
        '201': { description: Created. }
        '400': { description: 'Name format, group spelling, or `semantic_id_type` CHECK violation.' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Registry]
      summary: Deprecate, restore, or correct the semantic id of a metric
      description: |
        `name` and `datatype` are refused by `enforce_metric_catalog_immutability()`; every other
        column may change. The three writes the dashboard makes:

        * **Deprecate** — `{"deprecated": true, "superseded_by": "<uuid>" | null}`, sent by
          `POST /api/v1/metric-catalog/{id}/deprecate`. The schema builder stops offering the
          metric; schemas that model it, and its readings, are unchanged.
        * **Restore** — `{"deprecated": false, "superseded_by": null}`, sent by
          `POST /api/v1/metric-catalog/{id}/restore`. The pointer is cleared with the flag:
          a current metric that still named a replacement would be current and replaced at once.
        * **Edit** — `{"semantic_id": "<id>" | null, "semantic_id_type": "IRI" | "IRDI" | "ExpandedNodeId" | null}`,
          sent by `PUT /api/v1/metric-catalog/{id}`. Only the pair, with the type NULL whenever the
          id is. A semantic id is an assertion about the metric, not part of what a device
          publishes, so it is corrected in place; every shell exported from a schema that models the
          metric carries the new id.

        Administrator only (`metric_catalog_update_privileged`). A caller the policy does not admit
        matches no row, so nothing changes and no error is raised; send
        `Prefer: return=representation` and treat an empty array as refused. Always send a filter,
        e.g. `?id=eq.<uuid>`; an unfiltered PATCH updates every row.
      parameters:
        - { name: id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deprecated: { type: boolean }
                superseded_by: { type: string, format: uuid, nullable: true, description: 'The replacement. NULL on restore.' }
                semantic_id: { type: string, nullable: true }
                semantic_id_type: { $ref: '#/components/schemas/SemanticIdType' }
      responses:
        '200': { description: 'Updated, with `Prefer: return=representation`. An empty array means no row was admitted.' }
        '204': { description: Updated. }
        '400': { description: '`name` or `datatype` in the body; both are immutable.' }

  /rest/v1/uncatalogued_metrics:
    get:
      tags: [Registry]
      summary: List the metric names devices declare that the catalog does not describe
      description: |
        Read-only view (`0189`), one row per name a device's last DBIRTH declared
        (`devices.last_birth_metrics`) that no `metric_catalog` row has. A deprecated row counts as
        catalogued, and names match exactly, case included. Archived devices, replay lanes and the
        Sparkplug control metrics (`bdSeq`, `Node Control/*`, `Device Control/*`) are left out;
        quarantined devices are not. The Metrics page's Uncatalogued tab reads it, ordered with
        `?order=metric_name`.

        `security_invoker`, so the caller's own policies on the tables beneath apply.
        `authenticated` only; `anon` is refused.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: metric_name, in: query, schema: { type: string }, description: 'e.g. `eq.Spindle/LOAD`, or `like.Spindle/*`' }
      responses:
        '200':
          description: Uncatalogued names.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UncataloguedMetric' } }

  /rest/v1/metric_groups:
    get:
      tags: [Registry]
      summary: List approved metric-group spellings
      description: |
        A registry of approved **spellings**, not of group membership — membership is always
        derived from the metric name. Seeded from MTConnect's component types.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Group registry entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MetricGroup' } }

  /rest/v1/mtconnect_vocabulary:
    get:
      tags: [Registry]
      summary: Read the MTConnect controlled vocabularies
      description: |
        Reference data, read-only: 249 data item types, 123 subtypes, 100 units and 126
        component types. Filter by `?kind=eq.DATA_ITEM_TYPE&category=eq.SAMPLE`.

        **This is a vocabulary, not a catalog.** `ANGLE` is a type; `Axes/C/ANGLE` is the
        metric. Do not seed data item types into `metric_catalog`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: kind, in: query, schema: { type: string }, description: '`eq.DATA_ITEM_TYPE` | `eq.SUB_TYPE` | `eq.UNIT` | `eq.NATIVE_UNIT` | `eq.COMPONENT`' }
        - { name: category, in: query, schema: { type: string }, description: 'DATA_ITEM_TYPE rows only, e.g. `eq.SAMPLE`.' }
      responses:
        '200':
          description: Vocabulary entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MTConnectVocabularyEntry' } }
        '401': { description: 'Not authenticated; `anon` is revoked on this table.' }

  /rest/v1/iso22400_vocabulary:
    get:
      tags: [Registry]
      summary: Read the ISO 22400 KPI definitions
      description: |
        Eight KPI definitions. Reference data on the same terms as the MTConnect vocabulary.

        **ISO 22400-2 calls the second OEE factor *Effectiveness*, not Performance.**
        A metric for it is named after the KPI, as the example `OEE/EFFECTIVENESS` is. The index
        on `metric_catalog.semantic_id` is deliberately not unique: a deprecated metric and its
        replacement carry the same id.

        `kpi_id` is the ISO **symbol**, not a clause number — none are asserted, because the
        standard is paywalled and they could not be checked.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: category, in: query, schema: { type: string }, description: 'KPI family, e.g. `eq.Effectiveness`.' }
      responses:
        '200':
          description: KPI definitions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ISO22400VocabularyEntry' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/opcua_vocabulary:
    get:
      tags: [Registry]
      summary: Read the OPC UA companion-specification data points
      description: |
        75 data points from six companion specifications: OPC 40001 (Machinery), OPC 40001-4
        (Machinery Energy), OPC 40010 (Robotics), OPC 30050 (PackML), OPC 40501 (Machine Tools)
        and OPC 40540 (Additive Manufacturing).

        **`node_id` and `semantic_id` are the ExpandedNodeId the specification publishes** —
        `nsu=<namespace URI>;i=<id>`, the NodeId its NodeSet2 XML declares for the data point.
        Every row is generated from the NodeSets by `scripts/generate-opcua-vocabulary.mjs`, which
        verifies each browse name and reads its datatype and NodeId from the specification. Before
        1.2.0 `node_id` was a browse path and `semantic_id` the namespace URI plus the name.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: companion_spec, in: query, schema: { type: string }, description: 'e.g. `eq.OPC 40010`' }
      responses:
        '200':
          description: Companion-spec data points.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OPCUAVocabularyEntry' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/ashrae223_vocabulary:
    get:
      tags: [Registry]
      summary: Read the ASHRAE 223P building-system concepts
      description: |
        640 concepts generated from the open223 ontology (`v1.0.0-2026`, Apache-2.0) by
        `scripts/generate-ashrae223-vocabulary.mjs`. Reference data: a row is a concept the
        standard defines.

        Unlike the machine vocabularies these name **things, not readings** — `Fan` is a class of
        equipment, so a point using it still has to say what is measured. `subclass_of` is the
        immediate superclass and is what the vocabulary panel sections on.

        **⚠ The standard is not published.** ASHRAE 223 is still 223P / 223-202x and in public
        review; concepts may change before it is final.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: concept_kind, in: query, schema: { type: string }, description: 'e.g. `eq.Class`' }
        - { name: subclass_of, in: query, schema: { type: string }, description: 'e.g. `eq.Equipment`' }
      responses:
        '200':
          description: 223P concepts.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ASHRAE223Concept' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/idta_submodel_templates:
    get:
      tags: [Registry]
      summary: Read the IDTA submodel-template element definitions
      description: |
        Reference data: the elements an IDTA Asset Administration Shell submodel template defines,
        with the identifiers IDTA publishes for them. Currently IDTA 02006-3-0-1 Digital Nameplate
        (`template_id` `https://admin-shell.io/idta/nameplate/3/0/Nameplate`).

        **`semantic_id` is issued by IDTA, IEC CDD or ECLASS — never minted here.** Most are IRDIs
        (`0112/2///61987#ABA951#009`); a few are admin-shell.io IRIs. `semantic_id_type` says which.

        `is_mandatory` records what the template requires. It is descriptive: the AAS exporter
        deliberately does **not** claim the template id on the submodel it builds, because a shell
        that named the template while omitting mandatory elements would fail validation against it.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: template_id, in: query, schema: { type: string }, description: 'e.g. `eq.https://admin-shell.io/idta/nameplate/3/0/Nameplate`' }
      responses:
        '200':
          description: Template element definitions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IDTASubmodelTemplateElement' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/concept_definitions:
    get:
      tags: [Registry]
      summary: Read each vocabulary concept's own definition
      description: |
        A view: one row per semantic id a vocabulary defines, with that vocabulary's own text.
        It unions the IDTA templates, ASHRAE 223P, OPC UA and ISO 22400. MTConnect contributes
        nothing yet, because `mtconnect_vocabulary` has no description column. A row with no
        text is left out.

        **An id held by two vocabularies takes the first** in the order IDTA, ASHRAE 223P, OPC UA,
        ISO 22400: the one whose ids are issued furthest from this deployment. No id is shared
        today.

        The AAS exporter reads it for each ConceptDescription's `definition`. Filter by
        `?semantic_id=in.(…)`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
        - { name: semantic_id, in: query, schema: { type: string }, description: 'e.g. `eq.http://data.ashrae.org/standard223#TemperatureSensor`' }
        - { name: standard, in: query, schema: { type: string }, description: '`eq.IDTA` | `eq.ASHRAE 223P` | `eq.OPC UA` | `eq.ISO 22400`' }
      responses:
        '200':
          description: Concept definitions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConceptDefinition' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/platform_alerts:
    get:
      tags: [Registry]
      summary: Read the Grafana alert occurrence log
      description: |
        One row per alert **occurrence**, written by the `grafana-alert-webhook` edge function when
        Grafana notifies. Append-only on `(fingerprint, starts_at)`: a Grafana fingerprint is a hash
        of the alert instance's labels and is stable across every fire → resolve → fire cycle, so
        pairing it with `starts_at` is what makes this a history rather than a latest-state table.
        An occurrence transitions `firing` → `resolved` in place.

        **Nothing in this platform evaluates alert conditions.** Grafana owns the rules, the
        evaluation interval, the state history and the silences — see
        `grafana/provisioning/alerting/`. This table is the landing record, and it is what the
        dashboard subscribes to over Realtime.

        `sparkplug_id` is the immutable wire identity, never the device name. `device_id` is resolved
        at write time and is nullable: an alert that fired is a thing that happened, and it is kept
        even when no device row matches.

        `anon` is revoked. An alert summary names a device and the condition it breached.

        A row whose `entity_type` is `service_identity` is about a machine identity's token
        nearing expiry (0204). It carries the principal id and no `sparkplug_id`, and only an
        Administrator reads it; every other role is returned the other rows.
      parameters:
        - { name: sparkplug_id, in: query, schema: { type: string }, description: 'e.g. `eq.dev220000000000400080000`' }
        - { name: status, in: query, schema: { type: string, enum: [firing, resolved] }, description: 'e.g. `eq.firing`' }
        - { name: severity, in: query, schema: { type: string, enum: [critical, warning, info] } }
        - { name: starts_at, in: query, schema: { type: string, format: date-time }, description: 'e.g. `gte.2026-08-17T00:00:00Z`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Matching alert occurrences.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceAlert' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/captures:
    get:
      tags: [Storage]
      summary: List stored broker captures
      description: |
        The capture that EXISTS for a subject — **at most one per gateway and one per device**,
        enforced by two partial unique indexes. A new recording replaces the stored one; that is
        what bounds the `broker-captures` bucket.

        Filed **by the subject recorded**, not by the gateway a capture plays back as: a device
        capture lives under its own `dev…` prefix, at a path of its own
        (`<subject>/<job or upload id>.json`; `<subject>/capture.json` for one stored before 1.5).
        `storage_path` is where the bytes are, and the object is fetched with the ordinary Storage API.

        `manifest` describes a file nobody has downloaded — the metric names (capped at 50, with
        `metric_name_count` beside them), the topic count, the observed rate, and **`birth_captured`**.
        That last field is the one to read before trusting a capture: `false` means the recording
        contains no `NBIRTH`, so a playback refuses it, since a replay opens with the edge node's
        birth certificate. A capture stored before 1.5 set it for a `DBIRTH` alone too.

        `source` distinguishes a capture the daemon recorded from one uploaded through the browser.
        An uploaded capture has no `capture_jobs` row at all, which is why the artifact is a table
        of its own.

        **Writes do not happen here.** INSERT and UPDATE are refused for every application role;
        `start_capture_job()` and, for an upload, `begin_capture_upload()` then
        `register_uploaded_capture()` are the only doors. An upload begins on the server, which
        decides whether it may replace the stored capture and issues the path to upload to; the
        bucket admits a person's write to that path alone. DELETE is permitted directly, for
        `Administrator` and `Shopfloor_Manager`. Delete the row first: the bucket refuses to delete
        a file a row still names, and once the row is gone the object is removed through the Storage
        API (the ingestion daemon deletes any left behind within the hour).

        **Each act is in the Audit Trail (0193).** Storing a capture writes `CAPTURE_UPLOADED` or
        `CAPTURE_RECORDED`, and every deletion writes `CAPTURE_DELETED`, with why: deleted, replaced
        by an upload or a recording, or deleted with its gateway or device. A download goes through
        `issue_capture_download()` first, which writes `CAPTURE_DOWNLOAD_ISSUED`: the bucket admits a
        person to a stored capture's file only in the minute after it (0195).
      parameters:
        - { name: subject_kind, in: query, schema: { type: string, enum: [gateway, device] }, description: 'e.g. `eq.gateway`' }
        - { name: gateway_id, in: query, schema: { type: string, format: uuid } }
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [recorded, uploaded] } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Stored captures visible to the caller.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Capture' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/capture_jobs:
    get:
      tags: [Storage]
      summary: Read broker capture jobs, running and finished
      description: |
        One row per recording **attempted**, including the ones that failed. At most one row is
        `PENDING` or `RECORDING` at a time across the whole stack — a partial unique index enforces
        that, so two browser tabs cannot race it.

        **This is the progress feed.** The ingestion daemon updates `messages`, `bytes`,
        `elapsed_seconds` and `birth_captured` about once a second while recording, and the table is
        in the `supabase_realtime` publication with `REPLICA IDENTITY FULL` so a subscriber receives
        whole rows rather than the changed columns alone.

        **Ending a capture early is `request_capture_stop()`, not a write here.** The daemon serves
        exactly one HTTP endpoint — Prometheus `/metrics` — so there is no REST tier to host a stop
        call, and a flag the daemon reads on its next one-second progress tick survives a page
        reload. A recording the daemon has not reported on for two minutes is ended by the call
        itself, `CANCELLED` with nothing stored.

        A row left at `RECORDING` by a daemon restart is swept to `FAILED` at startup. Without that
        the single-flight index would keep matching it and refuse every future capture.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RECORDING, COMPLETED, FAILED, CANCELLED] }, description: 'e.g. `in.(PENDING,RECORDING)`' }
        - { name: subject_kind, in: query, schema: { type: string, enum: [gateway, device] } }
        - { name: gateway_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Capture jobs visible to the caller.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CaptureJob' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/rpc/issue_capture_download:
    post:
      tags: [Storage]
      summary: Record a capture download and answer the path to sign
      description: |
        Writes `CAPTURE_DOWNLOAD_ISSUED` to the Audit Trail, naming the caller and the capture, and
        answers the capture's `storage_path`. It also opens a 60-second grant for the caller to read
        that file, and the `broker-captures` bucket admits a person to a stored capture's file by
        nothing else (0195). So sign the link with the Storage API straight after this answers: a
        link signed later, or without this call, is refused. The dashboard signs nothing when this
        refuses. `Administrator`, `Shopfloor_Manager` or `Auditor`, the roles the bucket admits to
        read (0193).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_storage_path]
              properties:
                p_storage_path: { type: string, description: 'The `storage_path` of a row in `captures`.' }
      responses:
        '200':
          description: The path, for the caller to sign.
          content:
            application/json:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'No stored capture has that path: it was deleted or replaced.' }

  /rest/v1/backup_jobs:
    get:
      tags: [Storage]
      summary: Read backup jobs, queued, running and finished
      description: |
        One row per backup **attempted** (`0101`), including the ones that failed. At most one row
        is `PENDING` or `RUNNING` at a time across the stack, enforced by a partial unique index.

        **Administrator only**, on the read as on every write: RLS admits no other role, so every
        other caller receives an empty array rather than a refusal.

        **Writes do not happen here.** `request_backup()` and the service's own gates are the only
        doors; `cancel_backup_job()` withdraws a `PENDING` row. The backup service claims the row,
        takes the backup and finalises it into a `backups` row, so a `COMPLETED` job carries
        `backup_id` and a `FAILED` one carries `error`. A row left `RUNNING` by a service restart
        is failed at the next start.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }, description: 'e.g. `in.(PENDING,RUNNING)`' }
        - { name: origin, in: query, schema: { type: string, enum: [requested, scheduled] } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Backup jobs, for an Administrator; an empty array for anyone else.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BackupJob' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/backups:
    get:
      tags: [Storage]
      summary: Read the backups that exist
      description: |
        One row per backup **on the backup volume** (`0101`): where it is, how big, which
        components it holds with their digests, and whether it is pinned. The row is deleted when
        the service prunes the files; `BACKUP_PRUNED` in `audit_trail` is the record that it did.

        **The bytes are not served.** Nothing here or in Storage hands a dump to a browser: it
        holds every user account, every service credential's hash, the whole audit trail and the
        historian's password. `location` is a path inside the service's container, for the runbook.

        **Administrator only.** Written by `backup_finalise()` alone; `release_backup()` is the
        one change a user can make.
      parameters:
        - { name: origin, in: query, schema: { type: string, enum: [requested, scheduled] } }
        - { name: pinned, in: query, schema: { type: boolean }, description: 'e.g. `eq.true`' }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Backups, for an Administrator; an empty array for anyone else.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/rpc/request_backup:
    post:
      tags: [Storage]
      summary: Queue a backup of the whole stack
      description: |
        Both databases, the storage objects and the forge, taken by the backup service and
        **pinned** until `release_backup()`. Administrator only, checked server-side. Refuses while
        another backup is queued or running, naming it: a `PENDING` row nobody has claimed means no
        backup service is running, and the message says so. Writes `BACKUP_REQUESTED` naming the
        caller.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_note: { type: string, nullable: true, description: 'Why it is being taken; kept with the backup.' }
      responses:
        '200':
          description: Queued, with the job id.
          content:
            application/json:
              schema: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'A backup is already queued or running; the message names it.' }

  /rest/v1/rpc/cancel_backup_job:
    post:
      tags: [Storage]
      summary: Withdraw a queued backup
      description: |
        `PENDING` only: a `RUNNING` job is the service's, and a row flipped under it would leave a
        finished backup recorded as one that did not happen. Administrator only. Returns `false`
        when the job had already been claimed or finished, which is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_job_id]
              properties:
                p_job_id: { type: string, format: uuid }
      responses:
        '200':
          description: Whether the job was cancelled.
          content:
            application/json:
              schema: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/release_backup:
    post:
      tags: [Storage]
      summary: Let the retention window apply to a requested backup
      description: |
        Clears `pinned` and records who released it. Nothing is deleted here: the service prunes
        on its next pass, and only once the backup is older than its retention window.
        Administrator only. Returns `false` when the backup was not pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_backup_id]
              properties:
                p_backup_id: { type: string, format: uuid }
      responses:
        '200':
          description: Whether the backup was pinned and is now released.
          content:
            application/json:
              schema: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/rpc/backup_summary:
    post:
      tags: [Storage]
      summary: The Backups page's figures in one object
      description: |
        Whether backups are heading for trouble, which the run list cannot say: the last success
        (when the newest completed job started, `backup_health`'s clock) and the latest outcome;
        successes out of the runs that ended in the last 30 days, completed or failed; the median
        duration of the last 14 completed runs; the backups held, their bytes, the oldest
        `taken_at` and the newest backup's size; the newest copy off site, at the current
        destination once one is set; and `service`, what the backup service last reported of its
        volume (`statfs` on `/backups`; on local-path the node's whole disk) and its schedule, or
        null before its first report. Administrator only.
      responses:
        '200':
          description: The summary. Times are ISO 8601, sizes bytes, durations seconds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_recorded_at: { type: string, format: date-time, nullable: true }
                  last_success:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
                      started_at: { type: string, format: date-time }
                      finished_at: { type: string, format: date-time }
                      duration_seconds: { type: number }
                  latest_outcome:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [COMPLETED, FAILED] }
                      started_at: { type: string, format: date-time, nullable: true }
                      finished_at: { type: string, format: date-time }
                  runs_30d: { type: integer }
                  succeeded_30d: { type: integer }
                  median_duration_seconds: { type: number, nullable: true }
                  median_runs: { type: integer }
                  backups_held: { type: integer }
                  bytes_held: { type: integer }
                  oldest_taken_at: { type: string, format: date-time, nullable: true }
                  newest_size_bytes: { type: integer, nullable: true }
                  offsite_destination_set: { type: boolean }
                  newest_offsite:
                    type: object
                    nullable: true
                    properties:
                      stamp: { type: string }
                      taken_at: { type: string, format: date-time }
                      copied_at: { type: string, format: date-time }
                  service:
                    type: object
                    nullable: true
                    properties:
                      reported_at: { type: string, format: date-time }
                      volume_free_bytes: { type: integer, nullable: true }
                      volume_total_bytes: { type: integer, nullable: true }
                      schedule: { type: string, description: 'BACKUP_SCHEDULE as the service runs it; empty when scheduled backups are off.' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/playback_jobs:
    get:
      tags: [Storage]
      summary: Read broker playback jobs, running and finished
      description: |
        One row per playback attempted — a stored capture published back into the stack as the
        Playback gateway, through the real broker and down the real ingestion path.

        At most one row is `PENDING` or `RUNNING` **per target gateway**, enforced by a partial
        unique index. That is narrower than the capture equivalent on purpose: two publishers on one
        edge node interleave their Sparkplug sequence numbers, which the daemon reports as permanent
        message loss. The target is always the Playback gateway, so in practice one playback runs
        at a time.

        **Starting one is `start_playback_job()`, and there is no other way.** The table takes no
        direct write from any application role, because the checks that matter live inside that
        function and the table's trigger. The target must be the seeded Playback gateway:
        `start_playback_job()` refuses a gateway that is not `is_simulated` (0052), the trigger one
        that is not `is_shadow`, and `is_shadow` cannot be set or changed through the API (0187). The
        target must hold a broker credential the platform issued, not re-issued since the playback
        worker last reported picking one up. Every value in `device_map` must be an active replay lane
        of that gateway, and the lane of the device its key names (0187): a replay writes into the
        history of the device it publishes as, so a real device, or another device's lane, is
        refused. A recorded device the map leaves out is refused too, when the worker plans the
        playback (`capture.plan_playback()`), and the job fails saying which.

        **Stopping one is `request_playback_stop()`**, which sets `stop_requested`; the worker
        observes it within a second, because it reports progress at least once a second while a job
        runs. A `RUNNING` job whose worker has not reported for over a minute is ended by the call
        itself, as `CANCELLED` (0191). Progress arrives over Realtime.

        **The record outlives the capture and the target (0193).** Starting and stopping a playback
        write `PLAYBACK_STARTED` and `PLAYBACK_STOPPED`, naming the capture and the target. Deleting
        the capture leaves `capture_id` null and the row standing, and a gateway these rows name
        cannot be deleted (409): archive it instead. When the worker records a `RUNNING` job's end,
        the Playback gateway and its lanes are set `OFFLINE` if they still read `ONLINE`, because a
        session the broker cut sends no Will.

        `speed` divides both the send schedule and the timestamp rebasing, so it is bounded to
        `(0, 60]`, and `start_playback_job()` clamps `p_speed` into `[0.01, 60]`: zero becomes a
        hundredth of real time, never "as fast as possible". The historian inserts
        `ON CONFLICT (time, asset_id, metric_name) DO NOTHING`, so a burst would write one row per
        metric and silently discard the rest.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] } }
        - { name: target_gateway_id, in: query, schema: { type: string, format: uuid } }
        - { name: capture_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Playback jobs visible to the caller.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlaybackJob' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/rebirth_requests:
    get:
      tags: [Assets]
      summary: Read requests for an edge node to republish its birth certificate
      description: |
        One row per `Node Control/Rebirth` an operator has asked for. The ingestion daemon claims
        `PENDING` rows and publishes the NCMD; the answer arrives as an `NBIRTH` on the wire, not as
        a response here.

        **A birth certificate is where the metric alias table lives**, and that table is in-memory
        in the daemon — so a restart loses it and a stable device may not birth again for weeks.
        The daemon already asks on its own at startup, on every sequence gap, and at the start of
        every broker capture. This is the same publish with a person as the reason.

        **This is the only command this stack sends.** Sparkplug's NCMD channel can also write
        metric *values*, which is actuation; that is not reachable from the dashboard, the daemon's
        broker role grants it this one topic pattern, and `0058` carries a self-check that fails if this
        table ever gains a column able to carry a payload. A rebirth asks a node to restate what it
        already is — it changes nothing on the plant, and a node that ignores it is unaffected.

        At most one row is `PENDING` per gateway: a second would only be refused by the daemon's own
        per-node throttle, producing a row whose outcome is "throttled" and a button that appeared
        to do something.

        Created only by `request_gateway_rebirth()`; the table takes no direct write.
      parameters:
        - { name: gateway_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, FAILED] } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Rebirth requests visible to the caller.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RebirthRequest' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/playback_worker_status:
    get:
      tags: [Storage]
      summary: Read what the playback worker can publish as
      description: |
        One row, holding the gateway `sparkplug_id`s the playback worker has broker passwords for
        and when it last said so.

        **It exists because the database cannot know this.** `gateway_has_broker_credential()`
        answers whether the *platform* issued a gateway a credential — an audit row, or an enrolment
        stamp. Whether the *worker* holds that password is a fact about a running process: issuing a
        credential delivers it to the worker's file (archived migration 0078), and the worker picks
        it up on a later pass, or never if the delivery fails. Before this,
        the playback dialog showed a target as ready and the job failed a second later with
        `this worker holds no broker credential for …`.

        **`reported_at` is a heartbeat, and the distinction it draws matters.** An empty
        `held_edge_nodes` with a recent timestamp means the worker is running and holds nothing; a
        stale timestamp means the worker is not running. Those are different problems with different
        fixes, and an empty list alone cannot tell them apart.

        **No secret is here.** A `sparkplug_id` is a public identifier — it is on the Gateways page,
        in every topic, and is the MQTT username. The passwords are deliberately absent, for the
        reason `0041` gives about credentials in readable tables.

        Written only by `playback_report_credentials()`, which the worker's principal alone may
        call. The table takes no direct write from any application role.
      responses:
        '200':
          description: The worker's most recent report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackWorkerStatus' }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/system_settings:
    get:
      tags: [Registry]
      summary: Read the runtime configuration plane
      description: |
        Runtime settings an `Administrator` may change without a container restart — retention
        windows, cold-storage endpoints, UI limits.

        **The key set is closed.** RLS grants `UPDATE` and nothing else: there is no `INSERT`
        policy and no `DELETE` policy, so `POST` and `DELETE` here are denied for every caller
        except `service_role`. A new setting arrives by MIGRATION, declared beside the code that
        reads it. A settings row exists so that code can read a value; a row nobody reads is a
        note that looks like configuration.

        **Readable by every authenticated user, and that is the design.** A setting shapes what a
        page renders, so restricting reads to `Administrator` would break that page for everyone
        else in a way that looks like a bug. The consequence is a hard rule: **nothing secret goes
        in this table.** S3 access keys and OIDC client secrets belong in Supabase Vault, which is
        a separate mechanism. When cold storage lands, the endpoint goes here and the credential
        does not.

        `value` is `jsonb` and `value_type` says what it holds; a CHECK constraint enforces the
        pair, so a reader may trust the type. `anon` is revoked.
      parameters:
        - { name: key, in: query, schema: { type: string }, description: 'e.g. `eq.ui.audit_trail_poll_seconds`' }
        - { name: category, in: query, schema: { type: string }, description: 'e.g. `eq.Audit Trail`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Matching settings.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SystemSetting' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }
    patch:
      tags: [Registry]
      summary: Change a setting's value
      description: |
        `Administrator` only, and **`value` is the only writable column** — a column-level grant,
        not merely a policy. `updated_by` is stamped by trigger from the JWT subject, so it is
        provenance rather than a field the caller may dictate; `key` and `value_type` are
        immutable because a reader was written against both.

        A non-Administrator receives `204` with zero rows affected rather than an error: the row
        is invisible to the UPDATE policy.
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.ui.audit_trail_poll_seconds`' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { description: 'Must match the row''s `value_type`.' }
      responses:
        '204': { description: 'Updated, or matched nothing because the caller is not an Administrator.' }
        '400': { description: 'The value did not match `value_type`, or an immutable column was addressed.' }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/person_profiles:
    get:
      tags: [Auth]
      summary: Read your own display name and whether you have a picture
      description: |
        One row per person who has a display name, a picture or both (`0203`, `0213`). RLS returns
        your own row and nobody else's, an `Administrator` included; an empty array means you have
        neither. The name is written only through `/rest/v1/rpc/set_display_name`, so every change
        reaches the Audit Trail, and `avatar_path` only through `/rest/v1/rpc/set_own_picture`.
        Other people's names are read through `list_people()`, `list_user_accounts()` and
        `display_names_for()`; nobody reads another person's picture. `anon` and `service_role`
        hold nothing on the table.
      parameters:
        - { name: user_id, in: query, schema: { type: string }, description: 'e.g. `eq.<your auth.uid()>`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Your row, or an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:      { type: string, format: uuid }
                    display_name: { type: string, nullable: true, description: 'Trimmed, 1 to 80 characters, no control characters. NULL on a row that holds only a picture.' }
                    avatar_path:  { type: string, nullable: true, description: 'Your picture in the private `avatars` bucket, `<your id>/avatar`, or NULL for none. Download it from `/storage/v1/object/authenticated/avatars/<your id>/avatar` with your token.' }
                    updated_at:   { type: string, format: date-time, description: 'When the name was last set or cleared.' }
                    updated_by:   { type: string, format: uuid, nullable: true, description: 'You, or the Administrator who set the name.' }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/user_settings:
    get:
      tags: [Registry]
      summary: Read your own display preferences
      description: |
        One row per person (`0188`, `0194`): the theme, sidebar layout and single-key shortcuts
        the dashboard's Profile page and account menu set, so they follow the account rather than
        the browser. RLS returns the
        caller's own row and nobody else's, an `Administrator` included; an empty array means
        this person has chosen nothing yet, and the defaults apply. `anon` and `service_role` hold
        nothing on the table.
      parameters:
        - { name: user_id, in: query, schema: { type: string }, description: 'e.g. `eq.<your auth.uid()>`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Your row, or an empty array.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSettings' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }
    post:
      tags: [Registry]
      summary: Create or change your own display preferences
      description: |
        An upsert on `user_id` (`Prefer: resolution=merge-duplicates`, `on_conflict=user_id`): the
        columns sent are set and the others are left as they are, or take their defaults on a new
        row. The dashboard seeds a person's first row with `resolution=ignore-duplicates`, so a row
        another tab created is never overwritten. `user_id` must be the caller's own; any other is
        refused (403). There is no `DELETE`: the row goes when the account is deleted.
        `updated_at` is stamped by the database. Not recorded in the Audit Trail.
      parameters:
        - { name: on_conflict, in: query, schema: { type: string, example: user_id } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid, description: "The caller's own id." }
                theme: { type: string, enum: [dark, light] }
                sidebar_mode: { type: string, enum: [hover, expanded, collapsed] }
                single_key_shortcuts: { type: boolean }
      responses:
        '201': { description: 'Created or changed.' }
        '400': { description: 'A value outside the CHECK (`23514`).' }
        '401': { description: 'Not authenticated.' }
        '403': { description: "`user_id` is not the caller's own (`42501`)." }

  /rest/v1/platform_alerts_active:
    get:
      tags: [Registry]
      summary: Read only the alerts currently firing
      description: |
        One row per Grafana fingerprint — the newest occurrence — and only while it is still firing.
        This is what the dashboard's Topbar pill counts.

        **`DISTINCT ON` rather than `WHERE status = 'firing'`**, and the difference matters: if a
        resolve notification is ever lost (a dropped webhook, a Grafana restart mid-delivery) the
        series can hold an old firing row *and* a newer resolved one. A plain filter would surface the
        stale one indefinitely; taking the newest occurrence first and discarding it unless it is
        still firing means a later resolve always wins.

        A `service_identity` row is returned to an Administrator alone, as from `platform_alerts`.
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [critical, warning, info] } }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Currently firing alerts.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceAlert' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/device_nameplate:
    get:
      tags: [Registry]
      summary: Read operator-supplied nameplate data for a device
      description: |
        One row per device, and **only for devices somebody has filled in** — a device with no
        nameplate data has no row rather than a row of nulls.

        This is the *fallback* source. Where a device publishes its own identification as birth
        metrics (OPC 40001 Machinery `Manufacturer`, `SerialNumber`, `YearOfConstruction`), the AAS
        exporter prefers what the device said and uses this only to fill the gaps. Deliberately not
        stored in `asset_config`, which ingestion overwrites from every DBIRTH.
      parameters:
        - { name: device_id, in: query, schema: { type: string, format: uuid }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Matching nameplate rows.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceNameplate' } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }
    post:
      tags: [Registry]
      summary: Record nameplate data for a device
      description: |
        Administrator or Shopfloor_Manager only. Use `Prefer: resolution=merge-duplicates` to upsert.
        The database stamps `updated_by` and `updated_at` with the caller and the time of the write,
        whatever the request carries, so leave both out. An approved nameplate proposal records its
        proposer instead.
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceNameplate' }
      responses:
        '201': { description: Created. }
        '403': { description: 'Caller lacks Administrator or Shopfloor_Manager.' }

  /rest/v1/change_proposals:
    get:
      tags: [Registry]
      summary: Changes proposed but not yet applied
      description: |
        The approvals queue. An `Operator` may **insert** here and nowhere else that writes an
        asset: this is the first write that role has ever held, and it is a write to a queue.
        The asset write policies on `devices`, `cells`, `gateways` and `schemas` are unchanged.

        **A proposer reads their own rows; an Administrator or Shopfloor_Manager reads the whole
        queue.** That asymmetry is what makes the cap's refusal message actionable — told "you
        already have an open proposal on this device", a person can open it and add to it.

        Deciding is not done here. `status` cannot be written through this path at all; see
        `/rest/v1/rpc/approve_proposal`, `reject_proposal` and `withdraw_proposal`. A proposer may
        PATCH only the `patch` and `rationale` of their own **open** row.
      parameters:
        - $ref: '#/components/parameters/Select'
        - { name: status, in: query, schema: { type: string }, description: 'e.g. `eq.open`' }
        - { name: entity_id, in: query, schema: { type: string, format: uuid }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '200':
          description: Matching proposals.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '401': { description: 'Not authenticated; `anon` is revoked.' }
    post:
      tags: [Registry]
      summary: Propose a change
      description: |
        Requires `proposal:create`. Two caps apply and **both are enforced by the database**: one
        open proposal per asset per person (a partial unique index), and a ceiling on total open
        proposals per person (`proposals.max_open_per_person`, a trigger).

        `patch` names keys `proposable_columns(entity_type)` admits and nothing else — the
        columns ingestion writes (`status`, `reported_identity`, `identity_source`,
        `is_quarantined`, `first_dbirth_at`) and the device's `gateway_id` data path are all
        refused, by name, at insert time. A device's schemas are not proposable either.

        **A lane is open while `proposable_columns()` answers for it**, which it does for the five
        `entity_type` values below. `schemas` is refused: archived migration 0090 withdrew that
        lane, and rows filed before then still carry it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id, patch]
              properties:
                entity_type: { type: string, enum: [areas, cells, device_nameplate, devices, gateways] }
                entity_id: { type: string, format: uuid, description: 'The target row: the device for `devices` and `device_nameplate`, otherwise the area, cell or gateway. It must exist and not be archived.' }
                patch: { type: object, description: 'Column -> new value. A patch, not a row snapshot.' }
                rationale: { type: string }
      responses:
        '201': { description: Filed. }
        '400': { description: 'The lane is not proposable, or the patch names a column the lane does not admit.' }
        '403': { description: 'Caller lacks `proposal:create`, or named somebody else as the proposer.' }
        '409': { description: 'An open proposal against this asset by this person already exists, or the target is absent or archived.' }

  /rest/v1/rpc/approve_proposal:
    post:
      tags: [Registry]
      summary: Approve a proposal, which is to apply it
      description: |
        **The lane names the approver.** `may_decide_proposal()` resolves what the target table's
        own write policy resolves: an Administrator or a Shopfloor_Manager for `devices`,
        `device_nameplate` and `areas`, and `cell:manage` or `gateway:manage` for `cells` and
        `gateways`. A withdrawn lane, `schemas` among them, is decidable by nobody. Re-checked
        **server-side** rather than taken from the caller. The patch is re-validated against the allowlist and applied in the same
        transaction, so every CHECK, foreign key and trigger on the target runs now — **an invalid
        change cannot be approved**, it aborts rather than becoming an audit record of something
        that did not happen.

        Writes one `audit_trail` row naming both parties: `changed_by` is the approver,
        `new_data.proposed_by` is who asked. It carries the same `causation_id` as the audit row
        the change itself wrote, so the two read as one act. On the nameplate lane `updated_by` is
        set to the **proposer**, because a nameplate is an assertion about an asset and who made it
        is part of the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_proposal_id]
              properties:
                p_proposal_id: { type: string, format: uuid }
      responses:
        '200':
          description: Applied, with the audit_trail id it wrote.
          content:
            application/json:
              schema: { type: object }
        '400': { description: 'The patch violates a constraint on the target, or names a column that is not proposable.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/rpc/reject_proposal:
    post:
      tags: [Registry]
      summary: Refuse a proposal, with a reason
      description: |
        Gated by `may_decide_proposal()` exactly as approving is: a role able to refuse an act it
        cannot authorise could block it indefinitely. The reason is required by a CHECK as well as
        by this function: a rejected proposal frees its slot immediately and the same change may be
        proposed again at once, so the reason — not a cooldown — is what makes the second attempt
        different from the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_proposal_id, p_reason]
              properties:
                p_proposal_id: { type: string, format: uuid }
                p_reason: { type: string }
      responses:
        '200': { description: Rejected. }
        '400': { description: No reason given. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/rpc/withdraw_proposal:
    post:
      tags: [Registry]
      summary: Withdraw your own proposal
      description: |
        The proposer's act and nobody else's. An approver who wants an open proposal gone rejects
        it with a reason; withdrawing on somebody's behalf would erase the refusal. The row is
        closed rather than deleted — what survives, and for how long, is
        `proposals.retention_days`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_proposal_id]
              properties:
                p_proposal_id: { type: string, format: uuid }
      responses:
        '200': { description: Withdrawn. }
        '403': { description: Not the proposer. }
        '404': { $ref: '#/components/responses/NotFound' }

  /rest/v1/rpc/list_proposer_names:
    post:
      tags: [Registry]
      summary: The names of the machines behind the proposals you may decide
      description: |
        A machine identity has no email for a proposal to carry, and `machine_principals` is
        readable by Administrator and Auditor only. This returns the name of each machine that
        filed a proposal the caller may decide, by `may_decide_proposal()` on each proposal's
        lane, the gate `approve_proposal` decides by. A caller who decides nothing gets an empty
        array. A person, and a pinned identity with no name, has no row.
      responses:
        '200':
          description: One row per machine proposer.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    principal_id: { type: string, format: uuid }
                    name: { type: string }
        '401': { description: 'Not authenticated; `anon` is revoked.' }

  /rest/v1/links:
    get:
      tags: [Registry]
      summary: List external links attached to an asset
      description: 'A link registry, not a file store — `url` points at an external system.'
      parameters:
        - { name: entity_type, in: query, schema: { type: string }, description: '`eq.cell` | `eq.gateway` | `eq.device`' }
        - { name: entity_id, in: query, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Matching links.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Link' } }
    post:
      tags: [Registry]
      summary: Attach a link
      parameters: [{ $ref: '#/components/parameters/Prefer' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id, display_name, url]
              properties:
                entity_type: { type: string, enum: [cell, gateway, device] }
                entity_id: { type: string }
                display_name: { type: string }
                url: { type: string, format: uri }
                link_tag: { type: string, default: other }
      responses:
        '201': { description: Created. }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Registry]
      summary: Remove a link
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: 'e.g. `eq.<uuid>`' }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rest/v1/retired_entities:
    get:
      tags: [Registry]
      summary: The tombstones of archived entities that have since been deleted
      description: |
        One row per area, cell, gateway or device that was **archived and then deleted**, by its
        retention timer or by hand, written by an `AFTER DELETE` trigger on each of the four tables
        as the row goes (`0124`). A delete that skipped the archive stage leaves no row here: it is
        still on the audit trail, but it is not a retirement.

        The row carries what the entity was called, the `sparkplug_id` its readings are still keyed
        by in the historian, when it was archived and retired, who retired it (`retired_by` is null
        when the timer did), the id of the trail's `DELETE` row, and `old_data`, the whole row as
        it was. It is the Archived Entities page's Retired tab, where each row links to what
        survives it: the audit trail, a gateway's repository in the forge, and any bundle in
        `asset_exports`.

        **Read-only for every role.** No write policy exists; the trigger writes as definer.
        Readable by any role holding `archive:manage` or `audit_trail:read`.
      parameters:
        - { name: entity_type, in: query, schema: { type: string, enum: [areas, cells, gateways, devices] }, description: 'e.g. `eq.devices`' }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Tombstones, newest first when ordered by `retired_at`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    entity_type: { type: string, enum: [areas, cells, gateways, devices] }
                    entity_id: { type: string, format: uuid }
                    name: { type: string, nullable: true }
                    sparkplug_id: { type: string, nullable: true, description: 'The historian key; null for an area or a cell.' }
                    archived_at: { type: string, format: date-time, nullable: true }
                    retired_at: { type: string, format: date-time }
                    retired_by: { type: string, format: uuid, nullable: true, description: 'Null when the retention job deleted it.' }
                    retired_by_email: { type: string, nullable: true }
                    trail_id: { type: integer, nullable: true, description: 'The audit trail row that recorded the DELETE.' }
                    old_data: { type: object, description: 'The row as it was.' }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/asset_exports:
    get:
      tags: [Registry]
      summary: The bundles taken of devices, stored beside the cold tier
      description: |
        One row per `aas-export?format=bundle` that was stored (`0124`): which device, where the
        copy is (`object_bucket`, `object_key`, in the cold tier's bucket under `assets/`), its
        size and SHA-256, the counts the bundle's manifest reported, and who took it. The row
        outlives the device, which is the point: the Archived Entities page offers the download
        from a tombstone. The object itself is fetched with the ordinary Storage API, through a
        signed URL.

        **Read-only for every role**, and readable by the three roles the bucket's read policy
        admits: `Administrator`, `Shopfloor_Manager` and `Auditor`. The row is written by the
        function with the service role; its insert is recorded on the audit trail as `EXPORTED`.
        It is **not** a row in `telemetry_archive_manifest`: that catalogue is keyed by chunk and
        exists to make dropping a chunk safe, and a per-asset bundle has no chunk.
      parameters:
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Stored bundles visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    entity_type: { type: string, enum: [devices] }
                    entity_id: { type: string, format: uuid }
                    name: { type: string, nullable: true }
                    sparkplug_id: { type: string, nullable: true }
                    format: { type: string, enum: [aasx] }
                    object_bucket: { type: string }
                    object_key: { type: string }
                    object_bytes: { type: integer, nullable: true }
                    sha256: { type: string, nullable: true }
                    stats: { type: object, description: 'The counts the manifest reported: raw, hourly and trail rows, cold objects named, whether a cap was hit.' }
                    taken_at: { type: string, format: date-time }
                    taken_by: { type: string, format: uuid, nullable: true }
                    taken_by_email: { type: string, nullable: true }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  /rest/v1/directory_services:
    get:
      tags: [Registry]
      summary: List registered stack services
      description: |
        The service directory backing the dashboard's Directory tab — the URLs of *this
        stack's* components.

        > This is **not** the Factory+ Directory service. It answers "where is Grafana", not
        > "which devices exist and what schemas do they use" — those are the `Directory` tag's
        > `/v1/…` paths, served by `fplus-directory` against different tables. This relation has
        > no `/v1/` surface of its own, and there is no `/v1/service/{uuid}` endpoint anywhere on
        > this platform.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Registered services.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DirectoryService' } }

  /rest/v1/release_check:
    get:
      tags: [Registry]
      summary: The last answer of the opt-in release check
      description: |
        One row, or none where the check has never run: `releaseCheck.enabled` is off by default.
        Once a day the release-check CronJob asks GitHub for the latest Aber release and records
        the answer through `record_release_check()`, which only its own machine principal,
        `Service_ReleaseCheck`, may call: not `service_role`. Every
        signed-in user reads it, for the account menu's "Aber X.Y.Z is available", which shows only
        a successful check under two days old. A failed check keeps only `error`.
      parameters:
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: The row, or an empty array.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReleaseCheck' } }
        '401': { description: 'Not authenticated; `anon` holds nothing on this table.' }

  # ------------------------------------------------------------- Storage ----
  /storage/v1/object/asset-3d-models/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: 'Object key, e.g. `devices/<device-uuid>/model.glb`. Matches `devices.model_3d_path`.'
    post:
      tags: [Storage]
      summary: Upload a 3D model
      description: |
        **Writes are gated on `device:manage` (Administrator / Shopfloor_Manager), not on
        `authenticated`.** An upload changes what a shell publishes *and* puts bytes at a
        world-readable URL, which is that authority. Operator and Auditor are refused by RLS.

        **The extension is authoritative, never the browser's `File.type`.** No mainstream OS
        maps `.obj` or `.stl`, so they arrive as `application/octet-stream` or as an empty
        string. The bucket therefore accepts octet-stream, and `model_3d_path`'s CHECK on the
        extension is the real control.

        Write the object **before** the `devices.model_3d_path` row: a row pointing at nothing
        exports a dead link, whereas an unreferenced object is merely litter.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Stored. }
        '403': { description: 'Role lacks `device:manage`.' }
    delete:
      tags: [Storage]
      summary: Remove a 3D model object
      description: 'Clear `devices.model_3d_path` first, then delete — the reverse of upload order.'
      responses:
        '200': { description: Removed. }
        '403': { description: 'Role lacks `device:manage`.' }

  /storage/v1/object/public/asset-3d-models/{path}:
    get:
      tags: [Storage]
      summary: Fetch a 3D model (public read, no credentials)
      description: |
        **Unauthenticated by design.** An AAS `File` URL must be dereferenceable by a viewer
        holding no session, and a signed URL would expire and break every shell already handed
        out. Anything in this bucket is world-readable to whoever learns the path.

        Composed at read time from `AAS_MODEL_PUBLIC_BASE`. It **cannot** be derived from
        `SUPABASE_URL`, which inside the cluster is `http://supabase-envoy:8000` and resolves for
        nothing outside it.
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The model bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: No such object. }

  # ------------------------------------------------------------ Realtime ----
  /realtime/v1/websocket:
    get:
      tags: [Realtime]
      summary: WebSocket change feed (postgres_changes)
      description: |
        A WebSocket upgrade, not a REST call — use `supabase-js`
        (`supabase.channel(...).on('postgres_changes', …)`) rather than calling this directly.

        The publication carries `cells`, `gateways`, `devices` and `audit_trail`.
        **`telemetry` is unpublishable, not merely unpublished** — see that endpoint.

        Three things a client must know:

        * **Subscribe only after authenticating.** An unauthenticated subscriber still
          receives the event *envelope* (payload redacted to `{}` plus a 401), so subscribing
          pre-login leaks change timing.
        * **The replication slot is created lazily, after `SUBSCRIBED`.** A client can be
          subscribed and receiving nothing; reload once on `SUBSCRIBED` to close the window.
        * **Realtime has no replay.** A dropped socket loses every change in the gap and does
          not tell you. Keep a reconciliation poll.
      parameters:
        - { name: apikey, in: query, schema: { type: string }, description: 'The publishable key, as a query parameter — a browser cannot set headers on a WebSocket.' }
        - { name: vsn, in: query, schema: { type: string, default: '1.0.0' } }
      responses:
        '101': { description: Switching protocols. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------- Edge Functions ----
  /functions/v1/approve-quarantine:
    post:
      tags: [Edge Functions]
      summary: Approve a quarantined device
      description: |
        Clears `is_quarantined` and binds the device to a gateway, using the service role
        server-side. Fails closed: a missing `Authorization` header returns `401`, and any
        role other than `Administrator` / `Shopfloor_Manager` returns `403`.

        Until a device is approved, the ingestion daemon drops all of its `DDATA`.

        **Location is set only when explicitly asked for.** `p_set_cell` / `p_set_location_scope`
        exist so that "leave it inheriting" is distinguishable from "set it to NULL" — without
        them an approval would pin every device out of the Unassigned queue forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  format: uuid
                  description: Device UUID. Sparkplug names are not accepted.
                  example: ccd19944-8805-4c11-ae66-ea0d2c50f40c
                gateway_id: { type: string, format: uuid, nullable: true, description: Gateway to serve this device. }
                merge_into_device_id: { type: string, format: uuid, nullable: true, description: Fold this discovery into an existing device row instead of approving it separately. }
                asset_name: { type: string, nullable: true }
                cell_id: { type: string, format: uuid, nullable: true }
                location_scope: { type: string, enum: [cell, site_wide], nullable: true }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '400': { description: 'Missing or malformed `device_id`.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: insufficient privileges.' }
        '404': { description: 'No device has that `device_id` or `merge_into_device_id`. The body is `{"error": "Device not found"}`.' }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /functions/v1/gateway-bundle:
    get:
      tags: [Edge Functions]
      summary: Whether this deployment can enrol an appliance
      description: |
        The readiness probe. Reports the two addresses an appliance dials, `SUPABASE_PUBLIC_URL`
        and `MQTT_PUBLIC_HOST`, judged exactly as the `POST` below and `enroll-gateway` judge them,
        so the dashboard can say before a remote gateway is created that its bundle could not be
        issued. Nothing is minted and no gateway is read; any signed-in user may ask.
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    description: True only when both addresses would be accepted.
                  addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        variable: { type: string, example: SUPABASE_PUBLIC_URL }
                        value: { type: string, description: The configured value, empty when unset. }
                        problem:
                          type: string
                          nullable: true
                          description: Why an appliance could not use it, or null.
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/FunctionFailure' }
    post:
      tags: [Edge Functions]
      summary: Download a Remote gateway's bootstrap bundle (ZIP)
      description: |
        Returns a `.zip` containing everything needed to turn a machine into a gateway: a
        `docker-compose.yml`, a `Dockerfile`, `bootstrap.mjs`, a sample `flows.template.json`, a
        `README.md`, and a generated `.env`.

        **The bundle carries a claim, not a credential.** The only sensitive value in it is a
        single-use enrolment token valid for 30 minutes; there is no broker password, because the
        appliance obtains one for itself at first boot via `/functions/v1/enroll-gateway`. An
        expired bundle is inert.

        **Regenerating invalidates the previous bundle.** Issuing consumes any live token for that
        gateway, so exactly one download is ever redeemable.

        Requires `Administrator` or `Shopfloor_Manager` — generating a bundle is an operator's act,
        unlike redeeming one. The token is minted by a `SECURITY DEFINER` RPC called *as the
        caller*, so this endpoint cannot produce a bundle its caller could not produce themselves.

        > **Fetch this with a raw `fetch()`, not `supabase.functions.invoke()`.** supabase-js
        > text-decodes any response that is not JSON or octet-stream, which silently corrupts the
        > archive. The same constraint applies to `aas-export`'s AASX response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id]
              properties:
                gateway_id:
                  type: string
                  format: uuid
                  description: The Remote gateway to generate a bundle for.
      responses:
        '200':
          description: The bundle. `X-Aber-Token-Expires-At` carries the enrolment deadline.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="aber-gateway-<name>.zip"'
            X-Aber-Token-Expires-At:
              schema: { type: string, format: date-time }
              description: When the embedded enrolment token stops working.
            X-Aber-Bundle-Version:
              schema: { type: string }
              description: Template version, recorded on the gateway when the appliance enrols.
            X-Aber-Sparkplug-Id:
              schema: { type: string, pattern: '^gwy[0-9a-f]{21}$' }
              description: >-
                The edge node this bundle enrols. Also the MQTT username the appliance will be
                issued, and the folder the archive expands into.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { description: '`gateway_id` missing, or the gateway is Host or Third-party, not Remote.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: requires Administrator or Shopfloor_Manager.' }
        '404': { description: No such gateway. }
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '503':
          description: >-
            `SUPABASE_PUBLIC_URL` is unset or names an in-stack address, or the bundle template is
            missing from the deployment. No token is issued in either case.

  /functions/v1/gateway-credential:
    post:
      tags: [Edge Functions]
      summary: Mint a Host or Third-party gateway's broker credential and reveal it
      description: |
        Issues a Mosquitto account for a **Host** or **Third-party** gateway and returns the
        password in the response. The broker stores only a hash. For a Host, Simulated or
        Third-party gateway (not the Playback gateway) the function also keeps an encrypted copy
        in Vault (`keep_gateway_credential()`, 0164), which an Administrator can show again through
        `/rest/v1/rpc/show_gateway_credential`; `credential_kept` says whether it did.

        **The mirror image of `/functions/v1/gateway-bundle`.** A remote gateway gets a bundle
        carrying a single-use claim, and the appliance mints its own credential at first boot —
        the password never travels through a browser. A Host gateway has no appliance, and a
        Third-party one runs software Aber does not manage, so both halves of that path refuse them
        outright (`issue_gateway_enrollment_token()` raises on `deployment` `host` and
        `third_party`, 0196), and this endpoint is what replaces them.

        **A remote gateway is refused here for the same reason, in reverse.** Offering this
        beside a working bundle would be offering the worse of two options with nothing to say so.

        Requires `Administrator` or `Shopfloor_Manager`. The authority decision is made by
        `authorize_host_gateway_credential()`, a `SECURITY DEFINER` RPC called *as the caller*
        that checks `has_role()` itself — the role check in the function turns a refusal into a
        usable 403 rather than being the boundary. The mint is recorded in `audit_trail` as a
        `CREDENTIAL_ISSUED` row attributed to the calling operator, carrying the wire identity and
        never the password.

        > **Minting again replaces the account.** There is no rotation ceremony and no second
        > credential: the broker holds one password per username, so a second call invalidates the
        > first — including one a running connector is currently using.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id]
              properties:
                gateway_id:
                  type: string
                  format: uuid
                  description: The Host or Third-party gateway to mint a broker account for.
      responses:
        '200':
          description: >-
            The credential. `audit_recorded` is `false` when the mint succeeded but the
            `audit_trail` row could not be written — the password is still returned, because the
            account exists and withholding it would strand one nobody can authenticate as.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_name: { type: string }
                  sparkplug_id: { type: string, pattern: '^gwy[0-9a-f]{21}$' }
                  mqtt_username:
                    type: string
                    description: >-
                      Always equal to `sparkplug_id`. The gateway's broker role confines it to
                      that edge-node segment, so it cannot be anything else.
                  password:
                    type: string
                    description: base64url. Shown once; the broker keeps only a hash.
                  applied_to_running_broker:
                    type: boolean
                    description: >-
                      Whether the running broker applied the account. The Dynamic Security plugin
                      applies it as it is created, so this is `true`; kept for callers that read it.
                  audit_recorded: { type: boolean }
                  credential_kept:
                    type: boolean
                    description: >-
                      Whether an encrypted copy was kept (0164), so that an Administrator can show
                      this password again. False for a Remote or Playback gateway, which keep none,
                      and when the copy could not be written.
                  playback_delivered:
                    type: boolean
                    nullable: true
                    description: >-
                      Whether the password was delivered to the playback worker (0078, 0183). True:
                      it was written where the worker reads, and the worker picks it up within
                      about a minute. False: this is the Playback gateway and the delivery failed,
                      so the password must be set in `secrets.mqttPlaybackCredentials` instead.
                      Null: the gateway is not a playback target, and nothing was delivered.
                  env_hint:
                    type: object
                    description: >-
                      The `MQTT_GW_<NAME>_USER` / `_PASSWORD` variable names `node-red-init`
                      reconciles a managed broker node's credentials from, for a flow written
                      outside the editor. A broker node built in the editor takes the username
                      and password on its Security tab instead.
        '400': { description: '`gateway_id` malformed, absent, or naming a Remote or archived gateway.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: requires Administrator or Shopfloor_Manager.' }
        '500':
          description: >-
            The credential service is not configured for this deployment.
            Otherwise an unexpected failure, as a `FunctionError`.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FunctionError'
                  - type: object
                    description: The configuration error. `details`, when present, names the unset variable.
                    properties: { error: { type: string }, details: { type: string } }
        '503':
          description: >-
            The broker credential service is unreachable or refused. Nothing was changed — no
            account was created and no audit row written.

  /functions/v1/mint-service-token:
    post:
      tags: [Edge Functions]
      summary: Sign a long-lived token for a service principal and reveal it once
      description: |
        Signs a JWT naming a **service principal** as its subject, records the issue, and returns
        the token. It is shown once and is not recoverable: nothing in the stack keeps a copy, and
        the signature is reproducible only from the signing key. With `supabaseAuth.es256Signing`
        it is ES256, with the `kid` of the private key in `JWT_KEYS`, GoTrue's signing set;
        without, HS256 with `JWT_SECRET`. HS256 tokens stop verifying in 1.8, so one minted before
        the switch is minted again then.

        **Why this is a function and not an RPC.** `pgjwt` is installed, so a `SECURITY DEFINER`
        RPC could sign in-database — but the signing key is *not* in that database, and putting
        it there is the thing to avoid. That key signs anything, `service_role` included, and such
        a token is accepted by storage, realtime and the edge runtime, none of which consult the
        revocation denylist. The edge runtime already holds the key for signing,
        so the key stays put and the mint comes to it.

        **Minting ADDS a credential; it does not replace one.** This is the opposite of
        `/functions/v1/gateway-credential`, where the broker holds one password per username. Two
        mints a week apart are two live tokens, each revoked separately.

        Requires `Administrator`. The check is made twice on purpose: here, and again inside
        `record_service_token_issued()`, which re-reads `user_roles` before it will attribute a
        mint — so authorisation does not rest solely on a check made in the component that also
        holds the signing key.

        **The row is written before the token is returned, and a failure to record withholds it.**
        `revoke_service_token()` refuses a `jti` with no `TOKEN_MINTED` row, so an unrecorded token
        would be one nobody could ever withdraw. That is the one case where this endpoint discards
        a valid credential rather than returning it.

        > **Revocation reaches PostgREST only.** `revoke_service_token()` denylists the `jti` and
        > `auth_pre_request()` refuses it on every subsequent API request — but storage, realtime,
        > and the edge runtime verify the signature independently. For those three the expiry is
        > still the only bound, which is why the ceiling is 90 days and shorter is better.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_id]
              properties:
                principal_id:
                  type: string
                  format: uuid
                  description: >-
                    The service principal to sign for. Must be an `auth.users` row that cannot
                    sign in; a person's account is refused, because a long-lived token for one
                    would be a standing escalation of that person's session.
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 30
                  description: TTL in whole days, bounded by `service_token_max_days()`.
      responses:
        '200':
          description: The token, plus the identifiers needed to revoke it later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The signed JWT. Shown once; nothing keeps a copy.
                  jti:
                    type: string
                    format: uuid
                    description: >-
                      The handle for revoking this token. Recorded in `audit_trail` — unlike the
                      token itself — so it survives the dialog being closed.
                  principal_id: { type: string, format: uuid }
                  expires_at:   { type: string, format: date-time }
                  audit_row_id:
                    type: integer
                    format: int64
                    description: The `audit_trail` row recording the mint.
                  revocation_scope:
                    type: string
                    enum: [postgrest]
                    description: >-
                      What a later revocation would actually reach. Returned rather than assumed by
                      the caller, so a page cannot claim coverage this stack does not have.
        '400':
          description: >-
            `principal_id` malformed or absent, `days` out of range, or the principal refused —
            it can sign in, does not exist, or the mint could not be recorded. In the last case no
            token is returned even though one was signed.
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: requires Administrator.' }
        '500':
          description: >-
            `JWT_SECRET` is not set, so this worker cannot sign.
            Otherwise an unexpected failure, as a `FunctionError`.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FunctionError'
                  - type: object
                    description: The configuration error. `details`, when present, names the unset variable.
                    properties: { error: { type: string }, details: { type: string } }

  /functions/v1/manage-people:
    post:
      tags: [Edge Functions]
      summary: Add a person, remove their access, restore it, set a new password, reset their MFA or change their email address
      description: |
        The GoTrue half of the People tab (`0166`, `0167`, `0207`, `0216`). A function because GoTrue's admin API takes the
        service-role key, which is not in the database. Requires `Administrator`, checked here
        before any admin call and again by the database function each act calls in the caller's
        session, which also writes the audit row.

        - **`add`**: with a mail relay (`supabaseAuth.smtp.host`), GoTrue sends an invitation whose
          link lands on the form that sets a password. Without one, the account is created with a
          24-character password minted here, returned once in `password`, and never stored or
          logged. `record_person_added()` then gives the role; if it refuses, the account is
          deleted again. An optional `display_name` is checked before anything is created, so a
          name the database would refuse refuses the whole add (400). It is then set with
          `set_display_name()` in the caller's session. If that fails, the person is still added,
          and `name_error` says why the name was not set.
        - **`remove`**: `remove_person_access()` first, so its rules are decided before GoTrue
          changes anything, then a ban (`ban_duration` `876000h`). The account is never deleted.
          The person's picture is deleted before the ban: its object in `avatars` as
          `service_role`, then `forget_person_picture()` clears `person_profiles.avatar_path`
          (`0213`). If either fails, nothing more is done, and the answer says to remove access
          again, which finishes it.
        - **`restore`**: `restore_person_access()`, then the ban is lifted.
        - **`set-password`**: a new password minted as `add` mints one, with or without a relay,
          returned once in `password`. `record_person_password_set()` decides first (a person whose
          access is removed is a 409), GoTrue sets it, then the same function records
          `PASSWORD_SET`. If GoTrue fails, nothing changed (502). If the record fails, the answer is
          a 500 that withholds the password: it was changed, nobody has seen it, and setting it
          again records it. GoTrue ends the person's sessions; an access token already issued lasts
          until it expires.
        - **`reset-mfa`**: deletes every second factor the person holds, for someone who has lost
          their authenticator. `record_person_mfa_reset()` decides first (your own account is a
          403), GoTrue's admin API deletes each factor, then the same function records `MFA_RESET`
          with how many went, in `factors_removed`. A person who holds none is recorded as a reset
          of none. Their sessions stay; GoTrue lowers those that used a factor to `aal1`. If GoTrue
          fails before any factor went, nothing changed (502). If it fails part-way, the ones that
          went are recorded and the answer is a 502 that says how many; resetting again removes
          the rest. If the record fails, the answer is a 500 that says the factors went.
        - **`change-email`**: `email` is trimmed and lower-cased, and refused (400) unless it is an
          address. `check_person_email_change()` decides first and answers with the address held (a
          removed person or a taken address is a 409). GoTrue's admin update then changes it with
          `email_confirm`, so it is in use at once and nothing is mailed. Then
          `record_person_email_change()` writes `EMAIL_CHANGED` and ends every session the person
          holds. If GoTrue fails, nothing changed (502). If the record fails, the answer is a 500
          that says the address did change and the sessions did not end.

        Your own access, password, second factor or address is refused (403); you change your own
        password with `PUT /auth/v1/user`, and remove your own factor with
        `DELETE /auth/v1/factors/{id}`. A refusal the caller can act on (4xx) carries the database's or GoTrue's
        sentence in `details`. A failure that is not one (500, 502) answers a fixed sentence and a
        request id, and the error goes to the log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:  { type: string, enum: [add, remove, restore, set-password, reset-mfa, change-email] }
                email:   { type: string, format: email, description: '`add`, and the new address for `change-email`.' }
                role:    { type: string, enum: [Administrator, Shopfloor_Manager, Operator, Auditor], description: '`add` only.' }
                display_name: { type: string, nullable: true, description: '`add` only, optional. Up to 80 characters after trimming, no control characters.' }
                user_id: { type: string, format: uuid, description: '`remove`, `restore`, `set-password`, `reset-mfa` and `change-email`.' }
      responses:
        '200':
          description: 'Done. Sent with `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:  { type: string, format: uuid }
                  email:    { type: string, description: '`add`, and the new address after `change-email`.' }
                  previous_email: { type: string, nullable: true, description: '`change-email`: the address the person had.' }
                  sessions_ended: { type: integer, description: '`change-email`: how many sessions the change ended.' }
                  role:     { type: string, nullable: true, description: '`add`, and the role `restore` gave back.' }
                  invited:  { type: boolean, description: '`add`: true when an invitation was sent.' }
                  display_name: { type: string, nullable: true, description: '`add`: the name set, or null.' }
                  name_error: { type: string, description: '`add`, only when the person was added and their name could not be set.' }
                  password: { type: string, description: '`add` without a mail relay, and `set-password`. Shown once; nothing keeps a copy.' }
                  access:   { type: string, enum: [removed, active], description: '`remove` and `restore`.' }
                  factors_removed: { type: integer, description: '`reset-mfa`: how many second factors GoTrue deleted.' }
        '400': { description: 'Malformed request, an unknown role, or the database refused the person.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Requires Administrator; or your own access, password, second factor or address.' }
        '404': { description: No such person. }
        '409': { description: 'The address is already in use, the last Administrator, a removed person, or access in the other state.' }
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '502':
          description: >-
            GoTrue failed or did not answer. For `add`, `set-password` and `change-email` nothing was changed. For
            `reset-mfa` nothing was changed, or the answer says how many factors went. For
            `remove` and `restore` the database act was done but the ban was not made or lifted;
            repeat it. For `remove`, also Storage not deleting the picture, before the ban; repeat
            it. A fixed sentence and a request id, as for a 500.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FunctionError' } } }

  /functions/v1/revoke-gateway-credential:
    post:
      tags: [Edge Functions]
      summary: Disable a decommissioned gateway's broker account
      description: |
        **Called by the database, not by a browser or an appliance.** A trigger on `gateways`
        reaches this through the gateway with `pg_net` whenever a gateway is archived or deleted, and a
        `pg_cron` sweep retries any archive whose call did not land (migration `0038`).

        **Revocation is a disable, not a deletion.** The credential service asks the broker's
        Dynamic Security plugin to `disableClient`: the gateway's live session is dropped at once
        and its next CONNECT is refused. The account and its hash stay, listed as disabled on the
        Access Control page, and a later issue re-enables it. Nothing here can delete an account
        or a role; a delete verb would turn "can disable one gateway" into "can stop the entire
        fleet publishing".

        Authorised by `GATEWAY_REVOKE_SECRET` in the `x-revoke-secret` header, **not** by the anon
        key. The gateway's API-key check in front of `/functions/v1/` proves only that the caller holds a key
        that ships inside every browser bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sparkplug_id]
              properties:
                sparkplug_id:
                  type: string
                  pattern: '^gwy[0-9a-f]{21}$'
                  description: >-
                    The gateway's immutable edge-node id, which is also its MQTT username. Shape
                    checked here so a malformed one is refused where the caller can read why.
      responses:
        '200':
          description: The request reached the broker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    description: Whether the account was disabled. Equal to `existed`.
                  existed:
                    type: boolean
                    description: >-
                      Whether the broker held an account by that name. False means nothing was
                      changed. `0038` avoids reaching here in that case by checking whether a
                      credential was ever recorded.
        '400': { description: Body is not JSON, or `sparkplug_id` is not a well-formed edge-node id. }
        '401':
          description: >-
            The `x-revoke-secret` header is missing or wrong. No detail about which — a response
            distinguishing the two is a hint.
        '405': { description: Method not allowed. }
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '502': { description: The credential service refused the revocation. }
        '503':
          description: >-
            Revocation is unconfigured on this deployment, or the credential service is unreachable.
            An unconfigured stack answers this rather than 401: it has nothing to check against, and
            401 would send whoever is debugging it looking for a wrong value rather than a missing
            one.

  /functions/v1/broker-inventory:
    get:
      tags: [Edge Functions]
      summary: What the broker holds, read live
      description: |
        Every account at the broker with its roles, whether it is disabled and how many live
        sessions it holds, and every role with its rules, read from the broker's Dynamic Security
        plugin through the credential service at the moment of the request. The Access Control
        page's Broker column, its list of accounts with no gateway row, and its broker principals
        table are all this read.

        **No hash material and no client address.** The plugin's `listClients` returns each
        client's salt and iterations, and the address of each live session; the credential service
        drops them before answering, and this function forwards what it returns.

        Requires `Administrator`, narrower than issuing: the inventory names every account on the
        broker, including the platform principals and the plugin's own admin.
      responses:
        '200':
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        roles:
                          type: array
                          items: { type: string }
                        disabled:
                          type: boolean
                          description: >-
                            A disabled account is refused at CONNECT and had any live session
                            dropped when it was disabled. This is what revocation sets.
                        connections:
                          type: integer
                          nullable: true
                          description: >-
                            How many live sessions the broker holds on the account at the read,
                            counting the credential service's own request on the plugin's admin
                            account. NULL when the broker's reply carries no session list (before
                            Mosquitto 2.1).
                        textname:
                          type: string
                          nullable: true
                          description: >-
                            The plugin's name for the account: the name a read-only account was
                            created with on the Access Control page. NULL where it holds none.
                        textdescription:
                          type: string
                          nullable: true
                          description: >-
                            What the account is for, as a read-only account was created with. NULL
                            where the plugin holds none.
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        rolename: { type: string }
                        acls:
                          type: array
                          items:
                            type: object
                            properties:
                              acltype:
                                type: string
                                description: >-
                                  `publishClientSend`, `publishClientReceive`, `subscribePattern`
                                  or `unsubscribePattern`; the plugin's own names.
                              topic: { type: string }
                              allow: { type: boolean }
                  read_at: { type: string, format: date-time }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: requires Administrator.' }
        '405': { description: Method not allowed. }
        '500':
          description: >-
            The credential service is not configured on this deployment.
            Otherwise an unexpected failure, as a `FunctionError`.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FunctionError'
                  - type: object
                    description: The configuration error. `details`, when present, names the unset variable.
                    properties: { error: { type: string }, details: { type: string } }
        '503': { description: The credential service is unreachable, or could not read the broker. }

  /functions/v1/broker-subscriber:
    post:
      tags: [Edge Functions]
      summary: Create or delete a read-only broker account
      description: |
        New Read-Only Account and Delete on Access Control › Broker accounts. The account is for a
        consumer outside Aber that only reads: it holds the broker's `subscriber` role and nothing
        else, so it subscribes to and receives `spBv1.0/#` and the Unified Namespace's `<root>/#`,
        and every publish it makes is dropped. It is a plain MQTT reader, not a Sparkplug Host
        Application: it publishes no STATE. The role is site-wide.

        - **`create`**: `name` (1-80 characters) and `description` (1-500), each trimmed and on
          one line, are what the account is for; the broker keeps them as the client's textname
          and textdescription. The credential service generates the username, `sub` and 21
          lowercase hex characters, and the password, which is returned here once and kept
          nowhere. Then `record_broker_account_created()` writes the Audit Trail row as the
          caller. If that fails the password is still returned, with `audit_recorded: false`.
        - **`delete`**: `username` must be in the subscriber scheme; a gateway's account, one of
          Aber's own and any account made by hand are refused (400) before the credential service
          is asked. The broker deletes the client (`deleteClient`), which drops its live sessions
          and refuses its next CONNECT. Then `record_broker_account_deleted()` writes the row.

        Administrator only, checked before the credential service is asked anything. No
        service-role key: the audit functions run as the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:      { type: string, enum: [create, delete] }
                name:        { type: string, maxLength: 80, description: '`create`: what the Access Control page lists the account as.' }
                description: { type: string, maxLength: 500, description: '`create`: what the account is for.' }
                username:    { type: string, pattern: '^sub[0-9a-f]{21}$', description: '`delete`: the account to delete.' }
      responses:
        '200':
          description: 'Done. Sent with `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  mqtt_username:  { type: string, pattern: '^sub[0-9a-f]{21}$' }
                  password:       { type: string, description: '`create` only. Shown once; the broker stores a hash.' }
                  name:           { type: string, description: '`create` only.' }
                  description:    { type: string, description: '`create` only.' }
                  role:           { type: string, enum: [subscriber], description: '`create` only.' }
                  deleted:        { type: boolean, description: '`delete` only.' }
                  audit_recorded: { type: boolean, description: 'False when the Audit Trail row could not be written; the act was done.' }
        '400': { description: 'Malformed request, an unknown action, a missing or malformed name or description, or a username outside the subscriber scheme.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Forbidden: requires Administrator.' }
        '404': { description: '`delete`: the broker holds no account by that name. Nothing was recorded.' }
        '405': { description: Method not allowed. }
        '500':
          description: >-
            The credential service is not configured on this deployment (`details` names the unset
            variable). Otherwise an unexpected failure, as a `FunctionError`.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FunctionError'
                  - type: object
                    properties: { error: { type: string }, details: { type: string } }
        '503': { description: 'The credential service is unreachable or refused. For `create` nothing the page can use was made; retry.' }

  /functions/v1/enroll-gateway:
    post:
      tags: [Edge Functions]
      summary: Redeem a Remote gateway's enrolment token for a broker credential
      description: |
        Called by a **Remote gateway appliance on first boot**, not by a browser. There is no
        user, no session and no role: possession of the single-use enrolment token is the
        authorisation. The request still needs the `apikey` header — the gateway gates `/functions/v1/`
        — but the **publishable key is sufficient and no user JWT is required**.

        The token is minted by `issue_gateway_enrollment_token()` when an operator creates a
        Remote gateway in the dashboard, is valid for 30 minutes by default, and is bound to
        exactly one gateway.

        **The claim is atomic.** Two appliances racing the same token produce exactly one winner —
        the loser gets `401`. That matters because a gateway's broker role confines it to its own
        edge-node segment, so two credentials for one gateway would silently contend for a single
        Sparkplug identity.

        **A failed issuance releases the claim.** If the broker credential service is unavailable
        the response is `503` with `retryable: true` and the *same bundle* can be retried. Only when
        the release itself fails (`retryable: false`) must a new bundle be generated.

        On success the gateway moves to `AWAITING_BIRTH`; its first Sparkplug `NBIRTH` then sets it
        `ONLINE` through the ordinary ingestion path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: The single-use enrolment token from the downloaded bundle.
                agent_version:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: >-
                    Version stamp of the bundle the appliance is running, recorded on the gateway so
                    the fleet's vintage is visible without reaching into every appliance.
      responses:
        '200':
          description: >-
            Enrolled. `mqtt_password` is returned EXACTLY ONCE — the broker stores only a hash, so
            there is no endpoint that could re-read it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ENROLLED }
                  gateway_name: { type: string, example: Cell 4 Press Line }
                  sparkplug_id:
                    type: string
                    pattern: '^gwy[0-9a-f]{21}$'
                    description: The immutable edge-node id. Also the MQTT username; it cannot be anything else.
                  sparkplug_group: { type: string, example: Aber }
                  mqtt_host: { type: string, example: broker.plant.example }
                  mqtt_tls_port: { type: integer, example: 8883 }
                  primary_host_id:
                    type: string
                    nullable: true
                    example: plant1
                    description: >-
                      The site's Sparkplug primary host. The appliance births only once
                      `spBv1.0/STATE/<id>` says it is online, and buffers readings while it is not.
                      Null when the deployment names none.
                  mqtt_username: { type: string, description: Equal to `sparkplug_id`. }
                  mqtt_password: { type: string, description: Returned once and not recoverable. }
                  ca_cert:
                    type: string
                    description: >-
                      The broker's CA in PEM form. Remote gateways connect over MQTTS only and
                      must verify against this; there is no unverified fallback.
                  applied_to_running_broker:
                    type: boolean
                    description: >-
                      False means the credential is durable but not yet live (a Kubernetes projected
                      Secret can take ~90s to sync), so the appliance should retry its first CONNECT
                      rather than treat a refusal as a bad password.
        '400': { description: Body is not JSON. }
        '401':
          description: >-
            The token is unknown, expired, or already redeemed. The three are deliberately
            indistinguishable — reporting which would let an enumerator learn that a token value
            once existed.
        '405': { description: Method not allowed. }
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '503':
          description: >-
            Enrolment is unconfigured, or the broker credential service could not be reached. Check
            `retryable`: when true the token was released and the same bundle can be retried.

  /functions/v1/gateway-install:
    get:
      tags: [Edge Functions]
      summary: The one-liner's installer, playbook and .env, against the enrolment token
      description: |
        What the command the dashboard shows fetches, and what the installer it starts fetches
        after it: the installer script (no `file`), the platform playbook as a zip
        (`file=platform.zip`), and the appliance's `.env` (`file=env`). Each is authorised by the
        enrolment token in `X-Enrolment-Token`, checked with `peek_gateway_enrollment_token()`
        (0105), which validates without consuming: only enrolment spends the token. The token
        rides in a header, never the query string, so it lands in no access log; nothing here is
        cacheable; and the `.env`'s credential secret is generated per fetch, which the installer
        writes once.

        The apikey passes the gateway's key check as on every function; the token is what
        authorises. Refused identically (401) for a missing header, a malformed token, an unknown,
        expired or spent one, and an archived gateway. Refused outright (503) on a deployment whose
        public URL is plain HTTP, unless the development values allow it: the route carries a
        token and a secret.
      parameters:
        - in: header
          name: X-Enrolment-Token
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: The single-use enrolment token the dashboard minted with the command.
        - in: query
          name: file
          required: false
          schema:
            type: string
            enum: [env, platform.zip]
          description: Absent for the installer script.
      responses:
        '200':
          description: "The installer, the playbook or the .env. `Cache-Control: no-store` on all three."
          content:
            text/x-shellscript:
              schema:
                type: string
              example: "#!/bin/bash\n# Aber gateway appliance installer.\n..."
            text/plain:
              schema:
                type: string
              example: "ABER_SUPABASE_URL=https://api.plant.example\nABER_ENROLLMENT_TOKEN=...\n"
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: The token is not valid. Unknown, expired, spent and archived are indistinguishable.
        '404':
          description: A `file` this route does not serve.
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '503':
          description: The installer is not available on this deployment; `details` says why.

  /functions/v1/aas-export:
    post:
      tags: [Edge Functions]
      summary: Export a device as an Asset Administration Shell (AAS V3)
      description: |
        Composes an AAS V3 **Environment** for one device. It is an *adapter*: nothing
        upstream knows AAS exists.

        **Allowed to `Operator` and `Auditor` as well** — it is a read. Still an allow-list,
        and still a broader disclosure than any single table, since a shell aggregates
        nameplate, config and gateway identity into one payload. `bundle` also needs
        `audit_trail:read` (Administrator, Shopfloor_Manager, Auditor), because it carries the
        device's Audit Trail.

        **Telemetry values are never inlined.** The Time Series submodel carries a
        `LinkedSegment` naming the historian endpoint plus an `asset_id` query.

        A missing `semanticId` is **omitted, never emitted empty** — an empty `Reference` is
        invalid AAS. The unmapped count comes back in `stats`.

        `?format=aasx` returns an OPC/ISO 29500 ZIP whose packaged Environment is
        byte-identical to the JSON export, except that a bundled 3D model's `File.value` is
        rewritten to the part name.

        `?format=bundle` returns the same AASX with the device's history inside, for taking an
        asset away before it is taken out of service: supplementary parts under
        `aasx/files/aber/` hold the audit trail's asset lane, read as the caller (JSON), the
        readings still in the live historian at raw and hourly resolution (CSV, oldest first,
        capped newest-first), and a
        manifest (`aber/asset-bundle/2`) that says what each part holds, where it was cut,
        and which cold-tier objects hold the rest — named, never read back. A copy is stored in the
        cold tier's bucket under `assets/<sparkplug_id>/<stamp>.aasx` and recorded in
        `asset_exports`; `X-AAS-Stats.bundle` says whether that copy was stored, and the file is
        returned either way.

        > **A browser cannot fetch AASX through `functions.invoke()`.** supabase-js decodes
        > anything that is not JSON or octet-stream as *text*, which corrupts a ZIP. Build the
        > request yourself and ask for a Blob; the counts ride back in `X-AAS-Stats`.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, aasx, bundle], default: json }
          description: 'May also be sent in the body. `aasx` returns a ZIP; `bundle` returns that ZIP with the history parts and stores a copy.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, format: uuid }
                format: { type: string, enum: [json, aasx, bundle] }
      responses:
        '200':
          description: The AAS Environment, an AASX package, or the bundle.
          headers:
            X-AAS-Stats:
              schema: { type: string }
              description: 'JSON counts (submodels, elements, unmapped semantic ids) — the only channel a binary body leaves for them. For `bundle`, a `bundle` object with the row counts of each part, `truncated`, `not_included`, and `stored` with the `bucket`, `object_key`, `sha256` and `export_id` of the copy, or, when it was not stored, a fixed `reason` and the `request_id` the error was logged under.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetAdministrationShells: { type: array, items: { type: object } }
                  submodels: { type: array, items: { type: object } }
                  conceptDescriptions: { type: array, items: { type: object }, description: 'One per semantic id the shell carries, with IEC 61360 content: name, definition, unit and data type. The definition is the vocabulary''s own text (`concept_definitions`) where one defines the id, and catalog text only otherwise. Omitted when there are none — `minItems: 1` in the IDTA schema.' }
                  stats: { type: object }
            application/asset-administration-shell-package+xml:
              schema: { type: string, format: binary }
        '400': { description: 'Missing `device_id`, a non-UUID `device_id`, or an unknown `format`.' }
        '401': { description: Missing or invalid Authorization header. }
        '403': { description: 'Role is outside the allow-list, or `format=bundle` without `audit_trail:read`; the bundle refusal names the Audit Trail.' }
        '404': { description: No such device. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /functions/v1/aas-api:
    get:
      tags: [Edge Functions]
      summary: AAS repository root — the routes this service serves
      description: |
        The IDTA 02001/02002 **read-only** repository surface, served live from the database over
        the same mapping `aas-export` uses (`supabase/functions/_shared/aas/shell.ts`). A shipped
        `.aasx` and this endpoint therefore cannot describe the same machine differently — the
        agreement is asserted by `test_aas_api.py`.

        **This path itself answers `404`**, because there is no resource at a repository root and
        the specification defines no index. The body lists what *is* served, for the benefit of
        somebody who found this URL in a config file. Start at `/description`.

        **Reads as the caller and holds no service-role key**, unlike `aas-export`. RLS decides
        what comes back, which is why it is a separate function: `main/index.ts` forwards only
        the environment each worker's registry entry names, so the separation is enforced by the
        runtime rather than by care.

        Every route is a `GET`. Writes would bypass the dashboard's role model and its
        `audit_trail` record, so the advertised profiles are the read-only SSP-002 pair.
      responses:
        '404':
          description: No resource at the root; the body names the routes that exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { type: object } }
                  served: { type: array, items: { type: string } }
                  note: { type: string }
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/description:
    get:
      tags: [Edge Functions]
      summary: AAS repository self-description (IDTA 02002)
      description: |
        The service profiles this deployment implements. It reports profiles and nothing about
        the fleet.

        **The function does not authenticate this route; the gateway does.** IDTA 02002 expects
        it readable before a client holds a credential — the same argument that keeps the
        Factory+ Directory's `/ping` open — and this endpoint is written that way. But it falls
        under the gated `/functions/v1/` catch-all, so **an `apikey` is required in practice**
        and a client without one gets `401` before the function is reached.

        That gap is recorded, not accidental: making it a fifth `key-auth` exemption widens the
        gateway's open surface, which is a decision to take on its own rather than as a side
        effect. See `docs/gateway.md`. Note the asymmetry if it is taken — only
        `/description` belongs outside the gate; every other `aas-api` route authenticates the
        caller itself and fails closed.

        Both advertised profiles are **SSP-002, the read-only variants**. Every route below is a
        `GET`; asset data is authored through the dashboard, which has the role model and writes
        `audit_trail`, and a write here would bypass both.
      responses:
        '200':
          description: The advertised profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: { type: array, items: { type: string } }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/shells:
    get:
      tags: [Edge Functions]
      summary: List Asset Administration Shells
      description: |
        Every shell this deployment publishes — one per non-archived device — built live from
        the **same mapping `aas-export` uses** (`supabase/functions/_shared/aas/shell.ts`), so a
        shipped `.aasx` and this endpoint cannot describe the same machine differently.

        **Reads as the caller, and holds no service-role key.** RLS decides what comes back. That
        is the difference from `aas-export`, which composes a document under the service role
        after checking the caller's role, and it is why these are two functions rather than two
        routes: `main/index.ts` forwards only the environment each worker's registry entry names.

        **Pagination.** `limit` (default 20, capped at 100) and an opaque `cursor`. A cursor names
        the next *device*, so a page carries every item belonging to the devices it covers — the
        specification leaves cursor semantics to the server, and paging inside a document rebuilt
        per request would only be stable while nothing changed.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Each device on a page costs seven queries and one shell construction.
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque. Echo back `paging_metadata.cursor` from the previous page.
      responses:
        '200':
          description: A page of shells.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging_metadata:
                    type: object
                    properties: { cursor: { type: string } }
                    description: Empty object on the last page — the cursor is omitted, not nulled.
                  result: { type: array, items: { type: object } }
        '400': { description: Non-positive `limit`. }
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/shells/{aasIdentifier}:
    get:
      tags: [Edge Functions]
      summary: Get one Asset Administration Shell
      description: |
        **`aasIdentifier` is base64url-encoded**, as IDTA 02002 requires for every Identifier in
        a path. Not plain base64: `/` is legal there and is a path separator, so an identifier
        containing one would split across two segments and the route would silently not match.
        Padding is optional.

        Identifiers are **derived, not stored** — `<AAS_BASE_IRI><sparkplug_id>/shell` — so this
        parses the identifier back to a wire id rather than consulting a mapping table that could
        disagree with the exporter. A consequence worth knowing: changing `AAS_BASE_IRI` changes
        every identifier this deployment has published, and older ones stop resolving.
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema: { type: string }
          description: base64url of the shell's `id`.
      responses:
        '200':
          description: The shell.
          content:
            application/json: { schema: { type: object } }
        '400': { description: Identifier is not valid base64url. }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such shell. A *submodel* identifier is refused here too, even though it names a device that exists. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/shells/{aasIdentifier}/submodel-refs:
    get:
      tags: [Edge Functions]
      summary: List a shell's submodel references
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Paginated `ModelReference`s, in the same envelope as every other list.
          content:
            application/json: { schema: { type: object } }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such shell. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/shells/{aasIdentifier}/asset-information:
    get:
      tags: [Edge Functions]
      summary: Get a shell's AssetInformation
      description: |
        `assetKind` and the `globalAssetId` — the identifier the whole shell hangs off, derived
        as `<AAS_BASE_IRI><sparkplug_id>`.
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The AssetInformation object.
          content:
            application/json: { schema: { type: object } }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such shell. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/shells/{aasIdentifier}/submodels/{submodelIdentifier}:
    get:
      tags: [Edge Functions]
      summary: Get a submodel through its shell
      description: |
        The same object as `/submodels/{submodelIdentifier}`, with one extra condition: the
        submodel must belong to **this** shell. A submodel from another asset answers `404` here
        even though it resolves perfectly well on the direct route.

        The element routes hang off this path too, so
        `/shells/{aasIdentifier}/submodels/{submodelIdentifier}/submodel-elements/{idShortPath}`
        works exactly as the direct form does. Append `/$value` for ValueOnly.
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema: { type: string }
        - name: submodelIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The submodel.
          content:
            application/json: { schema: { type: object } }
        '400': { description: Either identifier is not valid base64url. }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such shell, or that shell does not carry that submodel. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/submodels/{submodelIdentifier}/submodel-elements:
    get:
      tags: [Edge Functions]
      summary: List a submodel's elements
      description: |
        Paginated in the same envelope as every other list, though one submodel's elements always
        fit on a page — a client that reads `paging_metadata` everywhere must find it here too.

        Append `/$value` for the ValueOnly form, which returns one `{idShort: value}` object per
        element.
      parameters:
        - name: submodelIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The submodel's elements.
          content:
            application/json: { schema: { type: object } }
        '400': { description: Identifier is not valid base64url. }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such submodel. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/submodels:
    get:
      tags: [Edge Functions]
      summary: List submodels
      description: |
        Every submodel across every shell. Same pagination as `/shells`.

        Append **`/$value`** for IDTA 02002's ValueOnly serialisation — the metamodel stripped
        down to values, which is the shape an ERP actually wants: `body.SerialNumber` rather than
        a walk through `submodelElements[]` matching on `idShort`.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of submodels.
          content:
            application/json: { schema: { type: object } }
        '400': { description: Non-positive `limit`. }
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/submodels/{submodelIdentifier}:
    get:
      tags: [Edge Functions]
      summary: Get one submodel
      description: |
        base64url-encoded identifier, as above. Also reachable as
        `/shells/{aasIdentifier}/submodels/{submodelIdentifier}`, which additionally requires the
        submodel to belong to that shell.

        **Telemetry values are still never inlined.** The Time Series submodel carries a
        `LinkedSegment` naming the historian, exactly as the export does — a live API makes
        inlining more tempting, not less, and an unbounded submodel is no better for arriving
        over HTTP.

        Append **`/$value`** for the ValueOnly form; collections nest as objects.
      parameters:
        - name: submodelIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The submodel.
          content:
            application/json: { schema: { type: object } }
        '400': { description: Identifier is not valid base64url. }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No such submodel. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/aas-api/submodels/{submodelIdentifier}/submodel-elements/{idShortPath}:
    get:
      tags: [Edge Functions]
      summary: Get one submodel element by idShortPath
      description: |
        `idShortPath` is the specification's dotted form — `Metrics.Systems_TEMPERATURE`. A
        slash-separated path is accepted too. Only collections are traversable; a path that runs
        into a `Property` part-way answers `404`, because asking for the child of a leaf is a
        client mistake rather than a server fault.

        Omit `idShortPath` to list a submodel's elements, paginated. Append `/$value` at either
        level for the ValueOnly form.
      parameters:
        - name: submodelIdentifier
          in: path
          required: true
          schema: { type: string }
        - name: idShortPath
          in: path
          required: true
          schema: { type: string }
          description: Dotted, e.g. `Metrics.Systems_TEMPERATURE`.
      responses:
        '200':
          description: The element.
          content:
            application/json: { schema: { type: object } }
        '401': { description: Missing or invalid Authorization header. }
        '404': { description: No element at that path. }
        '500': { $ref: '#/components/responses/AasFailure' }

  /functions/v1/fplus-directory:
    get:
      tags: [Directory]
      summary: Factory+ Directory adapter (also served at /ping and /v1/*)
      description: |
        Serves the read half of the **Factory+ Directory** component's REST contract by projecting
        tables this platform already has. It is an *adapter*: nothing upstream of it knows the
        Directory exists.

        The gateway routes it at the **unprefixed** paths a Factory+ client expects — `/ping` and
        `/v1/…` — because such a client has no Supabase `apikey` and no way to acquire one. Those
        routes are exempt from `key-auth`, so **the function itself is the only thing in front of
        the data**: every `/v1/` path refuses a request with no bearer token, before it routes,
        and then queries **as the caller** so RLS still applies. It holds no service-role key.

        Identity mapping:

        | Factory+ | Here |
        | :--- | :--- |
        | `Instance_UUID` | `devices.id` / `gateways.id` — already RFC4122 |
        | Sparkplug address | `(gateways.sparkplug_group, gateways.sparkplug_id)` |
        | `Schema_UUID` | `schemas.id` — **locally minted**, not registered with AMRC |
        | `Service_UUID` | `directory_services.id` — likewise local |

        See `/ping`, `/v1/device`, `/v1/address/{group_id}/{node_id}`, `/v1/schema`,
        `/v1/schema/{schema_uuid}` and `/v1/service` below for the individual endpoints.
      responses:
        '404':
          description: |
            No route. Invoked under `/functions/v1/` the handler still works, but the documented
            entry points are the unprefixed ones.
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /ping:
    get:
      tags: [Directory]
      summary: Directory liveness — unauthenticated by specification
      description: |
        **Requires no `apikey` and no bearer token.** Factory+ requires every component to serve
        this so a client can discover what it is talking to before holding a credential for it.

        It reports the service's identity and version and **nothing about the fleet** — no counts,
        no names — which is what makes being open cost nothing.
      security: []
      responses:
        '200':
          description: The adapter is live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: fplus-directory }
                  status: { type: string, example: ok }
                  version: { type: string, example: '1.0.0' }
                  factoryplus_payload_uuid:
                    type: string
                    example: 11ad7b32-1d32-4c4a-b0c9-fa049208939a
                    description: The Factory+ Sparkplug payload marker this deployment's births carry.
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/device:
    get:
      tags: [Directory]
      summary: Every known device Instance_UUID
      description: |
        Returns a JSON **array of UUID strings**, matching the Factory+ Directory's own shape — a
        client enumerates, then fetches the ones it cares about.

        Archived devices are excluded. Quarantined devices are **included**, deliberately: they
        exist on the wire, so a client meeting their traffic needs to be able to look them up. The
        per-device response carries a `quarantined` flag saying why telemetry is not being stored.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Instance_UUIDs.
          content:
            application/json:
              schema: { type: array, items: { type: string, format: uuid } }
        '401': { description: 'No bearer token. Enforced by the function, not by the gateway.' }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/device/{instance_uuid}:
    get:
      tags: [Directory]
      summary: One device's address, status and schemas
      security:
        - bearerAuth: []
      parameters:
        - name: instance_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: '`devices.id`. A `sparkplug_id` here returns `400` with a pointer to `/v1/address/…`.'
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryDevice' }
        '400': { description: Not an RFC4122 UUID. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such device. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/address/{group_id}/{node_id}:
    get:
      tags: [Directory]
      summary: Resolve a Sparkplug address to its edge node and devices
      description: |
        The endpoint migration `0008` exists for. Before `gateways.sparkplug_group`, a node id
        alone was the whole address and two groups collided into one row — silently.

        The edge node reports `schemas: []`: claiming Factory+'s component schema
        (`05688a03-…`) would assert that it serves a `Service_UUID` at a `Service_URL`, which it
        does not.
      security:
        - bearerAuth: []
      parameters:
        - { name: group_id, in: path, required: true, schema: { type: string }, description: 'e.g. `Aber`' }
        - { name: node_id, in: path, required: true, schema: { type: string }, description: 'The gateway `sparkplug_id`.' }
      responses:
        '200':
          description: The edge node and the devices behind it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: { type: string, format: uuid }
                  name: { type: string }
                  address: { $ref: '#/components/schemas/SparkplugAddress' }
                  online: { type: boolean }
                  last_change: { type: string, format: date-time, nullable: true }
                  schemas: { type: array, items: { type: string } }
                  devices: { type: array, items: { $ref: '#/components/schemas/DirectoryDevice' } }
        '400': { description: Malformed address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No edge node at that address. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/schema:
    get:
      tags: [Directory]
      summary: Schema identifiers in use
      description: |
        **Locally minted, and the response says so.** Factory+ `Schema_UUID`s are registered
        against the AMRC schema repository; these are this deployment's own `schemas.id` values.
        Returning them unqualified would assert an interoperability that does not exist — the same
        rule the semantic-id namespace follows.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active schema versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string, example: local }
                  note: { type: string }
                  schemas:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: { type: string, format: uuid }
                        name: { type: string }
                        version: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/schema/{schema_uuid}:
    get:
      tags: [Directory]
      summary: Which devices implement one schema
      description: |
        The reverse of every other lookup here. The rest of this tag starts from an asset and
        reports its schemas; this starts from a schema and reports its assets — the question a
        client integrating against a **model** rather than against a machine asks.

        **No status filter, unlike `/v1/schema`.** That route lists what is in use and returns
        only `active` versions; this one resolves an identifier the caller already holds, and the
        most useful case it answers is the one a filter would hide — an **archived** schema with
        devices still attached, which is a migration that has not finished. `status` is returned
        so the caller can tell the two apart.

        Members are read through the `device_schemas` **view**, as every other reader of a
        device's schemas. Each device reports its **full** schema set, not just this one. Archived devices are
        excluded; a schema nothing implements is `200` with an empty `devices` array, not `404`.
      security:
        - bearerAuth: []
      parameters:
        - name: schema_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: '`schemas.id`. A `schema_name` here returns `400` with a pointer to `/v1/schema`.'
      responses:
        '200':
          description: The schema and the devices implementing it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string, example: local }
                  note: { type: string }
                  uuid: { type: string, format: uuid }
                  name: { type: string }
                  version: { type: integer }
                  status: { type: string, enum: [draft, active, archived] }
                  devices: { type: array, items: { $ref: '#/components/schemas/DirectoryDevice' } }
        '400': { description: Not an RFC4122 UUID. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such schema, or none the caller's policies let it read. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /v1/service:
    get:
      tags: [Directory]
      summary: Advertised stack services
      description: 'Stack service endpoints, not registered Factory+ `Service_UUID`s.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace: { type: string, example: local }
                  note: { type: string }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: { type: string, format: uuid }
                        name: { type: string }
                        type: { type: string }
                        url: { type: string }
                        online: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /functions/v1/grafana-alert-webhook:
    post:
      tags: [Edge Functions]
      summary: Receive a Grafana alert notification
      description: |
        The delivery target of Grafana's `Aber Webhook` contact point. Accepts an
        Alertmanager-shaped payload and records each instance as an occurrence in
        `public.platform_alerts`, which the dashboard then receives over Realtime.

        **Authenticated by a scoped bearer secret, not by a Supabase key.** Grafana presents
        `GRAFANA_ALERT_WEBHOOK_SECRET`; this function verifies it and then uses its own service-role
        client internally. Grafana is deliberately *not* given the service-role key — that key
        bypasses RLS entirely and can rewrite `audit_trail`, and a service fronted by browser SSO
        gets the narrowest credential that does its job. Same shape as `nodered_webhook_jwt_secret`
        for the quarantine webhook.

        **An unset secret answers 503, never 200.** The check fails closed, so a missing environment
        variable is a broken integration rather than an unauthenticated write endpoint.

        **Not exempt from the gateway's API-key check.** The contact point carries the publishable key in the query
        string (`?apikey=…`) because Grafana's webhook integration exposes only one header pair and
        it is spent on `Authorization`. `hide_credentials` keeps the key from being forwarded on.

        **Alerts with no `sparkplug_id` label are counted and skipped, not stored.** A
        `DatasourceError` notification — what `execErrState: Error` produces when a rule's query
        breaks — carries no device label, and inventing one would attribute a broken query to a
        machine. The response reports the skipped count so it is visible in Grafana's delivery log.
        Two kinds need no `sparkplug_id`: `entity_type` `platform`, and `service_identity` (0204),
        whose subject is the machine identity in `principal_id`. One whose `principal_id` is not a
        UUID is skipped the same way.
      security:
        - AlertWebhookBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alerts:
                  type: array
                  description: 'Grafana sends an empty array for a contact-point "Test", which answers 200.'
                  items:
                    type: object
                    properties:
                      status: { type: string, enum: [firing, resolved] }
                      fingerprint: { type: string }
                      startsAt: { type: string, format: date-time }
                      endsAt: { type: string, description: 'Alertmanager sends 0001-01-01T00:00:00Z while still firing.' }
                      labels:
                        type: object
                        properties:
                          alertname: { type: string }
                          severity: { type: string, enum: [critical, warning, info] }
                          entity_type: { type: string, enum: [device, gateway, platform, service_identity], description: 'Defaults to device.' }
                          sparkplug_id: { type: string }
                          principal_id: { type: string, format: uuid, description: 'The machine identity a service_identity alert is about.' }
                          device: { type: string }
                      annotations:
                        type: object
                        properties:
                          summary: { type: string }
      responses:
        '200':
          description: Recorded. `written` excludes anything skipped for want of a device label.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  received: { type: integer }
                  written: { type: integer }
                  skipped: { type: integer }
        '400': { description: 'Body is not valid JSON.' }
        '401': { description: 'Missing, malformed or incorrect bearer secret.' }
        '405': { description: 'Method other than POST.' }
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '503': { description: 'GRAFANA_ALERT_WEBHOOK_SECRET is not configured; refusing to accept alerts.' }

  /functions/v1/forge-events:
    post:
      tags: [Edge Functions]
      summary: Gitea's push webhook; records the head of main on the gateway's row
      description: |
        Registered on each gateway repository at enrolment (archived migration 0095). Gitea delivers every push
        to `main` here, signed: `X-Gitea-Signature` is the hex HMAC-SHA256 of the raw body under
        `GITEA_WEBHOOK_SECRET`, and the signature is the whole of the authentication -- Envoy's key-auth
        proves only that the caller holds the publishable key. On a verified push the gateway named by the
        repository (`gateway-<sparkplug_id>`) records the commit's sha, its message's first line, who
        pushed it, when, and the SHA-256 of `flows.json` at that commit, read through the machine account.

        Pushes to other branches, repositories that are not a gateway's, deleted branches, non-push events
        and gateways this database does not know are answered 200 with `ignored`, because a non-2xx is a
        failed delivery on the hook's page and none of those is a failure.
      security:
        - apiKeyAuth: []
      parameters:
        - in: header
          name: X-Gitea-Event
          required: true
          schema: { type: string, example: push }
        - in: header
          name: X-Gitea-Signature
          required: true
          schema: { type: string }
          description: Hex HMAC-SHA256 of the raw request body under the hook's secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Gitea's push event payload.
      responses:
        '200':
          description: Recorded (`recorded` names the gateway and the commit) or ignored (`ignored` says why).
        '401':
          description: The signature is missing or does not verify.
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '503':
          description: GITEA_WEBHOOK_SECRET is not configured; nothing is accepted.
  /functions/v1/forge-membership:
    post:
      tags: [Edge Functions]
      summary: Place the caller in the forge team their role warrants (the forge listener's ext_authz step)
      description: |
        Called by the gateway's `forge` listener on every non-static request through the forge's door,
        carrying the verified access token (archived migration 0094). Resolves the caller's role from
        `user_roles` and ensures they are in exactly the team of the `gateways` organisation that role
        maps to -- `administrators` or `managers` -- through the machine account that owns it. A role
        that has been removed since the token was signed is refused and taken out of both teams on the
        same request, which is the revocation the listener's own token check cannot give.

        **Acts only on the caller.** The identity is the token's subject and never a parameter; calling
        it directly places nobody but yourself, in the team you already warrant. Any method is accepted:
        the listener forwards the original request's method.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller holds an admitted role and is in its team, or is not yet registered in the forge (the first request through the door).
        '302':
          description: The token verified but GoTrue no longer holds its session (a sign-out, a timebox). `Location` is the door's `/oauth2/signout`, which clears the cookies and starts a fresh login.
        '401':
          description: No bearer token at all.
        '403':
          description: The caller's role does not open the forge. Any team membership they held has been removed.
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '502':
          description: The forge could not be reached or refused the placement. The listener lets the request through.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FunctionError' } } }
        '503':
          description: This deployment has no forge configured, or the role lookup failed. The listener lets the request through.
  /functions/v1/studio-admission:
    post:
      tags: [Edge Functions]
      summary: Whether the caller is an Administrator now (the studio listener's ext_authz step)
      description: |
        Called by the gateway's `studio` listener on every request through Studio's door, after the
        listener has verified the access token and admitted its `app_metadata.role` claim. Asks GoTrue
        whether the token's session still exists, then reads the caller's role from `user_roles`, so a
        person whose access was removed or whose role changed since the token was signed is refused on
        their next request rather than when the token expires.

        **Acts only on the caller**, whose identity is the token's subject. Calling it directly tells you
        whether you are an Administrator, and nothing else. Any method is accepted: the listener forwards
        the original request's method.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller is an Administrator in `user_roles`.
        '302':
          description: The token verified but GoTrue refuses it (a ban, a sign-out, a password set since). `Location` is the door's `/oauth2/signout`, which clears the cookies and starts a fresh login.
        '401':
          description: No bearer token at all.
        '403':
          description: The caller holds another role, or none.
        '503':
          description: GoTrue or the role lookup did not answer. The listener admits on the role claim it already checked.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FunctionError' } } }
  /functions/v1/forge-sweep:
    post:
      tags: [Edge Functions]
      summary: Reconcile the forge with user_roles and furnish its repositories (the fifteen-minute sweep)
      description: |
        **Called by the database, not by a browser.** `sweep_forge()` (migration `0099`) reaches this
        through the gateway with `pg_net` every fifteen minutes from `pg_cron`.

        One pass removes every team member whose `user_roles` row no longer maps to that team, seats
        every login the forge knows that holds an admitted role, gives every gateway repository its
        push webhook and branch protection back, and protects `main` on any other repository in the
        `gateways` organisation (a playbook made by hand), without the incident template. It is the
        backstop for what `forge-membership` does at the door: a revoked login that never returns is
        unseated here, and its SSH key with it. A member who is not a dashboard identity was seated by
        hand and is left alone. Nothing is created that enrolment would not create, and nothing is
        deleted.

        Authorised by `FORGE_SWEEP_SECRET` in the `x-sweep-secret` header, **not** by the publishable key.
        The identities acted on come from `user_roles` and the forge's own lists, never from the
        request, so a caller holding the secret can only make the forge more correct, and sooner.

        **One pass at a time** (archived migration `0156`). A pass holds a five-minute lease from before it
        reads the forge until it answers; a call that finds the lease held does nothing and answers
        200 with `already_sweeping: true`. The running pass, or the one its release then queues,
        sees whatever that call was asked about.
      security:
        - apiKeyAuth: []
      parameters:
        - in: header
          name: x-sweep-secret
          required: true
          schema: { type: string }
        - in: header
          name: x-sweep-lease
          required: false
          description: >-
            A lease the caller holds, from `claim_forge_sweep()` as `service_role`. The pass renews
            it, runs under it and leaves it held, so no other pass runs between the caller's changes
            and this one.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored; the sweep takes no parameters.
      responses:
        '200':
          description: >-
            The pass completed. `placed`, `removed`, `hooked`, `protected`, `rekeyed`, `revoked`,
            `archived`, `restored`, `published` and `recorded` list what changed; `errors` lists what
            the forge refused, per item; `warnings` lists what the sweep declined and was right to
            decline -- a released tag found at other content than this build ships, which no retry
            clears and only a version bump resolves. Or, with the body `{"already_sweeping": true}`
            and nothing else, another pass holds the lease and this call did nothing.
        '401':
          description: The secret is missing or wrong.
        '409':
          description: The lease named in `x-sweep-lease` is not held, because it was released or lapsed and was taken over.
        '500': { $ref: '#/components/responses/FunctionFailure' }
        '502':
          description: >-
            The forge could not be reached or the organisation could not be read, or the lease could
            not be read; nothing further was attempted.
          headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FunctionError' } } }
        '503':
          description: FORGE_SWEEP_SECRET is not configured, or this deployment has no forge.
  /functions/v1/forge-signout:
    get:
      tags: [Edge Functions]
      summary: Gitea's own sign-out link, routed here by the forge listener; ends the door's session and sends the browser to the dashboard's sign-out
      description: |
        The forge listener routes Gitea's `GET /user/logout` here. Under reverse-proxy
        authentication Gitea's own sign-out is a no-op -- the next request carries the identity header
        again -- and the forge has no session of its own. So this ends the one GoTrue session the
        token names (`scope=local`): the door's own, issued to the forge's OAuth client. The person's
        other sessions, in other browsers and services, are left alone.

        The browser is then sent to the dashboard's `/sign-out?from=forge`, which ends the person's
        door sessions (`/rest/v1/rpc/end_my_door_sessions`) and signs that browser out of the
        dashboard, so the door's next login meets nobody signed in. The dashboard's address is `FRONTEND_PUBLIC_URL`; without it the
        browser is sent through the door's own `/oauth2/signout` instead, and a warning is logged.

        The token is the one the listener verified and forwarded. Called directly with a bearer it
        ends that bearer's session; with no bearer it only redirects.
      security:
        - bearerAuth: []
      responses:
        '302':
          description: Always. `Location` is the dashboard's `/sign-out?from=forge`, or the door's `/oauth2/signout` without `FRONTEND_PUBLIC_URL`. The session the token names has ended if a usable token was presented.
        '500': { $ref: '#/components/responses/FunctionFailure' }
  /functions/v1/grafana-userinfo:
    get:
      tags: [Edge Functions]
      summary: OIDC userinfo for Grafana's `api_url`
      description: |
        Returns the standard identity claims plus `role`, read from `public.user_roles` and
        mapped to a Grafana org role.

        **Exempt from the gateway's API-key check, by exact path.** An OAuth client presents client
        credentials, never a Supabase `apikey`, and Grafana has no setting that adds a header
        to `api_url` — with this gated, the call 401s, Grafana falls back to the token's stock
        `role: authenticated` claim, and reports `[oauth.invalid_role] invalid role:
        Authenticated`, which reads as an RBAC fault rather than a gateway refusal.

        **`role` is omitted entirely when unmapped**, which is what makes
        `role_attribute_strict` refuse the login. It is never defaulted.

        Role mapping never reads the token: GoTrue's OIDC claims omit `app_metadata`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, format: uuid }
                  email: { type: string }
                  email_verified: { type: boolean }
                  name: { type: string }
                  role: { type: string, enum: [Admin, Editor, Viewer], description: Absent when the Supabase role could not be mapped. }
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

  /functions/v1/nodered-userinfo:
    get:
      tags: [Edge Functions]
      summary: Identity and Node-RED permissions for the bearer token
      description: |
        Called by Node-RED's `adminAuth` — during an editor sign-in and when validating a
        forwarded service token. Returns identity claims plus `permissions` read from
        `public.user_roles`: `Administrator` and `Shopfloor_Manager` map to `*`, `Operator`
        and `Auditor` to `read`.

        **Separate from `grafana-userinfo` deliberately.** The mapping is an authorisation
        decision, and one endpoint serving both would let a change made for one product's role
        model silently move the other's.

        **`permissions` is omitted entirely when the role is unmapped, absent or unreadable**,
        which is what makes Node-RED refuse the login. It is never defaulted to `read` — an
        unmapped role is a provisioning error, and a revoked one must not stay usable.

        Also exempt from the gateway's API-key check, by exact path.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, format: uuid }
                  email: { type: string }
                  email_verified: { type: boolean }
                  supabase_role: { type: string, nullable: true, example: Administrator }
                  permissions: { type: string, enum: ['*', read], description: Absent when the role could not be mapped. }
        '401': { description: Missing or invalid Authorization header. }
        '500': { $ref: '#/components/responses/FunctionFailure' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Your own access token, from **Profile → Copy Token** in the dashboard, or a machine
        identity's token from **Access Control**. Paste it without the word `Bearer`. Your own
        token acts as you and lasts at most an hour; a machine identity's lasts 7 to 90 days.
        A script with no dashboard gets one from `POST /auth/v1/token?grant_type=password`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: The publishable key (`sb_publishable_*`). Required on every request except the public-storage and userinfo endpoints.
    AlertWebhookBearer:
      type: http
      scheme: bearer
      description: |
        `GRAFANA_ALERT_WEBHOOK_SECRET` — a shared secret, NOT a JWT and not a Supabase key. Held only
        by Grafana's contact point and verified by `grafana-alert-webhook`, which authorises exactly
        one action: recording an alert. It exists so Grafana is never given the service-role key.

  parameters:
    Select:
      name: select
      in: query
      schema: { type: string }
      description: 'Columns and embedded relations, e.g. `*,gateways(id,name,devices(id,name))`.'
    Order:
      name: order
      in: query
      schema: { type: string }
      description: 'e.g. `created_at.desc`, `name.asc`.'
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 100 }
      description: Maximum rows to return.
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
      description: Rows to skip — combine with `limit` to page.
    Prefer:
      name: Prefer
      in: header
      schema:
        type: string
        enum: [return=representation, return=minimal, count=exact]
      description: '`return=representation` echoes the written rows; `count=exact` adds a total to `Content-Range`.'

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
    Forbidden:
      description: Authenticated, but the role is not permitted. RLS policies fail closed.
    NotFound:
      description: |
        A row the call names does not exist: the proposal, the schema, or the asset a proposal
        targets. `code` is `P0002`, as the database raised it, and `message` says which row.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: P0002 }
              message: { type: string, example: proposal 7fffffff-0000-4000-8000-00000000dead not found }
              details: { type: string, nullable: true }
              hint: { type: string, nullable: true }

    FunctionFailure:
      description: |
        The function failed, and nothing the caller sends differently would help. The body is a
        fixed sentence and a request id, and `X-Request-Id` carries the same id. The error itself is
        logged under that id (`supabase/functions/README.md`, *Finding the cause*), never returned.
        Every function answers this way when the router cannot start it, with `error` reading
        `Failed to invoke '<name>'`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FunctionError' }
    AasFailure:
      description: |
        The function failed, in the AAS specification's error shape: `text` is a fixed sentence and
        `correlationId` the request id, which `X-Request-Id` carries too. The error is logged under
        that id. When the router cannot start the function, the body is a `FunctionError` instead.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema:
            type: object
            properties:
              messages:
                type: array
                items:
                  type: object
                  properties:
                    messageType: { type: string, example: Error }
                    text: { type: string, example: The request failed on the server. }
                    code: { type: string, example: '500' }
                    correlationId: { type: string, description: The request id. }
                    timestamp: { type: string, format: date-time }

  headers:
    RequestId:
      description: >-
        The request id: the one the request carried, when it was 8 to 128 letters, digits, `.`,
        `_` or `-` (the gateway sends a UUID), otherwise a new UUID.
      schema: { type: string, example: 3f6c1b52-8a0e-4d6f-9b1e-2c7d5a4e9f10 }

  schemas:

    SemanticIdType:
      type: string
      nullable: true
      enum: [IRI, IRDI, ExpandedNodeId]
      description: |
        Which kind of AAS Reference `semantic_id` is: an IRI (a URL or URN), an IRDI (an ECLASS
        or IEC CDD code) or an ExpandedNodeId (an OPC UA node, `nsu=<namespace URI>;i=<id>`).
        CHECK-constrained (`0001`); all three export as an `ExternalReference`.
        `ModelReference` was withdrawn because the exporter cannot emit one. **Never
        half-populated**: the dashboard writes the pair together, with the type NULL whenever the
        id is.

    LocationScope:
      type: string
      enum: [cell, area_wide, site_wide]
      default: cell
      description: |
        `site_wide` is an operator's assertion that this asset has no single cell and no single
        area: it serves the whole campus (an AGV, an ambient sensor). `area_wide` is the same
        assertion one level down: no single cell, one area (a building management system), and it
        REQUIRES `area_id`. A CHECK forbids either alongside a populated `cell_id`, and forbids
        `area_id` on anything but `area_wide` — a cell-scoped asset's area is its cell's, read from
        `device_locations`.

        **Scope does not inherit; only `cell_id` does.** A device behind a site-wide gateway
        resolves to *Unassigned*, not to Site-Wide.

    Area:
      type: object
      description: An ISA-95 area — one part of the one site. The level between the site (a setting, `site.name`) and the cells.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, example: North Shop, description: 'UNIQUE, and the `<area>` segment of every `uns/` topic beneath it, so it cannot contain `/`, `+` or `#`.' }
        description: { type: string, nullable: true }
        icon: { type: string, default: Building2, enum: [Building2, Factory, Warehouse, FlaskConical, Truck, Parking, Trees, Zap], description: 'Icon key, a closed set (`areas_icon_valid`) rendered by the dashboard from a bundled SVG set. A picture to tell areas apart: nothing classifies by it.' }
        is_archived: { type: boolean, default: false }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true, description: 'Retention purge deadline. NULL means permanent retention — the purge honours this, never `archived_at` age.' }
        created_at: { type: string, format: date-time, readOnly: true }
        plan_path: { type: string, nullable: true, description: 'Object path of the SVG plan in the private `area-plans` bucket, `<area_id>/<file>.svg`, or NULL for the default outline. Set through the dashboard, which uploads the object first.' }
        plan_aspect: { type: number, nullable: true, description: 'Width over height of the plan''s viewBox; NULL exactly when `plan_path` is. Cell places are fractions of the plan, so this is what turns them back into a distance.' }
        cells:
          type: array
          description: Present only when embedded via `select`.
          items: { $ref: '#/components/schemas/Cell' }

    AreaWrite:
      type: object
      properties:
        name: { type: string, example: North Shop }
        description: { type: string, nullable: true }
        icon: { type: string, enum: [Building2, Factory, Warehouse, FlaskConical, Truck, Parking, Trees, Zap] }
        plan_path: { type: string, nullable: true }
        plan_aspect: { type: number, nullable: true }
        is_archived: { type: boolean, description: 'true is refused while any device or gateway is `area_wide` in the area (see the PATCH). Nothing can be made `area_wide` in an archived area.' }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true }

    Cell:
      type: object
      description: A shopfloor cell, the ISA-95 level below an area.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, example: Assembly Line 1, description: 'UNIQUE — cells are not addressed on the wire, so a stable name is safe here. It is the `<cell>` segment of its `uns/` topics, so a new name cannot contain `/`, `+` or `#`.' }
        area_id: { type: string, format: uuid, nullable: true, description: 'The area this cell is filed in. NULL is unfiled, which the dashboard lists as a queue.' }
        plan_x: { type: number, nullable: true, minimum: 0, maximum: 1, description: 'Where the cell sits on its area''s plan, as a fraction of the plan''s width. Set with `plan_y` or not at all, requires `area_id`, and is refused closer than `site_map.min_pin_spacing` (a fraction of the plan''s shorter side) to another cell in the same area. Moving the cell to another area clears it, unless the same write names a new place.' }
        plan_y: { type: number, nullable: true, minimum: 0, maximum: 1, description: 'Fraction of the plan''s height, 0 at the top.' }
        description: { type: string, nullable: true, description: 'Free text. The Cells page shows it under the name and in the drawer, and the Site Map as a field in the cell''s panel. i3X serves it as the cell object''s description.' }
        icon: { type: string, default: Factory, enum: [Factory, Bot, Cog, CircuitBoard, Gauge, Building2, Truck, Zap], description: 'Icon key, a closed set (`cells_icon_valid`) rendered by the dashboard from a bundled SVG set. A picture to tell cells apart: nothing classifies by it.' }
        grafana_url: { type: string, nullable: true, deprecated: true, description: 'Deprecated in 1.7.0, and removed no sooner than 1.8.0. Each cell''s `http://` or `https://` address moved to `/rest/v1/links` as a link named `Dashboard` (`entity_type` `cell`, `entity_id` the cell''s id, `link_tag` `other`), and the column was cleared, so it reads NULL. A web address written here moves the same way at the next restart; any other value stays. Not proposable.' }
        is_archived: { type: boolean, default: false }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true, description: 'Retention purge deadline. NULL means permanent retention — the purge honours this, never `archived_at` age.' }
        created_at: { type: string, format: date-time, readOnly: true }
        gateways:
          type: array
          description: Present only when embedded via `select`.
          items: { $ref: '#/components/schemas/Gateway' }

    CellWrite:
      type: object
      properties:
        name: { type: string, example: Assembly Line 1 }
        area_id: { type: string, format: uuid, nullable: true }
        plan_x: { type: number, nullable: true }
        plan_y: { type: number, nullable: true }
        description: { type: string, nullable: true }
        icon: { type: string, enum: [Factory, Bot, Cog, CircuitBoard, Gauge, Building2, Truck, Zap] }
        grafana_url: { type: string, nullable: true, deprecated: true, description: 'Deprecated in 1.7.0, and removed no sooner than 1.8.0. Each cell''s `http://` or `https://` address moved to `/rest/v1/links` as a link named `Dashboard` (`entity_type` `cell`, `entity_id` the cell''s id, `link_tag` `other`), and the column was cleared, so it reads NULL. A web address written here moves the same way at the next restart; any other value stays. Not proposable.' }
        is_archived: { type: boolean, description: 'true is refused while any device or gateway is in the cell (see the PATCH). No device or gateway can be filed in an archived cell.' }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true }

    Gateway:
      type: object
      description: An edge gateway (Sparkplug B edge node).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name:
          type: string
          example: Sim_Gateway_Cell1_Machining
          description: Display label only. Freely editable and NOT unique; edge nodes are matched on `sparkplug_id`.
        description: { type: string, nullable: true, description: 'Operator note. Shown in the dashboard, and served by i3X as the gateway object''s description; nothing acts on it.' }
        sparkplug_id:
          type: string
          readOnly: true
          example: gwy120000000000400080000
          description: >-
            Immutable Sparkplug B edge node id, generated from the primary key ('gwy' plus 21 hex
            characters, 24 total). This is the edge node segment of the MQTT topic, and the MQTT
            username a provisioned gateway authenticates with.
        cell_id: { type: string, format: uuid, nullable: true }
        sparkplug_group:
          type: string
          default: Aber
          description: >-
            Sparkplug B Group ID -- the second topic segment. With `sparkplug_id` it forms the edge
            node address Factory+ resolves as (group, node), which is what `/v1/address/…` reads.
            Editable, unlike `sparkplug_id`: it is a configuration choice, not an issued identity.
        observed_sparkplug_group:
          type: string
          nullable: true
          readOnly: true
          example: Aber
          description: >-
            The Sparkplug group this edge node last published under, from the topic of its last
            node-level message, written by the ingestion daemon when it changes (migration `0174`).
            NULL until one arrives. When it differs from `sparkplug_group` the node publishes outside
            the group it is addressed by: ingestion still accepts it by `sparkplug_id`, and the
            Gateways page warns.
        location_scope: { $ref: '#/components/schemas/LocationScope' }
        area_id: { type: string, format: uuid, nullable: true, description: 'Populated exactly when `location_scope` is `area_wide`.' }
        access_url: { type: string, nullable: true, description: 'The gateway''s own UI. Omitted rather than disabled in the dashboard when absent.' }
        status: { type: string, enum: [ONLINE, OFFLINE], default: OFFLINE }
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Receipt time of the last node-level Sparkplug B message. NULL means none has ever arrived.
        deployment: { type: string, enum: [host, remote, third_party], description: "Where this gateway's connector runs: host (inside Aber), remote (Aber's gateway appliance) or third_party (an edge node on its own machine, running software Aber does not manage; 0196). Replaced is_virtual, which meant three different things." }
        is_archived: { type: boolean, default: false }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        devices:
          type: array
          description: Present only when embedded via `select`.
          items: { $ref: '#/components/schemas/Device' }

    GatewayWrite:
      type: object
      properties:
        name: { type: string, example: Sim_Gateway_Cell1_Machining }
        description: { type: string, nullable: true, description: 'Operator note. Shown in the dashboard, and served by i3X as the gateway object''s description; nothing acts on it.' }
        sparkplug_group:
          type: string
          example: Aber
          description: >-
            The Sparkplug B Group ID. Left out on POST, a new gateway takes the site's group. Not empty,
            and no `/`, `+` or `#` (`gateways_sparkplug_group_format`, 23514 otherwise). Changing it
            moves the gateway's Factory+ Directory address; it does not reconfigure the edge node,
            which goes on publishing under its own group until it is changed there (an enrolled
            appliance keeps its enrolment group until it is set up again). Administrator and
            Shopfloor_Manager only, as for every gateway update.
        cell_id: { type: string, format: uuid, nullable: true }
        area_id: { type: string, format: uuid, nullable: true }
        location_scope: { $ref: '#/components/schemas/LocationScope' }
        access_url: { type: string, nullable: true }
        status: { type: string, enum: [ONLINE, OFFLINE] }
        deployment: { type: string, enum: [host, remote, third_party] }
        is_archived: { type: boolean }

    GatewayStatus:
      allOf:
        - $ref: '#/components/schemas/Gateway'
        - type: object
          description: Read-time derivation over `gateways`.
          properties:
            live_status:
              type: string
              enum: [ONLINE, OFFLINE, STALE]
              readOnly: true
              description: 'STALE when the last heartbeat is older than 90 seconds. Never stored.'
            is_stale: { type: boolean, readOnly: true }
            heartbeat_age_seconds: { type: integer, nullable: true, readOnly: true }

    Device:
      type: object
      description: A shopfloor device served by an edge gateway.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name:
          type: string
          example: Sim_CNC_Mill_01
          description: Display label only. Freely editable and NOT unique; renaming does not affect ingestion or telemetry history.
        description: { type: string, nullable: true, description: 'Operator note. Shown in the dashboard, and served by i3X as the device object''s description; nothing acts on it. Typed identification belongs in the nameplate.' }
        sparkplug_id:
          type: string
          readOnly: true
          example: dev220000000000400080000
          description: >-
            Immutable Sparkplug B device id, generated from the primary key ('dev' plus 21 hex
            characters, 24 total). Appears in the MQTT topic of every device that can be set to
            publish it; one that cannot publishes its own id or its Instance_UUID instead
            (`identity_source` says which). Keys telemetry and birth parameters either way.
        reported_identity:
          type: string
          nullable: true
          readOnly: true
          description: The id this device actually publishes under, when it differs from the issued `sparkplug_id`.
        quarantine_reason:
          type: string
          nullable: true
          readOnly: true
          description: '`UNKNOWN_DEVICE`, `MALFORMED_IDENTITY`, `IDENTITY_MISMATCH` or `GATEWAY_MISMATCH`, followed by a detail message.'
        identity_source:
          type: string
          nullable: true
          readOnly: true
          enum: [sparkplug_id, reported_identity, instance_uuid]
          description: >-
            How ingestion last resolved this device. `instance_uuid` means it was addressed by its
            Factory+ Instance_UUID (which is `devices.id`).
        gateway_id: { type: string, format: uuid, nullable: true, description: 'Serving gateway — the DATA PATH, not the location.' }
        cell_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Explicit LOCATION OVERRIDE. NULL means inherit from the gateway; it is not a stored
            "unassigned", and the column has no default — a default would make inheritance
            unreachable. Read `device_locations.effective_cell_id` to display.
        area_id: { type: string, format: uuid, nullable: true, description: 'Populated exactly when `location_scope` is `area_wide`. Read `device_locations.effective_area_id` to display.' }
        location_scope: { $ref: '#/components/schemas/LocationScope' }
        status: { type: string, enum: [ONLINE, OFFLINE], default: OFFLINE, description: 'Set ONLINE on DBIRTH, OFFLINE on DDEATH, and OFFLINE by the ingestion watchdog after a configurable silence. DDATA from a device the watchdog timed out sets it ONLINE again.' }
        is_quarantined:
          type: boolean
          default: false
          description: True for auto-discovered devices awaiting approval. Their DDATA is dropped.
        model_3d_path:
          type: string
          nullable: true
          description: >-
            An object KEY in the `asset-3d-models` bucket, never a URL. A stored URL bakes in the
            origin of whichever stack uploaded it. The public URL is composed at read time from
            AAS_MODEL_PUBLIC_BASE. CHECK-constrained on the file extension.
        connection_method: { type: string, nullable: true, example: Sparkplug B }
        shadow_of:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >-
            For a playback lane: the real machine whose recordings this device replays. NULL for
            every ordinary device. Set only by `ensure_shadow_devices()` (0060) — a lane is created
            as a side effect of preparing a playback and reused thereafter, one per (playback
            gateway, original device). The API refuses to set, change or clear it, and to move a
            lane to another gateway (0187). This is PROVENANCE and not a copy of a gateway flag: whether
            a device is synthetic still derives from `gateways.is_shadow` / `is_simulated`.
            A lane carries its original's schemas and deliberately NOT its nameplate — a serial
            number identifies one physical object, and a copy would make the AAS export emit two
            shells asserting the same asset identity.
        first_dbirth_at: { type: string, format: date-time, nullable: true, readOnly: true, description: 'Write-once — a later rebirth never overwrites it.' }
        last_birth_metrics:
          type: array
          nullable: true
          readOnly: true
          items: { type: string }
          example: [Systems/TEMPERATURE, Controller/EXECUTION]
          description: >-
            Metric names declared in the most recent DBIRTH, written by the ingestion daemon and
            ONLY when the set changes (an unchanged rewrite would append an audit row per rebirth).
            NULL means no birth observed; an empty array means a birth that declared nothing beyond
            the identity metrics and Sparkplug's control metrics (`bdSeq`, `Node Control/*`,
            `Device Control/*`), which are never listed. Which of these fall outside the device's schemas is derived by the client,
            never stored, so editing a schema reclassifies devices without waiting for a rebirth.
        last_birth_metrics_at: { type: string, format: date-time, nullable: true, readOnly: true }
        is_archived: { type: boolean, default: false }
        archived_at: { type: string, format: date-time, nullable: true }
        auto_delete_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }

    DeviceWrite:
      type: object
      properties:
        name: { type: string, example: Sim_CNC_Mill_01 }
        description: { type: string, nullable: true, description: 'Operator note. Shown in the dashboard, and served by i3X as the device object''s description; nothing acts on it.' }
        gateway_id: { type: string, format: uuid, nullable: true }
        cell_id: { type: string, format: uuid, nullable: true, description: 'Send NULL to clear an override and return the device to inheriting.' }
        area_id: { type: string, format: uuid, nullable: true, description: 'Required with `location_scope=area_wide`; must be NULL otherwise.' }
        location_scope: { $ref: '#/components/schemas/LocationScope' }
        status: { type: string, enum: [ONLINE, OFFLINE] }
        is_quarantined: { type: boolean }
        model_3d_path: { type: string, nullable: true }
        connection_method: { type: string, nullable: true }
        is_archived: { type: boolean }

    DeviceLocation:
      type: object
      readOnly: true
      description: One device's resolved location, from `public.device_locations`.
      properties:
        device_id: { type: string, format: uuid }
        gateway_id: { type: string, format: uuid, nullable: true }
        explicit_cell_id: { type: string, format: uuid, nullable: true, description: 'The raw `devices.cell_id`. This is what an edit form must round-trip.' }
        gateway_cell_id: { type: string, format: uuid, nullable: true }
        location_scope: { $ref: '#/components/schemas/LocationScope' }
        effective_cell_id: { type: string, format: uuid, nullable: true, description: 'What to display. NULL for every lane — read `location_source` to tell which.' }
        location_source:
          type: string
          enum: [shadow, simulated, site_wide, explicit, inherited, unassigned]
          description: >-
            Which arm answered, most specific first. `shadow` and `simulated` are read off the
            GATEWAY (0059) and resolve to no cell: they are lanes rather than places, and an asset
            behind one is not unfiled but unfileable — `gateways_synthetic_has_no_cell` refuses the
            write. `site_wide` is an operator's assertion that an asset has no single cell.
            `explicit` and `inherited` look identical once resolved, but only the second moves when
            the gateway is reassigned. `unassigned` is the fall-through and the only one that means
            "nobody has decided": it is a queue that should drain, which is why the four above it
            are kept out of it.
          example: inherited
        cell_mismatch: { type: boolean, description: True when an explicit cell disagrees with the gateway's. }

    DeviceUnsPath:
      type: object
      readOnly: true
      description: One device's place in the Unified Namespace, from `public.device_uns_paths` (0214).
      properties:
        device_id: { type: string, format: uuid }
        area_id: { type: string, format: uuid, nullable: true, description: "`device_locations.effective_area_id`." }
        cell_id: { type: string, format: uuid, nullable: true, description: "`device_locations.effective_cell_id`." }
        enterprise: { type: string, nullable: true, description: "The group the gateway last published under, else its configured `sparkplug_group`, else the site's `sparkplug.group_id` for a device with no gateway. `uns_path` starts with it." }
        uns_path: { type: string, nullable: true, description: 'The path below the root, e.g. `Aber/Cardiff/Machine Shop/Bay 1/CNC_01`. NULL when `skip_reason` is set.', example: 'Aber/Cardiff/Machine Shop/Bay 1/CNC_01' }
        skip_reason:
          type: string
          nullable: true
          enum: [site_unset, lane, unassigned, cell_unfiled, unsafe_name]
          description: >-
            Why the bridge publishes nothing for the device, in the order tested: the `site.name`
            setting is empty; it is a Simulated or Shadow lane; nothing places it; its cell is in no
            area; a name on its path is empty or holds `/`, `+` or `#`. NULL when `uns_path` is set.
            The same labels as `aber_ingestion_uns_skipped_total{reason}`.

    DeviceSubmodel:
      type: object
      description: One schema attached to one device, becoming one AAS Submodel.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        device_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        submodel_key: { type: string, nullable: true, description: 'Qualifies the exported idShort when a device carries more than one schema.' }
        created_at: { type: string, format: date-time, readOnly: true }

    DeviceSchema:
      type: object
      readOnly: true
      description: Resolved attachment from `public.device_schemas`.
      properties:
        device_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        submodel_key: { type: string, nullable: true }
        source: { type: string, enum: [device_submodels], deprecated: true, description: 'Always `device_submodels`, since a schema is attached in one place. Deprecated in 1.6.0, and removed no sooner than 1.7.0: stop selecting it.' }

    TelemetryRow:
      type: object
      description: 'One metric sample. Exactly one of val_double / val_string / val_bool is populated.'
      properties:
        time: { type: string, format: date-time }
        asset_id: { type: string, example: dev220000000000400080000, description: "Device Sparkplug ID (devices.sparkplug_id)." }
        metric_name: { type: string, example: Systems/TEMPERATURE }
        val_double: { type: number, nullable: true }
        val_string: { type: string, nullable: true, description: '`Controller/EXECUTION` and `Controller/EMERGENCY_STOP` are STRINGS. A stale `val_bool` test compares NULL, evaluates false, and stops alerting silently.' }
        val_bool: { type: boolean, nullable: true }

    TelemetryBucket:
      type: object
      description: |
        One rollup bucket for a (device, metric) series. Shared by telemetry_1m / _5m / _1h.

        `avg_double` is a true weighted mean, derived from a stored sum and count rather than by
        averaging coarser averages — buckets holding different numbers of samples would otherwise
        be weighted equally.
      properties:
        bucket: { type: string, format: date-time, description: 'Start of the bucket.' }
        asset_id: { type: string, example: dev220000000000400080000, description: "Device Sparkplug ID (devices.sparkplug_id)." }
        metric_name: { type: string, example: Systems/TEMPERATURE }
        avg_double: { type: number, nullable: true, description: 'Weighted mean of the numeric samples; NULL when the bucket held none.' }
        min_double: { type: number, nullable: true, description: 'Kept deliberately — an average alone hides the excursion.' }
        max_double: { type: number, nullable: true }
        last_double: { type: number, nullable: true, description: 'Value at the end of the bucket.' }
        last_string: { type: string, nullable: true, description: 'State metrics cannot be averaged, so they are carried as the value at the end of the bucket. `Controller/EXECUTION` and `Controller/EMERGENCY_STOP` are STRINGS.' }
        last_bool: { type: boolean, nullable: true }
        n_double: { type: integer, description: 'Number of numeric samples in the bucket.' }
        n_rows: { type: integer, description: 'Number of samples of any type in the bucket.' }

    AssetConfigRow:
      type: object
      description: One DBIRTH birth-certificate parameter.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        asset_id: { type: string, example: dev220000000000400080000, description: "Device Sparkplug ID (devices.sparkplug_id) — not the name." }
        metric_name: { type: string, example: Controller/FIRMWARE }
        val_double: { type: number, nullable: true }
        val_string: { type: string, nullable: true }
        val_bool: { type: boolean, nullable: true }
        datatype: { type: integer, nullable: true, example: 12, description: 'Sparkplug B datatype code (9 Float, 10 Double, 11 Boolean, 12 String, …).' }
        updated_at: { type: string, format: date-time }

    AuditTrailEntry:
      type: object
      description: One audit event.
      properties:
        id: { type: integer, readOnly: true }
        entity_type:
          type: string
          enum: [areas, cells, gateways, devices, device_nameplate, device_submodels, schemas, metric_catalog,
                 change_proposals, user_roles, service_principals, broker_accounts, system_settings, backup_jobs,
                 backups, capture_jobs, captures, playback_jobs]
          description: >-
            The table the event is about: the types the trail records today. A trail older than
            their retirement also holds `area_floors`, `cell_links`, `gateway_links` and
            `device_links` rows.
        entity_id: { type: string, format: uuid }
        action:
          type: string
          enum: [INSERT, UPDATE, DELETE, SCHEMA_REJECTION, CREDENTIAL_ISSUED, CREDENTIAL_SHOWN, TOKEN_MINTED, TOKEN_REVOKED,
                 PRINCIPAL_REVOKED, PRINCIPAL_REINSTATED, PRINCIPAL_DESCRIBED, PROPOSAL_APPLIED, EXPORTED,
                 PROPOSAL_EXPIRED, ROLE_GRANTED, ROLE_REVOKED, PERSON_ADDED, ACCESS_REMOVED, ACCESS_RESTORED,
                 PASSWORD_SET, DISPLAY_NAME_CHANGED, EMAIL_CHANGED, SESSIONS_ENDED, MFA_RESET, FLOW_DEPLOYED, BACKUP_REQUESTED,
                 BACKUP_CANCELLED, BACKUP_RELEASED, BACKUP_TAKEN, BACKUP_FAILED, BACKUP_PRUNED,
                 CAPTURE_STARTED, CAPTURE_STOPPED, CAPTURE_RECORDED, CAPTURE_UPLOADED,
                 CAPTURE_DOWNLOAD_ISSUED, CAPTURE_DELETED, PLAYBACK_STARTED, PLAYBACK_STOPPED]
          description: >-
            What happened. The audit trigger on each audited table writes `INSERT`, `UPDATE` and
            `DELETE`; every other action is written by the function that performs the act, such as
            `TOKEN_REVOKED` by `revoke_service_token()`. A service principal's creation is an
            `INSERT` written by `create_machine_principal()`. The capture and playback acts (0193)
            are written by their gates, and `CAPTURE_DELETED` by a trigger on `captures`, so a
            replacement and a deleted subject's cascade are recorded too. `DISPLAY_NAME_CHANGED`
            (0203) is written by a trigger on `person_profiles`, in the person's `user_roles` lane.
            `EMAIL_CHANGED` and `SESSIONS_ENDED` (0207) are written by `record_person_email_change()`
            and `end_person_sessions()`, in the same lane. A person ending their own other sessions
            writes `SESSIONS_ENDED` too, through `end_my_session()` and `end_my_other_sessions()`
            (0211), with themselves in `changed_by`. An Administrator ending one of a person's
            sessions writes it through `end_person_session()` (0212), in the shape
            `end_my_session()` writes. `MFA_RESET` (0216) is written by `record_person_mfa_reset()`
            when an Administrator resets a person's second factor, in their lane, with how many
            factors went. A read-only broker account's creation and deletion are an
            `INSERT` and a `DELETE` in the `broker_accounts` lane, written by
            `record_broker_account_created()` and `record_broker_account_deleted()` (0218).
        old_data: { type: object, nullable: true }
        new_data: { type: object, nullable: true }
        changed_by: { type: string, format: uuid, nullable: true, description: '`auth.users` id, or NULL for changes made by a service.' }
        actor_source: { type: string, nullable: true, enum: [user, ingestion, service, migration], description: 'A person is `user`. For any other caller the trigger believes an `X-Aber-Actor` header only from the caller it describes: `ingestion` from the ingestion principal, `migration` from the database owner''s session with no token, `service` from anyone else. A machine identity is `service` whatever it sends, and `user` is never taken from the header — a client asserting a human author is precisely the claim it must not be able to make.' }
        causation_id:
          type: integer
          format: int64
          nullable: true
          description: >-
            The transaction that wrote the row (`txid_current()`), so rows sharing it were written
            by one act. Unique only within this database: group by it, never keep it as a
            reference. A `PROPOSAL_APPLIED` row shares it with the change that approval made, and
            the `PROPOSAL_EXPIRED` rows one expiry run writes share that run's. NULL on rows older
            than the column, and on `PROPOSAL_APPLIED` and `PROPOSAL_EXPIRED` rows written before
            archived migration 0153.
        audit_domain:
          type: string
          enum: [asset, security]
          description: >-
            The lane, which decides who may read the row: `asset` is readable by Administrator,
            Shopfloor_Manager and Auditor, `security` by Administrator and Auditor. Stamped by a
            trigger from `audit_domain_for()`; a writer cannot supply it.
        recorded_at: { type: string, format: date-time }

    DirectoryService:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        service_name: { type: string, example: Supabase Studio }
        service_type: { type: string, example: GRAPHICAL_UI }
        endpoint_url:
          type: string
          example: 'http://prometheus:9090'
          description: >-
            The address an operator reaches the service on. The rows the chart publishes carry
            the public address db-init derives from the chart's values on every run (Grafana,
            Node-RED and Studio from the same `*_PUBLIC_URL` values that build their OAuth
            `redirect_uris`), so editing one by hand does not survive the next run. The rest carry
            their in-cluster Service address, reached through `kubectl port-forward`.
        exposure:
          type: string
          enum: [NETWORK, HOST, INTERNAL, UNKNOWN]
          example: NETWORK
          description: >-
            Where the service can be reached FROM, as a property of how it is published rather than
            of `endpoint_url`: `NETWORK` outside the cluster through an Ingress host or a
            LoadBalancer port, `HOST` bound to `127.0.0.1` (the deployment host or an SSH tunnel),
            `INTERNAL` a ClusterIP Service only, `UNKNOWN` not recorded. db-init records it from
            the chart on every run. The two can disagree and both are needed: a loopback *address*
            cannot be used from a remote browser however broadly the service is published.
        image:
          type: string
          nullable: true
          example: 'grafana/grafana:13.2.0'
          description: >-
            The image reference (`repository:tag`) the release deploys for the service, recorded by
            db-init from the chart on every install and upgrade (`0140`). It is the release's pin,
            not an observation of the running container. `null` when the chart does not deploy the
            service, or when something other than the chart registered it.
        image_fixable_critical:
          type: integer
          nullable: true
          example: 0
          description: >-
            Fixable CRITICAL vulnerabilities the release's scan found in `image`, from the summary
            the packaged chart carries and db-init records on every run (`0180`). Matched on the
            exact reference, so `null` means the release did not scan that image, as for an
            overridden tag. It is never a zero nobody measured.
        image_fixable_high:
          type: integer
          nullable: true
          example: 3
          description: Fixable HIGH vulnerabilities in `image`, on the same terms as `image_fixable_critical`.
        image_scanned_at:
          type: string
          format: date-time
          nullable: true
          description: When the release scanned `image`. A vulnerability published later is not counted. `null` when not scanned.
        image_vulnerability_db_at:
          type: string
          format: date-time
          nullable: true
          description: The date of the vulnerability database that scan used. `null` when not scanned.
        upstream_version:
          type: string
          nullable: true
          example: 5.0.7
          description: >-
            For an image Aber builds from a third-party product and tags with Aber's version, such
            as Node-RED or Swagger UI, that product's version, from the same summary. `null` for
            every other image.
        status: { type: string, example: ACTIVE }
        last_heartbeat: { type: string, format: date-time, nullable: true }
        registered_schema_id: { type: string, format: uuid, nullable: true }

    ReleaseCheck:
      type: object
      properties:
        checked_at: { type: string, format: date-time, description: 'When the check ran.' }
        running_version:
          type: string
          example: 1.4.0
          description: "The `MAJOR.MINOR.PATCH` of the chart's appVersion the check compared against."
        latest_version:
          type: string
          nullable: true
          example: 1.5.0
          description: 'The latest published release. `null` when the check failed.'
        latest_url:
          type: string
          nullable: true
          example: 'https://github.com/Harri-Llewelyn/Aber/releases/tag/v1.5.0'
          description: 'Its release notes, always a release of this repository. `null` when the check failed.'
        newer:
          type: boolean
          nullable: true
          description: 'Whether `latest_version` is newer than `running_version`. `null` when the check failed.'
        error:
          type: string
          nullable: true
          description: 'Why the check failed, for an operator. `null` when it succeeded.'

    Schema:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        schema_name: { type: string, example: Simulated_CNC_01_Schema_v2, description: 'UNIQUE. Each version gets a derived name — `Foo` → `Foo_v2` — and suffixes never stack.' }
        description: { type: string, nullable: true }
        schema_definition:
          type: object
          description: >-
            JSON Schema document. The modelled metric set is the union of its `properties` keys and
            its `required` list — hand-written schemas may carry either.
        version: { type: integer, readOnly: true, description: 'Computed by `fork_schema()`. There is no manual version input.' }
        parent_schema_id: { type: string, format: uuid, nullable: true, readOnly: true }
        status: { type: string, enum: [draft, active, archived], readOnly: true, description: 'Changed only by the RPCs. A directly-flipped status is rejected for every role, including `postgres`.' }
        change_description: { type: string, nullable: true }
        semantic_id: { type: string, nullable: true, description: 'Deliberately MUTABLE, unlike `name` — it is an assertion about the schema, and crosswalks get corrected.' }
        semantic_id_type: { $ref: '#/components/schemas/SemanticIdType' }
        created_at: { type: string, format: date-time, readOnly: true }

    MetricCatalogEntry:
      type: object
      description: >-
        A metric this deployment's devices actually publish. Distinct from the reference
        vocabularies, which list the standard's available words: an MTConnect data item type such
        as ANGLE is not a metric name — the metric is a component path plus that type, e.g.
        Axes/C/ANGLE.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name:
          type: string
          example: Axes/C/ANGULAR_VELOCITY/ACTUAL
          description: >-
            The literal Sparkplug B metric name. IMMUTABLE once created — a device is already
            configured to publish this exact string. Must match
            ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+)*$ (archived migration 0007).
        metric_group:
          type: string
          nullable: true
          readOnly: true
          example: Axes
          description: 'Generated column — the first `/`-delimited segment, NULL when there is none. Only the FIRST segment counts.'
        datatype: { type: integer, example: 10, description: Sparkplug B datatype code. }
        category: { type: string, nullable: true, enum: [SAMPLE, EVENT, CONDITION], description: 'MTConnect observation category. SAMPLE is the only one carrying units.' }
        units: { type: string, nullable: true, example: DEGREE/SECOND, description: 'Never auto-derived — the schema carries a units enum but no per-type default.' }
        sub_type: { type: string, nullable: true, example: ACTUAL, description: 'Also goes INTO the name — Sparkplug keys only on the name, so ACTUAL and COMMANDED would collide on UNIQUE(name) otherwise.' }
        standard: { type: string, nullable: true, example: MTConnect, description: "Provenance: 'MTConnect', 'ISO 22400', 'OPC UA', or NULL for a local extension. Decides which namespace an AAS export uses." }
        description: { type: string, nullable: true }
        deprecated: { type: boolean, default: false }
        superseded_by: { type: string, format: uuid, nullable: true, description: 'Changing a metric is deprecate-and-supersede, never a rename.' }
        semantic_id: { type: string, nullable: true, description: 'Locally-minted ids sit under `https://aber.local/semantics/…` — the namespace is the honesty mechanism. Mutable, unlike the name.' }
        semantic_id_type: { $ref: '#/components/schemas/SemanticIdType' }
        created_at: { type: string, format: date-time, readOnly: true }

    MetricCatalogWrite:
      type: object
      required: [name, datatype]
      properties:
        name: { type: string, example: Axes/C/ANGULAR_VELOCITY/ACTUAL }
        datatype: { type: integer, example: 10 }
        category: { type: string, nullable: true, enum: [SAMPLE, EVENT, CONDITION] }
        units: { type: string, nullable: true }
        sub_type: { type: string, nullable: true }
        standard: { type: string, nullable: true }
        description: { type: string, nullable: true }
        semantic_id: { type: string, nullable: true }
        semantic_id_type: { $ref: '#/components/schemas/SemanticIdType' }

    UncataloguedMetric:
      type: object
      readOnly: true
      description: >-
        A metric name devices declare that no catalog row describes. Its readings are stored, but it
        has no description, unit or semantic id until a catalog row is added under the same name.
      properties:
        metric_name: { type: string, example: Spindle/LOAD, description: 'As the devices declare it. It may not match the catalog name format.' }
        device_count: { type: integer, example: 2, description: 'How many devices declare it.' }
        devices:
          type: array
          description: 'The devices that declare it, by name.'
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string, example: Lathe_01 }
              quarantined: { type: boolean, description: 'Awaiting approval on the Devices page.' }
        last_declared_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The latest `last_birth_metrics_at` among those devices. It moves only when a device's
            declared set changes, not on every rebirth.
        datatypes:
          type: array
          items: { type: integer }
          example: [10]
          description: 'The Sparkplug datatype codes their births carried with a value, in order. Empty when no birth gave it one.'

    MetricGroup:
      type: object
      description: >-
        Registry of approved metric-group SPELLINGS, seeded from MTConnect's component types. It
        does not store any metric's group — that is always derived from the name. It exists so the
        Add Metric form has a vocabulary before any metric uses one, and so the spelling trigger has
        an authority for how each group is spelled.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, example: Axes, description: 'A single name segment — no `/`, not blank. Unique case-insensitively.' }
        description: { type: string, nullable: true }
        standard: { type: string, nullable: true, example: MTConnect }
        created_at: { type: string, format: date-time, readOnly: true }

    MTConnectVocabularyEntry:
      type: object
      readOnly: true
      description: >-
        Generated into the database from the Apache-2.0 mtconnect/schema repository by
        scripts/generate-mtconnect-vocabulary.mjs. Never hand-edited. Adopting it is not an
        MTConnect compliance claim.
      properties:
        kind: { type: string, enum: [DATA_ITEM_TYPE, SUB_TYPE, UNIT, NATIVE_UNIT, COMPONENT] }
        name: { type: string, example: ANGULAR_VELOCITY }
        category: { type: string, nullable: true, enum: [SAMPLE, EVENT, CONDITION], description: Populated for DATA_ITEM_TYPE rows only. }
        semantic_id: { type: string, nullable: true, description: 'The CONCEPT id, scoped by kind (…/v2.0/DataItemType/ANGLE). The namespace pins v2.0, the major line — not the generator''s SCHEMA_VERSION.' }

    ISO22400VocabularyEntry:
      type: object
      readOnly: true
      properties:
        name: { type: string, example: EFFECTIVENESS }
        kpi_id: { type: string, nullable: true, description: 'The ISO SYMBOL, not a clause number.' }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true, example: Effectiveness }
        unit: { type: string, nullable: true, example: PERCENT }
        formula: { type: string, nullable: true }
        semantic_id: { type: string, nullable: true }

    OPCUAVocabularyEntry:
      type: object
      readOnly: true
      properties:
        name: { type: string, example: SpeedOverride }
        companion_spec: { type: string, example: OPC 40010 Robotics }
        node_id: { type: string, example: 'nsu=http://opcfoundation.org/UA/Robotics/;i=16365', description: 'The ExpandedNodeId the specification''s NodeSet declares for the data point.' }
        description: { type: string, nullable: true }
        datatype: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        semantic_id: { type: string, nullable: true, description: 'The same ExpandedNodeId as `node_id`: the identifier OPC UA issues for the concept. A metric carrying it has `semantic_id_type` ExpandedNodeId.' }

    ASHRAE223Concept:
      type: object
      readOnly: true
      properties:
        name: { type: string, example: Fan, description: 'The RDF local name, unique within the s223 namespace.' }
        concept_kind: { type: string, enum: [Class, AbstractClass, Concept, Relation, EnumerationKind] }
        label: { type: string, example: Fan }
        description: { type: string, nullable: true }
        subclass_of: { type: string, nullable: true, example: Equipment, description: 'Immediate s223 superclass, or null at the top of the hierarchy.' }
        semantic_id: { type: string, example: 'http://data.ashrae.org/standard223#Fan', description: 'Issued by ASHRAE. A CHECK constrains every row to this namespace.' }

    IDTASubmodelTemplateElement:
      type: object
      readOnly: true
      properties:
        template_id: { type: string, example: 'https://admin-shell.io/idta/nameplate/3/0/Nameplate' }
        template_name: { type: string, example: Digital Nameplate }
        template_version: { type: string, example: '3.0', description: 'Part of the identity, not metadata: 2.0 lives under admin-shell.io/zvei and 3.0 under admin-shell.io/idta.' }
        id_short: { type: string, example: SerialNumber }
        semantic_id: { type: string, example: '0112/2///61987#ABA951#009', description: 'Issued by IDTA, IEC CDD or ECLASS. Never minted by this deployment.' }
        semantic_id_type: { type: string, enum: [IRI, IRDI] }
        description: { type: string, nullable: true }
        is_mandatory: { type: boolean, description: 'What the template requires. Descriptive only — the exporter does not claim the template.' }
        ordinal: { type: integer, description: 'Order in the published template.' }

    ConceptDefinition:
      type: object
      readOnly: true
      properties:
        semantic_id: { type: string, example: 'http://data.ashrae.org/standard223#TemperatureSensor', description: 'Unique in the view.' }
        name: { type: string, example: TemperatureSensor, description: 'The concept''s key in its vocabulary: the IDTA idShort, or the vocabulary row''s name.' }
        definition: { type: string, example: 'A `Sensor` that `observes` a `QuantifiableObservableProperty` that represents a measure of temperature.' }
        standard: { type: string, enum: [IDTA, ASHRAE 223P, OPC UA, ISO 22400] }

    UserSettings:
      type: object
      description: |
        One person's display preferences (`0188`). Each is a typed column with a CHECK and a
        default; a new preference is a column added by the migration beside the code that reads it.
      properties:
        user_id: { type: string, format: uuid, description: "The person's `auth.users` id." }
        theme: { type: string, enum: [dark, light], default: dark }
        sidebar_mode:
          type: string
          enum: [hover, expanded, collapsed]
          default: hover
          description: 'How the sidebar shows the page names: on hover, always, or never (icons only).'
        single_key_shortcuts:
          type: boolean
          default: true
          description: 'Whether the shortcuts that are one character with no modifier (`?`, `/`, `[` and `]`) act for this person (`0194`). Ctrl K and the arrow keys are not covered.'
        updated_at: { type: string, format: date-time, readOnly: true }

    SystemSetting:
      type: object
      description: |
        One runtime configuration value. Declared by a migration, edited by an `Administrator`.
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: |
            Dotted, lowercase, `namespace.name`. IMMUTABLE: a key names the value some code reads,
            so renaming one would silently disconnect it from that reader.
          example: ui.audit_trail_poll_seconds
        value:
          description: |
            The value, as JSON. Its JSON type must match `value_type` — a CHECK constraint enforces
            the pair, which is what lets a reader trust the type rather than re-validating it.
          example: 60
        value_type:
          type: string
          enum: [string, number, boolean, json]
          description: 'IMMUTABLE. The reader was written against one type.'
        category:
          type: string
          description: 'Grouping for the settings page.'
          example: Audit Trail
        label: { type: string, example: 'Refresh interval (seconds)' }
        description:
          type: string
          description: 'What changing this does, in an operator''s terms.'
        fallback_source:
          type: string
          nullable: true
          description: |
            The environment variable or code constant this overrides, named so the fallback is
            greppable from either end. An absent row means the fallback applies, which is what
            keeps local boot zero-configuration.
          example: DEFAULT_POLL_SECONDS (60) in AuditTrailTab.jsx
        updated_at: { type: string, format: date-time }
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: |
            Stamped by trigger from the JWT subject; not writable by the caller. NULL for a change
            made by `service_role` or by a migration, neither of which is a person.
    Capture:
      type: object
      description: |
        A stored broker capture. At most one per gateway and one per device; a new recording
        replaces it.
      properties:
        id: { type: string, format: uuid }
        subject_kind: { type: string, enum: [gateway, device] }
        gateway_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
        subject_sparkplug_id:
          type: string
          description: |
            The subject's wire identity, and the leading folder of `storage_path`. Kept here as
            well so the file can still be located after the subject row is gone.
          example: gwy120000000000400080000
        storage_path:
          type: string
          description: |
            Where the bytes are in the `broker-captures` bucket: `<subject>/<job or upload id>.json`,
            or `<subject>/capture.json` for a capture stored before 1.5.
          example: gwy120000000000400080000/7c9e6679-7425-40de-944b-e07fc1f90ae7.json
        size_bytes: { type: integer, format: int64 }
        message_count: { type: integer }
        note:
          type: string
          nullable: true
          description: |
            The operator's one-line label, given when the capture was started. Shown on the list and
            inside the confirmation that replacing it requires — which is the reason the field
            exists at all.
          example: pre-trip bearing vibration baseline
        manifest:
          type: object
          description: |
            What is in the file, so it can be described without downloading it.
          properties:
            metric_names: { type: array, items: { type: string }, description: 'Capped at 50.' }
            metric_name_count: { type: integer, description: 'The true total, so a truncation is visible.' }
            topic_count: { type: integer }
            observed_rate_hz: { type: number }
            birth_captured:
              type: boolean
              description: |
                **Read this before trusting the capture.** `false` means no `NBIRTH` was recorded,
                so a playback refuses the capture: a replay opens with the edge node's birth
                certificate. Before 1.5 a `DBIRTH` alone also set it.
            rebirth_requested: { type: boolean }
            stop_reason:
              type: string
              nullable: true
              enum: [duration, operator, message_cap, size_cap]
              description: |
                Why a recording stopped. `message_cap` and `size_cap` mean a cap cut it short of the
                length asked for. Absent for an upload and for a capture recorded before 1.5.
            duration_ms:
              type: integer
              description: 'How long the recording ran; for an upload, how long the file spans.'
            requested_seconds: { type: integer, description: 'The length the recording was asked for.' }
        source: { type: string, enum: [recorded, uploaded] }
        recorded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }

    CaptureJob:
      type: object
      description: |
        One recording attempted. Written only through the gates in `0055`; progress arrives over
        Realtime.
      properties:
        id: { type: string, format: uuid }
        subject_kind: { type: string, enum: [gateway, device] }
        gateway_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
        sparkplug_group:
          type: string
          description: >-
            The gateway's configured group when the job was queued. Topics match on edge_node_id in
            any group, as ingestion accepts them; the rebirth request goes to the group the node
            publishes under (gateways.observed_sparkplug_group), or to this one while that is null.
          example: Aber
        edge_node_id:
          type: string
          description: 'The gateway the daemon matches topics against — for a device capture too.'
          example: gwy120000000000400080000
        device_sparkplug_id: { type: string, nullable: true, example: dev270000000000400080000 }
        storage_path: { type: string, example: gwy120000000000400080000/7c9e6679-7425-40de-944b-e07fc1f90ae7.json }
        status: { type: string, enum: [PENDING, RECORDING, COMPLETED, FAILED, CANCELLED] }
        note: { type: string, nullable: true }
        max_seconds: { type: integer, description: '5 … 7200.' }
        max_messages: { type: integer, description: 'Up to 100000.' }
        max_bytes:
          type: integer
          format: int64
          description: |
            Up to 52428800 (50 MiB). Bounded below the bucket's own 100 MiB limit so the message cap
            binds first and a completed recording is never refused at upload.
        messages: { type: integer, format: int64, description: 'Progress; updated about once a second.' }
        bytes: { type: integer, format: int64 }
        elapsed_seconds: { type: integer }
        birth_captured:
          type: boolean
          description: 'Latches true — a later tick reporting false does not erase a birth that arrived.'
        stop_requested:
          type: boolean
          description: |
            Set by `request_capture_stop()`. The daemon reads it on its next one-second progress
            tick, then stores what it has recorded. A column rather than an endpoint, so it survives a
            page reload.
        capture_id: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    BackupJob:
      type: object
      description: |
        One backup attempted (`0101`). Written only through `request_backup()`,
        `enqueue_scheduled_backup()` and the backup service's gates.
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [requested, scheduled] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        note: { type: string, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true, description: 'The Administrator who asked; NULL for a scheduled backup.' }
        backup_id: { type: string, format: uuid, nullable: true, description: 'The backups row this job produced. Not a foreign key: a pruned backup keeps its job row.' }
        error: { type: string, nullable: true, description: 'What the service said when it failed, capped at 2000 characters.' }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    Backup:
      type: object
      description: |
        One backup that exists on the backup volume (`0101`). The row is deleted when the service
        prunes the files.
      properties:
        id: { type: string, format: uuid }
        stamp: { type: string, example: 20260911T143000Z, description: 'The UTC stamp the files carry and the directory holding them; what `BACKUP_STAMP` takes in restore-databases.sh.' }
        origin: { type: string, enum: [requested, scheduled] }
        note: { type: string, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true }
        job_id: { type: string, format: uuid, nullable: true }
        location: { type: string, example: /backups/20260911T143000Z, description: 'A path inside the backup service''s container.' }
        components:
          type: array
          description: 'What the backup holds. A component the service had no volume for is absent, not empty.'
          items:
            type: object
            properties:
              name: { type: string, enum: [supabase-db, timescaledb, storage-objects, forge] }
              file: { type: string }
              size_bytes: { type: integer, format: int64 }
              sha256: { type: string }
              sqlite: { type: string, nullable: true, description: 'The forge component only: how gitea.db was copied.' }
        size_bytes: { type: integer, format: int64, description: 'The components summed.' }
        pinned: { type: boolean, description: 'True keeps the backup out of the retention prune. A requested backup is born pinned.' }
        released_at: { type: string, format: date-time, nullable: true }
        released_by: { type: string, format: uuid, nullable: true }
        taken_at: { type: string, format: date-time }

    RebirthRequest:
      type: object
      description: |
        One request for an edge node to republish its birth certificate.
      properties:
        id: { type: string, format: uuid }
        gateway_id: { type: string, format: uuid }
        edge_node_id:
          type: string
          description: 'The gateway`s sparkplug_id — the NCMD is addressed to it.'
          example: gwy120000000000400080000
        sparkplug_group:
          type: string
          description: >-
            The gateway's configured group when the request was made. The NCMD goes to the group the
            node publishes under (gateways.observed_sparkplug_group), or to this one while that is null.
          example: Aber
        status: { type: string, enum: [PENDING, SENT, FAILED] }
        throttled:
          type: boolean
          description: |
            The daemon rate-limits rebirths per edge node, because a node that reboots on one would
            otherwise be held in a loop by the mechanism meant to recover it. A request from a
            person bypasses that limit, so this is false in practice and is kept because "asked and
            declined" is a different outcome from "asked and failed".
        error: { type: string, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true }
        requested_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }

    PlaybackWorkerStatus:
      type: object
      description: |
        What the playback worker can authenticate as, and when it last said so. One row.
      properties:
        held_edge_nodes:
          type: array
          items: { type: string }
          description: |
            Gateway `sparkplug_id`s this worker holds a broker password for. Public identifiers; the
            passwords are not stored anywhere readable.
          example: ['gwy130000000000400080000']
        reported_at:
          type: string
          format: date-time
          description: |
            Heartbeat, restated every 30 seconds, during a playback as well as between them. Stale
            means the worker is not running — which is a different problem from an empty list, and
            is why the timestamp is here.
        credential_sources:
          type: object
          additionalProperties:
            type: array
            items: { type: string, enum: [delivered, helm, environment] }
          description: |
            For each held gateway, where the worker's passwords for it come from, in the order it
            tries them; the first is the one in use. `delivered` is the password delivered when the
            credential was issued, `helm` is `secrets.mqttPlaybackCredentials`, `environment` is
            `MQTT_PLAYBACK_USER` / `MQTT_PLAYBACK_PASSWORD`. Names only, never a password (0191).
          example: { gwy160000000000400080000: [delivered, helm] }

    PlaybackJob:
      type: object
      description: |
        One playback attempted. Written only through the gates in `0056`; progress arrives over
        Realtime.
      properties:
        id: { type: string, format: uuid }
        capture_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once the capture has been deleted. The playback still happened, and the telemetry
            it wrote outlives both rows, which is why this is SET NULL rather than a cascade.
        capture_storage_path: { type: string, example: gwy120000000000400080000/capture.json }
        target_gateway_id: { type: string, format: uuid }
        target_edge_node_id:
          type: string
          description: |
            The target's `sparkplug_id`, and also the MQTT USERNAME the worker connects as — which
            is what confines a playback to one edge node with no policy change: the broker's
            gateway role grants `spBv1.0/+/+/%u/#`, where `%u` is the connecting username, so a
            client holding it can publish nowhere else.
          example: gwy130000000000400080000
        sparkplug_group: { type: string, example: Aber }
        device_map:
          type: object
          additionalProperties: { type: string }
          description: |
            `{"<captured device id>": "<target device id>"}`. Every target must be an active replay
            lane of the target gateway, and the lane of the device its key names.
          example: { dev270000000000400080000: dev310000000000400080000 }
        speed: { type: number, description: 'Greater than 0 and at most 60. Zero is refused.' }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        messages_total: { type: integer }
        messages_sent: { type: integer }
        messages_out_of_window:
          type: integer
          description: |
            How many of the planned messages carried timestamps the ingestion daemon will discard
            as outside its sanity window — computed by the worker from the plan BEFORE publishing,
            never reported back by the daemon, whose answer to an out-of-window metric is a counter
            and not an error. Greater than zero on a COMPLETED job means some readings were
            published and lost; a job that would lose EVERY reading is refused by the worker and
            arrives FAILED. Counted per message, while that refusal is decided per metric: the
            daemon judges each metric on its own timestamp and falls back to the payload's only
            when it has none, so a job can carry a count on every message and still have written. Zero on every job written before archived migration 0109, which means
            "nobody counted" rather than "none were discarded".
        elapsed_seconds: { type: integer }
        stop_requested:
          type: boolean
          description: 'Set by request_playback_stop(); observed by the worker on its next tick.'
        progress_reported_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the worker last reported this job's progress; null until its first report. Stop
            ends a RUNNING job whose last report, or claim when there is none, is over a minute old
            (0191).
        error: { type: string, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    DeviceAlert:
      type: object
      description: |
        One Grafana alert occurrence. Written by `grafana-alert-webhook`; never by a user.
      properties:
        id: { type: string, format: uuid }
        fingerprint:
          type: string
          description: |
            Grafana's hash of the alert instance's label set. STABLE across fire/resolve cycles, so it
            identifies the series and not the occurrence — which is why the unique constraint pairs it
            with `starts_at`.
          example: abc123def4567890
        entity_type:
          type: string
          enum: [device, gateway, platform, service_identity]
          description: 'What the alert is about. `platform` and `service_identity` (a machine identity, 0204) carry no `sparkplug_id`.'
        sparkplug_id:
          type: string
          description: 'The immutable wire identity the alert was raised for. Never the device name.'
          example: dev220000000000400080000
        device_id: { type: string, format: uuid, nullable: true, description: 'Resolved at write time; null when no device row matched.' }
        alert_name: { type: string, example: Thermal Excursion }
        severity: { type: string, enum: [critical, warning, info] }
        status: { type: string, enum: [firing, resolved] }
        summary:
          type: string
          nullable: true
          description: "Grafana's own templated annotation, already carrying the device and the values that tripped the rule."
          example: Sim_CNC_Mill_01 is above its configured thermal limit of 90.0 degC (5.2 degC over).
        starts_at: { type: string, format: date-time, description: 'When Grafana began firing this occurrence. Part of the occurrence key.' }
        ends_at: { type: string, format: date-time, nullable: true, description: 'Null while firing. A resolved row always carries one — enforced by CHECK.' }
        recorded_at: { type: string, format: date-time, description: 'When this platform wrote the row, as distinct from when Grafana observed it.' }

    DeviceNameplate:
      type: object
      description: |
        Operator-supplied IDTA 02006 nameplate fields for one device. Every field is optional: a
        nameplate is filled in as it is discovered, and a partially known asset is the normal case.
      properties:
        device_id: { type: string, format: uuid }
        manufacturer_name: { type: string, nullable: true }
        manufacturer_product_designation: { type: string, nullable: true }
        manufacturer_product_type: { type: string, nullable: true }
        serial_number: { type: string, nullable: true, description: 'The manufacturer''s serial number. NOT sparkplug_id, which this platform issues.' }
        year_of_construction: { type: string, nullable: true, example: '2024', description: 'Four digits. A string in IDTA''s template, not an integer.' }
        date_of_manufacture: { type: string, format: date, nullable: true }
        hardware_version: { type: string, nullable: true }
        firmware_version: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
        country_of_origin: { type: string, nullable: true }
        uri_of_the_product: { type: string, nullable: true, description: 'Must be an absolute IRI; a bare string is rejected by a CHECK.' }
        updated_at: { type: string, format: date-time, readOnly: true, description: 'When the row was last written, by the database''s clock. Stamped on every write through the API; a value sent is ignored.' }
        updated_by: { type: string, format: uuid, nullable: true, readOnly: true, description: 'Who last wrote the row. A write through the API records the caller''s user id, and a value sent is ignored; `service_role` records null. An approved proposal records its proposer.' }

    SparkplugAddress:
      type: object
      description: A Sparkplug B address. `(group_id, node_id)` names the edge node; `device_id` is its device.
      properties:
        group_id: { type: string, example: Aber, description: 'Empty when the device is bound to no gateway.' }
        node_id: { type: string, example: gwy120000000000400080000 }
        device_id: { type: string, example: dev220000000000400080000, description: 'The id in the device''s topic: its issued `sparkplug_id`, or the id it publishes under in its place (its own, or its Instance_UUID).' }

    DirectoryDevice:
      type: object
      readOnly: true
      description: A device as the Factory+ Directory adapter renders it.
      properties:
        uuid: { type: string, format: uuid, description: 'The Factory+ Instance_UUID — `devices.id`.' }
        name: { type: string }
        address: { $ref: '#/components/schemas/SparkplugAddress' }
        online: { type: boolean }
        quarantined: { type: boolean, description: 'Present in the directory but its telemetry is being dropped.' }
        schemas:
          type: array
          items: { type: string, format: uuid }
          description: 'Resolved through the `device_schemas` view.'

    FunctionError:
      type: object
      description: >-
        What an edge function answers when it fails unexpectedly. Nothing in it is taken from the
        error, which is logged under `request_id`.
      required: [error, request_id]
      properties:
        error:
          type: string
          description: A fixed sentence, `The request failed on the server.` unless the path names what failed.
          example: Could not generate the bundle
        request_id:
          type: string
          description: The same id as the `X-Request-Id` header. An operator finds the error in the logs by it.
          example: 3f6c1b52-8a0e-4d6f-9b1e-2c7d5a4e9f10

    Link:
      type: object
      description: An external link attached to an asset. No binary is stored by this platform.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        entity_type: { type: string, enum: [cell, gateway, device] }
        entity_id: { type: string }
        display_name: { type: string }
        url: { type: string, format: uri }
        link_tag: { type: string, default: other }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time }
