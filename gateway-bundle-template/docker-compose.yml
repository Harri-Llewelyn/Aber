# =============================================================================================
# ACS-Cymru physical gateway appliance.
#
#   docker compose up -d
#
# TWO SERVICES IN SEQUENCE, AND THAT ORDER IS THE WHOLE DESIGN. `bootstrap` runs ONCE, exchanges
# the enrolment token in .env for a broker credential, and provisions /data -- the CA, the flow, the
# encrypted credentials and a settings.js with a locally generated admin password. `node-red` then
# starts against that /data and does the actual work.
#
# They cannot be one service: Node-RED reads settings.js at load time, and the MQTT credentials do
# not exist until enrolment has happened. A single container would have to enrol and then restart
# itself, which is the same two steps with nothing to look at when the first one fails.
#
# A THIRD SERVICE SITS OUTSIDE THAT SEQUENCE. `node-exporter` collects host metrics and depends on
# nothing here -- not on enrolment, not on /data. The flow polls it locally and publishes a handful
# of series on the connection it already holds; see its own block below for why it is not scraped
# from the centre.
#
# WHERE THE PASSWORD GOES. `bootstrap` prints the Node-RED editor password ONCE, to its own logs:
#
#   docker compose logs bootstrap
#
# It is not written anywhere in plaintext. Lost, it is recoverable only by
# `docker compose run --rm bootstrap node /bundle/bootstrap.mjs --reset-admin-password`.
# =============================================================================================

services:
  bootstrap:
    build: .
    container_name: acs-gateway-bootstrap
    # ONE-SHOT. `restart: no` matters more than it looks: the enrolment token is SINGLE-USE, so a
    # restart loop on a genuine failure would burn the token on the first attempt and then retry
    # forever against a token the platform has already consumed. bootstrap.mjs does its own bounded
    # retrying, in the one place that can tell a retryable failure from a permanent one.
    restart: "no"
    # ---------------------------------------------------------------------------------------------
    # ROOT, AND IT IS NOT OPTIONAL. The node-red image SHIPS /data/flows.json owned by root:root,
    # and Docker copies it -- with that ownership -- into a fresh named volume. Node-RED itself runs
    # as uid 1000, so a bootstrap running as 1000 can create new files in /data (it owns the
    # directory) and CANNOT overwrite that one:
    #
    #     Error: EACCES: permission denied, open '/data/flows.json'
    #
    # It fails AFTER enrolment has succeeded, so the token is already spent and the appliance needs
    # a new bundle -- the worst possible place for this to surface. bootstrap.mjs chowns /data back
    # to 1000:1000 before it exits, so the node-red service that follows owns everything it reads.
    #
    # Same problem and the same fix as the platform's own provisioner: see the `user: "0"` on
    # node-red-init in the repository's docker-compose.yml.
    # ---------------------------------------------------------------------------------------------
    user: "0"
    env_file: .env
    volumes:
      - nodered_data:/data
      # The bundle itself, read-only. bootstrap.mjs and flows.template.json are inputs; nothing
      # here is written back, so a re-run always starts from the files you downloaded.
      - ./:/bundle:ro
    # ENTRYPOINT IS OVERRIDDEN, AND IT HAS TO BE. The Node-RED base image declares
    # `ENTRYPOINT ["./entrypoint.sh"]`, which starts Node-RED and passes `command` to it as
    # ARGUMENTS -- so a bare `command: ["node", "/bundle/bootstrap.mjs"]` does not run bootstrap at
    # all. It silently starts a Node-RED with no configuration, reports itself healthy, and leaves
    # the appliance un-enrolled with `node-red` stuck waiting on a container that will never exit.
    entrypoint: ["node"]
    command: ["/bundle/bootstrap.mjs"]

  node-red:
    build: .
    container_name: acs-gateway-node-red
    restart: unless-stopped
    ports:
      # The editor, on the appliance's own network. Not the data path -- telemetry leaves over
      # MQTTS on 8883 and never through this port.
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # THE BROKER CREDENTIALS ARRIVE THROUGH A FILE THAT DID NOT EXIST AT `compose up` TIME.
    #
    # `env_file:` cannot be used for them: Compose reads it when it parses this file, which is
    # before bootstrap has run, so on a first boot it would resolve to nothing and Node-RED would
    # start with an empty broker username. Sourcing /data/gateway.env in the command instead means
    # it is read when the container starts -- after bootstrap completed, which `depends_on`
    # guarantees.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/gateway.env ]; then
          echo 'FATAL: /data/gateway.env is missing -- bootstrap did not complete. Run: docker compose logs bootstrap' >&2
          exit 1
        fi
        . /data/gateway.env
        exec npm --no-update-notifier --no-fund start --cache /data/.npm -- --userDir /data

  # ===============================================================================================
  # flow-sync -- this appliance converges its own flow to what somebody approved.
  #
  # OUTBOUND ONLY, LIKE EVERYTHING ELSE HERE. It fetches this gateway's own repository from the
  # forge over SSH and calls Node-RED on this compose network. Nothing opens a connection toward
  # the appliance, which is the same rule that keeps node_exporter unscraped below.
  #
  # WHY A SEPARATE SERVICE AND NOT A NODE IN THE FLOW. The thing it deploys IS the flow, so a flow
  # that breaks would take its own repair mechanism with it -- and a `function` node with `fs` and
  # `exec` access is a strictly larger surface on a box holding the MQTT credential. Outside the
  # runtime it converges an appliance whose flow does not currently start.
  #
  # IT RUNS AS 1000, NOT ROOT. Node-RED runs as uid 1000 and bootstrap hands /data to that uid on
  # its way out; a root sidecar would write a flows.json Node-RED could read but never rewrite from
  # the editor. It needs no capability root would give it: git, ssh and one HTTP call.
  #
  # SECRETS IT HOLDS: the deploy key (READ-ONLY at the forge, so it cannot author what it deploys)
  # and NODERED_CREDENTIAL_SECRET, which it uses only to CHECK that a committed flow's broker node
  # ids still match the stored credentials -- see flow-sync.mjs, where that check is a refusal to
  # converge rather than a warning.
  #
  # DELETING THIS SERVICE IS SUPPORTED and costs exactly one thing: approved flows stop arriving.
  # Telemetry, the editor and the heartbeat do not depend on it.
  # ===============================================================================================
  flow-sync:
    build: .
    container_name: acs-gateway-flow-sync
    restart: unless-stopped
    user: "1000"
    env_file: .env
    environment:
      # How often to look. Five minutes is a compromise between a plant link that is metered and an
      # operator waiting to see an approval take effect; nothing here is latency-sensitive, because
      # the approval already happened at human speed.
      FLOW_SYNC_INTERVAL_SECONDS: "${FLOW_SYNC_INTERVAL_SECONDS:-300}"
      NODE_RED_URL: "http://node-red:1880"
    volumes:
      - nodered_data:/data
      - ./:/bundle:ro
    depends_on:
      # AFTER ENROLMENT, because /data/gitops -- the deploy key, the clone URL and the forge's host
      # key -- is written by bootstrap. Starting first would mean one failed tick and a wait.
      bootstrap:
        condition: service_completed_successfully
      # `service_started` and not a health condition: this retries on its own timer, so Node-RED
      # being slow costs one tick. Waiting for healthy would couple the two restart cycles.
      node-red:
        condition: service_started
    # Same override and the same reason as `bootstrap` above: a bare `command:` would be passed to
    # the base image's entrypoint as ARGUMENTS to Node-RED and would silently start a second one.
    entrypoint: ["node"]
    command: ["/bundle/flow-sync.mjs"]

  # ===============================================================================================
  # node_exporter -- HOST metrics for the machine this appliance runs on.
  #
  # THE COLLECTOR IS RIGHT AND SCRAPING IT FROM THE CENTRE WOULD BE WRONG, which is the whole
  # reason it appears here rather than in the platform's Prometheus:
  #
  #   * THIS APPLIANCE'S CONNECTION IS OUTBOUND ONLY. It dials <broker>:8883 and nothing anywhere
  #     assumes traffic in the other direction. Scraping would need an inbound path through the
  #     plant firewall, per gateway -- the exact thing an outbound-only design exists to avoid, and
  #     a separate conversation with somebody's IT department per site.
  #   * GATEWAYS ENROL DYNAMICALLY, with single-use tokens, so a static scrape config cannot know
  #     them. Pull would additionally need service discovery backed by the platform's gateway
  #     table: an endpoint to build, secure and keep correct.
  #
  # So it is scraped LOCALLY, over this compose network, by the Node-RED flow -- which then
  # publishes a handful of series as Sparkplug metrics on the MQTT connection that is already open
  # and already authenticated. No new inbound path, no new credential, no discovery.
  #
  # WHY node_exporter AND NOT A FUNCTION NODE READING /proc. It collects host metrics correctly,
  # which a hand-rolled disk and memory read in a Node-RED function will not -- and a function node
  # has no `fs` to read /proc with in the first place. It also removes the Windows question
  # entirely: `windows_exporter` serves the same exposition format, so a Windows gateway differs
  # only in which collector is installed and this flow does not change at all.
  #
  # NOT PUBLISHED. No `ports:` -- host metrics have no business leaving the appliance except as the
  # handful of values the flow selects and publishes. Read-only mounts and no capabilities: it
  # reads /proc and /sys and reports numbers.
  #
  # THE HEARTBEAT DOES NOT DEPEND ON IT. The flow polls this on its own timer and caches the
  # result; the 30s heartbeat publishes whatever is cached. A node_exporter that is down or slow
  # costs three metrics, never the heartbeat -- see `poll host metrics` in the flow.
  # ===============================================================================================
  node-exporter:
    container_name: acs-gateway-node-exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Container and pseudo filesystems excluded, or every image layer and overlay mount appears
      # as a separate "disk" and the one number that matters -- free space on the real volume -- is
      # buried among dozens that are not disks at all. Same exclusions as the platform's own
      # exporter, so a gateway's disk figure means what the central one means.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  # THE APPLIANCE'S STATE, and the thing to back up. It holds the flow, the encrypted credentials,
  # the CA and settings.js. `docker compose down -v` destroys it and the enrolment with it -- the
  # token is already spent, so recovering means issuing a NEW bundle from the dashboard.
  #
  # THE FLOW'S COPY LIVES IN THIS GATEWAY'S OWN REPOSITORY, not here. Propose it from the
  # dashboard's gateway page (Propose a flow): it becomes a pull request, and once approved this
  # appliance pulls it back on its own timer. flows_cred.json is deliberately never committed -- it
  # is encrypted with a secret that lives in this .env, so a copy in the forge would be either
  # useless or dangerous.
  nodered_data:
