---
# This gateway's own playbook. Run by aber-gateway-converge on the appliance, from the checkout of
# this repository's main, straight after the platform playbook and never instead of it.
#
# The platform hands over where it put things -- aber_state_dir, aber_data_dir, aber_compose_dir,
# aber_repo_dir, aber_platform_tag -- after this gateway's own platform.yml vars, so nothing here
# states a path of its own. Everything below is Docker and this repository; the platform's
# directories are read, never written.
- name: A custom adapter for this gateway
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    # The compose project under custom/ in this repository, built and run on the appliance from the
    # commit that was merged. The platform's own project keeps its directory; this one has its own,
    # so `docker compose down` on either leaves the other alone.
    adapter_dir: "{{ aber_repo_dir }}/custom"
    # The appliance's compose network, so the adapter can reach Node-RED by service name. Compose
    # names the default network "<project>_default", and the project is the directory the platform
    # deployed to (measured against Docker Compose v2).
    appliance_network: "{{ aber_compose_dir | basename }}_default"

  tasks:
    - name: The adapter image, built on this appliance from this commit
      # Built here rather than pulled: the appliance holds one credential, its deploy key, and a
      # registry would be a second thing to issue and revoke. The base image is pinned by digest
      # in the Dockerfile, and an image for the wrong architecture fails here, in front of whoever
      # is commissioning the gateway.
      ansible.builtin.command:
        cmd: docker compose build
        chdir: "{{ adapter_dir }}"
      environment:
        ABER_APPLIANCE_NETWORK: "{{ appliance_network }}"
      register: adapter_build
      changed_when: true

    - name: The adapter running
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ adapter_dir }}"
      environment:
        ABER_APPLIANCE_NETWORK: "{{ appliance_network }}"
      changed_when: true

    # THE PLAY FAILS WHEN THE ADAPTER IS NOT RUNNING, which is the point of running this hourly.
    # `up -d` returns success for a container that started and exited, so without this a crash-
    # looping adapter converges green for ever and the dashboard is told the custom run succeeded.
    - name: Whether the adapter is actually running
      ansible.builtin.command:
        cmd: docker compose ps --status running --quiet
        chdir: "{{ adapter_dir }}"
      environment:
        ABER_APPLIANCE_NETWORK: "{{ appliance_network }}"
      register: adapter_running
      changed_when: false

    - name: Refuse a convergence that left nothing running
      ansible.builtin.assert:
        that: adapter_running.stdout | trim | length > 0
        fail_msg: >-
          The adapter is not running after `docker compose up -d`. `docker compose logs` in
          {{ adapter_dir }} on the appliance says why. The gateway's flow is unaffected; this
          failure is reported on the appliance branch as the custom run's.
