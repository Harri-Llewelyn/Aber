# =============================================================================================
# Aber Remote gateway appliance.
#
#   docker compose up -d
#
# `bootstrap` runs once: it exchanges the enrolment token in .env for a broker credential and
# provisions /data (the CA, the flow, the encrypted credentials, a settings.js with a locally
# generated admin password). `node-red` then starts against that /data. They cannot be one
# service: Node-RED reads settings.js at load time. `node-exporter` sits outside that sequence.
#
# `bootstrap` prints the Node-RED editor password once, to its own logs (`docker compose logs
# bootstrap`). Lost, it is recoverable only by
# `docker compose run --rm bootstrap node /bundle/bootstrap.mjs --reset-admin-password`.
# =============================================================================================

services:
  bootstrap:
    build: .
    container_name: acs-gateway-bootstrap
    # One-shot. `restart: no`: the enrolment token is single-use, so a restart loop would retry
    # forever against a token the platform has already consumed. bootstrap.mjs does its own bounded
    # retrying.
    restart: "no"
    # ---------------------------------------------------------------------------------------------
    # Root, because the node-red image ships /data/flows.json owned by root:root and Docker copies
    # it into a fresh volume with that ownership; a bootstrap running as 1000 cannot overwrite it,
    # and fails after enrolment has spent the token. bootstrap.mjs chowns /data back to 1000:1000
    # before it exits. Same fix as `user: "0"` on node-red-init in the platform's docker-compose.yml.
    # ---------------------------------------------------------------------------------------------
    user: "0"
    env_file: .env
    volumes:
      - nodered_data:/data
      # The bundle itself, read-only. bootstrap.mjs and flows.template.json are inputs; nothing
      # here is written back, so a re-run always starts from the files you downloaded.
      - ./:/bundle:ro
    # The base image's ENTRYPOINT starts Node-RED and passes `command` to it as arguments, so a
    # bare `command: ["node", ...]` would start an unconfigured Node-RED that reports healthy.
    entrypoint: ["node"]
    command: ["/bundle/bootstrap.mjs"]

  node-red:
    build: .
    container_name: acs-gateway-node-red
    restart: unless-stopped
    ports:
      # The editor, on the appliance's own network. Not the data path -- telemetry leaves over
      # MQTTS on 8883 and never through this port.
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # The broker credentials arrive through a file that did not exist at `compose up` time, so
    # `env_file:` cannot carry them; /data/gateway.env is sourced when the container starts, after
    # bootstrap completed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/gateway.env ]; then
          echo 'FATAL: /data/gateway.env is missing -- bootstrap did not complete. Run: docker compose logs bootstrap' >&2
          exit 1
        fi
        . /data/gateway.env
        exec npm --no-update-notifier --no-fund start --cache /data/.npm -- --userDir /data

  # ===============================================================================================
  # flow-sync -- this appliance converges its own flow to what somebody approved.
  #
  # Outbound only: it fetches this gateway's repository from the forge over SSH, pushes what is
  # running to the `appliance` branch there, and calls Node-RED on this compose network. A
  # separate service, not a node in the flow, because the thing it deploys is the flow. Runs as
  # 1000, not root, so Node-RED can rewrite what it writes. Holds the deploy key (which the forge
  # admits on `appliance` and refuses everywhere else) and NODERED_CREDENTIAL_SECRET, used only to
  # check that a committed flow's broker node ids still match the stored credentials
  # (flow-sync.mjs refuses to converge otherwise). Deleting this service costs two things:
  # approved flows stop arriving, and the forge stops hearing what is running.
  # ===============================================================================================
  flow-sync:
    build: .
    container_name: acs-gateway-flow-sync
    restart: unless-stopped
    user: "1000"
    env_file: .env
    environment:
      # How often to look. Five minutes is a compromise between a plant link that is metered and an
      # operator waiting to see an approval take effect; nothing here is latency-sensitive, because
      # the approval already happened at human speed.
      FLOW_SYNC_INTERVAL_SECONDS: "${FLOW_SYNC_INTERVAL_SECONDS:-300}"
      NODE_RED_URL: "http://node-red:1880"
    volumes:
      - nodered_data:/data
      - ./:/bundle:ro
    depends_on:
      # AFTER ENROLMENT, because /data/gitops -- the deploy key, the clone URL and the forge's host
      # key -- is written by bootstrap. Starting first would mean one failed tick and a wait.
      bootstrap:
        condition: service_completed_successfully
      # `service_started` and not a health condition: this retries on its own timer, so Node-RED
      # being slow costs one tick. Waiting for healthy would couple the two restart cycles.
      node-red:
        condition: service_started
    # Same override and the same reason as `bootstrap` above: a bare `command:` would be passed to
    # the base image's entrypoint as ARGUMENTS to Node-RED and would silently start a second one.
    entrypoint: ["node"]
    command: ["/bundle/flow-sync.mjs"]

  # ===============================================================================================
  # node_exporter -- host metrics for the machine this appliance runs on, scraped locally by the
  # Node-RED flow and published as Sparkplug metrics on the connection already open. Scraping from
  # the centre would need an inbound path through the plant firewall per gateway and service
  # discovery for dynamically enrolled gateways. node_exporter rather than a function node reading
  # /proc: a function node has no `fs`, and `windows_exporter` serves the same format. Not
  # published, read-only mounts, no capabilities. The heartbeat does not depend on it: the flow
  # caches the last poll.
  # ===============================================================================================
  node-exporter:
    container_name: acs-gateway-node-exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Container and pseudo filesystems excluded, so the one number that matters (free space on the
      # real volume) is not buried among overlay mounts. Same exclusions as the platform's exporter.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  # The appliance's state, and the thing to back up: the flow, the encrypted credentials, the CA
  # and settings.js. `docker compose down -v` destroys the enrolment with it, and the token is
  # already spent. The flow's copy lives in this gateway's own repository in the forge;
  # flows_cred.json is never committed, because it is encrypted with a secret in this .env.
  nodered_data:
