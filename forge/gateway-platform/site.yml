---
# The platform playbook. Run on the appliance against itself by aber-gateway-converge (ansible-pull),
# at the tag the gateway's own platform.yml names. Idempotent: every task states a state.
#
# Order matters once: `appliance` needs Docker, and `converge` installs the timer that will run
# this again, so a first run that fails before it leaves no timer behind to retry with. The
# installer retries the first run itself.
- name: Aber gateway appliance
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Where the appliance keeps everything the platform gave it. The compose project's volume is a
    # bind mount under here, so the host's converge script can reach what bootstrap.mjs wrote.
    aber_state_dir: /var/lib/aber-gateway
    aber_data_dir: /var/lib/aber-gateway/data
    aber_compose_dir: /opt/aber-gateway
    # What platform.yml may override, per gateway, through the reviewed lane.
    chrony_servers:
      - "pool ntp.ubuntu.com iburst maxsources 4"

  # Whether systemd is RUNNING here, not merely installed: `service_mgr` reports systemd once the
  # package is present, and in a container (where CI runs this twice) PID 1 is a shell, so every
  # service task would fail on the second run. Services and timers are managed only when it runs.
  pre_tasks:
    - name: What PID 1 is
      ansible.builtin.command: cat /proc/1/comm
      register: aber_init
      changed_when: false
    - name: Whether systemd is running
      ansible.builtin.set_fact:
        aber_systemd: "{{ ansible_facts['service_mgr'] == 'systemd' and (aber_init.stdout | trim) == 'systemd' }}"

  # Tagged by role so a run can skip one: CI runs this in a container with `--skip-tags docker`.
  roles:
    - { role: base, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: appliance, tags: [appliance] }
    - { role: converge, tags: [converge] }
