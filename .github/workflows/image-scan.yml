# =================================================================================================
# Container CVE scan -- the REACTIVE half of keeping this stack current.
#
# renovate.json is the proactive half: it asks "is there a newer version" on a schedule. This asks
# the different and more urgent question, "does the version we are running have a known, FIXED
# vulnerability" -- which is what turns an upgrade from housekeeping into work with a date on it.
#
# WHY IT IS NOT PART OF ci.yml. It pulls every third-party image in the stack, several of which are
# a gigabyte, so on a pull request it would add minutes to every push to answer a question that
# does not change between two commits an hour apart. CVEs are published on the world's schedule,
# not on this repository's.
#
# THE WORK IS scripts/scan-images.mjs (`npm run scan:images`), so a red run reproduces on a laptop.
# It reads the image list out of the rendered chart rather than a list written anywhere, which is
# the same rule every other guard in this repository follows: a hardcoded list is a second place
# for a version to live, and it would go stale silently -- scanning the images this stack USED to
# run and reporting green. Images built from this repository are excluded because release.yml
# scans each of them before it is pushed, against the same policy; check-docs-drift.mjs holds that
# exclusion to the release workflow, so this comment cannot outlive the step it points at.
#
# A finding with no fix this stack can take yet is accepted in scripts/lint/image-allowlist.json,
# grouped by image repository with a reason and an expiry date. An expired group fails the scan,
# so every acceptance is re-read on the first scan after its date.
# =================================================================================================
name: Container Image CVE Scan

on:
  schedule:
    # The first of the month, an hour after Renovate's routine window. Reading "this is out of
    # date" and "this has a known vulnerability" in one sitting is what makes the second one
    # actionable, so the two stay paired whatever the cadence.
    #
    # MONTHLY IS A WEAKER GUARANTEE THAN RENOVATE'S, and worth being honest about: a CVE published
    # on the 2nd is not noticed here until the 1st of the next month. Renovate's daily run covers
    # the dependencies it manages -- our own declared npm and pip packages -- but NOT a CVE inside
    # a third-party image, which is exactly what this job is for. `workflow_dispatch` is the
    # answer when something specific needs checking sooner.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Pinned Third-Party Images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # Fixable HIGH and CRITICAL only, every image in turn, and a summary table on the run page.
      # It fails on a finding outside the allow-list, on an expired group, and on an allow-list
      # entry that no longer matches anything.
      - name: Scan
        run: node scripts/scan-images.mjs --trivy-binary
