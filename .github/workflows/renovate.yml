# =================================================================================================
# Renovate, run from this repository rather than by the hosted app.
#
# WHY SELF-HOSTED. This repository is PRIVATE, and Mend's hosted Renovate app is free for public
# repositories. Running the CLI here needs no third-party access to the code and no plan; the cost
# is that this file exists and that the token below has to be provisioned by a person.
#
# IT DOES NOTHING UNTIL `RENOVATE_TOKEN` IS SET, and that is stated loudly rather than left to be
# discovered. A scheduled workflow that fails silently every Monday is worse than no workflow: the
# repository looks as though drift is being watched when it is not -- the same "green light over an
# unmeasured thing" failure the ServiceMonitor and CVE-scan guards are both written about. The
# first step therefore fails with an explanation rather than letting Renovate exit 0 having
# authenticated as nobody.
#
# THE TOKEN. A classic PAT with `repo` scope, or a fine-grained PAT with Contents: read/write,
# Pull requests: read/write and Issues: read/write on this repository (Issues is not optional --
# the dependency dashboard IS an issue, and it is the main deliverable). GITHUB_TOKEN cannot be
# used: pull requests it opens do not trigger workflow runs, so every Renovate PR would arrive
# with no CI result, which on this repository is most of what tells you whether a bump is safe.
#
# ALL BEHAVIOUR LIVES IN renovate.json, not here -- including the schedule. This workflow just
# runs Renovate; Renovate decides whether it is inside its configured window. Putting the cadence
# in the cron would mean two schedules to keep in step and one of them invisible to the config
# validator.
#
# DAILY, WHICH IS NOT THE CADENCE AND MUST NOT BE CONFUSED WITH IT. renovate.json opens routine
# pull requests monthly. This runs every day because RENOVATE CAN ONLY ACT WHILE IT IS RUNNING:
# `vulnerabilityAlerts` is configured to ignore the schedule and open a security fix immediately,
# and a monthly cron would quietly make that monthly too -- the setting would still read "at any
# time" and be worth nothing. Daily invocation is what makes the security carve-out real. Most
# days it finds it is outside the routine window and exits having done nothing, which is the
# intended and cheap case.
#
# THE GUARD BELOW CANNOT SEE THE FAILURE THAT ACTUALLY HAPPENED, and that is worth writing down
# rather than rediscovering. The RENOVATE_TOKEN check fires INSIDE the job. Since 2026-08-24 the job
# has not started at all -- every scheduled run completes in three to five seconds with zero steps,
# which is what an exhausted Actions allowance looks like. The last successful run was 2026-08-23,
# and the dependency dashboard (issue #53) has been frozen at that date ever since: it still lists
# `postgrest v12.2.0` and `kong 3.9.3`, one long since bumped and the other since retired.
#
# So this file's own warning came true by a route it could not check: "the repository looks as
# though drift is being watched when it is not". A workflow cannot detect that it was never
# invoked.
#
# RESOLVED 2026-09-01. Minutes returned, the scheduled run completed for the first time since
# 2026-08-23, and the dashboard refreshed itself -- issue #53 needed no intervention because it is
# this workflow's own output rather than a report somebody maintains.
#
# `scripts/check-image-currency.mjs` was the by-hand substitute and is deleted, on its own
# instruction: "THIS IS A STOPGAP AND SHOULD BE DELETED when Actions minutes return." It answered
# one question -- how far behind is each pinned image -- from a machine that could still reach the
# registry, and opened no pull requests because that is this workflow's job.
#
# THE ONE THING IT DID THAT RENOVATE DOES NOT is fail when a PINNED TAG NO LONGER EXISTS, which is
# a real problem rather than news about upstream shipping. That is not lost: the k8s-validation
# job pulls every image the chart pins on every run, so a vanished tag fails the build at the
# pull, earlier and louder than a script somebody has to remember to run.
#
# The outage is left recorded above rather than deleted with the script. A scheduled workflow that
# silently never starts is a failure mode this file's own warning did not cover, and the next
# person to read "drift is being watched" should know it has been wrong before.
# =================================================================================================
name: Renovate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options: [info, debug]
      dryRun:
        description: "Report what it would do, and change nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Scan For Dependency Drift
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require The Token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::error::RENOVATE_TOKEN is not set, so this workflow cannot do anything."
            echo "::error::Create a PAT with repo scope (or fine-grained: Contents, Pull requests"
            echo "::error::and Issues read/write) and add it as an Actions secret named"
            echo "::error::RENOVATE_TOKEN. Failing loudly on purpose -- a silent no-op here would"
            echo "::error::leave the repository looking as though drift is being watched."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v5

      # Pinned. An unpinned action deciding what to do about unpinned dependencies is a joke that
      # writes itself, and this one holds a token that can open pull requests.
      - name: Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
