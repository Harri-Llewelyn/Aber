# =================================================================================================
# Release: publish the eight images this repository builds, then the Helm chart, to GHCR over OCI.
#
# THE ORDER IS THE WHOLE DESIGN. The chart names those eight images at `Chart.AppVersion`, so a chart
# published before its images resolves to tags that do not exist yet -- and the failure is not a
# failed install. `helm install` SUCCEEDS, `--wait` blocks for its full timeout, and eight workloads
# sit in ImagePullBackOff while the databases, the broker and Kong all come up healthy. Someone
# reading `kubectl get pods` sees a stack that is two thirds up and no error naming the release.
# So: images first, chart last, and the chart job `needs` them.
#
# WHAT VERSION MEANS HERE. The `v*` tag is the single source. It stamps the image tags, the chart
# `version` and the chart `appVersion`, all in this one run -- Chart.yaml's committed values are
# only for the untagged path (a checkout, `helm lint`, `helm template`) and are deliberately not
# read when a tag is present. Nothing has to be bumped in a commit before tagging, which is the
# usual way a chart ends up published under a version that names a different build.
#
# WHY NOT `latest`. No floating tag is pushed for any image. The chart resolves an empty
# `image.tag` to appVersion precisely so a given chart release can only ever run the images built
# beside it; a `latest` sitting alongside would be an invitation to override that, and the symptom
# of doing so -- one component a release ahead of the schema its neighbours expect -- is the same
# asymmetric drift scripts/check-image-tag-parity.mjs exists to prevent.
#
# ARCHITECTURE: linux/amd64 ONLY. Not an oversight and worth knowing before an edge rollout: k3s on
# arm64 (a Pi, a Jetson, Graviton) cannot run these images. Cross-building them under QEMU is not a
# small change either -- the frontend runs a full Vite build and the ingestion image compiles
# sparkplug_b.proto with protoc, both of which are punishing emulated. An arm64 cluster should build
# locally with the commands in deploy/k8s/README.md, which work unchanged on a native arm64 host.
#
# CREDENTIALS: the built-in GITHUB_TOKEN, with `packages: write` requested below. No PAT, no
# repository secret. It can push to `ghcr.io/<this repo's owner>/...` and nowhere else, which is the
# right blast radius for a workflow that runs on a tag.
#
# FIRST PUBLISH IS PRIVATE. GHCR creates every new package private regardless of the repository's
# visibility, and GITHUB_TOKEN cannot change that -- it is an account-level setting. All eight
# packages need a one-time visibility flip; deploy/k8s/README.md carries the `gh` commands.
# =================================================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  # The rehearsal path. `dry_run: true` (the default) builds everything and pushes nothing, so the
  # whole pipeline -- including the checks below and the chart package -- can be exercised without
  # burning a version number or putting an artefact in front of anyone.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify but publish nothing'
        required: false
        default: true
        type: boolean

# Two releases in flight would race on the same package tags, and the loser wins -- OCI push does
# not refuse an overwrite. `cancel-in-progress: false` because a half-finished release that pushed
# images and not the chart is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Lowercased explicitly rather than interpolating github.repository_owner: this owner is
  # `Harri-Llewelyn` and OCI reference names are case-sensitive and must be lowercase, so the
  # interpolated form pushes fine and then produces a reference nothing can pull.
  IMAGE_NAMESPACE: ghcr.io/harri-llewelyn/acs-cymru
  CHART_REPO: oci://ghcr.io/harri-llewelyn/acs-cymru

jobs:
  # -----------------------------------------------------------------------------------------------
  # Resolve and validate the version once, so the image jobs and the chart job cannot disagree, and
  # run the static checks that a published artefact must not be able to violate.
  #
  # ci.yml triggers on BRANCHES, not tags, so nothing else in this pipeline runs for a `v*` push.
  # The checks repeated here are the ones whose failure would be baked into the artefact rather than
  # caught on the next commit -- above all the chart-files mirror: Helm cannot read outside its own
  # chart, so a stale copy of kong.yml or a migration ships a chart that provisions a DIFFERENT
  # database than this repository describes, and it surfaces at the first telemetry write. The full
  # E2E and in-cluster suites are not repeated; they ran on the commit this tag points at.
  # -----------------------------------------------------------------------------------------------
  prepare-release:
    name: Resolve Version & Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Resolve Version
        id: resolve
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION='${{ inputs.version }}'
            PUSH='${{ inputs.dry_run == false }}'
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH=true
          fi

          # SemVer, and strictly. Helm REQUIRES a SemVer chart version and rejects the package at
          # `helm package` time, but the images would already have been pushed by then -- so this
          # refuses before anything leaves the runner. The pattern allows a prerelease/build suffix
          # (`1.0.0-rc.1`) because Helm does.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'$VERSION' is not a SemVer version. Tag as v<major>.<minor>.<patch>."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH"       >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (push=$PUSH)"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Helm cannot read files outside its chart directory, so repository-owned configuration is
      # mirrored into deploy/helm/acs-cymru/files/ and committed. Publishing a chart whose mirror
      # is stale is the one failure here that survives the release and reaches a user's cluster.
      - name: Verify Chart Files Are In Sync With Their Sources
        run: node scripts/sync-helm-chart-files.mjs --check

      # Both targets must pin the same tag for every shared image, and -- since this workflow --
      # the eight built images must agree across values.yaml, ci.yml and this file. A release is
      # exactly when that last coupling matters: it is what decides whether the chart names images
      # this workflow actually pushed.
      - name: Verify Image Tag Parity Across Both Targets And The Release Surface
        run: node scripts/check-image-tag-parity.mjs --verbose

      - name: Verify Documentation Matches The Repository
        run: node scripts/check-docs-drift.mjs

  # -----------------------------------------------------------------------------------------------
  # The four INDEPENDENT images, in parallel.
  #
  # ingestion is deliberately not here even though it has no dependencies of its own: test-runner is
  # built FROM it, and the two have to share a runner. See build-ingestion-chain below.
  # -----------------------------------------------------------------------------------------------
  build-images:
    name: Image — ${{ matrix.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      # One image failing should not leave the others pushed and this job green-ish. The chart
      # job `needs` this one, so a failure anywhere stops the chart regardless -- but finishing the
      # siblings makes the log show whether the failure was specific or systemic.
      fail-fast: false
      matrix:
        include:
          # Context is the REPOSITORY ROOT: node_red_flow.json lives there and is not reachable
          # from a narrower context.
          - name: edge-runtime
            dockerfile: supabase/functions/Dockerfile
            context: .
            build_args: ''
          - name: node-red
            dockerfile: node-red/Dockerfile
            context: node-red
            build_args: ''
          # REPOSITORY ROOT: the i3X server compiles sparkplug_b.proto, which lives there. It is an
          # independent build despite sharing that need with ingestion -- see i3x/Dockerfile for
          # why a chained base would reintroduce the ordering problem build-ingestion-chain exists
          # to avoid.
          - name: i3x-service
            dockerfile: i3x/Dockerfile
            context: .
            build_args: ''
          # The broker credential-issuing sidecar. Its context is its own directory -- the service's
          # CODE is not baked in, the chart mounts it from a ConfigMap, so this image supplies only
          # the runtime. Built FROM eclipse-mosquitto because it must carry the broker's own
          # mosquitto_passwd: the `$7$` hash has to be readable by the mosquitto that will verify it,
          # and a reimplementation produces a password file that looks correct and refuses every
          # login with nothing logged at either end.
          - name: gateway-credential
            dockerfile: gateway-credential/Dockerfile
            context: gateway-credential
            build_args: ''
          # THE SCHEMA ITSELF: supabase/postgres with supabase/migrations/*.sql copied in. Context is
          # supabase/, which is where that directory lives.
          #
          # THIS IMAGE'S TAG IS THE DATABASE VERSION, which no other image here can claim. The chain
          # cannot travel in the chart -- a ConfigMap and Helm's release Secret are both capped at
          # 1 MiB and the release holds those bytes twice -- so the release order above matters more
          # for this one than for the rest: a chart published ahead of it names a db-init tag that
          # does not exist, and the stack comes up with no schema at all.
          - name: db-init
            dockerfile: supabase/db-init/Dockerfile
            context: supabase
            build_args: ''
          # VITE_RUNTIME_CONFIG=true bakes NOTHING, which is what lets one published image serve any
          # environment and read its configuration from the /config.js ConfigMap. A default build
          # would carry a baked Supabase URL that MASKS a missing ConfigMap instead of surfacing it
          # -- so a published default build would silently point every install at whatever URL this
          # runner happened to have.
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: VITE_RUNTIME_CONFIG=true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ needs.prepare-release.outputs.push == 'true' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ needs.prepare-release.outputs.version }}
          # `image.source` is what makes GHCR attach the package to this repository, which is both
          # how the package page gets a README and how the repository's own settings can govern it.
          # Without it the package is an orphan in the account's namespace with no link back.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # -----------------------------------------------------------------------------------------------
  # ingestion, then test-runner FROM it -- ONE JOB, ONE RUNNER, ONE LOCAL IMAGE STORE.
  #
  # test-runner is `FROM ${INGESTION_IMAGE}`, so its base has to be resolvable at build time. Split
  # across two jobs it is not, and the failure is a `403 Forbidden` pulling
  # ghcr.io/.../ingestion:<version> -- which reads as a permissions problem and is not one:
  #
  #   - on a DRY RUN nothing was pushed, so the base does not exist in the registry at all;
  #   - on a FIRST release the package exists but is PRIVATE (GHCR creates every new package
  #     private), so an unauthenticated pull is refused;
  #   - and on any release, a separate job means a separate runner, so a locally-built base is
  #     simply not there.
  #
  # NOTE THE TRAP THAT MADE THE FIRST ATTEMPT AT THIS WRONG. Building the base locally in the same
  # job is NOT sufficient on its own: `docker/setup-buildx-action` creates a `docker-container`
  # builder AND SELECTS IT, and that driver has its own image store. A plain `docker build -t ref .`
  # then writes to the daemon while the build that consumes it reads from the container -- so the
  # base is invisible and BuildKit falls back to a registry pull, producing the same 403 as if the
  # step had never run. That is why this job does not set up Buildx at all: with the default `docker`
  # driver both builds share the daemon's image store, which is the whole point.
  #
  # The cost is the GHA layer cache, which the container driver is what enables. Worth it here: this
  # runs on a tag, not on every push, and correctness is not negotiable against a few minutes.
  #
  # test-runner is published rather than left as a local build for the same reason it exists at all:
  # the conformance suites are the only thing that can say whether a deployed stack is correct, and a
  # suite that only runs where the repository is checked out cannot be pointed at the cluster it is
  # meant to judge. `e2e.enabled` is still false by default -- those Jobs seed and delete fixtures.
  # -----------------------------------------------------------------------------------------------
  build-ingestion-chain:
    name: Images — ingestion, test-runner
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Deliberately NO docker/setup-buildx-action -- see the header. Both builds must run on the
      # default `docker` driver so the second can see what the first produced.

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the REPOSITORY ROOT: the Dockerfile compiles sparkplug_b.proto with protoc and
      # the .proto lives there.
      - name: Build ingestion
        run: |
          set -eu
          docker build -f Dockerfile -t "$IMAGE_NAMESPACE/ingestion:$V" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$V" \
            --label "org.opencontainers.image.licenses=MIT" \
            .

      # The guard that turns a silent registry fallback into a legible failure. `docker build` pulls
      # a missing base by default, so without this a broken local store degrades into exactly the
      # 403 this job exists to avoid -- an error naming the registry rather than the build order.
      - name: Assert The Base Is Local Before Building On It
        run: |
          set -eu
          REF="$IMAGE_NAMESPACE/ingestion:$V"
          if ! docker image inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF is not in this runner's local image store."
            echo "::error::test-runner would fall back to pulling it from GHCR and fail with 403."
            echo "::error::Most likely cause: a Buildx builder was selected, so the build above"
            echo "::error::wrote to a container image store instead of the docker daemon."
            exit 1
          fi
          echo "  ok  $REF is local -- test-runner will build against it without a pull"

      # REPOSITORY ROOT again: test_aas_export.py resolves five files relative to parents[3], so the
      # suite needs the repo-shaped layout tests/Dockerfile builds. See its header.
      #
      # INGESTION_IMAGE is passed explicitly rather than relying on the Dockerfile's ARG default:
      # the base is the image built seconds ago at the version being released, which no committed
      # default can name.
      - name: Build test-runner From The Local ingestion
        run: |
          set -eu
          docker build -f tests/Dockerfile -t "$IMAGE_NAMESPACE/test-runner:$V" \
            --build-arg "INGESTION_IMAGE=$IMAGE_NAMESPACE/ingestion:$V" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$V" \
            --label "org.opencontainers.image.licenses=MIT" \
            .

      # Pushed only after BOTH have built. A pushed ingestion beside a test-runner that failed to
      # build would be a half-published release whose missing half is the thing that reports on it.
      - name: Push Both
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          docker push "$IMAGE_NAMESPACE/ingestion:$V"
          docker push "$IMAGE_NAMESPACE/test-runner:$V"

  # -----------------------------------------------------------------------------------------------
  # The chart, last, and only once every image it can name exists.
  # -----------------------------------------------------------------------------------------------
  publish-chart:
    name: Helm Chart
    needs: [prepare-release, build-images, build-ingestion-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Helm
        # Pinned to the version ci.yml lints and renders with, so the chart is packaged by the same
        # Helm that proved it renders. OCI support has been GA since 3.8.
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # A chart that does not render must not be packaged, let alone published. values-dev.yaml is
      # used because values.yaml alone has no credentials and acs-cymru.validateSecrets FAILS THE
      # RENDER without them -- deliberately, so the refusal is legible rather than a stack that
      # comes up and rejects every request.
      - name: Lint
        run: helm lint deploy/helm/acs-cymru -f deploy/helm/acs-cymru/values-dev.yaml

      - name: Render
        run: |
          helm template acs-cymru deploy/helm/acs-cymru \
            -f deploy/helm/acs-cymru/values-dev.yaml > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml

      # --version and --app-version stamp the package WITHOUT editing Chart.yaml, so the released
      # artefact carries the tag's version while the working tree stays as committed. Both are set
      # to the same string on purpose: appVersion is what the chart resolves every built image's tag
      # from, so chart 1.2.3 can only ever pull images 1.2.3.
      - name: Package
        id: package
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm package deploy/helm/acs-cymru \
            --version "$V" --app-version "$V" --destination /tmp/chart
          PKG="/tmp/chart/acs-cymru-$V.tgz"
          test -f "$PKG"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          ls -la /tmp/chart

      # The assertion that makes the whole coupling real rather than intended: render the PACKAGED
      # chart with no values at all and confirm every built image resolved to this version. An empty
      # `image.tag` that failed to pick up appVersion would otherwise render `repo:` -- a reference
      # Kubernetes reads as `repo:latest`, which for these five repositories does not exist and
      # would ship as five ImagePullBackOffs in an artefact that packaged cleanly.
      - name: Verify The Package Names This Version's Images
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm template acs-cymru '${{ steps.package.outputs.package }}' \
            -f deploy/helm/acs-cymru/values-dev.yaml \
            --set e2e.enabled=true > /tmp/from-package.yaml

          MISSING=0
          for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential db-init; do
            REF="$IMAGE_NAMESPACE/$img:$V"
            if grep -qF "$REF" /tmp/from-package.yaml; then
              echo "  ok  $REF"
            else
              echo "::error::packaged chart does not reference $REF"
              grep -oE "$IMAGE_NAMESPACE/$img:[^\"]*" /tmp/from-package.yaml | sort -u || true
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Push
        if: needs.prepare-release.outputs.push == 'true'
        run: helm push '${{ steps.package.outputs.package }}' "$CHART_REPO"

      # Pull it back. `helm push` reporting success proves the layers were accepted, not that the
      # chart is resolvable by version -- and "the tag is not where you expect" is the failure mode
      # of an OCI chart repository, because the chart NAME becomes the last path segment and it is
      # easy to push to a URL that already ends in it. Better to find that here than in the first
      # issue someone files.
      - name: Verify It Pulls Back
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          # `helm pull` does NOT create its --destination, though `helm package` does. It pulls
          # successfully, prints the digest, and then fails writing the file -- so the error names
          # a temporary path and looks like a pull failure rather than a missing directory.
          mkdir -p /tmp/pulled
          helm pull "$CHART_REPO/acs-cymru" --version "$V" --destination /tmp/pulled
          helm show chart "/tmp/pulled/acs-cymru-$V.tgz"

      - name: Summary
        run: |
          V='${{ needs.prepare-release.outputs.version }}'
          {
            if [ '${{ needs.prepare-release.outputs.push }}' != 'true' ]; then
              echo "### Dry run — nothing was published"
              echo
            fi
            echo "### acs-cymru $V"
            echo
            echo '```bash'
            echo "helm install acs-cymru $CHART_REPO/acs-cymru --version $V \\"
            echo "  --namespace acs-cymru --create-namespace \\"
            echo "  --values my-values.yaml"
            echo '```'
            echo
            echo "Images published at \`$V\`:"
            for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential db-init; do
              echo "- \`$IMAGE_NAMESPACE/$img:$V\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
