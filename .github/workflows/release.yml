# Release: publish the ten images this repository builds, then the Helm chart, to GHCR over OCI.
# Images first, chart last, and the chart job `needs` them: the chart names the images at
# `Chart.AppVersion`, and a chart published before its images installs successfully into ten
# ImagePullBackOffs. The `v*` tag is the single source of version: it stamps the image tags, the
# chart `version` and `appVersion` in this run, and Chart.yaml's committed values serve only the
# untagged path. No `latest` tag is pushed, so a chart release can only run the images built beside
# it. linux/amd64 only: an arm64 cluster should build locally with the commands in
# deploy/k8s/README.md. Credentials are the built-in GITHUB_TOKEN with `packages: write`. GHCR
# creates every new package private and GITHUB_TOKEN cannot change that; deploy/k8s/README.md
# carries the `gh` commands for the one-time visibility flip.
name: Release

on:
  push:
    tags:
      - 'v*'
  # The rehearsal path. `dry_run: true` (the default) builds everything and pushes nothing, so the
  # whole pipeline can be exercised without burning a version number.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify but publish nothing'
        required: false
        default: true
        type: boolean

# Two releases in flight would race on the same package tags, and OCI push does not refuse an
# overwrite. `cancel-in-progress: false` because a half-finished release that pushed images and not
# the chart is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Lowercased explicitly rather than interpolating github.repository_owner: OCI reference names are
  # case-sensitive and must be lowercase, and the interpolated form pushes fine and produces a
  # reference nothing can pull.
  IMAGE_NAMESPACE: ghcr.io/harri-llewelyn/aber
  CHART_REPO: oci://ghcr.io/harri-llewelyn/aber

jobs:
  # Resolve and validate the version once, so the image jobs and the chart job cannot disagree, and
  # run the static checks whose failure would be baked into the artefact. ci.yml triggers on
  # branches, not tags, so nothing else runs for a `v*` push. The full E2E and in-cluster suites are
  # not repeated; they ran on the commit this tag points at.
  prepare-release:
    name: Resolve Version & Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Resolve Version
        id: resolve
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION='${{ inputs.version }}'
            PUSH='${{ inputs.dry_run == false }}'
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH=true
          fi

          # SemVer, strictly: Helm rejects a non-SemVer chart version at `helm package` time, by
          # which point the images would already be pushed. The pattern allows a prerelease/build
          # suffix because Helm does.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'$VERSION' is not a SemVer version. Tag as v<major>.<minor>.<patch>."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH"       >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (push=$PUSH)"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Helm cannot read files outside its chart directory, so repository-owned configuration is
      # mirrored into deploy/helm/aber/files/. A chart whose mirror is stale is the one failure
      # here that reaches a user's cluster.
      - name: Verify Chart Files Are In Sync With Their Sources
        run: node scripts/sync-helm-chart-files.mjs --check

      - name: Verify Documentation Matches The Repository
        run: node scripts/check-docs-drift.mjs

  # The eight independent images, in parallel. ingestion is not here: test-runner is built FROM it,
  # and the two have to share a runner. See build-ingestion-chain below.
  build-images:
    name: Image — ${{ matrix.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      # One image failing should not leave the others unbuilt: the chart job `needs` this one, so a
      # failure anywhere stops the chart, and finishing the siblings shows whether the failure was
      # specific or systemic.
      fail-fast: false
      matrix:
        include:
          # Context is the REPOSITORY ROOT by convention, shared with the dev loop; the image
          # copies nothing outside supabase/functions/ any more.
          - name: edge-runtime
            dockerfile: supabase/functions/Dockerfile
            context: .
            build_args: ''
          - name: node-red
            dockerfile: node-red/Dockerfile
            context: node-red
            build_args: ''
          # Repository root: the i3X server compiles sparkplug_b.proto, which lives there. An
          # independent build despite sharing that need with ingestion; see i3x/Dockerfile.
          - name: i3x-service
            dockerfile: i3x/Dockerfile
            context: .
            build_args: ''
          # The broker credential-issuing sidecar. The service's code is mounted from a ConfigMap,
          # so this image supplies only the runtime. Built FROM eclipse-mosquitto because it must
          # carry the broker's own mosquitto_passwd: the `$7$` hash has to be produced by the
          # mosquitto that will verify it.
          - name: gateway-credential
            dockerfile: gateway-credential/Dockerfile
            context: gateway-credential
            build_args: ''
          # The backup service's runtime: supabase/postgres for a pg_dump at least the server's
          # version, plus node, sqlite3 and GNU tar. The service's code is mounted from a
          # ConfigMap, as the credential sidecar's is.
          - name: backup-service
            dockerfile: backup-service/Dockerfile
            context: backup-service
            build_args: ''
          # The schema itself: supabase/postgres with supabase/migrations/*.sql copied in. This
          # image's tag is the database version, and the chain cannot travel in the chart (a
          # ConfigMap and Helm's release Secret are both capped at 1 MiB), so a chart published
          # ahead of it comes up with no schema at all.
          - name: db-init
            dockerfile: supabase/db-init/Dockerfile
            context: supabase
            build_args: ''
          # Swagger UI with docs/openapi.yaml and docs/i3x-openapi.yaml copied in. Repository root,
          # because both specs live there; .dockerignore negates each by name. The specs travel in
          # the image for the same reason the migrations do -- Helm's release Secret holds a
          # ConfigMap's bytes twice and is capped at 1 MiB.
          - name: swagger-ui
            dockerfile: swagger-ui/Dockerfile
            context: .
            build_args: ''
          # VITE_RUNTIME_CONFIG=true bakes nothing about the environment, so one published image
          # serves any environment from the /config.js ConfigMap; a default build would carry a
          # baked Supabase URL that masks a missing ConfigMap. VITE_APP_VERSION is the one baked
          # value: it identifies the artefact itself, and is the one value a ConfigMap must not be
          # able to change. See frontend/src/version.js.
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: |
              VITE_RUNTIME_CONFIG=true
              VITE_APP_VERSION=${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ needs.prepare-release.outputs.push == 'true' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ needs.prepare-release.outputs.version }}
          # `image.source` is what makes GHCR attach the package to this repository, so the package
          # page gets a README and the repository's settings govern it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ingestion, then test-runner FROM it: one job, one runner, one local image store. test-runner is
  # `FROM ${INGESTION_IMAGE}`, so its base must be resolvable at build time; split across two jobs
  # it is not, and the failure is a `403 Forbidden` pulling the base (nothing pushed on a dry run, a
  # private package on a first release, a separate runner otherwise). This job does not set up
  # Buildx: `docker/setup-buildx-action` selects a `docker-container` builder with its own image
  # store, which makes a locally built base invisible to the build that consumes it and produces the
  # same 403. The cost is the GHA layer cache, which is acceptable on a tag. test-runner is
  # published so the conformance suites can be pointed at the cluster they judge; `e2e.enabled` is
  # still false by default.
  build-ingestion-chain:
    name: Images — ingestion, test-runner
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Deliberately NO docker/setup-buildx-action -- see the header. Both builds must run on the
      # default `docker` driver so the second can see what the first produced.

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the REPOSITORY ROOT: ingestion/Dockerfile compiles sparkplug_b.proto with protoc
      # and the .proto lives there.
      - name: Build ingestion
        run: |
          set -eu
          docker build -f ingestion/Dockerfile -t "$IMAGE_NAMESPACE/ingestion:$V" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$V" \
            --label "org.opencontainers.image.licenses=MIT" \
            .

      # The guard that turns a silent registry fallback into a legible failure: `docker build` pulls
      # a missing base by default, so without this a broken local store degrades into the 403 this
      # job exists to avoid.
      - name: Assert The Base Is Local Before Building On It
        run: |
          set -eu
          REF="$IMAGE_NAMESPACE/ingestion:$V"
          if ! docker image inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF is not in this runner's local image store."
            echo "::error::test-runner would fall back to pulling it from GHCR and fail with 403."
            echo "::error::Most likely cause: a Buildx builder was selected, so the build above"
            echo "::error::wrote to a container image store instead of the docker daemon."
            exit 1
          fi
          echo "  ok  $REF is local -- test-runner will build against it without a pull"

      # Repository root again: test_aas_export.py resolves five files relative to parents[3].
      # INGESTION_IMAGE is passed explicitly because the base is the image built seconds ago at the
      # version being released, which no committed default can name.
      - name: Build test-runner From The Local ingestion
        run: |
          set -eu
          docker build -f test-harness/Dockerfile -t "$IMAGE_NAMESPACE/test-runner:$V" \
            --build-arg "INGESTION_IMAGE=$IMAGE_NAMESPACE/ingestion:$V" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$V" \
            --label "org.opencontainers.image.licenses=MIT" \
            .

      # Pushed only after BOTH have built. A pushed ingestion beside a test-runner that failed to
      # build would be a half-published release whose missing half is the thing that reports on it.
      - name: Push Both
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          docker push "$IMAGE_NAMESPACE/ingestion:$V"
          docker push "$IMAGE_NAMESPACE/test-runner:$V"

  # The chart, last, and only once every image it can name exists.
  publish-chart:
    name: Helm Chart
    needs: [prepare-release, build-images, build-ingestion-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Helm
        # Pinned to the version ci.yml lints and renders with, so the chart is packaged by the same
        # Helm that proved it renders. OCI support has been GA since 3.8.
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # A chart that does not render must not be packaged. values-dev.yaml is used because
      # values.yaml alone has no credentials and aber.validateSecrets fails the render without
      # them.
      - name: Lint
        run: helm lint deploy/helm/aber -f deploy/helm/aber/values-dev.yaml

      - name: Render
        run: |
          helm template aber deploy/helm/aber \
            -f deploy/helm/aber/values-dev.yaml > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml

      # --version and --app-version stamp the package without editing Chart.yaml. Both are set to
      # the same string: appVersion is what the chart resolves every built image's tag from, so
      # chart 1.2.3 can only pull images 1.2.3.
      - name: Package
        id: package
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm package deploy/helm/aber \
            --version "$V" --app-version "$V" --destination /tmp/chart
          PKG="/tmp/chart/aber-$V.tgz"
          test -f "$PKG"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          ls -la /tmp/chart

      # Render the packaged chart with no values and confirm every built image resolved to this
      # version. An empty `image.tag` that failed to pick up appVersion would render `repo:`, which
      # Kubernetes reads as `repo:latest`, and ship as ImagePullBackOffs in an artefact that
      # packaged cleanly.
      - name: Verify The Package Names This Version's Images
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm template aber '${{ steps.package.outputs.package }}' \
            -f deploy/helm/aber/values-dev.yaml \
            --set e2e.enabled=true > /tmp/from-package.yaml

          MISSING=0
          for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential backup-service db-init swagger-ui; do
            REF="$IMAGE_NAMESPACE/$img:$V"
            if grep -qF "$REF" /tmp/from-package.yaml; then
              echo "  ok  $REF"
            else
              echo "::error::packaged chart does not reference $REF"
              grep -oE "$IMAGE_NAMESPACE/$img:[^\"]*" /tmp/from-package.yaml | sort -u || true
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Push
        if: needs.prepare-release.outputs.push == 'true'
        run: helm push '${{ steps.package.outputs.package }}' "$CHART_REPO"

      # Pull it back. `helm push` reporting success proves the layers were accepted, not that the
      # chart is resolvable by version: the chart name becomes the last path segment, and it is easy
      # to push to a URL that already ends in it.
      - name: Verify It Pulls Back
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          # `helm pull` does not create its --destination, though `helm package` does; the error
          # names a temporary path and looks like a pull failure.
          mkdir -p /tmp/pulled
          helm pull "$CHART_REPO/aber" --version "$V" --destination /tmp/pulled
          helm show chart "/tmp/pulled/aber-$V.tgz"

      - name: Summary
        run: |
          V='${{ needs.prepare-release.outputs.version }}'
          {
            if [ '${{ needs.prepare-release.outputs.push }}' != 'true' ]; then
              echo "### Dry run — nothing was published"
              echo
            fi
            echo "### aber $V"
            echo
            echo '```bash'
            echo "helm install aber $CHART_REPO/aber --version $V \\"
            echo "  --namespace aber --create-namespace \\"
            echo "  --values my-values.yaml"
            echo '```'
            echo
            echo "Images published at \`$V\`:"
            for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential backup-service db-init swagger-ui; do
              echo "- \`$IMAGE_NAMESPACE/$img:$V\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
