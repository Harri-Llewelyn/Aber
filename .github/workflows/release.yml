# Release: publish the eleven images this repository builds, then the Helm chart, to GHCR over OCI.
# Images first, chart last, and the chart job `needs` them: the chart names the images at
# `Chart.AppVersion`, and a chart published before its images installs successfully into eleven
# ImagePullBackOffs. The `v*` tag is the single source of version: it stamps the image tags, the
# chart `version` and `appVersion` in this run, and Chart.yaml's committed values serve only the
# untagged path. No `latest` tag is pushed, so a chart release can only run the images built beside
# it. linux/amd64 only: an arm64 cluster should build locally with the commands in
# deploy/k8s/README.md. Credentials are the built-in GITHUB_TOKEN with `packages: write`. GHCR
# links each package to this repository, and a package takes the repository's visibility.
#
# Every image is published with an SPDX SBOM and SLSA provenance in its index, and every image and
# the chart is signed with cosign, keyless: the signature is bound to this workflow's OIDC identity
# (`id-token: write`), so there is no key to hold or leak, and a consumer verifies against the
# identity `<repo>/.github/workflows/release.yml@refs/tags/v<version>`. The signing certificate is
# recorded in Sigstore's public transparency log, which names this repository and this file.
# SECURITY.md says what a consumer can check; .github/scripts/sign-and-verify.sh runs those same
# checks here, so a release cannot report green with an artefact nothing signed or an image nothing
# attested. Every image is scanned before it is pushed, on the policy image-scan.yml applies to the
# third-party ones. The SBOMs are also attached to the GitHub Release as files, for the site that
# asks for one without a registry client.
name: Release

on:
  push:
    tags:
      - 'v*'
  # The rehearsal path. `dry_run: true` (the default) builds everything and pushes nothing, so the
  # whole pipeline can be exercised without burning a version number.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.0.2)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify but publish nothing'
        required: false
        default: true
        type: boolean

# Two releases in flight would race on the same package tags, and OCI push does not refuse an
# overwrite. `cancel-in-progress: false` because a half-finished release that pushed images and not
# the chart is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless signing: cosign exchanges this run's OIDC token for a short-lived certificate.
  id-token: write

env:
  REGISTRY: ghcr.io
  # Lowercased explicitly rather than interpolating github.repository_owner: OCI reference names are
  # case-sensitive and must be lowercase, and the interpolated form pushes fine and produces a
  # reference nothing can pull.
  IMAGE_NAMESPACE: ghcr.io/harri-llewelyn/aber
  CHART_REPO: oci://ghcr.io/harri-llewelyn/aber

jobs:
  # Resolve and validate the version once, so the image jobs and the chart job cannot disagree, and
  # run the static checks whose failure would be baked into the artefact. ci.yml triggers on
  # branches, not tags, so nothing else runs for a `v*` push. The full E2E and in-cluster suites are
  # not repeated; they ran on the commit this tag points at.
  prepare-release:
    name: Resolve Version & Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve Version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ "$INPUT_DRY_RUN" = "false" ]; then PUSH=true; else PUSH=false; fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH=true
          fi

          # SemVer, strictly: Helm rejects a non-SemVer chart version at `helm package` time, by
          # which point the images would already be pushed. The pattern allows a prerelease/build
          # suffix because Helm does.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'$VERSION' is not a SemVer version. Tag as v<major>.<minor>.<patch>."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH"       >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (push=$PUSH)"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      # Helm cannot read files outside its chart directory, so repository-owned configuration is
      # mirrored into deploy/helm/aber/files/. A chart whose mirror is stale is the one failure
      # here that reaches a user's cluster.
      - name: Verify Chart Files Are In Sync With Their Sources
        run: node scripts/sync-helm-chart-files.mjs --check

      - name: Verify Documentation Matches The Repository
        run: node scripts/check-docs-drift.mjs

  # The nine independent images, in parallel. ingestion is not here: test-runner is built FROM it,
  # and the two are one Bake build. See build-ingestion-chain below.
  build-images:
    name: Image — ${{ matrix.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      # One image failing should not leave the others unbuilt: the chart job `needs` this one, so a
      # failure anywhere stops the chart, and finishing the siblings shows whether the failure was
      # specific or systemic.
      fail-fast: false
      matrix:
        include:
          # Context is the REPOSITORY ROOT by convention, shared with the dev loop; the image
          # copies nothing outside supabase/functions/ any more.
          - name: edge-runtime
            dockerfile: supabase/functions/Dockerfile
            context: .
            build_args: ''
          - name: node-red
            dockerfile: node-red/Dockerfile
            context: node-red
            build_args: ''
          # Repository root: the i3X server compiles sparkplug_b.proto, which lives there. An
          # independent build despite sharing that need with ingestion; see i3x/Dockerfile.
          - name: i3x-service
            dockerfile: i3x/Dockerfile
            context: .
            build_args: ''
          # The broker credential-issuing sidecar. The service's code is mounted from a ConfigMap,
          # so this image supplies only the runtime. Built FROM eclipse-mosquitto because it must
          # carry the broker's own mosquitto_passwd: the `$7$` hash has to be produced by the
          # mosquitto that will verify it.
          - name: gateway-credential
            dockerfile: gateway-credential/Dockerfile
            context: gateway-credential
            build_args: ''
          # The backup service's runtime: supabase/postgres for a pg_dump at least the server's
          # version, plus node, sqlite3 and GNU tar. The service's code is mounted from a
          # ConfigMap, as the credential sidecar's is.
          - name: backup-service
            dockerfile: backup-service/Dockerfile
            context: backup-service
            build_args: ''
          # The historian: timescale/timescaledb with pgBackRest, which physical backup runs inside
          # the server's own container.
          - name: timescaledb
            dockerfile: timescaledb/Dockerfile
            context: timescaledb
            build_args: ''
          # The schema itself: supabase/postgres with supabase/migrations/*.sql copied in. This
          # image's tag is the database version, and the chain cannot travel in the chart (a
          # ConfigMap and Helm's release Secret are both capped at 1 MiB), so a chart published
          # ahead of it comes up with no schema at all.
          - name: db-init
            dockerfile: supabase/db-init/Dockerfile
            context: supabase
            build_args: ''
          # Swagger UI with docs/openapi.yaml and docs/i3x-openapi.yaml copied in. Repository root,
          # because both specs live there; .dockerignore negates each by name. The specs travel in
          # the image for the same reason the migrations do -- Helm's release Secret holds a
          # ConfigMap's bytes twice and is capped at 1 MiB.
          - name: swagger-ui
            dockerfile: swagger-ui/Dockerfile
            context: .
            build_args: ''
          # VITE_RUNTIME_CONFIG=true bakes nothing about the environment, so one published image
          # serves any environment from the /config.js ConfigMap; a default build would carry a
          # baked Supabase URL that masks a missing ConfigMap. VITE_APP_VERSION is the one baked
          # value: it identifies the artefact itself, and is the one value a ConfigMap must not be
          # able to change. See frontend/src/version.js.
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: |
              VITE_RUNTIME_CONFIG=true
              VITE_APP_VERSION=${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to a commit, as #421 will pin the rest: this one holds the signing identity.
      - name: Install cosign
        if: needs.prepare-release.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Built to an OCI archive and scanned before anything is pushed. Build & Push repeats these
      # inputs and resolves every layer from this builder's cache, so nothing is built twice. No
      # layer cache from earlier runs: a cached `apk upgrade` or `apt-get upgrade` layer would ship
      # the packages of the day it was cached, and this build must take what the distribution
      # ships today.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          outputs: type=oci,dest=/tmp/oci/${{ matrix.name }}.tar

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # image-scan.yml's policy: fixable HIGH and CRITICAL only, so a release is never blocked by a
      # finding it cannot act on. Trivy reads an OCI layout directory, not the archive.
      - name: Scan
        env:
          IMAGE: ${{ matrix.name }}
        run: |
          set -eu
          mkdir -p "/tmp/oci/$IMAGE"
          tar -xf "/tmp/oci/$IMAGE.tar" -C "/tmp/oci/$IMAGE"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --scanners vuln --input "/tmp/oci/$IMAGE"

      - name: Build & Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ needs.prepare-release.outputs.push == 'true' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ needs.prepare-release.outputs.version }}
          # `image.source` is what makes GHCR attach the package to this repository, so the package
          # page gets a README and the repository's settings govern it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.licenses=MIT
          # An SPDX SBOM of the final filesystem (Syft, run by BuildKit) and SLSA provenance naming
          # the source, the Dockerfile, every build argument and every base image by digest, both
          # attached to the image index. `mode=max` because `min` omits the materials, which is
          # the half that answers "was this built from what it says". The index gains an
          # `unknown/unknown` entry on the GHCR package page: that is the attestation manifest.
          # docker-bake.hcl declares the same two for the ingestion chain.
          sbom: true
          provenance: mode=max

      # Sign by digest, verify the signature as a consumer would, and refuse an image whose SBOM or
      # provenance did not arrive. Nothing to sign on a dry run: nothing was pushed.
      - name: Sign & Verify
        if: needs.prepare-release.outputs.push == 'true'
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          IMAGE: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: .github/scripts/sign-and-verify.sh "$IMAGE_NAMESPACE/$IMAGE@$DIGEST"

  # ingestion, then test-runner FROM it, as one `docker buildx bake` of docker-bake.hcl. test-runner
  # is `FROM ${INGESTION_IMAGE}`, and its base is the ingestion image built seconds earlier at the
  # version being released, which no registry holds yet (nothing pushed on a dry run, a private
  # package on a first release); Bake's `target:` context hands the first build's result to the
  # second inside BuildKit, so both run on the `docker-container` driver that the attestations
  # need. Two bake runs rather than one `--push`: the first writes both images to OCI archives so
  # their attestations can be checked and both scanned before anything is published -- and on a dry
  # run at all --
  # and the second publishes from the cache the first filled. A pushed ingestion beside a
  # test-runner that failed to build would be a half-published release whose missing half is the
  # thing that reports on it. No layer cache from earlier runs, as above. test-runner is
  # published so the conformance suites can be pointed at the cluster they judge; `e2e.enabled` is
  # still false by default.
  build-ingestion-chain:
    name: Images — ingestion, test-runner
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      # docker-bake.hcl reads these.
      VERSION: ${{ needs.prepare-release.outputs.version }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      REVISION: ${{ github.sha }}
      BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: needs.prepare-release.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `--allow=fs.write`: Bake refuses to write outside the working directory without it, and
      # the archives must not land inside the build context.
      - name: Build Both
        run: |
          set -eu
          mkdir -p /tmp/oci
          docker buildx bake -f docker-bake.hcl ingestion-chain --allow=fs.write=/tmp/oci \
            --set 'ingestion.output=type=oci,dest=/tmp/oci/ingestion.tar' \
            --set 'test-runner.output=type=oci,dest=/tmp/oci/test-runner.tar'

      # The guard that turns a silent omission into a legible failure: attestations are a build
      # option, and a build that cannot produce them succeeds without them. The archive's top-level
      # index points at the image index; the attestation manifests are its entries annotated
      # `vnd.docker.reference.type`. Expected: 1, holding both the SBOM and the provenance.
      - name: Assert Both Carry Attestations
        run: |
          set -eu
          for t in ingestion test-runner; do
            TAR="/tmp/oci/$t.tar"
            IDX=$(tar -xOf "$TAR" index.json | jq -r '.manifests[0].digest')
            N=$(tar -xOf "$TAR" "blobs/sha256/${IDX#sha256:}" \
              | jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length')
            if [ "$N" -lt 1 ]; then
              echo "::error::$t was built without an attestation manifest: no SBOM, no provenance."
              exit 1
            fi
            echo "  ok  $t carries $N attestation manifest(s)"
          done

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # Both archives, on image-scan.yml's policy, before either is pushed. A finding in the
      # ingestion base is reported twice; skipping test-runner would leave its own layers unscanned.
      - name: Scan Both
        run: |
          # Each command's failure is caught with `||` (the runner's bash has -e): a finding in one
          # must not hide the other's result.
          set -uo pipefail
          FAILED=0
          for t in ingestion test-runner; do
            echo "::group::$t"
            mkdir -p "/tmp/oci/$t"
            tar -xf "/tmp/oci/$t.tar" -C "/tmp/oci/$t" || FAILED=1
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --no-progress --scanners vuln --input "/tmp/oci/$t" || FAILED=1
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::A fixable HIGH or CRITICAL was found, or an archive could not be read. Nothing has been pushed."
            exit 1
          fi

      # Pushed only after BOTH have built and passed the scan. The metadata file names what was
      # pushed, by digest, for the signing step; `image.name` is the tagged reference and the tag is
      # dropped in favour of the digest.
      - name: Push Both
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          docker buildx bake -f docker-bake.hcl ingestion-chain --push --metadata-file /tmp/bake-metadata.json
          jq -r 'to_entries[] | .value as $v
                 | ($v["image.name"] | split(",")[0] | split(":")[:-1] | join(":")) + "@" + $v["containerimage.digest"]' \
            /tmp/bake-metadata.json > /tmp/pushed.txt
          test "$(wc -l < /tmp/pushed.txt)" -eq 2
          cat /tmp/pushed.txt

      - name: Sign & Verify
        if: needs.prepare-release.outputs.push == 'true'
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: xargs .github/scripts/sign-and-verify.sh < /tmp/pushed.txt

  # The chart, last, and only once every image it can name exists.
  publish-chart:
    name: Helm Chart
    needs: [prepare-release, build-images, build-ingestion-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Helm
        # Pinned to the version ci.yml lints and renders with, so the chart is packaged by the same
        # Helm that proved it renders. OCI support has been GA since 3.8.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      # A chart that does not render must not be packaged. values-dev.yaml is used because
      # values.yaml alone has no credentials and aber.validateSecrets fails the render without
      # them.
      - name: Lint
        run: helm lint deploy/helm/aber -f deploy/helm/aber/values-dev.yaml

      - name: Render
        run: |
          helm template aber deploy/helm/aber \
            -f deploy/helm/aber/values-dev.yaml > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml

      # --version and --app-version stamp the package without editing Chart.yaml. Both are set to
      # the same string: appVersion is what the chart resolves every built image's tag from, so
      # chart 1.2.3 can only pull images 1.2.3.
      - name: Package
        id: package
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm package deploy/helm/aber \
            --version "$V" --app-version "$V" --destination /tmp/chart
          PKG="/tmp/chart/aber-$V.tgz"
          test -f "$PKG"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          ls -la /tmp/chart

      # Render the packaged chart and confirm every built image resolved to this version. An empty
      # `image.tag` that failed to pick up appVersion would render `repo:`, which Kubernetes reads as
      # `repo:latest`, and ship as ImagePullBackOffs in an artefact that packaged cleanly. The
      # optional workloads are switched on, as image-scan.yml does, or their images never render.
      - name: Verify The Package Names This Version's Images
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          helm template aber '${{ steps.package.outputs.package }}' \
            -f deploy/helm/aber/values-dev.yaml \
            --set backup.enabled=true --set backupService.enabled=true --set playback.enabled=true \
            --set e2e.enabled=true > /tmp/from-package.yaml

          MISSING=0
          for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential backup-service timescaledb db-init swagger-ui; do
            REF="$IMAGE_NAMESPACE/$img:$V"
            if grep -qF "$REF" /tmp/from-package.yaml; then
              echo "  ok  $REF"
            else
              echo "::error::packaged chart does not reference $REF"
              grep -oE "$IMAGE_NAMESPACE/$img:[^\"]*" /tmp/from-package.yaml | sort -u || true
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Log In To GHCR
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      # A second login, for cosign: `helm registry login` writes Helm's own credential file, which
      # cosign does not read.
      - name: Log In To GHCR For cosign
        if: needs.prepare-release.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: needs.prepare-release.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `helm push` prints the digest it pushed; that, never the tag, is what gets signed. Helm 3
      # prints it on stderr, so both streams go to the log the digest is read from.
      - name: Push
        id: push
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -euo pipefail
          helm push '${{ steps.package.outputs.package }}' "$CHART_REPO" 2>&1 | tee /tmp/helm-push.log
          DIGEST=$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64}).*$/\1/p' /tmp/helm-push.log)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The chart is an OCI artefact like the images and is signed the same way; it carries no
      # SBOM or provenance, so only the signature is checked.
      - name: Sign & Verify
        if: needs.prepare-release.outputs.push == 'true'
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          CHECK_ATTESTATIONS: 'false'
          DIGEST: ${{ steps.push.outputs.digest }}
        run: .github/scripts/sign-and-verify.sh "$IMAGE_NAMESPACE/aber@$DIGEST"

      # Pull it back. `helm push` reporting success proves the layers were accepted, not that the
      # chart is resolvable by version: the chart name becomes the last path segment, and it is easy
      # to push to a URL that already ends in it.
      - name: Verify It Pulls Back
        if: needs.prepare-release.outputs.push == 'true'
        run: |
          set -eu
          V='${{ needs.prepare-release.outputs.version }}'
          # `helm pull` does not create its --destination, though `helm package` does; the error
          # names a temporary path and looks like a pull failure.
          mkdir -p /tmp/pulled
          helm pull "$CHART_REPO/aber" --version "$V" --destination /tmp/pulled
          helm show chart "/tmp/pulled/aber-$V.tgz"

      - name: Summary
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          V='${{ needs.prepare-release.outputs.version }}'
          {
            if [ '${{ needs.prepare-release.outputs.push }}' != 'true' ]; then
              echo "### Dry run — nothing was published"
              echo
            fi
            echo "### aber $V"
            echo
            echo '```bash'
            echo "cosign verify $IMAGE_NAMESPACE/aber:$V \\"
            echo "  --certificate-identity $EXPECTED_IDENTITY \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo
            echo "helm install aber $CHART_REPO/aber --version $V \\"
            echo "  --namespace aber --create-namespace \\"
            echo "  --values my-values.yaml"
            echo '```'
            echo
            echo "Images published at \`$V\`, each signed with the same identity and carrying an SBOM and provenance:"
            for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential backup-service timescaledb db-init swagger-ui; do
              echo "- \`$IMAGE_NAMESPACE/$img:$V\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The SBOMs as files on the GitHub Release, for the site that asks for one without a registry
  # client. Read back from the registry rather than kept from the build, so they are what was
  # published; the registry copy stays the authoritative one, because the image signature covers
  # it and nothing signs a release asset. The release is opened as a DRAFT from
  # .github/RELEASE_TEMPLATE.md when nothing has opened it yet -- the notes are still written by
  # hand (docs/releases.md) -- and reused when the maintainer got there first. Tags only: a
  # `workflow_dispatch` publish has no tag to hang a release on, and its SBOMs are in the registry.
  attach-sboms:
    name: SBOMs On The GitHub Release
    needs: [prepare-release, build-images, build-ingestion-chain, publish-chart]
    if: needs.prepare-release.outputs.push == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      V: ${{ needs.prepare-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The packages are private until the one-time visibility flip.
      - name: Log In To GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One SPDX document per image, plus one per build stage a Dockerfile opted into the scan
      # (the frontend's node_modules), plus the provenance, plus the digests the signatures are
      # over. An image with no SBOM fails here too, though Sign & Verify has already refused it.
      - name: Read The SBOMs Back Out Of The Registry
        run: |
          set -eu
          OUT="/tmp/aber-$V-sbom"
          mkdir -p "$OUT"
          for img in edge-runtime ingestion node-red frontend test-runner i3x-service gateway-credential backup-service timescaledb db-init swagger-ui; do
            REF="$IMAGE_NAMESPACE/$img:$V"
            docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}' > /tmp/sbom.json
            jq -e '.SPDX' /tmp/sbom.json > "$OUT/$img-$V.spdx.json"
            jq -c '.AdditionalSPDXs[]?' /tmp/sbom.json | nl -ba -w1 | while IFS=$'\t' read -r n doc; do
              printf '%s\n' "$doc" | jq . > "$OUT/$img-$V.build-stage-$n.spdx.json"
            done
            docker buildx imagetools inspect "$REF" --format '{{json .Provenance.SLSA}}' \
              | jq -e . > "$OUT/$img-$V.provenance.json"
            echo "$REF@$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')" >> "$OUT/DIGESTS"
            echo "  ok  $img"
          done
          echo "$IMAGE_NAMESPACE/aber:$V@$(docker buildx imagetools inspect "$IMAGE_NAMESPACE/aber:$V" --format '{{.Manifest.Digest}}')" >> "$OUT/DIGESTS"
          tar -czf "/tmp/aber-$V-sbom.tar.gz" -C /tmp "aber-$V-sbom"
          ls -la "$OUT"

      - name: Attach To The GitHub Release
        run: |
          set -eu
          TAG="v$V"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file .github/RELEASE_TEMPLATE.md
            echo "Opened $TAG as a draft; fill in the notes and publish it."
          fi
          gh release upload "$TAG" "/tmp/aber-$V-sbom.tar.gz" --clobber
          echo "  ok  aber-$V-sbom.tar.gz attached to $TAG"
