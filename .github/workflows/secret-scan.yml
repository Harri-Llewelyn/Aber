# =================================================================================================
# gitleaks over every ref a visitor can fetch: every branch, every tag and every pull request head.
#
# ci.yml's Secret Scan reads only the history of the commit it tests, so a pull request fails on
# what it would add to main and never on another open branch's reviewed finding. This scan watches
# the rest. It reads main's .gitleaksignore joined with each branch's own, so a finding reviewed on
# any branch passes, and one that no list accepts fails here, wherever it was pushed. A pull request
# head's own list is never read: an unmerged or fork pull request could accept its own finding.
# A failure files no issue, because a public issue would announce the leak.
#
# THE WORK IS scripts/scan-secrets.mjs --ignore-union, so a red run reproduces on a laptop
# (docs/testing.md, The secret scans).
# =================================================================================================
name: Secret Scan Of Every Ref

on:
  push:
    branches: [ main ]
  schedule:
    # Daily, so a branch pushed while main stands still is read within a day.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-every-ref:
    name: Scan Every Branch, Tag And Pull Request Head
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Every branch and tag, with their full history.
          fetch-depth: 0

      # A pull request's head stays fetchable after its branch is deleted.
      - name: Fetch Every Pull Request Head
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan Every Ref Against What Any Ref Accepts
        run: npm run scan:secrets -- --ignore-union
