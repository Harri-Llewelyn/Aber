name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Verify isUuid Regex Implementation Sync
        run: |
          FE_REGEX=$(grep -E 'const UUID_REGEX' frontend/src/utils/isUuid.js | tr -d '[:space:]')
          DENO_REGEX=$(grep -E 'const UUID_REGEX' supabase/functions/approve-quarantine/isUuid.ts | tr -d '[:space:]')
          if [ "$FE_REGEX" != "$DENO_REGEX" ]; then
            echo "::error::isUuid UUID_REGEX definitions have drifted between frontend and Deno edge function!"
            exit 1
          fi
          echo "isUuid UUID_REGEX definitions are byte-identical across frontend and Deno edge function."

      # vite.config.js fails fast if these are unset. Docker passes them as build
      # args; a bare `npm run build` in CI has to supply them explicitly. These are
      # the local-dev demo values from .env.example and are baked into a throwaway
      # bundle that is never deployed.
      - name: Build Production Bundle
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiZXhwIjoyMDAwMDAwMDAwfQ.Z7KTfqo7mvr4j40uB-6K4f_VVT-d-ISkJ7E5VJ41jt0
        run: |
          cd frontend
          npm run build

  edge-function-auth-test:
    name: Edge Function & RLS Authorization Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      # GoTrue is not running in this job, so the auth helpers the migrations rely on
      # are either missing or stale in the base supabase/postgres image:
      #   * auth.jwt()  does not exist at all -> 4 of 9 migrations fail to apply.
      #   * auth.uid()  ships a legacy definition reading the singular GUC
      #                 'request.jwt.claim.sub', while the RLS tests set the modern
      #                 'request.jwt.claims' JSON -> auth.uid() returns NULL and every
      #                 policy denies, silently failing the tests.
      # These are the definitions GoTrue installs in a real deployment.
      - name: Bootstrap Supabase Auth Helper Functions
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres -d postgres -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$
              SELECT coalesce(
                nullif(current_setting('request.jwt.claim.sub', true), ''),
                (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
              )::uuid
            \$\$;
            CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS \$\$
              SELECT coalesce(
                nullif(current_setting('request.jwt.claim', true), ''),
                nullif(current_setting('request.jwt.claims', true), '')
              )::jsonb
            \$\$;"

      # NOTE: single-dollar "$f", not the doubled form. Doubling is docker-compose
      # escaping; in a shell "$$" is the PID, so every migration was previously fed a
      # filename like "2932f" and was silently never applied.
      #
      # seed.sql is deliberately NOT applied here: the tests seed their own fixtures,
      # and the base image's legacy auth.users lacks email_confirmed_at, is_sso_user,
      # phone_change and other columns the seed writes.
      - name: Apply Supabase Database Migrations
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres -d postgres \
            -c "ALTER ROLE postgres SET search_path TO auth, public, extensions;"
          for f in supabase/migrations/*.sql; do
            echo "Applying $f...";
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres -d postgres -f "$f";
          done

      - name: Run Edge Function Auth & RLS Policy Unit Tests
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_PORT: '54322'
          SUPABASE_DB_PASSWORD: postgres
        run: |
          python supabase/functions/approve-quarantine/test_approve_quarantine.py
          python supabase/functions/deploy-nodered/test_deploy_nodered.py
          python supabase/migrations/test_user_roles_rls.py

  e2e-validation:
    name: End-to-End Unified Stack Ingestion Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Sparkplug B Protobuf Module
        run: |
          protoc --python_out=. sparkplug_b.proto
          cp sparkplug_b_pb2.py ingestion/

      - name: Prepare Environment File
        run: |
          cp .env.example .env

      - name: Launch Unified Docker Compose Stack
        run: |
          docker compose up -d

      - name: Wait for Services Health
        run: |
          echo "Polling Docker Compose service health..."
          timeout 90s bash -c '
            until docker compose exec -T timescaledb pg_isready -U postgres >/dev/null 2>&1 && \
                  docker compose exec -T supabase-db pg_isready -U postgres >/dev/null 2>&1 && \
                  docker compose exec -T mosquitto mosquitto_sub -u factoryplus -P factoryplus123 -t "\$SYS/broker/version" -C 1 >/dev/null 2>&1; do
              echo "Waiting for TimescaleDB, Supabase DB, and Mosquitto to become ready..."
              sleep 2
            done
          '
          echo "All core services report healthy!"

      # validate.py reads config via os.getenv, and Python does not load .env by
      # itself. Without sourcing it, SUPABASE_SERVICE_ROLE_KEY is empty, the Supabase
      # client fails to initialise ("supabase_key is required"), the registered test
      # device is never seeded, and its telemetry is correctly dropped as unregistered -
      # failing check 3 while check 4 passes vacuously.
      #
      # But .env describes the *inside* of the compose network, and this script runs on
      # the runner host. DB_HOST=timescaledb / MQTT_HOST=mosquitto are Docker service
      # names that only resolve between containers, so sourcing them wholesale made
      # every connection die with "Temporary failure in name resolution". Take the
      # credentials from .env, then point the topology at the published ports.
      - name: Run End-to-End Validation Script
        run: |
          set -a && . ./.env && set +a
          export DB_HOST=localhost
          export DB_PORT=5433          # timescaledb  5433:5432
          export MQTT_HOST=localhost
          export MQTT_PORT=1883        # mosquitto    1883:1883
          export SUPABASE_URL=http://127.0.0.1:54321  # supabase-kong 54321:8000
          python ingestion/validate.py
