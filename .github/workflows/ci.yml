name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Verify isUuid Regex Implementation Sync
        run: |
          FE_REGEX=$(grep -E 'const UUID_REGEX' frontend/src/utils/isUuid.js | tr -d '[:space:]')
          DENO_REGEX=$(grep -E 'const UUID_REGEX' supabase/functions/approve-quarantine/isUuid.ts | tr -d '[:space:]')
          if [ "$FE_REGEX" != "$DENO_REGEX" ]; then
            echo "::error::isUuid UUID_REGEX definitions have drifted between frontend and Deno edge function!"
            exit 1
          fi
          echo "isUuid UUID_REGEX definitions are byte-identical across frontend and Deno edge function."

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  edge-function-auth-test:
    name: Edge Function & RLS Authorization Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Apply Supabase Database Migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -c "ALTER ROLE postgres SET search_path TO auth, public, extensions;"
          for f in supabase/migrations/*.sql; do
            echo "Applying $$f...";
            PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f "$$f";
          done;
          if [ -f supabase/seed.sql ]; then
            echo "Applying seed.sql...";
            PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f supabase/seed.sql;
          fi;

      - name: Run Edge Function Auth & RLS Policy Unit Tests
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_PORT: '54322'
          SUPABASE_DB_PASSWORD: postgres
        run: |
          python supabase/functions/approve-quarantine/test_approve_quarantine.py
          python supabase/functions/deploy-nodered/test_deploy_nodered.py
          python supabase/migrations/test_user_roles_rls.py

  e2e-validation:
    name: End-to-End Unified Stack Ingestion Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate Sparkplug B Protobuf Module
        run: |
          protoc --python_out=. sparkplug_b.proto
          cp sparkplug_b_pb2.py ingestion/

      - name: Prepare Environment File
        run: |
          cp .env.example .env

      - name: Launch Unified Docker Compose Stack
        run: |
          docker compose up -d

      - name: Wait for Services Health
        run: |
          echo "Polling Docker Compose service health..."
          timeout 90s bash -c '
            until docker compose exec -T timescaledb pg_isready -U postgres >/dev/null 2>&1 && \
                  docker compose exec -T supabase-db pg_isready -U postgres >/dev/null 2>&1 && \
                  docker compose exec -T mosquitto mosquitto_sub -u factoryplus -P factoryplus123 -t "\$SYS/broker/version" -C 1 >/dev/null 2>&1; do
              echo "Waiting for TimescaleDB, Supabase DB, and Mosquitto to become ready..."
              sleep 2
            done
          '
          echo "All core services report healthy!"

      - name: Run End-to-End Validation Script
        run: |
          python ingestion/validate.py
