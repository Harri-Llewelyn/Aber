name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  edge-function-auth-test:
    name: Edge Function Fail-Closed Authorization Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Edge Function Auth Unit Tests
        run: |
          python supabase/functions/approve-quarantine/test_approve_quarantine.py

  e2e-validation:
    name: End-to-End Supabase & TimescaleDB Ingestion Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Start Docker Compose Services
        run: |
          docker compose up -d

      - name: Wait for Services Health
        run: |
          sleep 15

      - name: Run End-to-End Validation Script
        run: |
          python ingestion/validate.py
