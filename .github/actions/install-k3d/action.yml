name: Install k3d
description: >-
  Install a pinned k3d release binary, verify it against its published checksum, raise the
  runner's inotify limits to what a node running the stack needs, and unload the runner's
  `mosquitto` AppArmor profile, which would otherwise confine the broker inside k3d's pods.
runs:
  using: composite
  steps:
    - name: Install k3d
      shell: bash
      env:
        K3D_VERSION: v5.7.4
        # From checksums.txt on the release. Bumping K3D_VERSION means refreshing this by hand;
        # Renovate has no manager for it, and that is the point of the pin.
        K3D_SHA256: 1ac1da365236736a8df8c32107b54aca208384ab1d9a06771443c85ad698a5eb
      run: |
        set -euo pipefail
        curl -sfL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
        echo "$K3D_SHA256  /tmp/k3d" | sha256sum -c -
        sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
        k3d version

    # k3s in a container cannot confine its pods, so a host profile attaches to a pod's program by
    # path: Ubuntu 26.04's `mosquitto` profile refuses the broker /mosquitto/config. A site's k3s
    # confines every pod itself. docs/testing.md, "AppArmor on the runner", has the measurement.
    # The runner image puts these floors in /etc/sysctl.conf; this applies them whatever its boot
    # did, and prints what was in force. Below them the kubelet cannot follow every container's log
    # for the collector and injects "failed to create fsnotify watcher" into the stream
    # (docs/install.md step 2).
    - name: Raise The Runner's inotify Limits
      shell: bash
      run: |
        set -euo pipefail
        echo "before: max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances) max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
        sudo sysctl -q -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360
        echo "after:  max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances) max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"

    - name: Unload The Runner's Mosquitto AppArmor Profile
      shell: bash
      run: |
        set -euo pipefail
        if sudo grep -q '^mosquitto ' /sys/kernel/security/apparmor/profiles 2>/dev/null; then
          echo -n mosquitto | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null
          echo "unloaded the runner's mosquitto AppArmor profile"
        else
          echo "this runner has no mosquitto AppArmor profile loaded"
        fi
