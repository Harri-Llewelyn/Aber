# The disk every k3d job reclaims before it creates its cluster: ci.yml's three and the restore
# rehearsal's. One action, so the four delete the same folders.
#
# The runner's free space varies with its image, down to ~14 GB; there the built images, their
# copies in the k3d node's containerd and the pulled images do not fit. Below ~3.8 GB the kubelet evicts, and the cascade ends as
# `context deadline exceeded` on `helm install`, or as ImagePullBackOff for an imported image the
# kubelet's image GC deleted. Removing unused toolchains frees ~22 GB.
#
# It runs only on a runner short of disk. A k3d job used at most 26.2 GiB (2026-10-29, the most of
# the four reported by report-disk-low-water), so with NEED_GIB free (about twice that) it skips:
# every runner since 2026-10-26 started with ~82 GiB, and the deletes took 1 to 2 minutes.
#
# It also starts a sampler that keeps the least free space the job reaches; report-disk-low-water,
# the job's last step before its teardown, prints it.
name: Reclaim Runner Disk
description: >-
  On a runner with less than NEED_GIB free, delete its unused toolchains and prune Docker's images,
  printing the free space before and after; then keep the job's least free space for
  report-disk-low-water.
runs:
  using: composite
  steps:
    - name: Reclaim Runner Disk
      shell: bash
      run: |
        set -euo pipefail
        NEED_GIB=50
        echo "--- before"
        df -h / | tail -1
        free_gib=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
        if [ "$free_gib" -ge "$NEED_GIB" ]; then
          echo "${free_gib} GiB free, and a k3d job needs at most about half of ${NEED_GIB}: nothing to reclaim."
          exit 0
        fi
        # One after another: run side by side they were slower, as the deletes share one disk.
        # The runner image changes between releases, so a delete never fails the step.
        sudo rm -rf /usr/local/lib/android      || true   # ~9 GB
        sudo rm -rf /usr/share/dotnet           || true   # ~2 GB
        sudo rm -rf /opt/ghc                    || true   # ~1 GB
        sudo rm -rf /usr/local/.ghcup           || true   # ~2 GB
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true   # ~6 GB
        sudo rm -rf /usr/local/share/powershell || true   # ~1 GB
        sudo rm -rf /usr/share/swift            || true   # ~1 GB
        docker image prune -af || true
        echo "--- after"
        df -h / | tail -1

    - name: Keep The Least Free Space
      shell: bash
      run: |
        # MiB free on /, every 10 s, the minimum kept in a file; it runs until the job ends.
        avail() { df -B1M --output=avail / | tail -1 | tr -d ' '; }
        avail > "$RUNNER_TEMP/disk-free-at-start"
        cp "$RUNNER_TEMP/disk-free-at-start" "$RUNNER_TEMP/disk-free-least"
        nohup bash -c '
          least="$1"
          while sleep 10; do
            now=$(df -B1M --output=avail / | tail -1 | tr -d " ")
            [ "$now" -lt "$(cat "$least")" ] && echo "$now" > "$least"
          done' _ "$RUNNER_TEMP/disk-free-least" > /dev/null 2>&1 &
