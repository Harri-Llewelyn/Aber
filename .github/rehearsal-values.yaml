# What the restore rehearsal installs, and what it switches off.
#
# LAYERED OVER values-dev.yaml, NOT INSTEAD OF IT. The credentials, the resource sizes and the dev
# domain all come from that file; this one adds the backup service and subtracts the rest. Kept
# separate so the rehearsal's trimming does not leak into the fixture the k8s-validation job
# installs with.
#
# THE RULE FOR WHAT MAY BE OFF: a component may be disabled here only if it holds no state that a
# tier 1 backup carries. That is the whole test. Anything the RESTORE ITSELF depends on stays on,
# even when it holds no state of its own; supabase-realtime is the example that matters: nothing
# in this repository creates `supabase_realtime_admin`, the Realtime container does on first
# start, and restore-databases.sh refuses without it.
#
# Off also means unbuilt: the rehearsal builds db-init, backup-service and gateway-credential and
# nothing else, which is what keeps it inside a runtime that lets it stay enabled.

# --- The backup service takes the rehearsal's backup ---------------------------------------------
# The Backups page's path, with every component the service can carry. The format is the chart's
# default (custom, .dump), so the rehearsal restores what a default install writes.
backup:
  enabled: true
  includeStorage: true
  includeForge: true
  includeBroker: true
backupService:
  enabled: true

# --- The state the backup carries, beyond the two databases --------------------------------------
# Storage (every bucket's objects), the forge (every gateway's repository and the SSH host keys) and
# the broker (the Dynamic Security document: every issued gateway account) are on by default and
# stay on. The broker's credential sidecar is not needed to seed or read the document.
gatewayCredential:
  enabled: false

# --- The application layer: no tier 1 state of its own -------------------------------------------
frontend:
  enabled: false
nodeRed:
  # Node-RED has a PVC, and it is deliberately out of scope: its flows are configuration deployed
  # by the chart, and the forge holds every gateway's flow.
  enabled: false
i3xService:
  enabled: false
grafana:
  # Grafana's PVC holds no authored state: every dashboard and rule is provisioned by the chart.
  enabled: false
supabaseStudio:
  enabled: false
supabaseMeta:
  enabled: false
swaggerUi:
  enabled: false
observability:
  # Prometheus, Loki and Alloy: thirty days of metrics and logs, not a database of record, and
  # not in tier 1 (supabase/README.md, "The log store is deliberately not in tier 1").
  enabled: false
databaseMetrics:
  enabled: false

# --- The data-plane workloads: they WRITE state, they do not HOLD it ------------------------------
ingestion:
  # The daemon's output is rows in the two databases, which the rehearsal seeds directly. A live
  # writer racing the backup would be a moving target for a job that asserts a count did not move.
  enabled: false
playback:
  enabled: false
coldArchive:
  # A CronJob on the ingestion image, which the rehearsal does not build.
  enabled: false
supabaseFunctions:
  # The edge runtime serves functions; it stores nothing. `supabase_functions_admin`, which the
  # restore preflight requires, comes from `CREATE EXTENSION pg_net` in 0001, not from here.
  enabled: false
e2e:
  enabled: false

# --- The historian on its upstream image ---------------------------------------------------------
# The rehearsal restores the historian from the service's pg_dump, so it needs no pgBackRest and
# does not build the chart's historian image; this is the image that one is built FROM.
timescaledb:
  image:
    repository: timescale/timescaledb
    tag: 2.29.2-pg17
